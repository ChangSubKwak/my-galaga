      if (game.enemyMorale === 'ROUTED') {
        ctx.shadowColor = ms.col;
        ctx.shadowBlur = 4;
      }
      // Tier arrow — ▲ enemy advantage / - balanced / ▼ player advantage / ▽ rout
      const _arrow = game.enemyMorale === 'CONFIDENT' ? '▲'
                   : game.enemyMorale === 'SHAKEN'    ? '▼'
                   : game.enemyMorale === 'ROUTED'    ? '▽'
                                                       : '-';
      drawRetroText(_arrow + ' MORALE: ' + ms.label, 4, BASE_H - 44, 4, ms.col, 'left');
      ctx.restore();
    }
  }
  // PILOT MOMENTUM chip — player composure, stacked just above the enemy MORALE
  // chip to form a paired faction-vs-pilot readout. Only shown when non-STEADY
  // so typical play keeps a clean HUD. Mirrors the STAGE_INTRO pilot chip.
  if (!minimalHud && typeof computePilotMomentum === 'function' && typeof PILOT_MOMENTUM !== 'undefined'
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING
          || game.state === STATE.BOSS_STAGE)) {
    const _pmHs = computePilotMomentum();
    if (_pmHs && _pmHs !== 'STEADY' && PILOT_MOMENTUM[_pmHs]) {
      const _pmH = PILOT_MOMENTUM[_pmHs];
      ctx.save();
      ctx.globalAlpha = 0.85;
      if (_pmHs === 'CORNERED') {
        ctx.shadowColor = _pmH.col;
        ctx.shadowBlur = 4;
      }
      drawRetroText('PILOT: ' + _pmH.label, 4, BASE_H - 50, 4, _pmH.col, 'left');
      ctx.restore();
    }
  }

  // Run timer (mm:ss) — color shifts after 5/15 min
  const totalSec = Math.floor((game.runFrames || 0) / 60);
  const mm = String(Math.floor(totalSec / 60)).padStart(2, '0');
  const ss = String(totalSec % 60).padStart(2, '0');
  // TIMER COLOR 6-tier escalation matching ENDURANCE_TIERS:
  // 0-3min gray / 3-5min #cef (still flying) / 5-10min cyan (veteran) /
  // 10-15min gold (decorated) / 15-20min magenta (legend) /
  // 20-30min red (immortal) / 30+ rainbow (beyond time).
  let tCol;
  if (totalSec >= 1800) {
    const _rbT = ['#f44', '#fc4', '#ff4', '#0f8', '#0cf', '#a8f'];
    tCol = _rbT[Math.floor(game.animFrame / 6) % _rbT.length];
  } else if (totalSec >= 1200) tCol = '#f44';
  else if (totalSec >= 900)    tCol = '#f6f';
  else if (totalSec >= 600)    tCol = '#fc4';
  else if (totalSec >= 300)    tCol = '#0cf';
  else if (totalSec >= 180)    tCol = '#cef';
  else                          tCol = COL.gray;
  drawRetroText(mm + ':' + ss, BASE_W - 5, 16, 6, tCol, 'right');
  // STAGE PB GHOST — show personal best for current stage during play, color-tinted
  // by current pace. Gold if ahead of PB, gray if behind. Only when PB exists.
  if (typeof stagePBs !== 'undefined' && stagePBs
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING)) {
    const _pbF = stagePBs[String(game.stage)];
    if (typeof _pbF === 'number' && _pbF > 0) {
      const _pbSec = Math.floor(_pbF / 60);
      const _pbMm = Math.floor(_pbSec / 60);
      const _pbSs = String(_pbSec % 60).padStart(2, '0');
      const _stageSec = Math.floor((game.stageFrames || 0) / 60);
      const _pbDelta = (game.stageFrames || 0) - _pbF;
      // Ahead of PB (current < PB): gold. Behind (current > PB): gray. Neutral early.
      let _pbCol = '#888';
      if (_stageSec > 2) {
        _pbCol = _pbDelta < 0 ? '#fc4' : _pbDelta < 60 ? '#cf8' : '#888';
      }
      drawRetroText('PB ' + _pbMm + ':' + _pbSs, BASE_W - 5, 23, 4, _pbCol, 'right');
    }
  }

  // Top HUD separator (subtle dashed line)
  ctx.fillStyle = 'rgba(0,170,255,0.25)';
  for (let i = 0; i < BASE_W; i += 6) ctx.fillRect(i, 23, 3, 1);

  // Stage progression bar — rolls over every 30 stages so high-stage players still see progress.
  {
    const PROG_MAX = 30;
    const cycle = Math.floor((game.stage - 1) / PROG_MAX);   // 0,1,2... shown as label
    const localStage = ((game.stage - 1) % PROG_MAX) + 1;     // 1..30 within current cycle
    const px0 = 4, px1 = BASE_W - 4;
    const ratio = Math.min(1, (localStage - 1) / (PROG_MAX - 1));
    const fillEnd = px0 + Math.round((px1 - px0) * ratio);
    // Track + tick marks every 5 stages
    ctx.fillStyle = '#022';
    ctx.fillRect(px0, 25, px1 - px0, 1);
    ctx.fillStyle = '#444';
    for (let s = 5; s <= 25; s += 5) {
      const tx = px0 + Math.round((px1 - px0) * (s - 1) / (PROG_MAX - 1));
      ctx.fillRect(tx, 24, 1, 3);
    }
    // Fill — color tier matches absolute stage range
    const tier = Math.floor((game.stage - 1) / 4);
    const tierCol = ['#0ff', '#0cf', '#0af', '#08f', '#06f', '#04f', '#02c', '#019'][Math.min(7, tier)] || '#0ff';
    ctx.fillStyle = tierCol;
    ctx.fillRect(px0, 25, fillEnd - px0, 1);
    // Milestone notches: 5/10/20/30 in cycle 0; in higher cycles, mark every 10
    const notches = cycle === 0 ? [5, 10, 20, 30] : [10, 20, 30];
    for (const ms of notches) {
      const mx = px0 + Math.round((px1 - px0) * (ms - 1) / (PROG_MAX - 1));
      ctx.fillStyle = ms <= localStage ? '#fc4' : '#666';
      ctx.fillRect(mx, 24, 1, 3);
    }
    // Current position indicator (small triangle blip)
    ctx.fillStyle = '#fff';
    ctx.fillRect(fillEnd - 1, 24, 3, 1);
    ctx.fillRect(fillEnd, 26, 1, 1);
    // Cycle indicator past 30 (e.g. "x2" beneath the bar at left)
    if (cycle > 0) {
      drawRetroText('x' + (cycle + 1), 4, 22, 5, COL.yellow, 'left');
    }
  }

  // Bottom HUD separator
  ctx.fillStyle = 'rgba(0,170,255,0.25)';
  for (let i = 0; i < BASE_W; i += 6) ctx.fillRect(i, BASE_H - 16, 3, 1);

  // Extra-life threshold indicator — small note showing distance to next 30K extra life
  if (!game.challengeMode && game.score > 0 && (game.state === STATE.PLAYING || game.state === STATE.BOSS_STAGE || game.state === STATE.CHALLENGING)) {
    const next = Math.ceil(game.score / 30000) * 30000;
    const diff = next - game.score;
    if (diff < 5000) {
      drawRetroText('+1UP IN ' + diff, BASE_W/2, 35, 5, COL.green);
    }
  }
  // Lives — pulse red and add LAST LIFE warning when down to one
  const dangerLives = game.lives === 1;
  // LIFE GAIN PULSE — when lives++ just fired, overlay gold flash on row.
  const _lifePulse = (game.lifeGainPulseTimer || 0) > 0;
  const _lifePulseCol = (game.animFrame >> 1) % 2 === 0 ? '#fc4' : '#fff';
  const lifeCol = dangerLives
    ? ((game.animFrame >> 3) % 2 === 0 ? COL.red : '#fa8')
    : (_lifePulse ? _lifePulseCol : ((game.ship && game.ship.color) || '#0cf'));
  for (let i = 0; i < Math.min(game.lives, 5); i++) {
    drawPlayer(15 + i * 16, BASE_H - 8, lifeCol);
  }
  // Ring glow under newly-gained life ship (the rightmost ship in row)
  if (_lifePulse) {
    const _rightI = Math.min(game.lives, 5) - 1;
    if (_rightI >= 0) {
      const _rx = 15 + _rightI * 16, _ry = BASE_H - 8;
      ctx.save();
      ctx.globalAlpha = (game.lifeGainPulseTimer / 30) * 0.7;
      ctx.strokeStyle = '#fc4';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(_rx, _ry, 10 + (30 - game.lifeGainPulseTimer) * 0.3, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }
  if (game.lives > 5) {
    drawRetroText('+' + (game.lives - 5), 15 + 5 * 16, BASE_H - 8, 6, COL.white, 'left');
  }
  // DUAL FIGHTER badge — right after the lives row, indicates active dual-fighter mode
  let badgeX = 15 + Math.min(game.lives, 5) * 16 + 4;
  if (game.lives > 5) badgeX += 16; // make room for the +N overflow label
  if (game.dualFighter) {
    const blink = (game.animFrame >> 2) % 2 === 0 ? COL.yellow : '#fc4';
    drawRetroText('DUAL', badgeX, BASE_H - 8, 6, blink, 'left');
    badgeX += 24;
  }
  // SHIELD stack indicator — small green chevron icons, one per charge.
  // Without this, the only feedback for shield count was the orbital ring around the ship,
  // which is hard to read while dodging.
  if ((game.shieldCharges || 0) > 0) {
    const sy = BASE_H - 11;
    // SHIELD MAX glow — when fully stacked, chevrons get a green shadow so
    // the cap reads as a peak threshold reward (matches HIGH SCORE / ACC /
    // COMBO MAX / PARRY ULTRA peak-threshold GLOW pattern).
    const _shMax = game.shieldCharges >= SHIELD_MAX;
    ctx.save();
    if (_shMax) {
      ctx.shadowColor = '#4f8';
      ctx.shadowBlur = 3;
    }
    for (let s = 0; s < game.shieldCharges; s++) {
      const sx = badgeX + s * 6;
      ctx.fillStyle = '#4f8';
      ctx.fillRect(sx,     sy + 1, 4, 1);   // top bracket
      ctx.fillRect(sx,     sy + 2, 1, 4);   // left side
      ctx.fillRect(sx + 3, sy + 2, 1, 4);   // right side
      ctx.fillStyle = '#cfe';
      ctx.fillRect(sx + 1, sy + 5, 2, 1);   // chevron
    }
    ctx.restore();
  }
  if (dangerLives && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    if ((game.animFrame >> 3) % 2 === 0) {
      drawRetroText('LAST LIFE', BASE_W/2, BASE_H - 22, 6, COL.red);
    }
    // Audio cue every 240 frames (existing)
    if (game.animFrame % 240 === 0) playSound('lowLife');
    // HEARTBEAT — additional low-thump sfx every 96 frames (1.6s) for visceral urgency
    if (game.animFrame % 96 === 0) playSound('heartbeat');
    // Screen edge red pulse — synced with heartbeat (peaks at the start of each cycle)
    const beatPhase = (game.animFrame % 96) / 96;
    const beatPulse = Math.max(0, 1 - beatPhase * 3.5); // sharp peak at phase 0, fade by 0.3
    if (beatPulse > 0) {
      ctx.save();
      ctx.globalAlpha = 0.18 * beatPulse;
      ctx.fillStyle = '#f22';
      ctx.fillRect(0, 0, BASE_W, 4);
      ctx.fillRect(0, BASE_H - 4, BASE_W, 4);
      ctx.fillRect(0, 0, 4, BASE_H);
      ctx.fillRect(BASE_W - 4, 0, 4, BASE_H);
      ctx.restore();
    }
  }

  // HUD STAGE SCORE EARNED — '+N' label below main score showing what was
  // gained THIS stage. Helps player gauge per-stage performance. Hidden when
  // minimal HUD or stage just started (delta 0).
  if (!minimalHud
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    const _stgScore = (game.score || 0) - (game.stageScoreStart || 0);
    if (_stgScore >= 100) {
      drawRetroText('+' + fmtScore(_stgScore), 50, 25, 4, '#888', 'right');
    }
  }
  // HIGH SCORE PROGRESS BAR — 1px bar at upper-center showing fraction of
  // current score toward the live high threshold. Hidden under minimal HUD
  // or when no high score is set yet.
  if (!minimalHud
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)
      && (game.liveHighThreshold || 0) > 0) {
    const _hsRatio = Math.min(1, (game.score || 0) / game.liveHighThreshold);
    const _hsBarX = 12, _hsBarY = 21, _hsBarW = 36;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(_hsBarX, _hsBarY, _hsBarW, 1);
    ctx.fillStyle = _hsRatio >= 1 ? '#fc4' : _hsRatio >= 0.9 ? '#ff4' : _hsRatio >= 0.5 ? '#0ff' : '#0f8';
    ctx.globalAlpha = 0.8;
    ctx.fillRect(_hsBarX, _hsBarY, Math.round(_hsBarW * _hsRatio), 1);
    ctx.restore();
  }
  // HUD PICKUP STREAK — small "P×N" cyan counter when consecutive no-death
  // pickups reach 2+. Hides on death (streak resets). Visible in normal HUD only.
  if (!minimalHud && (game.pickupStreak || 0) >= 2
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    const psStr = 'P×' + game.pickupStreak;
    const psCol = game.pickupStreak >= 10 ? '#fc4' : '#0ff';
    drawRetroText(psStr, BASE_W - 5, 38, 4, psCol, 'right');
  }
  // HUD STAGE PICKUP COUNTER — stage-level pickup count for thrifty awareness
  if (!minimalHud && (game.stagePowerUpsPicked || 0) >= 1
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    drawRetroText('S:' + game.stagePowerUpsPicked, BASE_W - 5, 46, 4, '#fc8', 'right');
  }
  // ENEMY BULLET COUNT — 'B N' when bullet density is meaningful (>=10).
  if (!minimalHud
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)
      && (game.enemyBullets || []).length >= 10) {
    const _bN = game.enemyBullets.length;
    const _bCol = _bN >= 40 ? '#f44' : _bN >= 25 ? '#f88' : '#fa8';
    drawRetroText('B ' + _bN, BASE_W - 5, 60, 4, _bCol, 'right');
  }

  // PICKUP HISTORY TICKER — last 5 drop types as small colored letter chips at
  // top-right (under S:N stage counter). Newest at right, oldest at left. Fades
  // older entries (alpha drop). Surfaces only mid-stage when there's data.
  if (!minimalHud && game.pickupHistory && game.pickupHistory.length > 0
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    const _pColors = { S:'#f44', N:'#0ff', P:'#f6f', T:'#8ff', R:'#fc4',
                       W:'#6cf', H:'#0f8', L:'#f6c', B:'#fff', E:'#0f8' };
    const _phHist = game.pickupHistory;
    const _phY = 54;
    for (let i = 0; i < _phHist.length; i++) {
      const tp = _phHist[i];
      const col = _pColors[tp] || '#aaa';
      ctx.save();
      ctx.globalAlpha = Math.max(0.3, 1 - i * 0.18);
      drawRetroText(tp, BASE_W - 5 - i * 6, _phY, 4, col, 'right');
      ctx.restore();
    }
  }

  // POWER UP PITY INDICATOR — small 15-dot row near top-left showing pity progress
  // (kills without a drop). Filled dots = kills accumulated; empty = headroom.
  // Drops invisibly when 0 — only surfaces when there's something to communicate.
  if (!minimalHud && (game.killsSincePowerUp || 0) >= 4
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    const pityCount = Math.min(15, game.killsSincePowerUp || 0);
    const py = BASE_H - 30;
    ctx.save();
    const dotsX = BASE_W - 5 - 15 * 3;
    for (let i = 0; i < 15; i++) {
      const filled = i < pityCount;
      ctx.globalAlpha = filled ? 0.85 : 0.20;
      ctx.fillStyle = pityCount >= 12 ? '#fc4' : '#0f8';
      ctx.fillRect(dotsX + i * 3, py, 2, 2);
    }
    ctx.restore();
  }

  // POWER-UP TIMER STRIP — compact 5-slot horizontal indicator showing remaining
  // time on each active temporary weapon timer. Pip + 1px progress bar per slot,
  // color-coded. Drawn right above lives row when at least one timer is active.
  // Pure read of existing rapidTimer/waveTimer/homingTimer/laserTimer/slowTimer.
  {
    const slots = [
      { t: game.rapidTimer  || 0, max: RAPID_DURATION,  label: 'R', col: '#fc4' },
      { t: game.waveTimer   || 0, max: WAVE_DURATION,   label: 'W', col: '#6cf' },
      { t: game.homingTimer || 0, max: HOMING_DURATION, label: 'H', col: '#0f8' },
      { t: game.laserTimer  || 0, max: LASER_DURATION,  label: 'L', col: '#f6c' },
      { t: game.slowTimer   || 0, max: SLOW_DURATION,   label: 'T', col: '#8ff' }
    ];
    const active = slots.filter(s => s.t > 0);
    if (active.length > 0) {
      const stripY = BASE_H - 23;
      const slotW = 16;
      const totalW = active.length * slotW;
      const startX = BASE_W/2 - totalW/2;
      ctx.save();
      for (let i = 0; i < active.length; i++) {
        const s = active[i];
        const sx = startX + i * slotW;
        const ratio = Math.max(0, Math.min(1, s.t / s.max));
        // Letter label (slot icon)
        const lowFlash = ratio < 0.2 && (game.animFrame >> 2) % 2 === 0;
        drawRetroText(s.label, sx + 6, stripY, 6, lowFlash ? '#f44' : s.col, 'center');
        // COUNTDOWN SECONDS — when timer < 1.5s, show '1s' / '0s' at top right
        // of letter so the player gets exact remaining seconds for last calls.
        if (s.t > 0 && s.t < 90) {
          const _sec = Math.ceil(s.t / 60);
          drawRetroText(_sec + 's', sx + slotW - 1, stripY - 4, 4, '#fff', 'right');
        }
        // 1px progress bar under label
        ctx.fillStyle = s.col;
        ctx.globalAlpha = 0.3;
        ctx.fillRect(sx + 1, stripY + 7, slotW - 2, 1);
        ctx.globalAlpha = 0.9;
        ctx.fillRect(sx + 1, stripY + 7, Math.round((slotW - 2) * ratio), 1);
      }
      ctx.restore();
    }
  }

  // Power-up levels (bottom right) — color-coded with mini gems + progression pip bar
  const lv = game.lvl || {S: 1, N: 1, P: 1};
  let px = BASE_W - 4;
  for (const type of ['P', 'N', 'S']) {
    drawRetroText(lv[type].toString(), px, BASE_H - 8, 7, '#fff', 'right');
    px -= 6;
    drawMiniGem(px - 2, BASE_H - 8, POWERUP_COL[type]);
    // POWER LEVEL PIPS — small fill bar above the gem (P/N/S 1x1 pixel pips, lit
    // up to current level). Visualizes lvl progress at a glance.
    const maxLvl = MAX_POWER_LVL[type] || 5;
    const pipBaseX = px - 2 - maxLvl + 1; // align right edge with gem
    const pipY = BASE_H - 14;
    for (let i = 0; i < maxLvl; i++) {
      const litCol = i < lv[type] ? POWERUP_COL[type] : '#333';
      ctx.fillStyle = litCol;
      ctx.fillRect(pipBaseX + i, pipY, 1, 2);
    }
    px -= 8;
  }

  // Challenge mode badge (red, blinking) — top center under HIGH SCORE
  if (game.challengeMode) {
    const blink = (game.animFrame >> 3) % 2 === 0;
    drawRetroText('CHALLENGE', BASE_W/2, 35, 6, blink ? COL.red : '#f88');
  }
  // Daily mode 1.25× score multiplier badge
  if (game.dailyMode) {
    const blink = (game.animFrame >> 3) % 2 === 0;
    drawRetroText('DAILY  1.25x', BASE_W/2, 35, 6, blink ? COL.green : '#8c8');
  }
  // HUD DIFFICULTY BADGE — small badge in lower-left when not on default 'normal'.
  if (difficultyMode === 'hard' || difficultyMode === 'easy') {
    const _diffCol = difficultyMode === 'hard' ? COL.red : COL.green;
    drawRetroText(difficultyMode.toUpperCase(), 4, 30, 4, _diffCol, 'left');
  }

  // ACTIVE BUFF STRIP — compact horizontal row replacing stacked bars.
  // All active buffs in one line: letter + 10px ratio bar, 18px per slot.
  // forkTimer included. Last 1.5s fades out. Zero vertical stack = no playfield
  // obstruction regardless of how many buffs are active simultaneously.
  {
    const _bDefs = [
      { t: game.rapidTimer  || 0, max: RAPID_DURATION,  label: 'R', col: '#fc4' },
      { t: game.waveTimer   || 0, max: WAVE_DURATION,   label: 'W', col: '#f8a' },
      { t: game.homingTimer || 0, max: HOMING_DURATION, label: 'H', col: '#0ef' },
      { t: game.laserTimer  || 0, max: LASER_DURATION,  label: 'L', col: '#f6c' },
      { t: game.forkTimer   || 0, max: 360,             label: 'F', col: '#fa0' },
      { t: game.slowTimer   || 0, max: SLOW_DURATION,   label: 'T', col: '#8df' },
    ].filter(b => b.t > 0);
    if (_bDefs.length > 0) {
      const _slotW = 18;
      const _totalW = _bDefs.length * _slotW - 3;
      let _bx = Math.round(BASE_W / 2 - _totalW / 2);
      const _by = 28;
      for (const b of _bDefs) {
        const _ratio = b.t / b.max;
        // BUFF EXPIRY URGENCY — <60f (1s) rapid pulse + warn-color bar;
        // <30f (0.5s) red-flash bar + tiny "!" tick above slot. Lets player
        // read "about to fall off" at a glance and prioritize next pickup.
        const _warn  = b.t < 60;
        const _crit  = b.t < 30;
        const _pulse = _warn ? (0.5 + 0.5 * Math.sin(game.animFrame * 0.6)) : 1;
        const _alpha = _warn ? (0.55 + 0.45 * _pulse) : 0.9;
        const _barCol = _crit ? '#f44' : _warn ? '#fa0' : b.col;
        ctx.save();
        ctx.globalAlpha = _alpha;
        drawRetroText(b.label, _bx + 2, _by, 5, b.col, 'left');
        ctx.fillStyle = '#013';
        ctx.fillRect(_bx + 7, _by - 2, 10, 2);
        ctx.fillStyle = _barCol;
        ctx.fillRect(_bx + 7, _by - 2, Math.round(10 * _ratio), 2);
        // Critical-phase "!" tick — small vertical glyph above the slot, blinks
        // at ~7Hz so it reads as an alert distinct from the slower bar pulse.
        if (_crit && (game.animFrame >> 2) % 2 === 0) {
          ctx.fillStyle = '#f44';
          ctx.fillRect(_bx + 4, _by - 7, 1, 3);
          ctx.fillRect(_bx + 4, _by - 3, 1, 1);
        }
        ctx.restore();
        _bx += _slotW;
      }
    }
  }
  // COMBO DECAY WARNING — when an active combo (>= 5) is about to expire (last
  // ~0.4s of decay timer), pulse a red edge band so the player knows to chain a
  // kill fast. Skipped at low combos (< 5) to avoid spam on routine play.
  if (game.combo >= 5 && (game.comboTimer || 0) > 0 && game.comboTimer < 24) {
    const decayRatio = 1 - game.comboTimer / 24; // 0 → 1 as it approaches expiry
    const pulse = 0.5 + 0.5 * Math.sin(game.animFrame * 0.5);
    ctx.save();
    ctx.globalAlpha = (0.18 + 0.18 * pulse) * decayRatio;
    ctx.fillStyle = '#f44';
    // Top + bottom thin bands (HUD-safe)
    ctx.fillRect(0, 6, BASE_W, 2);
    ctx.fillRect(0, BASE_H - 8, BASE_W, 2);
    ctx.restore();
  }
  // Cheat indicator — small blinking GOD tag in the corner so it's obviously not legit
  if (game.cheatInvincible) {
    const blink = (game.animFrame >> 3) % 2 === 0;
    drawRetroText('GOD', 4, 35, 6, blink ? '#fc4' : '#fa0', 'left');
  }
  // ACTIVE PERK BADGE — small label in the timed-buff region so the player always
  // knows which perk is influencing this stage. Drawn left of the timer column.
  if (game.activePerk && PERKS[game.activePerk]) {
    const p = PERKS[game.activePerk];
    drawRetroText('PERK: ' + p.name, 4, 47, 5, p.col, 'left');
  }

  // Demo mode banner
  if (game.isDemo) {
    if ((game.animFrame >> 4) % 2 === 0) {
      drawRetroText('* DEMO MODE *', BASE_W/2, 35, 9, COL.yellow);
    }
    drawRetroText('PRESS ANY KEY', BASE_W/2, 46, 6, COL.gray);
  }

  // Combo indicator (only when combo ≥ 3) — top-left under HUD
  if (game.combo >= 3) {
    const mult = comboMultiplier(game.combo);
    const col = mult >= 2.5 ? '#f6f' : mult >= 2 ? '#f80' : mult >= 1.5 ? '#ff4' : '#0ff';
    const decay = game.comboTimer / COMBO_DECAY;
    // Decay bar — pulse glow when combo just bumped (timer near full)
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(4, 28, 60, 9);
    ctx.fillStyle = col;
    // TIER HEIGHT — bar height 2 normally, 3 at combo >= 20 for high-tier weight
    const _bH = game.combo >= 20 ? 3 : 2;
    ctx.fillRect(4, 28, Math.round(60 * decay), _bH);
    if (decay > 0.92) {
      ctx.globalAlpha = (decay - 0.92) * 12;
      ctx.fillStyle = '#fff';
      ctx.fillRect(4, 28, Math.round(60 * decay), _bH);
    }
    ctx.restore();
    drawRetroText('×' + mult + ' COMBO ' + game.combo, 6, 33, 6, col, 'left');
    // COMBO TIER NAME — tier label by combo level. MAX tier (30+) adds a
    // soft glow so the peak threshold reads as a visual reward.
    {
      let _tierN = null;
      if (game.combo >= 30) _tierN = 'MAX';
      else if (game.combo >= 20) _tierN = 'PLATINUM';
      else if (game.combo >= 15) _tierN = 'GOLD';
      else if (game.combo >= 10) _tierN = 'SILVER';
      else if (game.combo >= 5) _tierN = 'BRONZE';
      if (_tierN) {
        ctx.save();
        if (_tierN === 'MAX') {
          ctx.shadowColor = col;
          ctx.shadowBlur = 4;
        }
        drawRetroText(_tierN, 70, 33, 4, col, 'left');
        ctx.restore();
      }
    }
    // Running combo total (small, just below)
    const accum = game.comboBonusAccum || 0;
    if (accum > 0) {
      drawRetroText('+' + fmtScore(accum), 6, 39, 5, '#ff4', 'left');
    }
    // COMBO DECAY SECONDS — when timer drops below 1s (60 frames), show countdown
    // text to the right of combo bar so the player sees how much time is left.
    if (game.comboTimer < 60 && game.comboTimer > 0) {
      const secs = (game.comboTimer / 60).toFixed(1);
      drawRetroText(secs + 's', 66, 33, 5, '#f44', 'left');
    }
    // COMBO MILESTONE PROGRESS — find next unclaimed arsenal tier and draw a tiny
    // bar showing distance-to-next-unlock. Bar at y=45, 60px wide.
    const arsenalTiers = [25, 50, 75, 100];
    const arsenalColors = ['#fc4', '#f8a', '#0ef', '#fff'];
    let nextTier = null, nextCol = '#fff', prevTier = 0;
    for (let i = 0; i < arsenalTiers.length; i++) {
      if (!game.comboArsenalClaimed[arsenalTiers[i]]) {
        nextTier = arsenalTiers[i];
        nextCol = arsenalColors[i];
        prevTier = i === 0 ? 0 : arsenalTiers[i - 1];
        break;
      }
    }
    if (nextTier !== null && game.combo > 0) {
      const span = nextTier - prevTier;
      const into = Math.max(0, Math.min(span, game.combo - prevTier));
      const ratio = into / span;
      ctx.save();
      // Track
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(4, 45, 60, 3);
      // Fill
      ctx.fillStyle = nextCol;
      ctx.globalAlpha = 0.85;
      ctx.fillRect(4, 45, Math.round(60 * ratio), 3);
      // Pulse glow when ≥90% to next tier
      if (ratio >= 0.9) {
        ctx.globalAlpha = 0.5 + 0.5 * Math.sin(game.animFrame * 0.4);
        ctx.fillStyle = '#fff';
        ctx.fillRect(4, 45, Math.round(60 * ratio), 1);
      }
      ctx.restore();
      drawRetroText('→' + nextTier, 66, 45, 5, nextCol, 'left');
      // ARSENAL TIER IMMINENT — within 3 combo of next tier, blink gold tag
      if ((nextTier - game.combo) <= 3 && (nextTier - game.combo) > 0) {
        const _aiB = (game.animFrame >> 2) % 2 === 0;
        if (_aiB) drawRetroText('IMMINENT', 4, 53, 4, '#fc4', 'left');
      }
    }
    // COMBO ARSENAL PROGRESS DOTS — 4-tier overview row (just below bar)
    // Claimed: filled gold/pink/cyan/white. Next-target: pulsing. Future: dim outline.
    {
      const dotY = 50;
      for (let i = 0; i < arsenalTiers.length; i++) {
        const dx = 4 + i * 5;
        const claimed = !!game.comboArsenalClaimed[arsenalTiers[i]];
        const isNext = !claimed && nextTier === arsenalTiers[i];
        ctx.save();
        if (claimed) {
          ctx.fillStyle = arsenalColors[i];
          ctx.globalAlpha = 0.95;
          ctx.fillRect(dx, dotY, 3, 3);
        } else if (isNext) {
          ctx.fillStyle = arsenalColors[i];
          ctx.globalAlpha = 0.5 + 0.5 * Math.sin(game.animFrame * 0.3);
          ctx.fillRect(dx, dotY, 3, 3);
        } else {
          ctx.fillStyle = arsenalColors[i];
          ctx.globalAlpha = 0.25;
          ctx.fillRect(dx, dotY, 3, 1);
          ctx.fillRect(dx, dotY + 2, 3, 1);
          ctx.fillRect(dx, dotY, 1, 3);
          ctx.fillRect(dx + 2, dotY, 1, 3);
        }
        ctx.restore();
      }
    }
    // Tier transition flash — within 12 frames of hitting tier-up combo (5/10/15/30)
    if ([5, 10, 15, 30, 60, 100].some(t => game.combo === t)) {
      ctx.save();
      ctx.globalAlpha = 0.5 - (game.animFrame % 12) / 24;
      ctx.fillStyle = col;
      ctx.fillRect(2, 26, 64, 17);
      ctx.restore();
    }
  }

  // Real-time stage accuracy (top-left, second row) — only after some shots fired
  if (!minimalHud && (game.stageShotsFired || 0) >= 4) {
    const acc = Math.round((game.stageShotsHit / game.stageShotsFired) * 100);
    const accCol = acc >= 90 ? '#0f8' : acc >= 70 ? COL.cyan : acc >= 40 ? COL.yellow : '#f88';
    drawRetroText('ACC ' + acc + '%', 6, game.combo >= 3 ? 41 : 30, 6, accCol, 'left');
  }

  // RUN KILL COUNTER — small "K: N" near accuracy showing cumulative kills this run.
  // Activates only after the player has actually killed something (≥ 10 kills) so
  // the HUD stays clean for the opening stage.
  if (!minimalHud && (game.stats && game.stats.kills) >= 10
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    const kY = game.combo >= 3
              ? ((game.stageShotsFired || 0) >= 4 ? 49 : 41)
              : ((game.stageShotsFired || 0) >= 4 ? 38 : 30);
    const k = game.stats.kills;
    const kCol = k >= 1000 ? '#fc4' : k >= 500 ? '#0ff' : '#aaa';
    drawRetroText('K ' + k, 6, kY, 5, kCol, 'left');
    // HUD KILLS PER MINUTE — after 60s of run, show K/M rate metric below kill
    // counter. Useful speedrun / efficiency feedback.
    if ((game.runFrames || 0) >= 3600) {
      const minutes = (game.runFrames || 0) / 3600;
      const kpm = Math.round(k / minutes);
      const kpmCol = kpm >= 60 ? '#fc4' : kpm >= 30 ? '#0ff' : '#888';
      drawRetroText(kpm + ' K/M', 6, kY + 6, 4, kpmCol, 'left');
    }
  }

  // "ENEMIES LEFT" mini-counter when the stage is nearly done (≤ 6 alive in PLAYING)
  if (game.state === STATE.PLAYING && game.allEntered) {
    const alive = (game.enemies || []).filter(e => e.alive).length;
    if (alive > 0 && alive <= 6) {
      const lblY = game.combo >= 3 ? 49 : 38;
      drawRetroText(alive + ' LEFT', 6, lblY, 6, COL.yellow, 'left');
    }
  }

  // Difficulty indicator on HUD when not normal — small badge
  if (difficultyMode !== 'normal' && (game.state === STATE.PLAYING || game.state === STATE.BOSS_STAGE || game.state === STATE.CHALLENGING)) {
    const dCol = difficultyMode === 'hard' ? COL.red : COL.green;
    const tag = difficultyMode === 'hard' ? '!H!' : '~E~';
    drawRetroText(tag, BASE_W - 5, 26, 5, dCol, 'right');
  }
  // Boss HP bar moved to drawBossStage() combined bar — no duplicate needed here.

  drawMiniRadar();

  // Dash cooldown bar (bottom-right, above the power-up gems)
  if (game.dashCooldown > 0 || game.dashTimer > 0) {
    const ratio = game.dashTimer > 0 ? 1 : (1 - game.dashCooldown / 60);
    const barW = 28;
    const bx = BASE_W - 6 - barW;
    const by = BASE_H - 16;
    ctx.fillStyle = '#022';
    ctx.fillRect(bx, by, barW, 2);
    ctx.fillStyle = game.dashTimer > 0 ? '#fff' : COL.cyan;
    ctx.fillRect(bx, by, Math.round(barW * ratio), 2);
  }
}

function drawGameOverScreen() {
  // Animated entrance — slide in from edges over the first 30 frames
  const elapsedGo = 180 - game.gameOverTimer;
  const entry = Math.min(1, elapsedGo / 30);
  const cy = BASE_H / 2 - 8;

  // GAME OVER WARP OUT — first 60 frames: stars collapse inward (gravity well).
  // Symmetric to STAGE INTRO WARP (radial outward); here stars converge to center,
  // suggesting the player's universe folding in. Visual cinematic close.
  if (elapsedGo < 60) {
    const warpRatio = elapsedGo / 60;          // 0 → 1
    const pullStrength = warpRatio * 0.85;      // 0 → 0.85
    const cx = BASE_W / 2, ccy = BASE_H / 2;
    ctx.save();
    ctx.fillStyle = '#fff';
    for (const s of stars) {
      // Pull star position toward center; render at lerped position
      const dx = cx - s.x, dy = ccy - s.y;
      const px = s.x + dx * pullStrength;
      const py = s.y + dy * pullStrength;
      // Streak from original to current position for motion blur
      ctx.globalAlpha = (1 - warpRatio * 0.5) * s.brightness;
      ctx.fillRect(Math.round(px), Math.round(py), 1, 1);
      // Trail line back to original (3 segments)
      if (warpRatio > 0.15) {
        for (let k = 1; k <= 3; k++) {
          const tk = k / 4;
          const ix = s.x + dx * pullStrength * (1 - tk);
          const iy = s.y + dy * pullStrength * (1 - tk);
          ctx.globalAlpha = (1 - tk) * 0.5 * s.brightness;
          ctx.fillRect(Math.round(ix), Math.round(iy), 1, 1);
        }
      }
    }
    // Central white flash near the end of the warp
    if (elapsedGo > 50) {
      ctx.globalAlpha = (elapsedGo - 50) / 10 * 0.35;
      ctx.fillStyle = '#fff';
      ctx.fillRect(cx - 6, ccy - 6, 12, 12);
    }
    ctx.restore();
  }

  // Dimmed backdrop expanding height
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  const panelH = 110 * entry;
  ctx.fillRect(0, cy - panelH / 2, BASE_W, panelH);
  // Decorative dashed borders
  ctx.fillStyle = 'rgba(255,68,68,0.6)';
  for (let i = 0; i < BASE_W; i += 6) {
    ctx.fillRect(i, cy - panelH / 2, 3, 1);
    ctx.fillRect(i, cy + panelH / 2 - 1, 3, 1);
  }
  ctx.restore();

  if (entry < 1) return;

  // Glowing GAME OVER title — initial frames have a strong shake, then settle
  ctx.save();
  const glow = 0.6 + 0.4 * Math.sin(game.animFrame * 0.08);
  ctx.shadowColor = COL.red;
  ctx.shadowBlur = 12 * glow;
  // Shake: strong in first 30 entry frames, decays with elapsedGo
  const goShake = Math.max(0, 1 - elapsedGo / 30) * 4;
  const goSx = (Math.random() - 0.5) * goShake;
  const goSy = (Math.random() - 0.5) * goShake;
  drawRetroText('GAME OVER', BASE_W/2 + goSx, cy - 35 + goSy, 16, COL.red);
  ctx.restore();
  // PILOT TITLE LABEL — '[CSN] TITLE' below GAME OVER. Color picks up the
  // pilot tier (pilotTitleColor) so GAME_OVER joins STAGE_INTRO / HUD / STATS
  // overlay in the 4-location pilot-progression color cohesion.
  if (playerCallsign && playerCallsign !== '???' && typeof computePilotTitle === 'function') {
    const _ptl = computePilotTitle();
    const _ptCol = (typeof pilotTitleColor === 'function')
      ? pilotTitleColor(_ptl)
      : ((typeof callsignColor === 'function') ? callsignColor() : '#888');
    // ACE PILOT (peak tier, 80%+ achievements) picks up a white glow so the
    // lifetime apex tier reads as a visual reward in GAME_OVER.
    ctx.save();
    if (_ptl === 'ACE PILOT') {
      ctx.shadowColor = _ptCol;
      ctx.shadowBlur = 4;
    }
    drawRetroText('[' + playerCallsign + ']  ' + _ptl,
                  BASE_W/2, cy - 28, 5, _ptCol);
    ctx.restore();
  }

  // Ship + mode badge (between title and SCORE row)
  {
    const shipName = (game.ship && game.ship.name) || 'GAM-42';
    const shipCol = (game.ship && game.ship.color) || '#0cf';
    const modeLabel = game.dailyMode ? 'DAILY ' + dailyLabel()
                    : game.challengeMode ? 'CHALLENGE'
                    : 'NORMAL';
    const modeCol = game.dailyMode ? COL.green
                  : game.challengeMode ? COL.red
                  : COL.gray;
    drawPlayer(BASE_W/2 - 50, cy - 23, shipCol);
    drawRetroText(shipName, BASE_W/2 - 36, cy - 23, 6, shipCol, 'left');
    drawRetroText('|  ' + modeLabel, BASE_W/2 + 4, cy - 23, 6, modeCol, 'left');
  }

  // Score (counts up from 0 during frames 30→90 of the entrance) — eased curve for satisfying tally
  const countStart = 30, countEnd = 90;
  const linearT = Math.max(0, Math.min(1, (elapsedGo - countStart) / (countEnd - countStart)));
  // Ease-out curve so big scores ramp up fast at first then settle
  const countT = 1 - Math.pow(1 - linearT, 2);
  const displayScore = Math.floor(game.score * countT);
  drawRetroText('SCORE', BASE_W/2 - 40, cy - 12, 7, COL.cyan);
  // Score color escalates as it counts up — yellow at high totals, magenta at 10M+
  const scCol = game.score >= 10000000 ? '#f6f' : game.score >= 1000000 ? COL.yellow : game.score >= 100000 ? '#ff8' : COL.white;
  drawRetroText(fmtScore(displayScore), BASE_W/2 + 40, cy - 12, 9, scCol, 'right');
  // SCORE TIER LABEL — name tier based on final score
  if (linearT >= 1) {
    const _sT = game.score >= 10000000 ? 'LEGEND'
              : game.score >= 1000000  ? 'PLATINUM'
              : game.score >= 100000   ? 'GOLD'
              : game.score >= 10000    ? 'SILVER'
              : game.score >= 1000     ? 'BRONZE'
              : null;
    if (_sT) {
      const _sTcol = game.score >= 10000000 ? '#f6f'
                   : game.score >= 1000000  ? '#fc4'
                   : game.score >= 100000   ? '#ff8'
                   : game.score >= 10000    ? '#0ff' : '#0f8';
      drawRetroText(_sT + ' TIER', BASE_W/2 - 40, cy - 4, 4, _sTcol, 'left');
    }
  }
  // SCORE PB COMPARE — when count finishes (linearT >=1) show 'NEW HIGH!' or 'HI: N'.
  if (linearT >= 1 && (game.highScore || 0) > 0) {
    if (game.score >= game.highScore) {
      const _hsB = (game.animFrame >> 2) % 2 === 0 ? '#fc4' : '#ff4';
      drawRetroText('NEW HIGH!', BASE_W/2 + 40, cy - 4, 4, _hsB, 'right');
    } else {
      drawRetroText('HI: ' + fmtScore(game.highScore), BASE_W/2 + 40, cy - 4, 4, '#888', 'right');
    }
  }

  // STATS — 5 core metrics in a clean 2-column grid. Every tier sub-label
  // (EXTERMINATOR / SHARPSHOOTER / VOIDWALKER / etc.) and the dozen+ bonus
  // stat lines (K/MIN, S/MIN, SHIP KILLS, MULTIKILL, PIERCE, ACE, OBJ, PARRY,
  // BIOMES, CORR, TOP, CMPL, PERK, EXTRA SHIPS...) were removed — that detail
  // lives in the PROFILE tab. Game over now shows just: identity, score,
  // 5 stats, grade, death cause, epitaph, 3 highlights, restart prompt.
  const s = game.stats || { kills: 0, shotsFired: 0, shotsHit: 0, maxStage: game.stage };
  const acc = s.shotsFired === 0 ? 0 : Math.round((s.shotsHit / s.shotsFired) * 100);

  // Sequential count-up windows so the stats roll in after SCORE finishes.
  function rollT(start, end) {
    return Math.max(0, Math.min(1, (elapsedGo - start) / (end - start)));
  }
  const tKills = rollT(95, 112);
  const tAcc   = rollT(103, 120);
  const tStage = rollT(111, 126);
  const tCombo = rollT(119, 134);
  const tTime  = rollT(127, 142);

  // 2-column grid. Left col: label left-aligned at cxL, value right-aligned at cvL.
  // Right col: label left-aligned at cxR, value right-aligned at cvR.
  const _cxL = BASE_W/2 - 48, _cvL = BASE_W/2 - 8;
  const _cxR = BASE_W/2 + 8,  _cvR = BASE_W/2 + 40;
  // Row 1 — KILLS | ACCURACY
  drawRetroText('KILLS', _cxL, cy + 8, 5, COL.cyan, 'left');
  drawRetroText(Math.floor(s.kills * tKills).toString(), _cvL, cy + 8, 6, COL.yellow, 'right');
  drawRetroText('ACC', _cxR, cy + 8, 5, COL.cyan, 'left');
  drawRetroText(Math.floor(acc * tAcc) + '%', _cvR, cy + 8, 6, COL.yellow, 'right');
  // Row 2 — MAX STAGE | BEST COMBO
  drawRetroText('STAGE', _cxL, cy + 18, 5, COL.cyan, 'left');
  drawRetroText(Math.floor(s.maxStage * tStage).toString(), _cvL, cy + 18, 6, COL.yellow, 'right');
  drawRetroText('COMBO', _cxR, cy + 18, 5, COL.cyan, 'left');
  drawRetroText('x' + Math.floor((game.comboBest || 0) * tCombo), _cvR, cy + 18, 6, COL.yellow, 'right');
  // Row 3 — TIME (left). Right column reserved for the GRADE letter.
  const ts = Math.floor((game.runFrames || 0) / 60);
  const tsShown = Math.floor(ts * tTime);
  const mmgo = String(Math.floor(tsShown / 60)).padStart(2, '0');
  const ssgo = String(tsShown % 60).padStart(2, '0');
  drawRetroText('TIME', _cxL, cy + 28, 5, COL.cyan, 'left');
  drawRetroText(mmgo + ':' + ssgo, _cvL, cy + 28, 6, COL.yellow, 'right');

  // Tick sounds as each stat row begins counting
  if (game.gameOverTimer === 180 - 95 || game.gameOverTimer === 180 - 103
      || game.gameOverTimer === 180 - 111 || game.gameOverTimer === 180 - 119
      || game.gameOverTimer === 180 - 127) {
    playSound('tick');
  }

  // GRADE — composite S/A/B/C/D from score + accuracy + stage. Big letter in
  // the right column next to the stat rows, vertically centered.
  if (elapsedGo > 138) {
    const sF = Math.min(1, (game.score || 0) / 100000) * 0.5;
    const aF = (acc / 100) * 0.3;
    const stF = Math.min(1, (s.maxStage || 1) / 30) * 0.2;
    const total = sF + aF + stF;
    let grade, gcol;
    if      (total >= 0.85) { grade = 'S'; gcol = '#f6f'; }
    else if (total >= 0.70) { grade = 'A'; gcol = COL.yellow; }
    else if (total >= 0.55) { grade = 'B'; gcol = COL.green; }
    else if (total >= 0.40) { grade = 'C'; gcol = COL.cyan; }
    else                    { grade = 'D'; gcol = COL.gray; }
    drawRetroText('GRADE', BASE_W/2 + 64, cy + 22, 5, COL.cyan);
    ctx.save();
    ctx.shadowColor = gcol;
    ctx.shadowBlur = 5 + 3 * Math.sin(game.animFrame * 0.2);
    drawRetroText(grade, BASE_W/2 + 64, cy + 34, 16, gcol);
    ctx.restore();
  }

  // NEW HIGH / RANK celebration — one dramatic line just inside the panel
  // bottom. Only when this run made the top-5; otherwise nothing (the score
  // row already shows NEW HIGH! / HI: N).
  if (game.topRank >= 0 && elapsedGo > 140) {
    const nhsCol = (game.animFrame >> 3) % 2 === 0 ? COL.yellow : COL.magenta;
    const prefix = game.dailyMode ? 'DAILY ' : game.challengeMode ? 'CHAL ' : '';
    const text = game.topRank === 0
      ? (prefix ? prefix + 'BEST!' : 'NEW HIGH SCORE!')
      : (prefix + 'RANK #' + (game.topRank + 1) + '!');
    drawRetroText(text, BASE_W/2, cy + 44, 6, nhsCol);
  }

  // DEATH CAUSE — single line just below the panel
  if (game.lastDeathCause && elapsedGo > 110) {
    const fade = Math.min(1, (elapsedGo - 110) / 20);
    const dcMap = {
      bullet:    'FELLED BY ENEMY FIRE',
      collision: 'FELLED BY DIVE IMPACT',
      unknown:   'CAUSE UNKNOWN'
    };
    const dcLine = dcMap[game.lastDeathCause] || ('FELLED BY ' + String(game.lastDeathCause).toUpperCase());
    ctx.save();
    ctx.globalAlpha = 0.7 * fade;
    drawRetroText(dcLine, BASE_W/2, cy + 60, 4, '#f88');
    ctx.restore();
  }

  // EPITAPH — narrative bookend: header + one closing line. Color reflects the
  // reached stage tier (rookie → legend) so the epitaph's visual weight rises
  // with the run's depth. Mirrors pickEpitaph tier thresholds.
  if (game.runEpitaph && elapsedGo > 122) {
    const fade = Math.min(1, (elapsedGo - 122) / 30);
    const _epStage = (game.stats && game.stats.maxStage) || game.stage || 1;
    let _epCol = '#cfc';
    if (_epStage >= 80)      _epCol = '#fc4'; // legend
    else if (_epStage >= 50) _epCol = '#f6f'; // voidwalker
    else if (_epStage >= 30) _epCol = '#fa0'; // apex
    else if (_epStage >= 20) _epCol = '#f88'; // deepDive
    else if (_epStage >= 10) _epCol = '#fc8'; // veteran
    else if (_epStage >= 5)  _epCol = '#cfc'; // scout
    ctx.save();
    // Personalized header: the run title (earned from playstyle) + callsign, so the
    // epitaph reads as THIS pilot's closing — "how you flew" framing "how you fell".
    const _hdr = (game.runTitle)
      ? ('— [' + (playerCallsign || '???') + '] · ' + game.runTitle + ' —')
      : '— FINAL TRANSMISSION —';
    ctx.globalAlpha = 0.55 * fade;
    drawRetroText(_hdr, BASE_W/2, cy + 70, 4, '#9ab');
    ctx.globalAlpha = 0.85 * fade;
    drawRetroText(game.runEpitaph, BASE_W/2, cy + 78, 5, _epCol);
    ctx.restore();
  }

  // RUN NEXT GOAL — concrete forward target (computed at game-over in game.runGoal:
  // next stage milestone / boss / bestiary completion / push beyond). Sits between
  // the epitaph and the highlights so the screen reads fate → aim → achievements,
  // giving the player a reason to retry. Was computed but never rendered — now shown.
  if (game.runGoal && elapsedGo > 138) {
    ctx.save();
    ctx.globalAlpha = 0.8 * Math.min(1, (elapsedGo - 138) / 18);
    drawRetroText(game.runGoal, BASE_W/2, cy + 85, 4, game.runGoalCol || '#fc4');
    ctx.restore();
  }

  // RUN HIGHLIGHTS — header + up to 3 lines, staggered fade-in
  if (game.runHighlights && game.runHighlights.length > 0 && elapsedGo > 145) {
    const hy = cy + 92;
    ctx.save();
    ctx.globalAlpha = 0.5 * Math.min(1, (elapsedGo - 145) / 20);
    drawRetroText('— HIGHLIGHTS —', BASE_W/2, hy, 4, '#888');
    ctx.restore();
    for (let i = 0; i < game.runHighlights.length; i++) {
      const h = game.runHighlights[i];
      const lineFrame = 153 + i * 6;
      if (elapsedGo < lineFrame) continue;
      const lineFade = Math.min(1, (elapsedGo - lineFrame) / 14);
      ctx.save();
      ctx.globalAlpha = lineFade;
      // TOP HIGHLIGHT GLOW — index 0 (highest-priority stat) gets a soft
      // shadowBlur glow so the run's signature reads at a glance. Lines 2/3
      // stay plain so the hierarchy is clear.
      if (i === 0) {
        ctx.shadowColor = h.col;
        ctx.shadowBlur = 6;
      }
      drawRetroText(h.label, BASE_W/2 - 4, hy + 9 + i * 8, 4, '#888', 'right');
      drawRetroText(h.value, BASE_W/2 + 2, hy + 9 + i * 8, 5, h.col, 'left');
      ctx.restore();
    }
  }

  if (game.gameOverTimer <= 0) {
    // Restart prompt sits below the highlights block (which ends ~cy+116).
    if (game.animFrame % 60 < 40) {
      drawRetroText('SPACE TITLE   R RETRY', BASE_W/2, cy + 126, 6, COL.cyan);
    }
    drawRetroText('TITLE → TAB PROFILE', BASE_W/2, cy + 134, 4, '#666');
    // CHEAT-USED honor flag
    if (game._cheatUsedAtAnyTime) {
      drawRetroText('(GOD MODE USED)', BASE_W/2, cy + 141, 4, '#a88');
    } else if (game._stageJumpUsed) {
      drawRetroText('(STAGE JUMP USED)', BASE_W/2, cy + 141, 4, '#a88');
    }
    // Auto-retry countdown — replaces the manual prompt position when active
    if (game.autoRestartTimer > 0) {
      const sec = Math.ceil(game.autoRestartTimer / 60);
      const cdCol = sec <= 2 ? '#fa8' : COL.gray;
      drawRetroText('AUTO RETRY ' + sec, BASE_W/2, cy + 134, 5, cdCol);
      const arProg = game.autoRestartTimer / 480;
      const arBarW = 60;
      const arBarX = BASE_W/2 - arBarW/2;
      const arBarY = cy + 141;
      ctx.save();
      ctx.fillStyle = '#222';
      ctx.fillRect(arBarX, arBarY, arBarW, 2);
      ctx.fillStyle = cdCol;
      ctx.fillRect(arBarX, arBarY, Math.round(arBarW * arProg), 2);
      ctx.restore();
    }
  }
}

function drawBossStage() {
  const bosses = game.megaBosses || [];
  const aliveBosses = bosses.filter(mb => mb.alive);

  // Boss title — SUPER (single 1.5×) > DOUBLE (two) > regular
  const glow = Math.sin(game.animFrame * 0.08) * 0.4 + 0.6;
  const anySuper = aliveBosses.some(mb => mb.super);
  // Boss title is rendered AFTER drawHUD (in drawHUD itself) to avoid overlap with HIGH SCORE row.
  // Just store the metadata for drawHUD to read.
  game._bossTitle = anySuper ? '!! SUPER BOSS !!'
                  : aliveBosses.length > 1 ? '!! DOUBLE BOSS !!'
                  : '!! BOSS !!';
  game._bossTitleSize = anySuper ? 9 : aliveBosses.length > 1 ? 7 : 8;
  game._bossTitleGlow = glow;

  // Mega-bosses (super bosses render at 1.5× scale)
  for (const mb of aliveBosses) {
    const drawScale = mb.scale || 1;
    // PHANTOM teleFlash — blink the boss sprite during the 12-frame
    // intangibility window so the player sees the dodge happened.
    if ((mb.teleFlash || 0) > 0 && (mb.teleFlash >> 1) % 2 === 0) continue;
    const renderBoss = (hit) => {
      if (drawScale === 1) {
        drawMegaBoss(mb.x, mb.y, mb.frame, hit, mb.archetype);
      } else {
        ctx.save();
        ctx.translate(mb.x, mb.y);
        ctx.scale(drawScale, drawScale);
        drawMegaBoss(0, 0, mb.frame, hit, mb.archetype);
        ctx.restore();
      }
    };
    if (mb.telegraphing) {
      const blink = (game.animFrame >> 1) % 2 === 0;
      renderBoss(blink);
      ctx.save();
      ctx.globalAlpha = 0.35 + 0.25 * Math.sin(game.animFrame * 0.4);
      ctx.fillStyle = COL.red;
      const lineX = Math.round(mb.x);
      for (let yy = mb.y + 16; yy < BASE_H - 18; yy += 4) {
        ctx.fillRect(lineX, yy, 1, 2);
      }
      ctx.restore();
      if (game.playerAlive && blink) {
        ctx.fillStyle = COL.red;
        ctx.fillRect(game.playerX - 1, game.playerY - 22, 2, 5);
        ctx.fillRect(game.playerX - 1, game.playerY - 15, 2, 2);
      }
    } else {
      renderBoss(mb.hitFlash > 0);
    }
    // PHASE 3 RAGE — pulsing red square halo around the boss when in critical state.
    // Scales with drawScale so super bosses get a proportionally larger aura.
    if (mb.phase3) {
      ctx.save();
      const _ragePulse = 0.40 + 0.35 * Math.sin(game.animFrame * 0.32);
      ctx.globalAlpha = _ragePulse;
      ctx.fillStyle = '#f44';
      const _w = Math.round(22 * drawScale);
      const _h = Math.round(22 * drawScale);
      const _x0 = Math.round(mb.x - _w / 2);
      const _y0 = Math.round(mb.y - _h / 2);
      ctx.fillRect(_x0, _y0, _w, 1);
      ctx.fillRect(_x0, _y0 + _h - 1, _w, 1);
      ctx.fillRect(_x0, _y0, 1, _h);
      ctx.fillRect(_x0 + _w - 1, _y0, 1, _h);
      // Inner glow accent on corners
      ctx.globalAlpha = _ragePulse * 0.7;
      ctx.fillStyle = '#fc4';
      ctx.fillRect(_x0, _y0, 2, 2);
      ctx.fillRect(_x0 + _w - 2, _y0, 2, 2);
      ctx.fillRect(_x0, _y0 + _h - 2, 2, 2);
      ctx.fillRect(_x0 + _w - 2, _y0 + _h - 2, 2, 2);
      ctx.restore();
    }
    // RUNE archetype — 8 rotating violet glyphs orbiting the boss for visual ID
    if (mb.archetype === 'rune') {
      const t = game.animFrame;
      ctx.save();
      const orbitR = 22;
      ctx.fillStyle = '#a4f';
      for (let k = 0; k < 8; k++) {
        const a = (k / 8) * Math.PI * 2 + t * 0.02;
        const rx = Math.round(mb.x + Math.cos(a) * orbitR);
        const ry = Math.round(mb.y + Math.sin(a) * orbitR);
        ctx.globalAlpha = 0.45 + 0.25 * Math.sin(t * 0.10 + k * 0.6);
        ctx.fillRect(rx - 1, ry - 1, 2, 2);
      }
      ctx.restore();
    }
    // TAUNT BUBBLE — speech above boss when tauntLife > 0. Fades over its lifetime.
    // Position: above boss (y - 30 ish, scaled with boss size). Width auto-fits text.
    if ((mb.tauntLife || 0) > 0 && mb.tauntText) {
      const tx = mb.x;
      const ty = mb.y - 28 - (mb.scale > 1 ? 10 : 0);
      const fade = Math.min(1, mb.tauntLife / 30); // fade in last 0.5s
      const padW = mb.tauntText.length * 3 + 6;
      ctx.save();
      ctx.globalAlpha = 0.75 * fade;
      // Bubble background (semi-transparent dark)
      ctx.fillStyle = '#100';
      ctx.fillRect(tx - padW / 2, ty - 5, padW, 9);
      // Bubble border (matches archetype tint)
      const borderCol = mb.archetype === 'horned'  ? '#f88'
                     : mb.archetype === 'tendril' ? '#8ff'
                     : mb.archetype === 'crystal' ? '#caf'
                     : '#fc8';
      ctx.fillStyle = borderCol;
      ctx.fillRect(tx - padW / 2, ty - 5, padW, 1);
      ctx.fillRect(tx - padW / 2, ty + 3, padW, 1);
      ctx.fillRect(tx - padW / 2, ty - 5, 1, 9);
      ctx.fillRect(tx + padW / 2 - 1, ty - 5, 1, 9);
      // Tail pointing down toward boss
      ctx.fillRect(tx - 2, ty + 4, 4, 1);
      ctx.fillRect(tx - 1, ty + 5, 2, 1);
      // Text
      ctx.globalAlpha = fade;
      drawRetroText(mb.tauntText, tx, ty - 1, 5, '#fff');
      ctx.restore();
    }
  }

  // Phase-telegraph caution-tape sirens — red diagonal stripes scrolling along the edges
  const anyTelegraph = aliveBosses.some(mb => (mb.telegraphFrames || 0) > 0);
  if (anyTelegraph) {
    ctx.save();
    ctx.fillStyle = COL.red;
    const off = (game.animFrame * 2) % 16;
    for (let i = -16; i < BASE_W + 16; i += 8) {
      const x = i + off;
      // Top tape (y=24..28): diagonal slabs
      ctx.fillRect(x, 24, 4, 4);
      ctx.fillRect(x + 4, 25, 4, 3);
      // Bottom tape
      ctx.fillRect(x, BASE_H - 16, 4, 4);
      ctx.fillRect(x + 4, BASE_H - 17, 4, 3);
    }
    // Side flickers
    if ((game.animFrame >> 1) % 2 === 0) {
      ctx.globalAlpha = 0.55;
      ctx.fillRect(0, 24, 3, BASE_H - 40);
      ctx.fillRect(BASE_W - 3, 24, 3, BASE_H - 40);
    }
    ctx.restore();
    drawRetroText('PHASE INCOMING', BASE_W/2, BASE_H/2 - 30, 9, (game.animFrame >> 2) % 2 === 0 ? COL.red : '#f88');
  }

  // BOSS TACTICAL DISPLAY — full-width HP bar with per-archetype segment coloring
  // and per-boss identity labels. Multi-boss stages get archetype-tinted segments
  // and individual labels above each boss's slice so players know who's who.
  if (bosses.length > 0) {
    const totalMax  = bosses.reduce((s, mb) => s + mb.maxHp, 0);
    const totalHp   = bosses.reduce((s, mb) => s + (mb.alive ? mb.hp : 0), 0);
    const anyEnrage = aliveBosses.some(mb => mb.phase2);
    const barW = BASE_W - 20;
    const barY = 30;
    const ratio = totalMax > 0 ? totalHp / totalMax : 0;
    const _t = game.animFrame;

    // Archetype identity maps
    const _archCol   = { standard: '#fc8', horned: '#f88', tendril: '#8ff', crystal: '#caf', phantom: '#a8f', rune: '#a4f' };
    const _archLabel = { standard: 'STD',  horned: 'HRN',  tendril: 'TND',  crystal: 'CRY',  phantom: 'PHM',  rune: 'RNE' };

    // Track background
    ctx.fillStyle = '#1a0a0a';
    ctx.fillRect(10, barY, barW, 5);

    if (bosses.length === 1) {
      // Single boss: ratio-based unified fill with pulse glow at low HP
      const mb0 = bosses[0];
      const barColor = anyEnrage
        ? (_t % 10 < 5 ? COL.red : '#f80')
        : (ratio > 0.5 ? COL.green : ratio > 0.25 ? COL.yellow : COL.red);
      if (ratio < 0.25) {
        const pulse = 0.5 + 0.5 * Math.sin(_t * 0.4);
        ctx.save();
        ctx.globalAlpha = 0.30 + 0.20 * pulse;
        ctx.fillStyle = '#f44';
        ctx.fillRect(8, barY - 1, Math.round(barW * ratio) + 4, 7);
        ctx.restore();
      }
      ctx.fillStyle = barColor;
      ctx.fillRect(10, barY, Math.round(barW * ratio), 5);
    } else {
      // Multi-boss: each boss's HP portion rendered in their archetype color
      let fillX = 10;
      for (let i = 0; i < bosses.length; i++) {
        const mb = bosses[i];
        const segMaxW = Math.round(barW * mb.maxHp / totalMax);
        const hpRatio = mb.alive && mb.maxHp > 0 ? mb.hp / mb.maxHp : 0;
        const segFillW = Math.round(segMaxW * hpRatio);
        if (segFillW > 0) {
          const aCol = _archCol[mb.archetype] || '#fc8';
          const enrageFlicker = mb.phase2 && _t % 10 < 5;
          ctx.fillStyle = enrageFlicker ? '#f44' : aCol;
          ctx.fillRect(fillX, barY, segFillW, 5);
          // Shine line
          ctx.save();
          ctx.globalAlpha = 0.28;
          ctx.fillStyle = '#fff';
          ctx.fillRect(fillX, barY, segFillW, 1);
          ctx.restore();
        }
        fillX += segMaxW;
      }
      // Per-boss segment dividers — thicker to clearly separate territories
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      let acc = 0;
      for (let i = 0; i < bosses.length - 1; i++) {
        acc += bosses[i].maxHp / totalMax;
        ctx.fillRect(10 + Math.round(barW * acc) - 1, barY - 1, 2, 7);
      }
      ctx.restore();
    }

    // 10-division tick marks (damage chunk guides)
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    for (let _s = 1; _s < 10; _s++) {
      ctx.fillRect(10 + Math.round(barW * _s / 10), barY, 1, 5);
    }
    ctx.restore();
    // PHASE THRESHOLD MARKERS — single-boss only. Tick at 40% HP (PHASE 2) and
    // 15% HP (PHASE 3) so the player reads decisive damage points. Bright when
    // upcoming, dim gray once the phase has already triggered. Multi-boss bars
    // would noise the segments, so this is skipped there.
    if (bosses.length === 1) {
      const _mbT = bosses[0];
      ctx.save();
      // Phase 2 marker — 40% HP
      const _p2X = 10 + Math.round(barW * 0.40);
      ctx.fillStyle = _mbT.phase2 ? '#444' : '#fc4';
      ctx.globalAlpha = _mbT.phase2 ? 0.4 : 0.9;
      ctx.fillRect(_p2X, barY - 2, 1, 8);
      // Phase 3 marker — 15% HP
      const _p3X = 10 + Math.round(barW * 0.15);
      ctx.fillStyle = _mbT.phase3 ? '#444' : '#f44';
      ctx.globalAlpha = _mbT.phase3 ? 0.4 : 0.9;
      ctx.fillRect(_p3X, barY - 2, 1, 8);
      ctx.restore();
    }

    // Bar border
    ctx.save();
    ctx.strokeStyle = COL.white;
    ctx.lineWidth = 0.5;
    ctx.strokeRect(10, barY, barW, 5);
    ctx.restore();

    // TACTICAL LABELS — archetype identity + status above and below bar
    if (bosses.length === 1) {
      // Single boss: archetype name above + HP pct + phase2 below
      const mb0 = bosses[0];
      const aLabel = _archLabel[mb0.archetype] || 'BOS';
      const aCol   = _archCol[mb0.archetype]   || '#fc8';
      if (mb0.phase2) {
        const p2Col = _t % 10 < 5 ? '#f44' : '#f88';
        ctx.save();
        ctx.globalAlpha = 0.7 + 0.3 * Math.sin(_t * 0.25);
        drawRetroText(aLabel + ' — PHASE 2', BASE_W / 2, barY - 7, 4, p2Col, 'center');
        ctx.restore();
      } else {
        ctx.save();
        ctx.globalAlpha = 0.80;
        drawRetroText(aLabel, BASE_W / 2, barY - 7, 4, aCol, 'center');
        ctx.restore();
      }
      const hpPct   = totalMax > 0 ? Math.round((totalHp / totalMax) * 100) : 0;
      const labCol  = ratio > 0.5 ? COL.green : ratio > 0.25 ? COL.yellow : COL.red;
      drawRetroText('HP ' + hpPct + '%', BASE_W / 2, barY + 12, 5, labCol, 'center');
    } else {
      // Multi-boss: per-segment labels above bar + ENRAGE note if any boss enraged
      let segStart = 0;
      for (let i = 0; i < bosses.length; i++) {
        const mb = bosses[i];
        const segFrac = mb.maxHp / totalMax;
        const segCX   = 10 + Math.round(barW * (segStart + segFrac / 2));
        segStart += segFrac;

        const aLabel = _archLabel[mb.archetype] || 'BOS';
        const aCol   = _archCol[mb.archetype]   || '#fc8';
        const isDead = !mb.alive;
        const isP2   = mb.phase2 && mb.alive;

        ctx.save();
        if (isDead) {
          ctx.globalAlpha = 0.25;
          drawRetroText('---', segCX, barY - 7, 4, '#555', 'center');
        } else {
          const labelText = isP2 ? (aLabel + '!!') : aLabel;
          const lCol = isP2 ? (_t % 10 < 5 ? '#f44' : aCol) : aCol;
          ctx.globalAlpha = isP2 ? (0.60 + 0.40 * Math.sin(_t * 0.25)) : 0.85;
          drawRetroText(labelText, segCX, barY - 7, 4, lCol, 'center');
        }
        ctx.restore();
      }
      // Compact ENRAGE notice (replaces full-width banner for multi-boss)
      if (anyEnrage) {
        const eB = _t % 10 < 5;
        ctx.save();
        ctx.globalAlpha = 0.85;
        drawRetroText('ENRAGE', BASE_W / 2, barY + 12, 5, eB ? COL.red : '#f80', 'center');
        ctx.restore();
      }
    }
  }

  // Power-ups
  for (const p of game.powerUps) drawPowerUp(p);

  // Player bullets — GAM-42 tier visuals
  for (const b of game.bullets) drawPlayerBullet(b.x, b.y, b.lvl ?? 1, b.kind, b._parryEcho, b._guardian ? b._gCol : null, b.crit, b.fork);

  // Enemy bullets
  for (const b of game.enemyBullets) drawEnemyBullet(b);

  // Engine trail
  drawExhaustDust();
  drawPlayerTrail();

  // Player (blink during invincibility)
  if (game.playerAlive && (game.invincibleTimer <= 0 || (game.invincibleTimer >> 2) % 2 === 0)) {
    const pcol = (game.ship && game.ship.color) || '#0cf';
    // PLAYER BUFF AURA — single highest-priority temp buff produces a colored
    // pulsing ring around the ship. Priority: laser > homing > wave > rapid > slow.
    let _buffCol = null;
    if ((game.laserTimer  || 0) > 0)      _buffCol = '#f6c';
    else if ((game.homingTimer || 0) > 0) _buffCol = '#0f8';
    else if ((game.waveTimer   || 0) > 0) _buffCol = '#6cf';
    else if ((game.rapidTimer  || 0) > 0) _buffCol = '#fc4';
    else if ((game.slowTimer   || 0) > 0) _buffCol = '#8ff';
    if (_buffCol) {
      ctx.save();
      ctx.globalAlpha = 0.35 + 0.20 * Math.sin(game.animFrame * 0.18);
      ctx.strokeStyle = _buffCol;
      ctx.lineWidth = 1;
      const _r = 10 + 1 * Math.sin(game.animFrame * 0.25);
      if (game.dualFighter) {
        ctx.beginPath(); ctx.arc(game.playerX - 8, game.playerY, _r, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(game.playerX + 8, game.playerY, _r, 0, Math.PI * 2); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(game.playerX, game.playerY, _r, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    }
    // (MAGNET FIELD RING removed — the magnet range still grows with combo
    // tier as a hidden mechanic but no visual ring competes for attention.)
    // SHIP IDLE BOB — when stationary and not dashing, gentle vertical sin breath
    // (±0.4px ≈ 10% of sprite height) for visual liveliness. Suppressed during
    // movement/dash so the ship feels responsive to player input.
    let _idleBob = 0;
    if (game.playerAlive && (game.dashTimer || 0) === 0
        && !(keys && (keys['ArrowLeft'] || keys['ArrowRight']
                      || keys['a'] || keys['A'] || keys['d'] || keys['D']))) {
      _idleBob = Math.sin(game.animFrame * 0.06) * 0.4;
    }
    const _drawPY = game.playerY + _idleBob;
    if (game.dualFighter) {
      drawShipTraitAura(game.playerX - 8, _drawPY, selectedShip);
      drawShipTraitAura(game.playerX + 8, _drawPY, selectedShip);
      drawPlayer(game.playerX - 8, _drawPY, pcol, game.lvl);
      drawPlayer(game.playerX + 8, _drawPY, pcol, game.lvl);
      // DUAL FIGHTER LINK BEAM — faint cyan tether between the two ships, visually
      // selling "paired" identity. Subtle pulse so it reads as energy, not static.
      ctx.save();
      const _dfP = 0.32 + 0.18 * Math.sin(game.animFrame * 0.22);
      ctx.globalAlpha = _dfP;
      ctx.fillStyle = '#0ff';
      ctx.fillRect(Math.round(game.playerX - 7), Math.round(_drawPY), 14, 1);
      // Small bright midpoint dot
      ctx.globalAlpha = _dfP * 1.5;
      ctx.fillStyle = '#fff';
      ctx.fillRect(Math.round(game.playerX), Math.round(_drawPY), 1, 1);
      ctx.restore();
    } else {
      drawShipTraitAura(game.playerX, _drawPY, selectedShip);
      drawPlayer(game.playerX, _drawPY, pcol, game.lvl);
    }
    // FIRE READY DOT — small pulse above ship nose when fire cooldown is 0.
    // Tactile cue that the next shot will fire immediately. Hidden during dash.
    // Color matches active weapon kind (laser/homing/wave/fork) so the player
    // reads next-shot type at a glance — gold fallback for the unmodded shot.
    if (game.playerAlive && (game.fireCooldown || 0) <= 0 && (game.dashTimer || 0) === 0) {
      const _frP = 0.55 + 0.30 * Math.sin(game.animFrame * 0.30);
      let _frCol = '#fc4';
      if      ((game.laserTimer  || 0) > 0) _frCol = '#f6c';
      else if ((game.homingTimer || 0) > 0) _frCol = '#0f8';
      else if ((game.waveTimer   || 0) > 0) _frCol = '#6cf';
      else if ((game.forkTimer   || 0) > 0) _frCol = '#fa0';
      ctx.save();
      ctx.globalAlpha = _frP;
      ctx.fillStyle = _frCol;
      if (game.dualFighter) {
        ctx.fillRect(Math.round(game.playerX - 8), Math.round(_drawPY - 6), 1, 1);
        ctx.fillRect(Math.round(game.playerX + 8), Math.round(_drawPY - 6), 1, 1);
      } else {
        ctx.fillRect(Math.round(game.playerX), Math.round(_drawPY - 6), 1, 1);
      }
      ctx.restore();
    }
    // (DASH and WITCH cooldown bars under the ship removed — they sat in the
    // player's line of sight and contributed to visual noise. The dash icon
    // glow on the ship body still signals dash-ready state.)
  }

  // Explosions
  for (const ex of game.explosions) drawExplosion(ex.x, ex.y, ex.timer, ex.maxTime);
  drawDebris();
  drawShockwaves();
  drawStrikeFx();
  drawMuzzleFlashes();

  // Pickup feedback (burst + sparks + floating text)
  for (const b of game.itemBursts) drawItemBurst(b);
  for (const s of game.hitSparks) drawHitSpark(s);
  for (const ft of game.floatTexts) drawFloatText(ft);

  drawLastStandOverlay();
  drawComboEdgeFlame();
  drawHUD();
}

// COMBO EDGE FLAME — screen-edge fire particles drifting upward when combo ≥ 30.
// Color tiers: gold (30-49), orange/red (50-99), rainbow cycle (100+). Subtle alpha
// 0.30 max so it never obscures gameplay. Deterministic positions from animFrame
// so no per-frame array allocation; particles loop after 360 frames.
function drawComboEdgeFlame() {
  if (!game) return;
  const c = game.combo || 0;
  if (c < 30) return;
  if (game.state !== STATE.PLAYING && game.state !== STATE.CHALLENGING
      && game.state !== STATE.BOSS_STAGE) return;
  const t = game.animFrame;
  let cols;
  if (c >= 100) cols = ['#f44', '#fa0', '#ff4', '#0f8', '#0cf', '#f6f'];
  else if (c >= 50) cols = ['#f44', '#f80', '#fc4'];
  else cols = ['#fc4', '#ff8', '#fa0'];
  ctx.save();
  // 8 particles total — 4 left edge, 4 right edge, drifting upward
  for (let i = 0; i < 8; i++) {
    const isLeft = i < 4;
    const phase = (i % 4) * 90;
    const lifeFrame = (t + phase) % 360;
    const yProg = lifeFrame / 360;
    const py = BASE_H - 10 - yProg * (BASE_H - 30);
    const px = isLeft
      ? 1 + Math.sin(yProg * Math.PI * 2 + i) * 1.5
      : BASE_W - 2 + Math.sin(yProg * Math.PI * 2 + i) * 1.5;
    const colIdx = (i + Math.floor(t / 8)) % cols.length;
    const alpha = (1 - yProg) * 0.30;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = cols[colIdx];
    ctx.fillRect(Math.round(px), Math.round(py), 1, 2);
  }
  ctx.restore();
}

function drawPauseScreen() {
  // Heavy backdrop dim with subtle grid pattern for distinct paused mood
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  ctx.fillStyle = 'rgba(0,170,255,0.06)';
  for (let yy = 0; yy < BASE_H; yy += 8) ctx.fillRect(0, yy, BASE_W, 1);

  const cy = BASE_H / 2;
  const panelW = 144, panelH = 168;
  const px = (BASE_W - panelW) / 2;
  const py = cy - panelH / 2;

  // Panel background
  ctx.fillStyle = 'rgba(0,30,60,0.88)';
  ctx.fillRect(px, py, panelW, panelH);

  // Corner brackets — color picks up the active game mode so the PAUSE panel
  // joins the 1UP / score / title mode-color cohesion. Challenge red / daily
  // green / normal yellow.
  const _pBkCol = game.challengeMode ? COL.red
                : game.dailyMode    ? COL.green
                : COL.yellow;
  ctx.fillStyle = _pBkCol;
  const corner = 6;
  ctx.fillRect(px, py, corner, 1); ctx.fillRect(px, py, 1, corner);
  ctx.fillRect(px + panelW - corner, py, corner, 1); ctx.fillRect(px + panelW - 1, py, 1, corner);
  ctx.fillRect(px, py + panelH - 1, corner, 1); ctx.fillRect(px, py + panelH - corner, 1, corner);
  ctx.fillRect(px + panelW - corner, py + panelH - 1, corner, 1); ctx.fillRect(px + panelW - 1, py + panelH - corner, 1, corner);

  // Pause icon glyph (two vertical bars) — top of panel
  ctx.fillStyle = _pBkCol;
  ctx.fillRect(BASE_W/2 - 14, py + 8, 4, 12);
  ctx.fillRect(BASE_W/2 + 10, py + 8, 4, 12);

  // PAUSED title with glow — color picks up the active game mode so the whole
  // panel (corner brackets, pause icon, title, glow) reads as a single mode
  // identity.
  ctx.save();
  const glow = 0.6 + 0.4 * Math.sin(game.animFrame * 0.1);
  ctx.shadowColor = _pBkCol;
  ctx.shadowBlur = 8 * glow;
  drawRetroText('PAUSED', BASE_W/2, py + 32, 11, _pBkCol);
  ctx.restore();

  // Run summary
  let ry = py + 46;
  function infoRow(label, value, vCol) {
    drawRetroText(label, px + 10, ry, 6, COL.cyan, 'left');
    drawRetroText(value, px + panelW - 10, ry, 6, vCol || COL.white, 'right');
    ry += 8;
  }
  // Ship + score + lives + stage + combo (current run snapshot)
  const ship = (game.ship && game.ship.name) || 'GAM-42';
  const shipCol = (game.ship && game.ship.color) || '#0cf';
  const acc = game.stats && game.stats.shotsFired
    ? Math.round((game.stats.shotsHit / game.stats.shotsFired) * 100) + '%' : '--';
  const totalSec = Math.floor((game.runFrames || 0) / 60);
  const tm = String(Math.floor(totalSec / 60)).padStart(2, '0') + ':' + String(totalSec % 60).padStart(2, '0');
  infoRow('SHIP',  ship, shipCol);
  infoRow('STAGE', String(game.stage || 1));
  infoRow('SCORE', fmtScore(game.score || 0));
  infoRow('LIVES', String(game.lives || 0), game.challengeMode ? COL.red : '#fff');
  infoRow('COMBO', game.combo >= 3 ? '×' + game.combo + ' (' + (game.comboBonusAccum || 0) + ')' : '—');
  infoRow('TIME',  tm);
  infoRow('ACC',   acc);
  // ry is now py+102

  // PAUSE BIOME WHEEL — visualize the 8-biome cycle and player's current
  // position in it. Active only at stage >= 8 (when biomes turn on). Sits
  // top-right of the panel, ABOVE the info rows (which start at py+46) so
  // it no longer overlaps the SHIP row. Radius shrunk 14→10 to clear it.
  if (typeof biomeForStage === 'function' && game.stage >= 8) {
    const wheelCx = px + panelW - 18;
    const wheelCy = py + 22;
    const wheelR = 10;
    const _curBiome = biomeForStage(game.stage);
    const _order = ['planet', 'dawn', 'asteroid', 'ice', 'gasGiant', 'corona', 'blackhole', 'starfield'];
    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(wheelCx, wheelCy, wheelR, 0, Math.PI * 2);
    ctx.stroke();
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 - Math.PI / 2;
      const pxw = wheelCx + Math.cos(a) * wheelR;
      const pyw = wheelCy + Math.sin(a) * wheelR;
      const _bid = _order[i];
      const _isCur = _bid === _curBiome;
      // Current biome dot breathes (matches CYCLE DOT current-pulse pattern).
      ctx.globalAlpha = _isCur
        ? (0.85 + 0.15 * Math.sin(game.animFrame * 0.2))
        : 0.45;
      ctx.fillStyle = BIOME_NAMES[_bid] ? BIOME_NAMES[_bid].col : '#fff';
      const sz = _isCur ? 4 : 2;
      ctx.fillRect(pxw - sz/2, pyw - sz/2, sz, sz);
    }
    ctx.restore();
  }

  // ── TACTICAL CONSOLE DIVIDER ──
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#0af';
  ctx.fillRect(px + 12, ry + 2, panelW - 24, 1);
  ctx.restore();

  // WEAPON BUFF TIMER BARS — depleting color bars for every active timed power-up.
  // Gives real resource visibility during pause: player knows exactly what's left
  // before committing to a dive / long engagement.
  {
    const _buffs = [
      { t: game.rapidTimer  || 0, max: RAPID_DURATION,  label: 'R', col: '#fc4' },
      { t: game.waveTimer   || 0, max: WAVE_DURATION,   label: 'W', col: '#6cf' },
      { t: game.homingTimer || 0, max: HOMING_DURATION, label: 'H', col: '#0f8' },
      { t: game.laserTimer  || 0, max: LASER_DURATION,  label: 'L', col: '#f6c' },
      { t: game.slowTimer   || 0, max: SLOW_DURATION,   label: 'T', col: '#8ff' }
    ].filter(b => b.t > 0);

    const _barX = px + 20;
    const _barW = panelW - 44;
    let _buffY = ry + 7;

    if (_buffs.length === 0) {
      // Use the buffer space for active mutation reminder (no buffs to show)
      if (game.stageMutation) {
        const _m = game.stageMutation;
        const _mblink = (game.animFrame >> 3) % 2 === 0 ? _m.color : '#fff';
        ctx.save();
        ctx.globalAlpha = 0.80;
        drawRetroText('★ ' + _m.label, BASE_W/2, _buffY + 3, 5, _mblink);
        ctx.globalAlpha = 0.50;
        drawRetroText(_m.desc, BASE_W/2, _buffY + 12, 4, '#aaa');
        ctx.restore();
      } else {
        ctx.save();
        ctx.globalAlpha = 0.28;
        drawRetroText('NO ACTIVE BUFFS', BASE_W/2, _buffY + 6, 4, '#666');
        ctx.restore();
      }
    } else {
      // Stage mutation compact badge (top-right of buff section, same line as first bar)
      if (game.stageMutation) {
        ctx.save();
        ctx.globalAlpha = 0.60;
        drawRetroText('★' + game.stageMutation.label.split(' ')[0], px + panelW - 10, _buffY, 4, game.stageMutation.color, 'right');
        ctx.restore();
      }
      for (const b of _buffs) {
        const _ratio = b.t / b.max;
        const _secLeft = (b.t / 60).toFixed(1) + 's';
        ctx.save();
        ctx.globalAlpha = 0.90;
        drawRetroText(b.label, px + 10, _buffY, 5, b.col, 'left');
        // Track (dim background)
        ctx.globalAlpha = 0.22;
        ctx.fillStyle = b.col;
        ctx.fillRect(_barX, _buffY - 1, _barW, 4);
        // Active fill (depleting left-to-right)
        ctx.globalAlpha = 0.85;
        ctx.fillRect(_barX, _buffY - 1, Math.round(_barW * _ratio), 4);
        ctx.restore();
        ctx.save();
        ctx.globalAlpha = 0.80;
        drawRetroText(_secLeft, px + panelW - 10, _buffY, 5, b.col, 'right');
        ctx.restore();
        _buffY += 7;
      }
    }
  }

  // Achievement progress mini-bar (just above controls hint)
  {
    const totalAch = Object.keys(ACHIEVEMENTS).length;
    const got = unlockedAchievements.size;
    const ratio = totalAch > 0 ? got / totalAch : 0;
    const barW = panelW - 30;
    const bx = px + 15;
    const by = py + panelH - 16;
    drawRetroText('ACH', px + 8, by + 1, 5, COL.cyan, 'left');
    ctx.fillStyle = '#222';
    ctx.fillRect(bx, by, barW, 2);
    ctx.fillStyle = COL.magenta;
    ctx.fillRect(bx, by, Math.round(barW * ratio), 2);
    drawRetroText(got + '/' + totalAch, px + panelW - 8, by + 1, 5, COL.magenta, 'right');
  }
  // Controls hint at bottom
  drawRetroText('P RESUME   H HELP   Q QUIT', BASE_W/2, py + panelH - 6, 5, COL.gray);

  // FORMATION RADAR — live minimap of enemy and player positions drawn below the
  // panel. Reads from game.enemies (PLAYING), active challenge wave (CHALLENGING),
  // and game.megaBosses (BOSS_STAGE). Colored dots by enemy type.
  {
    const _mapW = 140, _mapH = 30;
    const _mapX = Math.round(BASE_W/2 - _mapW/2);
    const _mapY = py + panelH + 7;

    // Background + cyan border
    ctx.save();
    ctx.globalAlpha = 0.72;
    ctx.fillStyle = '#030610';
    ctx.fillRect(_mapX, _mapY, _mapW, _mapH);
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#0af';
    ctx.fillRect(_mapX, _mapY, _mapW, 1);
    ctx.fillRect(_mapX, _mapY + _mapH - 1, _mapW, 1);
    ctx.fillRect(_mapX, _mapY, 1, _mapH);
    ctx.fillRect(_mapX + _mapW - 1, _mapY, 1, _mapH);
    // Corner pip
    ctx.globalAlpha = 0.38;
    ctx.fillRect(_mapX + 1, _mapY + 1, 2, 1);
    ctx.fillRect(_mapX + 1, _mapY + 1, 1, 2);
    ctx.restore();

    // Scale game coords to map inner area
    const _iX = _mapX + 2, _iY = _mapY + 2, _iW = _mapW - 4, _iH = _mapH - 4;
    const _toMX = gx => Math.round(_iX + (gx / BASE_W) * _iW);
    const _toMY = gy => Math.round(_iY + (gy / BASE_H) * _iH);

    // Enemy source — challenge wave if active, otherwise formation array
    const _challActive = Array.isArray(game.challengeWaves) && game.challengeWaves.length > 0
                      && (game.challengeWaveIdx || 0) < game.challengeWaves.length;
    const _radarEnemies = _challActive
      ? ((game.challengeWaves[game.challengeWaveIdx || 0]) || []).filter(e => e && e.alive !== false)
      : (game.enemies || []).filter(e => e && e.alive !== false);
    const _radarBosses = (game.megaBosses || []).filter(mb => mb && mb.alive);

    const _dotCol = {
      boss: '#f88', butterfly: '#0cf', bee: '#ff0', goldenBee: '#fa0',
      mirror: '#f8f', kamikaze: '#f44', shielded: '#fa0', splitter: '#0f4',
      ufo: '#c6f', hoverer: '#8ff', minibee: '#ff8'
    };

    ctx.save();
    for (const e of _radarEnemies) {
      if (!e) continue;
      const _dx = _toMX(e.x || 0);
      const _dy = _toMY(e.y || 0);
      ctx.globalAlpha = 0.80;
      ctx.fillStyle = _dotCol[e.type] || '#fff';
      ctx.fillRect(_dx - 1, _dy - 1, 2, 2);
    }
    // Mega-bosses: 3×3 red blip
    for (const mb of _radarBosses) {
      const _bx2 = _toMX(mb.x || 0);
      const _by2 = _toMY(mb.y || 0);
      ctx.globalAlpha = 0.90;
      ctx.fillStyle = '#f44';
      ctx.fillRect(_bx2 - 1, _by2 - 1, 3, 3);
    }
    // Player: ship-color blip (slightly wider to distinguish)
    if (game.playerAlive) {
      const _plx = _toMX(game.playerX || BASE_W/2);
      const _ply = _toMY(game.playerY || BASE_H - 24);
      ctx.globalAlpha = 0.95;
      ctx.fillStyle = (game.ship && game.ship.color) || '#0cf';
      ctx.fillRect(_plx - 1, _ply - 1, 3, 2);
    }
    ctx.restore();

    // Labels: RADAR left, target count right
    const _nTargets = _radarEnemies.length + _radarBosses.length;
    ctx.save();
    ctx.globalAlpha = 0.48;
    drawRetroText('RADAR', _mapX + 3, _mapY + 3, 4, '#0af', 'left');
    ctx.globalAlpha = _nTargets > 0 ? 0.68 : 0.32;
    drawRetroText(_nTargets + ' TGT', _mapX + _mapW - 3, _mapY + 3, 4, _nTargets > 0 ? '#f88' : '#555', 'right');
    ctx.restore();
  }
}
