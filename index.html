    const entryBoost = game.stageFrames < 60 ? (1 - game.stageFrames / 60) * 0.10 : 0;
    ctx.save();
    ctx.globalAlpha = 0.08 + entryBoost;
    ctx.fillStyle = '#a00';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
    ctx.restore();
  } else if (game.state === STATE.CHALLENGING) {
    const entryBoost = game.stageFrames < 60 ? (1 - game.stageFrames / 60) * 0.08 : 0;
    ctx.save();
    ctx.globalAlpha = 0.06 + entryBoost;
    ctx.fillStyle = '#a0a';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
    ctx.restore();
  }
  if (!p) return;
  // Wash tint over playfield
  ctx.fillStyle = p.tint;
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  // Two slowly drifting nebula blobs
  const t = game.animFrame;
  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = p.neb[0];
  const x1 = (t * 0.05) % (BASE_W + 80) - 40;
  ctx.fillRect(x1, 40, 50, 30);
  ctx.fillRect(x1 + 10, 30, 30, 12);
  ctx.fillRect(x1 - 8, 55, 30, 14);
  ctx.fillStyle = p.neb[1];
  const x2 = (BASE_W - (t * 0.04) % (BASE_W + 80));
  ctx.fillRect(x2, 150, 40, 24);
  ctx.fillRect(x2 + 4, 142, 24, 10);
  ctx.fillRect(x2 - 6, 168, 24, 10);
  ctx.restore();
}

// Pixel arrow glyphs (anchored from a single point)
function drawArrowR(x, y) {
  ctx.fillRect(x, y - 2, 4, 5);
  ctx.fillRect(x + 4, y - 1, 2, 3);
  ctx.fillRect(x + 6, y, 1, 1);
}
function drawArrowL(x, y) {
  ctx.fillRect(x + 3, y - 2, 4, 5);
  ctx.fillRect(x + 1, y - 1, 2, 3);
  ctx.fillRect(x, y, 1, 1);
}
function drawArrowD(x, y) {
  ctx.fillRect(x - 2, y, 5, 4);
  ctx.fillRect(x - 1, y + 4, 3, 2);
  ctx.fillRect(x, y + 6, 1, 1);
}

// Direction-of-entry telegraph for challenge stages
function drawChallengeTelegraph() {
  if (game.state !== STATE.CHALLENGING) return;
  if (game.challengeWaveTimer <= 0) return;
  const nextWave = game.challengeWaves[game.challengeWaveIdx];
  if (!nextWave || nextWave.length === 0) return;
  const pattern = nextWave[0].pattern;
  // Slide the arrow horizontally for animation
  const slide = (game.animFrame % 16) - 8;
  const yPulse = 0.6 + 0.4 * Math.sin(game.animFrame * 0.3);
  ctx.save();
  ctx.globalAlpha = yPulse;
  ctx.fillStyle = '#ff4';
  if (pattern === 'sweep_lr' || pattern === 'double_row') {
    drawArrowR(2 + slide / 4, BASE_H/2);
    drawArrowR(2 + slide / 4, BASE_H/2 + 30);
  } else if (pattern === 'sweep_rl') {
    drawArrowL(BASE_W - 9 - slide / 4, BASE_H/2);
    drawArrowL(BASE_W - 9 - slide / 4, BASE_H/2 + 30);
  } else if (pattern === 'pincer') {
    drawArrowR(2 + slide / 4, BASE_H/2);
    drawArrowL(BASE_W - 9 - slide / 4, BASE_H/2);
  } else if (pattern === 'top_down') {
    drawArrowD(BASE_W/4, 26 + slide / 4);
    drawArrowD(BASE_W/2, 26 + slide / 4);
    drawArrowD(BASE_W * 3/4, 26 + slide / 4);
  } else if (pattern === 'diagonal') {
    drawArrowR(2 + slide / 4, BASE_H/3);
    drawArrowL(BASE_W - 9 - slide / 4, BASE_H/3);
  }
  ctx.restore();
}

// WAVE TACTICAL HUD — persistent header strip for CHALLENGING stages showing
// wave progress dots, per-wave perfect tracking, and incoming wave composition preview.
// Drawn on top of gameplay layer so the strip is always readable.
function drawChallengeWaveHUD() {
  if (game.state !== STATE.CHALLENGING) return;
  const totalW  = game.challengeWaves ? game.challengeWaves.length : 8;
  const curIdx  = game.challengeWaveIdx || 0;
  const flash   = game.waveClrFlash   || [];
  const perfect = game.waveClrPerfect || [];
  const _t      = game.animFrame;

  // --- STRIP BACKGROUND (y=26, h=13) ---
  ctx.save();
  ctx.globalAlpha = 0.65;
  ctx.fillStyle = '#0a000a';
  ctx.fillRect(0, 26, BASE_W, 13);
  ctx.globalAlpha = 0.50;
  ctx.fillStyle = '#803080';
  ctx.fillRect(0, 26, BASE_W, 1);    // top border
  ctx.fillRect(0, 38, BASE_W, 1);    // bottom border
  ctx.restore();

  // --- WAVE LABEL (left) ---
  const _waveNum  = Math.min(curIdx + 1, totalW);
  const _waveText = 'W' + _waveNum + '/' + totalW;
  ctx.save();
  ctx.globalAlpha = 0.90;
  drawRetroText(_waveText, 5, 29, 5, '#f6f', 'left');
  ctx.restore();

  // --- 8 WAVE DOTS (center) ---
  // Each dot: 4×4 px, 3px gap between. Total = 8×4+7×3=53px. Center at 112 → startX=85.
  const _dotW   = 4;
  const _dotGap = 3;
  const _dotTotal = totalW * _dotW + (totalW - 1) * _dotGap;
  const _dotStartX = Math.round(BASE_W / 2 - _dotTotal / 2);
  const _dotY = 30;

  for (let _i = 0; _i < totalW; _i++) {
    const _dx = _dotStartX + _i * (_dotW + _dotGap);
    const _flsh = (flash[_i] || 0);
    const _isPerfect = perfect[_i] || false;
    const _isCleared = _i < curIdx;
    const _isCurrent = _i === curIdx;

    ctx.save();
    if (_flsh > 0) {
      // Flash: bright white pop fading to settled color
      ctx.globalAlpha = Math.min(1, _flsh / 10);
      ctx.fillStyle = '#fff';
      ctx.fillRect(_dx - 1, _dotY - 1, _dotW + 2, _dotW + 2);
      ctx.globalAlpha = 1;
    }
    if (_isCleared) {
      // Cleared — solid magenta block
      ctx.globalAlpha = 0.90;
      ctx.fillStyle = _isPerfect ? '#f6f' : '#804080';
      ctx.fillRect(_dx, _dotY, _dotW, _dotW);
      // Perfect gold pip (1×2 below dot, inside strip)
      if (_isPerfect) {
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = '#fc4';
        ctx.fillRect(_dx + 1, _dotY + _dotW + 1, 2, 1);
      }
    } else if (_isCurrent) {
      // Current wave — pulsing outline + small inner fill
      const _pulse = 0.55 + 0.45 * Math.sin(_t * 0.22);
      ctx.globalAlpha = _pulse;
      ctx.fillStyle = '#f6f';
      ctx.fillRect(_dx, _dotY, _dotW, 1);
      ctx.fillRect(_dx, _dotY + _dotW - 1, _dotW, 1);
      ctx.fillRect(_dx, _dotY, 1, _dotW);
      ctx.fillRect(_dx + _dotW - 1, _dotY, 1, _dotW);
      // Inner 2×2 center
      ctx.globalAlpha = _pulse * 0.55;
      ctx.fillStyle = '#f6f';
      ctx.fillRect(_dx + 1, _dotY + 1, 2, 2);
    } else {
      // Future — dim outline
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = '#f6f';
      ctx.fillRect(_dx, _dotY, _dotW, 1);
      ctx.fillRect(_dx, _dotY + _dotW - 1, _dotW, 1);
      ctx.fillRect(_dx, _dotY, 1, _dotW);
      ctx.fillRect(_dx + _dotW - 1, _dotY, 1, _dotW);
    }
    ctx.restore();
  }

  // --- INCOMING WAVE PATTERN LABEL (right) + ENEMY COMPOSITION PREVIEW (below strip) ---
  if ((game.challengeWaveTimer || 0) > 0 && curIdx < totalW) {
    const _nextWave = game.challengeWaves[curIdx];
    if (_nextWave && _nextWave.length > 0) {
      const _pat = _nextWave[0].pattern;
      const _patNames = {
        sweep_lr: 'SWEEP>', sweep_rl: '<SWEEP', pincer: 'PINCER',
        top_down: 'DROP', diagonal: 'DIAG', double_row: '2ROW'
      };
      const _patLabel = _patNames[_pat] || _pat;
      const _telegraph = game.challengeWaveTimer;
      const _fade = Math.min(1, _telegraph / 10);

      ctx.save();
      ctx.globalAlpha = _fade * 0.80;
      drawRetroText(_patLabel, BASE_W - 4, 29, 5, '#ff4', 'right');
      ctx.restore();

      // Enemy composition preview row: 16 tiny dots below strip at y=40
      // Colors: boss=#f88, butterfly=#0ff, bee=#ff0
      const _typeCol = { boss: '#f88', butterfly: '#0ff', bee: '#ff0' };
      const _previewDotW = 2, _previewGap = 3;
      const _previewTotal = _nextWave.length * (_previewDotW + _previewGap) - _previewGap;
      const _previewX0 = Math.round(BASE_W / 2 - _previewTotal / 2);
      ctx.save();
      ctx.globalAlpha = _fade * 0.75;
      for (let _pi = 0; _pi < _nextWave.length; _pi++) {
        const _pe = _nextWave[_pi];
        ctx.fillStyle = _typeCol[_pe.type] || '#fff';
        ctx.fillRect(_previewX0 + _pi * (_previewDotW + _previewGap), 40, _previewDotW, 2);
      }
      ctx.restore();
    }
  }

  // --- PERFECT WAVE COUNT (right side, below pattern label, when no telegraph) ---
  if ((game.challengeWaveTimer || 0) <= 0 && (game.stagePerfectWaves || 0) > 0) {
    const _pw = game.stagePerfectWaves;
    ctx.save();
    ctx.globalAlpha = 0.70;
    drawRetroText(_pw + ' PERF', BASE_W - 4, 29, 5, '#fc4', 'right');
    ctx.restore();
  }
}

function drawShootingStar(ss) {
  const lifeRatio = ss.life / ss.maxLife;
  ctx.save();
  // WISH variant — gold trail + larger pulsing head. Player can shoot it for bonus.
  const headCol = ss.wish ? '#fc4' : '#fff';
  const trailHotCol = ss.wish ? '#ff8' : '#fff';
  const trailColdCol = ss.wish ? '#fa0' : '#cef';
  // Trail
  for (let i = 0; i < 6; i++) {
    ctx.globalAlpha = (1 - lifeRatio) * (1 - i / 6) * 0.9;
    ctx.fillStyle = i < 2 ? trailHotCol : trailColdCol;
    const tx = ss.x - ss.vx * i * 1.5;
    const ty = ss.y - ss.vy * i * 1.5;
    ctx.fillRect(tx, ty, 1, 1);
  }
  // Bright head — wish variant gets a pulsing 3×3 outline for visibility
  ctx.globalAlpha = 1 - lifeRatio;
  ctx.fillStyle = headCol;
  ctx.fillRect(ss.x, ss.y, 2, 2);
  if (ss.wish) {
    const pulse = 0.4 + 0.6 * Math.abs(Math.sin((game && game.animFrame || 0) * 0.4));
    ctx.globalAlpha = (1 - lifeRatio) * pulse;
    ctx.fillStyle = '#fff';
    ctx.fillRect(ss.x - 1, ss.y - 1, 1, 1);
    ctx.fillRect(ss.x + 2, ss.y - 1, 1, 1);
    ctx.fillRect(ss.x - 1, ss.y + 2, 1, 1);
    ctx.fillRect(ss.x + 2, ss.y + 2, 1, 1);
  }
  ctx.restore();
}

// Power-up pickup burst — expanding ring + sparkle
function drawItemBurst(b) {
  const max = 24;
  const p = b.life / max;
  const r = 2 + p * 14;
  ctx.save();
  ctx.globalAlpha = 1 - p;
  // Outer ring
  ctx.fillStyle = b.color;
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2;
    ctx.fillRect(b.x + Math.cos(a) * r - 1, b.y + Math.sin(a) * r - 1, 2, 2);
  }
  // Inner ring (offset, white)
  ctx.globalAlpha = (1 - p) * 0.7;
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + Math.PI / 6;
    const ir = r * 0.55;
    ctx.fillRect(b.x + Math.cos(a) * ir, b.y + Math.sin(a) * ir, 1, 1);
  }
  ctx.restore();
}

// Floating pickup text (rises and fades)
function drawFloatText(ft) {
  ctx.save();
  // Score-only texts (+NNN) render smaller and fade faster to reduce visual noise
  let txt = ft.text;
  if (typeof ft.countTo === 'number') {
    const dur = ft.countDuration || 30;
    const elapsed = (ft.maxLife || dur) - ft.life;
    const t = Math.max(0, Math.min(1, elapsed / dur));
    const v = Math.round(ft.countTo * t);
    txt = (ft.prefix || '') + v + (ft.suffix || '');
  }
  const _isScore = /^\+\d+$/.test(txt);
  const _sz    = _isScore ? Math.max(4, (ft.size || 7) - 2) : (ft.size || 7);
  const _alpha = _isScore ? Math.min(0.72, ft.life / 18) : Math.min(1, ft.life / 25);
  ctx.globalAlpha = _alpha;
  // Optional ft.glow — numeric shadowBlur value picked up by the floattext so
  // apex events (S grade, peak milestones) can carry a glow without bespoke
  // render paths.
  if (ft.glow) {
    ctx.shadowColor = ft.color;
    ctx.shadowBlur = ft.glow;
  }
  drawRetroText(txt, ft.x, ft.y, _sz, ft.color);
  ctx.restore();
}

// Bullet impact spark — radial pop of 6 particles
function drawHitSpark(s) {
  if (s.life < 0) return;
  const max = 12;
  const p = s.life / max;
  const r = p * 8;
  ctx.save();
  ctx.globalAlpha = 1 - p;
  // BIOME SPARK GLOW — when a biome is active, replace one of the 6 ray colors
  // (every 3rd) with biome col so each spark carries environment hint without
  // losing the yellow/white core identity.
  let _bsCol = null;
  if (game && typeof biomeForStage === 'function') {
    const _bid = biomeForStage(game.stage || 1);
    if (_bid && BIOME_NAMES && BIOME_NAMES[_bid]) _bsCol = BIOME_NAMES[_bid].col;
  }
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + s.life * 0.05;
    const px = Math.cos(a) * r;
    const py = Math.sin(a) * r;
    ctx.fillStyle = (_bsCol && i % 3 === 0) ? _bsCol : (i % 2 === 0 ? '#ff4' : '#fff');
    const sz = 2 - p * 1.5;
    ctx.fillRect(s.x + px - sz / 2, s.y + py - sz / 2, sz, sz);
  }
  // Bright center flash (first 4 frames)
  if (s.life < 4) {
    ctx.globalAlpha = 1 - s.life / 4;
    ctx.fillStyle = '#fff';
    ctx.fillRect(s.x - 2, s.y - 2, 4, 4);
  }
  ctx.restore();
}

// GAM-42: Bullet transformation — 3 visual tiers keyed to P (Power) level
function drawPlayerBullet(x, y, lvl, kind, parryEcho, guardianCol, crit, fork) {
  // CRIT bullet halo — gold pulse around the bullet during flight. Crits are 4%
  // chance so this visual feedback is rare and rewarding. Drawn FIRST so body
  // layers cover halo edges.
  if (crit) {
    ctx.save();
    const _cP = 0.55 + 0.30 * Math.sin(game.animFrame * 0.40);
    ctx.globalAlpha = 0.55 * _cP;
    ctx.fillStyle = '#fc4';
    ctx.fillRect(x - 3, y - 4, 6, 1);
    ctx.fillRect(x - 3, y + 3, 6, 1);
    ctx.fillRect(x - 4, y - 3, 1, 6);
    ctx.fillRect(x + 3, y - 3, 1, 6);
    // Corner gold dots
    ctx.globalAlpha = _cP;
    ctx.fillRect(x - 3, y - 4, 1, 1);
    ctx.fillRect(x + 3, y - 4, 1, 1);
    ctx.fillRect(x - 3, y + 3, 1, 1);
    ctx.fillRect(x + 3, y + 3, 1, 1);
    ctx.restore();
  }
  // GUARDIAN bullet glow — variant-color outer halo around standard bullet so player
  // can distinguish their own fire from the escort drone's. Drawn FIRST so subsequent
  // bullet body layers cover the halo edges.
  if (guardianCol) {
    ctx.save();
    const _gP = 0.45 + 0.25 * Math.sin(game.animFrame * 0.35);
    ctx.globalAlpha = 0.45 * _gP;
    ctx.fillStyle = guardianCol;
    ctx.fillRect(x - 2, y - 4, 4, 1);
    ctx.fillRect(x - 2, y + 3, 4, 1);
    ctx.fillRect(x - 3, y - 3, 1, 6);
    ctx.fillRect(x + 2, y - 3, 1, 6);
    ctx.restore();
    // Continue to normal bullet body draw for the core (small white pulse on top)
  }
  // PARRY ECHO bullet — deflected enemy projectile returned by perfect parry.
  // Distinct cyan body + cross-spark marker so player sees their reflected shot.
  if (parryEcho) {
    ctx.save();
    const _eP = 0.65 + 0.30 * Math.sin(game.animFrame * 0.45);
    // Outer cyan halo
    ctx.globalAlpha = 0.45 * _eP;
    ctx.fillStyle = '#0ff';
    ctx.fillRect(x - 3, y - 3, 6, 6);
    // White core
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 1, y - 1, 2, 2);
    // Cross spark — 4 cardinal accents (parry "X" reflection marker)
    ctx.fillStyle = '#0ff';
    ctx.fillRect(x,     y - 4, 1, 1);
    ctx.fillRect(x,     y + 3, 1, 1);
    ctx.fillRect(x - 4, y,     1, 1);
    ctx.fillRect(x + 3, y,     1, 1);
    ctx.restore();
    return;
  }
  // LASER bullets — bright vertical beam segment with pulsing white core + outer glow.
  // Drawn as a 3-layer stack: outer halo (cyan), mid (white-blue), core (white).
  if (kind === 'laser') {
    ctx.save();
    const pulse = 0.7 + 0.3 * Math.sin(game.animFrame * 0.6);
    ctx.globalAlpha = 0.35 * pulse;
    ctx.fillStyle = '#0ff';
    ctx.fillRect(x - 3, y - 8, 6, 16);
    ctx.globalAlpha = 0.7 * pulse;
    ctx.fillStyle = '#9ef';
    ctx.fillRect(x - 2, y - 9, 4, 18);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 1, y - 10, 2, 20);
    ctx.restore();
    return;
  }
  // HOMING bullets — cyan diamond with rotating spark ring; piercing-style look.
  if (kind === 'homing') {
    ctx.save();
    ctx.globalAlpha = 0.55 + 0.25 * Math.sin(game.animFrame * 0.5);
    ctx.fillStyle = '#0ef';
    ctx.fillRect(x - 3, y - 3, 6, 6);
    ctx.restore();
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 1, y - 2, 2, 4);
    ctx.fillStyle = '#0ff';
    ctx.fillRect(x, y - 3, 1, 1);
    ctx.fillRect(x - 2, y, 1, 1);
    ctx.fillRect(x + 1, y, 1, 1);
    ctx.fillRect(x, y + 2, 1, 1);
    return;
  }
  // WAVE bullets get a pink/magenta halo regardless of P-tier so the buff is obvious.
  if (kind === 'wave') {
    ctx.save();
    ctx.globalAlpha = 0.55 + 0.25 * Math.sin(game.animFrame * 0.4);
    ctx.fillStyle = '#f8a';
    ctx.fillRect(x - 3, y - 4, 6, 8);
    ctx.restore();
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 1, y - 3, 2, 6);
    ctx.fillStyle = '#f6f';
    ctx.fillRect(x, y - 4, 1, 1);
    ctx.fillRect(x - 1, y - 2, 1, 1);
    ctx.fillRect(x + 1, y, 1, 1);
    ctx.fillRect(x - 1, y + 2, 1, 1);
    return;
  }
  if (lvl >= 3) {
    // Lv3 Shard trail — green crystal echoes behind
    ctx.save();
    for (let i = 1; i <= 3; i++) {
      ctx.globalAlpha = 0.32 - i * 0.08;
      ctx.fillStyle = '#0f8';
      ctx.fillRect(x - 2, y + 4 + i * 3, 4, 2);
      ctx.fillStyle = '#aff';
      ctx.fillRect(x - 1, y + 4 + i * 3, 2, 1);
    }
    ctx.restore();
    // Lv3 Shard — emerald polyhedron diamond
    ctx.fillStyle = '#0f8';
    ctx.beginPath();
    ctx.moveTo(x,     y - 7); // top apex
    ctx.lineTo(x + 3, y - 2); // upper-right
    ctx.lineTo(x + 2, y + 3); // lower-right
    ctx.lineTo(x,     y + 6); // bottom apex
    ctx.lineTo(x - 2, y + 3); // lower-left
    ctx.lineTo(x - 3, y - 2); // upper-left
    ctx.closePath();
    ctx.fill();
    // bright green facet highlight
    ctx.fillStyle = '#aff';
    ctx.beginPath();
    ctx.moveTo(x,     y - 7);
    ctx.lineTo(x + 3, y - 2);
    ctx.lineTo(x,     y - 1);
    ctx.closePath();
    ctx.fill();
    // core glint
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 1, y - 4, 1, 2);
  } else if (lvl >= 2) {
    // Lv2 Nova trail — gold streak behind
    ctx.save();
    for (let i = 1; i <= 3; i++) {
      ctx.globalAlpha = 0.30 - i * 0.07;
      ctx.fillStyle = '#fb0';
      ctx.fillRect(x - 2, y + 4 + i * 3, 4, 2);
      ctx.fillStyle = '#ffd';
      ctx.fillRect(x - 1, y + 4 + i * 3, 2, 1);
    }
    ctx.restore();
    // Lv2 Nova — gold/white cylinder
    ctx.fillStyle = '#fb0';
    ctx.fillRect(x - 2, y - 5, 4, 9); // gold body
    ctx.fillStyle = '#ffd';
    ctx.fillRect(x - 1, y - 5, 2, 3); // white highlight stripe
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 2, y - 6, 4, 2); // bright white cap
    ctx.fillStyle = '#a60';
    ctx.fillRect(x - 2, y + 4, 4, 1); // dark base shadow
  } else {
    // Lv1 Sleek — blue/white slim beam (no trail to keep clean)
    ctx.fillStyle = '#6af';
    ctx.fillRect(x - 1, y - 1, 2, 5); // blue body
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 1, y - 3, 2, 3); // white leading tip
  }
  // FORK SIDE BULLET TINT — amber accent on side spread bullets so the FORK
  // power-up reads as a distinct effect (vs primary vertical shot which keeps
  // its weapon-kind look). Color matches the F label / forkTimer chip.
  if (fork) {
    ctx.save();
    ctx.globalAlpha = 0.65;
    ctx.fillStyle = '#fa0';
    ctx.fillRect(x - 2, y - 1, 4, 2);
    ctx.restore();
  }
}

// Power-up capsule — gem orb with halo, type icon, and orbiting sparkle
function drawPowerUp(p) {
  const x = p.x, y = p.y, t = game.animFrame;
  // (Blinking RARE label and despawn-warning ring removed in cleanup pass —
  // both contributed to the heavy blink that disturbed gameplay reads.
  // Existing trail + miss-floor sparks still telegraph the pickup falling.)
  // POWERUP PROXIMITY GLOW — small pulsing ring when player is within 30px.
  // Helps targeting under bullet pressure. Skipped if magnetic perk active
  // (its own dashed-line aura already telegraphs proximity).
  if (game.playerAlive && game.activePerk !== 'magnetic') {
    const _dxp = x - game.playerX;
    const _dyp = y - game.playerY;
    const _d2 = _dxp * _dxp + _dyp * _dyp;
    if (_d2 < 900) { // <30 px
      const _puCols = { S:'#0df', N:'#1e6', P:'#e3e', T:'#5af', R:'#fc4',
                        W:'#f6a', H:'#0cf', B:'#f44', L:'#fff', E:'#4f8',
                        F:'#fa6', D:'#0ff' };
      const _glowCol = _puCols[p.type] || '#fff';
      ctx.save();
      ctx.globalAlpha = 0.30 + 0.20 * Math.sin(t * 0.30);
      ctx.strokeStyle = _glowCol;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(x, y, 7, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }
  // POWERUP SHADOW — 1-2 px horizontal stripe at the floor (just above lives row)
  // showing the pickup's x position. Alpha proportional to distance from floor —
  // pickup near top = faint, near bottom = bright. Helps the player intercept.
  {
    const floorY = BASE_H - 18;
    if (y < floorY) {
      const dist = floorY - y;
      const sAlpha = Math.max(0, Math.min(1, 1 - dist / 200));
      const cMap = {
        S: '#0df', N: '#1e6', P: '#e3e', T: '#5af', R: '#fc4',
        W: '#f6a', H: '#0cf', B: '#f44', L: '#fff', E: '#4f8', F: '#fa0'
      };
      ctx.save();
      ctx.globalAlpha = sAlpha * 0.35;
      ctx.fillStyle = cMap[p.type] || '#888';
      ctx.fillRect(x - 4, floorY, 9, 1);
      ctx.restore();
    }
  }
  // NEAR-MAX HIGHLIGHT — for S/N/P pickups that would push the player to MAX_POWER
  // on collection, draw 4 small pulsing corner stars to draw the eye. Pure visual
  // hint; doesn't change drop weighting (SMART POWER DROPS already prevents max).
  if (game.lvl && (p.type === 'S' || p.type === 'N' || p.type === 'P')
      && (game.lvl[p.type] || 1) === MAX_POWER_LVL[p.type] - 1) {
    ctx.save();
    const starPulse = 0.5 + 0.5 * Math.sin(t * 0.32);
    ctx.globalAlpha = starPulse;
    ctx.fillStyle = '#fff';
    // 4 corner stars (3-pixel cross) at ±8,8 from center
    const off = 8;
    [[-off, -off], [off, -off], [-off, off], [off, off]].forEach(([sx, sy]) => {
      ctx.fillRect(x + sx, y + sy - 1, 1, 1);
      ctx.fillRect(x + sx - 1, y + sy, 3, 1);
      ctx.fillRect(x + sx, y + sy + 1, 1, 1);
    });
    ctx.restore();
  }
  const palette = {
    S: { core: '#0df', edge: '#06a', shine: '#cff', glow: '#0ff' },
    N: { core: '#1e6', edge: '#062', shine: '#cfc', glow: '#0f8' },
    P: { core: '#e3e', edge: '#828', shine: '#fcf', glow: '#f6f' },
    T: { core: '#5af', edge: '#147', shine: '#cef', glow: '#8df' },
    R: { core: '#fc4', edge: '#a60', shine: '#fec', glow: '#fc4' },
    W: { core: '#f6a', edge: '#852', shine: '#fce', glow: '#f8a' },
    H: { core: '#0cf', edge: '#069', shine: '#cef', glow: '#0ef' },
    B: { core: '#f44', edge: '#811', shine: '#fcc', glow: '#f44' },
    L: { core: '#fff', edge: '#779', shine: '#fff', glow: '#cff' },
    E: { core: '#4f8', edge: '#062', shine: '#cfe', glow: '#4f8' },
    F: { core: '#fa0', edge: '#a50', shine: '#fec', glow: '#fc4' }
  };
  const c = palette[p.type] || palette.S;

  // Pulsing halo (additive feel via globalAlpha)
  ctx.save();
  const pulse = 0.35 + 0.25 * Math.sin(t * 0.18);
  ctx.globalAlpha = pulse;
  ctx.fillStyle = c.glow;
  ctx.fillRect(x - 8, y - 1, 17, 3);  // horizontal beam
  ctx.fillRect(x - 1, y - 8, 3, 17);  // vertical beam
  ctx.globalAlpha = pulse * 0.55;
  ctx.fillRect(x - 6, y - 6, 13, 13); // diffuse square glow
  ctx.restore();

  // Gem outline (white)
  ctx.fillStyle = '#fff';
  ctx.fillRect(x - 3, y - 6, 6, 1);
  ctx.fillRect(x - 5, y - 5, 10, 1);
  ctx.fillRect(x - 6, y - 4, 12, 9);
  ctx.fillRect(x - 5, y + 5, 10, 1);
  ctx.fillRect(x - 3, y + 6, 6, 1);

  // Edge ring
  ctx.fillStyle = c.edge;
  ctx.fillRect(x - 3, y - 5, 6, 1);
  ctx.fillRect(x - 5, y - 4, 10, 9);
  ctx.fillRect(x - 3, y + 5, 6, 1);

  // Core
  ctx.fillStyle = c.core;
  ctx.fillRect(x - 4, y - 3, 8, 7);
  ctx.fillRect(x - 3, y - 4, 6, 1);
  ctx.fillRect(x - 3, y + 4, 6, 1);

  // Shine highlight (top-left)
  ctx.fillStyle = c.shine;
  ctx.fillRect(x - 3, y - 3, 2, 1);
  ctx.fillRect(x - 4, y - 2, 1, 2);
  // Bright glint
  ctx.fillStyle = '#fff';
  ctx.fillRect(x - 2, y - 3, 1, 1);

  // Type-specific icon (yellow on top)
  if (p.type === 'S') {
    // Lightning bolt
    ctx.fillStyle = '#ff4';
    ctx.fillRect(x, y - 3, 2, 1);
    ctx.fillRect(x - 1, y - 2, 2, 1);
    ctx.fillRect(x - 1, y - 1, 3, 1);
    ctx.fillRect(x, y, 2, 1);
    ctx.fillRect(x - 1, y + 1, 2, 1);
    ctx.fillRect(x - 2, y + 2, 2, 1);
  } else if (p.type === 'N') {
    // Triple-shot stripes
    ctx.fillStyle = '#ff4';
    ctx.fillRect(x - 3, y - 2, 1, 5);
    ctx.fillRect(x - 1, y - 2, 1, 5);
    ctx.fillRect(x + 1, y - 2, 1, 5);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 3, y - 2, 1, 1);
    ctx.fillRect(x - 1, y - 2, 1, 1);
    ctx.fillRect(x + 1, y - 2, 1, 1);
  } else if (p.type === 'P') {
    // 4-point star
    ctx.fillStyle = '#ff4';
    ctx.fillRect(x, y - 3, 1, 7);
    ctx.fillRect(x - 3, y, 7, 1);
    ctx.fillRect(x - 1, y - 1, 3, 3);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x, y, 1, 1);
  } else if (p.type === 'T') {
    // Hourglass icon — outlines + sand inside
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 3, y - 3, 7, 1);
    ctx.fillRect(x - 3, y + 3, 7, 1);
    // Funnel walls
    ctx.fillRect(x - 2, y - 2, 1, 1);
    ctx.fillRect(x + 2, y - 2, 1, 1);
    ctx.fillRect(x - 1, y - 1, 1, 1);
    ctx.fillRect(x + 1, y - 1, 1, 1);
    ctx.fillRect(x, y, 1, 1);
    ctx.fillRect(x - 1, y + 1, 1, 1);
    ctx.fillRect(x + 1, y + 1, 1, 1);
    ctx.fillRect(x - 2, y + 2, 1, 1);
    ctx.fillRect(x + 2, y + 2, 1, 1);
    // Sand grains (animated falling)
    const drop = (game.animFrame >> 1) % 4;
    ctx.fillStyle = '#ff8';
    ctx.fillRect(x, y - 2 + drop * 0, 1, 1);
  } else if (p.type === 'R') {
    // RAPID — three rightward chevrons stacked, suggesting fast-forward
    ctx.fillStyle = '#ff4';
    for (let row = -2; row <= 2; row += 2) {
      ctx.fillRect(x - 3, y + row, 1, 1);
      ctx.fillRect(x - 1, y + row, 1, 1);
      ctx.fillRect(x + 1, y + row, 1, 1);
    }
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 2, y, 1, 1);
  } else if (p.type === 'W') {
    // WAVE — sine ripple icon
    ctx.fillStyle = '#ff4';
    ctx.fillRect(x - 3, y - 1, 1, 1);
    ctx.fillRect(x - 2, y - 2, 1, 1);
    ctx.fillRect(x - 1, y - 1, 1, 1);
    ctx.fillRect(x,     y,     1, 1);
    ctx.fillRect(x + 1, y + 1, 1, 1);
    ctx.fillRect(x + 2, y + 2, 1, 1);
    ctx.fillRect(x + 3, y + 1, 1, 1);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x,     y - 1, 1, 1);
  } else if (p.type === 'H') {
    // HOMING — concentric ring icon with crosshair
    ctx.fillStyle = '#ff4';
    ctx.fillRect(x - 3, y - 1, 1, 3);
    ctx.fillRect(x + 2, y - 1, 1, 3);
    ctx.fillRect(x - 1, y - 3, 3, 1);
    ctx.fillRect(x - 1, y + 2, 3, 1);
    ctx.fillRect(x - 2, y - 2, 1, 1);
    ctx.fillRect(x + 2, y - 2, 1, 1);
    ctx.fillRect(x - 2, y + 2, 1, 1);
    ctx.fillRect(x + 2, y + 2, 1, 1);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x, y, 1, 1);
  } else if (p.type === 'B') {
    // BOMB — round shell with fuse spark
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 2, y - 1, 5, 1);
    ctx.fillRect(x - 3, y,     7, 3);
    ctx.fillRect(x - 2, y + 3, 5, 1);
    ctx.fillStyle = '#400';
    ctx.fillRect(x - 1, y,     3, 2);
    // fuse spark
    ctx.fillStyle = (game.animFrame & 2) ? '#ff4' : '#fa0';
    ctx.fillRect(x, y - 3, 1, 2);
    ctx.fillRect(x + 1, y - 4, 1, 1);
  } else if (p.type === 'L') {
    // LASER — vertical bar icon with cross-hair tip, white core w/ cyan accents
    ctx.fillStyle = '#0ff';
    ctx.fillRect(x - 1, y - 4, 3, 1);
    ctx.fillRect(x - 1, y + 3, 3, 1);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x,     y - 3, 1, 6);
    ctx.fillStyle = '#9ef';
    ctx.fillRect(x - 2, y, 1, 1);
    ctx.fillRect(x + 2, y, 1, 1);
  } else if (p.type === 'E') {
    // SHIELD — bracket icon (open ring with chevron)
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 2, y - 3, 5, 1);
    ctx.fillRect(x - 3, y - 2, 1, 5);
    ctx.fillRect(x + 3, y - 2, 1, 5);
    ctx.fillRect(x - 2, y + 2, 5, 1);
    ctx.fillStyle = '#ff4';
    ctx.fillRect(x - 1, y - 1, 3, 3);
  } else if (p.type === 'F') {
    // FORK — 3-arrow fan icon (one straight up, two angled out). Visualizes
    // the spread shot pattern the player gets.
    ctx.fillStyle = '#ff4';
    // Center arrow
    ctx.fillRect(x,     y - 3, 1, 6);
    ctx.fillRect(x - 1, y - 2, 3, 1);
    // Left arrow (angled up-left)
    ctx.fillRect(x - 3, y - 1, 1, 1);
    ctx.fillRect(x - 4, y,     1, 1);
    ctx.fillRect(x - 2, y - 2, 1, 1);
    // Right arrow (angled up-right)
    ctx.fillRect(x + 2, y - 1, 1, 1);
    ctx.fillRect(x + 3, y,     1, 1);
    ctx.fillRect(x + 1, y - 2, 1, 1);
    // White tip on center arrow
    ctx.fillStyle = '#fff';
    ctx.fillRect(x, y - 3, 1, 1);
  } else if (p.type === 'D') {
    // DASH REFRESH — chevron icon (double right-arrow) signaling instant dash reset
    ctx.fillStyle = '#0ff';
    // First chevron
    ctx.fillRect(x - 3, y - 2, 1, 1);
    ctx.fillRect(x - 2, y - 1, 1, 1);
    ctx.fillRect(x - 1, y,     1, 1);
    ctx.fillRect(x - 2, y + 1, 1, 1);
    ctx.fillRect(x - 3, y + 2, 1, 1);
    // Second chevron (slightly right)
    ctx.fillRect(x,     y - 2, 1, 1);
    ctx.fillRect(x + 1, y - 1, 1, 1);
    ctx.fillRect(x + 2, y,     1, 1);
    ctx.fillRect(x + 1, y + 1, 1, 1);
    ctx.fillRect(x,     y + 2, 1, 1);
    // Bright tip at apex
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 2, y, 1, 1);
  }

  // Orbiting sparkle
  const a = t * 0.09;
  const sx = Math.round(Math.cos(a) * 8);
  const sy = Math.round(Math.sin(a) * 8);
  ctx.fillStyle = '#fff';
  ctx.fillRect(x + sx, y + sy, 1, 1);
  ctx.fillRect(x - sx, y - sy, 1, 1);
}

// Enemy bullet — glowing orb with velocity-based trail. Color encodes threat:
//   default (dive enemies)  → orange/yellow
//   kind 'mega'  (megaboss aimed)   → bright red
//   kind 'spiral'(megaboss spiral)  → magenta
const BULLET_COLORS = {
  dive:       { trail: '#f80', halo: '#ff4', core: '#f80', inner: '#ff4' },
  mega:       { trail: '#f44', halo: '#f88', core: '#f44', inner: '#faa' },
  spiral:     { trail: '#c2c', halo: '#f8f', core: '#c2c', inner: '#fcf' },
  eliteBurst: { trail: '#f44', halo: '#fc4', core: '#f44', inner: '#fc8' }
};
function drawEnemyBullet(b) {
  const t = game.animFrame;
  const sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy) || 1;
  const ux = -b.vx / sp, uy = -b.vy / sp;
  const C = BULLET_COLORS[b.kind] || BULLET_COLORS.dive;
  // ENEMY BULLET FADE-IN — stamp spawn frame on first draw, then apply 4-frame
  // alpha ramp so projectiles don't pop. Keeps gameplay timing identical (already
  // movable via updateEnemyBullets), just softens the visual entry.
  if (b._spawnAt == null) b._spawnAt = t;
  const _age = t - b._spawnAt;
  const _fadeIn = _age < 4 ? (_age + 1) / 4 : 1;
  // When bullet density is high, render fewer trail echoes (perf)
  // High stages get longer trails for visibility — but density cap still applies.
  // Tiers: <25: 3 / 25-49: 4 / 50-74: 5 / 75+: 6 — readability at speed.
  const trailLen = (game.enemyBullets && game.enemyBullets.length >= 30) ? 1
                  : (game.stage >= 75) ? 6
                  : (game.stage >= 50) ? 5
                  : (game.stage >= 25) ? 4 : 3;

  // BIOME-TINTED TRAIL — at biome-active stages, paint the FARTHEST trail
  // echo with biome color so the trail fades from biome→bullet color. Subtle
  // identity hint without compromising readability of bullet head.
  let _biomeTrailCol = null;
  if (typeof biomeForStage === 'function') {
    const _bid = biomeForStage(game.stage || 1);
    if (_bid && BIOME_NAMES && BIOME_NAMES[_bid]) _biomeTrailCol = BIOME_NAMES[_bid].col;
  }
  ctx.save();
  // Trail (1 or 3 fading echoes behind the bullet, depending on density)
  for (let i = 1; i <= trailLen; i++) {
    ctx.globalAlpha = (0.32 - i * 0.08) * _fadeIn;
    // Last echo (farthest) uses biome color when active, otherwise default
    ctx.fillStyle = (_biomeTrailCol && i === trailLen) ? _biomeTrailCol : C.trail;
    const tx = b.x + ux * i * 2.2;
    const ty = b.y + uy * i * 2.2;
    const sz = 4 - i;
    ctx.fillRect(tx - sz / 2, ty - sz / 2, sz, sz);
  }

  // Pulsing outer halo
  const pulse = 0.5 + 0.4 * Math.sin(t * 0.4);
  ctx.globalAlpha = pulse * 0.55 * _fadeIn;
  ctx.fillStyle = C.halo;
  ctx.fillRect(b.x - 3, b.y - 3, 6, 6);
  ctx.restore();

  // Core (fade applied via globalAlpha during spawn ramp)
  ctx.save();
  ctx.globalAlpha = _fadeIn;
  ctx.fillStyle = C.core;
  ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
  // Inner
  ctx.fillStyle = C.inner;
  ctx.fillRect(b.x - 1, b.y - 1, 2, 2);
  // White-hot center
  ctx.fillStyle = '#fff';
  ctx.fillRect(b.x, b.y, 1, 1);
  ctx.restore();

  // 슬로우 활성 시 적탄 외곽선 추가 (시각 강화)
  if ((game.slowTimer || 0) > 0) {
    ctx.save();
    ctx.globalAlpha = 0.6;
    ctx.strokeStyle = '#0cf';
    ctx.lineWidth = 0.6;
    ctx.strokeRect(b.x - 2.5, b.y - 2.5, 5, 5);
    ctx.restore();
  }
  // Bullets near the player (bottom 30px) get an extra blink halo so they don't sneak in
  if (b.y > BASE_H - 50 && b.vy > 0) {
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.35 * Math.sin(t * 0.6);
    ctx.fillStyle = '#ff4';
    ctx.fillRect(b.x - 4, b.y - 4, 9, 1);
    ctx.fillRect(b.x - 4, b.y + 3, 9, 1);
    ctx.fillRect(b.x - 4, b.y - 4, 1, 8);
    ctx.fillRect(b.x + 3, b.y - 4, 1, 8);
    ctx.restore();
  }

  // Color-blind redundancy: 1px white outline + per-kind shape marker
  if (colorBlindMode) {
    ctx.fillStyle = '#fff';
    // Outline (4 sides of the core rect)
    ctx.fillRect(b.x - 3, b.y - 3, 6, 1);
    ctx.fillRect(b.x - 3, b.y + 2, 6, 1);
    ctx.fillRect(b.x - 3, b.y - 3, 1, 6);
    ctx.fillRect(b.x + 2, b.y - 3, 1, 6);
    // Shape marker
    if (b.kind === 'mega') {
      // X shape (4 corner pixels)
      ctx.fillRect(b.x - 2, b.y - 2, 1, 1);
      ctx.fillRect(b.x + 1, b.y - 2, 1, 1);
      ctx.fillRect(b.x - 2, b.y + 1, 1, 1);
      ctx.fillRect(b.x + 1, b.y + 1, 1, 1);
    } else if (b.kind === 'spiral') {
      // Plus shape
      ctx.fillRect(b.x, b.y - 2, 1, 5);
      ctx.fillRect(b.x - 2, b.y, 5, 1);
    }
  }
}

// --- Bezier path helpers ---
function bezierPoint(p0, p1, p2, p3, t) {
  const u = 1 - t;
  return {
    x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
    y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y
  };
}

function createLoopPath(startX, startY, side) {
  const dir = side || (startX < BASE_W/2 ? 1 : -1);
  return [
    {p0:{x:startX,y:startY}, p1:{x:startX+dir*30,y:startY+50}, p2:{x:startX+dir*60,y:startY+80}, p3:{x:startX+dir*40,y:startY+130}},
    {p0:{x:startX+dir*40,y:startY+130}, p1:{x:startX+dir*20,y:startY+180}, p2:{x:startX-dir*20,y:startY+160}, p3:{x:startX-dir*10,y:startY+120}},
    {p0:{x:startX-dir*10,y:startY+120}, p1:{x:startX,y:startY+80}, p2:{x:startX,y:BASE_H+20}, p3:{x:startX,y:BASE_H+30}}
  ];
}

function createEntryPath(startX, startY, endX, endY, curveDir) {
  const d = curveDir || 1;
  // Higher stages get a wider curve detour for more dramatic entries
  const stage = (game && game.stage) || 1;
  const detour = 40 + Math.min(40, stage * 2);
  const mx = (startX + endX) / 2 + d * detour;
  return {
    p0: {x:startX, y:startY},
    p1: {x:mx, y:startY},
    p2: {x:mx, y:endY},
    p3: {x:endX, y:endY}
  };
}

// --- Game data ---
let game, keys, stars;

const STAR_COLORS = ['#fff', '#fff', '#fff', '#cef', '#fce', '#ffe', '#cff'];

// Star layers — far is dim/slow, near is bright/fast; gives the field a sense of depth.
// CONSTELLATION LINES — at stage 50+, occasional faint dashed line between
// two nearby near-layer stars fades in/out for atmospheric mythology. Spawn
// rolled every ~10s (600 frames); single active line at a time.
let constellationLine = null;
function maybeSpawnConstellation() {
  if (!game || game.stage < 50) return;
  if (constellationLine) return;
  if (game.animFrame % 600 !== 0) return;
  // Pick two near-layer stars
  const nears = stars.filter(s => s.layer === 'near');
  if (nears.length < 2) return;
  const a = nears[Math.floor(Math.random() * nears.length)];
  let b = a;
  for (let tries = 0; tries < 8 && b === a; tries++) {
    b = nears[Math.floor(Math.random() * nears.length)];
  }
  if (b === a) return;
  // Skip if too far apart (avoid edge-to-edge)
  const dx = a.x - b.x, dy = a.y - b.y;
  if (Math.sqrt(dx*dx + dy*dy) > 80) return;
  constellationLine = { ax: a.x, ay: a.y, bx: b.x, by: b.y, life: 0, maxLife: 90 };
}
function updateConstellation() {
  if (!constellationLine) return;
  constellationLine.life++;
  if (constellationLine.life >= constellationLine.maxLife) constellationLine = null;
}
function drawConstellation() {
  if (!constellationLine) return;
  const cl = constellationLine;
  const ratio = cl.life / cl.maxLife;
  // Triangle alpha: ramp up first 30%, hold, ramp out last 30%
  let alpha;
  if (ratio < 0.3)      alpha = ratio / 0.3;
  else if (ratio > 0.7) alpha = (1 - ratio) / 0.3;
  else                  alpha = 1;
  alpha *= 0.18;
  ctx.save();
  ctx.fillStyle = '#9ac';
  const segs = 16;
  for (let s = 0; s <= segs; s++) {
    if ((s + (game.animFrame >> 2)) % 3 === 0) continue; // dashed flow
    const t = s / segs;
    const x = Math.round(cl.ax + (cl.bx - cl.ax) * t);
    const y = Math.round(cl.ay + (cl.by - cl.ay) * t);
    ctx.globalAlpha = alpha;
    ctx.fillRect(x, y, 1, 1);
  }
  ctx.restore();
}

// DEEP SPACE DUST — drifting motes that subtly populate the background at high
// stages, suggesting cosmic detritus. Lazy-init on first late-stage entry.
let dustMotes = null;
function ensureDustMotes() {
  if (dustMotes) return;
  dustMotes = [];
  for (let i = 0; i < 10; i++) {
    dustMotes.push({
      x: Math.random() * BASE_W,
      y: Math.random() * BASE_H,
      vy: 0.05 + Math.random() * 0.10,
      phase: Math.random() * Math.PI * 2,
      bright: 0.18 + Math.random() * 0.22
    });
  }
}
function updateDustMotes() {
  if (!dustMotes || !game || game.stage < 50) return;
  for (const d of dustMotes) {
    d.y += d.vy;
    d.x += Math.sin(d.phase += 0.008) * 0.04;
    if (d.y > BASE_H + 4) { d.y = -4; d.x = Math.random() * BASE_W; }
    if (d.x < 0) d.x = BASE_W;
    else if (d.x > BASE_W) d.x = 0;
  }
}
function drawDustMotes() {
  if (!dustMotes || !game || game.stage < 50) return;
  ctx.save();
  ctx.fillStyle = '#555';
  for (const d of dustMotes) {
    ctx.globalAlpha = d.bright;
    ctx.fillRect(Math.round(d.x), Math.round(d.y), 1, 1);
  }
  ctx.restore();
}

function initStars() {
  stars = [];
  ensureDustMotes();
  const farCount  = Math.round(STAR_COUNT * 0.55);
  const midCount  = Math.round(STAR_COUNT * 0.30);
  const nearCount = STAR_COUNT - farCount - midCount;
  function pushLayer(layer, count, speedMin, speedMax, brightMin, brightMax) {
    for (let i = 0; i < count; i++) {
      const speed = speedMin + Math.random() * (speedMax - speedMin);
      stars.push({
        x: Math.random() * BASE_W,
        y: Math.random() * BASE_H,
        speed,
        brightness: brightMin + Math.random() * (brightMax - brightMin),
        color: STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)],
        twinklePhase: Math.random() * Math.PI * 2,
        twinkleRate: 0.02 + Math.random() * 0.04,
        big: layer === 'near' && Math.random() < 0.30,
        layer
      });
    }
  }
  pushLayer('far',  farCount,  0.10, 0.30, 0.18, 0.42);
  pushLayer('mid',  midCount,  0.45, 0.75, 0.45, 0.70);
  pushLayer('near', nearCount, 0.95, 1.50, 0.75, 1.00);
  initNebulae();
}

// Background nebula puffs — sit BEHIND the star layers, scroll very slowly downward
// for a sense of depth without dominating the playfield. Pure cosmetic.
let nebulae = [];
const NEBULA_PALETTE = ['#317', '#136', '#244', '#306', '#125'];
function initNebulae() {
  nebulae = [];
  const COUNT = 5;
  for (let i = 0; i < COUNT; i++) {
    nebulae.push({
      x: Math.random() * BASE_W,
      y: Math.random() * BASE_H,
      vx: (Math.random() - 0.5) * 0.04,
      vy: 0.06 + Math.random() * 0.06,
      size: 28 + Math.random() * 30,
      color: NEBULA_PALETTE[i % NEBULA_PALETTE.length],
      alpha: 0.07 + Math.random() * 0.06,
      // Slow brightness pulse — phase offset per cloud so they don't all breathe in sync.
      pulsePhase: Math.random() * Math.PI * 2,
      pulseRate: 0.008 + Math.random() * 0.006
    });
  }
}
function updateNebulae() {
  for (const n of nebulae) {
    n.x += n.vx;
    n.y += n.vy;
    n.pulsePhase += n.pulseRate;
    if (n.y - n.size > BASE_H) { n.y = -n.size; n.x = Math.random() * BASE_W; }
    if (n.x - n.size > BASE_W) { n.x = -n.size; }
    if (n.x + n.size < 0)      { n.x = BASE_W + n.size; }
  }
}
function drawNebulae() {
  // NEBULA REACTIVITY — sample a reactive tint based on game state. Priority order:
  //   boss phase 2 (crimson) > combo lost vignette (red) > high combo (gold).
  // Pure visual layer; no gameplay impact.
  let reactTint = null, reactAlpha = 0;
  if (game) {
    const bossPhase2 = (game.megaBosses || []).some(mb => mb.alive && mb.phase2);
    const _cornered = game.lives === 1
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE);
    if (bossPhase2) {
      reactTint = '#911';
      reactAlpha = 0.22 + 0.10 * Math.sin(game.animFrame * 0.08);
    } else if (_cornered) {
      // CORNERED — PILOT MOMENTUM last-life state. Persistent low red unease across
      // the nebula field. Atmospheric counterpart to ASCENDING's bright ship aura —
      // completes the momentum expression's two poles (triumph vs. tension).
      reactTint = '#811';
      reactAlpha = 0.13 + 0.06 * Math.sin(game.animFrame * 0.10);
    } else if ((game.comboLostVignette || 0) > 0) {
      reactTint = '#722';
      reactAlpha = (game.comboLostVignette / 60) * 0.20;
    } else if (game.stageDied && (game.combo || 0) < 5
        && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
      // STRAINED — PILOT MOMENTUM regrouping state (post-death, combo not yet rebuilt).
      // A faint desaturated blue-grey haze reads as "shaken focus" — the quiet third
      // pole between ASCENDING (bright aura) and CORNERED (red unease). Dissolves
      // naturally once the player rebuilds combo to 5 (the STRAINED exit condition).
      reactTint = '#446';
      reactAlpha = 0.08 + 0.04 * Math.sin(game.animFrame * 0.06);
    } else if ((game.combo || 0) >= 30) {
      reactTint = '#a82';
      reactAlpha = 0.10 + 0.06 * Math.sin(game.animFrame * 0.05);
    }
  }
  for (const n of nebulae) {
    // Pulse alpha: ±35% of base, sinusoidal. Adds depth/life vs. flat clouds.
    const pulse = 0.65 + 0.35 * (0.5 + 0.5 * Math.sin(n.pulsePhase));
    ctx.save();
    ctx.globalAlpha = n.alpha * pulse;
    ctx.fillStyle = n.color;
    // Three concentric squares with alpha-stack create a soft cloud silhouette without using filters.
    for (let r = 3; r >= 1; r--) {
      const s = n.size * (r / 3);
      ctx.fillRect(Math.round(n.x - s / 2), Math.round(n.y - s / 2), Math.round(s), Math.round(s));
    }
    // Reactive tint overlay — softly washes the cloud with mood color
    if (reactTint) {
      ctx.globalAlpha = n.alpha * pulse * reactAlpha;
      ctx.fillStyle = reactTint;
      for (let r = 3; r >= 1; r--) {
        const s = n.size * (r / 3);
        ctx.fillRect(Math.round(n.x - s / 2), Math.round(n.y - s / 2), Math.round(s), Math.round(s));
      }
    }
    ctx.restore();
  }
}

// --- BIOME SYSTEM ---
// Each biome adds a distinctive layer ON TOP of nebulae but BELOW stars/shooting stars,
// so the standard background still reads through. Mapped to specific stage ranges so
// the player feels they're traveling through different regions of space.
//
// Stages 1-7    → null (pure space)
// Stages 8-15   → planet     (lower planet horizon)
// Stages 16-23  → asteroid   (parallax rocks)
// Stages 24-31  → gasGiant   (large ringed planet, top-right)
// Stages 32+    → blackhole  (rotating accretion disk, center)
//
// Returns biome id string or null. Cycle resumes for stages > 39 (back to planet).
// BIOME_NAMES — human-readable labels + color for each biome id. Used by STAGE_INTRO
// preview line so the player knows what environment they're entering before play starts.
const BIOME_NAMES = {
  planet:    { label: 'PLANET HORIZON',  col: '#48f' },
  dawn:      { label: 'DAWN SKY',        col: '#fc8' },
  asteroid:  { label: 'ASTEROID FIELD',  col: '#aa9' },
  ice:       { label: 'ICE FIELD',       col: '#9ef' },
  gasGiant:  { label: 'GAS GIANT',       col: '#fa6' },
  corona:    { label: 'SUN CORONA',      col: '#fc4' },
  blackhole: { label: 'BLACK HOLE',      col: '#f48' },
  starfield: { label: 'OPEN STARFIELD',  col: '#cef' },
  ruins:     { label: 'RUINED CITY',     col: '#975' },
  desert:    { label: 'DESERT WASTES',   col: '#c84' },
  canyon:    { label: 'CRIMSON CANYON',  col: '#c42' },
  nebula:    { label: 'STAR NURSERY',    col: '#a4f' }
};

// BIOME_WHISPERS — short atmospheric one-liners shown under the biome label
// during STAGE_INTRO. Three variants per biome; rotates by (stage % 3) for
// determinism. Pure flavor — no gameplay effect, no score.
// STAGE_TIPS — adaptive gameplay hints surfaced during STAGE_INTRO based on
// player stat weakness. First-match wins. Score-neutral. Different from
// TRANSMISSION_LOGS (narrative) and BIOME_WHISPERS (atmospheric) — these are
// pragmatic skill nudges that disappear once the relevant stat catches up.

function biomeForStage(stage) {
  if (stage <= 7) return null;
  const idx = Math.floor((stage - 8) / 4);
  // 12-cycle: interleaves 3 terrestrial (land) biomes + nebula stellar nursery
  // among the space biomes. NEBULA sits between blackhole and starfield as a
  // colorful breather after the void.
  return ['planet', 'ruins', 'dawn', 'asteroid', 'desert', 'ice', 'gasGiant', 'corona', 'canyon', 'blackhole', 'nebula', 'starfield'][idx % 12];
}

// BIOME WEATHER — environmental phenomena tied to specific biomes.
// 50% chance to trigger on a normal stage (8+) when the biome matches.
// Skipped on boss/challenge stages so cinematic flow isn't disturbed.
// Each weather adds atmospheric particles; some (rockslide, blizzard) also
// nudge gameplay (rocks=shootable bonus, blizzard=mild player slowdown).
const WEATHER_TABLE = {
  sandstorm: { biome: 'desert',    label: 'SANDSTORM',    col: '#fa6', whisper: 'AIR THICK WITH GRIT' },
  blizzard:  { biome: 'ice',       label: 'BLIZZARD',     col: '#cef', whisper: 'COLD CUTS THRUSTERS' },
  rockslide: { biome: 'canyon',    label: 'ROCKSLIDE',    col: '#c84', whisper: 'WALLS SHEDDING STONE' },
  ashfall:   { biome: 'ruins',     label: 'ASHFALL',      col: '#aa8', whisper: 'SKY RAINS GREY' },
  aurora:    { biome: 'planet',    label: 'AURORA WAVE',  col: '#a8f', whisper: 'SKY DANCES TONIGHT' },
  meteor:    { biome: 'starfield', label: 'METEOR SHOWER', col: '#fc4', whisper: 'STARS FALL AROUND US' },
  vortex:    { biome: 'blackhole', label: 'VORTEX PULSE',  col: '#f48', whisper: 'SPACE BREATHES OUTWARD' },
  storm:     { biome: 'gasGiant',  label: 'STORM CELL',    col: '#ff8', whisper: 'CLOUD ANGER STRIKES' },
  golden:    { biome: 'dawn',      label: 'GOLDEN HOUR',   col: '#fc8', whisper: 'EVERY SECOND IS PRECIOUS' },
  debris:    { biome: 'asteroid',  label: 'DEBRIS FIELD',  col: '#a98', whisper: 'OLD WAR FRAGMENTS DRIFT' },
  solar:     { biome: 'corona',    label: 'SOLAR ECHO',    col: '#fc4', whisper: 'STAR BREATHES IN FIRE' },
  starBirth: { biome: 'nebula',    label: 'STAR BIRTH',    col: '#fff', whisper: 'LIGHT BEGINS HERE' }
};

function pickStageWeather() {
  if (!game) return null;
  const isBoss = game.stage % BOSS_STAGE_INTERVAL === 0;
  const isChallenge = !isBoss && game.stage % 4 === 0;
  if (isBoss || isChallenge) return null;
  const biome = biomeForStage(game.stage);
  if (!biome) return null;
  if (Math.random() > 0.50) return null;
  const matches = Object.entries(WEATHER_TABLE).filter(([_id, w]) => w.biome === biome);
  if (matches.length === 0) return null;
  const [id, info] = matches[Math.floor(Math.random() * matches.length)];
  return {
    id, label: info.label, col: info.col, whisper: info.whisper,
    frames: 0, banner: 180,
    rocks: [], rockTimer: 90
  };
}

function updateStageWeather() {
  if (!game || !game.stageWeather) return;
  // Only tick during active play states. STAGE_INTRO leaves weather frozen so
  // the banner doesn't burn out before the player can read it.
  if (game.state !== STATE.PLAYING && game.state !== STATE.RESPAWN
      && game.state !== STATE.CAPTURED && game.state !== STATE.CHALLENGING) return;
  const w = game.stageWeather;
  w.frames++;
  if (w.banner > 0) w.banner--;

  if (w.id === 'rockslide') {
    // Spawn rocks periodically, capped at ~6 simultaneously to avoid screen clutter
    w.rockTimer--;
    if (w.rockTimer <= 0 && w.rocks.length < 6) {
      w.rockTimer = 60 + Math.floor(Math.random() * 90);
      w.rocks.push({
        x: 14 + Math.random() * (BASE_W - 28),
        y: -8,
        vy: 0.7 + Math.random() * 0.5,
        size: 3 + Math.floor(Math.random() * 2),
        rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.12,
        hp: 1
      });
    }
    // Move rocks + check shot collisions (player bullets only — rocks are bonus targets,
    // not damage hazards, so we avoid edge-case interactions with witch time / shields)
    for (const r of w.rocks) {
      r.y += r.vy;
      r.rot += r.rotSpeed;
      if (r.hp <= 0) continue;
      for (let bi = game.bullets.length - 1; bi >= 0; bi--) {
        const b = game.bullets[bi];
        if (Math.abs(b.x - r.x) < 5 && Math.abs(b.y - r.y) < 5) {
          r.hp = 0;
          game.bullets.splice(bi, 1);
          game.score = (game.score || 0) + 50;
          game.floatTexts.push({
            x: r.x, y: r.y, text: '+50', color: '#fc4',
            life: 30, maxLife: 30, size: 5
          });
          for (let k = 0; k < 5; k++) {
            const a = (k / 5) * Math.PI * 2;
            game.itemBursts.push({
              x: r.x + Math.cos(a) * 3, y: r.y + Math.sin(a) * 3,
              life: -k, color: '#c84'
            });
          }
          if (game.shockwaves) {
            game.shockwaves.push({
              x: r.x, y: r.y, life: 0, maxLife: 14, maxR: 10, color: '#c84'
            });
          }
          playSound('explosion');
          break;
        }
      }
    }
    w.rocks = w.rocks.filter(r => r.hp > 0 && r.y < BASE_H + 12);
  }

  if (w.id === 'starBirth') {
    // STAR BIRTH — periodic ignition flashes at random screen positions, simulating
    // new stars forming in the nebula. Each ignition: 40-frame life, 0→60 radius.
    w.starTimer = (w.starTimer || 0) - 1;
    if (w.starTimer <= 0) {
      w.starTimer = 180 + Math.floor(Math.random() * 60);
      w.starIgnitions = w.starIgnitions || [];
      w.starIgnitions.push({
        x: 20 + Math.random() * (BASE_W - 40),
        y: 20 + Math.random() * (BASE_H - 80),
        life: 0,
        maxLife: 40
      });
    }
    if (w.starIgnitions) {
      for (const ign of w.starIgnitions) ign.life++;
      w.starIgnitions = w.starIgnitions.filter(ign => ign.life < ign.maxLife);
    }
  }

  if (w.id === 'solar') {
    // SOLAR ECHO — emit warm rings from upper-left "sun" position every 240 frames.
    // Each ring lives 80 frames. Distinct from corona biome's static flare ribbons.
    w.solarTimer = (w.solarTimer || 0) - 1;
    if (w.solarTimer <= 0) {
      w.solarTimer = 240;
      w.solarRings = w.solarRings || [];
      w.solarRings.push({ life: 0, maxLife: 80 });
    }
    if (w.solarRings) {
      for (const r of w.solarRings) r.life++;
      w.solarRings = w.solarRings.filter(r => r.life < r.maxLife);
    }
  }

  if (w.id === 'debris') {
    // DEBRIS FIELD — lazy-init 12 small drifting fragments, then update each tick.
    // Visual only — no collision with bullets or player. Differs from biome's own
    // larger asteroids by being smaller (1-2px) and faster-rotating.
    if (!w.debris) {
      w.debris = [];
      for (let i = 0; i < 12; i++) {
        w.debris.push({
          x: Math.random() * BASE_W,
          y: Math.random() * BASE_H,
          vy: 0.10 + Math.random() * 0.22,
          vx: (Math.random() - 0.5) * 0.06,
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.05,
          size: 1 + Math.floor(Math.random() * 2)
        });
      }
    }
    for (const d of w.debris) {
      d.x += d.vx;
      d.y += d.vy;
      d.rot += d.rotSpeed;
      if (d.y - d.size > BASE_H) {
        d.y = -d.size;
        d.x = Math.random() * BASE_W;
      }
      if (d.x < -4) d.x = BASE_W + 4;
      else if (d.x > BASE_W + 4) d.x = -4;
    }
  }

  if (w.id === 'storm') {
    // STORM CELL — spawn lightning strikes at random x positions. Each strike: short
    // vertical streak from top down with a flash frame. Up to 3 concurrent.
    w.stormTimer = (w.stormTimer || 0) - 1;
    if (w.stormTimer <= 0) {
      w.stormTimer = 90 + Math.floor(Math.random() * 60);
      w.strikes = w.strikes || [];
      if (w.strikes.length < 3) {
        w.strikes.push({
          x: 12 + Math.random() * (BASE_W - 24),
          y: -5,
          height: 60 + Math.floor(Math.random() * 80),
          life: 0,
          maxLife: 10 + Math.floor(Math.random() * 8)
        });
      }
    }
    if (w.strikes) {
      for (const s of w.strikes) s.life++;
      w.strikes = w.strikes.filter(s => s.life < s.maxLife);
    }
  }

  if (w.id === 'vortex') {
    // VORTEX PULSE — emit a new ring every 180 frames. Each ring lives 60 frames.
    w.vortexTimer = (w.vortexTimer || 0) - 1;
    if (w.vortexTimer <= 0) {
      w.vortexTimer = 180;
      w.vortexRings = w.vortexRings || [];
      w.vortexRings.push({ life: 0, maxLife: 60 });
    }
    if (w.vortexRings) {
      for (const r of w.vortexRings) r.life++;
      w.vortexRings = w.vortexRings.filter(r => r.life < r.maxLife);
    }
  }

  if (w.id === 'meteor') {
    // METEOR SHOWER — spawn streaks periodically. Visual only, no collision.
    w.meteorTimer = (w.meteorTimer || 0) - 1;
    if (w.meteorTimer <= 0) {
      w.meteorTimer = 30 + Math.floor(Math.random() * 60);
      w.meteors = w.meteors || [];
      if (w.meteors.length < 5) {
        const fromLeft = Math.random() < 0.5;
        w.meteors.push({
          x: fromLeft ? -10 : BASE_W + 10,
          y: 10 + Math.random() * (BASE_H / 2),
          vx: (fromLeft ? 1 : -1) * (1.8 + Math.random() * 1.4),
          vy: 0.4 + Math.random() * 0.6,
          life: 0,
          maxLife: 90 + Math.floor(Math.random() * 60)
        });
      }
    }
    if (w.meteors) {
      for (const m of w.meteors) {
        m.x += m.vx;
        m.y += m.vy;
        m.life++;
      }
      w.meteors = w.meteors.filter(m =>
        m.life < m.maxLife && m.x > -20 && m.x < BASE_W + 20 && m.y < BASE_H + 20
      );
    }
  }
}

function drawStageWeather() {
  if (!game || !game.stageWeather) return;
  // Skip during boss/title/intro/game-over — weather is for active normal play only
  if (game.state === STATE.BOSS_STAGE || game.state === STATE.STAGE_INTRO
      || game.state === STATE.TITLE || game.state === STATE.GAME_OVER
      || game.state === STATE.BONUS_GAME) return;
  const w = game.stageWeather;
  const t = game.animFrame;
  ctx.save();

  if (w.id === 'sandstorm') {
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = '#fa6';
    for (let i = 0; i < 28; i++) {
      const sx = ((i * 17 + t * 1.8) % (BASE_W + 40)) - 20;
      const sy = ((i * 31) % BASE_H);
      ctx.fillRect(Math.round(sx), Math.round(sy), 3, 1);
    }
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#c84';
    for (let i = 0; i < 14; i++) {
      const sx = ((i * 41 + t * 2.4) % (BASE_W + 40)) - 20;
      const sy = ((i * 43) % BASE_H);
      ctx.fillRect(Math.round(sx), Math.round(sy), 4, 1);
    }
    ctx.globalAlpha = 0.05;
    ctx.fillStyle = '#c84';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
  } else if (w.id === 'blizzard') {
    ctx.globalAlpha = 0.65;
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 38; i++) {
      const drift = Math.sin(t * 0.04 + i * 0.5) * 2;
      const sx = ((i * 13 + drift + BASE_W) % BASE_W);
      const sy = ((i * 23 + t * 1.4) % BASE_H);
      ctx.fillRect(Math.round(sx), Math.round(sy), 1, 1);
    }
    ctx.globalAlpha = 0.40;
    ctx.fillStyle = '#cef';
    for (let i = 0; i < 14; i++) {
      const drift = Math.sin(t * 0.06 + i * 0.7) * 3;
      const sx = ((i * 31 + drift + BASE_W) % BASE_W);
      const sy = ((i * 47 + t * 2.2) % BASE_H);
      ctx.fillRect(Math.round(sx), Math.round(sy), 2, 2);
    }
    ctx.globalAlpha = 0.05;
    ctx.fillStyle = '#9cf';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
  } else if (w.id === 'ashfall') {
    ctx.globalAlpha = 0.50;
    ctx.fillStyle = '#aaa';
    for (let i = 0; i < 30; i++) {
      const drift = Math.sin(t * 0.03 + i * 0.4) * 1.5;
      const sx = ((i * 19 + drift + BASE_W) % BASE_W);
      const sy = ((i * 29 + t * 0.7) % BASE_H);
      ctx.fillRect(Math.round(sx), Math.round(sy), 1, 1);
    }
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#876';
    for (let i = 0; i < 16; i++) {
      const drift = Math.sin(t * 0.05 + i * 0.6) * 2;
      const sx = ((i * 37 + drift + BASE_W) % BASE_W);
      const sy = ((i * 41 + t * 0.4) % BASE_H);
      ctx.fillRect(Math.round(sx), Math.round(sy), 2, 1);
    }
    ctx.globalAlpha = 0.05;
    ctx.fillStyle = '#a86';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
  } else if (w.id === 'rockslide') {
    // Rocks rendered as chunky rotated cluster — visible above gameplay layer
    for (const r of w.rocks) {
      if (r.hp <= 0) continue;
      ctx.save();
      ctx.globalAlpha = 0.90;
      ctx.translate(r.x, r.y);
      ctx.rotate(r.rot);
      ctx.fillStyle = '#7a3818';
      ctx.fillRect(-r.size, -r.size, r.size * 2, r.size * 2);
      ctx.fillStyle = '#a25a28';
      ctx.fillRect(-r.size + 1, -r.size + 1, r.size, 1);
      ctx.fillStyle = '#5a1808';
      ctx.fillRect(r.size - 1, r.size - 1, 1, 1);
      ctx.restore();
    }
  } else if (w.id === 'aurora') {
    // AURORA WAVE — 3 sin-driven color bands across upper 1/3 of screen, slow drift.
    // Colors cycle purple → cyan → magenta. Pure visual, no gameplay interaction.
    const bandCols = ['#a4f', '#48f', '#0cf', '#f6c'];
    for (let bi = 0; bi < 3; bi++) {
      const colIdx = (bi + Math.floor(t * 0.008)) % bandCols.length;
      const bandCol = bandCols[colIdx];
      const yBase = 20 + bi * 18;
      ctx.globalAlpha = 0.12 + 0.06 * Math.sin(t * 0.04 + bi * 1.7);
      ctx.fillStyle = bandCol;
      for (let x = 0; x < BASE_W; x += 2) {
        const wave = Math.sin(x * 0.04 + t * 0.03 + bi * 1.3) * 6;
        const h = 8 + 4 * Math.sin(x * 0.06 - t * 0.02 + bi);
        ctx.fillRect(x, yBase + wave, 2, h);
      }
    }
    // Bright pinpoint sparkles drifting upward
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 6; i++) {
      const sx = ((i * 37 + t * 0.18) % BASE_W);
      const sy = ((i * 41 + t * 0.10) % 90);
      ctx.fillRect(Math.round(sx), Math.round(sy), 1, 1);
    }
  } else if (w.id === 'golden') {
    // GOLDEN HOUR — slow warm screen-wide alpha pulse + sparkle motes drifting upward.
    // Layers over the dawn biome's own sunrise gradient to deepen "magic light" feel.
    const _pulse = 0.05 + 0.07 * Math.abs(Math.sin(t * 0.018));
    ctx.globalAlpha = _pulse;
    ctx.fillStyle = '#fc8';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
    // Sun-rays sweep — 3 diagonal warm bands crossing top half
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = '#ff8';
    for (let r = 0; r < 3; r++) {
      const ang = 0.4 + r * 0.15;
      const ox = (r * 40 + t * 0.05) % BASE_W;
      ctx.fillRect(ox, 0, 1, BASE_H / 2);
      ctx.fillRect(ox + 1, 0, 1, BASE_H / 2);
    }
    // Golden mote sparkles — slow upward drift
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 8; i++) {
      const sx = ((i * 43 + t * 0.10) % BASE_W);
      const sy = ((i * 53 + t * 0.30) % BASE_H);
      // Twinkle: 30/60 frame on
      if ((t + i * 17) % 60 < 30) ctx.fillRect(Math.round(sx), Math.round(sy), 1, 1);
    }
  } else if (w.id === 'starBirth') {
    // STAR BIRTH — render each ignition as bright center + expanding ring.
    if (w.starIgnitions && w.starIgnitions.length > 0) {
      for (const ign of w.starIgnitions) {
        const frac = ign.life / ign.maxLife;
        const radius = frac * 60;
        const fadeIn = Math.min(1, ign.life / 4);
        const fadeOut = Math.min(1, (ign.maxLife - ign.life) / 12);
        const alpha = fadeIn * fadeOut;
        // Bright center — pulsing white
        ctx.globalAlpha = alpha * (1 - frac * 0.5);
        ctx.fillStyle = '#fff';
        const _coreSize = 3 - Math.floor(frac * 2);
        ctx.fillRect(Math.round(ign.x - _coreSize / 2), Math.round(ign.y - _coreSize / 2), _coreSize, _coreSize);
        // Expanding ring — 24 segments
        ctx.globalAlpha = alpha * 0.40;
        ctx.fillStyle = '#fff';
        const segCount = 24;
        for (let s = 0; s < segCount; s++) {
          const ang = (s / segCount) * Math.PI * 2;
          const px = Math.round(ign.x + Math.cos(ang) * radius);
          const py = Math.round(ign.y + Math.sin(ang) * radius);
          if (px >= 0 && px < BASE_W && py >= 0 && py < BASE_H) {
            ctx.fillRect(px, py, 1, 1);
          }
        }
        // Secondary inner ring (violet, slightly behind)
        if (frac < 0.7) {
          ctx.globalAlpha = alpha * 0.25;
          ctx.fillStyle = '#a4f';
          const innerR = radius * 0.6;
          for (let s = 0; s < segCount; s++) {
            const ang = (s / segCount) * Math.PI * 2;
            const px = Math.round(ign.x + Math.cos(ang) * innerR);
            const py = Math.round(ign.y + Math.sin(ang) * innerR);
            if (px >= 0 && px < BASE_W && py >= 0 && py < BASE_H) {
              ctx.fillRect(px, py, 1, 1);
            }
          }
        }
      }
    }
  } else if (w.id === 'solar') {
    // SOLAR ECHO — concentric warm rings expanding from a virtual sun in upper-left.
    // 3-layer gold-orange render for thickness. Squashed elliptical perspective.
    if (w.solarRings && w.solarRings.length > 0) {
      const cx = 20, cy = 30; // upper-left "sun" anchor
      for (const r of w.solarRings) {
        const frac = r.life / r.maxLife;
        const radius = 12 + frac * 120;
        const fadeIn = Math.min(1, r.life / 10);
        const fadeOut = Math.min(1, (r.maxLife - r.life) / 16);
        const alpha = fadeIn * fadeOut * 0.15;
        const ringCols = ['#fc4', '#f84', '#f44'];
        for (let ci = 0; ci < ringCols.length; ci++) {
          ctx.globalAlpha = alpha * (1 - ci * 0.15);
          ctx.fillStyle = ringCols[ci];
          const r2 = radius + ci * 2;
          const segCount = 32;
          for (let s = 0; s < segCount; s++) {
            const ang = (s / segCount) * Math.PI * 2;
            const px = Math.round(cx + Math.cos(ang) * r2);
            const py = Math.round(cy + Math.sin(ang) * r2 * 0.9);
            if (px >= 0 && px < BASE_W && py >= 0 && py < BASE_H) {
              ctx.fillRect(px, py, 2, 1);
            }
          }
        }
      }
    }
  } else if (w.id === 'debris') {
    // DEBRIS FIELD — render small rotating chunks across the screen
    if (w.debris) {
      for (const d of w.debris) {
        ctx.save();
        ctx.globalAlpha = 0.45;
        ctx.translate(d.x, d.y);
        ctx.rotate(d.rot);
        ctx.fillStyle = '#776';
        ctx.fillRect(-d.size, -d.size, d.size * 2, d.size * 2);
        ctx.fillStyle = '#aa8';
        ctx.fillRect(-d.size, -d.size, 1, 1);
        ctx.fillStyle = '#553';
        ctx.fillRect(d.size - 1, d.size - 1, 1, 1);
        ctx.restore();
      }
    }
  } else if (w.id === 'storm') {
    // STORM CELL — render each strike as a thin vertical streak with brief flash.
    if (w.strikes && w.strikes.length > 0) {
      for (const s of w.strikes) {
        const frac = s.life / s.maxLife;
        const fadeIn = Math.min(1, s.life / 2);
        const fadeOut = Math.min(1, (s.maxLife - s.life) / 4);
        const alpha = fadeIn * fadeOut;
        // Bright vertical streak (1px) — jagged via slight x jitter per pixel
        ctx.globalAlpha = alpha * 0.85;
        ctx.fillStyle = '#fff';
        for (let dy = 0; dy < s.height; dy++) {
          const jx = (dy % 6 === 0 && dy > 0) ? (Math.random() < 0.5 ? -1 : 1) : 0;
          ctx.fillRect(Math.round(s.x + jx), Math.round(s.y + dy), 1, 1);
        }
        // Soft glow halo on left/right of streak — yellow
        ctx.globalAlpha = alpha * 0.30;
        ctx.fillStyle = '#ff8';
        ctx.fillRect(Math.round(s.x - 1), Math.round(s.y), 1, s.height);
        ctx.fillRect(Math.round(s.x + 1), Math.round(s.y), 1, s.height);
        // Brief screen-wide flash on first frame
        if (s.life <= 2) {
          ctx.globalAlpha = 0.06;
          ctx.fillStyle = '#ff8';
          ctx.fillRect(0, 0, BASE_W, BASE_H);
        }
      }
    }
  } else if (w.id === 'vortex') {
    // VORTEX PULSE — concentric expanding rings from screen-center area where
    // the blackhole sits. Three ring "phases" share color cycle red→orange→yellow.
    if (w.vortexRings && w.vortexRings.length > 0) {
      const cx = BASE_W / 2, cy = BASE_H / 3;
      for (const r of w.vortexRings) {
        const frac = r.life / r.maxLife;
        const radius = 8 + frac * 80;
        const fadeIn = Math.min(1, r.life / 8);
        const fadeOut = Math.min(1, (r.maxLife - r.life) / 12);
        const alpha = fadeIn * fadeOut * 0.18;
        // 3 color rings layered for thick effect
        const ringCols = ['#f44', '#f84', '#fc4'];
        for (let ci = 0; ci < ringCols.length; ci++) {
          ctx.globalAlpha = alpha * (1 - ci * 0.15);
          ctx.fillStyle = ringCols[ci];
          // Approximate ring outline by drawing 24 segments around the circle
          const r2 = radius + ci * 2;
          const segCount = 24;
          for (let s = 0; s < segCount; s++) {
            const ang = (s / segCount) * Math.PI * 2;
            const px = Math.round(cx + Math.cos(ang) * r2);
            const py = Math.round(cy + Math.sin(ang) * r2 * 0.6); // squashed vertical (face-on)
            if (px >= 0 && px < BASE_W && py >= 0 && py < BASE_H) {
              ctx.fillRect(px, py, 2, 1);
            }
          }
        }
      }
    }
  } else if (w.id === 'meteor') {
    // METEOR SHOWER — gold/orange streaks across screen with fading tail
    if (w.meteors) {
      for (const m of w.meteors) {
        const lifeFrac = 1 - m.life / m.maxLife;
        const sp = Math.sqrt(m.vx * m.vx + m.vy * m.vy) || 1;
        const ux = -m.vx / sp, uy = -m.vy / sp;
        // Tail — 6 segments fading backward
        for (let s = 0; s < 6; s++) {
          ctx.globalAlpha = lifeFrac * (1 - s / 6) * 0.85;
          ctx.fillStyle = s < 2 ? '#fff' : s < 4 ? '#fc4' : '#f84';
          const tx = Math.round(m.x + ux * s * 2);
          const ty = Math.round(m.y + uy * s * 2);
          ctx.fillRect(tx, ty, 2, 2);
        }
        // Bright head
        ctx.globalAlpha = lifeFrac;
        ctx.fillStyle = '#fff';
        ctx.fillRect(Math.round(m.x), Math.round(m.y), 2, 2);
      }
    }
  }

  // Weather banner — appears top-center for first ~3s of stage, fades in/out
  if (w.banner > 0) {
    const fadeIn = Math.min(1, (180 - w.banner) / 20);
    const fadeOut = Math.min(1, w.banner / 40);
    const alpha = fadeIn * fadeOut;
    ctx.globalAlpha = alpha * 0.85;
    drawRetroText('< WEATHER: ' + w.label + ' >', BASE_W / 2, 40, 5, w.col, 'center');
    ctx.globalAlpha = alpha * 0.55;
    // Whisper picks up the weather color (matches BIOME WHISPER pattern) so
    // weather identity reads in both the banner and the atmospheric one-liner.
    drawRetroText(w.whisper, BASE_W / 2, 48, 4, w.col, 'center');
  }

  ctx.restore();
}
