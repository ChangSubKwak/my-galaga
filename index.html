      // LIFETIME SCORE TOTAL — sum across both modes
      const _scTot = (csN2.scoreTotal || 0) + (csC2.scoreTotal || 0);
      if (_scTot >= 10000) {
        const _scTotCol = _scTot >= 100000000 ? '#f6f'
                        : _scTot >= 10000000 ? '#fc4'
                        : _scTot >= 1000000 ? '#0ff'
                        : _scTot >= 100000 ? '#0f8' : '#cce';
        const _scTotTier = _scTot >= 100000000 ? 'MYTHIC'
                         : _scTot >= 10000000  ? 'LEGEND'
                         : _scTot >= 1000000   ? 'CHAMPION'
                         : _scTot >= 100000    ? 'ACE'
                         : '';
        profileRow('LIFETIME SCORE', fmtScore(_scTot) + (_scTotTier ? ' ' + _scTotTier : ''), _scTotCol);
        // AVG SCORE PER RUN — derived from sessions across both modes
        const _runs = (csN2.sessions || 0) + (csC2.sessions || 0);
        if (_runs >= 3) {
          const _avg = Math.round(_scTot / _runs);
          const _avgCol = _avg >= 100000 ? '#fc4' : _avg >= 50000 ? '#0ff' : _avg >= 20000 ? '#0f8' : '#cce';
          const _avgN = _avg >= 100000 ? ' PRODIGY'
                      : _avg >= 50000  ? ' STRONG'
                      : _avg >= 20000  ? ' STEADY'
                      : '';
          profileRow('AVG / RUN', fmtScore(_avg) + _avgN, _avgCol);
        }
      }
      // PICKUP TYPE TOTALS — show top-collected pickup type (e.g., "TOP: S x42")
      const ptRaw = localStorage.getItem('galagaPickupTotals');
      if (ptRaw) {
        const ptTot = JSON.parse(ptRaw);
        let topType = null, topCount = 0;
        for (const k in ptTot) {
          if ((ptTot[k] || 0) > topCount) { topCount = ptTot[k]; topType = k; }
        }
        if (topType && topCount >= 5) {
          const ptCol = POWERUP_COL[topType] || '#fff';
          profileRow('TOP PICKUP', topType + ' x' + topCount, ptCol);
        }
      }
      // TOP ENEMY — most-killed enemy type across all runs.
      try {
        const _kbtRaw = localStorage.getItem('galagaKillsByType') || '{}';
        const _kbt = JSON.parse(_kbtRaw);
        let _topT = null, _topC = 0;
        for (const _k in _kbt) {
          if ((_kbt[_k] || 0) > _topC) { _topC = _kbt[_k]; _topT = _k; }
        }
        if (_topT && _topC >= 10) {
          const _tCol = (typeof ENEMY_INFO !== 'undefined' && ENEMY_INFO[_topT])
            ? ENEMY_INFO[_topT].col : '#fff';
          profileRow('TOP ENEMY', _topT.toUpperCase() + ' x' + fmtScore(_topC), _tCol);
        }
      } catch (e) {}
      // TOP BIOME — most-visited biome across all runs
      try {
        const _bvRaw = localStorage.getItem('galagaBiomeVisits') || '{}';
        const _bv = JSON.parse(_bvRaw);
        let _tB = null, _tBC = 0;
        for (const _k in _bv) {
          if ((_bv[_k] || 0) > _tBC) { _tBC = _bv[_k]; _tB = _k; }
        }
        if (_tB && _tBC >= 3 && typeof BIOME_NAMES !== 'undefined' && BIOME_NAMES[_tB]) {
          profileRow('TOP BIOME', BIOME_NAMES[_tB].label + ' x' + _tBC, BIOME_NAMES[_tB].col);
        }
      } catch (e) {}
      // TOP PERK — most-picked perk across all runs (single-line preview).
      // Full perk distribution surfaces visually below the row count list.
      try {
        const pkRaw = localStorage.getItem('galagaPerkPicks') || '{}';
        const pkTot = JSON.parse(pkRaw);
        let topPerk = null, topPerkCount = 0;
        for (const k in pkTot) {
          if ((pkTot[k] || 0) > topPerkCount) { topPerkCount = pkTot[k]; topPerk = k; }
        }
        if (topPerk && topPerkCount >= 2 && PERKS[topPerk]) {
          profileRow('TOP PERK', PERKS[topPerk].name + ' x' + topPerkCount, PERKS[topPerk].col);
        }
      } catch (e) {}
      // DEATH CAUSE TALLY — bullet vs collision lifetime breakdown
      const causesRaw = localStorage.getItem('galagaDeathCauses') || '{}';
      const causes = JSON.parse(causesRaw);
      const cBul = causes.bullet || 0, cCol = causes.collision || 0;
      const cTotal = cBul + cCol + (causes.unknown || 0);
      if (cTotal >= 1) {
        // TOTAL DEATHS — single line summary (memorial tone)
        const _dN = cTotal >= 100 ? ' RELENTLESS'
                  : cTotal >= 30  ? ' RESILIENT'
                  : cTotal >= 5   ? ' PERSISTENT'
                  : '';
        profileRow('TOTAL DEATHS', String(cTotal) + _dN,
                   cTotal >= 100 ? '#f44' : cTotal >= 30 ? '#f88' : '#fc8');
      }
      if (cTotal >= 3) {
        profileRow('DEATHS B/C', cBul + ' / ' + cCol,
                   cBul > cCol * 2 ? '#f88' : cCol > cBul * 2 ? '#fc8' : '#aaa');
      }
      // PERFECT STREAK best — longest consecutive PERFECT CLEARs in a single run
      const perfectStreakBest = parseInt(localStorage.getItem('galagaPerfectStreakBest') || '0', 10);
      if (perfectStreakBest >= 2) {
        {
          const _psbN = perfectStreakBest >= 10 ? ' UNTOUCHABLE'
                      : perfectStreakBest >= 5  ? ' UNYIELDING'
                      : ' STEADFAST';
          profileRow('PERFECT STREAK', '×' + perfectStreakBest + _psbN,
                     perfectStreakBest >= 10 ? '#fc4' : perfectStreakBest >= 5 ? '#0f8' : '#fc8');
        }
      }
      // MAX POWER REACHED — cumulative count of S5+N3+P3 first-touches across runs
      const maxPowerReached = parseInt(localStorage.getItem('galagaMaxPowerReached') || '0', 10);
      if (maxPowerReached >= 1) {
        profileRow('MAX POWER REACHED', String(maxPowerReached), maxPowerReached >= 10 ? '#fc4' : '#fc8');
      }
      // COMBO LIFETIME PB — highest combo ever reached across all runs
      const comboPb = parseInt(localStorage.getItem('galagaMaxComboEver') || '0', 10);
      if (comboPb >= 10) {
        const cpCol = comboPb >= 100 ? '#fc4' : comboPb >= 50 ? '#0ff' : '#fff';
        profileRow('COMBO PB', String(comboPb), cpCol);
      }
      // DAILY MISSIONS — cumulative count of daily missions completed
      const dmTotal = parseInt(localStorage.getItem('galagaDailyMissionTotal') || '0', 10);
      if (dmTotal >= 1) {
        const dmCol = dmTotal >= 100 ? '#fc4'
                    : dmTotal >= 30  ? '#0f8'
                    : dmTotal >= 10  ? '#f6f' : '#cfc';
        profileRow('DAILY MISSIONS', String(dmTotal), dmCol);
      }
      // MISSION VARIETY — count of unique mission types completed
      const mtRaw = localStorage.getItem('galagaMissionTypesDone') || '[]';
      const mtArr = JSON.parse(mtRaw);
      const mtCount = Array.isArray(mtArr) ? mtArr.length : 0;
      if (mtCount >= 1) {
        profileRow('MISSION VARIETY', mtCount + ' / 12',
                   mtCount === 12 ? '#fc4' : mtCount >= 8 ? '#0f8' : '#cce');
      }
      // DAILY MISSION STREAK — current consecutive-day streak + best
      const dmStreak = parseInt(localStorage.getItem('galagaDailyMissionStreak') || '0', 10);
      const dmBest = parseInt(localStorage.getItem('galagaDailyMissionStreakBest') || '0', 10);
      if (dmStreak >= 1 || dmBest >= 1) {
        const sCol = dmStreak >= 30 ? '#fc4' : dmStreak >= 7 ? '#0f8' : '#cfc';
        const label = dmBest > dmStreak
                    ? dmStreak + ' DAYS (BEST ' + dmBest + ')'
                    : dmStreak + ' DAYS';
        profileRow('MISSION STREAK', label, sCol);
      }
      // FAVORITE PERK — most-picked perk across runs
      const perkRaw = localStorage.getItem('galagaPerkPicks');
      if (perkRaw) {
        const ptal = JSON.parse(perkRaw);
        let favPerk = null, favCount = 0;
        for (const k in ptal) {
          if ((ptal[k] || 0) > favCount) { favCount = ptal[k]; favPerk = k; }
        }
        if (favPerk && PERKS[favPerk] && favCount >= 1) {
          profileRow('FAVORITE PERK', PERKS[favPerk].name + ' ×' + favCount, PERKS[favPerk].col);
        }
      }
      // DEATH MEMORIAL — last 5 final-death entries (stage / score / mode)
      const memRaw = localStorage.getItem('galagaDeathMemorials');
      if (memRaw) {
        const mem = JSON.parse(memRaw);
        if (Array.isArray(mem) && mem.length > 0) {
          y += 4;
          // Divider line above MEMORIALS section
          ctx.save();
          ctx.fillStyle = '#522';
          ctx.fillRect(px + 8, y - 2, panelW - 16, 1);
          ctx.restore();
          drawRetroText('RECENT MEMORIALS', px + 8, y, 6, '#f88', 'left');
          y += 8;
          for (let i = 0; i < Math.min(5, mem.length); i++) {
            const m = mem[i];
            const stTag = 'S' + (m.stage || 0);
            const scTag = fmtScore(m.score || 0);
            const modeTag = m.mode || 'NORM';
            drawRetroText(stTag, px + 8, y, 5, '#aaa', 'left');
            drawRetroText(scTag, px + 50, y, 5, '#fff', 'left');
            drawRetroText('[' + modeTag + ']', px + panelW - 8, y, 5, '#888', 'right');
            y += 7;
          }
        }
      }
      // RUN HISTORY CHART — small line graph of last 10 run scores
      const histRaw = localStorage.getItem('galagaRunHistory');
      if (histRaw) {
        const hist = JSON.parse(histRaw);
        if (Array.isArray(hist) && hist.length >= 2) {
          y += 4;
          // Divider line above RECENT RUNS section
          ctx.save();
          ctx.fillStyle = '#246';
          ctx.fillRect(px + 8, y - 2, panelW - 16, 1);
          ctx.restore();
          drawRetroText('RECENT RUNS', px + 8, y, 6, '#0cf', 'left');
          y += 8;
          const maxScore = Math.max.apply(null, hist) || 1;
          const chartW = panelW - 16;
          const chartH = 18;
          const chartX = px + 8;
          const chartY = y;
          ctx.save();
          // Track
          ctx.globalAlpha = 0.18;
          ctx.fillStyle = '#0cf';
          ctx.fillRect(chartX, chartY + chartH - 1, chartW, 1);
          ctx.globalAlpha = 1;
          // Plot points + connecting lines
          for (let i = 0; i < hist.length; i++) {
            const xRatio = i / Math.max(1, hist.length - 1);
            const yRatio = hist[i] / maxScore;
            const cx = Math.round(chartX + xRatio * chartW);
            const cy = Math.round(chartY + chartH - yRatio * chartH);
            // Line to next
            if (i < hist.length - 1) {
              const nxr = (i + 1) / Math.max(1, hist.length - 1);
              const nyr = hist[i + 1] / maxScore;
              const ncx = Math.round(chartX + nxr * chartW);
              const ncy = Math.round(chartY + chartH - nyr * chartH);
              ctx.fillStyle = '#0cf';
              const steps = Math.max(1, Math.abs(ncx - cx));
              for (let s = 0; s <= steps; s++) {
                const t = s / steps;
                const lx = Math.round(cx + (ncx - cx) * t);
                const ly = Math.round(cy + (ncy - cy) * t);
                ctx.fillRect(lx, ly, 1, 1);
              }
            }
            // Point
            ctx.fillStyle = hist[i] === maxScore ? '#fc4' : '#fff';
            ctx.fillRect(cx - 1, cy - 1, 2, 2);
          }
          ctx.restore();
          y += chartH + 4;
        }
      }
      // STAGE GRADE TALLY — S/A/B/C/D counters from cumulative stage clears
      const gradesRaw = localStorage.getItem('galagaStageGrades') || '{}';
      const grades = JSON.parse(gradesRaw);
      const gS = grades.S || 0, gA = grades.A || 0, gB = grades.B || 0, gC = grades.C || 0, gD = grades.D || 0;
      const gTotal = gS + gA + gB + gC + gD;
      if (gTotal > 0) {
        profileRow('GRADE  S/A/B/C/D',
                   gS + '/' + gA + '/' + gB + '/' + gC + '/' + gD,
                   gS >= 10 ? '#fc4' : '#0ff');
        // S-RATIO — S grades as percent of all graded stages. Skill ceiling stat.
        if (gTotal >= 10) {
          const _sPct = Math.round((gS / gTotal) * 100);
          const _sRatioCol = _sPct >= 30 ? '#fc4' : _sPct >= 15 ? '#0ff' : _sPct >= 5 ? '#0f8' : '#cce';
          const _srN = _sPct >= 30 ? ' REMARKABLE'
                     : _sPct >= 15 ? ' CONSISTENT'
                     : _sPct >= 5  ? ' PROMISING'
                     : '';
          profileRow('S RATIO', _sPct + '%' + _srN, _sRatioCol);
        }
      }
    } catch (e) {}
    // PERSONALIZED PRACTICE TIP — find weakest tracked area and suggest
    try {
      const _parryT = parseInt(localStorage.getItem('galagaParryTotal') || '0', 10) || 0;
      const _critT = parseInt(localStorage.getItem('galagaCritKills') || '0', 10) || 0;
      const _bsBest = Math.max(csN2.bestStage || 0, csC2.bestStage || 0);
      const _suggestions = [];
      if (_parryT < 30) _suggestions.push('PARRY (DASH THRU BULLETS)');
      if (_critT < 20) _suggestions.push('CRIT (LUCK +50% DMG)');
      if (_bsBest < 10) _suggestions.push('REACH STAGE 10');
      else if (_bsBest < 30) _suggestions.push('REACH STAGE 30');
      if (_suggestions.length > 0) {
        profileRow('PRACTICE', _suggestions[0], '#0ff');
      }
    } catch (e) {}
    // TACTICAL WEAKNESS — derive from galagaDeathCauses tally. Shows which
    // hit type kills the player most + a one-line counter-tip. Skipped if
    // tally is empty (fresh save) or has fewer than 3 total deaths (low signal).
    try {
      const _dcRaw = localStorage.getItem('galagaDeathCauses') || '{}';
      const _dcT = JSON.parse(_dcRaw);
      const _dcTot = (_dcT.bullet || 0) + (_dcT.collision || 0) + (_dcT.unknown || 0);
      if (_dcTot >= 3) {
        const _b = _dcT.bullet || 0, _c = _dcT.collision || 0;
        let _wLabel, _wTip, _wCol;
        if (_b > _c) {
          _wLabel = 'ENEMY FIRE';
          _wTip = 'DASH-PARRY BULLETS';
          _wCol = '#f88';
        } else if (_c > _b) {
          _wLabel = 'DIVE IMPACT';
          _wTip = 'WATCH DIVE TRAILS';
          _wCol = '#fc8';
        } else {
          _wLabel = 'BALANCED';
          _wTip = 'KEEP REFINING';
          _wCol = '#0f8';
        }
        profileRow('WEAKNESS', _wLabel + ' — ' + _wTip, _wCol);
      }
    } catch (e) {}
    // BOSSES DEFEATED — 8-boss checklist with ✓ / · for each
    try {
      const bossesRaw = localStorage.getItem('galagaBossesDefeated') || '{}';
      const bosses = JSON.parse(bossesRaw);
      const milestones = [10, 20, 30, 40, 50, 60, 70, 80];
      const defeated = milestones.filter(m => bosses[String(m)]).length;
      y += 4;
      // Divider line above BOSSES DEFEATED section
      ctx.save();
      ctx.fillStyle = '#246';
      ctx.fillRect(px + 8, y - 2, panelW - 16, 1);
      ctx.restore();
      drawRetroText('BOSSES DEFEATED  ' + defeated + ' / 8', px + 8, y, 6, COL.cyan, 'left');
      y += 8;
      // 2 rows x 4 cols of mini boss names with status
      for (let i = 0; i < milestones.length; i++) {
        const stage = milestones[i];
        const got = !!bosses[String(stage)];
        const col = i + 1; // 1..8
        const row = Math.floor(i / 4);
        const colIdx = i % 4;
        const ex = px + 8 + colIdx * 50;
        const ey = y + row * 7;
        const sym = got ? '✓' : '·';
        const symCol = got ? '#fc4' : '#444';
        drawRetroText(sym + ' S' + stage, ex, ey, 5, got ? '#fc4' : COL.gray, 'left');
      }
      y += 16;
    } catch (e) {}
    y += 4;
    // Personal identity tagline based on stats
    let title;
    if (achPct >= 80)         title = 'ACE PILOT';
    else if (dexCount >= 8)   title = 'BESTIARY MASTER';
    else if ((csN2.bestStage || 0) >= 30) title = 'APEX SURVIVOR';
    else if (totalKills >= 1000) title = 'VETERAN';
    else if (totalRuns >= 10) title = 'PILOT';
    else                       title = 'ROOKIE';
    drawRetroText('TITLE: ' + title, BASE_W/2, y, 6, '#fc4');
    return; // skip achievement grid
  }
  if (onBestiary) {
    // BESTIARY page — list of all enemy types with unlock state.
    // Locked entries show '???' and gray silhouette feel; unlocked show name + trait.
    const dexIds = Object.keys(ENEMY_INFO);
    const unlockedCount = dexIds.filter(t => dexUnlocked.has(t)).length;
    drawRetroText(unlockedCount + '/' + dexIds.length + ' ENCOUNTERED', px + 8, y, 5, COL.gray, 'left');
    y += 8;
    for (const t of dexIds) {
      const info = ENEMY_INFO[t];
      const got = dexUnlocked.has(t);
      ctx.fillStyle = got ? 'rgba(0,255,136,0.10)' : 'rgba(40,40,40,0.40)';
      ctx.fillRect(px + 6, y - 1, panelW - 12, 8);
      drawRetroText(got ? info.name : '???', px + 8, y + 1, 6, got ? info.col : '#444', 'left');
      drawRetroText(got ? info.trait : 'DEFEAT TO REVEAL',
                    px + panelW - 8, y + 1, 5, got ? '#fff' : '#333', 'right');
      y += 9;
    }
    return; // skip the achievement grid below — no ctx.save was active in this branch
  }
  const start = game.statsAchPage * PER_PAGE;
  const end = Math.min(ids.length, start + PER_PAGE);
  for (let i = start; i < end; i++) {
    const id = ids[i];
    const offset = i - start;
    const r = Math.floor(offset / 3), c = offset % 3;
    const cx = px + 8 + c * cellW;
    const cy = y + r * cellH;
    const got = unlockedAchievements.has(id);
    ctx.fillStyle = got ? 'rgba(255,170,68,0.20)' : 'rgba(40,40,40,0.45)';
    ctx.fillRect(cx, cy, cellW - 2, cellH - 2);
    ctx.fillStyle = got ? '#fc4' : '#333';
    ctx.fillRect(cx, cy, cellW - 2, 1);
    ctx.fillRect(cx, cy + cellH - 3, cellW - 2, 1);
    const gemX = cx + 4, gemY = cy + (cellH - 2) / 2;
    if (got) drawMiniGem(gemX, gemY, '#fc4');
    else { ctx.fillStyle = '#555'; ctx.fillRect(gemX - 1, gemY - 1, 3, 3); }
    const name = ACHIEVEMENTS[id].name;
    drawRetroText(name.length > 12 ? name.slice(0, 12) : name, cx + 9, cy + (cellH - 1) / 2, 5, got ? '#fff' : '#666', 'left');
  }

  drawRetroText('I  CLOSE', BASE_W/2, py + panelH - 8, 6, COL.gray);
}

// --- Game loop ---
let lastTime = 0;
let accumulator = 0;
const TICK = 1000 / FPS;

function gameLoop(timestamp) {
  // FREEZE GUARD — wrap entire loop in try/finally so a thrown error in
  // update() or draw() can't strand requestAnimationFrame and freeze the game.
  // Errors logged to console; loop keeps running.
  try {
    if (lastTime === 0) lastTime = timestamp;
    let dt = timestamp - lastTime;
    lastTime = timestamp;
    if (dt > 100) dt = 100; // cap

    // FPS sampler — averages over the last ~30 frames
    _fpsAcc += dt;
    _fpsCount++;
    if (timestamp - _fpsLastSample > 500) {
      _fpsValue = Math.round((1000 * _fpsCount) / Math.max(1, _fpsAcc));
      _fpsAcc = 0; _fpsCount = 0;
      _fpsLastSample = timestamp;
    }

    accumulator += dt;
    // Spiral-of-death guard: if accumulator is far behind (heavy frame stutter or
    // browser stall), cap iterations and reset accumulator so we don't compound
    // multiple expensive update() calls per draw and lock the main thread.
    let maxIters = 6;
    while (accumulator >= TICK && maxIters > 0) {
      // Hit-stop: pause the simulation for a few frames after big impacts (game state only;
      // animFrame still advances so explosions/sparks keep moving for visual flair)
      if (game && game.hitStopFrames > 0) {
        game.hitStopFrames--;
        game.animFrame++;
      } else {
        try { update(); } catch (uErr) { console.error('update() error:', uErr); }
      }
      accumulator -= TICK;
      maxIters--;
    }
    if (maxIters === 0) accumulator = 0; // drain remainder if we hit the cap
    try { draw(); } catch (dErr) { console.error('draw() error:', dErr); }
  } finally {
    requestAnimationFrame(gameLoop);
  }
}

// --- Init ---
function init() {
  resetGame();
  initStars();
  initInput();
  resize();
  requestAnimationFrame(gameLoop);
}

init();
</script>
