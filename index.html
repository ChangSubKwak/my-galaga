<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GALAGA</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: radial-gradient(ellipse at center, #001428 0%, #000408 55%, #000 100%);
}
canvas {
  display: block; margin: 0 auto;
  image-rendering: pixelated;
  box-shadow:
    0 0 24px rgba(0, 180, 255, 0.30),
    0 0 60px rgba(0, 180, 255, 0.12),
    inset 0 0 0 1px rgba(0, 180, 255, 0.18);
  border-radius: 2px;
}
/* Subtle scanline overlay across the whole viewport for CRT vibe */
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 5;
  background: repeating-linear-gradient(
    to bottom, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 1px,
    transparent 1px, transparent 3px);
  mix-blend-mode: overlay;
}
#touchControls {
  display: none; position: fixed; bottom: 0; left: 0; right: 0;
  height: 160px; z-index: 10; pointer-events: none;
}
.touch-btn {
  position: absolute; pointer-events: auto; border-radius: 50%;
  background: rgba(0,180,255,0.18);
  border: 2px solid rgba(0,200,255,0.55);
  box-shadow: 0 0 12px rgba(0,180,255,0.35), inset 0 0 8px rgba(0,200,255,0.2);
  display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,0.85); font-size: 30px; font-family: sans-serif;
  user-select: none; -webkit-user-select: none;
  transition: transform 0.06s ease-out, background 0.06s ease-out, box-shadow 0.06s ease-out;
  text-shadow: 0 0 6px rgba(0,200,255,0.6);
}
.touch-btn.active {
  background: rgba(255,255,68,0.55);
  border-color: rgba(255,255,255,0.95);
  color: #fff;
  box-shadow: 0 0 18px rgba(255,255,68,0.85), inset 0 0 10px rgba(255,255,255,0.3);
  transform: scale(0.92);
}
#btnFire {
  background: rgba(255,68,68,0.22);
  border-color: rgba(255,100,100,0.6);
  box-shadow: 0 0 14px rgba(255,80,80,0.45), inset 0 0 10px rgba(255,100,100,0.25);
  color: #fff;
  animation: firePulse 1.6s ease-in-out infinite;
}
@keyframes firePulse {
  0%, 100% { box-shadow: 0 0 14px rgba(255,80,80,0.45), inset 0 0 10px rgba(255,100,100,0.25); }
  50% { box-shadow: 0 0 22px rgba(255,80,80,0.85), inset 0 0 14px rgba(255,140,140,0.45); }
}
#btnFire.active {
  animation: none;
  background: rgba(255,255,68,0.55);
}
#btnFire { width: 92px; height: 92px; right: 28px; bottom: 30px; }
/* Touch pause — small button anchored to the top-right of the viewport, outside #touchControls
   (which lives at bottom). Same look as .touch-btn but smaller and dimmer so it stays out of the way. */
#btnPause {
  display: none; position: fixed; top: 12px; right: 12px;
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(0,180,255,0.14);
  border: 2px solid rgba(0,200,255,0.45);
  box-shadow: 0 0 10px rgba(0,180,255,0.28), inset 0 0 6px rgba(0,200,255,0.18);
  align-items: center; justify-content: center;
  color: rgba(255,255,255,0.80); font-size: 18px; font-family: sans-serif;
  user-select: none; -webkit-user-select: none; z-index: 11;
  pointer-events: auto;
}
#btnPause.active {
  background: rgba(255,255,68,0.55);
  border-color: rgba(255,255,255,0.95);
  color: #fff;
}
/* Virtual joystick pad — large circle with a draggable knob */
#joyPad {
  position: absolute; pointer-events: auto;
  width: 132px; height: 132px;
  left: 24px; bottom: 16px;
  border-radius: 50%;
  background: rgba(0, 180, 255, 0.10);
  border: 2px solid rgba(0, 200, 255, 0.40);
  box-shadow: 0 0 14px rgba(0, 180, 255, 0.30), inset 0 0 14px rgba(0, 200, 255, 0.18);
  touch-action: none;
}
#joyKnob {
  position: absolute;
  width: 56px; height: 56px;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: rgba(0, 200, 255, 0.45);
  border: 2px solid rgba(255, 255, 255, 0.80);
  box-shadow: 0 0 16px rgba(0, 220, 255, 0.65), inset 0 0 8px rgba(255, 255, 255, 0.30);
  pointer-events: none;
  transition: background 0.1s ease-out;
}
#joyPad.active #joyKnob {
  background: rgba(255, 255, 68, 0.55);
}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="touchControls">
  <div id="joyPad"><div id="joyKnob"></div></div>
  <div class="touch-btn" id="btnFire">&#9679;</div>
</div>
<div id="btnPause">&#10073;&#10073;</div>
<script>
"use strict";
// ============================================================
//  GALAGA — single-file HTML5 clone
// ============================================================

const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');

// --- Constants ---
const BASE_W = 224, BASE_H = 288;
let SCALE = 1;
const FPS = 60;
const PLAYER_SPEED = 2.5;
const BULLET_SPEED = 5;
const STAR_COUNT = 80;

// --- Game state enum ---
const STATE = { TITLE: 0, STAGE_INTRO: 1, PLAYING: 2, CHALLENGING: 3, GAME_OVER: 4, PAUSED: 5, CAPTURED: 6, RESPAWN: 7, BOSS_STAGE: 8, BONUS_GAME: 9 };
const BOSS_STAGE_INTERVAL = 10; // production cadence

// --- Colors ---
const COL = {
  red: '#e44', cyan: '#0ff', yellow: '#ff0', white: '#fff', green: '#0f0',
  blue: '#44f', magenta: '#f4f', orange: '#f80', pink: '#f8a',
  darkBlue: '#228', gray: '#888'
};

// --- Audio engine ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
// Master audio bus — every sound source connects through this for global volume/mute.
// bgmGain and sfxGain are post-master sub-busses for category-specific mute/volume.
let masterGain = null;
let bgmGain = null;
let sfxGain = null;
let audioVolume = (() => {
  const v = parseFloat(localStorage.getItem('galagaVol'));
  return isNaN(v) ? 1 : Math.max(0, Math.min(1, v));
})();
let audioMuted = localStorage.getItem('galagaMute') === '1';
let bgmEnabled = localStorage.getItem('galagaBGMOff') !== '1';
let sfxEnabled = localStorage.getItem('galagaSFXOff') !== '1';
let volIndicatorTimer = 0;

// Challenge mode (1-life hardcore) — toggled on title with C, persisted in localStorage
let challengeModeRequested = localStorage.getItem('galagaChallenge') === '1';

// Camera shake intensity setting — 'full' | 'low' | 'off' (accessibility / motion sickness)
let shakeMode = (() => {
  const v = localStorage.getItem('galagaShake');
  return v === 'low' || v === 'off' ? v : 'full';
})();
function shakeMul() { return shakeMode === 'off' ? 0 : shakeMode === 'low' ? 0.4 : 1; }

// Difficulty — affects enemy fire cadence + bullet speeds. Default normal.
let difficultyMode = (() => {
  const v = localStorage.getItem('galagaDifficulty');
  return v === 'easy' || v === 'hard' ? v : 'normal';
})();

// Gamepad rumble strength setting — 'full' | 'low' | 'off'
let rumbleMode = (() => {
  const v = localStorage.getItem('galagaRumble');
  return v === 'low' || v === 'off' ? v : 'full';
})();
function rumbleMul() { return rumbleMode === 'off' ? 0 : rumbleMode === 'low' ? 0.4 : 1; }

// Color-blind mode — adds white outlines + shape markers to enemy bullets so kind is identifiable
// without relying on color alone.
let colorBlindMode = localStorage.getItem('galagaColorBlind') === '1';
// Minimal HUD — toggles off non-essential widgets (accuracy %, kill counter,
// pity dots, etc.) for clean screenshot / focused gameplay. Persisted toggle.
let minimalHud = localStorage.getItem('galagaMinimalHud') === '1';

// Debug overlay (F3) — shows FPS + entity counts in the top-left
let debugOverlay = false;
let _fpsAcc = 0, _fpsCount = 0, _fpsValue = 0, _fpsLastSample = 0;
function diffFireMul()  {
  // Base difficulty multiplier (lower = enemies fire MORE often, since shootEvery uses this).
  let m = difficultyMode === 'easy' ? 1.4 : difficultyMode === 'hard' ? 0.7 : 1;
  // DENSE FIRE stage mutation: divide by 1.4 so shootEvery is shorter → bullets fly thicker.
  if (typeof game !== 'undefined' && game && game.stageMutation && game.stageMutation.id === 'denseFire') m /= 1.4;
  return m;
}
function diffSpeedMul() { return difficultyMode === 'easy' ? 0.85 : difficultyMode === 'hard' ? 1.15 : 1; }

// Ship selection — three loadouts with stat trade-offs
const SHIPS = {
  default: { name: 'GAM-42',  color: '#0cf', speedMul: 1.00, bulletCap: 2, dmgBonus: 0 },
  scout:   { name: 'SCOUT',   color: '#0ff', speedMul: 1.25, bulletCap: 3, dmgBonus: 0 },
  bruiser: { name: 'BRUISER', color: '#f6f', speedMul: 0.85, bulletCap: 2, dmgBonus: 1 },
  spark:   { name: 'SPARK',   color: '#ff4', speedMul: 1.35, bulletCap: 2, dmgBonus: 0 }
};
const SHIP_ORDER = ['default', 'scout', 'bruiser', 'spark'];
let selectedShip = (() => {
  const s = localStorage.getItem('galagaShip');
  return SHIPS[s] ? s : 'default';
})();
function shipAttrs() { return SHIPS[selectedShip] || SHIPS.default; }

// PILOT TITLE — derives a personal callsign-side rank from cumulative stats.
// Pulled from PROFILE PAGE logic so HUD can also display it. Returns one of:
// ROOKIE / PILOT / VETERAN / APEX SURVIVOR / BESTIARY MASTER / ACE PILOT.
// Composite completion percent — single number summarizing progression across
// biomes/dex/ships/difficulties/perks/achievements categories.
function computeCompositeCompletion() {
  try {
    const _bsC = JSON.parse(localStorage.getItem('galagaBiomesSeen') || '[]');
    const _shC = JSON.parse(localStorage.getItem('galagaShipsUsed') || '[]');
    const _dfC = JSON.parse(localStorage.getItem('galagaDifficultiesUsed') || '[]');
    const _pkC = JSON.parse(localStorage.getItem('galagaPerkPicks') || '{}');
    const _bs = Array.isArray(_bsC) ? Math.min(8, _bsC.length) : 0;
    const _dx = (typeof dexUnlocked !== 'undefined') ? Math.min(8, dexUnlocked.size) : 0;
    const _sh = Array.isArray(_shC) ? Math.min(4, _shC.length) : 0;
    const _df = Array.isArray(_dfC) ? Math.min(3, _dfC.length) : 0;
    let _pk = 0;
    for (const _k in _pkC) if ((_pkC[_k] || 0) >= 1) _pk++;
    const _pTot = (typeof PERK_IDS !== 'undefined' ? PERK_IDS.length : 10);
    _pk = Math.min(_pTot, _pk);
    const _ach = (typeof unlockedAchievements !== 'undefined') ? unlockedAchievements.size : 0;
    const _achTot = (typeof ACHIEVEMENTS !== 'undefined') ? Object.keys(ACHIEVEMENTS).length : 60;
    return Math.round((
      (_bs / 8) + (_dx / 8) + (_sh / 4) + (_df / 3) + (_pk / Math.max(1, _pTot)) + (_ach / Math.max(1, _achTot))
    ) / 6 * 100);
  } catch (e) { return 0; }
}

function computePilotTitle() {
  try {
    const csN = loadCumStats(false), csC = loadCumStats(true);
    const totalRuns = (csN.sessions || 0) + (csC.sessions || 0);
    const totalKills = (csN.kills || 0) + (csC.kills || 0);
    const bestStage = Math.max(csN.bestStage || 0, csC.bestStage || 0);
    const dexCount = (typeof dexUnlocked !== 'undefined') ? dexUnlocked.size : 0;
    const achCount = (typeof unlockedAchievements !== 'undefined') ? unlockedAchievements.size : 0;
    const achTotal = Object.keys(ACHIEVEMENTS || {}).length || 1;
    const achPct = Math.round((achCount / achTotal) * 100);
    if (achPct >= 80)        return 'ACE PILOT';
    if (dexCount >= 8)       return 'BESTIARY MASTER';
    if (bestStage >= 30)     return 'APEX SURVIVOR';
    if (totalKills >= 1000)  return 'VETERAN';
    if (totalRuns >= 10)     return 'PILOT';
    return 'ROOKIE';
  } catch (e) { return 'ROOKIE'; }
}
// Returns the next pilot title + progress description for PROFILE display.
// Mirrors computePilotTitle thresholds in priority order.
function computePilotNextRank() {
  try {
    const csN = loadCumStats(false), csC = loadCumStats(true);
    const totalRuns = (csN.sessions || 0) + (csC.sessions || 0);
    const totalKills = (csN.kills || 0) + (csC.kills || 0);
    const bestStage = Math.max(csN.bestStage || 0, csC.bestStage || 0);
    const dexCount = (typeof dexUnlocked !== 'undefined') ? dexUnlocked.size : 0;
    const achCount = (typeof unlockedAchievements !== 'undefined') ? unlockedAchievements.size : 0;
    const achTotal = Object.keys(ACHIEVEMENTS || {}).length || 1;
    const achPct = Math.round((achCount / achTotal) * 100);
    // Current rank evaluated; next rank is the first higher tier not yet reached.
    if (achPct >= 80) return { next: null, label: 'MAX RANK' };
    if (dexCount >= 8) return { next: 'ACE PILOT', label: 'NEED ' + (80 - achPct) + '% MORE ACHIEVEMENTS' };
    if (bestStage >= 30) return { next: 'BESTIARY MASTER', label: 'BESTIARY ' + dexCount + ' / 8' };
    if (totalKills >= 1000) return { next: 'APEX SURVIVOR', label: 'STAGE 30 (CURRENT ' + bestStage + ')' };
    if (totalRuns >= 10) return { next: 'VETERAN', label: fmtScore(totalKills) + ' / 1000 KILLS' };
    return { next: 'PILOT', label: totalRuns + ' / 10 RUNS' };
  } catch (e) { return { next: 'PILOT', label: '' }; }
}

// Ship-change preview pulse — set when V is pressed on title; decays in title update.
let shipChangeFrame = 0;

// KONAMI CODE secret — classic ↑↑↓↓←→←→BA sequence. Last 10 normalized keys
// are tracked; matching the sequence triggers an in-game power-up unlock.
const KONAMI_SEQUENCE = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
let konamiBuffer = [];
function checkKonamiCode() {
  if (konamiBuffer.length < KONAMI_SEQUENCE.length) return false;
  const tail = konamiBuffer.slice(-KONAMI_SEQUENCE.length);
  for (let i = 0; i < KONAMI_SEQUENCE.length; i++) {
    if (tail[i] !== KONAMI_SEQUENCE[i]) return false;
  }
  return true;
}
function triggerKonamiUnlock() {
  if (!game || game.state === STATE.GAME_OVER || game.state === STATE.TITLE) return;
  // Max S/N/P levels + 3 extra lives + cinematic celebration
  game.lvl = { S: 5, N: 3, P: 3 };
  game.lives = (game.lives || 0) + 3;
  spawnConfetti(40);
  game.flashTimer = Math.max(game.flashTimer || 0, 20);
  game.flashColor = '#0f8';
  game.shakeTimer = Math.min(20, (game.shakeTimer || 0) + 14);
  game.floatTexts.push({
    x: BASE_W/2, y: BASE_H/2 - 20, text: 'KONAMI!',
    color: '#fc4', life: 120, maxLife: 120, size: 16
  });
  game.floatTexts.push({
    x: BASE_W/2, y: BASE_H/2 - 4, text: 'SECRET UNLOCKED',
    color: '#0f8', life: 120, maxLife: 120, size: 9
  });
  game.floatTexts.push({
    x: BASE_W/2, y: BASE_H/2 + 8, text: '+3 LIVES   MAX POWER',
    color: '#fff', life: 120, maxLife: 120, size: 7
  });
  playSound('extraLife');
  setTimeout(() => playSound('dualFighter'), 220);
  setTimeout(() => playSound('milestoneStage'), 440);
  rumble(500, 0.9, 0.6);
  try { localStorage.setItem('galagaKonamiUsed', '1'); } catch (e) {}
}

// PLAYER CALLSIGN — 3-letter monogram (arcade tradition). Persisted across runs.
// Default 'PLT' (pilot) so first-time players see something meaningful before they
// customize. Restricted to A-Z and 0-9 to keep the retro typography clean.
const CALLSIGN_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
let playerCallsign = (() => {
  try {
    const s = localStorage.getItem('galagaCallsign') || 'PLT';
    // Normalize: uppercase, pad/truncate to 3, restrict to allowed charset
    let out = '';
    for (let i = 0; i < 3; i++) {
      const c = (s[i] || 'A').toUpperCase();
      out += CALLSIGN_CHARS.indexOf(c) >= 0 ? c : 'A';
    }
    return out;
  } catch (e) { return 'PLT'; }
})();
// CALLSIGN COLOR — 6 picker options, cycled via 'O' key on TITLE. Stored as
// numeric index (0-5); helper returns hex string for use at every callsign
// render site. Default 0 = gold (matches legacy color).
const CALLSIGN_COLORS = ['#fc4', '#0ff', '#f6f', '#0f8', '#f44', '#fff'];
let callsignColorIdx = (() => {
  try { return Math.max(0, Math.min(5, parseInt(localStorage.getItem('galagaCallsignColor') || '0', 10) || 0)); }
  catch (e) { return 0; }
})();
function callsignColor() { return CALLSIGN_COLORS[callsignColorIdx] || '#fc4'; }
function cycleCallsignColor() {
  callsignColorIdx = (callsignColorIdx + 1) % CALLSIGN_COLORS.length;
  try { localStorage.setItem('galagaCallsignColor', String(callsignColorIdx)); } catch (e) {}
}
// Callsign input state — active when player presses 'U' on TITLE. Letters mirror
// playerCallsign for cancel-to-restore behavior; commit copies back on Enter.
let callsignInput = { active: false, letters: ['P','L','T'], pos: 0 };
function saveCallsign() {
  try { localStorage.setItem('galagaCallsign', playerCallsign); } catch (e) {}
}
function shiftCallsignChar(idx, dir) {
  const cur = CALLSIGN_CHARS.indexOf(callsignInput.letters[idx]);
  const next = (cur + dir + CALLSIGN_CHARS.length) % CALLSIGN_CHARS.length;
  callsignInput.letters[idx] = CALLSIGN_CHARS[next];
}

// Daily mode — date-seeded ship lock + tweaked lives/score multiplier (NOT a global RNG seed,
// just a meta-modifier so each calendar day has the same loadout for everyone).
let dailyModeRequested = localStorage.getItem('galagaDaily') === '1';
// DAILY STREAK — counts consecutive days the player engaged daily mode.
// Returns 0 if today is not in the recorded set; otherwise counts backwards from
// today until a gap is found. Habit-forming meta layer for daily players.
function computeDailyStreak() {
  let days;
  try { days = JSON.parse(localStorage.getItem('galagaDailyDays') || '[]'); }
  catch (e) { days = []; }
  if (!Array.isArray(days) || days.length === 0) return 0;
  const set = new Set(days.map(String));
  const today = new Date();
  let streak = 0;
  for (let i = 0; i < 365; i++) {
    const d = new Date(today.getTime() - i * 86400000);
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const key = String(yyyy) + mm + dd;
    if (set.has(key)) streak++;
    else if (i > 0) break;   // gap found, streak ends
    else return 0;            // today not played → streak 0
  }
  return streak;
}

function dailySeed() {
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}
function dailyShipFor(seed) {
  return SHIP_ORDER[seed % SHIP_ORDER.length];
}
function dailyLabel() {
  const s = dailySeed();
  const y = String(s).slice(2, 4);
  const m = String(Math.floor((s % 10000) / 100)).padStart(2, '0');
  const d = String(s % 100).padStart(2, '0');
  return y + m + d;
}
// DAILY MISSION — one objective per UTC date, deterministic from seed. Completion
// rewards +5000 score and persists per-day completion flag so it triggers only
// once per day per player. Read by TITLE + STAGE_INTRO + check sites in update.
const DAILY_MISSIONS = [
  { id: 'reach10',   label: 'REACH STAGE 10',
    check: g => (g.stats.maxStage || 0) >= 10,
    progress: g => Math.min(10, g.stats.maxStage || 0) + '/10' },
  { id: 'reach20',   label: 'REACH STAGE 20',
    check: g => (g.stats.maxStage || 0) >= 20,
    progress: g => Math.min(20, g.stats.maxStage || 0) + '/20' },
  { id: 'score100k', label: 'SCORE 100,000',
    check: g => (g.score || 0) >= 100000,
    progress: g => Math.min(100, Math.floor((g.score || 0) / 1000)) + 'K/100K' },
  { id: 'kill200',   label: '200 KILLS',
    check: g => (g.stats.kills || 0) >= 200,
    progress: g => Math.min(200, g.stats.kills || 0) + '/200' },
  { id: 'parry20',   label: '20 PARRIES',
    check: g => (g.parryCount || 0) >= 20,
    progress: g => Math.min(20, g.parryCount || 0) + '/20' },
  { id: 'graze30',   label: '30 CLOSE PASSES',
    check: g => (g.stageCloseCount || 0) + (g._dailyGrazeAcc || 0) >= 30,
    progress: g => Math.min(30, (g.stageCloseCount || 0) + (g._dailyGrazeAcc || 0)) + '/30' },
  { id: 'perfect3',  label: '3 PERFECT CLEARS',
    check: g => (g.perfectStreak || 0) >= 3,
    progress: g => Math.min(3, g.perfectStreak || 0) + '/3' },
  // Expansion — Turn 132: cover additional mechanics for variety
  { id: 'bosses2',   label: 'DEFEAT 2 BOSSES',
    check: g => (g.bossesKilledThisRun || 0) >= 2,
    progress: g => Math.min(2, g.bossesKilledThisRun || 0) + '/2' },
  { id: 'maxPower',  label: 'REACH MAX POWER',
    check: g => !!g.maxPowerRevealed,
    progress: g => g.maxPowerRevealed ? '✓' : '—' },
  { id: 'dual',      label: 'RESCUE A SHIP',
    check: g => !!g.dualFighter,
    progress: g => g.dualFighter ? '✓' : '—' },
  { id: 'elite5',    label: '5 ELITE KILLS',
    check: g => (g.eliteKills || 0) >= 5,
    progress: g => Math.min(5, g.eliteKills || 0) + '/5' },
  { id: 'dash10',    label: '10 DASHES',
    check: g => (g.dashCount || 0) >= 10,
    progress: g => Math.min(10, g.dashCount || 0) + '/10' }
];
function dailyMission() {
  const s = dailySeed() | 0;
  return DAILY_MISSIONS[s % DAILY_MISSIONS.length];
}
function isDailyMissionDoneToday() {
  try {
    const raw = localStorage.getItem('galagaDailyMissionDone') || '';
    return raw === String(dailySeed());
  } catch (e) { return false; }
}
// Yesterday's seed for streak detection. UTC-anchored to match dailySeed().
function dailySeedYesterday() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}
function markDailyMissionDone() {
  try {
    const todaySeed = dailySeed();
    const lastSeed = parseInt(localStorage.getItem('galagaDailyMissionLastSeed') || '0', 10) || 0;
    localStorage.setItem('galagaDailyMissionDone', String(todaySeed));
    // HEATMAP MISSION DAYS — record completion day for heatmap gold tier
    const mDaysRaw = localStorage.getItem('galagaDailyMissionDays') || '[]';
    const mDays = JSON.parse(mDaysRaw);
    if (Array.isArray(mDays) && mDays.indexOf(todaySeed) < 0) {
      mDays.push(todaySeed);
      // Keep only last 365 to bound storage
      if (mDays.length > 365) mDays.splice(0, mDays.length - 365);
      localStorage.setItem('galagaDailyMissionDays', JSON.stringify(mDays));
    }
    const total = parseInt(localStorage.getItem('galagaDailyMissionTotal') || '0', 10) || 0;
    localStorage.setItem('galagaDailyMissionTotal', String(total + 1));
    if (typeof unlockAchievement === 'function') {
      if (total + 1 >= 10)  unlockAchievement('dailyTen');
      if (total + 1 >= 30)  unlockAchievement('dailyMonth');
      if (total + 1 >= 100) unlockAchievement('dailyCentury');
    }
    // DAILY MISSION MASTERY — record this mission type to a Set; unlock master
    // achievement when all 11 mission types have been completed at least once.
    const m = (typeof dailyMission === 'function') ? dailyMission() : null;
    if (m && m.id) {
      const tRaw = localStorage.getItem('galagaMissionTypesDone') || '[]';
      const tArr = JSON.parse(tRaw);
      if (Array.isArray(tArr) && tArr.indexOf(m.id) < 0) {
        tArr.push(m.id);
        localStorage.setItem('galagaMissionTypesDone', JSON.stringify(tArr));
      }
      if (Array.isArray(tArr) && tArr.length >= 12 && typeof unlockAchievement === 'function') {
        unlockAchievement('dailyMaster');
      }
    }
    // DAILY MISSION STREAK — increment if last completion was yesterday, else
    // reset to 1. Stored separately from total to track *consecutive* days.
    const streakPrev = parseInt(localStorage.getItem('galagaDailyMissionStreak') || '0', 10) || 0;
    const yesterdaySeed = dailySeedYesterday();
    const newStreak = (lastSeed === yesterdaySeed) ? streakPrev + 1 : 1;
    localStorage.setItem('galagaDailyMissionStreak', String(newStreak));
    localStorage.setItem('galagaDailyMissionLastSeed', String(todaySeed));
    // Best streak tracking
    const bestStreak = parseInt(localStorage.getItem('galagaDailyMissionStreakBest') || '0', 10) || 0;
    if (newStreak > bestStreak) {
      localStorage.setItem('galagaDailyMissionStreakBest', String(newStreak));
    }
    // 30-day streak achievement
    if (newStreak >= 30 && typeof unlockAchievement === 'function') {
      unlockAchievement('dailyStreak30');
    }
    // Streak milestone celebrations: 3/7/30 days (game.floatTexts trigger)
    if (game && (newStreak === 3 || newStreak === 7 || newStreak === 30)) {
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 + 18, text: 'STREAK ' + newStreak + ' DAYS!',
        color: '#fc4', life: 120, maxLife: 120, size: 10
      });
      if (typeof spawnConfetti === 'function') spawnConfetti(14);
    }
  } catch (e) {}
}
// DAILY SEED CODE — 4-char alphanumeric hash of today's date for community
// sharing ("hey, what's your daily AX9F run?"). Deterministic per UTC date.
function dailySeedCode() {
  const s = dailySeed();
  // Simple FNV-1a-ish mixing → 4 base36 chars uppercase
  let h = 2166136261 >>> 0;
  const str = String(s);
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  // 4 base36 chars from low bits (~20.7 bits of entropy from 26^4 / 36^4)
  const code = h.toString(36).toUpperCase().padStart(4, '0').slice(-4);
  return code;
}

function ensureAudio() {
  if (!audioCtx && AudioCtx) {

      audioCtx = new AudioCtx();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = audioMuted ? 0 : audioVolume;
      masterGain.connect(audioCtx.destination);
      bgmGain = audioCtx.createGain();
      bgmGain.gain.value = bgmEnabled ? 1 : 0;
      bgmGain.connect(masterGain);
      sfxGain = audioCtx.createGain();
      sfxGain.gain.value = sfxEnabled ? 1 : 0;
      sfxGain.connect(masterGain);
    } catch (e) {

      audioCtx = null;
    }
  }

// Per-track gain bus that all BGM notes route through, enabling smooth fades
let bgmBus = null;
const BGM_FADE = 0.35;

function startBGM(name) {
  if (bgmTrack === name && bgmScheduled) return;
  ensureAudio();
  if (!audioCtx) return;

  // Fade out and disconnect the previous bus (if any)
  if (bgmBus) {
    const now = audioCtx.currentTime;
    bgmBus.gain.cancelScheduledValues(now);
    bgmBus.gain.setValueAtTime(bgmBus.gain.value, now);
    bgmBus.gain.linearRampToValueAtTime(0, now + BGM_FADE);
    const oldBus = bgmBus;
    setTimeout(() => { try { oldBus.disconnect(); } catch (e) {} }, (BGM_FADE + 0.05) * 1000);
  }
  bgmScheduled = false;

  // New bus that fades in. Demo mode is half-volume + slower fade so it feels like attract-mode.
  bgmBus = audioCtx.createGain();
  bgmBus.gain.value = 0;
  // Send tap — feedback delay (echo) for spatial depth. ~250ms tap with 0.3 feedback creates
  // 2-3 audible echoes that decay naturally. Wet ~30% so dry signal stays dominant.
  const delay = audioCtx.createDelay(1.0);
  delay.delayTime.value = 0.25;
  const fb = audioCtx.createGain();
  fb.gain.value = 0.32;
  const wet = audioCtx.createGain();
  wet.gain.value = 0.30;
  bgmBus.connect(delay);
  delay.connect(fb);
  fb.connect(delay);
  delay.connect(wet);
  wet.connect(bgmGain || masterGain || audioCtx.destination);
  bgmBus.connect(bgmGain || masterGain || audioCtx.destination);
  const now = audioCtx.currentTime;
  const demoMode = game && game.isDemo;
  const targetVol = demoMode ? 0.5 : 1;
  const fade = demoMode ? BGM_FADE * 2 : BGM_FADE;
  bgmBus.gain.linearRampToValueAtTime(targetVol, now + fade);

  bgmTrack = name;
  bgmScheduled = true;
  bgmNoteIdx = 0;
  bgmBassIdx = 0;
  bgmPadIdx = 0;
  bgmNextTime = now + 0.05;
  bgmBassNextTime = now + 0.05;
  bgmPadNextTime  = now + 0.05;
  bgmKickNextTime = now + 0.05;
  bgmHatNextTime  = now + 0.05;
  // Cancel any in-flight scheduler timer from a previous track so chains don't accumulate.
  if (bgmTimerId !== null) { clearTimeout(bgmTimerId); bgmTimerId = null; }
  scheduleBGMNotes();
}

// One-shot noise buffer used for hi-hat ticks. Lazily built when first needed.
function getBgmNoiseBuffer() {
  if (!bgmNoiseBuffer && audioCtx) {
    const len = Math.floor(audioCtx.sampleRate * 0.1);
    bgmNoiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = bgmNoiseBuffer.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  }
  return bgmNoiseBuffer;
}

function scheduleBgmKick(time, dest) {
  // Sine pitch-drop: 120Hz → 45Hz over ~60ms. Tight punchy feel.
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(120, time);
  o.frequency.exponentialRampToValueAtTime(45, time + 0.06);
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(0.18, time + 0.005);
  g.gain.exponentialRampToValueAtTime(0.001, time + 0.10);
  o.connect(g); g.connect(dest);
  o.start(time); o.stop(time + 0.12);
}

function scheduleBgmHat(time, dest) {
  // High-pass-filtered white-noise burst — short and bright.
  const buf = getBgmNoiseBuffer();
  if (!buf) return;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'highpass'; filt.frequency.value = 6000;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.05, time);
  g.gain.exponentialRampToValueAtTime(0.001, time + 0.03);
  src.connect(filt); filt.connect(g); g.connect(dest);
  src.start(time); src.stop(time + 0.05);
}

// Pick the BGM track that matches a gameplay state — used for stage start AND
// pause-resume (P / ESC / gamepad-start) so all four sites stay in sync.
function bgmForGameState(state) {
  if (state !== STATE.BOSS_STAGE) return 'normal';
  if ((game.megaBosses || []).some(mb => mb.alive && mb.phase2)) return 'bossEnrage';
  return game.stage >= 30 ? 'bossSuper' : 'boss';
}

function stopBGM() {
  bgmScheduled = false;
  bgmTrack = null;
  if (bgmTimerId !== null) { clearTimeout(bgmTimerId); bgmTimerId = null; }
  if (bgmBus && audioCtx) {
    const now = audioCtx.currentTime;
    bgmBus.gain.cancelScheduledValues(now);
    bgmBus.gain.setValueAtTime(bgmBus.gain.value, now);
    bgmBus.gain.linearRampToValueAtTime(0, now + BGM_FADE);
    const oldBus = bgmBus;
    bgmBus = null;
    setTimeout(() => { try { oldBus.disconnect(); } catch (e) {} }, (BGM_FADE + 0.05) * 1000);
  }
}

// DYNAMIC BGM INTENSITY — game-state reactive volume scaling.
// Multiplies lead voice volume + force-enables hat layer at high combo.
// Returns ~1.0 in calm play, up to ~1.5 in apex states.
// BGM ARCHETYPE PITCH — boss archetype shifts the lead voice pitch.
// horned (aggressive) → +1 semitone (×1.0595)
// tendril (sinister)  → -1 semitone (×0.9438)
// crystal (cold)      → +2 semitones (×1.122)
// standard / no boss  → base (×1.0)
// First-alive boss decides; super boss keeps base. Snapshotted once per scheduler tick.
function computeBgmPitch() {
  if (!game || !game.megaBosses) return 1.0;
  const alive = game.megaBosses.find(mb => mb.alive);
  if (!alive) return 1.0;
  if (alive.super) return 1.0;  // super boss BGM (bossSuper track) already distinct
  const arc = alive.archetype || 'standard';
  if (arc === 'horned')  return 1.0595;
  if (arc === 'tendril') return 0.9438;
  if (arc === 'crystal') return 1.122;
  return 1.0;
}

function computeBgmIntensity() {
  if (!game) return 1.0;
  let m = 1.0;
  // Combo escalates intensity
  const c = game.combo || 0;
  if (c >= 100)      m += 0.40;
  else if (c >= 60)  m += 0.30;
  else if (c >= 30)  m += 0.20;
  // Boss phase 2 — fight intensity peaks here
  if (game.megaBosses && game.megaBosses.some(mb => mb.alive && mb.phase2)) m += 0.30;
  // Last life — urgency cue
  if (game.lives === 1 && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    m += 0.20;
  }
  return Math.min(1.55, m);
}

function scheduleBGMNotes() {
  bgmTimerId = null;
  if (!bgmScheduled || !audioCtx) return;
  const t = BGM[bgmTrack];
  if (!t) return;
  const beatSec = 60 / t.bpm;
  const AHEAD = 0.4;
  const horizon = audioCtx.currentTime + AHEAD;
  const dest = bgmBus || masterGain || audioCtx.destination;
  // Snapshot intensity ONCE per scheduler tick — not per note — so volumes stay
  // coherent within each scheduling window (~120ms) and don't jitter inside a phrase.
  const intensity = computeBgmIntensity();
  // Snapshot pitch ratio once per tick — applied to lead voice freq below.
  const pitch = computeBgmPitch();

  // --- Lead voice (main + detuned chorus partner for shimmer/width) ---
  while (bgmNextTime < horizon) {
    const [freq, beats] = t.notes[bgmNoteIdx % t.notes.length];
    const dur = beats * beatSec;
    if (freq > 0) {
      const noteDur = dur * 0.75;
      // Lead voice pitch shifted by archetype (×1.0 default, ±semitones for horned/tendril/crystal)
      const voices = [
        { freq: freq * pitch,           vol: t.vol * 0.65 * intensity },
        { freq: freq * pitch * 1.005,   vol: t.vol * 0.35 * intensity }
      ];
      for (const v of voices) {
        const g = audioCtx.createGain();
        g.connect(dest);
        const o = audioCtx.createOscillator();
        o.type = t.type;
        o.frequency.setValueAtTime(v.freq, bgmNextTime);
        g.gain.setValueAtTime(0, bgmNextTime);
        g.gain.linearRampToValueAtTime(v.vol, bgmNextTime + 0.01);
        g.gain.setValueAtTime(v.vol, bgmNextTime + noteDur - 0.02);
        g.gain.linearRampToValueAtTime(0, bgmNextTime + noteDur);
        o.connect(g);
        o.start(bgmNextTime);
        o.stop(bgmNextTime + noteDur);
      }
    }
    bgmNextTime += dur;
    bgmNoteIdx++;
    if (bgmNoteIdx >= t.notes.length) bgmNoteIdx = 0;
  }

  // --- Bass voice (independent rhythm/notes, triangle, lower octave) ---
  if (t.bass && t.bass.length) {
    while (bgmBassNextTime < horizon) {
      const [bfreq, bbeats] = t.bass[bgmBassIdx % t.bass.length];
      const bdur = bbeats * beatSec;
      if (bfreq > 0) {
        const bnoteDur = bdur * 0.85;
        const bvol = t.vol * 0.85;
        const g = audioCtx.createGain();
        g.connect(dest);
        const o = audioCtx.createOscillator();
        o.type = 'triangle';
        o.frequency.setValueAtTime(bfreq, bgmBassNextTime);
        g.gain.setValueAtTime(0, bgmBassNextTime);
        g.gain.linearRampToValueAtTime(bvol, bgmBassNextTime + 0.015);
        g.gain.setValueAtTime(bvol, bgmBassNextTime + bnoteDur - 0.03);
        g.gain.linearRampToValueAtTime(0, bgmBassNextTime + bnoteDur);
        o.connect(g);
        o.start(bgmBassNextTime);
        o.stop(bgmBassNextTime + bnoteDur);
      }
      bgmBassNextTime += bdur;
      bgmBassIdx++;
      if (bgmBassIdx >= t.bass.length) bgmBassIdx = 0;
    }
  }

  // --- Chord pad (sustained sine, slow attack/release for atmospheric depth) ---
  // Polyphonic power-chord voicing: root + perfect fifth (1.5×) + octave (2×).
  // Each at a different mix level so the root stays foundational and the octave shimmers.
  if (t.pad && t.pad.length) {
    while (bgmPadNextTime < horizon) {
      const [pfreq, pbeats] = t.pad[bgmPadIdx % t.pad.length];
      const pdur = pbeats * beatSec;
      if (pfreq > 0) {
        const pnoteDur = pdur * 0.95;
        const attack = Math.min(0.18, pnoteDur * 0.25);
        const release = Math.min(0.22, pnoteDur * 0.30);
        const padVoices = [
          { freq: pfreq,        vol: t.vol * 0.32 },  // root
          { freq: pfreq * 1.5,  vol: t.vol * 0.16 },  // perfect fifth (softer, hangs above root)
          { freq: pfreq * 2.0,  vol: t.vol * 0.10 }   // octave (quietest, just adds shimmer)
        ];
        for (const v of padVoices) {
          const g = audioCtx.createGain();
          g.connect(dest);
          const o = audioCtx.createOscillator();
          o.type = 'sine';
          o.frequency.setValueAtTime(v.freq, bgmPadNextTime);
          g.gain.setValueAtTime(0, bgmPadNextTime);
          g.gain.linearRampToValueAtTime(v.vol, bgmPadNextTime + attack);
          g.gain.setValueAtTime(v.vol, bgmPadNextTime + pnoteDur - release);
          g.gain.linearRampToValueAtTime(0, bgmPadNextTime + pnoteDur);
          o.connect(g);
          o.start(bgmPadNextTime);
          o.stop(bgmPadNextTime + pnoteDur);
        }
      }
      bgmPadNextTime += pdur;
      bgmPadIdx++;
      if (bgmPadIdx >= t.pad.length) bgmPadIdx = 0;
    }
  }

  // --- Kick (interval-based, fixed pitch sweep) ---
  if (t.kick && t.kick > 0) {
    const kickInterval = t.kick * beatSec;
    while (bgmKickNextTime < horizon) {
      scheduleBgmKick(bgmKickNextTime, dest);
      bgmKickNextTime += kickInterval;
    }
  }

  // --- Hi-hat (interval-based noise burst). DYNAMIC: at high intensity (combo 60+
  // or boss phase 2), force-enable hat at a 0.25-beat interval even if the track has
  // hat: 0 — adds urgency texture to otherwise calm tracks like 'normal'.
  let effectiveHat = t.hat || 0;
  if (effectiveHat === 0 && intensity >= 1.30) effectiveHat = 0.25;
  // Also tighten existing hat at peak intensity (combo 100+ or phase 2 + low life)
  else if (effectiveHat > 0 && intensity >= 1.50) effectiveHat = effectiveHat * 0.5;
  if (effectiveHat > 0) {
    const hatInterval = effectiveHat * beatSec;
    while (bgmHatNextTime < horizon) {
      scheduleBgmHat(bgmHatNextTime, dest);
      bgmHatNextTime += hatInterval;
    }
  }

  bgmTimerId = setTimeout(scheduleBGMNotes, 120);
}

function playSound(type) {
  ensureAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const g = audioCtx.createGain();
  g.connect(sfxGain || masterGain || audioCtx.destination);
  const o = audioCtx.createOscillator();
  o.connect(g);
  switch(type) {
    case 'shoot':
      o.type = 'square'; o.frequency.setValueAtTime(880, now);
      o.frequency.exponentialRampToValueAtTime(220, now + 0.08);
      g.gain.setValueAtTime(0.12, now); g.gain.linearRampToValueAtTime(0, now + 0.08);
      o.start(now); o.stop(now + 0.08); break;
    case 'explode':
      var n = audioCtx.createBufferSource();
      var buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.3, audioCtx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      n.buffer = buf; n.connect(g);
      g.gain.setValueAtTime(0.15, now); g.gain.linearRampToValueAtTime(0, now + 0.3);
      n.start(now); n.stop(now + 0.3); o.connect(audioCtx.createGain()); o.start(now); o.stop(now+0.01); break;
    case 'killBee':
      // Quick high-pitch blip — bee dies fast and cheerful
      o.type = 'square';
      o.frequency.setValueAtTime(1200, now);
      o.frequency.exponentialRampToValueAtTime(400, now + 0.06);
      g.gain.setValueAtTime(0.10, now);
      g.gain.linearRampToValueAtTime(0, now + 0.10);
      o.start(now); o.stop(now + 0.10); break;
    case 'killMirror':
      // Glass shatter — high noise burst + sine ping for crystalline feel
      var nM = audioCtx.createBufferSource();
      var bufM = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.15, audioCtx.sampleRate);
      var dM = bufM.getChannelData(0);
      for (var i = 0; i < dM.length; i++) dM[i] = (Math.random() * 2 - 1) * (1 - i / dM.length) * 0.8;
      nM.buffer = bufM; nM.connect(g);
      o.type = 'sine'; o.frequency.setValueAtTime(2400, now);
      o.frequency.exponentialRampToValueAtTime(800, now + 0.12);
      g.gain.setValueAtTime(0.12, now); g.gain.linearRampToValueAtTime(0, now + 0.18);
      nM.start(now); nM.stop(now + 0.15); o.start(now); o.stop(now + 0.18); break;
    case 'killShielded':
      // Metallic clank — square wave low + sustained pitch fall
      o.type = 'square';
      o.frequency.setValueAtTime(220, now);
      o.frequency.linearRampToValueAtTime(140, now + 0.18);
      o.frequency.linearRampToValueAtTime(100, now + 0.28);
      g.gain.setValueAtTime(0.14, now); g.gain.linearRampToValueAtTime(0, now + 0.32);
      o.start(now); o.stop(now + 0.32); break;
    case 'killKamikaze':
      // Heavy thump — sawtooth deep + brief noise burst
      var nK = audioCtx.createBufferSource();
      var bufK = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.2, audioCtx.sampleRate);
      var dK = bufK.getChannelData(0);
      for (var i = 0; i < dK.length; i++) dK[i] = (Math.random() * 2 - 1) * (1 - i / dK.length);
      nK.buffer = bufK; nK.connect(g);
      o.type = 'sawtooth'; o.frequency.setValueAtTime(160, now);
      o.frequency.exponentialRampToValueAtTime(60, now + 0.15);
      g.gain.setValueAtTime(0.18, now); g.gain.linearRampToValueAtTime(0, now + 0.25);
      nK.start(now); nK.stop(now + 0.2); o.start(now); o.stop(now + 0.25); break;
    case 'killUfo':
      // Alien chirp — modulated sine wobbling between two pitches
      o.type = 'sine';
      o.frequency.setValueAtTime(900, now);
      o.frequency.setValueAtTime(600, now + 0.04);
      o.frequency.setValueAtTime(1100, now + 0.08);
      o.frequency.setValueAtTime(500, now + 0.12);
      o.frequency.exponentialRampToValueAtTime(200, now + 0.22);
      g.gain.setValueAtTime(0.12, now); g.gain.linearRampToValueAtTime(0, now + 0.25);
      o.start(now); o.stop(now + 0.25); break;
    case 'killButterfly':
      // Melodic triangle — slightly longer + softer than bee, pink-ish feel
      o.type = 'triangle';
      o.frequency.setValueAtTime(880, now);
      o.frequency.setValueAtTime(740, now + 0.05);
      o.frequency.exponentialRampToValueAtTime(330, now + 0.14);
      g.gain.setValueAtTime(0.10, now); g.gain.linearRampToValueAtTime(0, now + 0.16);
      o.start(now); o.stop(now + 0.16); break;
    case 'killHoverer':
      // Low sustained hum descent — drone-like death
      o.type = 'sawtooth';

      o.frequency.linearRampToValueAtTime(120, now + 0.25);
      g.gain.setValueAtTime(0.10, now);
      g.gain.linearRampToValueAtTime(0, now + 0.28);
      o.start(now); o.stop(now + 0.28); break;
    case 'killSplitter':
      // Two-tone split — first thump, then the "split" (high tail)
      o.type = 'square';
      o.frequency.setValueAtTime(360, now);
      o.frequency.exponentialRampToValueAtTime(180, now + 0.05);
      o.frequency.setValueAtTime(720, now + 0.08);
      o.frequency.exponentialRampToValueAtTime(400, now + 0.18);
      g.gain.setValueAtTime(0.12, now);
      g.gain.linearRampToValueAtTime(0.08, now + 0.07);
      g.gain.linearRampToValueAtTime(0, now + 0.20);
      o.start(now); o.stop(now + 0.20); break;
    case 'killFormationBoss':
      // Heavy double-thump — formation boss falls with weight
      var nB = audioCtx.createBufferSource();
      var bufB = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.25, audioCtx.sampleRate);
      var dB = bufB.getChannelData(0);
      for (var i = 0; i < dB.length; i++) dB[i] = (Math.random() * 2 - 1) * (1 - i / dB.length);
      nB.buffer = bufB; nB.connect(g);
      o.type = 'sawtooth';

      o.frequency.setValueAtTime(140, now + 0.13);

    case 'killGoldenBee':

      o.frequency.setValueAtTime(1568, now + 0.06); // G6
      o.frequency.setValueAtTime(1319, now + 0.12); // E6
      o.frequency.setValueAtTime(2093, now + 0.18); // C7
      g.gain.setValueAtTime(0.10, now);
      g.gain.linearRampToValueAtTime(0, now + 0.35);
      o.start(now); o.stop(now + 0.35); break;
    case 'enemyDive':
      o.type = 'sawtooth'; o.frequency.setValueAtTime(200, now);
      o.frequency.linearRampToValueAtTime(600, now + 0.15);
      o.frequency.linearRampToValueAtTime(150, now + 0.3);

    case 'capture':
      o.type = 'sine'; o.frequency.setValueAtTime(800, now);

      }

      o.start(now); o.stop(now + 1.0); break;
    case 'dualFighter':
      o.type = 'square';
      o.frequency.setValueAtTime(440, now);
      o.frequency.setValueAtTime(554, now + 0.1);
      o.frequency.setValueAtTime(659, now + 0.2);
      o.frequency.setValueAtTime(880, now + 0.3);
      g.gain.setValueAtTime(0.1, now); g.gain.linearRampToValueAtTime(0, now + 0.5);
      o.start(now); o.stop(now + 0.5); break;
    case 'extraLife':
      o.type = 'square';
      [523,659,784,1047].forEach((f,i)=> o.frequency.setValueAtTime(f, now+i*0.1));
      g.gain.setValueAtTime(0.1,now); g.gain.linearRampToValueAtTime(0,now+0.5);
      o.start(now); o.stop(now+0.5); break;
    case 'powerUp':
      o.type = 'triangle';
      [659,880,1175,1568].forEach((f,i)=> o.frequency.setValueAtTime(f, now+i*0.04));
      g.gain.setValueAtTime(0.09,now); g.gain.linearRampToValueAtTime(0,now+0.28);
      o.start(now); o.stop(now+0.28); break;
    case 'comboStep': {
      // Pitch escalates with current combo tier
      const c = (game && game.combo) || 0;
      const tier = c >= 15 ? 3 : c >= 10 ? 2 : c >= 5 ? 1 : 0;
      const baseFreq = 660 + tier * 220;
      o.type = 'square';
      o.frequency.setValueAtTime(baseFreq, now);
      o.frequency.linearRampToValueAtTime(baseFreq * 1.5, now + 0.05);
      o.frequency.linearRampToValueAtTime(baseFreq * 2, now + 0.10);
      g.gain.setValueAtTime(0.07, now); g.gain.linearRampToValueAtTime(0, now + 0.14);
      o.start(now); o.stop(now + 0.14);
      break;
    }
    case 'tick':
      o.type = 'square';
      o.frequency.setValueAtTime(1200, now);
      g.gain.setValueAtTime(0.04, now); g.gain.linearRampToValueAtTime(0, now + 0.04);
      o.start(now); o.stop(now + 0.04); break;
    case 'comboBreak':
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(440, now);
      o.frequency.exponentialRampToValueAtTime(110, now + 0.25);
      g.gain.setValueAtTime(0.07, now); g.gain.linearRampToValueAtTime(0, now + 0.28);
      o.start(now); o.stop(now + 0.28); break;
    case 'lowLife':
      // Slow warning beep for last life
      o.type = 'sine';
      o.frequency.setValueAtTime(330, now);
      o.frequency.exponentialRampToValueAtTime(220, now + 0.25);
      g.gain.setValueAtTime(0.06, now); g.gain.linearRampToValueAtTime(0, now + 0.30);
      o.start(now); o.stop(now + 0.30); break;
    case 'heartbeat':
      // Two-thump heartbeat — low sine pulse with quick double beat.
      // First thump (loud) then secondary thump (softer) 0.18s later, mimics lub-dub.
      o.type = 'sine';
      o.frequency.setValueAtTime(80, now);
      o.frequency.exponentialRampToValueAtTime(40, now + 0.10);
      g.gain.setValueAtTime(0.18, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      // Second thump
      g.gain.setValueAtTime(0.001, now + 0.18);
      g.gain.linearRampToValueAtTime(0.12, now + 0.20);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
      o.frequency.setValueAtTime(80, now + 0.18);
      o.frequency.exponentialRampToValueAtTime(40, now + 0.28);
      o.start(now); o.stop(now + 0.35); break;
    case 'rescue':
      // Up-going victory chime when player rescues their captured ship
      o.type = 'square';
      [392, 523, 659, 784, 988].forEach((f, i) => o.frequency.setValueAtTime(f, now + i * 0.05));
      g.gain.setValueAtTime(0.10, now); g.gain.linearRampToValueAtTime(0, now + 0.5);
      o.start(now); o.stop(now + 0.5); break;
    case 'crit':
      // Sharp crit hit — for shielded enemies breaking
      o.type = 'square';
      o.frequency.setValueAtTime(1500, now);
      o.frequency.exponentialRampToValueAtTime(400, now + 0.08);
      g.gain.setValueAtTime(0.08, now); g.gain.linearRampToValueAtTime(0, now + 0.10);
      o.start(now); o.stop(now + 0.10); break;
    case 'powerMax':

      [523, 659, 784, 1047, 1318].forEach((f, i) => o.frequency.setValueAtTime(f, now + i * 0.05));
      g.gain.setValueAtTime(0.10, now); g.gain.linearRampToValueAtTime(0, now + 0.45);
      o.start(now); o.stop(now + 0.45); break;
    case 'milestoneStage':

      g.gain.setValueAtTime(0.10, now); g.gain.linearRampToValueAtTime(0, now + 0.5);
      o.start(now); o.stop(now + 0.5); break;
    case 'fanfareChallenge':
      // Playful ascending triad — challenge stage = fun bonus round vibe
      o.type = 'triangle';
      [440, 587, 740, 880, 988, 1175, 1318].forEach((f, i) => o.frequency.setValueAtTime(f, now + i * 0.05));
      g.gain.setValueAtTime(0.09, now); g.gain.linearRampToValueAtTime(0, now + 0.45);
      o.start(now); o.stop(now + 0.45); break;
    case 'fanfareBoss':
      // Dark descending sawtooth — looming threat
      o.type = 'sawtooth';
      [294, 233, 196, 165, 147].forEach((f, i) => o.frequency.setValueAtTime(f, now + i * 0.10));
      g.gain.setValueAtTime(0.11, now); g.gain.linearRampToValueAtTime(0, now + 0.6);
      o.start(now); o.stop(now + 0.6); break;
    case 'fanfareSuperBoss':
      // Deep two-stage stinger — grave brass-like
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(110, now);
      o.frequency.setValueAtTime(82, now + 0.20);
      o.frequency.setValueAtTime(110, now + 0.40);
      o.frequency.setValueAtTime(146, now + 0.60);
      g.gain.setValueAtTime(0.14, now);
      g.gain.setValueAtTime(0.10, now + 0.20);
      g.gain.setValueAtTime(0.14, now + 0.40);
      g.gain.linearRampToValueAtTime(0, now + 0.85);
      o.start(now); o.stop(now + 0.85); break;
    case 'gameOver':
      // Slow descending dirge for game-over reveal
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(440, now);
      o.frequency.linearRampToValueAtTime(220, now + 0.4);
      o.frequency.linearRampToValueAtTime(110, now + 0.9);
      g.gain.setValueAtTime(0.10, now); g.gain.linearRampToValueAtTime(0, now + 1.0);
      o.start(now); o.stop(now + 1.0); break;
    case 'graze':
      // Crisp high-pitched tick for grazes — slightly different from regular tick
      o.type = 'sine';
      o.frequency.setValueAtTime(1760, now);
      o.frequency.linearRampToValueAtTime(2200, now + 0.06);
      g.gain.setValueAtTime(0.06, now); g.gain.linearRampToValueAtTime(0, now + 0.08);
      o.start(now); o.stop(now + 0.08); break;
    case 'milestone':
      // Three rising pings for score milestones
      o.type = 'square';
      o.frequency.setValueAtTime(660, now);
      o.frequency.setValueAtTime(990, now + 0.08);
      o.frequency.setValueAtTime(1320, now + 0.16);
      g.gain.setValueAtTime(0.08, now); g.gain.linearRampToValueAtTime(0, now + 0.28);
      o.start(now); o.stop(now + 0.28); break;
    case 'captureSiren':
      // Slow descending wail when a boss starts a capture run
      o.type = 'sine';
      o.frequency.setValueAtTime(660, now);
      o.frequency.linearRampToValueAtTime(220, now + 0.55);
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(0.10, now + 0.05);
      g.gain.linearRampToValueAtTime(0, now + 0.6);
      o.start(now); o.stop(now + 0.6); break;
    case 'bossWarning':
      // Two-tone alarm: high → low → high sweep, sawtooth body for that "alert klaxon" feel
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(880, now);
      o.frequency.linearRampToValueAtTime(440, now + 0.18);
      o.frequency.linearRampToValueAtTime(880, now + 0.36);
      g.gain.setValueAtTime(0.10, now);
      g.gain.linearRampToValueAtTime(0, now + 0.40);
      o.start(now); o.stop(now + 0.40); break;
    case 'slowTime': {
      // Time-warp swoop: descending sine glissando + secondary low pulse for "slowdown" feel
      o.type = 'sine';
      o.frequency.setValueAtTime(1320, now);
      o.frequency.exponentialRampToValueAtTime(110, now + 0.55);
      g.gain.setValueAtTime(0.10, now); g.gain.linearRampToValueAtTime(0, now + 0.6);
      o.start(now); o.stop(now + 0.6);
      // Sub-bass shimmer
      const o2 = audioCtx.createOscillator();
      const g2 = audioCtx.createGain();
      o2.type = 'triangle';
      o2.frequency.setValueAtTime(330, now);
      o2.frequency.exponentialRampToValueAtTime(55, now + 0.55);
      g2.gain.setValueAtTime(0.06, now);
      g2.gain.linearRampToValueAtTime(0, now + 0.6);
      o2.connect(g2); g2.connect(sfxGain || masterGain || audioCtx.destination);
      o2.start(now); o2.stop(now + 0.6);
      return; // we handled start/stop manually
    }
    case 'stageStart':
      o.type = 'square';
      [440,523,659,784].forEach((f,i)=> o.frequency.setValueAtTime(f, now+i*0.15));
      g.gain.setValueAtTime(0.08,now); g.gain.linearRampToValueAtTime(0,now+0.7);
      o.start(now); o.stop(now+0.7); break;
    default:
      o.start(now); o.stop(now+0.01); break;
  }
}

// --- Sprite drawing ---
// SHIP TRAIT AURA — ship-id-specific halo drawn BEHIND the player sprite. Subtle
// visual identity per ship: scout = cyan speed halo, bruiser = orange armor aura.
// Default ship gets no extra aura (its baseline IS the baseline).
function drawShipTraitAura(x, y, shipId) {
  if (!shipId || shipId === 'default') return;
  const t = (game && game.animFrame) || 0;
  ctx.save();
  if (shipId === 'scout') {
    // Speed halo — thin pulsing cyan ring (slim ellipse)
    ctx.globalAlpha = 0.30 + 0.15 * Math.sin(t * 0.20);
    ctx.fillStyle = '#0ff';
    // 4-side thin frame
    ctx.fillRect(x - 9, y - 4, 19, 1);
    ctx.fillRect(x - 9, y + 5, 19, 1);
    ctx.fillRect(x - 10, y - 3, 1, 9);
    ctx.fillRect(x + 10, y - 3, 1, 9);
    // Forward trace marks
    ctx.globalAlpha = 0.40;
    ctx.fillRect(x - 6, y - 7, 1, 1);
    ctx.fillRect(x + 6, y - 7, 1, 1);
  } else if (shipId === 'bruiser') {
    // Armor aura — thicker orange outline (heavier presence)
    ctx.globalAlpha = 0.25 + 0.10 * Math.sin(t * 0.14);
    ctx.fillStyle = '#f80';
    ctx.fillRect(x - 11, y - 4, 23, 2);
    ctx.fillRect(x - 11, y + 4, 23, 2);
    ctx.fillRect(x - 12, y - 3, 2, 9);
    ctx.fillRect(x + 11, y - 3, 2, 9);
    // Heavy corner reinforcement
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#fc4';
    ctx.fillRect(x - 11, y - 4, 2, 1);
    ctx.fillRect(x + 10, y - 4, 2, 1);
    ctx.fillRect(x - 11, y + 5, 2, 1);
    ctx.fillRect(x + 10, y + 5, 2, 1);
  }
  ctx.restore();
}

function drawPlayer(x, y, color, levels) {
  // 4th param `levels` is optional: { S, N, P } from game.lvl. When passed, the ship
  // gets visual upgrades that scale with each axis. Life icons / captured-ship / demo
  // flyby pass nothing → base sprite. This keeps the HUD ship row neutral while the
  // actual player ship reads its progression visually.
  ctx.save(); ctx.translate(x, y);
  const body = color || '#5cf';
  const sLvl = (levels && levels.S) || 1;
  const nLvl = (levels && levels.N) || 1;
  const pLvl = (levels && levels.P) || 1;
  // Pink nose tip
  ctx.fillStyle = '#fab';
  ctx.fillRect(0, -7, 1, 1);
  ctx.fillRect(-1, -6, 3, 1);
  // White cockpit dome (the "face")
  ctx.fillStyle = '#fff';
  ctx.fillRect(-2, -5, 5, 3);
  // Cute eyes
  ctx.fillStyle = '#222';
  ctx.fillRect(-1, -4, 1, 1);
  ctx.fillRect(2, -4, 1, 1);
  // Cheek blush
  ctx.fillStyle = '#f9b';
  ctx.fillRect(-2, -3, 1, 1);
  ctx.fillRect(3, -3, 1, 1);
  // P TIER — cockpit glow ring around the dome (lvl 2+)
  if (pLvl >= 2) {
    ctx.save();
    const gAlpha = pLvl >= 3 ? 0.55 : 0.30;
    ctx.globalAlpha = gAlpha + 0.15 * Math.sin((game && game.animFrame || 0) * 0.18);
    ctx.fillStyle = '#f6f';
    // Halo outline around the white cockpit
    ctx.fillRect(-3, -6, 7, 1);
    ctx.fillRect(-3, -1, 7, 1);
    ctx.fillRect(-3, -5, 1, 4);
    ctx.fillRect(3, -5, 1, 4);
    if (pLvl >= 3) {
      // Lvl 3 — bright magenta glints at corners
      ctx.fillStyle = '#fff';
      ctx.fillRect(-3, -6, 1, 1);
      ctx.fillRect(3, -6, 1, 1);
    }
    ctx.restore();
  }
  // Upper body
  ctx.fillStyle = body;
  ctx.fillRect(-4, -2, 9, 2);
  // Wings spread
  ctx.fillRect(-6, 0, 13, 2);
  // Yellow wing tips (star accents)
  ctx.fillStyle = '#fe4';
  ctx.fillRect(-7, 0, 1, 2);
  ctx.fillRect(7, 0, 1, 2);
  // N TIER — outer winglets (lvl 2+) signal multi-shot capacity
  if (nLvl >= 2) {
    ctx.fillStyle = body;
    ctx.fillRect(-8, 1, 1, 1);
    ctx.fillRect(7, 1, 1, 1);
  }
  if (nLvl >= 3) {
    // Lvl 3 — extended wing tips with green energy spark (matches NUMBER pickup color)
    ctx.fillStyle = body;
    ctx.fillRect(-9, 1, 1, 1);
    ctx.fillRect(8, 1, 1, 1);
    ctx.fillStyle = '#0f8';
    ctx.fillRect(-9, 0, 1, 1);
    ctx.fillRect(8, 0, 1, 1);
  }
  // Lower hull
  ctx.fillStyle = body;
  ctx.fillRect(-3, 2, 7, 2);
  // Engine flames — base 2-tier, with S TIER scaling exhaust width/intensity
  const t = (game && game.animFrame) || 0;
  const flicker = (t & 1) === 0;
  // Outer wide flame (cyan/blue glow halo). Width scales with S tier (level 1 = 7 wide,
  // level 5 = 11 wide). Cap so it doesn't exceed wing span.
  const flameW = Math.min(11, 7 + (sLvl - 1));
  const flameXOff = -flameW / 2 + 0.5;
  ctx.save();
  ctx.globalAlpha = 0.5 + 0.2 * Math.sin(t * 0.4);
  ctx.fillStyle = '#0cf';
  ctx.fillRect(flameXOff, 4, flameW, flicker ? 3 : 2);
  ctx.restore();
  // Mid flame (orange)
  ctx.fillStyle = '#f80';
  ctx.fillRect(-2, 4, 2, 1);
  ctx.fillRect(1, 4, 2, 1);
  // Bright inner core (yellow + flicker tail)
  ctx.fillStyle = '#ff4';
  ctx.fillRect(-1, 4, 1, 1);
  ctx.fillRect(2, 4, 1, 1);
  if (flicker) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 5, 1, 1);
    ctx.fillRect(1, 5, 1, 1);
  }
  // S TIER — extended trail at lvl 3+ (longer streamer below the engine)
  if (sLvl >= 3) {
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.20 * Math.sin(t * 0.5);
    ctx.fillStyle = '#0cf';
    const trailH = sLvl >= 5 ? 4 : sLvl >= 4 ? 3 : 2;
    ctx.fillRect(-1, 7, 1, trailH);
    ctx.fillRect(1, 7, 1, trailH);
    if (sLvl >= 5) {
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 7, 1, 2);
    }
    ctx.restore();
  }
  ctx.restore();
}

    ctx.fillRect(-7, -3, 4, 4);

// Mirror clone — ghostly cyan copy of the player ship that tracks mirrored x.
function drawMirror(x, y, frame) {

// Boomerang hover — helicopter with rotating top blades + side wings, mid-stage threat.
function drawHoverer(x, y, frame) {
  ctx.save(); ctx.translate(x, y);
  const t = performance.now() * 0.012;
  // Rotating top rotor (4-blade, fast)
  const ph = (frame * 0.6 + t) % (Math.PI * 2);
  ctx.fillStyle = '#888';
  for (let k = 0; k < 4; k++) {
    const a = ph + k * Math.PI / 2;
    const len = 7;
    const ex = Math.cos(a) * len, ey = Math.sin(a) * len * 0.4;
    ctx.fillRect(Math.round(ex) - 0, Math.round(ey - 6), 1, 1);
  }
  // Top hub
  ctx.fillStyle = '#bbb';
  ctx.fillRect(-1, -7, 2, 1);
  // Body — round-ish chunky cabin
  ctx.fillStyle = '#a85';
  ctx.fillRect(-6, -5, 12, 5);
  ctx.fillRect(-7, -3, 14, 4);
  ctx.fillRect(-5, 1, 10, 2);
  // Cabin window (cyan)
  ctx.fillStyle = '#0cf';
  ctx.fillRect(-4, -4, 4, 3);
  ctx.fillStyle = '#fff';
  ctx.fillRect(-3, -4, 1, 1);
  // Eye / pilot dot
  ctx.fillStyle = '#000';
  ctx.fillRect(2, -2, 2, 2);
  // Side wings (gun barrels)
  ctx.fillStyle = '#642';
  ctx.fillRect(-9, -1, 3, 1);
  ctx.fillRect(6, -1, 3, 1);
  // Tail rotor (small, on the right)
  ctx.fillStyle = '#999';
  ctx.fillRect(7, -6, 1, ((frame % 4 < 2) ? 4 : 1));
  ctx.restore();
}
