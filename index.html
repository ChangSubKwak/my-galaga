          game.explosions.push({ x: oldX, y: mb.y, timer: 0, maxTime: 18 });
          game.explosions.push({ x: mb.x, y: mb.y, timer: 0, maxTime: 18 });
          if (game.shockwaves) {
            game.shockwaves.push({ x: mb.x, y: mb.y, life: 0, maxLife: 16, maxR: 16, color: '#a8f' });
          }
          playSound('powerUp');
        }
      }
    }
  }

  // Hit flash
  if (mb.hitFlash > 0) mb.hitFlash--;

  // Bullet hits mega-boss
  for (let bi = game.bullets.length - 1; bi >= 0; bi--) {
    const b = game.bullets[bi];
    const hitRX = mb.super ? 21 : 14;
    const hitRY = mb.super ? 18 : 12;
    // PHANTOM teleFlash invincibility — boss is intangible during teleport flash
    if ((mb.teleFlash || 0) > 0) continue;
    if (Math.abs(b.x - mb.x) < hitRX && Math.abs(b.y - mb.y) < hitRY) {
      game.bullets.splice(bi, 1);
      game.stats.shotsHit++;
      game.stageShotsHit++;
      const dmgDealt = b.dmg || 1;
      // CRIT hit feedback at boss hit site
      if (b.crit) {
        game.floatTexts.push({
          x: b.x + (Math.random() * 4 - 2), y: b.y - 8,
          text: 'CRIT!', color: '#fc4', life: 30, maxLife: 30, size: 7
        });
        // CRIT GOLD RING — small expanding shockwave + 6 gold sparks. Makes
        // crit hits feel substantively heavier even on bosses where the
        // damage gets absorbed without a kill.
        if (game.shockwaves) {
          game.shockwaves.push({
            x: b.x, y: b.y, life: 0, maxLife: 16, maxR: 18, color: '#fc4'
          });
        }
        for (let _k = 0; _k < 6; _k++) {
          const _a = (_k / 6) * Math.PI * 2;
          game.itemBursts.push({
            x: b.x + Math.cos(_a) * 5,
            y: b.y + Math.sin(_a) * 5,
            life: -_k, color: '#fc4'
          });
        }
      }
      mb.hp -= dmgDealt;
      // BOSS HIT IMPACT SCALE — shake/flash scale with damage so heavy weapons
      // (laser, synergy, perks) feel substantively heavier on impact.
      mb.hitFlash = dmgDealt >= 3 ? 14 : dmgDealt >= 2 ? 11 : 8;
      const _hitShake = dmgDealt >= 3 ? 8 : dmgDealt >= 2 ? 6 : 4;
      game.shakeTimer = Math.max(game.shakeTimer || 0, _hitShake);
      game.hitSparks.push({x: b.x, y: b.y, life: 0});
      // BOSS DAMAGE NUMBERS — small floating damage readout per hit. Color codes by
      // weapon: laser = magenta (piercing+1), wave/homing = cyan (special), default = white.
      // Frame-capped via game._dmgNumThisFrame so chain hits don't spawn 20+ texts at once.
      game._dmgNumThisFrame = (game._dmgNumThisFrame || 0);
      if (game._dmgNumThisFrame < 3) {
        let dmgCol = '#fff';
        if (b.kind === 'laser') dmgCol = '#f6c';
        else if (b.kind === 'wave' || b.kind === 'homing') dmgCol = '#6cf';
        else if (dmgDealt >= 2) dmgCol = '#fc4';
        // BIG HIT TEXT — size scales with damage. 3+ = big bold, 2 = normal+,
        // 1 = compact. Makes heavy-hit moments read at a glance.
        const _dmgSize = dmgDealt >= 3 ? 9 : dmgDealt >= 2 ? 7 : 5;
        game.floatTexts.push({
          x: b.x + (Math.random() * 6 - 3),
          y: b.y - 4,
          text: '-' + dmgDealt,
          color: dmgCol, life: dmgDealt >= 3 ? 40 : 28, maxLife: dmgDealt >= 3 ? 40 : 28,
          size: _dmgSize
        });
        game._dmgNumThisFrame++;
      }
      if (mb.hp <= 0) {
        mb.alive = false;
        game.stats.kills++;
        game.stageKills = (game.stageKills || 0) + 1;
        game.bossesKilledThisRun = (game.bossesKilledThisRun || 0) + 1;
        // SIGNAL INTERCEPT — first kill of run case (if boss is first hostile downed)
        if (game.stats.kills === 1 && typeof pushIntercept === 'function') {
          pushIntercept('firstBlood');
        }
        // SIGNAL INTERCEPT — first boss kill of run (== 1 exact match)
        if (game.bossesKilledThisRun === 1 && typeof pushIntercept === 'function') {
          pushIntercept('firstBoss');
        }
        // SIGNAL INTERCEPT — 100 kill milestone — also fires here if boss is the 100th kill
        if (game.stats.kills === 100 && typeof pushIntercept === 'function') {
          pushIntercept('killMaster');
        }
        // SIGNAL INTERCEPT — 500 kill milestone — also fires here if boss is the 500th kill
        if (game.stats.kills === 500 && typeof pushIntercept === 'function') {
          pushIntercept('extinction');
        }
        bumpCombo();
        unlockAchievement('bossSlayer');
        if (mb.super) {
          unlockAchievement('superSlayer');
          const accTotal = game.stats.shotsFired === 0 ? 0
            : Math.round((game.stats.shotsHit / game.stats.shotsFired) * 100);
          if (accTotal >= 80) unlockAchievement('superBeat');
        }
        if (game.megaBosses && game.megaBosses.length === 2 && game.megaBosses.every(b => !b.alive)) {
          unlockAchievement('doubleBeat');
          // DOUBLE KO BANNER — both bosses cleared. Surface as gold banner +
          // confetti + milestone SFX for the rare double-stage moment.
          if (!game._doubleKoFired) {
            game._doubleKoFired = true;
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 - 60, text: 'DOUBLE KO!',
              color: '#fc4', life: 110, maxLife: 110, size: 12, glow: 8
            });
            if (typeof spawnConfetti === 'function') spawnConfetti(16);
            if (typeof playSound === 'function') playSound('milestone');
          }
        }
        rumble(500, 0.9, 0.7);
        game.hitStopFrames = Math.max(game.hitStopFrames || 0, 14);
        // FLAWLESS BOSS — boss downed with zero hits taken this stage (stageHitTaken
        // counts deaths + shield absorbs + cheat eats, so 0 means truly untouched).
        // Once per stage via _flawlessBossFired (reset in startStage). Gold banner +
        // per-run + lifetime counters. Rare clean-execution skill signature.
        if ((game.stageHitTaken || 0) === 0 && !game._flawlessBossFired) {
          game._flawlessBossFired = true;
          game.runFlawlessBosses = (game.runFlawlessBosses || 0) + 1;
          game.floatTexts.push({
            x: BASE_W/2, y: BASE_H/2 - 42, text: 'FLAWLESS KILL',
            color: '#fc4', life: 100, maxLife: 100, size: 10, glow: 7
          });
          try {
            const _fb = parseInt(localStorage.getItem('galagaFlawlessBosses') || '0', 10) || 0;
            localStorage.setItem('galagaFlawlessBosses', String(_fb + 1));
          } catch (_eFB) {}
          if (typeof playSound === 'function') playSound('extraLife');
          // NARRATIVE FUSION — enemy comms react to the untouched takedown.
          if (typeof pushIntercept === 'function') pushIntercept('flawlessKill');
        }
        // Cinematic camera cut: black bars + slow zoom for ~60 frames
        game.cinematicBars = Math.max(game.cinematicBars || 0, 60);
        // Gold rain — 50 small coin particles falling slowly across the upper half of the screen
        const goldCols = ['#fc4', '#ff8', '#fff', '#fa0'];
        for (let g = 0; g < 50; g++) {
          game.debris.push({
            x: 12 + Math.random() * (BASE_W - 24),
            y: -4 - Math.random() * 30,
            vx: (Math.random() - 0.5) * 0.6,
            vy: 0.4 + Math.random() * 1.2,
            life: -Math.floor(Math.random() * 30),
            maxLife: 90 + Math.floor(Math.random() * 60),
            color: goldCols[Math.floor(Math.random() * goldCols.length)],
            size: Math.random() < 0.4 ? 2 : 1
          });
        }
        for (let i = 0; i < 6; i++) {
          game.explosions.push({x: mb.x + (Math.random()-0.5)*24, y: mb.y + (Math.random()-0.5)*16, timer: 0, maxTime: 28});
        }
        // BOSS DEATH SHARDS — 10 large rotating jagged debris pieces flying outward
        // from boss center. Distinct from the small gold rain by size + rotation +
        // archetype-colored hue. Adds cinematic break-apart feel.
        {
          const _archCol = mb.archetype === 'horned'  ? '#f8a'
                         : mb.archetype === 'tendril' ? '#0fa'
                         : mb.archetype === 'crystal' ? '#0cf'
                         : mb.archetype === 'phantom' ? '#a8f'
                         : mb.archetype === 'rune'    ? '#fc8'
                         : '#fc4';
          for (let s = 0; s < 10; s++) {
            const _ang = (s / 10) * Math.PI * 2 + Math.random() * 0.4;
            const _sp = 0.6 + Math.random() * 1.4;
            game.debris.push({
              x: mb.x + Math.cos(_ang) * 4,
              y: mb.y + Math.sin(_ang) * 4,
              vx: Math.cos(_ang) * _sp,
              vy: Math.sin(_ang) * _sp - 0.2,
              life: -Math.floor(Math.random() * 12),
              maxLife: 90 + Math.floor(Math.random() * 40),
              color: _archCol,
              size: 3 + Math.floor(Math.random() * 2)
            });
          }
        }
        const PT = ['S', 'N', 'P'];
        for (let i = 0; i < 3; i++) {
          game.powerUps.push({x: mb.x + (i-1)*14, y: mb.y, vy: 0.7, type: PT[i]});
        }
        // BOSS BONUS DROP — 25% chance for a 4th surprise pickup from timer pool.
        // Sits below the trio so the player sees the trio first then catches the
        // bonus. Floats text "BONUS DROP!" at the spawn site for clarity.
        if (Math.random() < 0.25) {
          const BONUS_TYPES = ['T', 'R', 'W', 'H', 'L'];
          const bt = BONUS_TYPES[Math.floor(Math.random() * BONUS_TYPES.length)];
          game.powerUps.push({ x: mb.x, y: mb.y - 12, vy: 0.55, type: bt });
          game.floatTexts.push({
            x: mb.x, y: mb.y - 28, text: 'BONUS DROP!',
            color: '#0ef', life: 60, maxLife: 60, size: 7
          });
        }
        const mbBase = 5000 + game.stage * 500;
        let mbBounty = Math.round(mbBase * comboMultiplier(game.combo));
        // PERK 'bountyHunter' — boss bounty +50%. Surfaced in the bounty banner.
        const _bountyHunter = game.activePerk === 'bountyHunter';
        if (_bountyHunter) mbBounty = Math.round(mbBounty * 1.5);
        addScore(mbBounty);
        // BOSS BOUNTY label — large yellow score popup at the boss kill site
        game.floatTexts.push({
          x: mb.x, y: mb.y - 18, text: _bountyHunter ? 'BOUNTY HUNTER' : 'BOSS BOUNTY',
          color: '#fc4', life: 90, maxLife: 90, size: 10
        });
        game.floatTexts.push({
          x: mb.x, y: mb.y - 6, text: '+' + fmtScore(mbBounty),
          color: '#ff4', life: 90, maxLife: 90, size: 12
        });
        // BOSS DEATH TAUNT — final line as the boss falls. Uses 'death' situation
        // from BOSS_TAUNTS. Cooldown bypassed here because this is the boss's last word.
        const deathLine = tauntFor(mb.archetype, 'death');
        if (deathLine) {
          mb.tauntText = deathLine;
          mb.tauntLife = 90;
          mb.tauntMax  = 90;
          mb.tauntCooldown = 0;
        }
        // BOSS DEATH WHISPER — atmospheric closing line layered over the taunt.
        // Archetype-themed cosmic farewell. Faded gold/white tone, distinct
        // from the boss's own death taunt color. Adds narrative weight to the kill.
        const _BOSS_FAREWELLS = {
          standard: ['THE LINE HOLDS NO MORE', 'COLUMN BREAKS'],
          horned:   ['THE CROWN FALLS', 'NO HEIRS REMAIN'],
          tendril:  ['THE WEAVE UNRAVELS', 'STRANDS GO DARK'],
          crystal:  ['THE FACETS SHATTER', 'LIGHT ESCAPES THE PRISM'],
          phantom:  ['THE ECHO FADES', 'NO MORE WHISPERS'],
          rune:     ['THE GLYPHS DIM', 'WORDS LOSE MEANING']
        };
        const _far = _BOSS_FAREWELLS[mb.archetype] || _BOSS_FAREWELLS.standard;
        const _fLine = _far[Math.floor(Math.random() * _far.length)];
        game.floatTexts.push({
          x: mb.x, y: mb.y + 18,
          text: _fLine, color: '#fc8',
          life: 100, maxLife: 100, size: 5
        });
        // Only clear bullets when the LAST boss falls (otherwise remaining boss is unfairly defanged)
        if (!game.megaBosses || game.megaBosses.every(x => !x.alive)) {
          game.enemyBullets = [];
          // ACT END SEAL — when this boss kill closes an act (stage 10/20/30/50/70/90),
          // display "ACT N COMPLETE" banner + atmospheric subtitle + cinematic letterbox
          // extension. Stage 80 has its own GAME COMPLETE ceremony and is skipped here.
          if (game.stage !== 80) {
            const _aEnd = (typeof actEndingAt === 'function') ? actEndingAt(game.stage) : null;
            if (_aEnd) {
              game.floatTexts.push({
                x: BASE_W / 2, y: 60, text: 'ACT ' + _aEnd.num + ' COMPLETE',
                color: _aEnd.col, life: 180, maxLife: 180, size: 12
              });
              game.floatTexts.push({
                x: BASE_W / 2, y: 76, text: _aEnd.title + ' — ' + _aEnd.sub,
                color: '#cfc', life: 180, maxLife: 180, size: 5
              });
              game.cinematicBars = Math.max(game.cinematicBars || 0, 120);
              if (typeof pushIntercept === 'function') pushIntercept('actEnd');
            }
          }
          // BOSS DEFEATED CHECKLIST — mark the boss for this stage as defeated.
          // Keyed by milestone-stage (10/20/30/...) so each unique BOSS_NAMES entry
          // is tracked. Cycles past stage 90 don't re-toggle (history is set-once).
          try {
            const bossKey = String(game.stage);
            const raw = localStorage.getItem('galagaBossesDefeated') || '{}';
            const obj = JSON.parse(raw);
            if (!obj[bossKey]) {
              obj[bossKey] = true;
              localStorage.setItem('galagaBossesDefeated', JSON.stringify(obj));
            }
          } catch (e) {}
          // STAGE 80 GAME COMPLETE — defeating THE FINAL WALL closes the narrative arc.
          // Bigger ceremony than regular boss kill: massive confetti, banner text, and
          // a persistent counter for repeat clears.
          if (game.stage === 80) {
            try {
              const cnt = parseInt(localStorage.getItem('galagaGameCompleteCount') || '0', 10) + 1;
              localStorage.setItem('galagaGameCompleteCount', String(cnt));
              if (cnt === 1) unlockAchievement('achGod'); // first clear unlocks the apex achievement
            } catch (e) {}
            // Massive confetti rain
            spawnConfetti(60);
            game.flashTimer = 24;
            game.flashColor = '#fc4';
            game.shakeTimer = Math.min(20, (game.shakeTimer || 0) + 16);
            game.cinematicBars = Math.max(game.cinematicBars || 0, 90);
            // Banner: 3 stacked floatTexts
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 - 30, text: 'GAME COMPLETE',
              color: '#fc4', life: 240, maxLife: 240, size: 16
            });
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 - 12, text: 'YOU PASSED THE LAST WALL',
              color: '#fff', life: 240, maxLife: 240, size: 8
            });
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2, text: 'WRITE YOUR OWN MAPS',
              color: '#cfc', life: 240, maxLife: 240, size: 6
            });
            // STAGE 80 ENDING SEQUENCE — +20000 mission-complete bonus + cinematic
            // outro message that scales with repeat clears. First-time completion
            // gets the canonical line; repeats get a runner-up message.
            addScore(20000);
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 + 14, text: 'MISSION BONUS +20,000',
              color: '#ff4', life: 240, maxLife: 240, size: 9
            });
            // Repeat-clear flavor text (varies with completion count)
            try {
              const cnt2 = parseInt(localStorage.getItem('galagaGameCompleteCount') || '1', 10) || 1;
              const flavor = cnt2 === 1 ? 'THE FRONTIER IS YOURS NOW.'
                          : cnt2 <= 3   ? 'AGAIN — THE WALL STILL FALLS.'
                          :               'YOU ARE THE LIVING LEGEND. (×' + cnt2 + ')';
              game.floatTexts.push({
                x: BASE_W/2, y: BASE_H/2 + 26, text: flavor,
                color: '#fc8', life: 240, maxLife: 240, size: 6
              });
            } catch (e) {}
            playSound('extraLife');
            setTimeout(() => playSound('dualFighter'), 220);
            setTimeout(() => playSound('milestoneStage'), 440);
            rumble(640, 0.95, 0.65);
          }
          // POST-BOSS PERK SELECT — open the choice window so the player picks a buff
          // before the next stage begins. activePerk is replaced; previous perk expires.
          game.perkOffered = pickPerkOffer();
          game.perkSelectFrames = PERK_SELECT_FRAMES;
          // Blitz kill bonus — defeat all bosses fast (under ~12 seconds)
          const elapsed = (game.runFrames || 0) - (game.bossStartFrame || 0);
          const BLITZ_FRAMES = 720;
          if (elapsed > 0 && elapsed <= BLITZ_FRAMES) {
            const speedFactor = 1 - elapsed / BLITZ_FRAMES;
            const blitzBonus = Math.round(3000 + speedFactor * 7000);
            addScore(blitzBonus);
            // Achievement: under 5 seconds (300 frames)
            if (elapsed <= 300) unlockAchievement('blitzKiller');
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 - 20, text: 'BLITZ KILL!',
              color: '#ff4', life: 110, maxLife: 110, size: 14
            });
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 - 6, text: '+' + blitzBonus,
              color: '#fc4', life: 110, maxLife: 110, size: 12
            });
          }
        }
        playSound('explode');
      }
      break;
    }
  }

  // Mega-boss ramming player (skip while invincible)
  const ramRX = mb.super ? 21 : 14;
  const ramRY = mb.super ? 27 : 18;
  if (game.playerAlive && game.invincibleTimer <= 0 && Math.abs(mb.x - game.playerX) < ramRX && Math.abs(mb.y - game.playerY) < ramRY) {
    killPlayer();
  }
}

function drawMegaBoss(x, y, frame, hit, archetype) {
  ctx.save();
  ctx.translate(x, y);
  const f = frame % 2;
  // Archetype tints the *body color* — same shape, different identity:
  //   standard → hot pink, horned → crimson, tendril → teal, crystal → indigo
  const arc = archetype || 'standard';
  const baseMain = arc === 'horned'  ? '#f44'
                 : arc === 'tendril' ? '#2cc'
                 : arc === 'crystal' ? '#85f'
                 : '#f4a';
  const baseAccent = arc === 'horned'  ? '#a22'
                   : arc === 'tendril' ? '#066'
                   : arc === 'crystal' ? '#42a'
                   : '#a4f';
  const main = hit ? COL.gray : baseMain;
  const accent = hit ? COL.darkBlue : baseAccent;
  const trim = hit ? '#444' : '#fc4';          // gold crown
  const yo = f === 0 ? 0 : -1;                 // crown bob
  // Crown spikes
  ctx.fillStyle = trim;
  ctx.fillRect(-11, -22 + yo, 3, 6);
  ctx.fillRect(-2, -25 + yo, 4, 9);
  ctx.fillRect(8, -22 + yo, 3, 6);
  // Crown gems
  ctx.fillStyle = '#0ff';
  ctx.fillRect(-10, -20 + yo, 1, 1);
  ctx.fillRect(0, -22 + yo, 2, 2);
  ctx.fillRect(9, -20 + yo, 1, 1);
  // Crown band
  ctx.fillStyle = trim;
  ctx.fillRect(-12, -17, 24, 2);
  // Round chubby body
  ctx.fillStyle = main;
  ctx.fillRect(-12, -15, 24, 5);
  ctx.fillRect(-15, -10, 30, 8);
  ctx.fillRect(-13, -2, 26, 8);
  ctx.fillRect(-10, 6, 20, 4);
  ctx.fillRect(-7, 10, 14, 2);
  // Tummy patch (lighter)
  ctx.fillStyle = '#fbd';
  ctx.fillRect(-7, -3, 14, 8);
  // Big sparkly eyes (white)
  ctx.fillStyle = '#fff';
  ctx.fillRect(-11, -13, 7, 7);
  ctx.fillRect(4, -13, 7, 7);
  // Pupils
  ctx.fillStyle = accent;
  ctx.fillRect(-9, -11, 4, 4);
  ctx.fillRect(5, -11, 4, 4);
  // Eye sparkles
  ctx.fillStyle = '#fff';
  ctx.fillRect(-8, -10, 2, 2);
  ctx.fillRect(6, -10, 2, 2);
  ctx.fillRect(-5, -8, 1, 1);
  ctx.fillRect(9, -8, 1, 1);
  // Cheek blush
  ctx.fillStyle = '#f6c';
  ctx.fillRect(-14, -5, 2, 2);
  ctx.fillRect(12, -5, 2, 2);
  // Mouth (cute fang smile)
  ctx.fillStyle = '#411';
  ctx.fillRect(-3, 1, 6, 2);
  ctx.fillStyle = '#fff';
  ctx.fillRect(-2, 1, 1, 1);
  ctx.fillRect(2, 1, 1, 1);
  // Side wings (flap)
  ctx.fillStyle = accent;
  if (f === 0) {
    ctx.fillRect(-19, -8, 4, 8);
    ctx.fillRect(15, -8, 4, 8);
  } else {
    ctx.fillRect(-20, -10, 5, 11);
    ctx.fillRect(15, -10, 5, 11);
  }
  // Wing trim
  ctx.fillStyle = '#fae';
  if (f === 0) {
    ctx.fillRect(-19, 0, 4, 1);
    ctx.fillRect(15, 0, 4, 1);
  } else {
    ctx.fillRect(-20, 1, 5, 1);
    ctx.fillRect(15, 1, 5, 1);
  }
  // Little feet
  ctx.fillStyle = main;
  ctx.fillRect(-7, 12, 4, 2);
  ctx.fillRect(3, 12, 4, 2);
  // Toe accents
  ctx.fillStyle = '#fbd';
  ctx.fillRect(-5, 13, 1, 1);
  ctx.fillRect(5, 13, 1, 1);

  // Archetype decorations — drawn on top of base body, hit flash dims with the rest.
  if (!hit) {
    if (arc === 'horned') {
      // Twin curving demon horns above the crown
      ctx.fillStyle = '#822';
      ctx.fillRect(-13, -28 + yo, 2, 4);
      ctx.fillRect(-14, -32 + yo, 2, 4);
      ctx.fillRect(11, -28 + yo, 2, 4);
      ctx.fillRect(12, -32 + yo, 2, 4);
      ctx.fillStyle = '#f88';
      ctx.fillRect(-14, -32 + yo, 1, 1);
      ctx.fillRect(13, -32 + yo, 1, 1);
    } else if (arc === 'tendril') {
      // Four tentacle-like extrusions on the lower-side body, animated to wave with frame
      ctx.fillStyle = baseAccent;
      const wob = f === 0 ? 0 : 1;
      ctx.fillRect(-19, 4 + wob, 3, 4);
      ctx.fillRect(-21, 7 + wob, 2, 4);
      ctx.fillRect(16, 4 + wob, 3, 4);
      ctx.fillRect(19, 7 + wob, 2, 4);
      ctx.fillStyle = '#0ff';
      ctx.fillRect(-21, 10 + wob, 1, 1);
      ctx.fillRect(19, 10 + wob, 1, 1);
    } else if (arc === 'crystal') {
      // Four diamond-shaped gem nodes orbiting around the body (frame-synced)
      const nodes = f === 0
        ? [[-16, -6], [16, -6], [-13, 8], [13, 8]]
        : [[-15, -7], [15, -7], [-14, 7], [14, 7]];
      for (const [nx, ny] of nodes) {
        ctx.fillStyle = '#fff';
        ctx.fillRect(nx, ny - 1, 1, 1);
        ctx.fillRect(nx + 1, ny, 1, 1);
        ctx.fillRect(nx, ny + 1, 1, 1);
        ctx.fillRect(nx - 1, ny, 1, 1);
        ctx.fillStyle = '#a8f';
        ctx.fillRect(nx, ny, 1, 1);
      }
    }
  }
  ctx.restore();
}

// STAGE MUTATIONS — random rule changes for normal stages.
// Picked at startStage; only on stage > 4 and stage % 4 !== 0 (skip CHALLENGING) and
// stage % 10 !== 0 (skip BOSS). 30% trigger so most stages stay vanilla.
// Each mutation flips one specific rule — kept narrow so balance impact is predictable.
const STAGE_MUTATIONS = [
  { id: 'rapidFire',    label: 'RAPID FIRE',   color: '#fc4', desc: 'YOUR FIRE 1.7X' },
  { id: 'fastDives',    label: 'FAST DIVES',   color: '#f44', desc: 'ENEMIES DIVE 1.3X' },
  { id: 'slowBullets',  label: 'SLOW BULLETS', color: '#8df', desc: 'ENEMY BULLETS 0.7X' },
  { id: 'denseFire',    label: 'DENSE FIRE',   color: '#f80', desc: 'ENEMY FIRE 1.4X' }
];

// DAILY DETERMINISTIC MODIFIER — when daily mode is active, pick a mutation
// FROM THE DATE SEED instead of randomly. This means everyone playing today
// gets the same modifier — a shared weekly challenge cycle (1 of 4 per day).
// Always applies every stage in daily mode (not 30% chance) so the daily
// modifier is a persistent rule, not a surprise.
function dailyMutation() {
  const seed = dailySeed() | 0;
  return STAGE_MUTATIONS[seed % STAGE_MUTATIONS.length];
}

function pickStageMutation() {
  if (!game) return null;
  if (game.stage <= 4) return null;                            // tutorial window
  if (game.stage % BOSS_STAGE_INTERVAL === 0) return null;     // boss stages stay clean
  if (game.stage % 4 === 0) return null;                       // challenging stays clean
  if (game.challengeMode) return null;                         // challenge mode is fixed
  // Daily mode: deterministic, always-on. Same modifier every stage today.
  if (game.dailyMode) return dailyMutation();
  if (Math.random() >= 0.30) return null;                      // 30% trigger rate
  return STAGE_MUTATIONS[Math.floor(Math.random() * STAGE_MUTATIONS.length)];
}

function startStage() {
  game.bullets = [];
  game.enemyBullets = [];
  game.explosions = [];
  game.powerUps = [];
  game.playerAlive = true;
  game.capturedShipEnemy = null;
  game.diveTimer = 0;
  game.breathPhase = 0;
  game.shakeTimer = 0;
  // STAGE START GRACE — 60-frame invincibility so the player can settle position
  // without taking an immediate hit from a kamikaze / stray bullet at entry.
  game.invincibleTimer = Math.max(game.invincibleTimer || 0, 60);
  // MISSION START BANNER — stage 1 entry signals a fresh run. Subtle cyan
  // 'MISSION START' float text + tick SFX. Helps mark the new-run beat
  // alongside score reset etc.
  if (game.stage === 1 && (game.stats && (game.stats.kills || 0) === 0)) {
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 - 60,
      text: 'MISSION START',
      color: '#0cf', life: 90, maxLife: 90, size: 8
    });
    if (typeof playSound === 'function') playSound('tick');
    // RUN MODE LABEL — under MISSION START, surface active mode flags
    // (hard/easy / challenge / daily). Helps the player remember the session
    // config that affects scoring, lives, drop tables, etc.
    const _modeParts = [];
    if (difficultyMode === 'hard') _modeParts.push('HARD');
    else if (difficultyMode === 'easy') _modeParts.push('EASY');
    if (game.challengeMode) _modeParts.push('CHALLENGE');
    if (game.dailyMode) _modeParts.push('DAILY');
    if (_modeParts.length > 0 && game.floatTexts) {
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 48,
        text: _modeParts.join(' · '),
        color: '#fc4', life: 80, maxLife: 80, size: 5
      });
    }
  }
  // STAGE 80 FINAL APPROACH BANNER — last canonical boss stage. Special
  // 'FINAL APPROACH' + 'STAGE 80' banner stack + extra confetti. Only fires
  // when entering 80 fresh (not after dying mid-stage).
  if (game.stage === 80 && !game._stage80Fired) {
    game._stage80Fired = true;
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 - 70,
      text: 'FINAL APPROACH',
      color: '#fc4', life: 140, maxLife: 140, size: 8
    });
    if (typeof playSound === 'function') playSound('milestone');
    if (typeof spawnConfetti === 'function') spawnConfetti(18);
    game.flashTimer = Math.max(game.flashTimer || 0, 10);
    game.flashColor = '#f44';
  }
  // STAGE 90 — COMMS DARK banner. Pairs with LOG 12 (TRANSMISSION_LOGS[90]).
  // Tone: pilot drifted past the comms grid. Dark cyan, no flash — the quiet
  // earned by the few who reach here.
  if (game.stage === 90 && !game._stage90Fired) {
    game._stage90Fired = true;
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 - 70,
      text: 'COMMS DARK',
      color: '#48f', life: 150, maxLife: 150, size: 8, glow: 6
    });
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 - 54, text: 'STAGE 90',
      color: '#8af', life: 140, maxLife: 140, size: 11, glow: 7
    });
    if (typeof playSound === 'function') playSound('bossWarning');
  }
  // STAGE 100 — BEYOND THE MAP banner. Pairs with LOG 13 (TRANSMISSION_LOGS[100])
  // and LEGEND epitaph tier. Bright gold + confetti + flash — endgame ovation
  // for the rare pilot who clears the canonical 100-stage arc.
  if (game.stage === 100 && !game._stage100Fired) {
    game._stage100Fired = true;
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 - 70,
      text: 'BEYOND THE MAP',
      color: '#fc4', life: 170, maxLife: 170, size: 8, glow: 6
    });
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 - 54, text: 'STAGE 100',
      color: '#fc4', life: 160, maxLife: 160, size: 13, glow: 8
    });
    if (typeof playSound === 'function') playSound('milestone');
    if (typeof spawnConfetti === 'function') spawnConfetti(30);
    game.flashTimer = Math.max(game.flashTimer || 0, 14);
    game.flashColor = '#fc4';
  }
  // QUARTER MILESTONE BANNER — at stage 25/50/75 entry, brief gold banner +
  // milestone SFX. Marks the long-arc progression beyond the 10-stage boss cadence.
  if (game.stage === 25 || game.stage === 50 || game.stage === 75) {
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 - 50, text: 'QUARTER POINT ★ ' + game.stage,
      color: '#fc4', life: 120, maxLife: 120, size: 10, glow: 6
    });
    if (typeof playSound === 'function') playSound('milestone');
    if (typeof spawnConfetti === 'function') spawnConfetti(12);
  }
  // COMBO CARRY BANNER — surface when combo >= 5 carries into the new stage.
  // Reminds the player to keep killing fast to preserve the multiplier.
  if ((game.combo || 0) >= 5) {
    // TIER NAME — same scale as HUD combo tier label
    const _ctN = game.combo >= 30 ? 'MAX'
              : game.combo >= 20 ? 'PLATINUM'
              : game.combo >= 15 ? 'GOLD'
              : game.combo >= 10 ? 'SILVER'
              : 'BRONZE';
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 + 50,
      text: 'COMBO CARRIES x' + game.combo + ' (' + _ctN + ')',
      color: '#0ff', life: 80, maxLife: 80, size: 7
    });
  }
  // MARATHON BANNER — when zenStreak >= 10, push big gold banner so the elite
  // no-death streak feels weighty alongside the existing MARATHON x5/10/20 award.
  if ((game.zenStreak || 0) >= 10) {
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 - 56,
      text: 'MARATHON x' + game.zenStreak,
      color: '#fc4', life: 90, maxLife: 90, size: 9
    });
  }
  // NEXT MILESTONE NUDGE — when zenStreak is exactly 4/9/19 (one stage shy
  // of 5/10/20 marathon awards), push a 'KEEP IT UP!' nudge.
  if ([4, 9, 19].indexOf(game.zenStreak || 0) >= 0) {
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 + 60,
      text: 'KEEP IT UP — NEXT IS MILESTONE',
      color: '#fc4', life: 80, maxLife: 80, size: 5
    });
  }
  // NEW PB STAGE BANNER — when entering a stage exceeding lifetime best across
  // both normal and challenge modes (one-shot per run via _stagePbFired flag).
  if (!game._stagePbFired) {
    try {
      const _csN = loadCumStats(false);
      const _csC = loadCumStats(true);
      const _bestEver = Math.max(_csN.bestStage || 0, _csC.bestStage || 0);
      if (_bestEver > 0 && game.stage > _bestEver) {
        game._stagePbFired = true;
        game.floatTexts.push({
          x: BASE_W/2, y: BASE_H/2 - 64, text: 'NEW DEEPEST STAGE',
          color: '#fc4', life: 120, maxLife: 120, size: 8
        });
        // Name the depth — a record-setting peak deserves its number, and the
        // margin over the old best ("+N") frames the achievement.
        game.floatTexts.push({
          x: BASE_W/2, y: BASE_H/2 - 54,
          text: 'STAGE ' + game.stage + '  (+' + (game.stage - _bestEver) + ')',
          color: '#fff', life: 120, maxLife: 120, size: 5
        });
        if (typeof playSound === 'function') playSound('milestone');
        if (typeof spawnConfetti === 'function') spawnConfetti(8);
      }
    } catch (e) {}
  }
  // BIOME EXPLORATION — track biome IDs the player has visited across all runs
  // for PROFILE + STAGE_INTRO "N/8" stat. Single-write per stage entry.
  try {
    const _bid = typeof biomeForStage === 'function' ? biomeForStage(game.stage) : null;
    if (_bid) {
      // PER-RUN BIOMES SET — track distinct biomes this run for intro peek
      if (!game.runBiomesSeen) game.runBiomesSeen = new Set();
      const _firstBiomeThisRun = !game.runBiomesSeen.has(_bid);
      game.runBiomesSeen.add(_bid);
      // FIRST BIOME BANNER — when this biome enters for the first time this run,
      // surface a big cinematic name banner. Skipped on stages 1-7 (no biome)
      // and on the very first biome seen (covered by stage intro itself).
      if (_firstBiomeThisRun
          && BIOME_NAMES && BIOME_NAMES[_bid]
          && game.runBiomesSeen.size >= 2) {
        const _bn = BIOME_NAMES[_bid].name || _bid.toUpperCase();
        const _bc = BIOME_NAMES[_bid].col || '#0cf';
        game.floatTexts.push({
          x: BASE_W/2, y: BASE_H/2 - 50, text: 'BIOME SHIFT',
          color: '#fff', life: 90, maxLife: 90, size: 6
        });
        game.floatTexts.push({
          x: BASE_W/2, y: BASE_H/2 - 38, text: _bn,
          color: _bc, life: 100, maxLife: 100, size: 12
        });
        game.flashTimer = Math.max(game.flashTimer || 0, 6);
        game.flashColor = _bc;
      }
      // BIOME VISIT COUNT — per-biome counter (write once per stage entry)
      try {
        const _bvRaw = localStorage.getItem('galagaBiomeVisits') || '{}';
        const _bv = JSON.parse(_bvRaw);
        _bv[_bid] = (_bv[_bid] || 0) + 1;
        localStorage.setItem('galagaBiomeVisits', JSON.stringify(_bv));
      } catch (e2) {}
      const sRaw = localStorage.getItem('galagaBiomesSeen') || '[]';
      const arr = JSON.parse(sRaw);
      if (Array.isArray(arr) && arr.indexOf(_bid) < 0) {
        arr.push(_bid);
        localStorage.setItem('galagaBiomesSeen', JSON.stringify(arr));
        // FIRST BIOME DISCOVERY BANNER — celebrate first encounter with a biome
        // across all sessions. Score-neutral; pure progression marker.
        if (BIOME_NAMES && BIOME_NAMES[_bid]) {
          const _bN = BIOME_NAMES[_bid];
          game.floatTexts.push({
            x: BASE_W/2, y: BASE_H/2 - 70, text: 'NEW BIOME',
            color: '#fff', life: 110, maxLife: 110, size: 6
          });
          game.floatTexts.push({
            x: BASE_W/2, y: BASE_H/2 - 60, text: _bN.label,
            color: _bN.col, life: 110, maxLife: 110, size: 9
          });
          if (typeof playSound === 'function') playSound('milestone');
          if (typeof spawnConfetti === 'function') spawnConfetti(8);
          if (arr.length === 8) {
            // All 8 biomes seen — extra completion banner
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 - 46, text: 'ALL BIOMES SEEN',
              color: '#fc4', life: 120, maxLife: 120, size: 7
            });
            if (typeof spawnConfetti === 'function') spawnConfetti(20);
          }
        }
      }
    }
  } catch (e) {}
  // Per-stage stat reset
  game.stageFrames = 0;
  game.stageDied = false;
  game.stageShotsFired = 0;
  game.stageShotsHit = 0;
  game.stagePowerUpsPicked = 0;
  game.stageScoreStart = game.score || 0;
  game.stageKills = 0;
  game.stagePerfectWaves = 0;
  game.stageInterceptCount = 0;
  game._openingSalvoFired = false;
  game._ultraParryFired = false;
  game.stageHitTaken = 0;
  game.stageGhostKills = 0;
  game.stageCloseCount = 0;
  game.lastStandAnnounced = false;
  // PB PACING HALF MARK — one-shot per stage flag. Fires a subtle cyan
  // "HALF MARK" floattext when stageFrames crosses 50% of stage PB, giving
  // speedrunners a mid-stage pacing checkpoint distinct from the 90%+ pbAlarm
  // (which is urgent). Reset here so each stage gets a fresh marker.
  game._pbHalfMarkFired = false;
  // FLAWLESS BOSS — reset per-stage one-shot so each boss stage can earn it fresh.
  game._flawlessBossFired = false;
  // SIGNAL INTERCEPT — reset stage-scoped trigger flags so each stage broadcasts fresh
  game._stageComboInterceptFired = false;
  game.stageMinibeeKills = 0;
  game.stageEliteKills = 0;
  game.stagePickups = 0;
  // GUARDIAN VARIANT — combo 50+ trigger fires once per RUN (not stage). Initialized
  // in resetGame; stage start does not reset so the player only gets one ATTACK drone per run.

  const isBoss = game.stage % BOSS_STAGE_INTERVAL === 0;
  const isChallenge = !isBoss && game.stage % 4 === 0;
  // Roll a mutation BEFORE branching so isBoss/isChallenge gates inside pickStageMutation
  // already filter it out. Stored on game so update() / draw() can read it any time.
  game.stageMutation = pickStageMutation();
  // MUTATION ENTRY BANNER — short floattext announcing the active stage rule
  // shift (rapidFire / fastDives / slowBullets / denseFire). Mirrors WEATHER
  // banner pattern so stage-entry dynamic systems all surface narrative+visual.
  if (game.stageMutation && game.floatTexts) {
    game.floatTexts.push({
      x: BASE_W/2, y: 70,
      text: '★ ' + game.stageMutation.label + ' ★',
      color: game.stageMutation.color, life: 90, maxLife: 90, size: 7
    });
  }
  // Roll an ambient event for atmosphere (no gameplay effect). Resets the previous one.
  startAmbientEvent(pickAmbientEvent());
  // Roll BIOME WEATHER — 50% chance per applicable biome stage. Returns null on
  // boss/challenge stages and outside biome range. Cleared on every startStage.
  game.stageWeather = pickStageWeather();
  // WEATHER ENTRY BANNER — short floattext naming the active weather effect.
  // Without this the player only learned about weather via the persistent W:
  // chip in HUD. Now stage entry surfaces the effect directly. WEATHER_TABLE
  // already defines col per weather, so visual signature is consistent.
  if (game.stageWeather && typeof WEATHER_TABLE !== 'undefined'
      && WEATHER_TABLE[game.stageWeather.id] && game.floatTexts) {
    const _w = WEATHER_TABLE[game.stageWeather.id];
    game.floatTexts.push({
      x: BASE_W/2, y: 60, text: '— ' + _w.label + ' —',
      color: _w.col, life: 90, maxLife: 90, size: 7
    });
  }
  // SUPPLY CRATE — 30% chance per normal stage 5+. Spawns mid-stage when ~50% kills.
  game.supplyCrate = null;
  game.supplyCrateSpawned = false;
  game.supplyCrateRolled = pickSupplyCrate();
  // ACT TRANSITION — queue "new sector" intercept message when this stage opens an act
  if (typeof actStartFor === 'function' && actStartFor(game.stage)
      && typeof pushIntercept === 'function') {
    pushIntercept('actBegin');
  }
  // BIOME SHIFT — detect biome change and broadcast intercept. Compares vs prevBiome
  // tracked at run scope. Null on stages 1-7 (no biome) means first biome triggers.
  // Special dramatic biomes (blackhole/nebula/corona) also push a tailored entry
  // intercept on top of the generic biomeShift broadcast.
  if (typeof biomeForStage === 'function' && typeof pushIntercept === 'function') {
    const _curBiome = biomeForStage(game.stage);
    if (_curBiome && _curBiome !== game.prevBiome) {
      pushIntercept('biomeShift');
      // BIOME SHIFT FLASH — short screen flash in the new biome's signature
      // color, paired with the narrative INTERCEPT. Reinforces the tonal change
      // before STAGE_INTRO's biome-tinted backdrop settles in.
      if (typeof BIOME_NAMES !== 'undefined' && BIOME_NAMES[_curBiome]) {
        game.flashTimer = Math.max(game.flashTimer || 0, 8);
        game.flashColor = BIOME_NAMES[_curBiome].col;
      }
      // Dramatic biome entries get a tailored narrative beat
      if (_curBiome === 'blackhole') pushIntercept('voidEntry');
      else if (_curBiome === 'nebula') pushIntercept('nebulaEntry');
      else if (_curBiome === 'corona') pushIntercept('coronaEntry');
      // BIOME COMPLETION MILESTONE — track unique biomes seen this run; fire once
      // when all 12 are visited. Deep-run exploration achievement narrative.
      if (game._biomesSeen) {
        const _wasNewB = !game._biomesSeen.has(_curBiome);
        game._biomesSeen.add(_curBiome);
        if (_wasNewB && game._biomesSeen.size === 12) {
          pushIntercept('allBiomeSeen');
        }
      }
    }
    game.prevBiome = _curBiome;
  }
  // Roll a secondary objective (40% chance, stage 5+). Snapshots counters internally.
  game.stageObjective = pickStageObjective(game.stage);
  // Snapshot score at stage start so stage clear can compute the score *gained*.
  game.stageStartScore = game.score || 0;
  // PILOT QUOTE — 30% chance on normal stages (no boss, no challenge) to display
  // a pilot maxim during STAGE_INTRO. Pure narrative texture, no gameplay effect.
  if (!isBoss && !isChallenge && Math.random() < 0.30 && typeof PILOT_QUOTES !== 'undefined') {
    game.stageQuote = PILOT_QUOTES[Math.floor(Math.random() * PILOT_QUOTES.length)];
  } else {
    game.stageQuote = null;
  }

  if (isBoss) {
    setupBossStage();
    game.state = STATE.BOSS_STAGE;
    // SUPER boss (stage 30+) gets its own slower, heavier track
    startBGM(bgmForGameState(STATE.BOSS_STAGE));
    // Stage-type fanfare layered on top of BGM start — gives the player auditory
    // confirmation of the stage type before they even see the formation.
    playSound(game.stage >= 30 ? 'fanfareSuperBoss' : 'fanfareBoss');
    // SIGNAL INTERCEPT — super boss entry (stage 30+) is apex narrative beat
    if (game.stage >= 30 && typeof pushIntercept === 'function') {
      pushIntercept('superBoss');
    }
  } else if (isChallenge) {
    setupChallengingStage();
    game.state = STATE.CHALLENGING;
    startBGM(bgmForGameState(STATE.CHALLENGING));
    playSound('fanfareChallenge');
  } else {
    createFormation();
    setupEntryAnimation();
    game.state = STATE.PLAYING;
    startBGM(bgmForGameState(STATE.PLAYING));
  }
  game.diveInterval = Math.max(80, 200 - game.stage * 10);
}

// --- Input ---
// Normalize a KeyboardEvent into a layout-independent character. Physical letter
// keys ('KeyC' code) always become lowercase 'c' regardless of CapsLock, Shift,
// or non-Latin keyboard layouts (e.g. Korean Hangul mode where pressing the
// physical C key produces 'ㅊ' as e.key but 'KeyC' as e.code). Other keys keep
// their e.key (Enter / Shift / ArrowLeft / etc.).
function normalizeKey(e) {
  if (e.code && e.code.startsWith('Key')) return e.code.slice(3).toLowerCase();
  if (e.code && e.code.startsWith('Digit')) return e.code.slice(5);
  if (e.key && e.key.length === 1) return e.key.toLowerCase();
  return e.key;
}

function initInput() {
  keys = {};
  document.addEventListener('keydown', e => {
    const k = normalizeKey(e);
    keys[e.key] = true;
    // Also expose the normalized letter so movement / fire still work on non-Latin layouts.
    if (k && k.length === 1 && k !== e.key) keys[k] = true;
    if (k === ' ' || k === 'ArrowUp' || k === 'ArrowDown') e.preventDefault();
    ensureAudio();
    // KONAMI tracker — push every key, keep buffer at last 10. Check for match.
    konamiBuffer.push(k);
    if (konamiBuffer.length > 10) konamiBuffer.shift();
    if (checkKonamiCode()) {
      konamiBuffer = []; // consume the buffer to prevent re-trigger
      triggerKonamiUnlock();
    }
    // Skip intro cinematic on any key
    if (introCinematic) { endCinematic(); return; }
    // CALLSIGN INPUT MODE — captures keys early so arrow keys / Enter / Esc don't fall
    // through to ship-cycle / game-start handlers. Active only on TITLE while editing.
    if (callsignInput.active && game.state === STATE.TITLE) {
      e.preventDefault();
      if (k === 'Escape') {
        callsignInput.active = false;
        callsignInput.letters = playerCallsign.split('');
        return;
      }
      if (k === 'Enter' || k === ' ') {
        playerCallsign = callsignInput.letters.join('');
        saveCallsign();
        callsignInput.active = false;
        playSound('tick');
        return;
      }
      if (k === 'ArrowUp')   { shiftCallsignChar(callsignInput.pos, +1); playSound('tick'); return; }
      if (k === 'ArrowDown') { shiftCallsignChar(callsignInput.pos, -1); playSound('tick'); return; }
      if (k === 'ArrowLeft')  { callsignInput.pos = (callsignInput.pos + 2) % 3; playSound('tick'); return; }
      if (k === 'ArrowRight') { callsignInput.pos = (callsignInput.pos + 1) % 3; playSound('tick'); return; }
      // Direct character entry: A-Z / 0-9 jumps current slot to that letter and advances
      const ch = (k || '').toUpperCase();
      if (ch.length === 1 && CALLSIGN_CHARS.indexOf(ch) >= 0) {
        callsignInput.letters[callsignInput.pos] = ch;
        callsignInput.pos = (callsignInput.pos + 1) % 3;
        playSound('tick');
        return;
      }
      return; // swallow other input while editing
    }
    // Any input during the auto-restart window cancels the countdown (R/Space still trigger their own action below)
    if (game.state === STATE.GAME_OVER && (game.autoRestartTimer || 0) > 0) {
      game.autoRestartTimer = -1;
    }
    // Any input exits demo mode and resets idle. Setting/help keys keep flowing through so
    // the same press also toggles help/stats/etc — only movement/start keys early-return.
    if (game.isDemo) {
      resetGame();
      game.state = STATE.TITLE;
      stopBGM();
      const consume = (k === ' ' || k === 'Enter' || k === 'ArrowLeft' || k === 'ArrowRight');
      if (consume) return;
    }
    if (game) game.idleTime = 0;
    if (game.state === STATE.TITLE && (k === ' ' || k === 'Enter')) {
      resetGame();
      game.state = STATE.STAGE_INTRO;
      game.stageTimer = 120;
      playSound('stageStart');
      triggerTransitionFade();
    }
    // Toggle challenge mode on title (1-life hardcore) — exclusive with daily mode
    if (game.state === STATE.TITLE && k === 'c') {
      challengeModeRequested = !challengeModeRequested;
      if (challengeModeRequested) {
        dailyModeRequested = false;
        try { localStorage.setItem('galagaDaily', '0'); } catch (err) {}
      }
      try { localStorage.setItem('galagaChallenge', challengeModeRequested ? '1' : '0'); } catch (err) {}
      playSound('powerUp');
    }
    // Toggle daily mode (date-locked ship + lives 2 + 1.25× score) — exclusive with challenge
    if (game.state === STATE.TITLE && k === 'd') {
      dailyModeRequested = !dailyModeRequested;
      if (dailyModeRequested) {
        challengeModeRequested = false;
        try { localStorage.setItem('galagaChallenge', '0'); } catch (err) {}
      }
      try { localStorage.setItem('galagaDaily', dailyModeRequested ? '1' : '0'); } catch (err) {}
      playSound('powerUp');
    }
    // Cycle ship loadout on title — V
    if (game.state === STATE.TITLE && k === 'v') {
      const idx = SHIP_ORDER.indexOf(selectedShip);
      selectedShip = SHIP_ORDER[(idx + 1) % SHIP_ORDER.length];
      try { localStorage.setItem('galagaShip', selectedShip); } catch (err) {}
      shipChangeFrame = 30;
      playSound('powerUp');
    }
    // Enter CALLSIGN input mode on title — U (for "User"/Username). Loads current
    // callsign into the editor; ENTER commits, ESC cancels.
    if (game.state === STATE.TITLE && k === 'u' && !callsignInput.active) {
      callsignInput.active = true;
      callsignInput.letters = playerCallsign.split('');
      callsignInput.pos = 0;
      playSound('tick');
    }
    // CALLSIGN COLOR cycle — 'O' on TITLE cycles through 6 colors
    if (game.state === STATE.TITLE && k === 'o' && !callsignInput.active) {
      cycleCallsignColor();
      playSound('tick');
      // Visual feedback — 'COLOR N' label in the new color so the cycle moment
      // reads beyond just the callsign display tint change.
      if (game.floatTexts) {
        game.floatTexts.push({
          x: BASE_W/2, y: 50, text: 'COLOR ' + (callsignColorIdx + 1),
          color: callsignColor(), life: 40, maxLife: 40, size: 6
        });
      }
    }
    // Cycle starting stage on title — R (only stages up to highest checkpoint).
    // No-op if no milestones unlocked yet so the key doesn't make a tick for no reason.
    if (game.state === STATE.TITLE && k === 'r') {
      const opts = availableStartStages();
      if (opts.length > 1) {
        const cur = opts.indexOf(startStageRequested);
        startStageRequested = opts[(cur + 1) % opts.length] || 1;
        playSound('tick');
      }
    }
    // BONUS GAME SKILL STOP — just consume the key here; the actual reel lock is
    // edge-detected in updateBonusGame so touch + gamepad fire work identically.
    if (game.state === STATE.BONUS_GAME && (k === ' ' || k === 'Enter')
        && game.bonusGame && !game.bonusGame.resultShown) {
      e.preventDefault();
      return;
    }
    if (game.state === STATE.GAME_OVER && game.gameOverTimer <= 0 && (k === ' ' || k === 'Enter')) {
      resetGame();
      game.state = STATE.TITLE;
      triggerTransitionFade();
    }
    // Quick restart from game over — R re-runs the same mode immediately, skipping title
    if (game.state === STATE.GAME_OVER && game.gameOverTimer <= 0 && k === 'r') {
      resetGame();
      game.state = STATE.STAGE_INTRO;
      game.stageTimer = 120;
      playSound('stageStart');
      triggerTransitionFade();
    }
    // Dash — Shift (any side). Costs 60-frame cooldown, gives 12 frames of invincible movement.
    if (e.key === 'Shift') {
      if ((game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)
          && game.playerAlive && game.dashCooldown === 0 && game.dashTimer === 0) {
        const dir = (keys['ArrowLeft'] || keys['a'] || keys['A']) ? -1
                  : (keys['ArrowRight'] || keys['d'] || keys['D']) ? 1
                  : (game.dashDir || 1);
        game.dashDir = dir;
        game.dashTimer = 12;
        game.dashCooldown = 60;
        game.invincibleTimer = Math.max(game.invincibleTimer, 14);
        game.dashCount = (game.dashCount || 0) + 1;
        if (game.dashCount === 30) unlockAchievement('dashMaster');
        // DASH START BURST — small cyan shockwave + 8 radial sparks at the
        // dash origin so the launch reads as a deliberate kinetic event.
        if (game.shockwaves) {
          game.shockwaves.push({
            x: game.playerX, y: game.playerY,
            life: 0, maxLife: 14, maxR: 16, color: '#0ff'
          });
        }
        if (game.itemBursts) {
          for (let k = 0; k < 8; k++) {
            const _a = (k / 8) * Math.PI * 2;
            game.itemBursts.push({
              x: game.playerX + Math.cos(_a) * 5,
              y: game.playerY + Math.sin(_a) * 5,
              life: -k, color: k & 1 ? '#0ff' : '#fff'
            });
          }
        }
        playSound('powerUp');
        rumble(80, 0.5, 0.2);
      }
    }
    if (k === 'p') {
      if (game.state === STATE.PAUSED) {
        game.state = game.pausedState;
        startBGM(bgmForGameState(game.pausedState));
      } else if (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE) {
        game.pausedState = game.state;
        game.state = STATE.PAUSED;
        stopBGM();
      }
    }
    // Fullscreen toggle (anywhere)
    if (k === 'f') {
      if (document.fullscreenElement) {
        document.exitFullscreen && document.exitFullscreen();
      } else {
        const root = document.documentElement;
        const req = root.requestFullscreen || root.webkitRequestFullscreen;
        if (req) req.call(root);
      }
    }
    // Audio controls (anywhere)
    if (k === 'm') {
      audioMuted = !audioMuted;
      ensureAudio();
      applyVolume();
    }
    if (k === 'b') {
      bgmEnabled = !bgmEnabled;
      try { localStorage.setItem('galagaBGMOff', bgmEnabled ? '0' : '1'); } catch (err) {}
      ensureAudio();
      applyVolume();
      volIndicatorTimer = 60;
    }
    if (k === 'n') {
      sfxEnabled = !sfxEnabled;
      try { localStorage.setItem('galagaSFXOff', sfxEnabled ? '0' : '1'); } catch (err) {}
      ensureAudio();
      applyVolume();
      volIndicatorTimer = 60;
    }
    // Cycle shake intensity (accessibility) — K
    if (k === 'k') {
      shakeMode = shakeMode === 'full' ? 'low' : shakeMode === 'low' ? 'off' : 'full';
      try { localStorage.setItem('galagaShake', shakeMode); } catch (err) {}
      // Brief on-screen toast through floatTexts
      if (game) game.floatTexts.push({
        x: BASE_W/2, y: 50, text: 'SHAKE: ' + shakeMode.toUpperCase(),
        color: COL.cyan, life: 50, maxLife: 50, size: 8
      });
    }
    // Cycle difficulty — G
    if (k === 'g') {
      difficultyMode = difficultyMode === 'easy' ? 'normal' : difficultyMode === 'normal' ? 'hard' : 'easy';
      try { localStorage.setItem('galagaDifficulty', difficultyMode); } catch (err) {}
      if (game) {
        const _dCol = difficultyMode === 'hard' ? COL.red : difficultyMode === 'easy' ? COL.green : COL.cyan;
        game.floatTexts.push({
          x: BASE_W/2, y: 50, text: 'DIFFICULTY: ' + difficultyMode.toUpperCase(),
          color: _dCol, life: 60, maxLife: 60, size: 8
        });
        // Descriptor line — communicates the actual trade-offs of this difficulty.
        game.floatTexts.push({
          x: BASE_W/2, y: 60, text: difficultyDescriptor(difficultyMode),
          color: '#aaa', life: 60, maxLife: 60, size: 4
        });
      }
    }
    // Night mode auto-dim toggle — J
    if (k === 'j') {
      const cur = localStorage.getItem('galagaNightOff') === '1';
      try { localStorage.setItem('galagaNightOff', cur ? '0' : '1'); } catch (err) {}
      if (game) game.floatTexts.push({
        x: BASE_W/2, y: 50, text: 'NIGHT DIM: ' + (cur ? 'ON' : 'OFF'),
        color: COL.cyan, life: 50, maxLife: 50, size: 8
      });
    }
    // Cycle rumble intensity — L
    if (k === 'l') {
      rumbleMode = rumbleMode === 'full' ? 'low' : rumbleMode === 'low' ? 'off' : 'full';
      try { localStorage.setItem('galagaRumble', rumbleMode); } catch (err) {}
      if (game) game.floatTexts.push({
        x: BASE_W/2, y: 50, text: 'RUMBLE: ' + rumbleMode.toUpperCase(),
        color: COL.cyan, life: 50, maxLife: 50, size: 8
      });
    }
    // Debug overlay — F3
    if (e.key === 'F3') {
      e.preventDefault();
      debugOverlay = !debugOverlay;
    }
    // Cheat: toggle invincibility (GOD mode) — Backtick `. Hidden hotkey, not in HELP.
    if (e.key === '`' || e.code === 'Backquote') {
      if (game) {
        game.cheatInvincible = !game.cheatInvincible;
        if (game.cheatInvincible) game._cheatUsedAtAnyTime = true;
        game.floatTexts.push({
          x: BASE_W/2, y: 50, text: 'GOD MODE: ' + (game.cheatInvincible ? 'ON' : 'OFF'),
          color: game.cheatInvincible ? '#fc4' : COL.gray, life: 60, maxLife: 60, size: 9
        });
        playSound('powerUp');
      }
    }
    // Stage navigation cheats — `,` previous, `.` next, `0` jump to stage 1.
    // Hidden hotkeys (not shown in HELP). Only active in playable states. Preserves
    // score / lives / lvl / combo so the rest of the run state stays continuous.
    if (game && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING ||
                 game.state === STATE.BOSS_STAGE || game.state === STATE.STAGE_INTRO)) {
      if (k === '.' || k === ',') {
        const dir = k === '.' ? 1 : -1;
        const newStage = Math.max(1, game.stage + dir);
        if (newStage !== game.stage) {
          game.stage = newStage;
          startStage();
          game.floatTexts.push({
            x: BASE_W/2, y: 50, text: 'STAGE → ' + game.stage,
            color: '#fc4', life: 50, maxLife: 50, size: 10
          });
          playSound('tick');
        }
      }
      // PERK SELECT keys — 1/2/3 picks the corresponding offered perk. Captured here
      // BEFORE the stage-jump 1-9 handler so the perk window owns those keys while open.
      // Note: 4-9 still fall through to stage jump even during perk select (no conflict).
      if ((game.perkSelectFrames || 0) > 0 && game.perkOffered && (k === '1' || k === '2' || k === '3')) {
        const idx = (k === '1' ? 0 : k === '2' ? 1 : 2);
        const perkId = game.perkOffered[idx];
        if (perkId && PERKS[perkId]) {
          game.activePerk = perkId;
          game.perkOffered = null;
          game.perkSelectFrames = 0;
          // PERK USAGE TRACKING — increment lifetime pick counter for this perk
          try {
            const raw = localStorage.getItem('galagaPerkPicks') || '{}';
            const tally = JSON.parse(raw);
            tally[perkId] = (tally[perkId] || 0) + 1;
            localStorage.setItem('galagaPerkPicks', JSON.stringify(tally));
          } catch (e) {}
          // PERK ACTIVATION CINEMATIC — name + desc + shockwave + confetti
          // burst centered on screen. Marks the moment of strategy commitment.
          const _perk = PERKS[perkId];
          game.floatTexts.push({
            x: BASE_W/2, y: BASE_H/2 - 26,
            text: 'PERK ACQUIRED',
            color: '#fff', life: 70, maxLife: 70, size: 6
          });
          game.floatTexts.push({
            x: BASE_W/2, y: BASE_H/2 - 14,
            text: _perk.name,
            color: _perk.col, life: 80, maxLife: 80, size: 12
          });
          if (_perk.desc) {
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 - 2,
              text: _perk.desc,
              color: '#aaa', life: 80, maxLife: 80, size: 5
            });
          }
          if (game.shockwaves) {
            game.shockwaves.push({
              x: BASE_W/2, y: BASE_H/2 - 14,
              life: 0, maxLife: 30, maxR: 50,
              color: _perk.col
            });
          }
          if (typeof spawnConfetti === 'function') spawnConfetti(10);
          game.flashTimer = Math.max(game.flashTimer || 0, 6);
          game.flashColor = _perk.col;
          playSound('milestone');
          rumble(220, 0.6, 0.4);
          return;
        }
      }
      // Number keys 1-9 — jump to a specific stage milestone bucket. Useful for testing
      // boss/biome/corruption/transmission tiers without having to play through.
      // 1→1 / 2→5 / 3→10 / 4→15 / 5→20 / 6→30 / 7→40 / 8→50 / 9→80
      const stageJumps = { '1': 1, '2': 5, '3': 10, '4': 15, '5': 20, '6': 30, '7': 40, '8': 50, '9': 80 };
      if (stageJumps[k] != null) {
        const target = stageJumps[k];
        if (target !== game.stage) {
          game.stage = target;
          game._stageJumpUsed = true;
          startStage();
          game.floatTexts.push({
            x: BASE_W/2, y: 50, text: 'JUMP → STAGE ' + target,
            color: '#fc4', life: 50, maxLife: 50, size: 10
          });
          playSound('tick');
        }
      }
    }
    // Color-blind mode — X (adds outlines + shape markers to enemy bullets)
    if (k === 'x') {
      colorBlindMode = !colorBlindMode;
      try { localStorage.setItem('galagaColorBlind', colorBlindMode ? '1' : '0'); } catch (err) {}
      if (game) game.floatTexts.push({
        x: BASE_W/2, y: 50, text: 'COLORBLIND: ' + (colorBlindMode ? 'ON' : 'OFF'),
        color: COL.cyan, life: 50, maxLife: 50, size: 8
      });
    }
    // Minimal HUD toggle — M (hides accuracy/kills/pity/etc. for cleaner play)
    if (k === 'm') {
      minimalHud = !minimalHud;
      try { localStorage.setItem('galagaMinimalHud', minimalHud ? '1' : '0'); } catch (err) {}
      if (game) game.floatTexts.push({
        x: BASE_W/2, y: 50, text: 'MINIMAL HUD: ' + (minimalHud ? 'ON' : 'OFF'),
        color: '#0cf', life: 50, maxLife: 50, size: 8
      });
    }
    if (e.key === '[') {
      audioVolume = Math.max(0, Math.round((audioVolume - 0.1) * 10) / 10);
      ensureAudio();
      applyVolume();
    }
    if (e.key === ']') {
      audioVolume = Math.min(1, Math.round((audioVolume + 0.1) * 10) / 10);
      audioMuted = false;
      ensureAudio();
      applyVolume();
    }
    // ESC closes any open overlay (help/stats); otherwise pauses/unpauses gameplay
    if (e.key === 'Escape') {
      if (game.helpOverlay) { game.helpOverlay = false; }
      else if (game.statsOverlay) { game.statsOverlay = false; }
      else if (game.state === STATE.PAUSED) {
        // resume — same as pressing P from paused
        game.state = game.pausedState;
        startBGM(bgmForGameState(game.pausedState));
      } else if (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE) {
        game.pausedState = game.state;
        game.state = STATE.PAUSED;
        stopBGM();
      }
    }
    // Toggle help overlay (TITLE or PAUSED)
    if (k === 'h') {
      if (game.state === STATE.PAUSED || game.state === STATE.TITLE) {
        game.helpOverlay = !game.helpOverlay;
        if (game.helpOverlay) game.statsOverlay = false;
      }
    }
    // Toggle stats overlay (TITLE or PAUSED) — I key
    if (k === 'i') {
      if (game.state === STATE.PAUSED || game.state === STATE.TITLE) {
        game.statsOverlay = !game.statsOverlay;
        if (game.statsOverlay) game.helpOverlay = false;
      }
    }
    // Cycle stats pages within stats overlay — Tab (wraps back to page 0 past the end).
    // Pages: 0..(achPages-1) achievement grids, then bestiary, then pilot profile.
    if (e.key === 'Tab' && game.statsOverlay) {
      e.preventDefault();
      const achPages = Math.max(1, Math.ceil(Object.keys(ACHIEVEMENTS).length / 30));
      const numPages = achPages + 2; // +1 bestiary, +1 profile
      game.statsAchPage = ((game.statsAchPage || 0) + 1) % numPages;
      playSound('tick');
    }
    // Quit to title from pause — commit the run as if it ended naturally so
    // top-5 lists, cumulative stats, and per-mode leaderboards all stay in sync
    // (previously only the legacy `galagaHigh` key was updated, which dropped
    // daily/challenge runs entirely and never reached the top-5 lists).
    if (game.state === STATE.PAUSED && k === 'q') {
      if (game.score > 0 && !game.isDemo) {
        const acc = game.stats.shotsFired === 0 ? 0
          : Math.round((game.stats.shotsHit / game.stats.shotsFired) * 100);
        submitTopScore(game.score, game.stats.maxStage, acc);
        commitGameToCumStats();
      }
      resetGame();
      game.state = STATE.TITLE;
      stopBGM();
    }
  });
  document.addEventListener('keyup', e => {
    keys[e.key] = false;
    const k = normalizeKey(e);
    if (k && k.length === 1 && k !== e.key) keys[k] = false;
  });

  // Touch controls
  if ('ontouchstart' in window) {
    document.getElementById('touchControls').style.display = 'block';
    const btnF = document.getElementById('btnFire');
    const btnP = document.getElementById('btnPause');
    btnP.style.display = 'flex';
    const pad = document.getElementById('joyPad');
    const knob = document.getElementById('joyKnob');

    // Pause / resume — only meaningful in active gameplay; outside that we ignore the tap
    // so the button doesn't fire spurious state changes from the title screen.
    btnP.addEventListener('touchstart', e => {
      e.preventDefault();
      ensureAudio();
      btnP.classList.add('active');
      if (game.state === STATE.PAUSED) {
        game.state = game.pausedState;
        startBGM(bgmForGameState(game.pausedState));
      } else if (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE) {
        game.pausedState = game.state;
        game.state = STATE.PAUSED;
        stopBGM();
      }
    });
    btnP.addEventListener('touchend',    e => { e.preventDefault(); btnP.classList.remove('active'); });
    btnP.addEventListener('touchcancel', e => { btnP.classList.remove('active'); });

    function startGameFromTitle() {
      ensureAudio();
      if (introCinematic) { endCinematic(); return; }
      // Touch input must also exit demo mode (keyboard/gamepad already do).
      // Without this, a player browsing the title screen on a phone gets stuck
      // watching the demo with no way to take control.
      if (game.isDemo) { resetGame(); game.state = STATE.TITLE; stopBGM(); return; }
      if(game.state===STATE.TITLE){resetGame();game.state=STATE.STAGE_INTRO;game.stageTimer=120;playSound('stageStart');}
      if(game.state===STATE.GAME_OVER&&game.gameOverTimer<=0){resetGame();game.state=STATE.TITLE;}
    }

    // Fire button
    btnF.addEventListener('touchstart', e => {
      e.preventDefault();
      keys[' '] = true;
      btnF.classList.add('active');
      startGameFromTitle();
    });
    btnF.addEventListener('touchend', e => { e.preventDefault(); keys[' '] = false; btnF.classList.remove('active'); });
    btnF.addEventListener('touchcancel', e => { keys[' '] = false; btnF.classList.remove('active'); });

    // Joystick pad — analog horizontal control with deadzone
    let joyId = null;
    const DEADZONE = 0.18;        // fraction of pad radius
    const KNOB_RANGE = 28;        // px the knob can travel from center
    function joyUpdate(touch) {
      const r = pad.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const dx = touch.clientX - cx;
      const dy = touch.clientY - cy;
      const radius = r.width / 2;
      // Clamp displacement to pad radius
      const dist = Math.sqrt(dx * dx + dy * dy);
      const clamped = Math.min(dist, radius);
      const ang = Math.atan2(dy, dx);
      const kx = Math.cos(ang) * Math.min(clamped, KNOB_RANGE);
      const ky = Math.sin(ang) * Math.min(clamped, KNOB_RANGE);
      knob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
      // Map x-axis to ArrowLeft / ArrowRight, with deadzone on horizontal component
      const nx = dx / radius;
      if (nx < -DEADZONE) {
        keys['ArrowLeft'] = true;
        keys['ArrowRight'] = false;
      } else if (nx > DEADZONE) {
        keys['ArrowRight'] = true;
        keys['ArrowLeft'] = false;
      } else {
        keys['ArrowLeft'] = false;
        keys['ArrowRight'] = false;
      }
    }
    function joyReset() {
      knob.style.transform = 'translate(-50%, -50%)';
      keys['ArrowLeft'] = false;
      keys['ArrowRight'] = false;
      pad.classList.remove('active');
      joyId = null;
    }
    pad.addEventListener('touchstart', e => {
      e.preventDefault();
      const t = e.changedTouches[0];
      joyId = t.identifier;
      pad.classList.add('active');
      startGameFromTitle();
      joyUpdate(t);
    });
    pad.addEventListener('touchmove', e => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (t.identifier === joyId) { joyUpdate(t); break; }
      }
    });
    pad.addEventListener('touchend', e => {
      e.preventDefault();
      for (const t of e.changedTouches) if (t.identifier === joyId) { joyReset(); break; }
    });
    pad.addEventListener('touchcancel', e => { joyReset(); });
  }
}

// --- Resize ---
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  SCALE = Math.min(w / BASE_W, h / BASE_H);
  canvas.width = Math.floor(BASE_W * SCALE);
  canvas.height = Math.floor(BASE_H * SCALE);
  canvas.style.marginTop = Math.floor((h - canvas.height) / 2) + 'px';
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);

// Auto-pause when tab loses visibility; resume audio context (suspended by some browsers) on return
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    // Auto-pause active gameplay so the player doesn't lose lives while away
    if (game && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
      game.pausedState = game.state;
      game.state = STATE.PAUSED;
      stopBGM();
    }
  } else {
    // Mobile/Chrome may suspend the audio context in the background — resume on return
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
  }
});

// --- Score helpers ---
function getEnemyPoints(type, inFormation) {
  switch(type) {
    case 'bee': return inFormation ? 50 : 100;
    case 'butterfly': return inFormation ? 80 : 160;
    case 'boss': return inFormation ? 150 : 400;
    case 'kamikaze': return 200;
    case 'warper': return inFormation ? 200 : 350;
    case 'splitter': return inFormation ? 100 : 200;
    case 'minibee': return 30;
    case 'shielded': return inFormation ? 120 : 240;
    case 'ufo': return 1000;
    case 'goldenBee': return 3000;
    case 'mirror': return 800;
    case 'hoverer': return 600;
    default: return 50;
  }
}

const SCORE_MILESTONES = [10000, 50000, 100000, 500000];
const SCORE_CAP = 999999999;
function addScore(pts) {
  // Daily mode applies a 1.25× score multiplier on every gain
  if (game && game.dailyMode) pts = Math.round(pts * 1.25);
  const old = game.score;
  game.score = Math.min(SCORE_CAP, game.score + pts);
  // LARGE SCORE GAIN BURST — when pts >= 1000, push small gold sparks at
  // player position for impact feedback. Cap to 6 sparks regardless of size.
  if (pts >= 1000 && game.playerAlive && game.itemBursts) {
    const _spN = Math.min(6, Math.floor(pts / 1000) + 2);
    for (let _k = 0; _k < _spN; _k++) {
      const _a = (_k / _spN) * Math.PI * 2;
      game.itemBursts.push({
        x: game.playerX + Math.cos(_a) * 8,
        y: game.playerY + Math.sin(_a) * 8,
        life: -_k, color: '#fc4'
      });
    }
  }
  // SCORE MILESTONE FANFARE — tiered cinematic per milestone. Iterate REVERSE so big
  // jumps (e.g. boss bounty pushing 90K → 600K) celebrate the HIGHEST threshold crossed.
  // Each tier adds: bigger banner, more confetti, optional flash / shake / cinematic
  // bars / intercept / shockwave. 1M+ triggers screen-wide ceremony.
  {
    const _scTiers = [
      { th: 10000,    sz: 9,  conf: 8,  flashCol: null,    shake: 0,  bars: 0,   intercept: false },
      { th: 50000,    sz: 11, conf: 14, flashCol: '#0cf',  shake: 4,  bars: 0,   intercept: false },
      { th: 100000,   sz: 13, conf: 20, flashCol: '#0ff',  shake: 6,  bars: 30,  intercept: true  },
      { th: 500000,   sz: 15, conf: 30, flashCol: '#fc4',  shake: 10, bars: 60,  intercept: true  },
      { th: 1000000,  sz: 18, conf: 46, flashCol: '#f6f',  shake: 14, bars: 90,  intercept: true  },
      { th: 10000000, sz: 20, conf: 70, flashCol: '#fff',  shake: 20, bars: 120, intercept: true  }
    ];
    for (let _i = _scTiers.length - 1; _i >= 0; _i--) {
      const _t = _scTiers[_i];
      if (old < _t.th && game.score >= _t.th) {
        game.floatTexts.push({
          x: BASE_W/2, y: BASE_H/2 - 40,
          text: fmtScore(_t.th) + ' POINTS!',
          color: '#fc4', life: 100, maxLife: 100, size: _t.sz
        });
        if (typeof spawnConfetti === 'function') spawnConfetti(_t.conf);
        if (_t.flashCol) {
          game.flashTimer = Math.max(game.flashTimer || 0, 10);
          game.flashColor = _t.flashCol;
        }
        if (_t.shake > 0) game.shakeTimer = Math.max(game.shakeTimer || 0, _t.shake);
        if (_t.bars > 0) game.cinematicBars = Math.max(game.cinematicBars || 0, _t.bars);
        if (_t.intercept && typeof pushIntercept === 'function') {
          pushIntercept('scoreMilestone');
        }
        // Big-milestone shockwave at player position (100K+)
        if (_t.th >= 100000 && game.shockwaves && game.playerAlive) {
          game.shockwaves.push({
            x: game.playerX, y: game.playerY,
            life: 0, maxLife: 30, maxR: 40, color: _t.flashCol || '#fc4'
          });
        }
        if (typeof playSound === 'function') {
          playSound(_t.th >= 500000 ? 'extraLife' : 'milestone');
        }
        break;
      }
    }
  }
  // DAILY MISSION check — fire once per day on completion. Only relevant in daily
  // mode runs where mission targeting is enabled.
  // Cache isDailyMissionDoneToday() result once per run to avoid hot-loop
  // localStorage reads on every addScore call (which can fire 20+ times per
  // frame during laser/bomb kill chains).
  if (game && game.dailyMode && !game._dailyMissionFired
      && (game._dailyMissionAlreadyDoneCached === undefined
          ? (game._dailyMissionAlreadyDoneCached = isDailyMissionDoneToday())
          : game._dailyMissionAlreadyDoneCached) === false) {
    const mission = dailyMission();
    if (mission && mission.check(game)) {
      game._dailyMissionFired = true;
      markDailyMissionDone();
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 36, text: 'DAILY MISSION!',
        color: '#fc4', life: 120, maxLife: 120, size: 14
      });
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 20, text: mission.label,
        color: '#fff', life: 120, maxLife: 120, size: 8
      });
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 8, text: '+5,000',
        color: '#ff4', life: 120, maxLife: 120, size: 10
      });
      // Award the reward via direct score add (skip recursive multiplier path)
      game.score = Math.min(SCORE_CAP, game.score + 5000);
      spawnConfetti(20);
      game.flashTimer = Math.max(game.flashTimer || 0, 10);
      game.flashColor = '#fc4';
      // DAILY MISSION CINEMATIC — letterbox bars + brief hit-stop for proper
      // mission-complete weight. Mirrors boss-kill cinematic but shorter.
      game.cinematicBars = Math.max(game.cinematicBars || 0, 50);
      game.hitStopFrames = Math.max(game.hitStopFrames || 0, 6);
      playSound('extraLife');
      rumble(320, 0.9, 0.6);
    }
  }
  // BIG HIT FLASH — single-call gain ≥ 1500 triggers a centered "BIG HIT! +N"
  // banner plus a short gold edge flash. Differentiated from SCORE_MILESTONES
  // (which fire on *cumulative* thresholds). Only during active gameplay states.
  if (pts >= 1500 && game && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 - 36, text: 'BIG HIT! +' + fmtScore(pts),
      color: '#fc4', life: 70, maxLife: 70,
      size: pts >= 5000 ? 12 : 9,
      glow: pts >= 5000 ? 7 : 5
    });
    game.flashTimer = Math.max(game.flashTimer || 0, 5);
    game.flashColor = '#fc4';
    if (pts >= 5000) {
      rumble(220, 0.7, 0.4);
    }
  }
  if (old < 1000000 && game.score >= 1000000) unlockAchievement('millionaire');
  if (old < 5000000 && game.score >= 5000000) unlockAchievement('rich');
  if (old < 10000000 && game.score >= 10000000) unlockAchievement('zenith');
  // Score-cap milestone — fires exactly once when the player crosses into the MAX! display range.
  if (old < SCORE_CAP && game.score >= SCORE_CAP) unlockAchievement('zenithMax');
  // Score milestone toasts (10K / 50K / 100K / 500K)
  for (const ms of SCORE_MILESTONES) {
    if (old < ms && game.score >= ms) {
      const label = ms >= 100000 ? (ms / 1000) + 'K!' : (ms / 1000) + 'K';
      const col = ms >= 100000 ? '#f6f' : ms >= 50000 ? COL.yellow : COL.cyan;
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 40, text: label,
        color: col, life: 70, maxLife: 70, size: ms >= 100000 ? 14 : 11
      });
      playSound('milestone');
      break;
    }
  }
  if (game.score > game.highScore) game.highScore = game.score;
  // HIGH SCORE CHASE ALERTS — 75% / 90% approach alerts before the crossing event.
  // Each fires once per run via flags. Only meaningful when liveHighThreshold ≥ 1000
  // (avoid spamming fresh installs where the bar is trivially low).
  if (game.liveHighThreshold >= 1000 && !game.crossedHighOnce) {
    const t75 = Math.floor(game.liveHighThreshold * 0.75);
    const t90 = Math.floor(game.liveHighThreshold * 0.90);
    if (!game._hsApproach75 && old <= t75 && game.score > t75) {
      game._hsApproach75 = true;
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 30, text: '75% TO BEST',
        color: '#0ff', life: 80, maxLife: 80, size: 8
      });
      playSound('tick');
    }
    if (!game._hsApproach90 && old <= t90 && game.score > t90) {
      game._hsApproach90 = true;
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 30, text: 'CLOSE TO RECORD!',
        color: '#fc4', life: 100, maxLife: 100, size: 10
      });
      playSound('milestone');
      rumble(140, 0.5, 0.25);
    }
  }
  // Live NEW HIGH alert — fire once when crossing the saved top score for this mode
  if (!game.crossedHighOnce && game.liveHighThreshold > 0
      && old <= game.liveHighThreshold && game.score > game.liveHighThreshold) {
    game.crossedHighOnce = true;
    game.highScoreGlow = 240; // 4 seconds
    unlockAchievement('recordBreaker');
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 - 30, text: 'NEW HIGH SCORE!',
      color: '#ff4', life: 120, maxLife: 120, size: 14, glow: 10
    });
    playSound('extraLife');
    rumble(220, 0.7, 0.4);
    spawnConfetti(16);
  }
  // Extra life every 30000 — disabled in challenge mode (hardcore = 1 life)
  if (!game.challengeMode && Math.floor(old / 30000) < Math.floor(game.score / 30000)) {
    game.lives++;
    // Re-arm LAST LIFE ALERT — leaving 1-life state means next drop to 1 can re-fire
    if (game.lives >= 2) game._lastLifeAlertFired = false;
    game.lifeGainPulseTimer = 30;
    game.extraShipsRun = (game.extraShipsRun || 0) + 1;
    // SIGNAL INTERCEPT — first extra life of the run is a score-milestone beat.
    if (game.extraShipsRun === 1 && typeof pushIntercept === 'function') {
      pushIntercept('firstExtra');
    }
    playSound('extraLife');
    // EXTRA LIFE BANNER — celebrate threshold crossing with banner + confetti
    if (game && game.floatTexts) {
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 30, text: 'EXTRA LIFE!',
        color: '#0f8', life: 100, maxLife: 100, size: 13, glow: 8
      });
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 16, text: '+1 SHIP',
        color: '#cfc', life: 100, maxLife: 100, size: 7
      });
      if (typeof spawnConfetti === 'function') spawnConfetti(14);
      game.flashTimer = Math.max(game.flashTimer || 0, 8);
      game.flashColor = '#0f8';
      if (typeof rumble === 'function') rumble(220, 0.7, 0.4);
      // SIGNAL INTERCEPT — enemy comms react to fresh reinforcement
      if (typeof pushIntercept === 'function') pushIntercept('lifeGain');
    }
  }
}

// --- Update functions ---
function updateStars() {
  updateNebulae();
  for (const s of stars) {
    s.y += s.speed;
    s.twinklePhase += s.twinkleRate;
    if (s.y > BASE_H) { s.y = 0; s.x = Math.random() * BASE_W; }
  }
  // Update shooting stars
  if (game) {
    for (let i = game.shootingStars.length - 1; i >= 0; i--) {
      const ss = game.shootingStars[i];
      ss.x += ss.vx;
      ss.y += ss.vy;
      ss.life++;
      if (ss.life >= ss.maxLife || ss.x < -10 || ss.x > BASE_W + 10 || ss.y > BASE_H + 10) {
        game.shootingStars.splice(i, 1);
      }
    }
    // Spawn rate scales with stage — deeper stages get a livelier sky. Cap concurrent
    // stars by tier so the high-end doesn't drown the playfield.
    const stage = (game && game.stage) || 1;
    let spawnChance, maxConcurrent;
    if (stage >= 51)      { spawnChance = 0.015; maxConcurrent = 3; }
    else if (stage >= 31) { spawnChance = 0.010; maxConcurrent = 2; }
    else if (stage >= 11) { spawnChance = 0.0075; maxConcurrent = 1; }
    else                  { spawnChance = 0.005; maxConcurrent = 1; }
    if (game.shootingStars.length < maxConcurrent && Math.random() < spawnChance) {
      const fromLeft = Math.random() < 0.5;
      // SHOOTING STAR WISH — 5% chance the shooting star is a *golden* wish target.
      // Shootable for +100 score and a small celebration. Only during active gameplay.
      const isWish = (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)
                    && Math.random() < 0.05;
      game.shootingStars.push({
        x: fromLeft ? -5 : BASE_W + 5,
        y: 10 + Math.random() * 80,
        vx: (fromLeft ? 1 : -1) * (2 + Math.random() * 1.5),
        vy: 1.2 + Math.random() * 0.8,
        life: 0,
        maxLife: 60,
        wish: isWish
      });
    }
  }
}

function updatePlayer() {
  if (!game.playerAlive) return;
  const ship = game.ship || shipAttrs();
  // BIOME WEATHER — blizzard mildly slows thrusters (×0.92) for an icy-drag feel.
  // Dash unaffected so the player can still emergency-evade at full speed.
  const weatherSlow = (game.stageWeather && game.stageWeather.id === 'blizzard') ? 0.92 : 1.0;
  const moveSpeed = PLAYER_SPEED * ship.speedMul * weatherSlow;
  // Dash: 12 frames invincible side-step at 2.6× speed in last input direction
  if (game.dashTimer > 0) {
    game.dashTimer--;
    game.invincibleTimer = Math.max(game.invincibleTimer, 1);
    game.playerX += game.dashDir * moveSpeed * 2.6;
    // Engine glow trail
    if (game.dashTimer % 2 === 0) {
