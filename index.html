                life: 0, maxLife: 28 + Math.floor(Math.random() * 14)
              });
            }
            // Extra confetti for the celebration
            spawnConfetti(10);
          }
          // Tiny "+1" near kill point — only while in an active combo, so it reinforces the streak
          if (game.combo >= 3) {
            const offX = (Math.random() - 0.5) * 6;
            game.floatTexts.push({
              x: e.x + offX, y: e.y - 8, text: '+1',
              color: '#fff', life: 22, maxLife: 22, size: 5
            });
          }
          // OVERKILL — track kill timestamps and trigger when many fall in a short window
          {
            const now = game.animFrame;
            game.recentKillFrames = game.recentKillFrames || [];
            game.recentKillFrames = game.recentKillFrames.filter(f => now - f <= 60);
            game.recentKillFrames.push(now);
            if ((game.overkillCooldown || 0) <= 0) {
              const n = game.recentKillFrames.length;
              let label = null, bonus = 0, col = '#fff', size = 12;
              let shake = 0;
              // Halved from 5000/2500/1000 — these stack with comboMul (up to 3×) and DAILY
              // 1.25×, so the original values inflated late-stage runs heavily.
              if (n >= 12)      { label = 'GODLIKE!';  bonus = 3000; col = '#f6f'; size = 16; shake = 14; unlockAchievement('overkillMaster'); }
              else if (n >= 8)  { label = 'MASSACRE!'; bonus = 1500; col = '#f80'; size = 14; shake = 10; }
              else if (n >= 5)  { label = 'OVERKILL!'; bonus = 500;  col = '#ff4'; size = 12; shake = 6; }
              if (label) {
                addScore(bonus);
                game.floatTexts.push({
                  x: BASE_W/2, y: BASE_H/3, text: label,
                  color: col, life: 70, maxLife: 70, size
                });
                game.floatTexts.push({
                  x: BASE_W/2, y: BASE_H/3 + size, text: '+' + bonus,
                  color: '#ff4', life: 70, maxLife: 70, size: 10
                });
                game.overkillCooldown = 90;
                game.shakeTimer = Math.min(20, (game.shakeTimer || 0) + shake);
                game.flashTimer = Math.max(game.flashTimer || 0, n >= 12 ? 8 : n >= 8 ? 6 : 4);
                game.flashColor = col;
                rumble(120 + shake * 8, 0.4 + shake * 0.04, 0.2 + shake * 0.02);
                playSound('comboStep');
              }
            }
          }
          // Light haptic tick on each kill — heavier for special targets
          if (e.type === 'goldenBee' || e.type === 'ufo')      rumble(110, 0.55, 0.30);
          else if (e.type === 'boss' || e.type === 'shielded') rumble(70,  0.35, 0.15);
          else                                                  rumble(35,  0.20, 0.05);
          // Debris chunks scaled by enemy size
          spawnDebris(e.x, e.y, e.type);
          // Strike line — brief flash from player ship to kill site (4-frame fade)
          (game.strikeFx = game.strikeFx || []).push({
            x1: game.playerX, y1: game.playerY - 6,
            x2: e.x, y2: e.y, life: 0
          });
          // KILL CHAIN VISUAL — append kill position to recent buffer; drawn as a
          // line connecting consecutive kills, faded by age. Only renders when combo
          // >= 3 to keep it from spamming on low-skill play.
          (game.recentKillPositions = game.recentKillPositions || []).unshift({
            x: e.x, y: e.y, age: 0
          });
          if (game.recentKillPositions.length > 6) game.recentKillPositions.length = 6;
          // Brief radial flash at kill location — extra impact for boss/super kills
          if (e.type === 'boss' || e.type === 'shielded' || e.type === 'mirror') {
            for (let q = 0; q < 6; q++) {
              const a = (q / 6) * Math.PI * 2;
              game.itemBursts.push({
                x: e.x + Math.cos(a) * 6,
                y: e.y + Math.sin(a) * 6,
                life: -q, color: '#fff'
              });
            }
          }
          // Nearby formation enemies "flinch" briefly — set a visual flinch counter
          for (const ne of game.enemies) {
            if (!ne.alive || ne.state !== 'formation') continue;
            const ddx = Math.abs(ne.x - e.x), ddy = Math.abs(ne.y - e.y);
            if (ddx < 24 && ddy < 24) ne.flinch = 6;
          }
          // Shockwave ring — radius scales with enemy size
          const shockMax = e.type === 'goldenBee' ? 22 : e.type === 'ufo' || e.type === 'mirror' ? 18
                         : e.type === 'boss' || e.type === 'shielded' ? 16 : 12;
          const shockCol = e.type === 'goldenBee' ? '#fc4'
                         : e.type === 'ufo'       ? '#0ef'
                         : e.type === 'mirror'    ? '#0ff'
                         : e.type === 'boss' || e.type === 'shielded' ? '#f6f' : '#ff4';
          game.shockwaves.push({ x: e.x, y: e.y, life: 0, maxLife: 14, maxR: shockMax, color: shockCol });
          // Camera shake scaled by kill significance (additive — bigger kills feel bigger)
          let shakeAdd;
          if (e.type === 'goldenBee')                          shakeAdd = 8;
          else if (e.type === 'ufo')                           shakeAdd = 6;
          else if (e.type === 'boss' || e.type === 'shielded' || e.type === 'mirror') shakeAdd = 4;
          else if (e.type === 'splitter' || e.type === 'kamikaze') shakeAdd = 2;
          else                                                  shakeAdd = 0;
          if (shakeAdd > 0) game.shakeTimer = Math.min(20, game.shakeTimer + shakeAdd);
          // Hit-stop: brief pause-the-game on impactful kills (not every bee)
          let stopFrames = 0;
          if (e.type === 'goldenBee') stopFrames = 6;
          else if (e.type === 'ufo' || e.type === 'mirror') stopFrames = 4;
          else if (e.type === 'boss' || e.type === 'shielded') stopFrames = 2;
          if (stopFrames > game.hitStopFrames) game.hitStopFrames = stopFrames;
          // Zoom pulse on visually heavy kills — brief 1.04× swell + ease back
          let zoomPF = 0;
          if (e.type === 'goldenBee') zoomPF = 14;
          else if (e.type === 'ufo' || e.type === 'mirror') zoomPF = 10;
          else if (e.type === 'boss' || e.type === 'shielded') zoomPF = 7;
          if (zoomPF > (game.zoomPulse || 0)) game.zoomPulse = zoomPF;
          // Camera nudge — pull view briefly toward the kill site for big targets
          if (zoomPF > 0) {
            const nudge = e.type === 'goldenBee' ? 4 : e.type === 'ufo' || e.type === 'mirror' ? 3 : 2;
            const dx = e.x - BASE_W/2, dy = e.y - BASE_H/2;
            const len = Math.sqrt(dx*dx + dy*dy) || 1;
            game.camNudgeX = (dx / len) * nudge;
            game.camNudgeY = (dy / len) * nudge;
          }

          // Power-up drop (20% chance, golden bee = 100%). Type weights:
          //   S/N/P each ~17% (52% combined) — permanent level-up
          //   T  7%   — slow-time (timed)
          //   R  9%   — rapid fire (timed)
          //   W  9%   — wave/zigzag bullets (timed)
          //   H  8%   — homing bullets (timed)
          //   L  6%   — piercing laser (timed, rare/strong)
          //   E  7%   — shield charge (defensive, stackable)
          //   B  6%   — screen-clear bomb (instant)
          // Elite enemies have a boosted 35% drop chance (vs 20% normal); goldenBee always drops.
          // POWER UP PITY — track kills without a drop; force a drop at 15 to cap
          // unlucky streaks. Counter resets to 0 each time a power-up actually drops.
          const dropRate = powerUpDropRate(e.elite);
          const pityForced = (game.killsSincePowerUp || 0) >= 15;
          const willDrop = e.type === 'goldenBee' || pityForced || Math.random() < dropRate;
          if (!willDrop) {
            game.killsSincePowerUp = (game.killsSincePowerUp || 0) + 1;
          }
          if (willDrop) {
            game.killsSincePowerUp = 0;
            // SMART POWER DROPS — zero-weight any S/N/P type that's already maxed,
            // then redistribute among remaining types. Avoids wasted pickups when
            // the player has S5 / N3 / P3. Other types (T/R/W/H/L/B/E) unaffected.
            const W = { S: 14, N: 15, P: 15, T: 10, R: 9, W: 8, H: 8, L: 5, B: 5, E: 5, F: 7, D: 4 };
            if ((game.lvl.S || 1) >= MAX_POWER_LVL.S) W.S = 0;
            if ((game.lvl.N || 1) >= MAX_POWER_LVL.N) W.N = 0;
            if ((game.lvl.P || 1) >= MAX_POWER_LVL.P) W.P = 0;
            let total = 0;
            for (const k in W) total += W[k];
            const pick = Math.random() * total;
            let acc = 0, type = 'E';
            for (const k in W) {
              acc += W[k];
              if (pick < acc) { type = k; break; }
            }
            game.powerUps.push({x: e.x, y: e.y, vy: 0.6, type});
            // POWERUP SPAWN BURST — small ring + 6-particle starburst at the drop
            // origin so the player visually catches the moment a pickup appears.
            // Rare types (L/B) get a stronger 2x-radius gold ring for emphasis.
            {
              const _puCols = { S:'#f44', N:'#0ff', P:'#f6f', T:'#8ff', R:'#fc4',
                                W:'#6cf', H:'#0f8', L:'#f6c', B:'#fff', E:'#0f8',
                                F:'#fa6', D:'#0ff' };
              const _puCol = _puCols[type] || '#fff';
              // Rare-tier includes L/B (legendary one-shots) + D (dash refresh, weight 4)
              // + F (fork spread, weight 7). All four get bigger gold drop ring.
              const _rare = (type === 'L' || type === 'B' || type === 'D' || type === 'F');
              if (game.shockwaves) {
                game.shockwaves.push({
                  x: e.x, y: e.y, life: 0,
                  maxLife: _rare ? 24 : 16,
                  maxR: _rare ? 18 : 12,
                  color: _rare ? '#fc4' : _puCol
                });
              }
              if (game.itemBursts) {
                for (let k = 0; k < 6; k++) {
                  const _a = (k / 6) * Math.PI * 2;
                  game.itemBursts.push({
                    x: e.x + Math.cos(_a) * 4,
                    y: e.y + Math.sin(_a) * 4,
                    life: -k, color: _puCol
                  });
                }
              }
            }
            // POWERUP DROP CUE — type-aware spawn SFX so the player can hear
            // what's incoming before looking. Rare types get a stronger cue.
            const dropSfx = (type === 'L' || type === 'B' || type === 'D') ? 'milestone'
                          : (type === 'F' || type === 'H' || type === 'W') ? 'graze'
                          : 'tick';
            playSound(dropSfx);
          }

          // Splitter splits into 2 mini-bees on death
          if (e.type === 'splitter') {
            for (let s = 0; s < 2; s++) {
              game.enemies.push({
                type: 'minibee', alive: true, hp: 1,
                x: e.x, y: e.y,
                vx: (s === 0 ? -1 : 1) * (0.7 + Math.random() * 0.4),
                vy: 1.5 + Math.random() * 0.6,
                state: 'minibee',
                frame: 0, frameTimer: 0
              });
            }
            // SPLITTER FRAGMENT BURST — 6 orange sparks radiating from death site
            // + 'SPLIT' floattext. Cinematic moment for the fragmentation event;
            // the two minibee sprites are quiet by comparison.
            if (game.itemBursts) {
              for (let _sk = 0; _sk < 6; _sk++) {
                const _sa = (_sk / 6) * Math.PI * 2;
                game.itemBursts.push({
                  x: e.x + Math.cos(_sa) * 5,
                  y: e.y + Math.sin(_sa) * 5,
                  life: -_sk, color: '#fa0'
                });
              }
            }
            game.floatTexts.push({
              x: e.x, y: e.y - 10, text: 'SPLIT',
              color: '#fa0', life: 24, maxLife: 24, size: 5
            });
          }

          // Self-rescue bonus — killing a boss MID-CAPTURE before it grabs your ship
          if (e.type === 'boss' && e.state === 'capturing' && !e.capturedShip) {
            addScore(1500);
            game.selfRescueCount = (game.selfRescueCount || 0) + 1;
            if (game.selfRescueCount === 5) unlockAchievement('savior');
            game.floatTexts.push({
              x: e.x, y: e.y - 12, text: 'SELF RESCUE!',
              color: '#fc4', life: 80, maxLife: 80, size: 9
            });
            game.floatTexts.push({
              x: e.x, y: e.y - 4, text: '+1500',
              color: '#ff4', life: 80, maxLife: 80, size: 8
            });
          }
          // If boss had captured ship, release it (enhanced rescue sequence)
          if (e.type === 'boss' && e.capturedShip && game.capturedShipEnemy === e) {
            game.dualFighter = true;
            game.capturedShipEnemy = null;
            unlockAchievement('dualPilot');
            playSound('rescue');
            playSound('dualFighter');
            // Triple-line celebration banner
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 - 18, text: 'DUAL FIGHTER!',
              color: '#ff4', life: 110, maxLife: 110, size: 14, glow: 9
            });
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 - 4, text: 'RESCUED',
              color: '#0ff', life: 100, maxLife: 100, size: 9
            });
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 + 8, text: 'FORMATION!',
              color: '#f6f', life: 100, maxLife: 100, size: 8
            });
            // Cascading vertical beam from rescue point down to the player
            const beamSteps = 22;
            const beamCols = ['#ff4', '#0ff', '#fff', '#f6f'];
            for (let k = 0; k < beamSteps; k++) {
              const t = k / (beamSteps - 1);
              const bx = e.x + (game.playerX - e.x) * t + (Math.random() - 0.5) * 3;
              const by = e.y + (game.playerY - e.y) * t;
              game.itemBursts.push({
                x: bx, y: by,
                life: -k * 1,
                color: beamCols[k % beamCols.length]
              });
            }
            // Ring burst around player (bigger than before)
            for (let k = 0; k < 16; k++) {
              const angle = (k / 16) * Math.PI * 2;
              const r = 16 + Math.random() * 12;
              game.itemBursts.push({
                x: game.playerX + Math.cos(angle) * r,
                y: game.playerY + Math.sin(angle) * r,
                life: -k * 2 - 22,
                color: k % 2 === 0 ? '#ff4' : '#0ff'
              });
            }
            // Ring burst at the freed boss location
            for (let k = 0; k < 8; k++) {
              const angle = (k / 8) * Math.PI * 2;
              const r = 12 + Math.random() * 6;
              game.itemBursts.push({
                x: e.x + Math.cos(angle) * r,
                y: e.y + Math.sin(angle) * r,
                life: -k,
                color: '#fff'
              });
            }
            spawnConfetti(20);
            game.flashTimer = 10;
            game.flashColor = '#ff4';
            game.shakeTimer = 8;
          }

          if (game.state === STATE.CHALLENGING) {
            game.challengeHits++;
          }
        }
        // Laser keeps going through the formation; normal bullets are consumed on hit.
        if (!isLaser) break;
      }
    }
  }

  // DASH PARRY — during a dash (dashTimer > 0), the player can DEFLECT enemy bullets
  // by passing through them. Each parried bullet: removed, +50 score, spark, sound.
  // Lives ABOVE the regular collision check (which skips while invincible) so we get
  // the parry effect during exactly the same iframe window as dash invincibility.
  if (game.playerAlive && (game.dashTimer || 0) > 0) {
    const hitW = game.dualFighter ? 16 : 7;
    let _parriedThisFrame = 0;
    for (let i = game.enemyBullets.length - 1; i >= 0; i--) {
      const b = game.enemyBullets[i];
      if (Math.abs(b.x - game.playerX) < hitW + 2 && Math.abs(b.y - game.playerY) < 9) {
        _parriedThisFrame++;
        // PARRY DEFLECT GHOST — push 3 fading cyan ghosts upward from bullet pos
        // before removing the bullet. Reads as 'deflected back at sender'.
        if (game.itemBursts) {
          for (let _g = 0; _g < 3; _g++) {
            game.itemBursts.push({
              x: b.x, y: b.y - _g * 3,
              life: -_g * 2, color: '#0ff'
            });
          }
        }
        game.enemyBullets.splice(i, 1);
        // PARRY STREAK — chain parries within 90 frames stack. Tier-up base score
        // 50 → 75 → 100 → 150 (cap). Tier color cyan → purple → gold so chains
        // read as escalating skill expression.
        const streakActive = (game.parryStreakTimer || 0) > 0;
        game.parryStreak = streakActive ? (game.parryStreak || 0) + 1 : 1;
        game.parryStreakTimer = 90;
        if ((game.parryStreak || 0) > (game.parryStreakBest || 0)) game.parryStreakBest = game.parryStreak;
        if ((game.parryStreak || 0) >= 5) unlockAchievement('parryChain');
        // PARRY STREAK 10+ unlocks ULTRA tier (white-gold, 250 score). Below 10
        // the original 4-tier ramp applies. One-time ULTRA fanfare at streak===10.
        const tier = (game.parryStreak >= 10) ? 4
                    : Math.min(3, Math.floor((game.parryStreak - 1) / 2));
        const baseScore = [50, 75, 100, 150, 250][tier];
        const tierCol = ['#0ff', '#a8f', '#f6f', '#fc4', '#fff'][tier];
        const tierLabel = game.parryStreak >= 2 ? ('PARRY x' + game.parryStreak) : 'PARRY';
        // ULTRA PARRY fanfare — fires exactly once when streak crosses 10
        if (game.parryStreak === 10 && !game._ultraParryFired) {
          game._ultraParryFired = true;
          addScore(500);
          game.floatTexts.push({
            x: BASE_W/2, y: BASE_H/2 - 24, text: 'ULTRA PARRY',
            color: '#fff', life: 80, maxLife: 80, size: 12, glow: 8
          });
          game.floatTexts.push({
            x: BASE_W/2, y: BASE_H/2 - 12, text: 'CHAIN x10  +500',
            color: '#fc4', life: 70, maxLife: 70, size: 6
          });
          game.flashTimer = Math.max(game.flashTimer || 0, 8);
          game.flashColor = '#fff';
          if (typeof spawnConfetti === 'function') spawnConfetti(14);
          if (typeof playSound === 'function') playSound('milestone');
          rumble(280, 0.9, 0.5);
        }
        // PERK 'parryDividend' — parry score → 3×
        addScore(game.activePerk === 'parryDividend' ? baseScore * 3 : baseScore);
        // PERFECT PARRY — parry within the first 3 frames of dash (dashTimer
        // 10-12 of starting 12). Bonus +50 + gold "PERFECT" callout above the
        // bullet's deflect spot. Encourages tight timing reads.
        if ((game.dashTimer || 0) >= 10) {
          addScore(50);
          game.floatTexts.push({
            x: b.x, y: b.y - 14,
            text: 'PERFECT', color: '#fc4', life: 35, maxLife: 35, size: 6
          });
          game.perfectParries = (game.perfectParries || 0) + 1;
          // RUN MILESTONE — first perfect parry triggers a narrative INTERCEPT.
          // Perfect parry requires the bullet to land within the first 3 frames
          // of dash (precise timing), so the first one of a run is a clear skill
          // signature worth announcing alongside the existing visual.
          if (game.perfectParries === 1 && typeof pushIntercept === 'function') {
            pushIntercept('perfectParry');
          }
          try {
            const _pp = parseInt(localStorage.getItem('galagaPerfectParries') || '0', 10) || 0;
            localStorage.setItem('galagaPerfectParries', String(_pp + 1));
          } catch (e) {}
          // PARRY ECHO — perfect parry spawns a cyan return-bullet flying upward from
          // the deflect point. Deals 1 dmg to first enemy hit (uses standard bullet
          // pool/collision). Tagged with _parryEcho so future render code can theme.
          game.bullets.push({
            x: b.x, y: b.y - 4,
            vy: -BULLET_SPEED * 1.2,
            dmg: 1, lvl: 1,
            _parryEcho: true
          });
          // Extra cyan upward burst at deflect site for visual feedback
          for (let _ek = 0; _ek < 3; _ek++) {
            game.itemBursts.push({
              x: b.x + (Math.random() - 0.5) * 2,
              y: b.y - _ek * 3,
              life: -_ek * 2, color: '#0ff'
            });
          }
        }
        game.parryCount = (game.parryCount || 0) + 1;
        // SIGNAL INTERCEPT — first parry of run announces the dash-deflect read.
        if (game.parryCount === 1 && typeof pushIntercept === 'function') {
          pushIntercept('firstParry');
        }
        // SIGNAL INTERCEPT — 10 parries in run = deflection mastery milestone
        if (game.parryCount === 10 && typeof pushIntercept === 'function') {
          pushIntercept('parryMaster');
        }
        // PARRY LIFETIME TROPHIES — accumulate to localStorage for cross-run trophies
        try {
          const pt = parseInt(localStorage.getItem('galagaParryTotal') || '0', 10) || 0;
          const npt = pt + 1;
          localStorage.setItem('galagaParryTotal', String(npt));
          if (npt >= 50)  unlockAchievement('parry50');
          if (npt >= 200) unlockAchievement('parry200');
          if (npt >= 500) unlockAchievement('parry500');
        } catch (e) {}
        // Visual + audio feedback at parry site
        game.hitSparks.push({ x: b.x, y: b.y, life: 0 });
        const sparkCount = 4 + tier * 2;
        for (let k = 0; k < sparkCount; k++) {
          const a = (k / sparkCount) * Math.PI * 2;
          game.itemBursts.push({
            x: b.x + Math.cos(a) * 4,
            y: b.y + Math.sin(a) * 4,
            life: -k, color: tierCol
          });
        }
        game.floatTexts.push({
          x: b.x, y: b.y - 6, text: tierLabel + ' +' + baseScore,
          color: tierCol, life: 30 + tier * 6, maxLife: 30 + tier * 6, size: 5 + tier
        });
        if (tier >= 2 && game.parryStreak % 2 === 1) {
          // Higher tier — small rumble + flash for emphasis
          game.flashTimer = Math.max(game.flashTimer || 0, 4);
          game.flashColor = tierCol;
          rumble(110, 0.5, 0.25);
        }
        playSound('graze'); // metallic ping reused — short, bright, fits parry feel
      }
    }
    // CLUSTER PARRY — deflecting 3+ bullets in a single dash frame is a high-skill
    // dive-into-fire read. Recognized with a gold banner + bonus + per-run count.
    // Distinct from PARRY STREAK (chains across frames); this is same-frame density.
    if (_parriedThisFrame >= 3) {
      game.clusterParries = (game.clusterParries || 0) + 1;
      if (_parriedThisFrame > (game.clusterParryBest || 0)) game.clusterParryBest = _parriedThisFrame;
      addScore(100);
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 30, text: 'CLUSTER PARRY x' + _parriedThisFrame,
        color: '#fc4', life: 50, maxLife: 50, size: 9, glow: 6
      });
      game.flashTimer = Math.max(game.flashTimer || 0, 5);
      game.flashColor = '#0ff';
      // HITSTOP — brief freeze scales with cluster size (4f base, +1 per extra
      // bullet, capped 8). Gives the high-skill multi-deflect tactile weight,
      // smaller than the boss-kill hitstop (14) so it punctuates without dragging.
      game.hitStopFrames = Math.max(game.hitStopFrames || 0, Math.min(8, 4 + (_parriedThisFrame - 3)));
      if (typeof spawnConfetti === 'function') spawnConfetti(8);
      if (typeof playSound === 'function') playSound('milestone');
      rumble(180, 0.6, 0.35);
      // NARRATIVE FUSION — enemy comms register the impossible deflection (once/run).
      if (!game._clusterInterceptFired && typeof pushIntercept === 'function') {
        game._clusterInterceptFired = true;
        pushIntercept('clusterParry');
      }
    }
  }
  // Enemy bullets vs player (skip while invincible)
  if (game.playerAlive && game.invincibleTimer <= 0) {
    for (let i = game.enemyBullets.length - 1; i >= 0; i--) {
      const b = game.enemyBullets[i];
      const hitW = game.dualFighter ? 16 : 7;
      if (Math.abs(b.x - game.playerX) < hitW && Math.abs(b.y - game.playerY) < 7) {
        if (tryTriggerWitchTime(b.x, b.y)) break;  // bullet not consumed; witch window opened
        const _bX = b.x, _bY = b.y, _bType = b.fromType;
        // REVENGE: pass the firing enemy's type (formation/dive/elite bullets carry
        // fromType). killPlayer seeds the target only if the hit is actually fatal.
        game.enemyBullets.splice(i, 1);
        killPlayer(_bX, _bY, 'bullet', _bType);
        break;
      }
    }
  }
  // NEAR MISS RECOGNITION — enemy bullet that passes through the safety margin
  // just outside the player hit zone (hitW+1 ≤ |dx| ≤ hitW+6, |dy| < 4) without
  // landing. Adds a quiet visual reward for tight dodges (no score, no parry —
  // distinct from DASH PARRY which deflects). Per-bullet flag + 24f global
  // cooldown prevents spam on dense barrages.
  if (game.playerAlive && game.invincibleTimer <= 0
      && (game.nearMissCooldown || 0) <= 0 && (game.dashTimer || 0) <= 0) {
    const _hitW = game.dualFighter ? 16 : 7;
    for (const b of game.enemyBullets) {
      if (b._missed) continue;
      const _dx = Math.abs(b.x - game.playerX);
      const _dy = Math.abs(b.y - game.playerY);
      if (_dx > _hitW + 1 && _dx <= _hitW + 6 && _dy < 4) {
        b._missed = true;
        game.nearMissCooldown = 24;
        game.nearMissCount = (game.nearMissCount || 0) + 1;
        // GRAZE CHAIN — track consecutive near-misses within a 90f window. Mirrors
        // parryStreak paradigm but rewards passive evasion (no dash required).
        // chain ≥ 3 surfaces a "GRAZE x{N}" floattext above the player; chain ≥ 5
        // adds a brighter halo. Chain decays via nearMissChainTimer below.
        game.nearMissChain = (game.nearMissChain || 0) + 1;
        game.nearMissChainTimer = 90;
        if (game.nearMissChain > (game.nearMissChainBest || 0)) {
          game.nearMissChainBest = game.nearMissChain;
          // GRAZE CHAIN LIFETIME PEAK — persist highest chain ever achieved across
          // runs. Mirrors galagaCleanStreakBest / galagaPBBeats / galagaParryTotal.
          // Stats overlay surfaces tier labels (SLIPSTREAM/GHOSTWALK/SHADOWDANCE/BULLET BALLET).
          try {
            const _gcT = parseInt(localStorage.getItem('galagaGrazeChainBest') || '0', 10) || 0;
            if (game.nearMissChain > _gcT) {
              localStorage.setItem('galagaGrazeChainBest', String(game.nearMissChain));
            }
          } catch (_eL) {}
        }
        if (game.nearMissChain >= 3) {
          game.floatTexts.push({
            x: game.playerX, y: game.playerY - 18,
            text: 'GRAZE x' + game.nearMissChain,
            color: '#0ff', life: 36, maxLife: 36, size: 7,
            glow: game.nearMissChain >= 5 ? 5 : 3
          });
        }
        // NARRATIVE FUSION — a deep graze chain (sustained bullet-weaving) makes the
        // enemy comms note the "ghost in the barrage" (once/run at chain 8).
        if (game.nearMissChain >= 8 && !game._grazeChainInterceptFired
            && typeof pushIntercept === 'function') {
          game._grazeChainInterceptFired = true;
          pushIntercept('grazeChain');
        }
        // GRAZE COMBO GRACE — a graze during an active combo (≥ 5) refreshes the
        // combo decay timer by +20f (capped at COMBO_DECAY). Lets skilled dodging
        // bridge gaps between kills so a tense evasion sequence doesn't drop the
        // multiplier. The 24f near-miss cooldown + kill-only combo growth prevent
        // farming — this only extends, never grows, the combo.
        if ((game.combo || 0) >= 5) {
          const _wasDanger = (game.comboTimer || 0) < 40;  // combo was near expiry
          game.comboTimer = Math.min(COMBO_DECAY, (game.comboTimer || 0) + 20);
          // Legibility — only surface "COMBO HELD" when the graze actually rescued
          // a combo that was about to expire (timer < 40). Avoids spam on safe grazes.
          if (_wasDanger) {
            game.floatTexts.push({
              x: 34, y: 42, text: 'COMBO HELD',
              color: '#0ff', life: 30, maxLife: 30, size: 5
            });
          }
        }
        // NEAR MISS LIFETIME — accumulate across runs in localStorage. Mirrors
        // parry lifetime pattern (try/catch, non-fatal on corrupt storage).
        try {
          const _nt = parseInt(localStorage.getItem('galagaNearMissTotal') || '0', 10) || 0;
          localStorage.setItem('galagaNearMissTotal', String(_nt + 1));
        } catch (_e) {}
        // RUN MILESTONE — 25 near misses in a run fires the EVASION SPECIALIST
        // intercept. Threshold higher than parry (10) since near misses are
        // passive (just survive) rather than active (dash timing).
        if (game.nearMissCount === 25 && typeof pushIntercept === 'function') {
          pushIntercept('nearMissAce');
        }
        // Quiet visual — 3 small white ring puffs at the bullet position
        if (game.itemBursts) {
          for (let _r = 0; _r < 3; _r++) {
            game.itemBursts.push({
              x: b.x + (Math.random() - 0.5) * 1.5,
              y: b.y + (Math.random() - 0.5) * 1.5,
              life: -_r, color: '#fff'
            });
          }
        }
        // Tiny dot floattext above the bullet — reads as "just missed"
        game.floatTexts.push({
          x: b.x, y: b.y - 7, text: '·',
          color: '#fff', life: 18, maxLife: 18, size: 6
        });
        if (typeof playSound === 'function') playSound('graze');
        break;
      }
    }
  }
  if ((game.nearMissCooldown || 0) > 0) game.nearMissCooldown--;
  // GRAZE CHAIN decay — 90f without a fresh near-miss resets the chain. Mirrors
  // comboTimer cadence. nearMissChain itself stays 0 once expired; nearMissChainBest
  // (per-run peak) persists for the runHighlights summary.
  if ((game.nearMissChainTimer || 0) > 0) {
    game.nearMissChainTimer--;
    if (game.nearMissChainTimer <= 0) game.nearMissChain = 0;
  }

  // Diving enemies vs player (collision; skip while invincible)
  if (game.playerAlive && game.invincibleTimer <= 0) {
    for (const e of game.enemies) {
      if (!e.alive || e.state === 'formation' || e.state === 'entering') continue;
      const hitW = game.dualFighter ? 16 : 7;
      if (Math.abs(e.x - game.playerX) < hitW + 6 && Math.abs(e.y - game.playerY) < 10) {
        if (tryTriggerWitchTime(e.x, e.y)) break;  // collision not resolved; witch window opened
        const _eX = e.x, _eY = e.y, _eType = e.type;
        e.alive = false;
        game.explosions.push({x: e.x, y: e.y, timer: 0, maxTime: 20});
        playSound('explode');
        // REVENGE: pass the colliding enemy's type; killPlayer seeds the avenge
        // target only on a confirmed death (shield/cheat absorb won't false-trigger).
        killPlayer(_eX, _eY, 'collision', _eType);
        break;
      }
    }
  }
}

// WITCH TIME — opens a slow-mo grace window before applying a fatal hit. Returns true
// when the window opened (caller must NOT proceed with the kill); false when no save
// is available (cooldown active, shield+cheat handle their own paths anyway).
// The window expires in update() — if dash fired, save; else kill resolves there.
function tryTriggerWitchTime(srcX, srcY) {
  if (game.witchTimer > 0) return true;          // already in a window — defer
  if (game.witchCooldown > 0) return false;       // can't save again yet
  if (game.cheatInvincible) return false;         // cheat path handles it
  if ((game.shieldCharges || 0) > 0) return false; // shield path handles it (cheaper)
  game.witchTimer = WITCH_WINDOW;
  game.witchSrcX = srcX;
  game.witchSrcY = srcY;
  game.witchSaved = false;
  // Brief invincibility flicker so the same bullet doesn't re-collide while we're paused
  game.invincibleTimer = Math.max(game.invincibleTimer, WITCH_WINDOW + 6);
  game.flashTimer = 6;
  game.flashColor = '#fff';
  game.shakeTimer = Math.max(game.shakeTimer || 0, 6);
  game.floatTexts.push({
    x: BASE_W/2, y: BASE_H/2 - 24, text: 'DASH!',
    color: '#ff4', life: WITCH_WINDOW, maxLife: WITCH_WINDOW, size: 14
  });
  playSound('powerUp');
  rumble(180, 0.7, 0.4);
  return true;
}

function killPlayer(srcX, srcY, cause, srcType) {
  // STAGE HIT REGISTRY — any hit attempt counted (even cheat/shield-absorbed) so
  // UNTOUCHED STAGE detection at clear sees zero only on truly clean runs.
  // Witch time pre-check (which can save) does NOT increment — that's a player
  // skill window, not a touch.
  game.stageHitTaken = (game.stageHitTaken || 0) + 1;
  // DEATH POSTMORTEM — capture the offending hit source so the renderer can draw
  // a red expanding ring at the culprit for the next ~30 frames. Only set when a
  // source is supplied (witch/shield/cheat paths bail out before the visual).
  if (typeof srcX === 'number' && typeof srcY === 'number') {
    game.deathSrcX = srcX;
    game.deathSrcY = srcY;
    game.deathMarkerLife = 30;
  }
  // DEATH CAUSE TALLY — accumulate per-cause death counts to localStorage.
  // Only counted if the kill actually lands (witch/shield/cheat skip below).
  // Stash on game; finalized in the lives-- branch where deathDidLand is known.
  game._deathCausePending = cause || 'unknown';
  // Cheat: GOD MODE absorbs the hit. Brief flash + score-flick to make the save visible.
  if (game.cheatInvincible) {
    game.flashTimer = 4;
    game.flashColor = '#fc4';
    game.invincibleTimer = Math.max(game.invincibleTimer, 30);
    return;
  }
  // SHIELD absorb — consume one charge, brief iframes, no death. Shield is stackable
  // (E pickup adds +1, max SHIELD_MAX) so the player can bank defensive runs.
  if ((game.shieldCharges || 0) > 0) {
    const _wasLastShield = game.shieldCharges === 1;
    game.shieldCharges--;
    game.battleScars = Math.min(5, (game.battleScars || 0) + 1);
    game.invincibleTimer = Math.max(game.invincibleTimer, 60);
    game.flashTimer = 10;
    game.flashColor = '#4f8';
    game.shakeTimer = Math.max(game.shakeTimer || 0, 10);
    // SIGNAL INTERCEPT — enemy comms confused by absorbed hit
    if (typeof pushIntercept === 'function') pushIntercept('shieldHold');
    // SHIELD ABSORB CINEMATIC — 3 staggered expanding shockwave rings + 12
    // itemBurst sparks + bigger banner + tiny hitStop. Makes the save feel
    // earned without changing the gameplay outcome.
    if (game.shockwaves) {
      game.shockwaves.push({ x: game.playerX, y: game.playerY, life: 0,  maxLife: 22, maxR: 24, color: '#4f8' });
      game.shockwaves.push({ x: game.playerX, y: game.playerY, life: -6, maxLife: 22, maxR: 32, color: '#0f8' });
      game.shockwaves.push({ x: game.playerX, y: game.playerY, life: -12, maxLife: 22, maxR: 40, color: '#fff' });
    }
    game.hitStopFrames = Math.max(game.hitStopFrames || 0, 4);
    // Visual ring burst at player position so the save is unmissable
    for (let k = 0; k < 12; k++) {
      const a = (k / 12) * Math.PI * 2;
      game.itemBursts.push({
        x: game.playerX + Math.cos(a) * 12,
        y: game.playerY + Math.sin(a) * 12,
        life: -k, color: '#4f8'
      });
    }
    game.floatTexts.push({
      x: game.playerX, y: game.playerY - 18, text: 'SHIELD!',
      color: '#4f8', life: 60, maxLife: 60, size: 11, glow: 7
    });
    // BARRIER DOWN — final shield charge consumed. Player is now exposed:
    // next fatal hit goes to witch time / death path. Amber banner reads as
    // "warning, you're out of margin" without being as severe as LAST LIFE.
    if (_wasLastShield) {
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 40, text: 'BARRIER DOWN',
        color: '#fa8', life: 80, maxLife: 80, size: 8
      });
    }
    if (typeof spawnConfetti === 'function') spawnConfetti(6);
    playSound('powerUp');
    rumble(220, 0.7, 0.4);
    return;
  }
  game.playerAlive = false;
  game.stageDied = true;
  // REVENGE KILL TARGET — seed the avenge target ONLY on a confirmed death (the
  // cheat + shield paths early-return above, so a non-fatal absorb never sets it).
  // The next kill of this enemy type fires a "REVENGE!" beat. Pairs with DEATH
  // RECAP WHISPER + REVENGE COUNT.
  if (srcType) game._revengeType = srcType;
  // SIGNAL INTERCEPT — enemy comms celebrate confirmed kill
  if (typeof pushIntercept === 'function') pushIntercept('playerDown');
  game.lvl = {S: 1, N: 1, P: 1};
  game._typeMaxedFlags = {};
  game.powerUps = [];
  // Lose timed power-ups too, for consistency with lvl reset
  game.slowTimer = 0;
  game.rapidTimer = 0;
  game.waveTimer = 0;
  game.homingTimer = 0;
  game.laserTimer = 0;
  game.forkTimer = 0;
  game.shieldCharges = 0;
  // Witch window may have been the trigger for this kill — clear so the death cutscene
  // isn't visually framed by lingering edge glow.
  game.witchTimer = 0;
  // DEATH GHOST TRAIL — snapshot the last 10 motion-trail entries before clearing
  // so the renderer can ghost the player's final path during RESPAWN. 40-frame life.
  if (game.playerTrail && game.playerTrail.length > 0) {
    game.deathGhostTrail = game.playerTrail.slice(0, 10).map(t => ({ x: t.x, y: t.y }));
    game.deathGhostLife = 40;
  }
  // PICKUP STREAK reset — death breaks the no-death pickup chain
  game.pickupStreak = 0;
  // Clear the motion-trail ghost so the dead ship doesn't leave behind ~14 frames
  // of after-image during the RESPAWN cutscene.
  game.playerTrail = [];
  // Cancel mid-dash so respawn isn't already moving
  game.dashTimer = 0;
  game.dashCooldown = 0;
  // Clear any in-flight fire cooldown so the post-respawn first shot isn't briefly delayed.
  game.fireCooldown = 0;
  // Cinematic death hit-stop — pauses the simulation for 12 frames so the player feels the moment
  game.hitStopFrames = Math.max(game.hitStopFrames || 0, 12);
  // Multi-stage debris burst centered on the ship
  for (let i = 0; i < 5; i++) {
    const ox = (Math.random() - 0.5) * 14;
    const oy = (Math.random() - 0.5) * 10;
    game.explosions.push({
      x: game.playerX + ox, y: game.playerY + oy,
      timer: -i * 4, maxTime: 36
    });
  }
  // Spark shower around the wreck
  for (let i = 0; i < 4; i++) {
    game.hitSparks.push({
      x: game.playerX + (Math.random() - 0.5) * 12,
      y: game.playerY + (Math.random() - 0.5) * 8,
      life: -i * 2
    });
  }
  // DEATH SHARDS — 8 ship-fragment pieces flying outward with gravity. Uses game.debris
  // pool (boss-death style) for ship-color + white + orange break-apart fragments.
  // Adds visceral cinematic feel to the death moment.
  {
    const _shipCol = (game.ship && game.ship.color) || '#0cf';
    for (let s = 0; s < 8; s++) {
      const _sang = (s / 8) * Math.PI * 2 + Math.random() * 0.4;
      const _ssp = 0.8 + Math.random() * 1.4;
      game.debris.push({
        x: game.playerX + Math.cos(_sang) * 3,
        y: game.playerY + Math.sin(_sang) * 3,
        vx: Math.cos(_sang) * _ssp,
        vy: Math.sin(_sang) * _ssp - 0.3,
        life: -Math.floor(Math.random() * 8),
        maxLife: 70 + Math.floor(Math.random() * 30),
        color: s < 2 ? '#fff' : s < 4 ? '#f84' : _shipCol,
        size: 1 + Math.floor(Math.random() * 2)
      });
    }
    // Red shock ring at death position — distinct from white flash
    if (game.shockwaves) {
      game.shockwaves.push({
        x: game.playerX, y: game.playerY,
        life: 0, maxLife: 22, maxR: 26, color: '#f44'
      });
    }
  }
  // Screen flash + heavy controller rumble
  game.flashTimer = 8;
  game.flashColor = '#fff';
  rumble(420, 1.0, 0.6);
  playSound('explode');
  game.shakeTimer = 30;
  game.pausedState = game.state; // remember current state for respawn
  if (game.dualFighter) {
    game.dualFighter = false;
    // DUAL FIGHTER LOST — cinematic beat for losing the bonus wing. Dual is
    // a rare run asset (boss-capture rescue path or perk), and gain already
    // surfaces a banner — silent loss broke that symmetry.
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 - 30, text: 'DUAL LOST',
      color: '#fa8', life: 85, maxLife: 85, size: 10
    });
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 - 16, text: 'WINGMAN DOWN',
      color: '#888', life: 75, maxLife: 75, size: 5
    });
    if (typeof playSound === 'function') playSound('lowLife');
    // Lose one ship from dual, continue with single
    game.state = STATE.RESPAWN;
    game.respawnTimer = 90;
  } else {
    game.lives--;
    // LAST LIFE ALERT — fires once when lives transitions to exactly 1.
    // Dramatic red banner + flash + rumble. Re-arms when lives goes back up.
    if (game.lives === 1 && !game._lastLifeAlertFired) {
      game._lastLifeAlertFired = true;
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 30, text: 'LAST LIFE',
        color: '#f44', life: 100, maxLife: 100, size: 14
      });
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 16, text: 'MAKE IT COUNT',
        color: '#fff', life: 90, maxLife: 90, size: 6
      });
      game.flashTimer = Math.max(game.flashTimer || 0, 12);
      game.flashColor = '#f44';
      if (typeof rumble === 'function') rumble(300, 0.95, 0.6);
      if (typeof playSound === 'function') playSound('lowHealth');
      // SIGNAL INTERCEPT — adversary victory-anticipation as player hits last life
      if (typeof pushIntercept === 'function') pushIntercept('finalLife');
    }
    // Re-arm when player gains a life (extra ship pickup brings >=2)
    // Handled lazily in addScore/extra life paths (see below) but ensure flag
    // is not stale here.
    // DEATH CAUSE TALLY — record cause to localStorage (death landed)
    if (game._deathCausePending) {
      // FINAL CAUSE — keep on game for GAME_OVER recap line (cleared at resetGame)
      game.lastDeathCause = game._deathCausePending;
      try {
        const raw = localStorage.getItem('galagaDeathCauses') || '{}';
        const tally = JSON.parse(raw);
        const c = game._deathCausePending;
        tally[c] = (tally[c] || 0) + 1;
        localStorage.setItem('galagaDeathCauses', JSON.stringify(tally));
      } catch (e) {}
      game._deathCausePending = null;
    }
    if (game.lives <= 0) {
      // Demo runs end silently and return to title
      if (game.isDemo) {
        resetGame();
        game.state = STATE.TITLE;
        stopBGM();
        return;
      }
      game.state = STATE.GAME_OVER;
      game.gameOverTimer = 180;
      // GAME OVER FANFARE TIER — SFX scaled by max stage reached so deeper
      // runs end with more triumphant tone even at game over.
      {
        const _ms = (game.stats && game.stats.maxStage) || game.stage || 1;
        const _fSfx = _ms >= 50 ? 'milestone'
                    : _ms >= 30 ? 'powerUp'
                    : _ms >= 10 ? 'tick'
                    : 'lowLife';
        if (typeof playSound === 'function') playSound(_fSfx);
      }
      // GAME OVER BIOME FAREWELL FLASH — last biome col tinted screen flash
      // at game over entry. Atmospheric continuity from the place player died.
      if (typeof biomeForStage === 'function') {
        const _gBid = biomeForStage(game.stage || 1);
        if (_gBid && typeof BIOME_NAMES !== 'undefined' && BIOME_NAMES[_gBid]) {
          game.flashTimer = Math.max(game.flashTimer || 0, 14);
          game.flashColor = BIOME_NAMES[_gBid].col;
        }
      }
      // DEATH MEMORIAL — append final death event to a rolling 5-entry log so the
      // PROFILE page can show recent run memorials. Skipped in demo / challenge
      // tests where deaths are scripted or transient.
      try {
        const memRaw = localStorage.getItem('galagaDeathMemorials') || '[]';
        const mem = JSON.parse(memRaw);
        if (Array.isArray(mem)) {
          mem.unshift({
            stage: game.stage || 0,
            score: game.score || 0,
            mode: game.dailyMode ? 'DAILY' : game.challengeMode ? 'CHAL' : 'NORM',
            ts: Date.now()
          });
          if (mem.length > 5) mem.length = 5;
          localStorage.setItem('galagaDeathMemorials', JSON.stringify(mem));
        }
      } catch (e) {}
      // RUN HISTORY — rolling 10-entry log of final run scores for trend chart.
      try {
        const hRaw = localStorage.getItem('galagaRunHistory') || '[]';
        const hist = JSON.parse(hRaw);
        if (Array.isArray(hist)) {
          hist.push(game.score || 0);
          if (hist.length > 10) hist.splice(0, hist.length - 10);
          localStorage.setItem('galagaRunHistory', JSON.stringify(hist));
        }
      } catch (e) {}
      // Final flush of pending combo PB on game over (batched writer may have
      // missed the last increment within its 60-frame interval).
      if ((game._comboPbPending || 0) > 0) {
        try {
          const cur = parseInt(localStorage.getItem('galagaMaxComboEver') || '0', 10) || 0;
          if (game._comboPbPending > cur) {
            localStorage.setItem('galagaMaxComboEver', String(game._comboPbPending));
          }
        } catch (e) {}
        game._comboPbPending = 0;
      }
      const acc = game.stats.shotsFired === 0 ? 0
        : Math.round((game.stats.shotsHit / game.stats.shotsFired) * 100);
      if (acc >= 80 && game.stats.shotsFired > 30) unlockAchievement('deadEye');
      game.topRank = submitTopScore(game.score, game.stats.maxStage, acc);
      commitGameToCumStats();
      // EPITAPH — narrative bookend that contextualizes this run's death.
      // Voice matches TRANSMISSION_LOGS: terse, in-world, second-person command-room tone.
      game.runEpitaph = pickEpitaph(game.stage, acc);
      // RUN TITLE — playstyle epithet for the personalized epitaph header.
      game.runTitle = (typeof pickRunTitle === 'function') ? pickRunTitle() : 'THE PILOT';
      // RUN HIGHLIGHTS — top 3 stats from this run, shown below epitaph on GAME_OVER.
      game.runHighlights = pickRunHighlights();
      // (Removed the unused RUN TIP computation — it was never rendered on the
      // game-over screen, and mechanic tips are already surfaced by the TITLE
      // rotation + STAGE_INTRO adaptive hints, so a death-screen tip was redundant.)
      // RUN NEXT GOAL — pick the nearest reachable milestone so the death screen
      // ends with a concrete forward target ("NEXT: STAGE 10"). Priority order:
      // next stage milestone within +5 → next boss (×10) → BESTIARY missing → fallback.
      {
        const reached = game.stats.maxStage || 0;
        let goal = null, gColor = '#fc4';
        // Stage milestones from MILESTONE_STAGES + every boss stage
        const tiers = [5, 10, 15, 20, 25, 30, 40, 50, 60, 70, 80];
        for (const t of tiers) {
          if (t > reached && (t - reached) <= 5) {
            goal = 'NEXT: STAGE ' + t + ' (' + (t - reached) + ' AWAY)';
            break;
          }
        }
        if (!goal) {
          // Next boss stage
          const nextBoss = Math.ceil((reached + 1) / 10) * 10;
          if (nextBoss <= 80 && nextBoss > reached) {
            goal = 'NEXT: BOSS ' + nextBoss + ' (' + (nextBoss - reached) + ' AWAY)';
            gColor = '#f88';
          }
        }
        if (!goal) {
          // BESTIARY completion goal (implements the documented "BESTIARY missing"
          // tier) — when the codex is within 3 species of complete, point the player
          // at the holdouts. Adds goal variety beyond pure stage-chasing.
          const _dexN = (typeof dexUnlocked !== 'undefined') ? dexUnlocked.size : 0;
          const _dexT = Object.keys(ENEMY_INFO || {}).length;
          if (_dexN > 0 && _dexN < _dexT && (_dexT - _dexN) <= 3) {
            const _rem = _dexT - _dexN;
            goal = 'DISCOVER ' + _rem + ' MORE SPECIES';
            gColor = '#8f8';
          }
        }
        if (!goal) {
          // Beyond stage 80 — open-ended push
          goal = 'PUSH BEYOND ' + reached + '!';
          gColor = '#0ff';
        }
        game.runGoal = goal;
        game.runGoalCol = gColor;
      }
      playSound('gameOver');
      stopBGM();
    } else {
      game.state = STATE.RESPAWN;
      game.respawnTimer = 120;
    }
  }
}

function updateExplosions() {
  for (let i = game.explosions.length - 1; i >= 0; i--) {
    game.explosions[i].timer++;
    if (game.explosions[i].timer >= game.explosions[i].maxTime) {
      game.explosions.splice(i, 1);
    }
  }
  // Kill chain positions — age each, drop after 30 frames (~0.5s)
  if (game.recentKillPositions) {
    for (const k of game.recentKillPositions) k.age++;
    game.recentKillPositions = game.recentKillPositions.filter(k => k.age < 30);
  }
  // Debris with gravity
  for (let i = game.debris.length - 1; i >= 0; i--) {
    const d = game.debris[i];
    d.life++;
    d.x += d.vx;
    d.y += d.vy;
    d.vy += 0.08; // gravity
    d.vx *= 0.99;
    if (d.life >= d.maxLife || d.y > BASE_H + 4) game.debris.splice(i, 1);
  }
  // Shockwave rings
  if (game.shockwaves) {
    for (let i = game.shockwaves.length - 1; i >= 0; i--) {
      game.shockwaves[i].life++;
      if (game.shockwaves[i].life >= game.shockwaves[i].maxLife) game.shockwaves.splice(i, 1);
    }
  }
  // Strike-line flashes (4-frame life)
  if (game.strikeFx) {
    for (let i = game.strikeFx.length - 1; i >= 0; i--) {
      game.strikeFx[i].life++;
      if (game.strikeFx[i].life >= 4) game.strikeFx.splice(i, 1);
    }
  }
}

function drawStrikeFx() {
  if (!game.strikeFx) return;
  for (const s of game.strikeFx) {
    const fade = 1 - s.life / 4;
    ctx.save();
    ctx.globalAlpha = fade * 0.65;
    ctx.fillStyle = '#fff';
    // Plot straight line from (x1,y1) to (x2,y2) using DDA
    const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
    const steps = Math.max(2, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy))));
    for (let k = 0; k <= steps; k++) {
      const t = k / steps;
      ctx.fillRect(Math.round(s.x1 + dx * t), Math.round(s.y1 + dy * t), 1, 1);
    }
    ctx.restore();
  }
}

function drawShockwaves() {
  if (!game.shockwaves) return;
  for (const s of game.shockwaves) {
    const t = s.life / s.maxLife;
    const r = s.maxR * t;
    ctx.save();
    ctx.globalAlpha = (1 - t) * 0.7;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
    ctx.stroke();
    // Inner thinner ring trailing slightly
    if (t > 0.3) {
      ctx.globalAlpha = (1 - t) * 0.35;
      ctx.beginPath();
      ctx.arc(s.x, s.y, r * 0.7, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawDebris() {
  if (!game.debris) return;
  for (const d of game.debris) {
    // Fade out in last 10 frames
    const fade = d.life > d.maxLife - 10 ? Math.max(0, (d.maxLife - d.life) / 10) : 1;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.fillStyle = d.color;
    ctx.fillRect(Math.round(d.x), Math.round(d.y), d.size, d.size);
    ctx.restore();
  }
}

function updateShake() {
  if (game.shakeTimer > 0) {
    game.shakeTimer--;
    const mul = shakeMul();
    // Ease-out: shake amplitude scales with remaining time so it tapers smoothly
    const amp = 4 * Math.min(1, game.shakeTimer / 8);
    game.shakeX = (Math.random() - 0.5) * amp * mul;
    game.shakeY = (Math.random() - 0.5) * amp * mul;
  } else {
    game.shakeX = 0; game.shakeY = 0;
  }
}

// Pixel debris chunks — tiny rect particles with gravity. Bigger enemies spit more.
function shockwaveCap() {
  if (game.shockwaves && game.shockwaves.length > 30) {
    game.shockwaves.splice(0, game.shockwaves.length - 30);
  }
  if (game.shootingStars && game.shootingStars.length > 30) {
    game.shootingStars.splice(0, game.shootingStars.length - 30);
  }
  if (game.hitSparks && game.hitSparks.length > 50) {
    game.hitSparks.splice(0, game.hitSparks.length - 50);
  }
}
function bulletCap() {
  // Cap enemy bullets to 80 max for performance — splice oldest
  if (game.enemyBullets && game.enemyBullets.length > 80) {
    game.enemyBullets.splice(0, game.enemyBullets.length - 80);
  }
  // Float texts cap
  if (game.floatTexts && game.floatTexts.length > 50) {
    game.floatTexts.splice(0, game.floatTexts.length - 50);
  }
  // Item bursts cap
  if (game.itemBursts && game.itemBursts.length > 100) {
    game.itemBursts.splice(0, game.itemBursts.length - 100);
  }
}

const DEBRIS_PROFILE = {
  bee:       { count: 4,  cols: ['#ff4', '#fc4', '#fff'] },
  butterfly: { count: 6,  cols: ['#f8a', '#f6a', '#fff'] },
  shielded:  { count: 8,  cols: ['#cef', '#88f', '#fff'] },

  kamikaze:  { count: 6,  cols: ['#f44', '#f80', '#fff'] },

  ufo:       { count: 12, cols: ['#bbb', '#0ef', '#fff', '#f44'] },
  goldenBee: { count: 14, cols: ['#fc4', '#ff8', '#fff'] }
};
function spawnDebris(x, y, type) {

      x, y,
      vx: Math.cos(a) * sp,

function spawnConfetti(count) {

  // color so celebrations carry environment hue at biome stages.
  let cols = ['#ff4', '#0ff', '#f6f', '#0f8', '#fa0', '#fff'];
  if (game && typeof biomeForStage === 'function') {

    if (_cid && typeof BIOME_NAMES !== 'undefined' && BIOME_NAMES[_cid]) {

// ENEMY MORALE STATE — dynamic enemy-side narrative gauge tracked from player
// performance stats. 4 states (CONFIDENT / NORMAL / SHAKEN / ROUTED). State changes
// fire matching intercept broadcasts and update a small HUD chip. Pure narrative
// reactivity — no gameplay balance changes.
const MORALE_STATES = {
  CONFIDENT: { col: '#f44', label: 'CONFIDENT' },
  NORMAL:    { col: '#cfc', label: 'NORMAL'    },
  SHAKEN:    { col: '#fc8', label: 'SHAKEN'    },
  ROUTED:    { col: '#0ff', label: 'ROUTED'    }
};
const _MORALE_TRIG = {
  CONFIDENT: 'moraleConfident',
  NORMAL:    'moraleNormal',
  SHAKEN:    'moraleShaken',
  ROUTED:    'moraleRouted'
};
function computeMoraleScore() {
  if (!game) return 0;
  let s = 0;
  s += ((game.stats && game.stats.kills) || 0) * 0.5;
  // Death penalty — each life lost makes enemies more confident
  const livesLost = Math.max(0, 3 - (game.lives || 3));
  s -= livesLost * 12;
  s += (game.witchSaves || 0) * 5;
  s += (game.bossesKilledThisRun || 0) * 30;
  s += (game.parryCount || 0) * 1.5;
  s += (game.eliteKills || 0) * 3;
  s += Math.max(0, ((game.stats && game.stats.maxStage) || 1) - 1) * 5;
  return s;
}
function moraleStateFor(score) {
  if (score <= -50) return 'CONFIDENT';
  if (score < 30)   return 'NORMAL';
  if (score < 150)  return 'SHAKEN';
  return 'ROUTED';
}
function updateEnemyMorale() {
  if (!game) return;
  if (game.state !== STATE.PLAYING && game.state !== STATE.CHALLENGING
      && game.state !== STATE.BOSS_STAGE) return;
  // Throttle to once per second (60 frames) — morale shifts are tonal, not jittery
  game._moraleCheckTimer = (game._moraleCheckTimer || 0) + 1;
  if (game._moraleCheckTimer < 60) return;
  game._moraleCheckTimer = 0;
  const score = computeMoraleScore();
  const newState = moraleStateFor(score);
  const oldState = game.enemyMorale || 'NORMAL';
  if (newState !== oldState) {
    game.enemyMorale = newState;
    const trig = _MORALE_TRIG[newState];
    if (trig && typeof pushIntercept === 'function') pushIntercept(trig);
    // MORALE SHIFT BANNER — short floattext announcing the enemy morale change.
    // Pairs with the INTERCEPT narrative for paired text+visual recognition.
    // Suppressed on first NORMAL set at run start (oldState was 'NORMAL' too).
    if (typeof MORALE_STATES !== 'undefined' && MORALE_STATES[newState] && game.floatTexts) {
      const _ms = MORALE_STATES[newState];
      game.floatTexts.push({
        x: BASE_W/2, y: 50,
        text: 'MORALE: ' + newState,
        color: _ms.col, life: 60, maxLife: 60, size: 6
      });
    }
    // ROUTED CINEMATIC — peak demoralized state. Large cyan shockwave centered
    // on the playfield + brief flash so the rare achievement of fully breaking
    // enemy morale registers as the encounter beat it is. Banner + INTERCEPT
    // still fire; this layers the visual climax on top.
    if (newState === 'ROUTED') {
      if (game.shockwaves) {
        game.shockwaves.push({
          x: BASE_W/2, y: BASE_H/2, life: 0, maxLife: 28, maxR: 80, color: '#0ff'
        });
      }
      game.flashTimer = Math.max(game.flashTimer || 0, 6);
      game.flashColor = '#0ff';
    }
  }
}

// DEATH RECAP WHISPERS — cause-specific coaching lines surfaced at respawn.
// Mapped from game._deathCausePending captured in killPlayer ('bullet' /
// 'collision' / fallback 'unknown'). 3 variants per cause keep repeats fresh.
// Gray ambient tone — narrative voice, not gameplay alarm.
const RESPAWN_WHISPERS = {
  bullet:    ['STAY MOBILE.',  'READ THE FIRE.', 'WATCH THE ARC.'],
  collision: ['KEEP DISTANCE.','MIND THE LINES.','DODGE EARLY.'   ],
  unknown:   ['REFOCUS.',      'STAND READY.',   'AGAIN.'         ]
};

// PB PACING HALF MARK — fires once per stage when stageFrames crosses 50% of
// the stage PB. Mid-stage pacing checkpoint distinct from the urgent 90%+
// pbAlarm. Subtle cyan floattext, no sound (informational only). Stage flag
// _pbHalfMarkFired reset by startStage().
function checkPbHalfMark() {
  if (!game || game._pbHalfMarkFired) return;
  if (typeof stagePBs === 'undefined' || !stagePBs) return;
  const pb = stagePBs[String(game.stage)];
  if (typeof pb !== 'number' || pb <= 0) return;
  if (game.stageFrames >= pb * 0.5 && game.stageFrames < pb * 0.7) {
    game._pbHalfMarkFired = true;
    if (game.floatTexts) {
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H - 70, text: 'HALF MARK',
        color: '#0cf', life: 40, maxLife: 40, size: 6
      });
    }
  }
}

// PILOT MOMENTUM — player-side composure narrative. Complements enemy MORALE
// (their reaction to player) with the player's own state. Pure narrative chip:
// no gameplay impact, no score change. Surfaced only when non-default so HUD
// stays clean for typical play.
//   ASCENDING — combo ≥ 20 AND cleanStreak ≥ 3 (player in peak flow)
//   CORNERED  — lives ≤ 1 (last-life pressure)
//   STRAINED  — recent stageDied + low combo (regrouping)
//   STEADY    — default (not displayed)
const PILOT_MOMENTUM = {
  ASCENDING: { col: '#0ff', label: 'ASCENDING' },
  STEADY:    { col: '#cfc', label: 'STEADY'    },
  STRAINED:  { col: '#fc8', label: 'STRAINED'  },
  CORNERED:  { col: '#f44', label: 'CORNERED'  }
};
function computePilotMomentum() {
  if (!game) return 'STEADY';
  if ((game.lives || 3) <= 1) return 'CORNERED';
  if ((game.combo || 0) >= 20 && (game.cleanStreak || 0) >= 3) return 'ASCENDING';
  if (game.stageDied && (game.combo || 0) < 5) return 'STRAINED';
  return 'STEADY';
}
// PILOT MOMENTUM transition banner — fires a brief banner when the pilot's
// composure shifts into a non-STEADY state. Mirrors the enemy MORALE shift
// banner so both sides of the psychological battle surface their state changes.
// 90-frame cooldown + STEADY-returns-quiet prevents flip-flop spam near thresholds.
function updatePilotMomentum() {
  if (!game) return;
  if (game.state !== STATE.PLAYING && game.state !== STATE.CHALLENGING
      && game.state !== STATE.BOSS_STAGE) return;
  if ((game._pilotMomentumBannerCd || 0) > 0) game._pilotMomentumBannerCd--;
  const cur = computePilotMomentum();
  const prev = game._lastPilotMomentum || 'STEADY';
  if (cur !== prev) {
    game._lastPilotMomentum = cur;
    if (cur !== 'STEADY' && (game._pilotMomentumBannerCd || 0) <= 0
        && typeof PILOT_MOMENTUM !== 'undefined' && PILOT_MOMENTUM[cur] && game.floatTexts) {
      game._pilotMomentumBannerCd = 90;
      const pm = PILOT_MOMENTUM[cur];
      game.floatTexts.push({
        x: BASE_W/2, y: 58, text: 'PILOT ' + pm.label,
        color: pm.col, life: 50, maxLife: 50, size: 6,
        glow: cur === 'CORNERED' ? 4 : 3
      });
    }
  }
}

// ENDURANCE TIERS — wall-clock survival milestones tracked across the whole run.
// Each crossing fires a banner + score bonus + intercept + flash. Per-run one-shot
// via _enduranceFired flags. Frames count at 60 FPS — 180 frames = 3 sec, 10800 = 3 min.
const ENDURANCE_TIERS = [
  { frames: 10800, label: 'STILL FLYING',   bonus:  500, col: '#cef', size:  9 },
  { frames: 18000, label: 'VETERAN PILOT',  bonus: 1000, col: '#0cf', size: 10 },
  { frames: 36000, label: 'DECORATED',      bonus: 1500, col: '#0ff', size: 11 },
  { frames: 54000, label: 'LEGEND',         bonus: 2500, col: '#fc4', size: 12 },
  { frames: 72000, label: 'IMMORTAL',       bonus: 4000, col: '#f6f', size: 13 },
  { frames: 108000, label: 'BEYOND TIME',   bonus: 6000, col: '#fff', size: 14 }
];
function updateEnduranceTiers() {
  if (!game) return;
  if (game.state !== STATE.PLAYING && game.state !== STATE.CHALLENGING
      && game.state !== STATE.BOSS_STAGE) return;
  game._enduranceFired = game._enduranceFired || {};
  const rf = game.runFrames || 0;
  for (const tier of ENDURANCE_TIERS) {
    if (rf >= tier.frames && !game._enduranceFired[tier.frames]) {
      game._enduranceFired[tier.frames] = true;
      const minutes = Math.floor(tier.frames / 3600);
      // Big banner
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 24, text: tier.label,
        color: tier.col, life: 100, maxLife: 100, size: tier.size
      });
      // Subtitle showing time + bonus
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 12, text: minutes + ' MIN · +' + tier.bonus,
        color: '#cfc', life: 100, maxLife: 100, size: 6
      });
      if (typeof addScore === 'function') addScore(tier.bonus);
      if (typeof spawnConfetti === 'function') spawnConfetti(8 + Math.floor(tier.bonus / 1000));
      game.flashTimer = Math.max(game.flashTimer || 0, 6);
      game.flashColor = tier.col;
      if (game.shockwaves && game.playerAlive) {
        game.shockwaves.push({
          x: game.playerX, y: game.playerY,
          life: 0, maxLife: 24, maxR: 28, color: tier.col
        });
      }
      // SIGNAL INTERCEPT — 30-min BEYOND TIME tier gets a unique mythologizing
      // intercept; lower tiers share the generic 'endurance' broadcast.
      if (typeof pushIntercept === 'function') {
        pushIntercept(tier.frames === 108000 ? 'beyondTime' : 'endurance');
      }
      if (typeof playSound === 'function') playSound('milestone');
      break; // single tier fire per frame
    }
  }
}

// PERFECT STAGE — awarded when a stage is cleared with 0 hits taken AND ≥90% accuracy
// AND at least one kill. Adds +1500 bonus + "PERFECT STAGE!" banner + intercept + confetti.
// CHALLENGING stages already have their own "PERFECT!" path (10000 bonus) so we skip
// to avoid double-trigger. Tracks game.perfectStagesRun for highlights/epitaph.
function checkPerfectStageBonus() {
  if (!game) return false;
  if (game.state === STATE.CHALLENGING) return false;
  if ((game.stageHitTaken || 0) > 0) return false;
  if ((game.stageKills || 0) <= 0) return false;
  const fired = game.stageShotsFired || 0;
  if (fired < 5) return false;
  const acc = (game.stageShotsHit || 0) / fired;
  if (acc < 0.90) return false;
  // All criteria met — fire perfect stage ceremony
  game.perfectStagesRun = (game.perfectStagesRun || 0) + 1;
  if (typeof addScore === 'function') addScore(1500);
  game.floatTexts.push({
    x: BASE_W/2, y: BASE_H/2 + 50, text: 'PERFECT STAGE!',
    color: '#fc4', life: 100, maxLife: 100, size: 11
  });
  game.floatTexts.push({
    x: BASE_W/2, y: BASE_H/2 + 60, text: '+1500 — NO HITS, ' + Math.round(acc * 100) + '% ACC',
    color: '#ff8', life: 100, maxLife: 100, size: 5
  });
  if (typeof spawnConfetti === 'function') spawnConfetti(16);
  game.flashTimer = Math.max(game.flashTimer || 0, 8);
  game.flashColor = '#fc4';
  if (game.shockwaves && game.playerAlive) {
    game.shockwaves.push({
      x: game.playerX, y: game.playerY,
      life: 0, maxLife: 26, maxR: 32, color: '#fc4'
    });
  }
  if (typeof pushIntercept === 'function') pushIntercept('perfectStage');
  if (typeof playSound === 'function') playSound('extraLife');
  return true;
}

function spawnStageClear(label, sub) {
  // Snapshot the cleared stage's frame count so STAGE_INTRO of the next stage
  // can surface 'PRV time' as a reflection point.
  game.lastStageFrames = game.stageFrames || 0;
  // Snapshot whether this clear beat the stage's PB (computed below for grade).
  // STAGE_INTRO uses this to color PRV time green on PB-beat clears, and the
  // delta to show how many frames were shaved off (improvement).
  try {
    const _pbFp = (typeof stagePBs !== 'undefined' && stagePBs)
      ? stagePBs[String(game.stage)] : null;
    if (typeof _pbFp === 'number' && _pbFp > 0 && (game.stageFrames || 0) < _pbFp) {
      game.lastStagePBBeat = true;
      game.lastStagePBDelta = _pbFp - (game.stageFrames || 0);
      game.runPBBeats = (game.runPBBeats || 0) + 1;
      // LIFETIME PB BEATS — mirrors parry / witch / near-miss lifetime stats.
      try {
        const _pbT = parseInt(localStorage.getItem('galagaPBBeats') || '0', 10) || 0;
        localStorage.setItem('galagaPBBeats', String(_pbT + 1));
      } catch (_e) {}
    } else {
      game.lastStagePBBeat = false;
      game.lastStagePBDelta = 0;
    }
  } catch (e) { game.lastStagePBBeat = false; game.lastStagePBDelta = 0; }
  game.floatTexts.push({
    x: BASE_W/2, y: BASE_H/2 - 10, text: label,
    color: '#ff4', life: 90, maxLife: 90, size: 14, glow: 9
  });
  // STAGE GRADE — compute letter grade from this stage's stats. Surfaced
  // alongside the clear banner so the player gets immediate skill feedback.
  // S: 95%+ acc + no-death + PB beat
  // A: 85%+ acc + no-death
  // B: 70%+ acc
  // C: < 70% acc
  // D: died this stage
  try {
    const _sf = game.stageShotsFired || 0;
    const _sh = game.stageShotsHit || 0;
    const _accPct = _sf > 0 ? (_sh / _sf) * 100 : 0;
    const _died = !!game.stageDied;
    let _pbBeat = false;
    try {
      const _pbF = (typeof stagePBs !== 'undefined' && stagePBs)
        ? stagePBs[String(game.stage)] : null;
      if (typeof _pbF === 'number' && _pbF > 0 && (game.stageFrames || 0) < _pbF) {
        _pbBeat = true;
      }
    } catch (e) {}
    let _grade, _gCol;
    if (_died) { _grade = 'D'; _gCol = '#f88'; }
    else if (_accPct >= 95 && _pbBeat)  { _grade = 'S'; _gCol = '#fc4'; }
    else if (_accPct >= 85)             { _grade = 'A'; _gCol = '#0f8'; }
    else if (_accPct >= 70)             { _grade = 'B'; _gCol = '#0cf'; }
    else                                { _grade = 'C'; _gCol = '#fff'; }
    if (_sf >= 5) {  // skip grade on near-zero-shot stages (boss insta-clears, etc.)
      game.floatTexts.push({
        x: BASE_W/2 + 56, y: BASE_H/2 - 10, text: _grade,
        color: _gCol, life: 90, maxLife: 90, size: 16,
        glow: _grade === 'S' ? 8 : 0  // apex S-grade picks up a gold halo
      });
      game.floatTexts.push({
        x: BASE_W/2 + 56, y: BASE_H/2 + 2, text: Math.round(_accPct) + '%',
        color: '#888', life: 80, maxLife: 80, size: 5
      });
      // STAGE GRADE LIFETIME TALLY — accumulate per-grade counts to localStorage
      // so PROFILE can surface medal totals (esp. S count = mastery signal).
      try {
        const _gRaw = localStorage.getItem('galagaStageGrades') || '{}';
        const _gT = JSON.parse(_gRaw);
        _gT[_grade] = (_gT[_grade] || 0) + 1;
        localStorage.setItem('galagaStageGrades', JSON.stringify(_gT));
      } catch (e) {}
      // PER-RUN S GRADE COUNTER — feeds into GAME_OVER run highlights
      if (_grade === 'S') game.runSGrades = (game.runSGrades || 0) + 1;
      // LAST STAGE GRADE — surfaces in next STAGE_INTRO as self-comparison.
      game.lastStageGrade = _grade;
      game.lastStageGradeCol = _gCol;
      // RECENT GRADE QUEUE — last 3 grades (oldest → newest). Surfaces in
      // STAGE_INTRO as a 3-letter sequence so streaks read at a glance.
      if (!Array.isArray(game.recentGrades)) game.recentGrades = [];
      game.recentGrades.push(_grade);
      if (game.recentGrades.length > 3) game.recentGrades.shift();
    }
  } catch (e) {}
  // PB BEAT IMMEDIATE REWARD — when this clear beat the stage PB, surface a
  // green "PB -X.Xs" floattext below the banner so the speedrunner sees the
  // payoff at the moment of clearing (not just in next STAGE_INTRO). Reuses
  // lastStagePBBeat/Delta already computed at the top of this function. Skipped
  // when delta = 0 (defensive guard against odd timing edge).
  if (game.lastStagePBBeat && (game.lastStagePBDelta || 0) > 0) {
    const _pbSec = (game.lastStagePBDelta / 60).toFixed(1);
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 + 14, text: 'PB -' + _pbSec + 's',
      color: '#0f8', life: 90, maxLife: 90, size: 8, glow: 5
    });
  }
  // STAGE CLEAR BIOME FLASH — brief biome-colored screen flash for environmental
  // continuity. Falls back to green default when no biome (stage 1-7).
  if (typeof biomeForStage === 'function') {
    const _bid = biomeForStage(game.stage || 1);
    if (_bid && typeof BIOME_NAMES !== 'undefined' && BIOME_NAMES[_bid]) {
      game.flashTimer = Math.max(game.flashTimer || 0, 8);
      game.flashColor = BIOME_NAMES[_bid].col;
      // BIOME PARTICLE BURST — 12 particles in biome color radially from center.
      if (game.itemBursts) {
        for (let _k = 0; _k < 12; _k++) {
          const _a = (_k / 12) * Math.PI * 2;
          game.itemBursts.push({
            x: BASE_W/2 + Math.cos(_a) * 12,
            y: BASE_H/2 + Math.sin(_a) * 12,
            life: -_k, color: BIOME_NAMES[_bid].col
          });
        }
      }
    }
  }
  if (sub) {
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 + 6, text: sub,
      color: '#fff', life: 90, maxLife: 90, size: 9
    });
  }
  // UNTOUCHED STAGE — zero hit-attempts taken (no death, no shield absorb,
  // no cheat eat). Pure evasion mastery. Skipped on stages with <5 shots fired
  // (e.g., instant boss-down doesn't deserve trophy).
  if ((game.stageHitTaken || 0) === 0 && (game.stageShotsFired || 0) >= 5) {
    addScore(300);
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 + 50, text: 'UNTOUCHED',
      color: '#0ff', life: 100, maxLife: 100, size: 11
    });
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 + 62, text: '+300',
      color: '#fff', life: 90, maxLife: 90, size: 6
    });
    if (game.shockwaves) {
      game.shockwaves.push({
        x: game.playerX, y: game.playerY,
        life: 0, maxLife: 26, maxR: 34, color: '#0ff'
      });
    }
    try {
      const _ut = parseInt(localStorage.getItem('galagaUntouchedStages') || '0', 10) || 0;
      localStorage.setItem('galagaUntouchedStages', String(_ut + 1));
    } catch (e) {}
    game.runUntouched = (game.runUntouched || 0) + 1;
  }
  // CLEAN STREAK — consecutive stages cleared without dying. Distinct from
  // runUntouched (cumulative untouched-stage tally) and from runUntouched
  // (which counts zero-hit stages). Reset on any stage-death; surfaced in
  // STAGE_INTRO chip and runHighlights when ≥ 2 / ≥ 3.
  if (game.stageDied) {
    game.cleanStreak = 0;
  } else {
    game.cleanStreak = (game.cleanStreak || 0) + 1;
    if (game.cleanStreak > (game.cleanStreakBest || 0)) {
      game.cleanStreakBest = game.cleanStreak;
    }
    // CLEAN STREAK LIFETIME PEAK — persist highest streak ever achieved across
    // runs. Mirrors galagaParryTotal / galagaWitchSaves / galagaPBBeats pattern.
    // Stats overlay surfaces tier labels (FOCUSED/RELENTLESS/UNTOUCHABLE/PERFECT FORM).
    try {
      const _csT = parseInt(localStorage.getItem('galagaCleanStreakBest') || '0', 10) || 0;
      if (game.cleanStreak > _csT) {
        localStorage.setItem('galagaCleanStreakBest', String(game.cleanStreak));
      }
    } catch (_e) {}
  }
  // LAST STAND — stage cleared with exactly 1 life remaining and didn't die.
  // Adds drama to the win + small score bonus + lifetime counter.
  if ((game.lives || 0) === 1 && !game.stageDied) {
    addScore(200);
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 + 24, text: 'LAST STAND',
      color: '#f44', life: 100, maxLife: 100, size: 11
    });
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 + 36, text: '+200',
      color: '#fff', life: 90, maxLife: 90, size: 6
    });
    game.flashTimer = Math.max(game.flashTimer || 0, 6);
    game.flashColor = '#f44';
    if (typeof rumble === 'function') rumble(320, 0.85, 0.5);
    try {
      const _ls = parseInt(localStorage.getItem('galagaLastStands') || '0', 10) || 0;
      localStorage.setItem('galagaLastStands', String(_ls + 1));
    } catch (e) {}
    game.runLastStands = (game.runLastStands || 0) + 1;
  }
  spawnConfetti(8);
  // STAGE CLEAR PLAYER CELEBRATION — visual reward AT the player ship: shockwave
  // ring + 8 radial spark particles + slight screen flash. Localizes the win.
  if (game.playerAlive) {
    game.shockwaves.push({
      x: game.playerX, y: game.playerY,
      life: 0, maxLife: 24, maxR: 28, color: '#0f8'
    });
    for (let k = 0; k < 8; k++) {
      const a = (k / 8) * Math.PI * 2;
      game.itemBursts.push({
        x: game.playerX + Math.cos(a) * 14,
        y: game.playerY + Math.sin(a) * 14,
        life: -k, color: '#0f8'
      });
    }
    // Brief green flash for celebration tinted toward player
    game.flashTimer = Math.max(game.flashTimer, 8);
    game.flashColor = '#0f8';
    // STAGE CLEAR SPOTLIGHT — 60-frame cinematic vignette centered on the player.
    // Read by drawHUD overlay below to dim screen edges + leave player area lit.
    game.stageClearSpotlightFrames = 60;
  }
  playSound('extraLife');
}

function checkStageComplete() {
  // Stage end pacing — wait until the last kill's explosions have finished playing,
  // THEN start a 120-frame grace before advancing. Gives the climax room to breathe.
  const STAGE_END_GRACE = 120;
  const explosionsClear = (game.explosions || []).length === 0;
  if (game.state === STATE.BOSS_STAGE) {
    if (game.megaBosses && game.megaBosses.length > 0 && game.megaBosses.every(mb => !mb.alive) && explosionsClear) {
      if (game.stageEndGraceTimer === 0) {
        spawnStageClear('BOSS DOWN!', null);
        // PERFECT STAGE check — boss stage variant (rare but possible)
        if (typeof checkPerfectStageBonus === 'function') checkPerfectStageBonus();
        // CLEAN RUN streak — 5 consecutive no-death clears triggers intercept
        game._stagesCleanStreak = game.stageDied ? 0 : ((game._stagesCleanStreak || 0) + 1);
        if (game._stagesCleanStreak === 5 && typeof pushIntercept === 'function') {
          pushIntercept('cleanRun');
        }
        // SUSTAINED SKILL — sustained combo 10+ through stage clear
        if ((game.combo || 0) >= 10 && typeof pushIntercept === 'function') {
          pushIntercept('sustainedSkill');
        }
        // OBJECTIVE check on boss stage clear (Turn 183 extension)
        if (game.stageObjective) {
          if (game.stageObjective.met(game)) {
            game.objectivesMetRun = (game.objectivesMetRun || 0) + 1;
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 + 32,
              text: 'OBJECTIVE COMPLETE!',
              color: '#0f8', life: 100, maxLife: 100, size: 10
            });
            spawnConfetti(8);
          } else {
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 + 32,
              text: 'MISSED: ' + game.stageObjective.label,
              color: '#fa8', life: 80, maxLife: 80, size: 6
            });
          }
        }
        const pbResult = recordStagePB(game.stage, game.stageFrames);
        if (pbResult.isNew) {
          const sec = fmtFrameTime(game.stageFrames);
          const txt = pbResult.prev != null
            ? 'NEW PB! ' + sec + ' (-' + fmtFrameTime(pbResult.prev - game.stageFrames) + ')'
            : 'NEW PB! ' + sec;
          game.floatTexts.push({
            x: BASE_W/2, y: BASE_H/2 + 16, text: txt,
            color: '#0f8', life: 90, maxLife: 90, size: 7, glow: 5
          });
          // PB CELEBRATION ENHANCED — extra confetti + flash + rumble for boss stage PB
          if (typeof spawnConfetti === 'function') spawnConfetti(12);
          game.flashTimer = Math.max(game.flashTimer || 0, 6);
          game.flashColor = '#0f8';
          if (typeof rumble === 'function') rumble(200, 0.7, 0.4);
        }
        // Score PB — boss stage variant
        const sGained = (game.score || 0) - (game.stageStartScore || 0);
        const sPbR = recordStageScorePB(game.stage, sGained);
        if (sPbR.isNew && sGained > 0) {
          const txt = sPbR.prev != null
            ? 'SCORE PB! +' + fmtScore(sGained) + ' (+' + fmtScore(sGained - sPbR.prev) + ')'
            : 'SCORE PB! +' + fmtScore(sGained);
          game.floatTexts.push({
            x: BASE_W/2, y: BASE_H/2 + 24, text: txt,
            color: '#ff4', life: 90, maxLife: 90, size: 7
          });
        }
      }
      if (game.stageEndGraceTimer < STAGE_END_GRACE) {
        game.stageEndGraceTimer++;
      } else {
        game.stageEndGraceTimer = 0;
        game.stage++;
        game.stats.maxStage = Math.max(game.stats.maxStage, game.stage);
        recordMilestoneTime();
        if (!tryTriggerBonusGame()) {
          game.state = STATE.STAGE_INTRO;
          game.stageTimer = 120;
          playSound('stageStart');
        }
      }
    }
  } else if (game.state === STATE.CHALLENGING) {
    if (game.challengeWaveIdx >= game.challengeWaves.length && game.challengeWaveTimer <= 0) {
      // Stage complete — show bonus
      const perfect = game.challengeHits === game.challengeTotal;
      const bonus = perfect ? 10000 : game.challengeHits * 100;
      addScore(bonus);
      spawnStageClear(perfect ? 'PERFECT!' : 'BONUS', '+' + bonus);
      // SIGNAL INTERCEPT — first CHALLENGING clear of run is a distinct milestone
      if (!game._challengeFirstSeen && typeof pushIntercept === 'function') {
        game._challengeFirstSeen = true;
        pushIntercept('firstChallenge');
      }
      // OBJECTIVE check on challenging stage clear (Turn 183 extension)
      if (game.stageObjective) {
        if (game.stageObjective.met(game)) {
          game.objectivesMetRun = (game.objectivesMetRun || 0) + 1;
          game.floatTexts.push({
            x: BASE_W/2, y: BASE_H/2 + 40,
            text: 'OBJECTIVE COMPLETE!',
            color: '#0f8', life: 100, maxLife: 100, size: 10
          });
          spawnConfetti(8);
        } else {
          game.floatTexts.push({
            x: BASE_W/2, y: BASE_H/2 + 40,
            text: 'MISSED: ' + game.stageObjective.label,
            color: '#fa8', life: 80, maxLife: 80, size: 6
          });
        }
      }
      // STAGE PB for challenging stage too
      {
        const pbResult = recordStagePB(game.stage, game.stageFrames);
        if (pbResult.isNew) {
          const sec = fmtFrameTime(game.stageFrames);
          const txt = pbResult.prev != null
            ? 'NEW PB! ' + sec + ' (-' + fmtFrameTime(pbResult.prev - game.stageFrames) + ')'
            : 'NEW PB! ' + sec;
          game.floatTexts.push({
            x: BASE_W/2, y: BASE_H/2 + 24, text: txt,
            color: '#0f8', life: 90, maxLife: 90, size: 7, glow: 5
          });
          // PB CELEBRATION ENHANCED (challenge variant)
          if (typeof spawnConfetti === 'function') spawnConfetti(12);
          game.flashTimer = Math.max(game.flashTimer || 0, 6);
          game.flashColor = '#0f8';
          if (typeof rumble === 'function') rumble(200, 0.7, 0.4);
        }
        // Score PB — challenge stage variant
        const sGained = (game.score || 0) - (game.stageStartScore || 0);
        const sPbR = recordStageScorePB(game.stage, sGained);
        if (sPbR.isNew && sGained > 0) {
          const txt = sPbR.prev != null
            ? 'SCORE PB! +' + fmtScore(sGained) + ' (+' + fmtScore(sGained - sPbR.prev) + ')'
            : 'SCORE PB! +' + fmtScore(sGained);
