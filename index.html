    for (let i = game.muzzleFlashes.length - 1; i >= 0; i--) {
      game.muzzleFlashes[i].life++;
      if (game.muzzleFlashes[i].life > 6) game.muzzleFlashes.splice(i, 1);
    }
  }
}

function drawMuzzleFlashes() {
  if (!game.muzzleFlashes) return;
  for (const m of game.muzzleFlashes) {
    const t = m.life;
    const alpha = Math.max(0, 1 - t / 6);
    const _b = m.big ? 1 : 0;
    ctx.save();
    ctx.globalAlpha = alpha * 0.85;
    // Outer halo (bigger when crit-fired)
    ctx.fillStyle = m.color;
    ctx.fillRect(m.x - 3 - _b, m.y - 3 - _b, 7 + _b*2, 6 + _b*2);
    // Inner bright core
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff';
    ctx.fillRect(m.x - 1, m.y - 2, 2, 4 + _b);
    // Vertical streak (1px thin upward smear)
    ctx.fillStyle = m.color;
    ctx.fillRect(m.x, m.y - 6 - _b, 1, 4 + _b);
    ctx.restore();
  }
}

function updateHitSparks() {
  for (let i = game.hitSparks.length - 1; i >= 0; i--) {
    const s = game.hitSparks[i];
    s.life++;
    if (s.life > 12) game.hitSparks.splice(i, 1);
  }
}

function updateToasts() {
  if (!game.toasts) return;
  for (let i = game.toasts.length - 1; i >= 0; i--) {
    game.toasts[i].life++;
    if (game.toasts[i].life >= game.toasts[i].maxLife) game.toasts.splice(i, 1);
  }
}

function drawAchievementToast(t) {
  const a = ACHIEVEMENTS[t.id];
  if (!a) return;
  // Slide-in from right (frames 0-22), hold (22-200), slide-out (200-240)
  let xOff = 0;
  if (t.life < 22) xOff = (1 - t.life / 22) * 110;
  else if (t.life > 200) xOff = ((t.life - 200) / 40) * 110;
  const w = 100, h = 30;
  const tx = BASE_W - w - 4 + xOff;
  const ty = 38;

  // Outer glow (animated, fades during hold)
  const holdT = Math.min(1, Math.max(0, (t.life - 22) / 30));
  const glowAmp = (t.life < 80 ? 1 - t.life / 80 : 0) * 0.5;
  ctx.save();
  ctx.globalAlpha = (0.35 + 0.30 * Math.sin(t.life * 0.3)) * holdT;
  ctx.fillStyle = COL.yellow;
  ctx.fillRect(tx - 2, ty - 2, w + 4, h + 4);
  ctx.restore();

  // Panel background
  ctx.save();
  ctx.fillStyle = 'rgba(0,30,60,0.95)';
  ctx.fillRect(tx, ty, w, h);
  // Animated marquee dashes along top + bottom
  ctx.fillStyle = COL.yellow;
  for (let i = 0; i < w; i += 6) {
    if ((i + t.life * 2) % 12 < 3) {
      ctx.fillRect(tx + i, ty, 3, 1);
      ctx.fillRect(tx + i, ty + h - 1, 3, 1);
    }
  }
  // Side borders
  ctx.fillRect(tx, ty, 1, h);
  ctx.fillRect(tx + w - 1, ty, 1, h);
  // Bigger trophy icon (left side)
  ctx.fillStyle = COL.yellow;
  ctx.fillRect(tx + 6, ty + 8, 8, 6);
  ctx.fillRect(tx + 5, ty + 9, 1, 4);
  ctx.fillRect(tx + 14, ty + 9, 1, 4);
  ctx.fillRect(tx + 7, ty + 14, 6, 1);
  ctx.fillRect(tx + 9, ty + 15, 2, 3);
  ctx.fillRect(tx + 7, ty + 18, 6, 1);
  // Sparkle on trophy
  if ((t.life >> 2) % 2 === 0) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(tx + 8, ty + 9, 1, 1);
  }
  ctx.restore();
  // Banner texts
  drawRetroText('* UNLOCKED *', tx + 60, ty + 8, 6, COL.yellow);
  drawRetroText(a.name, tx + 60, ty + 17, 7, '#fff');
  // Subtext: short desc, only during hold
  if (t.life > 24 && t.life < 200 && a.desc) {
    drawRetroText(a.desc.slice(0, 18), tx + 60, ty + 25, 5, COL.gray);
  }
}

const COMBO_DECAY = 90; // ~1.5s without a kill resets combo

function comboMultiplier(c) {
  // 0-2 kills: 1x, 3-4: 1.25x, 5-9: 1.5x, 10-14: 2x, 15-19: 2.5x, 20+: 3x
  if (c >= 20) return 3;
  if (c >= 15) return 2.5;
  if (c >= 10) return 2;
  if (c >= 5) return 1.5;
  if (c >= 3) return 1.25;
  return 1;
}

const COMBO_MILESTONE = 40; // every N kills in a combo grants a milestone reward (was 20 — life inflation curbed)

// COMBO ARSENAL ladder — each combo threshold auto-grants a temporary weapon for 3 seconds.
// Avoids 30 (already EXTRA SHIP) and the 3/5/10/15/20 multiplier-tier sound triggers.
// Once claimed in a streak the entry is locked until combo resets — prevents farming the
// same milestone by hovering at threshold-1.
const COMBO_ARSENAL = [
  { combo: 25,  buff: 'rapid',  duration: 180, label: 'RAPID UNLOCK!',  color: '#fc4' },
  { combo: 50,  buff: 'wave',   duration: 180, label: 'WAVE UNLOCK!',   color: '#f8a' },
  { combo: 75,  buff: 'homing', duration: 180, label: 'HOMING UNLOCK!', color: '#0ef' },
  { combo: 100, buff: 'laser',  duration: 180, label: 'LASER UNLOCK!',  color: '#fff' }
];

function bumpCombo() {
  game.combo++;
  game.comboTimer = COMBO_DECAY;
  if (game.combo > game.comboBest) game.comboBest = game.combo;
  // SIGNAL INTERCEPT — enemy threat-level chatter when combo first crosses 10 this stage
  if (game.combo === 10 && !game._stageComboInterceptFired) {
    game._stageComboInterceptFired = true;
    if (typeof pushIntercept === 'function') pushIntercept('comboCritical');
  }
  // GUARDIAN VARIANT — combo 50+ first kill awards a red ATTACK drone (one-shot per run)
  if (game.combo >= 50 && !game._comboGuardianFired) {
    game._comboGuardianFired = true;
    if (typeof spawnGuardian === 'function') spawnGuardian('attack');
  }
  // COMBO MILESTONE RING — at exact combo 50/100 crossing, spawn an expanding ring +
  // banner at player position. Distinct from existing combo arsenal (25/50/75/100
  // free weapon) and multikill (same-frame). One-shot per crossing (re-fires if
  // combo breaks then climbs again to 50/100).
  if ((game.combo === 50 || game.combo === 100) && game.playerAlive) {
    const _is100 = game.combo === 100;
    const _ringCol = _is100 ? '#f6f' : '#fc4';
    if (game.shockwaves) {
      game.shockwaves.push({
        x: game.playerX, y: game.playerY,
        life: 0, maxLife: _is100 ? 32 : 24, maxR: _is100 ? 50 : 32, color: _ringCol
      });
    }
    game.floatTexts.push({
      x: BASE_W / 2, y: BASE_H / 2 - 50,
      text: _is100 ? 'MASTER COMBO!' : 'DEEP COMBO!',
      color: _ringCol, life: 90, maxLife: 90, size: _is100 ? 13 : 11
    });
    game.flashTimer = Math.max(game.flashTimer || 0, _is100 ? 10 : 6);
    game.flashColor = _ringCol;
    game.shakeTimer = Math.max(game.shakeTimer || 0, _is100 ? 8 : 4);
    if (typeof spawnConfetti === 'function') spawnConfetti(_is100 ? 24 : 12);
    if (typeof playSound === 'function') playSound(_is100 ? 'extraLife' : 'milestone');
  }
  // MULTIKILL DETECTOR — track kills in this frame via animFrame stamp.
  // Same-frame kills increment counter; at 2+ trigger banner once per surge.
  if (game._mkFrame === game.animFrame) {
    game._mkCount = (game._mkCount || 1) + 1;
    if (game._mkCount === 2 || game._mkCount === 3 || game._mkCount === 5
        || game._mkCount === 8 || game._mkCount === 10 || game._mkCount === 12) {
      const _mkLabel = game._mkCount >= 12 ? 'GODLIKE'
                     : game._mkCount >= 10 ? 'RAMPAGE'
                     : game._mkCount >= 8  ? 'OCTOKILL'
                     : game._mkCount >= 5  ? 'OVERKILL'
                     : game._mkCount >= 3  ? 'TRIPLE'
                     : 'DOUBLE';
      const _mkCol = game._mkCount >= 12 ? '#fff'
                   : game._mkCount >= 10 ? '#f6f'
                   : game._mkCount >= 5  ? '#fc4'
                   : '#0ff';
      const _mkSize = game._mkCount >= 10 ? 11 : 8;
      game.floatTexts.push({
        x: game.playerX, y: game.playerY - 26,
        text: _mkLabel + (game._mkCount >= 5 ? ' x' + game._mkCount : ''),
        color: _mkCol, life: 60, maxLife: 60, size: _mkSize
      });
      const _confettiN = game._mkCount >= 12 ? 16
                       : game._mkCount >= 10 ? 10
                       : game._mkCount >= 5  ? 4
                       : 0;
      if (_confettiN > 0 && typeof spawnConfetti === 'function') spawnConfetti(_confettiN);
      if (game._mkCount >= 10) {
        game.flashTimer = Math.max(game.flashTimer || 0, 6);
        game.flashColor = _mkCol;
        if (typeof playSound === 'function') playSound('milestone');
        // SIGNAL INTERCEPT — RAMPAGE tier (10+ same-frame kills) triggers narrative
        if (game._mkCount === 10 && typeof pushIntercept === 'function') {
          pushIntercept('multikillRampage');
        }
      }
      game.multiKillsRun = (game.multiKillsRun || 0) + 1;
      if (game._mkCount > (game.multiKillBest || 0)) game.multiKillBest = game._mkCount;
    }
  } else {
    game._mkFrame = game.animFrame;
    game._mkCount = 1;
  }
  // COMBO LIFETIME PB — lazily compare against persisted record. Only fire
  // celebration when combo ≥ 10 (avoids triggering on every novice's first 1-9
  // combo). One-shot per run via _comboPbFired flag.
  if (game.combo >= 10 && !game._comboPbFired) {
    try {
      const prevBest = parseInt(localStorage.getItem('galagaMaxComboEver') || '0', 10) || 0;
      if (game.combo > prevBest) {
        game._comboPbFired = true;
        localStorage.setItem('galagaMaxComboEver', String(game.combo));
        game.floatTexts.push({
          x: BASE_W/2, y: BASE_H/2 - 40, text: 'NEW COMBO RECORD!',
          color: '#fc4', life: 100, maxLife: 100, size: 11
        });
        game.floatTexts.push({
          x: BASE_W/2, y: BASE_H/2 - 26, text: 'COMBO ' + game.combo,
          color: '#fff', life: 100, maxLife: 100, size: 7
        });
        playSound('milestone');
        spawnConfetti(10);
        game.flashTimer = Math.max(game.flashTimer || 0, 6);
        game.flashColor = '#fc4';
      }
    } catch (e) {}
  }
  // Track in-memory only; persist to localStorage in batches (every 60 frames)
  // and on game over to avoid hot-loop synchronous I/O thrashing per kill which
  // could cause frame hitches during high combo / laser piercing kill chains.
  if (game._comboPbFired) {
    game._comboPbPending = game.combo;
  }
  // MEGA COMBO FIREWORKS — escalating screen-wide explosion + confetti spectacle
  // at combo 50/75/100. Layered on top of existing arsenal triggers (which fire on
  // the *first* reach via comboArsenalClaimed). Pure visual; no score impact.
  const megaTier = game.combo === 50 ? 1
                 : game.combo === 75 ? 2
                 : game.combo === 100 ? 3 : 0;
  if (megaTier > 0) {
    const burstCount = [10, 15, 25][megaTier - 1];
    for (let k = 0; k < burstCount; k++) {
      const ex = 16 + Math.random() * (BASE_W - 32);
      const ey = 30 + Math.random() * (BASE_H - 80);
      game.explosions.push({
        x: ex, y: ey, timer: -Math.floor(Math.random() * 24), maxTime: 28
      });
    }
    spawnConfetti(megaTier * 14);
    game.flashTimer = Math.max(game.flashTimer, 14);
    game.flashColor = ['#ff4', '#f80', '#f6f'][megaTier - 1];
    game.shakeTimer = Math.min(20, (game.shakeTimer || 0) + 8 + megaTier * 2);
    const label = ['COMBO 50', 'COMBO 75', 'COMBO 100'][megaTier - 1];
    const subtitle = ['SPECTACULAR!', 'MAGNIFICENT!', 'TRANSCENDENT!'][megaTier - 1];
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 - 36, text: label,
      color: game.flashColor, life: 90, maxLife: 90, size: 14
    });
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 - 22, text: subtitle,
      color: '#ff4', life: 90, maxLife: 90, size: 9
    });
    rumble(300 + megaTier * 60, 0.85, 0.5);
  }
  // COMBO ARSENAL — trigger any unlocks now reachable. Using `>=` so a missed exact
  // increment (e.g. trickShot frame skipping value 25 → 26) still pays out.
  for (const a of COMBO_ARSENAL) {
    if (game.combo >= a.combo && !game.comboArsenalClaimed[a.combo]) {
      game.comboArsenalClaimed[a.combo] = true;
      if      (a.buff === 'rapid')  game.rapidTimer  = Math.max(game.rapidTimer  || 0, a.duration);
      else if (a.buff === 'wave')   game.waveTimer   = Math.max(game.waveTimer   || 0, a.duration);
      else if (a.buff === 'homing') game.homingTimer = Math.max(game.homingTimer || 0, a.duration);
      else if (a.buff === 'laser')  game.laserTimer  = Math.max(game.laserTimer  || 0, a.duration);
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 30, text: a.label,
        color: a.color, life: 80, maxLife: 80, size: 12
      });
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 18, text: 'COMBO ' + a.combo,
        color: '#ff4', life: 80, maxLife: 80, size: 8
      });
      game.flashTimer = 8;
      game.flashColor = a.color;
      game.shakeTimer = Math.min(20, (game.shakeTimer || 0) + 6);
      playSound('powerUp');
      rumble(220, 0.7, 0.4);
      spawnConfetti(10);
      triggerWeaponCallout(a.color);
    }
  }
  if (game.combo === 15) unlockAchievement('combo15');
  if (game.combo === 30) {
    unlockAchievement('comboMaster');
    // MAX COMBO TIER FANFARE — first time hitting combo 30 (max multiplier tier
    // x3.0) per run gets a banner + milestone SFX. Once per run via flag.
    if (!game._maxComboTierFired) {
      game._maxComboTierFired = true;
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 30, text: 'MAX MULTIPLIER',
        color: '#fc4', life: 80, maxLife: 80, size: 10
      });
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 18, text: 'x3.0 ACTIVE',
        color: '#fff', life: 70, maxLife: 70, size: 6
      });
      // MAGNET FIELD CALLOUT — combo 30 unlocks the magnet range boost.
      // Surface it so the player knows the reward, not just a multiplier.
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 6, text: '+ MAGNET FIELD',
        color: '#0cf', life: 70, maxLife: 70, size: 5
      });
      if (typeof spawnConfetti === 'function') spawnConfetti(12);
      if (typeof playSound === 'function') playSound('milestone');
      game.flashTimer = Math.max(game.flashTimer || 0, 6);
      game.flashColor = '#fc4';
    }
  }
  if (game.combo === 30 && !game.stageDied) unlockAchievement('killStreak3');
  if (game.combo === 45) unlockAchievement('combo45');
  if (game.combo === 60) unlockAchievement('streakMaster');
  if (game.combo === 75) unlockAchievement('combo75');
  if (game.combo === 80) unlockAchievement('ultraStreak');
  if (game.combo === 100) unlockAchievement('comboGod');
  // Combo step sound at multiplier-tier transitions, escalating haptic + tiny shake.
  // Tiers: c≥3 (1.25×), c≥5 (1.5×), c≥10 (2×), c≥15 (2.5×), c≥20 (3×, max).
  if (game.combo === 3 || game.combo === 5 || game.combo === 10 || game.combo === 15 || game.combo === 20) {
    // Tier-specific SFX: higher tiers get more triumphant cues (tick→step→
    // powerUp→milestone→extraLife). Pure audio escalation, no gameplay impact.
    const _tSfx = game.combo === 3 ? 'tick'
                : game.combo === 5 ? 'comboStep'
                : game.combo === 10 ? 'powerUp'
                : game.combo === 15 ? 'milestone'
                : 'extraLife';
    playSound(_tSfx);
    const strong = Math.min(0.9, 0.3 + game.combo * 0.04);
    rumble(120, strong, strong * 0.5);
    const shakeAdd = game.combo >= 20 ? 8 : game.combo >= 15 ? 6 : game.combo >= 10 ? 4 : 2;
    game.shakeTimer = Math.min(20, (game.shakeTimer || 0) + shakeAdd);
  }
  // Milestone reward: extra ship every COMBO_MILESTONE kills (or +5000 in challenge mode)
  const tier = Math.floor(game.combo / COMBO_MILESTONE);
  if (tier > game.comboMilestoneClaimed) {
    game.comboMilestoneClaimed = tier;
    if (game.challengeMode) {
      // Use addScore so the combo bonus flows through daily-mode multiplier,
      // milestone toasts, SCORE_CAP, and the live NEW-HIGH check.
      addScore(5000);
    } else {
      game.lives++;
      if (game.lives >= 2) game._lastLifeAlertFired = false;
      game.extraShipsRun = (game.extraShipsRun || 0) + 1;
      // LIFE GAIN PULSE — flag for HUD lives row to pulse gold for 30 frames
      game.lifeGainPulseTimer = 30;
    }
    playSound('extraLife');
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 - 14,
      text: game.challengeMode ? 'COMBO BONUS +5000' : 'EXTRA SHIP!',
      color: '#ff4', life: 90, maxLife: 90, size: 12
    });
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2, text: 'COMBO ' + (tier * COMBO_MILESTONE),
      color: '#0ff', life: 90, maxLife: 90, size: 8
    });
    spawnConfetti(8);
    game.flashTimer = 6;
    game.flashColor = '#ff4';
    rumble(200, 0.5, 0.3);
    // SIGNAL INTERCEPT — combo-driven extra life triggers enemy panic
    if (!game.challengeMode && typeof pushIntercept === 'function') {
      pushIntercept('lifeGain');
    }
  }
}

// Reset milestone tracking when combo resets
function resetComboMilestone() {
  game.comboMilestoneClaimed = 0;
  game.comboArsenalClaimed = {};
}

function updateCombo() {
  if (game.overkillCooldown > 0) game.overkillCooldown--;
  if (game.comboTimer > 0) {
    game.comboTimer--;
    if (game.comboTimer <= 0) {
      const lostCount = game.combo;
      const totalPts = game.comboBonusAccum || 0;
      game.combo = 0;
      game.comboBonusAccum = 0;
      game.comboLostFlashTimer = 30; // brief gray score flash
      resetComboMilestone();
      // SIGNAL INTERCEPT — high combo break (100+) triggers adversary relief beat
      if (lostCount >= 100 && typeof pushIntercept === 'function') {
        pushIntercept('comboResetHigh');
      }
      // Feedback scales with how big the combo was
      if (lostCount >= 3) {
        playSound('comboBreak');
        // Bigger combos = more dramatic break
        const big = lostCount >= 10;
        const huge = lostCount >= 20;
        // BIG COMBO LOST CINEMATIC — when a high combo breaks, slap the player
        // with a gray vignette pulse + shake + extended flash so the loss reads
        // visually, not just in the floatText. Higher tiers = more dramatic.
        if (big) {
          game.shakeTimer = Math.min(20, (game.shakeTimer || 0) + (huge ? 12 : 6));
          game.flashTimer = Math.max(game.flashTimer, huge ? 18 : 10);
          game.flashColor = '#666';
          game.comboLostVignette = huge ? 60 : 40;
        }
        game.floatTexts.push({
          x: BASE_W / 2, y: BASE_H / 2 - 8,
          text: huge ? 'BIG COMBO LOST!!' : (big ? 'COMBO BROKEN!' : 'COMBO LOST'),
          color: huge ? '#f44' : (big ? '#f80' : '#888'),
          life: 60, maxLife: 60,
          size: huge ? 14 : (big ? 11 : 8)
        });
        if (totalPts > 0) {
          game.floatTexts.push({
            x: BASE_W / 2, y: BASE_H / 2 + (big ? 14 : 4),
            text: 'EARNED +' + totalPts,
            color: '#ff4', life: 60, maxLife: 60, size: 7
          });
        }
        if (big) {
          game.floatTexts.push({
            x: BASE_W / 2, y: BASE_H / 2 + 6,
            text: '×' + lostCount + ' STREAK ENDED',
            color: '#ccc', life: 50, maxLife: 50, size: 7
          });
          // Cracking ring at last kill site (use player x as proxy)
          for (let k = 0; k < 14; k++) {
            const a = (k / 14) * Math.PI * 2;
            const r = 16 + Math.random() * 10;
            game.itemBursts.push({
              x: game.playerX + Math.cos(a) * r,
              y: game.playerY + Math.sin(a) * r,
              life: -k * 2,
              color: huge ? '#f44' : '#f80'
            });
          }
          game.flashTimer = huge ? 8 : 5;
          game.flashColor = huge ? '#f44' : '#f80';
          game.shakeTimer = Math.max(game.shakeTimer, huge ? 12 : 6);
        }
      }
    }
  }
}

function updatePlayerTrail() {
  if (game.playerAlive) {
    const last = game.playerTrail[0];
    const dashing = (game.dashTimer || 0) > 0;
    // DASH AFTERIMAGE — push a ghost EVERY frame during dash regardless of movement
    // so the trail reads as a clear afterimage, not a sparse one. Tag with `.dash`
    // so the draw layer can render it brighter / cyan.
    const moved = !last || Math.abs(last.x - game.playerX) > 0.5;
    if (dashing || moved) {
      game.playerTrail.unshift({
        x: game.playerX, y: game.playerY,
        age: 0, dual: game.dualFighter,
        dash: dashing
      });
    }
    // ENGINE EXHAUST DUST — stage 70+ atmospheric drift trail behind the ship.
    // Pure visual; tiny gray motes (vy slight) every 4 frames. Suppressed during
    // dash (existing dash trail takes priority).
    if (!dashing && game.stage >= 70 && (game.animFrame & 3) === 0) {
      game.exhaustDust = game.exhaustDust || [];
      game.exhaustDust.push({
        x: game.playerX + (Math.random() * 4 - 2),
        y: game.playerY + 4,
        vy: 0.45 + Math.random() * 0.3,
        life: 0, maxLife: 28 + Math.floor(Math.random() * 10)
      });
      if (game.exhaustDust.length > 24) game.exhaustDust.shift();
    }
  }
  // Tick exhaust dust
  if (game.exhaustDust && game.exhaustDust.length) {
    for (let i = game.exhaustDust.length - 1; i >= 0; i--) {
      const d = game.exhaustDust[i];
      d.life++;
      d.y += d.vy;
      if (d.life >= d.maxLife) game.exhaustDust.splice(i, 1);
    }
  }
  for (const t of game.playerTrail) t.age++;
  // Dash trail allowed to grow longer (8 ghosts vs 4) for richer afterimage
  const cap = game.playerTrail.some(t => t.dash) ? 8 : 4;
  while (game.playerTrail.length > cap) game.playerTrail.pop();
  game.playerTrail = game.playerTrail.filter(t => t.age < 14);
}

// ENGINE EXHAUST DUST — small atmospheric motes drifting behind the ship at
// stage 70+. Drawn before player trail so trail reads on top.
function drawExhaustDust() {
  if (!game.exhaustDust || !game.exhaustDust.length) return;
  ctx.save();
  ctx.fillStyle = '#666';
  for (const d of game.exhaustDust) {
    const ratio = 1 - d.life / d.maxLife;
    ctx.globalAlpha = ratio * 0.5;
    ctx.fillRect(Math.round(d.x), Math.round(d.y), 1, 1);
  }
  ctx.restore();
}
function drawPlayerTrail() {
  // Combo 50+ — rainbow trail cycling through 6 colors
  const rainbow = ['#f44', '#fa0', '#ff4', '#0f8', '#0cf', '#f6f'];
  const useRainbow = (game.combo || 0) >= 50;
  // BIOME-TINTED TRAIL — when a biome is active and player isn't in mega-combo,
  // pick biome color over ship color for trail body ghost. Gives each biome a
  // signature drift trail that fuses ship motion with environment.
  let shipCol = (game.ship && game.ship.color) || '#0cf';
  if (!useRainbow && typeof biomeForStage === 'function') {
    const _bid = biomeForStage(game.stage || 1);
    if (_bid && typeof BIOME_NAMES !== 'undefined' && BIOME_NAMES[_bid]) {
      shipCol = BIOME_NAMES[_bid].col;
    }
  }
  for (let i = game.playerTrail.length - 1; i >= 0; i--) {
    const t = game.playerTrail[i];
    const fade = 1 - t.age / 14;
    ctx.save();
    // DASH afterimage — brighter alpha + bigger ghost (2× wider) + cyan tint
    if (t.dash) {
      ctx.globalAlpha = fade * 0.75;
      ctx.fillStyle = '#0ff';
      if (t.dual) {
        ctx.fillRect(t.x - 10, t.y + 1, 4, 4);
        ctx.fillRect(t.x + 6, t.y + 1, 4, 4);
      } else {
        ctx.fillRect(t.x - 3, t.y - 1, 6, 6);
      }
      // Inner core highlight
      ctx.globalAlpha = fade * 0.95;
      ctx.fillStyle = '#fff';
      if (t.dual) {
        ctx.fillRect(t.x - 9, t.y + 2, 2, 2);
        ctx.fillRect(t.x + 7, t.y + 2, 2, 2);
      } else {
        ctx.fillRect(t.x - 1, t.y, 2, 3);
      }
    } else {
      ctx.globalAlpha = fade * 0.45;
      // Ship body ghost — rainbow cycle when in mega-combo, otherwise loadout color
      ctx.fillStyle = useRainbow
        ? rainbow[(t.age + Math.floor(game.animFrame / 4)) % rainbow.length]
        : shipCol;
      if (t.dual) {
        ctx.fillRect(t.x - 9, t.y + 1, 3, 3);
        ctx.fillRect(t.x + 7, t.y + 1, 3, 3);
      } else {
        ctx.fillRect(t.x - 1, t.y + 1, 3, 3);
      }
      // Engine flame echo
      ctx.fillStyle = '#f80';
      if (t.dual) {
        ctx.fillRect(t.x - 9, t.y + 5, 3, 1);
        ctx.fillRect(t.x + 7, t.y + 5, 3, 1);
      } else {
        ctx.fillRect(t.x - 1, t.y + 5, 3, 1);
      }
    }
    ctx.restore();
  }
}

function updateFormationBreathing() {
  game.breathPhase += 0.02;
  const offX = Math.sin(game.breathPhase) * 3;
  const offY = Math.cos(game.breathPhase * 0.7) * 2;
  let _diveStartCount = 0;
  for (const e of game.enemies) {
    if (e.state === 'formation') {
      e.x = e.homeX + offX + (e.panicOffX || 0);
      e.y = e.homeY + offY + (e.panicOffY || 0);
      // Brief flinch — small jitter when a neighbor was just killed
      if (e.flinch && e.flinch > 0) {
        e.x += (Math.random() - 0.5) * 2;
        e.y += (Math.random() - 0.5) * 2;
        e.flinch--;
      }
      // Pre-dive telegraph countdown — flips to 'diving' when timer hits 0.
      if (e.previewTimer && e.previewTimer > 0) {
        e.previewTimer--;
        if (e.previewTimer <= 0) {
          e.state = 'diving';
          e.diveTimer = 0;
          // DIVE TELEGRAPH FLASH — short red pulse marker over the enemy at the
          // instant it transitions to diving. Helps reading sudden dive starts.
          e.diveFlashTimer = 16;
          // DIVE LAUNCH AFTERIMAGE — push a 25-frame ghost at the home position
          // so the player visually anchors where the diver came from.
          game.diveAfterimages = game.diveAfterimages || [];
          game.diveAfterimages.push({
            x: e.homeX, y: e.homeY, life: 0, maxLife: 25,
            type: e.type, frame: e.frame
          });
          if (game.diveAfterimages.length > 18) game.diveAfterimages.shift();
          e.pathSegments = e.previewPath;
          e.pathSegIndex = 0;
          e.pathProgress = 0;
          e.pathSpeed = 0.012 + game.stage * 0.002;
          e.previewPath = null;
          // DIVE PATH PREVIEW — sample first segment into 14 fading dots so the
          // player can read the dive trajectory before it commits. Stored on the
          // enemy and ticked down each frame in updateEnemies.
          if (e.pathSegments && e.pathSegments[0]) {
            const seg = e.pathSegments[0];
            const dots = [];
            for (let pp = 1; pp <= 14; pp++) {
              const tt = pp / 14;
              const pt = bezierPoint(seg.p0, seg.p1, seg.p2, seg.p3, tt);
              dots.push({ x: pt.x, y: pt.y, t: tt });
            }
            e.divePathDots = dots;
            e.divePathLife = 22;
          }
          _diveStartCount++;
        }
      }
    }
  }
  // SWARM DIVE WARNING — 3+ simultaneous dives in same frame = elevated threat.
  // Rate-limited to once per 180 frames (~3s) so wave-driven cascades don't spam.
  if (_diveStartCount >= 3 && (game.swarmWarnCooldown || 0) <= 0) {
    game.swarmWarnLife = 36;
    game.swarmWarnCooldown = 180;
    playSound('tick');
  }
  if ((game.swarmWarnLife || 0) > 0) game.swarmWarnLife--;
  if ((game.swarmWarnCooldown || 0) > 0) game.swarmWarnCooldown--;
}

function updateEnemies() {
  let anyEntering = false;

  // CRITICAL HP PULSE tick — moved from draw path (Turn 120 had a draw-rate
  // mutation bug that drained the timer 2.4× on 144Hz monitors).
  for (const e of game.enemies) {
    if (e.criticalPulseTimer && e.criticalPulseTimer > 0) e.criticalPulseTimer--;
    if (e.hitFlashTimer && e.hitFlashTimer > 0) e.hitFlashTimer--;
    if (e.divePathLife && e.divePathLife > 0) {
      e.divePathLife--;
      if (e.divePathLife <= 0) { e.divePathDots = null; }
    }
  }

  // LAST STAND ANNOUNCEMENT — one-shot "LAST ONE!" floatText when count crosses
  // from 2 → 1 in PLAYING. Cooled by lastStandAnnounced flag (reset per stage).
  if (game.state === STATE.PLAYING && game.allEntered && !game.lastStandAnnounced) {
    const aliveCount = game.enemies.filter(en => en.alive).length;
    if (aliveCount === 1) {
      game.lastStandAnnounced = true;
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 30, text: 'LAST ONE!',
        color: '#fc4', life: 60, maxLife: 60, size: 10
      });
      playSound('milestone');
      if (typeof pushIntercept === 'function') pushIntercept('lastStand');
    }
  }

  for (const e of game.enemies) {
    if (!e.alive) continue;
    e.frameTimer++;
    if (e.frameTimer > 15) { e.frame++; e.frameTimer = 0; }

    if (e.state === 'entering') {
      anyEntering = true;
      if (e.entryDelay > 0) { e.entryDelay--; continue; }
      // Warp-in flash on the FIRST tick the enemy becomes visible (entryDelay just hit 0)
      if (!e.warpedIn) {
        e.warpedIn = true;
        // Push a small warp ring + 4 sparks behind the enemy
        for (let k = 0; k < 5; k++) {
          const a = (k / 5) * Math.PI * 2;
          game.itemBursts.push({
            x: e.x + Math.cos(a) * 5,
            y: e.y + Math.sin(a) * 5,
            life: -k,
            color: e.type === 'boss' ? '#f6f' : e.type === 'butterfly' ? '#f8a' : '#0ff'
          });
        }
        game.hitSparks.push({ x: e.x, y: e.y, life: 0 });
        // Mini shockwave at warp-in for boss/shielded
        if ((e.type === 'boss' || e.type === 'shielded') && game.shockwaves) {
          game.shockwaves.push({ x: e.x, y: e.y, life: 0, maxLife: 12, maxR: 14, color: '#88f' });
        }
      }
      e.pathProgress += e.pathSpeed;
      if (e.pathProgress >= 1) {
        e.state = 'formation';
        e.x = e.homeX; e.y = e.homeY;
      } else if (e.spiralEntry) {
        // Spiral inward then ease toward home position
        const t = e.pathProgress;
        const cx = BASE_W/2, cy = BASE_H/2 - 20;
        const startR = 90, endR = 12;
        const radius = startR + (endR - startR) * t;
        const turns = 2.0;
        const angle = (e.spiralStartAngle || 0) + (e.spiralDir || 1) * t * Math.PI * 2 * turns;
        const sx = cx + Math.cos(angle) * radius;
        const sy = cy + Math.sin(angle) * radius * 0.65;
        // Smoothly blend into home position over the last 35% of the path
        const k = Math.max(0, Math.min(1, (t - 0.65) / 0.35));
        e.x = sx * (1 - k) + e.homeX * k;
        e.y = sy * (1 - k) + e.homeY * k;
      } else {
        const p = bezierPoint(e.path.p0, e.path.p1, e.path.p2, e.path.p3, e.pathProgress);
        e.x = p.x; e.y = p.y;
      }
    }

    if (e.state === 'diving') {
      // FAST DIVES mutation accelerates dive curve traversal by 1.3×.
      const diveBoost = (game.stageMutation && game.stageMutation.id === 'fastDives') ? 1.3 : 1;
      // LAST STAND — single remaining enemy slows to 0.65× for cinematic finish.
      const lsBoost = (game.state === STATE.PLAYING && game.allEntered
        && game.enemies.filter(en => en.alive).length === 1) ? 0.65 : 1;
      // COMMANDER RAGE — after commander is killed, diving enemies accelerate 1.25× for 360 frames.
      const rageBoost = (game.commanderRageTimer > 0) ? 1.25 : 1;
      if (e.pathSegments) {
        const seg = e.pathSegments[e.pathSegIndex];
        e.pathProgress += e.pathSpeed * diveBoost * lsBoost * rageBoost;
        if (e.pathProgress >= 1) {
          e.pathSegIndex++;
          e.pathProgress = 0;
          if (e.pathSegIndex >= e.pathSegments.length) {
            // Wrap around from bottom
            if (e.y > BASE_H) {
              e.y = -15;
              e.state = 'returning';
              e.path = createEntryPath(e.x, -15, e.homeX, e.homeY, e.x < BASE_W/2 ? 1 : -1);
              e.pathProgress = 0;
            }
          }
        } else {
          const p = bezierPoint(seg.p0, seg.p1, seg.p2, seg.p3, e.pathProgress);
          e.x = p.x; e.y = p.y;
        }
      }
      // ELITE ZIGZAG — elite enemies oscillate ±5px horizontally during dive,
      // making their attack runs distinctly serpentine vs base bezier curve.
      // Seeded by row/col so each elite zigzags out of phase.
      if (e.elite) {
        const _zSeed = (e.row || 0) * 1.3 + (e.col || 0) * 0.7;
        e.x += Math.sin(game.animFrame * 0.18 + _zSeed) * 5;
      }
      // Evasion AI: at stage 8+, occasionally dodge an incoming player bullet
      if (game.stage >= 8 && (e.evadeOffsetX || 0) === 0) {
        for (const b of game.bullets) {
          if (b.y > e.y && b.y - e.y < 22 && Math.abs(b.x - e.x) < 5) {
            if (Math.random() < 0.18) {
              e.evadeOffsetX = (b.x < e.x ? 1 : -1) * 6;
            }
            break;
          }
        }
      }
      if (e.evadeOffsetX) {
        e.x += e.evadeOffsetX;
        e.evadeOffsetX *= 0.92;
        if (Math.abs(e.evadeOffsetX) < 0.1) e.evadeOffsetX = 0;
      }
      // WARPER teleport — purple variant warps to a random nearby x position
      // (±20-50px) every ~120 frames during dive. warpFade ramps 0→1→0 over
      // 24 frames: fade out for 12, swap position at midpoint, fade in 12.
      if (e.type === 'warper') {
        if (!e.warpTimer) e.warpTimer = 60 + Math.floor(Math.random() * 60);
        e.warpTimer--;
        if (e.warpTimer === 12) {
          // Mid-warp: spawn purple flash + 6 spark, swap x position
          for (let _k = 0; _k < 6; _k++) {
            const _a = (_k / 6) * Math.PI * 2;
            game.itemBursts.push({
              x: e.x + Math.cos(_a) * 8,
              y: e.y + Math.sin(_a) * 8,
              life: -_k, color: '#a0f'
            });
          }
          const _dir = Math.random() < 0.5 ? -1 : 1;
          const _dx = (20 + Math.random() * 30) * _dir;
          e.x = Math.max(16, Math.min(BASE_W - 16, e.x + _dx));
          // Path-segment progress invalidated by teleport — snap segment x to new pos
          if (e.pathSegments && e.pathSegments[e.pathSegIndex]) {
            const _seg = e.pathSegments[e.pathSegIndex];
            const _shift = e.x - _seg.p3.x;
            _seg.p2.x += _shift;
            _seg.p3.x += _shift;
          }
        }
        // Fade calculation: 0 at start, 1 at swap, 0 after
        if (e.warpTimer > 12) {
          e.warpFade = 0;
        } else if (e.warpTimer > 0) {
          // 12..0 → 1..0 (fading in after swap)
          e.warpFade = e.warpTimer / 12;
        } else {
          e.warpFade = 0;
          e.warpTimer = 90 + Math.floor(Math.random() * 60);
        }
        // Pre-warp fade (last 12 of timer before swap)
        if (e.warpTimer <= 24 && e.warpTimer > 12) {
          e.warpFade = (24 - e.warpTimer) / 12;
        }
      }
      // Faint dive trail — sparse trailing particles every few frames
      if (e.diveTimer % 4 === 0 && Math.random() < 0.4) {
        const tCol = e.type === 'kamikaze' ? '#f80' : e.type === 'boss' ? '#f8a' : '#cef';
        game.itemBursts.push({
          x: e.x + (Math.random() - 0.5) * 2,
          y: e.y + (Math.random() - 0.5) * 2,
          life: 12, color: tCol
        });
      }
      // Enemy shoots during dive — fires more often at higher stages, but bullet speed is bounded
      // for fairness (no homing trackers — straight aimed shots only).
      e.diveTimer++;
      const shootEvery = Math.max(14, Math.round((42 - Math.floor(game.stage * 1.0)) * diffFireMul()));
      if (e.diveTimer % shootEvery === 0 && game.playerAlive) {
        const dx = game.playerX - e.x, dy = game.playerY - e.y;
        const len = Math.sqrt(dx*dx+dy*dy) || 1;
        // Capped speed: 2.0 baseline + smaller stage scaling, max 3.4
        const spd = Math.min(3.4, 2.0 + game.stage * 0.045) * diffSpeedMul();
        game.enemyBullets.push({
          x: e.x, y: e.y + 4,
          vx: dx / len * spd, vy: dy / len * spd,
          kind: 'dive', fromType: e.type
        });
      }
    }

    if (e.state === 'returning') {
      e.pathProgress += e.pathSpeed * 1.2;
      if (e.pathProgress >= 1) {
        e.state = 'formation';
        e.x = e.homeX; e.y = e.homeY;
      } else {
        const p = bezierPoint(e.path.p0, e.path.p1, e.path.p2, e.path.p3, e.pathProgress);
        e.x = p.x; e.y = p.y;
      }
    }

    if (e.state === 'kamikaze') {
      // Mild homing on x-axis
      if (game.playerAlive) {
        const dx = game.playerX - e.x;
        e.vx += Math.sign(dx) * 0.04;
        e.vx = Math.max(-2, Math.min(2, e.vx));
      }
      e.x += e.vx;
      e.y += e.vy;
      if (e.y > BASE_H + 10) e.alive = false;
    }

    if (e.state === 'minibee') {
      e.x += e.vx;
      e.y += e.vy;
      if (e.y > BASE_H + 10 || e.x < -10 || e.x > BASE_W + 10) e.alive = false;
    }

    if (e.state === 'ufo') {
      e.x += e.vx;
      // Tiny vertical sine wobble for visual life
      e.y += Math.sin((game.animFrame + e.frame * 5) * 0.08) * 0.2;
      if (e.x < -20 || e.x > BASE_W + 20) e.alive = false;
    }

    if (e.state === 'goldenBee') {
      e.zigPhase += 0.12;
      e.x += Math.sin(e.zigPhase) * 1.6;
      e.y += e.vy;
      // Gentle tracking toward player x in last third of descent
      if (e.y > BASE_H * 0.5 && game.playerAlive) {
        const dx = game.playerX - e.x;
        e.x += Math.sign(dx) * 0.08;
      }
      if (e.y > BASE_H + 10) e.alive = false;
    }

    if (e.state === 'hoverer') {
      e.x += e.vx;
      e.sweepPhase += 0.04;
      e.y = 36 + Math.sin(e.sweepPhase) * 4;
      // Bounce off walls
      if (e.x > BASE_W - 12) { e.x = BASE_W - 12; e.vx = -Math.abs(e.vx); }
      if (e.x < 12)          { e.x = 12;          e.vx =  Math.abs(e.vx); }
      // Aimed shots (difficulty-scaled, speed capped)
      e.shootTimer++;
      const shootEvery = Math.max(40, Math.round((100 - game.stage * 1.2) * diffFireMul()));
      if (e.shootTimer >= shootEvery && game.playerAlive) {
        e.shootTimer = 0;
        const dx = game.playerX - e.x, dy = game.playerY - e.y;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        const spd = Math.min(3.2, 1.8 + game.stage * 0.03) * diffSpeedMul();
        game.enemyBullets.push({
          x: e.x, y: e.y + 6,
          vx: dx / len * spd, vy: dy / len * spd,
          kind: 'dive', fromType: e.type
        });
      }
      // Despawn if hovers too long without progress (after 600 frames)
      e.lifeFrames = (e.lifeFrames || 0) + 1;
      if (e.lifeFrames > 600) e.alive = false;
    }

    if (e.state === 'mirror') {
      // Mirror player horizontally with smoothing; bob vertically
      const targetX = BASE_W - game.playerX;
      e.x += (targetX - e.x) * 0.10;
      e.bobPhase += 0.05;
      e.y = 30 + Math.sin(e.bobPhase) * 6;
      // Periodic shot aimed at the player (difficulty-scaled, speed capped)
      e.shootTimer++;
      const shootEvery = Math.max(40, Math.round((110 - game.stage * 1.5) * diffFireMul()));
      if (e.shootTimer >= shootEvery && game.playerAlive) {
        e.shootTimer = 0;
        const dx = game.playerX - e.x, dy = game.playerY - e.y;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        const spd = Math.min(3.2, 1.9 + game.stage * 0.03) * diffSpeedMul();
        game.enemyBullets.push({
          x: e.x, y: e.y + 6,
          vx: dx / len * spd, vy: dy / len * spd,
          kind: 'dive', fromType: e.type
        });
      }
    }

    if (e.state === 'capturing') {
      e.captureTimer++;
      // Boss flies down
      if (e.captureTimer < 60) {
        e.y += 1.5;
      } else if (e.captureTimer < 180) {
        // Tractor beam active — check if player is under
        if (game.playerAlive) {
          const dx = Math.abs(game.playerX - e.x);
          if (dx < 20 && game.playerY > e.y) {
            // Capture the player
            game.playerAlive = false;
            e.capturedShip = true;
            game.capturedShipEnemy = e;
            playSound('capture');
            game.state = STATE.CAPTURED;
            game.capturePhase = 0;
            game.captureTimer = 0;
            // Dim BGM during the capture cutscene for tension
            if (bgmGain) bgmGain.gain.value = bgmEnabled ? 0.5 : 0;
            // Cutscene flair — blue flash + spiral particles being sucked up
            game.flashTimer = 8;
            game.flashColor = '#08f';
            for (let k = 0; k < 12; k++) {
              const angle = (k / 12) * Math.PI * 2;
              const r = 4 + (k % 3) * 4;
              game.itemBursts.push({
                x: game.playerX + Math.cos(angle) * r,
                y: game.playerY + Math.sin(angle) * r,
                life: -k * 2,
                color: k % 2 === 0 ? '#0cf' : '#fff'
              });
            }
            game.shakeTimer = 16;
          }
        }
      } else {
        // Return to formation
        e.state = 'returning';
        e.path = createEntryPath(e.x, e.y, e.homeX, e.homeY, 1);
        e.pathProgress = 0;
      }
    }
  }

  if (!anyEntering && !game.allEntered) {
    game.allEntered = true;
    // FORMATION LOCKED RING — cyan shockwave sweeping across the formation
    // rows the instant all enemies finish entering. Pairs with the existing
    // 'formationSet' INTERCEPT (narrative chatter) for a visual+text cue
    // that signals "set, dive cycle starting".
    if (game.state === STATE.PLAYING && game.shockwaves) {
      game.shockwaves.push({
        x: BASE_W/2, y: 80, life: 0, maxLife: 22, maxR: 80, color: '#0ff'
      });
    }
    // FORMATION COMMANDER — designate one random formation enemy as tactical commander.
    // Only on normal PLAYING stages (not CHALLENGING wave-based, not BOSS_STAGE).
    // Excludes special-spawn types that have their own visual language.
    if (game.state === STATE.PLAYING) {
      const _cmdCandidates = game.enemies.filter(en =>
        en.alive && en.state === 'formation' &&
        en.type !== 'ufo' && en.type !== 'goldenBee' &&
        en.type !== 'minibee' && en.type !== 'hoverer' && !en.elite
      );
      if (_cmdCandidates.length > 0) {
        const _cmd = _cmdCandidates[Math.floor(Math.random() * _cmdCandidates.length)];
        _cmd.isCommander = true;
        _cmd.commanderPulse = 0;
      }
      // Snapshot formation size for morale threshold calculation.
      game.formationMaxCount = game.enemies.filter(en => en.alive).length;
      // SIGNAL INTERCEPT — broadcast formation-set chatter on first locked position
      if (typeof pushIntercept === 'function') pushIntercept('formationSet');
    }
  }

  // Trigger dives
  if (game.allEntered) {
    game.diveTimer++;
    if (game.diveTimer >= game.diveInterval) {
      game.diveTimer = 0;
      // Pick a random formation enemy to dive
      const candidates = game.enemies.filter(e => e.alive && e.state === 'formation');
      if (candidates.length > 0) {
        const e = candidates[Math.floor(Math.random() * candidates.length)];
        // Boss might try to capture
        if (e.type === 'boss' && !e.capturedShip && !game.dualFighter && Math.random() < 0.2 && game.capturedShipEnemy === null) {
          e.state = 'capturing';
          e.captureTimer = 0;
          // If the boss diving is the commander, strip the tag so it doesn't persist during capture.
          if (e.isCommander) e.isCommander = false;
          playSound('captureSiren');
          setTimeout(() => playSound('capture'), 250);
        } else {
          // Telegraph the dive: 30-frame preview where the path is visible but the enemy stays put.
          e.previewTimer = 30;
          e.previewPath = createLoopPath(e.x, e.y, e.x < BASE_W/2 ? 1 : -1);
          playSound('enemyDive');
          // If boss, escorts get a slightly-delayed preview
          if (e.type === 'boss') {
            const escorts = game.enemies.filter(es => es.alive && es.state === 'formation' && es.type === 'butterfly' && Math.abs(es.col - e.col) <= 1 && es.row === 1);
            escorts.slice(0, 2).forEach((es, idx) => {
              setTimeout(() => {
                if (es.alive && es.state === 'formation' && !es.previewTimer) {
                  es.previewTimer = 30;
                  es.previewPath = createLoopPath(es.x, es.y, idx === 0 ? 1 : -1);
                }
              }, 200);
            });
          }
        }
      }
    }
  }

  // Kamikaze spawn (stage 3+, only during normal gameplay after entry)
  if (game.allEntered && game.stage >= 3 && game.playerAlive) {
    game.kamikazeTimer++;
    const interval = Math.max(180, 540 - game.stage * 25);
    if (game.kamikazeTimer >= interval) {
      game.kamikazeTimer = 0;
      const k = {
        type: 'kamikaze',
        alive: true, hp: 1,
        x: 30 + Math.random() * (BASE_W - 60),
        y: -12,
        vx: 0,
        vy: 1.6 + game.stage * 0.08,
        state: 'kamikaze',
        frame: 0, frameTimer: 0
      };
      game.enemies.push(k);
      playSound('enemyDive');
    }
  }

  // UFO bonus spawn (stage 4+, rare)
  if (game.allEntered && game.stage >= 4 && game.playerAlive) {
    game.ufoTimer++;
    const ufoInterval = Math.max(420, 900 - game.stage * 18);
    const alreadyOut = game.enemies.some(e => e.alive && e.type === 'ufo');
    if (!alreadyOut && game.ufoTimer >= ufoInterval && Math.random() < 0.6) {
      game.ufoTimer = 0;
      const fromLeft = Math.random() < 0.5;
      game.enemies.push({
        type: 'ufo',
        alive: true, hp: 1,
        x: fromLeft ? -14 : BASE_W + 14,
        y: 22 + Math.random() * 18,
        vx: (fromLeft ? 1 : -1) * (1.6 + game.stage * 0.04),
        vy: 0,
        state: 'ufo',
        frame: 0, frameTimer: 0
      });
      // RARE SPAWN ALERT — let the player know to chase the UFO
      game.rareSpawnAlertLife = 90;
      game.rareSpawnAlertText = '! UFO !';
      game.rareSpawnAlertColor = '#0ef';
      // SIGNAL INTERCEPT — scout vessel chatter
      if (typeof pushIntercept === 'function') pushIntercept('ufoSpotted');
    }
  }

  // Golden bee bonus spawn (stage 6+, rarer than UFO, zig-zags down from top)
  if (game.allEntered && game.stage >= 6 && game.playerAlive) {
    game.goldenBeeTimer++;
    const gbInterval = Math.max(720, 1500 - game.stage * 24);
    const alreadyOut = game.enemies.some(e => e.alive && e.type === 'goldenBee');
    if (!alreadyOut && game.goldenBeeTimer >= gbInterval && Math.random() < 0.35) {
      game.goldenBeeTimer = 0;
      game.enemies.push({
        type: 'goldenBee',
        alive: true, hp: 1,
        x: 30 + Math.random() * (BASE_W - 60),
        y: -10,
        vx: 0, vy: 1.0 + game.stage * 0.03,
        state: 'goldenBee',
        zigPhase: Math.random() * Math.PI * 2,
        frame: 0, frameTimer: 0
      });
      // RARE SPAWN ALERT — golden bee is even rarer, brighter alert
      game.rareSpawnAlertLife = 120;
      game.rareSpawnAlertText = '★ GOLDEN BEE ★';
      game.rareSpawnAlertColor = '#fc4';
      // SIGNAL INTERCEPT — high-value cargo chatter
      if (typeof pushIntercept === 'function') pushIntercept('goldenSpotted');
    }
  }

  // Boomerang hover (stage 11+) — helicopter that sweeps left-right firing aimed shots
  if (game.allEntered && game.stage >= 11 && game.playerAlive) {
    game.hovererTimer++;
    const hInterval = Math.max(660, 1320 - game.stage * 22);
    const alreadyOut = game.enemies.some(e => e.alive && e.type === 'hoverer');
    if (!alreadyOut && game.hovererTimer >= hInterval && Math.random() < 0.32) {
      game.hovererTimer = 0;
      const fromLeft = Math.random() < 0.5;
      game.enemies.push({
        type: 'hoverer',
        alive: true, hp: 2,
        x: fromLeft ? -14 : BASE_W + 14,
        y: 36,
        vx: (fromLeft ? 1 : -1) * (1.0 + game.stage * 0.025),
        vy: 0,
        state: 'hoverer',
        sweepPhase: 0,
        shootTimer: 0,
        frame: 0, frameTimer: 0
      });
    }
  }

  // Mirror clone (stage 13+) — ghosts a mirrored copy of the player at fixed altitude
  if (game.allEntered && game.stage >= 13 && game.playerAlive) {
    game.mirrorTimer++;
    const mInterval = Math.max(540, 1200 - game.stage * 20);
    const alreadyOut = game.enemies.some(e => e.alive && e.type === 'mirror');
    if (!alreadyOut && game.mirrorTimer >= mInterval && Math.random() < 0.30) {
      game.mirrorTimer = 0;
      game.enemies.push({
        type: 'mirror',
        alive: true, hp: 2,
        x: BASE_W - game.playerX, y: 30,
        vx: 0, vy: 0,
        state: 'mirror',
        shootTimer: 0,
        bobPhase: 0,
        frame: 0, frameTimer: 0
      });
    }
  }
}

function updateChallengeEnemies() {
  const wave = game.challengeWaves[game.challengeWaveIdx];
  if (!wave) return;

  for (const e of wave) {
    if (!e.alive) continue;
    e.frameTimer = (e.frameTimer || 0) + 1;
    if (e.frameTimer > 15) { e.frame++; e.frameTimer = 0; }

    e.x += e.vx;
    e.y += e.vy;

    if (e.pattern === 'top_down') {
      // Sine oscillation on x axis; movement is vertical
      e.sinPhase += 0.05;
      e.x = e.baseX + Math.sin(e.sinPhase) * e.sinAmp;
      if (e.y >= BASE_H + 20) { e.alive = false; e.escaped = true; }
    } else if (e.pattern === 'diagonal') {
      // Straight diagonal — no sine; exit on any far edge or bottom
      if (e.x <= -30 || e.x >= BASE_W + 30 || e.y >= BASE_H + 30) { e.alive = false; e.escaped = true; }
    } else {
      // Horizontal patterns (sweep_lr, sweep_rl, pincer, double_row)
      e.sinPhase += 0.05;
      e.y = e.baseY + Math.sin(e.sinPhase) * e.sinAmp;
      if (e.x <= -20 || e.x >= BASE_W + 20) { e.alive = false; e.escaped = true; }
    }
  }

  if (wave.every(e => !e.alive)) {
    // CHALLENGE QUICK CLEAR — bonus when the wave was cleared inside 6 seconds
    // (360 frames). Tracks wave-start frame so cumulative elapsed is measured
    // per wave, not per stage. Pure additive bonus, capped by 8 waves/stage.
    if (game.state === STATE.CHALLENGING && typeof game.challengeWaveStartFrame === 'number') {
      const waveElapsed = game.stageFrames - game.challengeWaveStartFrame;
      if (waveElapsed <= 360 && waveElapsed > 0) {
        addScore(250);
        game.floatTexts.push({
          x: BASE_W/2, y: BASE_H/2 - 24, text: 'QUICK CLEAR +250',
          color: '#0ff', life: 50, maxLife: 50, size: 7
        });
        playSound('powerUp');
      }
    }
    // PERFECT WAVE — every enemy killed (none escaped). Gold banner + SFX.
    const _anyEscaped = wave.some(e => e.escaped);
    if (!_anyEscaped) {
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 + 18,
        text: 'PERFECT WAVE!',
        color: '#fc4', life: 60, maxLife: 60, size: 8, glow: 5
      });
      game.perfectWavesRun = (game.perfectWavesRun || 0) + 1;
      game.stagePerfectWaves = (game.stagePerfectWaves || 0) + 1;
      if (typeof playSound === 'function') playSound('milestone');
      // RUN PERFECT WAVE MILESTONES — gold banner at 5/10/20 lifetime-of-run
      if (game.perfectWavesRun === 5 || game.perfectWavesRun === 10 || game.perfectWavesRun === 20) {
        game.floatTexts.push({
          x: BASE_W/2, y: BASE_H/2 - 18,
          text: 'PERFECT WAVES x' + game.perfectWavesRun,
          color: '#fc4', life: 90, maxLife: 90, size: 9
        });
        if (typeof spawnConfetti === 'function') spawnConfetti(10);
      }
      // ALL-PERFECT STAGE BANNER — all waves in this stage perfect (final wave).
      if (game.challengeWaves
          && (game.challengeWaveIdx + 1) === game.challengeWaves.length
          && game.stagePerfectWaves === game.challengeWaves.length) {
        game.floatTexts.push({
          x: BASE_W/2, y: BASE_H/2 + 8,
          text: 'ALL-PERFECT STAGE!',
          color: '#fc4', life: 110, maxLife: 110, size: 11, glow: 7
        });
        if (typeof spawnConfetti === 'function') spawnConfetti(20);
        game.flashTimer = Math.max(game.flashTimer || 0, 10);
        game.flashColor = '#fc4';
        game.allPerfectStagesRun = (game.allPerfectStagesRun || 0) + 1;
      }
    } else {
      game.stagePerfectWaves = 0; // any escape breaks all-perfect streak
    }
    // WAVE CLEAR FEEDBACK — short tick on every wave clear (not just quick ones)
    // so the player gets immediate auditory confirmation. Skip on the FINAL wave
    // (about to transition to stage clear, which has its own fanfare).
    const isFinalWave = (game.challengeWaveIdx + 1) >= (game.challengeWaves ? game.challengeWaves.length : 0);
    if (!isFinalWave) {
      playSound('tick');
      // Small "+1" wave count pip near top
      game.floatTexts.push({
        x: BASE_W - 18, y: 36, text: '+1',
        color: '#f6f', life: 30, maxLife: 30, size: 5
      });
      // WAVE TRANSITION SHOCKWAVE — magenta expanding ring from center for a
      // cinematic between-wave beat. Skipped on final wave (stage clear fanfare).
      if (game.shockwaves) {
        game.shockwaves.push({
          x: BASE_W/2, y: BASE_H/2,
          life: 0, maxLife: 18, maxR: 100, color: '#f6f'
        });
      }
    }
    // Record clear flash + perfect flag for Wave Tactical HUD dot animation
    const _clearedDotIdx = game.challengeWaveIdx;
    if (!game.waveClrFlash)   game.waveClrFlash   = new Array(8).fill(0);
    if (!game.waveClrPerfect) game.waveClrPerfect = new Array(8).fill(false);
    if (_clearedDotIdx < 8) {
      game.waveClrFlash[_clearedDotIdx]   = 22;
      game.waveClrPerfect[_clearedDotIdx] = !_anyEscaped;
    }
    game.challengeWaveIdx++;
    game.challengeWaveStartFrame = game.stageFrames; // mark start of next wave
    game.challengeWaveTimer = 35; // brief telegraph window between waves
    // FINAL WAVE BANNER — when the NEXT wave is the last one, surface a clear
    // "FINAL WAVE!" callout so the player knows the stage closes after it.
    if (game.challengeWaves
        && (game.challengeWaveIdx + 1) === game.challengeWaves.length) {
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 30, text: 'FINAL WAVE!',
        color: '#f6f', life: 70, maxLife: 70, size: 10
      });
    }
  }
  // Tick wave-clear flash timers for the Wave Tactical HUD dot animation
  if (game.waveClrFlash) {
    for (let _wi = 0; _wi < game.waveClrFlash.length; _wi++) {
      if (game.waveClrFlash[_wi] > 0) game.waveClrFlash[_wi]--;
    }
  }
}

function updateCollisions() {
  const enemies = game.state === STATE.CHALLENGING
    ? (game.challengeWaves[game.challengeWaveIdx] || [])
    : game.enemies;

  // SHOOTING STAR WISH — player bullets can hit a wish-variant shooting star for
  // +100 score, gold confetti, and a celebratory floatText. Single-hit consumes
  // the star (splice). Skipped for laser to avoid auto-vacuuming wishes on touch.
  if (game.shootingStars) {
    for (let bi = game.bullets.length - 1; bi >= 0; bi--) {
      const b = game.bullets[bi];
      if (b.kind === 'laser') continue;
      for (let si = game.shootingStars.length - 1; si >= 0; si--) {
        const ss = game.shootingStars[si];
        if (!ss.wish) continue;
        if (Math.abs(b.x - ss.x) < 6 && Math.abs(b.y - ss.y) < 6) {
          addScore(100);
          try {
            const wt = parseInt(localStorage.getItem('galagaWishCount') || '0', 10) || 0;
            const nw = wt + 1;
            localStorage.setItem('galagaWishCount', String(nw));
            if (nw >= 10) unlockAchievement('wishHunter');
          } catch (e) {}
          game.shootingStars.splice(si, 1);
          game.bullets.splice(bi, 1);
          game.floatTexts.push({
            x: ss.x, y: ss.y - 6, text: 'WISH +100',
            color: '#fc4', life: 50, maxLife: 50, size: 7
          });
          // Gold sparkle ring
          for (let k = 0; k < 8; k++) {
            const a = (k / 8) * Math.PI * 2;
            game.itemBursts.push({
              x: ss.x + Math.cos(a) * 4,
              y: ss.y + Math.sin(a) * 4,
              life: -k, color: '#fc4'
            });
          }
          playSound('powerUp');
          break;
        }
      }
    }
  }

  // Player bullets vs enemies
  for (let bi = game.bullets.length - 1; bi >= 0; bi--) {
    const b = game.bullets[bi];
    const isLaser = b.kind === 'laser';
    for (const e of enemies) {
      if (!e.alive) continue;
      // Laser pierces — skip enemies it has already damaged this run so a beam doesn't
      // re-tick the same target every frame while passing through.
      if (isLaser && b.pierced && b.pierced.has(e)) continue;
      const dx = Math.abs(b.x - e.x), dy = Math.abs(b.y - e.y);
      if (dx < 8 && dy < 8) {
        if (isLaser) { b.pierced.add(e); }
        else { game.bullets.splice(bi, 1); }
        game.stats.shotsHit++;
        game.stageShotsHit++;
        // PARRY ECHO HIT — reflected enemy projectile (from PERFECT PARRY) landed
        // on a target. Cyan ring + 'ECHO' floattext + graze SFX. Visual reward
        // for the parry → echo → land skill chain. No score inflation, no combo
        // bump (kill below already handles combo for kill case).
        if (b._parryEcho) {
          game.parryEchoLandings = (game.parryEchoLandings || 0) + 1;
          game.floatTexts.push({
            x: e.x, y: e.y - 10, text: 'ECHO',
            color: '#0ff', life: 30, maxLife: 30, size: 6
          });
          if (game.shockwaves) {
            game.shockwaves.push({
              x: e.x, y: e.y, life: 0, maxLife: 16, maxR: 12, color: '#0ff'
            });
          }
          if (typeof playSound === 'function') playSound('graze');
        }
        const _prevHp = e.hp;
        e.hp -= b.dmg || 1;
        // CRITICAL HP PULSE — when an enemy drops to hp 1 (one hit from death),
        // start a 16-frame red pulse on the sprite. Skipped on instant kills.
        if (e.hp === 1 && _prevHp > 1) {
          e.criticalPulseTimer = 16;
        }
        // ENEMY HIT FLASH — 4-frame white tint on non-fatal hit. Reads as
        // "I damaged it" without needing to read sparks. Only meaningful when
        // enemy still alive (skipped on kill — explosion takes over).
        if (e.hp > 0) e.hitFlashTimer = 4;
        // FORMATION DAMAGE NUMBERS — show "-N" floatText for non-fatal hits on
        // multi-HP enemies (shielded, elite). Single-HP enemies get score text on
        // kill instead. Color escalates with damage; crit hits flash red.
        if (e.hp > 0 && e.maxHp > 1) {
          const _dn = b.dmg || 1;
          const _dCol = b.crit ? '#f44' : _dn >= 3 ? '#fc4' : _dn >= 2 ? '#0ff' : '#fff';
          game.floatTexts.push({
            x: e.x + (Math.random() * 4 - 2),
            y: e.y - 8,
            text: '-' + _dn,
            color: _dCol, life: 24, maxLife: 24, size: 4
          });
        }
        // CRIT NON-KILL FLAIR — even if crit didn't finish the enemy, mark
        // the moment with a small gold spark trio + 'CRIT' text so the player
        // sees the +50% damage land. Kill-crit cinematic stays untouched below.
        if (b.crit && e.hp > 0) {
          for (let k = 0; k < 3; k++) {
            const _a = (k / 3) * Math.PI * 2 + Math.random() * 0.5;
            game.itemBursts.push({
              x: e.x + Math.cos(_a) * 5,
              y: e.y + Math.sin(_a) * 5,
              life: -k, color: '#fc4'
            });
          }
          game.floatTexts.push({
            x: e.x, y: e.y - 10, text: 'CRIT',
            color: '#fc4', life: 28, maxLife: 28, size: 5
          });
        }
        // GHOST REVEAL — first hit on a ghost variant reveals it (full alpha).
        // Cinematic beat: purple shockwave + 'REVEALED' floattext + graze SFX
        // so the rare stage 60+ stealth encounter reads as a real moment, not
        // a silent alpha bump.
        if (e.ghost && !e.ghostRevealed) {
          e.ghostRevealed = true;
          if (game.shockwaves) {
            game.shockwaves.push({
              x: e.x, y: e.y, life: 0, maxLife: 18, maxR: 14, color: '#a8f'
            });
          }
          game.floatTexts.push({
            x: e.x, y: e.y - 10, text: 'REVEALED',
            color: '#a8f', life: 32, maxLife: 32, size: 5
          });
          if (typeof playSound === 'function') playSound('graze');
        }
        // Shield-break feedback (only when not killed in same hit)
        if (e.hp > 0 && e.type === 'shielded' && !e.shieldBroken) {
          e.shieldBroken = true;
          for (let s = 0; s < 6; s++) {
            game.hitSparks.push({x: e.x + (Math.random()-0.5)*10, y: e.y + (Math.random()-0.5)*8, life: -s});
          }
          playSound('crit');
        }
        if (e.hp <= 0) {
          e.alive = false;
          // CRIT KILL CINEMATIC — when a crit bullet lands the killing blow,
          // award gold sparkle ring + 'CRIT KILL!' text + persistent counter.
          if (b.crit) {
            for (let k = 0; k < 8; k++) {
              const a = (k / 8) * Math.PI * 2;
              game.itemBursts.push({
                x: e.x + Math.cos(a) * 6,
                y: e.y + Math.sin(a) * 6,
                life: -k, color: '#fc4'
              });
            }
            game.floatTexts.push({
              x: e.x, y: e.y - 14, text: 'CRIT KILL!',
              color: '#fc4', life: 42, maxLife: 42, size: 7
            });
            try {
              const ck = parseInt(localStorage.getItem('galagaCritKills') || '0', 10) || 0;
              localStorage.setItem('galagaCritKills', String(ck + 1));
            } catch (e) {}
            // Session counter for intro peek
            game.critKillsRun = (game.critKillsRun || 0) + 1;
          }
          game.stats.kills++;
          game.stageKills = (game.stageKills || 0) + 1;
          // SIGNAL INTERCEPT — first kill of the run triggers enemy first-contact chatter
          if (game.stats.kills === 1 && typeof pushIntercept === 'function') {
            pushIntercept('firstBlood');
          }
          // SIGNAL INTERCEPT — 100 kill milestone — adversary attrition warning
          if (game.stats.kills === 100 && typeof pushIntercept === 'function') {
            pushIntercept('killMaster');
          }
          // SIGNAL INTERCEPT — 500 kill milestone — extinction-level threat
          if (game.stats.kills === 500 && typeof pushIntercept === 'function') {
            pushIntercept('extinction');
          }
          // SAME-TYPE KILL STREAK — track consecutive kills of same enemy type
          if (game._lastKillType === e.type) {
            game._sameTypeStreak = (game._sameTypeStreak || 1) + 1;
          } else {
            game._sameTypeStreak = 1;
