function drawTractorBeam(x, y, h) {
  ctx.save();
  const t = performance.now() / 50;
  ctx.globalAlpha = 0.5 + Math.sin(t) * 0.25;
  const grad = ctx.createLinearGradient(x, y, x, y + h);
  grad.addColorStop(0, 'rgba(0,150,255,0.85)');
  grad.addColorStop(0.5, 'rgba(140,210,255,0.55)');
  grad.addColorStop(1, 'rgba(0,100,255,0.18)');
  ctx.fillStyle = grad;
  const w1 = 8, w2 = 30;
  ctx.beginPath();
  ctx.moveTo(x - w1, y);
  ctx.lineTo(x + w1, y);
  ctx.lineTo(x + w2, y + h);
  ctx.lineTo(x - w2, y + h);
  ctx.closePath();
  ctx.fill();
  // Animated downward energy bands (crossing lines that scroll)
  ctx.strokeStyle = 'rgba(140,220,255,0.45)';
  ctx.lineWidth = 1;
  const off = (t * 3) % 8;
  for (let i = -8 + off; i < h; i += 8) {
    const tt = Math.max(0, Math.min(1, i / h));
    const w = w1 + (w2 - w1) * tt;
    ctx.beginPath(); ctx.moveTo(x - w, y + i); ctx.lineTo(x + w, y + i); ctx.stroke();
  }
  // Sparkle particles drifting upward (suction visualization)
  ctx.fillStyle = '#fff';
  for (let s = 0; s < 5; s++) {
    const phase = (t * 12 + s * 23) % 100;
    const tt = phase / 100;
    const w = w1 + (w2 - w1) * tt;
    const sx = x + (Math.sin(s * 1.7 + t * 0.3) * 0.85) * w;
    const sy = y + h - tt * h;
    ctx.fillRect(Math.round(sx), Math.round(sy), 1, 1);
  }
  ctx.restore();
}

function drawExplosion(x, y, t, maxT) {
  if (t < 0) return; // delayed-spawn explosion not yet active
  const progress = t / maxT;
  const r = 4 + progress * 14;
  ctx.save(); ctx.translate(x, y);
  // EXPLOSION BIOME TINT — splice biome color into the palette at stage 8+.
  // Subtle: replaces ONE of the 4 base hues per biome so identity shifts but
  // the white/yellow/orange core still reads as 'fire'.
  let colors = ['#fff', '#ff0', '#f80', '#f00'];
  if (game && typeof biomeForStage === 'function') {
    const _bid = biomeForStage(game.stage);
    if (_bid && BIOME_NAMES[_bid]) {
      colors = ['#fff', '#ff0', BIOME_NAMES[_bid].col, '#f00'];
    }
  }
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + progress * 2;
    const d = r * (0.5 + Math.random() * 0.5);
    const px = Math.cos(a) * d;
    const py = Math.sin(a) * d;
    const s = 2 * (1 - progress);
    ctx.fillStyle = colors[i % colors.length];
    ctx.globalAlpha = 1 - progress;
    ctx.fillRect(px - s/2, py - s/2, s, s);
  }
  ctx.restore();
}

function drawStar(s) {
  // Far stars twinkle less, near stars more
  const twinkleAmp = s.layer === 'far' ? 0.15 : s.layer === 'mid' ? 0.25 : 0.35;
  const flick = (1 - twinkleAmp) + twinkleAmp * Math.sin(s.twinklePhase);
  const a = s.brightness * flick;
  ctx.globalAlpha = a;
  // WITCH STAR HUE SHIFT — when witch slow is active, stars shift to cool blue
  // for a "time stopped" atmospheric beat. Overrides the layer color briefly.
  const _witchActive = game && (game.witchTimer || 0) > 0;
  // Far stars get a cooler tint to convey depth (witch overrides with deep cyan)
  ctx.fillStyle = _witchActive ? '#5cf' : (s.layer === 'far' ? '#9ac' : s.color);
  ctx.fillRect(s.x, s.y, 1, 1);
  // BIOME STARFIELD TINT — near-layer stars overlay a faint biome color so the
  // sky cohesion shifts with biome (ice = cool blue stars, corona = warm, etc.).
  // Subtle: ~22% alpha additional fill on top of the base star pixel.
  if (s.layer === 'near' && game && typeof biomeForStage === 'function') {
    const _bid = biomeForStage(game.stage);
    if (_bid && BIOME_NAMES[_bid]) {
      ctx.globalAlpha = a * 0.22;
      ctx.fillStyle = BIOME_NAMES[_bid].col;
      ctx.fillRect(s.x, s.y, 1, 1);
      ctx.globalAlpha = a;
    }
  }
  // HYPERSPACE STARS — near-layer stars get vertical trail at deep stages (30+).
  // Tier 1 (30-49): 1px tail / Tier 2 (50-69): 2px / Tier 3 (70+): 3px hyperspace.
  // Active only during gameplay states (TITLE / STAGE_INTRO stay clean).
  if (s.layer === 'near' && game && game.stage >= 30
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    const tailLen = game.stage >= 70 ? 3 : game.stage >= 50 ? 2 : 1;
    for (let t = 1; t <= tailLen; t++) {
      ctx.globalAlpha = a * (1 - t / (tailLen + 1)) * 0.7;
      ctx.fillRect(s.x, s.y - t, 1, 1);
    }
    ctx.globalAlpha = a;
  }
  if (s.big) {
    if (flick > 0.92) {
      ctx.globalAlpha = a * 0.6;
      ctx.fillStyle = s.color;
      ctx.fillRect(s.x - 1, s.y, 1, 1);
      ctx.fillRect(s.x + 1, s.y, 1, 1);
      ctx.fillRect(s.x, s.y - 1, 1, 1);
      ctx.fillRect(s.x, s.y + 1, 1, 1);
    }
  }
  ctx.globalAlpha = 1;
}

// Stage-tier backdrop — subtle gradient + nebula blobs that change every ~4 stages
const TIER_PALETTES = [
  null,                                                        // 0: stages 1-3, plain space
  { tint: 'rgba(60,20,90,0.18)', neb: ['#502080', '#6030a0'] },   // 1: stages 4-7, purple
  { tint: 'rgba(20,40,90,0.18)', neb: ['#204090', '#3060c0'] },   // 2: stages 8-11, blue
  { tint: 'rgba(90,20,40,0.18)', neb: ['#80205a', '#a03060'] },   // 3: stages 12-15, crimson
  { tint: 'rgba(60,80,20,0.18)', neb: ['#406030', '#608040'] },   // 4: stages 16-19, golden green
  { tint: 'rgba(15,60,75,0.20)', neb: ['#206080', '#3090a0'] },   // 5: stages 20-23, deep teal (abyss)
  { tint: 'rgba(80,20,80,0.20)', neb: ['#a040a0', '#c060c0'] },   // 6: stages 24-27, fuchsia (cosmic storm)
  { tint: 'rgba(80,40,15,0.20)', neb: ['#a05020', '#c07030'] },   // 7: stages 28-31, ember (volcanic)
  { tint: 'rgba(20,20,30,0.30)', neb: ['#404060', '#202030'] },   // 8: stages 32-35, void (deep dark)
  { tint: 'rgba(60,30,80,0.22)', neb: ['#a0408c', '#6060c0'] }    // 9: stages 36+, twilight apex
];
function drawStageTierBackground() {
  if (!game) return;
  const tier = Math.min(TIER_PALETTES.length - 1, Math.floor((game.stage - 1) / 4));
  const p = TIER_PALETTES[tier];
  // STAGE TYPE TINT — applied independently of TIER palette so even early CHALLENGING
  // stages (stage 4, tier=0=null) get type-specific tint. Subtle red/pink wash.
  if (game.state === STATE.BOSS_STAGE) {
    const entryBoost = game.stageFrames < 60 ? (1 - game.stageFrames / 60) * 0.10 : 0;
    ctx.save();
    ctx.globalAlpha = 0.08 + entryBoost;
    ctx.fillStyle = '#a00';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
    ctx.restore();
  } else if (game.state === STATE.CHALLENGING) {
    const entryBoost = game.stageFrames < 60 ? (1 - game.stageFrames / 60) * 0.08 : 0;
    ctx.save();
    ctx.globalAlpha = 0.06 + entryBoost;
    ctx.fillStyle = '#a0a';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
    ctx.restore();
  }
  if (!p) return;
  // Wash tint over playfield
  ctx.fillStyle = p.tint;
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  // Two slowly drifting nebula blobs
  const t = game.animFrame;
  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = p.neb[0];
  const x1 = (t * 0.05) % (BASE_W + 80) - 40;
  ctx.fillRect(x1, 40, 50, 30);
  ctx.fillRect(x1 + 10, 30, 30, 12);
  ctx.fillRect(x1 - 8, 55, 30, 14);
  ctx.fillStyle = p.neb[1];
  const x2 = (BASE_W - (t * 0.04) % (BASE_W + 80));
  ctx.fillRect(x2, 150, 40, 24);
  ctx.fillRect(x2 + 4, 142, 24, 10);
  ctx.fillRect(x2 - 6, 168, 24, 10);
  ctx.restore();
}

// Pixel arrow glyphs (anchored from a single point)
function drawArrowR(x, y) {
  ctx.fillRect(x, y - 2, 4, 5);
  ctx.fillRect(x + 4, y - 1, 2, 3);
  ctx.fillRect(x + 6, y, 1, 1);
}
function drawArrowL(x, y) {
  ctx.fillRect(x + 3, y - 2, 4, 5);
  ctx.fillRect(x + 1, y - 1, 2, 3);
  ctx.fillRect(x, y, 1, 1);
}
function drawArrowD(x, y) {
  ctx.fillRect(x - 2, y, 5, 4);
  ctx.fillRect(x - 1, y + 4, 3, 2);
  ctx.fillRect(x, y + 6, 1, 1);
}

// Direction-of-entry telegraph for challenge stages
function drawChallengeTelegraph() {
  if (game.state !== STATE.CHALLENGING) return;
  if (game.challengeWaveTimer <= 0) return;
  const nextWave = game.challengeWaves[game.challengeWaveIdx];
  if (!nextWave || nextWave.length === 0) return;
  const pattern = nextWave[0].pattern;
  // Slide the arrow horizontally for animation
  const slide = (game.animFrame % 16) - 8;
  const yPulse = 0.6 + 0.4 * Math.sin(game.animFrame * 0.3);
  ctx.save();
  ctx.globalAlpha = yPulse;
  ctx.fillStyle = '#ff4';
  if (pattern === 'sweep_lr' || pattern === 'double_row') {
    drawArrowR(2 + slide / 4, BASE_H/2);
    drawArrowR(2 + slide / 4, BASE_H/2 + 30);
  } else if (pattern === 'sweep_rl') {
    drawArrowL(BASE_W - 9 - slide / 4, BASE_H/2);
    drawArrowL(BASE_W - 9 - slide / 4, BASE_H/2 + 30);
  } else if (pattern === 'pincer') {
    drawArrowR(2 + slide / 4, BASE_H/2);
    drawArrowL(BASE_W - 9 - slide / 4, BASE_H/2);
  } else if (pattern === 'top_down') {
    drawArrowD(BASE_W/4, 26 + slide / 4);
    drawArrowD(BASE_W/2, 26 + slide / 4);
    drawArrowD(BASE_W * 3/4, 26 + slide / 4);
  } else if (pattern === 'diagonal') {
    drawArrowR(2 + slide / 4, BASE_H/3);
    drawArrowL(BASE_W - 9 - slide / 4, BASE_H/3);
  }
  ctx.restore();
}

function drawShootingStar(ss) {
  const lifeRatio = ss.life / ss.maxLife;
  ctx.save();
  // WISH variant — gold trail + larger pulsing head. Player can shoot it for bonus.
  const headCol = ss.wish ? '#fc4' : '#fff';
  const trailHotCol = ss.wish ? '#ff8' : '#fff';
  const trailColdCol = ss.wish ? '#fa0' : '#cef';
  // Trail
  for (let i = 0; i < 6; i++) {
    ctx.globalAlpha = (1 - lifeRatio) * (1 - i / 6) * 0.9;
    ctx.fillStyle = i < 2 ? trailHotCol : trailColdCol;
    const tx = ss.x - ss.vx * i * 1.5;
    const ty = ss.y - ss.vy * i * 1.5;
    ctx.fillRect(tx, ty, 1, 1);
  }
  // Bright head — wish variant gets a pulsing 3×3 outline for visibility
  ctx.globalAlpha = 1 - lifeRatio;
  ctx.fillStyle = headCol;
  ctx.fillRect(ss.x, ss.y, 2, 2);
  if (ss.wish) {
    const pulse = 0.4 + 0.6 * Math.abs(Math.sin((game && game.animFrame || 0) * 0.4));
    ctx.globalAlpha = (1 - lifeRatio) * pulse;
    ctx.fillStyle = '#fff';
    ctx.fillRect(ss.x - 1, ss.y - 1, 1, 1);
    ctx.fillRect(ss.x + 2, ss.y - 1, 1, 1);
    ctx.fillRect(ss.x - 1, ss.y + 2, 1, 1);
    ctx.fillRect(ss.x + 2, ss.y + 2, 1, 1);
  }
  ctx.restore();
}

// Power-up pickup burst — expanding ring + sparkle
function drawItemBurst(b) {
  const max = 24;
  const p = b.life / max;
  const r = 2 + p * 14;
  ctx.save();
  ctx.globalAlpha = 1 - p;
  // Outer ring
  ctx.fillStyle = b.color;
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2;
    ctx.fillRect(b.x + Math.cos(a) * r - 1, b.y + Math.sin(a) * r - 1, 2, 2);
  }
  // Inner ring (offset, white)
  ctx.globalAlpha = (1 - p) * 0.7;
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + Math.PI / 6;
    const ir = r * 0.55;
    ctx.fillRect(b.x + Math.cos(a) * ir, b.y + Math.sin(a) * ir, 1, 1);
  }
  ctx.restore();
}

// Floating pickup text (rises and fades)
function drawFloatText(ft) {
  ctx.save();
  ctx.globalAlpha = Math.min(1, ft.life / 25);
  // Optional count-up: text rebuilt each frame from countTo (interpolated from 0 over countDuration)
  let txt = ft.text;
  if (typeof ft.countTo === 'number') {
    const dur = ft.countDuration || 30;
    const elapsed = (ft.maxLife || dur) - ft.life;
    const t = Math.max(0, Math.min(1, elapsed / dur));
    const v = Math.round(ft.countTo * t);
    txt = (ft.prefix || '') + v + (ft.suffix || '');
  }
  drawRetroText(txt, ft.x, ft.y, ft.size || 7, ft.color);
  ctx.restore();
}

// Bullet impact spark — radial pop of 6 particles
function drawHitSpark(s) {
  if (s.life < 0) return;
  const max = 12;
  const p = s.life / max;
  const r = p * 8;
  ctx.save();
  ctx.globalAlpha = 1 - p;
  // BIOME SPARK GLOW — when a biome is active, replace one of the 6 ray colors
  // (every 3rd) with biome col so each spark carries environment hint without
  // losing the yellow/white core identity.
  let _bsCol = null;
  if (game && typeof biomeForStage === 'function') {
    const _bid = biomeForStage(game.stage || 1);
    if (_bid && BIOME_NAMES && BIOME_NAMES[_bid]) _bsCol = BIOME_NAMES[_bid].col;
  }
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + s.life * 0.05;
    const px = Math.cos(a) * r;
    const py = Math.sin(a) * r;
    ctx.fillStyle = (_bsCol && i % 3 === 0) ? _bsCol : (i % 2 === 0 ? '#ff4' : '#fff');
    const sz = 2 - p * 1.5;
    ctx.fillRect(s.x + px - sz / 2, s.y + py - sz / 2, sz, sz);
  }
  // Bright center flash (first 4 frames)
  if (s.life < 4) {
    ctx.globalAlpha = 1 - s.life / 4;
    ctx.fillStyle = '#fff';
    ctx.fillRect(s.x - 2, s.y - 2, 4, 4);
  }
  ctx.restore();
}

// GAM-42: Bullet transformation — 3 visual tiers keyed to P (Power) level
function drawPlayerBullet(x, y, lvl, kind) {
  // LASER bullets — bright vertical beam segment with pulsing white core + outer glow.
  // Drawn as a 3-layer stack: outer halo (cyan), mid (white-blue), core (white).
  if (kind === 'laser') {
    ctx.save();
    const pulse = 0.7 + 0.3 * Math.sin(game.animFrame * 0.6);
    ctx.globalAlpha = 0.35 * pulse;
    ctx.fillStyle = '#0ff';
    ctx.fillRect(x - 3, y - 8, 6, 16);
    ctx.globalAlpha = 0.7 * pulse;
    ctx.fillStyle = '#9ef';
    ctx.fillRect(x - 2, y - 9, 4, 18);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 1, y - 10, 2, 20);
    ctx.restore();
    return;
  }
  // HOMING bullets — cyan diamond with rotating spark ring; piercing-style look.
  if (kind === 'homing') {
    ctx.save();
    ctx.globalAlpha = 0.55 + 0.25 * Math.sin(game.animFrame * 0.5);
    ctx.fillStyle = '#0ef';
    ctx.fillRect(x - 3, y - 3, 6, 6);
    ctx.restore();
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 1, y - 2, 2, 4);
    ctx.fillStyle = '#0ff';
    ctx.fillRect(x, y - 3, 1, 1);
    ctx.fillRect(x - 2, y, 1, 1);
    ctx.fillRect(x + 1, y, 1, 1);
    ctx.fillRect(x, y + 2, 1, 1);
    return;
  }
  // WAVE bullets get a pink/magenta halo regardless of P-tier so the buff is obvious.
  if (kind === 'wave') {
    ctx.save();
    ctx.globalAlpha = 0.55 + 0.25 * Math.sin(game.animFrame * 0.4);
    ctx.fillStyle = '#f8a';
    ctx.fillRect(x - 3, y - 4, 6, 8);
    ctx.restore();
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 1, y - 3, 2, 6);
    ctx.fillStyle = '#f6f';
    ctx.fillRect(x, y - 4, 1, 1);
    ctx.fillRect(x - 1, y - 2, 1, 1);
    ctx.fillRect(x + 1, y, 1, 1);
    ctx.fillRect(x - 1, y + 2, 1, 1);
    return;
  }
  if (lvl >= 3) {
    // Lv3 Shard trail — green crystal echoes behind
    ctx.save();
    for (let i = 1; i <= 3; i++) {
      ctx.globalAlpha = 0.32 - i * 0.08;
      ctx.fillStyle = '#0f8';
      ctx.fillRect(x - 2, y + 4 + i * 3, 4, 2);
      ctx.fillStyle = '#aff';
      ctx.fillRect(x - 1, y + 4 + i * 3, 2, 1);
    }
    ctx.restore();
    // Lv3 Shard — emerald polyhedron diamond
    ctx.fillStyle = '#0f8';
    ctx.beginPath();
    ctx.moveTo(x,     y - 7); // top apex
    ctx.lineTo(x + 3, y - 2); // upper-right
    ctx.lineTo(x + 2, y + 3); // lower-right
    ctx.lineTo(x,     y + 6); // bottom apex
    ctx.lineTo(x - 2, y + 3); // lower-left
    ctx.lineTo(x - 3, y - 2); // upper-left
    ctx.closePath();
    ctx.fill();
    // bright green facet highlight
    ctx.fillStyle = '#aff';
    ctx.beginPath();
    ctx.moveTo(x,     y - 7);
    ctx.lineTo(x + 3, y - 2);
    ctx.lineTo(x,     y - 1);
    ctx.closePath();
    ctx.fill();
    // core glint
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 1, y - 4, 1, 2);
  } else if (lvl >= 2) {
    // Lv2 Nova trail — gold streak behind
    ctx.save();
    for (let i = 1; i <= 3; i++) {
      ctx.globalAlpha = 0.30 - i * 0.07;
      ctx.fillStyle = '#fb0';
      ctx.fillRect(x - 2, y + 4 + i * 3, 4, 2);
      ctx.fillStyle = '#ffd';
      ctx.fillRect(x - 1, y + 4 + i * 3, 2, 1);
    }
    ctx.restore();
    // Lv2 Nova — gold/white cylinder
    ctx.fillStyle = '#fb0';
    ctx.fillRect(x - 2, y - 5, 4, 9); // gold body
    ctx.fillStyle = '#ffd';
    ctx.fillRect(x - 1, y - 5, 2, 3); // white highlight stripe
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 2, y - 6, 4, 2); // bright white cap
    ctx.fillStyle = '#a60';
    ctx.fillRect(x - 2, y + 4, 4, 1); // dark base shadow
  } else {
    // Lv1 Sleek — blue/white slim beam (no trail to keep clean)
    ctx.fillStyle = '#6af';
    ctx.fillRect(x - 1, y - 1, 2, 5); // blue body
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 1, y - 3, 2, 3); // white leading tip
  }
}

// Power-up capsule — gem orb with halo, type icon, and orbiting sparkle
function drawPowerUp(p) {
  const x = p.x, y = p.y, t = game.animFrame;
  // RARE LABEL — small blinking "RARE" tag above L/B/E pickups. Visual hint
  // so high-value drops aren't missed in chaos. Skipped when pickup is near
  // the top of the screen (would clip out of view).
  if ((p.type === 'L' || p.type === 'B' || p.type === 'E') && y > 12) {
    const _rBlink = (t >> 2) % 2 === 0;
    if (_rBlink) {
      const _rCol = p.type === 'L' ? '#f6c' : p.type === 'B' ? '#f44' : '#4f8';
      drawRetroText('RARE', x, y - 8, 4, _rCol, 'center');
    }
  }
  // POWERUP PROXIMITY GLOW — small pulsing ring when player is within 30px.
  // Helps targeting under bullet pressure. Skipped if magnetic perk active
  // (its own dashed-line aura already telegraphs proximity).
  if (game.playerAlive && game.activePerk !== 'magnetic') {
    const _dxp = x - game.playerX;
    const _dyp = y - game.playerY;
    const _d2 = _dxp * _dxp + _dyp * _dyp;
    if (_d2 < 900) { // <30 px
      const _puCols = { S:'#0df', N:'#1e6', P:'#e3e', T:'#5af', R:'#fc4',
                        W:'#f6a', H:'#0cf', B:'#f44', L:'#fff', E:'#4f8' };
      const _glowCol = _puCols[p.type] || '#fff';
      ctx.save();
      ctx.globalAlpha = 0.30 + 0.20 * Math.sin(t * 0.30);
      ctx.strokeStyle = _glowCol;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(x, y, 7, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }
  // POWERUP SHADOW — 1-2 px horizontal stripe at the floor (just above lives row)
  // showing the pickup's x position. Alpha proportional to distance from floor —
  // pickup near top = faint, near bottom = bright. Helps the player intercept.
  {
    const floorY = BASE_H - 18;
    if (y < floorY) {
      const dist = floorY - y;
      const sAlpha = Math.max(0, Math.min(1, 1 - dist / 200));
      const cMap = {
        S: '#0df', N: '#1e6', P: '#e3e', T: '#5af', R: '#fc4',
        W: '#f6a', H: '#0cf', B: '#f44', L: '#fff', E: '#4f8'
      };
      ctx.save();
      ctx.globalAlpha = sAlpha * 0.35;
      ctx.fillStyle = cMap[p.type] || '#888';
      ctx.fillRect(x - 4, floorY, 9, 1);
      ctx.restore();
    }
  }
  // NEAR-MAX HIGHLIGHT — for S/N/P pickups that would push the player to MAX_POWER
  // on collection, draw 4 small pulsing corner stars to draw the eye. Pure visual
  // hint; doesn't change drop weighting (SMART POWER DROPS already prevents max).
  if (game.lvl && (p.type === 'S' || p.type === 'N' || p.type === 'P')
      && (game.lvl[p.type] || 1) === MAX_POWER_LVL[p.type] - 1) {
    ctx.save();
    const starPulse = 0.5 + 0.5 * Math.sin(t * 0.32);
    ctx.globalAlpha = starPulse;
    ctx.fillStyle = '#fff';
    // 4 corner stars (3-pixel cross) at ±8,8 from center
    const off = 8;
    [[-off, -off], [off, -off], [-off, off], [off, off]].forEach(([sx, sy]) => {
      ctx.fillRect(x + sx, y + sy - 1, 1, 1);
      ctx.fillRect(x + sx - 1, y + sy, 3, 1);
      ctx.fillRect(x + sx, y + sy + 1, 1, 1);
    });
    ctx.restore();
  }
  const palette = {
    S: { core: '#0df', edge: '#06a', shine: '#cff', glow: '#0ff' },
    N: { core: '#1e6', edge: '#062', shine: '#cfc', glow: '#0f8' },
    P: { core: '#e3e', edge: '#828', shine: '#fcf', glow: '#f6f' },
    T: { core: '#5af', edge: '#147', shine: '#cef', glow: '#8df' },
    R: { core: '#fc4', edge: '#a60', shine: '#fec', glow: '#fc4' },
    W: { core: '#f6a', edge: '#852', shine: '#fce', glow: '#f8a' },
    H: { core: '#0cf', edge: '#069', shine: '#cef', glow: '#0ef' },
    B: { core: '#f44', edge: '#811', shine: '#fcc', glow: '#f44' },
    L: { core: '#fff', edge: '#779', shine: '#fff', glow: '#cff' },
    E: { core: '#4f8', edge: '#062', shine: '#cfe', glow: '#4f8' }
  };
  const c = palette[p.type] || palette.S;

  // Pulsing halo (additive feel via globalAlpha)
  ctx.save();
  const pulse = 0.35 + 0.25 * Math.sin(t * 0.18);
  ctx.globalAlpha = pulse;
  ctx.fillStyle = c.glow;
  ctx.fillRect(x - 8, y - 1, 17, 3);  // horizontal beam
  ctx.fillRect(x - 1, y - 8, 3, 17);  // vertical beam
  ctx.globalAlpha = pulse * 0.55;
  ctx.fillRect(x - 6, y - 6, 13, 13); // diffuse square glow
  ctx.restore();

  // Gem outline (white)
  ctx.fillStyle = '#fff';
  ctx.fillRect(x - 3, y - 6, 6, 1);
  ctx.fillRect(x - 5, y - 5, 10, 1);
  ctx.fillRect(x - 6, y - 4, 12, 9);
  ctx.fillRect(x - 5, y + 5, 10, 1);
  ctx.fillRect(x - 3, y + 6, 6, 1);

  // Edge ring
  ctx.fillStyle = c.edge;
  ctx.fillRect(x - 3, y - 5, 6, 1);
  ctx.fillRect(x - 5, y - 4, 10, 9);
  ctx.fillRect(x - 3, y + 5, 6, 1);

  // Core
  ctx.fillStyle = c.core;
  ctx.fillRect(x - 4, y - 3, 8, 7);
  ctx.fillRect(x - 3, y - 4, 6, 1);
  ctx.fillRect(x - 3, y + 4, 6, 1);

  // Shine highlight (top-left)
  ctx.fillStyle = c.shine;
  ctx.fillRect(x - 3, y - 3, 2, 1);
  ctx.fillRect(x - 4, y - 2, 1, 2);
  // Bright glint
  ctx.fillStyle = '#fff';
  ctx.fillRect(x - 2, y - 3, 1, 1);

  // Type-specific icon (yellow on top)
  if (p.type === 'S') {
    // Lightning bolt
    ctx.fillStyle = '#ff4';
    ctx.fillRect(x, y - 3, 2, 1);
    ctx.fillRect(x - 1, y - 2, 2, 1);
    ctx.fillRect(x - 1, y - 1, 3, 1);
    ctx.fillRect(x, y, 2, 1);
    ctx.fillRect(x - 1, y + 1, 2, 1);
    ctx.fillRect(x - 2, y + 2, 2, 1);
  } else if (p.type === 'N') {
    // Triple-shot stripes
    ctx.fillStyle = '#ff4';
    ctx.fillRect(x - 3, y - 2, 1, 5);
    ctx.fillRect(x - 1, y - 2, 1, 5);
    ctx.fillRect(x + 1, y - 2, 1, 5);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 3, y - 2, 1, 1);
    ctx.fillRect(x - 1, y - 2, 1, 1);
    ctx.fillRect(x + 1, y - 2, 1, 1);
  } else if (p.type === 'P') {
    // 4-point star
    ctx.fillStyle = '#ff4';
    ctx.fillRect(x, y - 3, 1, 7);
    ctx.fillRect(x - 3, y, 7, 1);
    ctx.fillRect(x - 1, y - 1, 3, 3);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x, y, 1, 1);
  } else if (p.type === 'T') {
    // Hourglass icon — outlines + sand inside
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 3, y - 3, 7, 1);
    ctx.fillRect(x - 3, y + 3, 7, 1);
    // Funnel walls
    ctx.fillRect(x - 2, y - 2, 1, 1);
    ctx.fillRect(x + 2, y - 2, 1, 1);
    ctx.fillRect(x - 1, y - 1, 1, 1);
    ctx.fillRect(x + 1, y - 1, 1, 1);
    ctx.fillRect(x, y, 1, 1);
    ctx.fillRect(x - 1, y + 1, 1, 1);
    ctx.fillRect(x + 1, y + 1, 1, 1);
    ctx.fillRect(x - 2, y + 2, 1, 1);
    ctx.fillRect(x + 2, y + 2, 1, 1);
    // Sand grains (animated falling)
    const drop = (game.animFrame >> 1) % 4;
    ctx.fillStyle = '#ff8';
    ctx.fillRect(x, y - 2 + drop * 0, 1, 1);
  } else if (p.type === 'R') {
    // RAPID — three rightward chevrons stacked, suggesting fast-forward
    ctx.fillStyle = '#ff4';
    for (let row = -2; row <= 2; row += 2) {
      ctx.fillRect(x - 3, y + row, 1, 1);
      ctx.fillRect(x - 1, y + row, 1, 1);
      ctx.fillRect(x + 1, y + row, 1, 1);
    }
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 2, y, 1, 1);
  } else if (p.type === 'W') {
    // WAVE — sine ripple icon
    ctx.fillStyle = '#ff4';
    ctx.fillRect(x - 3, y - 1, 1, 1);
    ctx.fillRect(x - 2, y - 2, 1, 1);
    ctx.fillRect(x - 1, y - 1, 1, 1);
    ctx.fillRect(x,     y,     1, 1);
    ctx.fillRect(x + 1, y + 1, 1, 1);
    ctx.fillRect(x + 2, y + 2, 1, 1);
    ctx.fillRect(x + 3, y + 1, 1, 1);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x,     y - 1, 1, 1);
  } else if (p.type === 'H') {
    // HOMING — concentric ring icon with crosshair
    ctx.fillStyle = '#ff4';
    ctx.fillRect(x - 3, y - 1, 1, 3);
    ctx.fillRect(x + 2, y - 1, 1, 3);
    ctx.fillRect(x - 1, y - 3, 3, 1);
    ctx.fillRect(x - 1, y + 2, 3, 1);
    ctx.fillRect(x - 2, y - 2, 1, 1);
    ctx.fillRect(x + 2, y - 2, 1, 1);
    ctx.fillRect(x - 2, y + 2, 1, 1);
    ctx.fillRect(x + 2, y + 2, 1, 1);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x, y, 1, 1);
  } else if (p.type === 'B') {
    // BOMB — round shell with fuse spark
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 2, y - 1, 5, 1);
    ctx.fillRect(x - 3, y,     7, 3);
    ctx.fillRect(x - 2, y + 3, 5, 1);
    ctx.fillStyle = '#400';
    ctx.fillRect(x - 1, y,     3, 2);
    // fuse spark
    ctx.fillStyle = (game.animFrame & 2) ? '#ff4' : '#fa0';
    ctx.fillRect(x, y - 3, 1, 2);
    ctx.fillRect(x + 1, y - 4, 1, 1);
  } else if (p.type === 'L') {
    // LASER — vertical bar icon with cross-hair tip, white core w/ cyan accents
    ctx.fillStyle = '#0ff';
    ctx.fillRect(x - 1, y - 4, 3, 1);
    ctx.fillRect(x - 1, y + 3, 3, 1);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x,     y - 3, 1, 6);
    ctx.fillStyle = '#9ef';
    ctx.fillRect(x - 2, y, 1, 1);
    ctx.fillRect(x + 2, y, 1, 1);
  } else if (p.type === 'E') {
    // SHIELD — bracket icon (open ring with chevron)
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 2, y - 3, 5, 1);
    ctx.fillRect(x - 3, y - 2, 1, 5);
    ctx.fillRect(x + 3, y - 2, 1, 5);
    ctx.fillRect(x - 2, y + 2, 5, 1);
    ctx.fillStyle = '#ff4';
    ctx.fillRect(x - 1, y - 1, 3, 3);
  }

  // Orbiting sparkle
  const a = t * 0.09;
  const sx = Math.round(Math.cos(a) * 8);
  const sy = Math.round(Math.sin(a) * 8);
  ctx.fillStyle = '#fff';
  ctx.fillRect(x + sx, y + sy, 1, 1);
  ctx.fillRect(x - sx, y - sy, 1, 1);
}

// Enemy bullet — glowing orb with velocity-based trail. Color encodes threat:
//   default (dive enemies)  → orange/yellow
//   kind 'mega'  (megaboss aimed)   → bright red
//   kind 'spiral'(megaboss spiral)  → magenta
const BULLET_COLORS = {
  dive:    { trail: '#f80', halo: '#ff4', core: '#f80', inner: '#ff4' },
  mega:    { trail: '#f44', halo: '#f88', core: '#f44', inner: '#faa' },
  spiral:  { trail: '#c2c', halo: '#f8f', core: '#c2c', inner: '#fcf' }
};
function drawEnemyBullet(b) {
  const t = game.animFrame;
  const sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy) || 1;
  const ux = -b.vx / sp, uy = -b.vy / sp;
  const C = BULLET_COLORS[b.kind] || BULLET_COLORS.dive;
  // ENEMY BULLET FADE-IN — stamp spawn frame on first draw, then apply 4-frame
  // alpha ramp so projectiles don't pop. Keeps gameplay timing identical (already
  // movable via updateEnemyBullets), just softens the visual entry.
  if (b._spawnAt == null) b._spawnAt = t;
  const _age = t - b._spawnAt;
  const _fadeIn = _age < 4 ? (_age + 1) / 4 : 1;
  // When bullet density is high, render fewer trail echoes (perf)
  // High stages get longer trails for visibility — but density cap still applies.
  // Tiers: <25: 3 / 25-49: 4 / 50-74: 5 / 75+: 6 — readability at speed.
  const trailLen = (game.enemyBullets && game.enemyBullets.length >= 30) ? 1
                  : (game.stage >= 75) ? 6
                  : (game.stage >= 50) ? 5
                  : (game.stage >= 25) ? 4 : 3;

  // BIOME-TINTED TRAIL — at biome-active stages, paint the FARTHEST trail
  // echo with biome color so the trail fades from biome→bullet color. Subtle
  // identity hint without compromising readability of bullet head.
  let _biomeTrailCol = null;
  if (typeof biomeForStage === 'function') {
    const _bid = biomeForStage(game.stage || 1);
    if (_bid && BIOME_NAMES && BIOME_NAMES[_bid]) _biomeTrailCol = BIOME_NAMES[_bid].col;
  }
  ctx.save();
  // Trail (1 or 3 fading echoes behind the bullet, depending on density)
  for (let i = 1; i <= trailLen; i++) {
    ctx.globalAlpha = (0.32 - i * 0.08) * _fadeIn;
    // Last echo (farthest) uses biome color when active, otherwise default
    ctx.fillStyle = (_biomeTrailCol && i === trailLen) ? _biomeTrailCol : C.trail;
    const tx = b.x + ux * i * 2.2;
    const ty = b.y + uy * i * 2.2;
    const sz = 4 - i;
    ctx.fillRect(tx - sz / 2, ty - sz / 2, sz, sz);
  }

  // Pulsing outer halo
  const pulse = 0.5 + 0.4 * Math.sin(t * 0.4);
  ctx.globalAlpha = pulse * 0.55 * _fadeIn;
  ctx.fillStyle = C.halo;
  ctx.fillRect(b.x - 3, b.y - 3, 6, 6);
  ctx.restore();

  // Core (fade applied via globalAlpha during spawn ramp)
  ctx.save();
  ctx.globalAlpha = _fadeIn;
  ctx.fillStyle = C.core;
  ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
  // Inner
  ctx.fillStyle = C.inner;
  ctx.fillRect(b.x - 1, b.y - 1, 2, 2);
  // White-hot center
  ctx.fillStyle = '#fff';
  ctx.fillRect(b.x, b.y, 1, 1);
  ctx.restore();

  // 슬로우 활성 시 적탄 외곽선 추가 (시각 강화)
  if ((game.slowTimer || 0) > 0) {
    ctx.save();
    ctx.globalAlpha = 0.6;
    ctx.strokeStyle = '#0cf';
    ctx.lineWidth = 0.6;
    ctx.strokeRect(b.x - 2.5, b.y - 2.5, 5, 5);
    ctx.restore();
  }
  // Bullets near the player (bottom 30px) get an extra blink halo so they don't sneak in
  if (b.y > BASE_H - 50 && b.vy > 0) {
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.35 * Math.sin(t * 0.6);
    ctx.fillStyle = '#ff4';
    ctx.fillRect(b.x - 4, b.y - 4, 9, 1);
    ctx.fillRect(b.x - 4, b.y + 3, 9, 1);
    ctx.fillRect(b.x - 4, b.y - 4, 1, 8);
    ctx.fillRect(b.x + 3, b.y - 4, 1, 8);
    ctx.restore();
  }

  // Color-blind redundancy: 1px white outline + per-kind shape marker
  if (colorBlindMode) {
    ctx.fillStyle = '#fff';
    // Outline (4 sides of the core rect)
    ctx.fillRect(b.x - 3, b.y - 3, 6, 1);
    ctx.fillRect(b.x - 3, b.y + 2, 6, 1);
    ctx.fillRect(b.x - 3, b.y - 3, 1, 6);
    ctx.fillRect(b.x + 2, b.y - 3, 1, 6);
    // Shape marker
    if (b.kind === 'mega') {
      // X shape (4 corner pixels)
      ctx.fillRect(b.x - 2, b.y - 2, 1, 1);
      ctx.fillRect(b.x + 1, b.y - 2, 1, 1);
      ctx.fillRect(b.x - 2, b.y + 1, 1, 1);
      ctx.fillRect(b.x + 1, b.y + 1, 1, 1);
    } else if (b.kind === 'spiral') {
      // Plus shape
      ctx.fillRect(b.x, b.y - 2, 1, 5);
      ctx.fillRect(b.x - 2, b.y, 5, 1);
    }
  }
}

// --- Bezier path helpers ---
function bezierPoint(p0, p1, p2, p3, t) {
  const u = 1 - t;
  return {
    x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
    y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y
  };
}

function createDivePath(startX, startY, targetX, targetY, side) {
  const dir = side || (startX < BASE_W/2 ? 1 : -1);
  const midY = BASE_H * 0.5;
  return {
    p0: {x: startX, y: startY},
    p1: {x: startX + dir * 50, y: startY + 40},
    p2: {x: targetX - dir * 40, y: midY},
    p3: {x: targetX, y: targetY}
  };
}

function createLoopPath(startX, startY, side) {
  const dir = side || (startX < BASE_W/2 ? 1 : -1);
  return [
    {p0:{x:startX,y:startY}, p1:{x:startX+dir*30,y:startY+50}, p2:{x:startX+dir*60,y:startY+80}, p3:{x:startX+dir*40,y:startY+130}},
    {p0:{x:startX+dir*40,y:startY+130}, p1:{x:startX+dir*20,y:startY+180}, p2:{x:startX-dir*20,y:startY+160}, p3:{x:startX-dir*10,y:startY+120}},
    {p0:{x:startX-dir*10,y:startY+120}, p1:{x:startX,y:startY+80}, p2:{x:startX,y:BASE_H+20}, p3:{x:startX,y:BASE_H+30}}
  ];
}

function createEntryPath(startX, startY, endX, endY, curveDir) {
  const d = curveDir || 1;
  // Higher stages get a wider curve detour for more dramatic entries
  const stage = (game && game.stage) || 1;
  const detour = 40 + Math.min(40, stage * 2);
  const mx = (startX + endX) / 2 + d * detour;
  return {
    p0: {x:startX, y:startY},
    p1: {x:mx, y:startY},
    p2: {x:mx, y:endY},
    p3: {x:endX, y:endY}
  };
}

// --- Game data ---
let game, keys, stars;

const STAR_COLORS = ['#fff', '#fff', '#fff', '#cef', '#fce', '#ffe', '#cff'];

// Star layers — far is dim/slow, near is bright/fast; gives the field a sense of depth.
// CONSTELLATION LINES — at stage 50+, occasional faint dashed line between
// two nearby near-layer stars fades in/out for atmospheric mythology. Spawn
// rolled every ~10s (600 frames); single active line at a time.
let constellationLine = null;
function maybeSpawnConstellation() {
  if (!game || game.stage < 50) return;
  if (constellationLine) return;
  if (game.animFrame % 600 !== 0) return;
  // Pick two near-layer stars
  const nears = stars.filter(s => s.layer === 'near');
  if (nears.length < 2) return;
  const a = nears[Math.floor(Math.random() * nears.length)];
  let b = a;
  for (let tries = 0; tries < 8 && b === a; tries++) {
    b = nears[Math.floor(Math.random() * nears.length)];
  }
  if (b === a) return;
  // Skip if too far apart (avoid edge-to-edge)
  const dx = a.x - b.x, dy = a.y - b.y;
  if (Math.sqrt(dx*dx + dy*dy) > 80) return;
  constellationLine = { ax: a.x, ay: a.y, bx: b.x, by: b.y, life: 0, maxLife: 90 };
}
function updateConstellation() {
  if (!constellationLine) return;
  constellationLine.life++;
  if (constellationLine.life >= constellationLine.maxLife) constellationLine = null;
}
function drawConstellation() {
  if (!constellationLine) return;
  const cl = constellationLine;
  const ratio = cl.life / cl.maxLife;
  // Triangle alpha: ramp up first 30%, hold, ramp out last 30%
  let alpha;
  if (ratio < 0.3)      alpha = ratio / 0.3;
  else if (ratio > 0.7) alpha = (1 - ratio) / 0.3;
  else                  alpha = 1;
  alpha *= 0.18;
  ctx.save();
  ctx.fillStyle = '#9ac';
  const segs = 16;
  for (let s = 0; s <= segs; s++) {
    if ((s + (game.animFrame >> 2)) % 3 === 0) continue; // dashed flow
    const t = s / segs;
    const x = Math.round(cl.ax + (cl.bx - cl.ax) * t);
    const y = Math.round(cl.ay + (cl.by - cl.ay) * t);
    ctx.globalAlpha = alpha;
    ctx.fillRect(x, y, 1, 1);
  }
  ctx.restore();
}

// DEEP SPACE DUST — drifting motes that subtly populate the background at high
// stages, suggesting cosmic detritus. Lazy-init on first late-stage entry.
let dustMotes = null;
function ensureDustMotes() {
  if (dustMotes) return;
  dustMotes = [];
  for (let i = 0; i < 10; i++) {
    dustMotes.push({
      x: Math.random() * BASE_W,
      y: Math.random() * BASE_H,
      vy: 0.05 + Math.random() * 0.10,
      phase: Math.random() * Math.PI * 2,
      bright: 0.18 + Math.random() * 0.22
    });
  }
}
function updateDustMotes() {
  if (!dustMotes || !game || game.stage < 50) return;
  for (const d of dustMotes) {
    d.y += d.vy;
    d.x += Math.sin(d.phase += 0.008) * 0.04;
    if (d.y > BASE_H + 4) { d.y = -4; d.x = Math.random() * BASE_W; }
    if (d.x < 0) d.x = BASE_W;
    else if (d.x > BASE_W) d.x = 0;
  }
}
function drawDustMotes() {
  if (!dustMotes || !game || game.stage < 50) return;
  ctx.save();
  ctx.fillStyle = '#555';
  for (const d of dustMotes) {
    ctx.globalAlpha = d.bright;
    ctx.fillRect(Math.round(d.x), Math.round(d.y), 1, 1);
  }
  ctx.restore();
}

function initStars() {
  stars = [];
  ensureDustMotes();
  const farCount  = Math.round(STAR_COUNT * 0.55);
  const midCount  = Math.round(STAR_COUNT * 0.30);
  const nearCount = STAR_COUNT - farCount - midCount;
  function pushLayer(layer, count, speedMin, speedMax, brightMin, brightMax) {
    for (let i = 0; i < count; i++) {
      const speed = speedMin + Math.random() * (speedMax - speedMin);
      stars.push({
        x: Math.random() * BASE_W,
        y: Math.random() * BASE_H,
        speed,
        brightness: brightMin + Math.random() * (brightMax - brightMin),
        color: STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)],
        twinklePhase: Math.random() * Math.PI * 2,
        twinkleRate: 0.02 + Math.random() * 0.04,
        big: layer === 'near' && Math.random() < 0.30,
        layer
      });
    }
  }
  pushLayer('far',  farCount,  0.10, 0.30, 0.18, 0.42);
  pushLayer('mid',  midCount,  0.45, 0.75, 0.45, 0.70);
  pushLayer('near', nearCount, 0.95, 1.50, 0.75, 1.00);
  initNebulae();
}

// Background nebula puffs — sit BEHIND the star layers, scroll very slowly downward
// for a sense of depth without dominating the playfield. Pure cosmetic.
let nebulae = [];
const NEBULA_PALETTE = ['#317', '#136', '#244', '#306', '#125'];
function initNebulae() {
  nebulae = [];
  const COUNT = 5;
  for (let i = 0; i < COUNT; i++) {
    nebulae.push({
      x: Math.random() * BASE_W,
      y: Math.random() * BASE_H,
      vx: (Math.random() - 0.5) * 0.04,
      vy: 0.06 + Math.random() * 0.06,
      size: 28 + Math.random() * 30,
      color: NEBULA_PALETTE[i % NEBULA_PALETTE.length],
      alpha: 0.07 + Math.random() * 0.06,
      // Slow brightness pulse — phase offset per cloud so they don't all breathe in sync.
      pulsePhase: Math.random() * Math.PI * 2,
      pulseRate: 0.008 + Math.random() * 0.006
    });
  }
}
function updateNebulae() {
  for (const n of nebulae) {
    n.x += n.vx;
    n.y += n.vy;
    n.pulsePhase += n.pulseRate;
    if (n.y - n.size > BASE_H) { n.y = -n.size; n.x = Math.random() * BASE_W; }
    if (n.x - n.size > BASE_W) { n.x = -n.size; }
    if (n.x + n.size < 0)      { n.x = BASE_W + n.size; }
  }
}
function drawNebulae() {
  // NEBULA REACTIVITY — sample a reactive tint based on game state. Priority order:
  //   boss phase 2 (crimson) > combo lost vignette (red) > high combo (gold).
  // Pure visual layer; no gameplay impact.
  let reactTint = null, reactAlpha = 0;
  if (game) {
    const bossPhase2 = (game.megaBosses || []).some(mb => mb.alive && mb.phase2);
    if (bossPhase2) {
      reactTint = '#911';
      reactAlpha = 0.22 + 0.10 * Math.sin(game.animFrame * 0.08);
    } else if ((game.comboLostVignette || 0) > 0) {
      reactTint = '#722';
      reactAlpha = (game.comboLostVignette / 60) * 0.20;
    } else if ((game.combo || 0) >= 30) {
      reactTint = '#a82';
      reactAlpha = 0.10 + 0.06 * Math.sin(game.animFrame * 0.05);
    }
  }
  for (const n of nebulae) {
    // Pulse alpha: ±35% of base, sinusoidal. Adds depth/life vs. flat clouds.
    const pulse = 0.65 + 0.35 * (0.5 + 0.5 * Math.sin(n.pulsePhase));
    ctx.save();
    ctx.globalAlpha = n.alpha * pulse;
    ctx.fillStyle = n.color;
    // Three concentric squares with alpha-stack create a soft cloud silhouette without using filters.
    for (let r = 3; r >= 1; r--) {
      const s = n.size * (r / 3);
      ctx.fillRect(Math.round(n.x - s / 2), Math.round(n.y - s / 2), Math.round(s), Math.round(s));
    }
    // Reactive tint overlay — softly washes the cloud with mood color
    if (reactTint) {
      ctx.globalAlpha = n.alpha * pulse * reactAlpha;
      ctx.fillStyle = reactTint;
      for (let r = 3; r >= 1; r--) {
        const s = n.size * (r / 3);
        ctx.fillRect(Math.round(n.x - s / 2), Math.round(n.y - s / 2), Math.round(s), Math.round(s));
      }
    }
    ctx.restore();
  }
}

// --- BIOME SYSTEM ---
// Each biome adds a distinctive layer ON TOP of nebulae but BELOW stars/shooting stars,
// so the standard background still reads through. Mapped to specific stage ranges so
// the player feels they're traveling through different regions of space.
//
// Stages 1-7    → null (pure space)
// Stages 8-15   → planet     (lower planet horizon)
// Stages 16-23  → asteroid   (parallax rocks)
// Stages 24-31  → gasGiant   (large ringed planet, top-right)
// Stages 32+    → blackhole  (rotating accretion disk, center)
//
// Returns biome id string or null. Cycle resumes for stages > 39 (back to planet).
// BIOME_NAMES — human-readable labels + color for each biome id. Used by STAGE_INTRO
// preview line so the player knows what environment they're entering before play starts.
const BIOME_NAMES = {
  planet:    { label: 'PLANET HORIZON',  col: '#48f' },
  dawn:      { label: 'DAWN SKY',        col: '#fc8' },
  asteroid:  { label: 'ASTEROID FIELD',  col: '#aa9' },
  ice:       { label: 'ICE FIELD',       col: '#9ef' },
  gasGiant:  { label: 'GAS GIANT',       col: '#fa6' },
  corona:    { label: 'SUN CORONA',      col: '#fc4' },
  blackhole: { label: 'BLACK HOLE',      col: '#f48' },
  starfield: { label: 'OPEN STARFIELD',  col: '#cef' }
};

// BIOME_WHISPERS — short atmospheric one-liners shown under the biome label
// during STAGE_INTRO. Three variants per biome; rotates by (stage % 3) for
// determinism. Pure flavor — no gameplay effect, no score.
// STAGE_TIPS — adaptive gameplay hints surfaced during STAGE_INTRO based on
// player stat weakness. First-match wins. Score-neutral. Different from
// TRANSMISSION_LOGS (narrative) and BIOME_WHISPERS (atmospheric) — these are
// pragmatic skill nudges that disappear once the relevant stat catches up.
const STAGE_TIPS = [
  { check: g => g.stage === 4 && (g.bossKills || 0) === 0,
    tip: 'TIP: CHALLENGE STAGE - PERFECT FOR BONUS' },
  { check: g => g.stage >= 5 && (g.parryCount || 0) < 3,
    tip: 'TIP: DASH THROUGH ENEMY BULLETS = PARRY' },
  { check: g => g.stage >= 4 && (g.comboBest || 0) < 5,
    tip: 'TIP: CHAIN KILLS - 5 = X1.5 MULTIPLIER' },
  { check: g => g.stage >= 9 && g.stage <= 10 && (g.bossKills || 0) === 0,
    tip: 'TIP: BOSS STAGE NEXT - SAVE BOMBS' },
  { check: g => g.stage >= 6 && (g.runPowerUps || 0) < 2,
    tip: 'TIP: GRAB LETTERS - S/N/P STACK PERMANENT' },
  { check: g => g.stage >= 8 && (g.witchSaves || 0) === 0,
    tip: 'TIP: DASH ON FATAL HIT - WITCH TIME SAVE' },
  { check: g => g.stage >= 12 && (g.eliteKills || 0) === 0,
    tip: 'TIP: RED-OUTLINE ENEMIES = ELITES (X1.5 SCORE)' }
];

const BIOME_WHISPERS = {
  planet:    ['THE WORLD WATCHES', 'GRAVITY TUGS SOFTLY', 'BLUE CURVE BREATHES'],
  dawn:      ['LIGHT SPILLS OVER', 'WARMTH ON THE HULL', 'COLOR RETURNS SLOW'],
  asteroid:  ['ROCKS REMEMBER', 'OLD DEBRIS DRIFTS', 'SILENCE BETWEEN STONES'],
  ice:       ['CRYSTAL HUSH', 'EVERY SOUND FREEZES', 'COLD ECHOES LINGER'],
  gasGiant:  ['CLOUDS PRESS DOWN', 'STORMS SPEAK NUMBERS', 'BANDS COIL ENDLESSLY'],
  corona:    ['SUN BLEEDS HOT', 'THE EDGE BURNS', 'FLARE WINDS HOWL'],
  blackhole: ['VOID HUMS', 'GEOMETRY UNRAVELS', 'EVENT HORIZON LEANS IN'],
  starfield: ['LIGHTS WITHOUT END', 'EVERY DOT A FATE', 'WE ARE NOT ALONE HERE']
};

function biomeForStage(stage) {
  if (stage <= 7) return null;
  const idx = Math.floor((stage - 8) / 4);
  // 8-cycle: alternates DARK and BRIGHT biomes so the player travels through
  // contrast — never two dark or two bright environments in a row. Bright
  // environments (dawn / ice / corona) give the game visual lift between
  // the deep-space tiers.
  return ['planet', 'dawn', 'asteroid', 'ice', 'gasGiant', 'corona', 'blackhole', 'starfield'][idx % 8];
}

// Lazy-init asteroid drift state. Each asteroid: x, y, vy, size, rot for parallax feel.
let _biomeAsteroids = null;
function ensureAsteroids() {
  if (_biomeAsteroids) return;
  _biomeAsteroids = [];
  for (let i = 0; i < 8; i++) {
    _biomeAsteroids.push({
      x: Math.random() * BASE_W,
      y: Math.random() * BASE_H,
      vy: 0.15 + Math.random() * 0.25,
      size: 4 + Math.floor(Math.random() * 5),
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.02
    });
  }
}

function drawBiome() {
  if (!game) return;
  const id = biomeForStage(game.stage || 1);
  if (!id) return;
  const t = game.animFrame;

  if (id === 'planet') {
    // PLANET HORIZON — lower band of curved planet surface w/ atmospheric glow.
    // Color palette tied loosely to TIER_PALETTES so it harmonizes, not clashes.
    ctx.save();
    // Atmospheric glow band just above the surface
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#48f';
    ctx.fillRect(0, BASE_H - 60, BASE_W, 6);
    ctx.globalAlpha = 0.10;
    ctx.fillRect(0, BASE_H - 66, BASE_W, 8);
    ctx.restore();
    // Planet curve — chunky pixel arc made from horizontal rects of varying width
    ctx.fillStyle = '#236';
    for (let py = 0; py < 50; py++) {
      const y = BASE_H - 50 + py;
      // Crude curve: width based on parabola from y
      const k = py / 50;
      const w = BASE_W * (1 - k * 0.05); // very gentle curve at top, more at bottom
      const x = (BASE_W - w) / 2;
      ctx.fillRect(x, y, w, 1);
    }
    // Surface highlights — moving lights (cities)
    ctx.fillStyle = '#fc4';
    for (let i = 0; i < 6; i++) {
      const cx = ((i * 47 + (t * 0.05)) % BASE_W);
      const cy = BASE_H - 30 + (i % 3) * 6;
      if ((t + i * 7) % 60 < 30) ctx.fillRect(Math.round(cx), cy, 1, 1);
    }
    // Atmospheric dust — slow drift upward (atmospheric scatter)
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#a86';
    for (let i = 0; i < 10; i++) {
      const px = ((i * 23 + t * 0.15) % BASE_W);
      const py = ((BASE_H - 50) - ((i * 37 + t * 0.08) % (BASE_H - 60)));
      ctx.fillRect(Math.round(px), Math.round(py), 1, 1);
    }
    ctx.restore();
  } else if (id === 'asteroid') {
    // ASTEROID FIELD — chunky drifting rocks, parallax slower than near stars.
    ensureAsteroids();
    for (const a of _biomeAsteroids) {
      a.y += a.vy;
      a.rot += a.rotSpeed;
      if (a.y - a.size > BASE_H) {
        a.y = -a.size;
        a.x = Math.random() * BASE_W;
        a.size = 4 + Math.floor(Math.random() * 5);
      }
      // Rotated chunky pixel cluster — 4 cardinal pieces + center
      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.translate(a.x, a.y);
      ctx.rotate(a.rot);
      ctx.fillStyle = '#867';
      ctx.fillRect(-a.size / 2, -a.size / 2, a.size, a.size);
      ctx.fillStyle = '#a98';
      ctx.fillRect(-a.size / 2, -a.size / 2, 1, 1);
      ctx.fillRect(a.size / 2 - 1, a.size / 2 - 1, 1, 1);
      ctx.fillStyle = '#534';
      ctx.fillRect(-a.size / 2 + 1, a.size / 2 - 1, 1, 1);
      ctx.restore();
    }
  } else if (id === 'gasGiant') {
    // GAS GIANT — large ringed planet in upper-right, slowly rotating tilt.
    ctx.save();
    const cx = BASE_W - 30, cy = 50;
    const r = 28;
    // Body — concentric square layers with banding
    const bandCols = ['#a64', '#b75', '#c86', '#a64', '#864'];
    for (let by = -r; by < r; by++) {
      const ratio = (by + r) / (2 * r);
      const w = Math.floor(Math.sqrt(r * r - by * by) * 2);
      const colIdx = Math.floor((ratio + Math.sin(t * 0.01 + by * 0.1) * 0.05) * bandCols.length);
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = bandCols[Math.max(0, Math.min(bandCols.length - 1, colIdx))];
      ctx.fillRect(cx - w / 2, cy + by, w, 1);
    }
    // Ring — slanted ellipse approximation: 2 horizontal lines extending past planet
    ctx.globalAlpha = 0.40;
    ctx.fillStyle = '#dca';
    const ringInner = r + 5, ringOuter = r + 14;
    ctx.fillRect(cx - ringOuter, cy - 1, ringOuter - ringInner, 1);
    ctx.fillRect(cx - ringOuter, cy, ringOuter - ringInner, 1);
    ctx.fillRect(cx + ringInner, cy - 1, ringOuter - ringInner, 1);
    ctx.fillRect(cx + ringInner, cy, ringOuter - ringInner, 1);
    // Floating gas particles — slow vertical drift, warm amber
    ctx.globalAlpha = 0.40;
    ctx.fillStyle = '#fa6';
    for (let i = 0; i < 8; i++) {
      const px = ((i * 53 + t * 0.10) % BASE_W);
      const py = ((i * 67 + t * 0.07) % BASE_H);
      ctx.fillRect(Math.round(px), Math.round(py), 1, 1);
    }
    ctx.restore();
  } else if (id === 'blackhole') {
    // BLACK HOLE — rotating accretion disk + central void.
    ctx.save();
    const cx = BASE_W / 2, cy = BASE_H / 3;
    const innerR = 12, outerR = 32;
    // Disk — radial spokes that rotate
    const spokes = 24;
    const rot = t * 0.04;
    for (let s = 0; s < spokes; s++) {
      const a = (s / spokes) * Math.PI * 2 + rot;
      const intensity = 0.3 + 0.4 * Math.sin(s * 1.2 + t * 0.05);
      ctx.globalAlpha = 0.10 + intensity * 0.18;
      // Color hue shift based on radius
      ctx.fillStyle = (s % 3 === 0) ? '#f80' : (s % 3 === 1) ? '#fc4' : '#f48';
      // Draw spoke as a series of pixels from inner to outer radius
      for (let rPos = innerR; rPos < outerR; rPos += 2) {
        const px = cx + Math.cos(a) * rPos;
        const py = cy + Math.sin(a) * rPos * 0.5; // squish for depth (face-on disk)
        ctx.fillRect(Math.round(px), Math.round(py), 1, 1);
      }
    }
    // Inner void — pure black circle
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    for (let by = -innerR; by < innerR; by++) {
      const w = Math.floor(Math.sqrt(innerR * innerR - by * by) * 2);
      ctx.fillRect(cx - w / 2, cy + by * 0.5, w, 1);
    }
    // Accretion dust — particles spiraling INTO the void (gravity pull)
    ctx.globalAlpha = 0.50;
    ctx.fillStyle = '#f84';
    for (let i = 0; i < 14; i++) {
      const ang = (i / 14) * Math.PI * 2 + t * 0.02;
      const baseR = 50 + (i * 7 % 30);
      const r = baseR - ((t * 0.3 + i * 19) % 40); // decrease over time = inward pull
      const px = cx + Math.cos(ang) * r;
      const py = cy + Math.sin(ang) * r * 0.5;
      if (r > innerR + 2) ctx.fillRect(Math.round(px), Math.round(py), 1, 1);
    }
    ctx.restore();
  } else if (id === 'dawn') {
    // DAWN SKY — orange/pink gradient covering bottom half of screen for a "rising
    // over a planet" feel. Bright lift to contrast the deep-space biomes around it.
    // Alpha kept ≤0.30 so player/enemy sprites remain clearly readable.
    ctx.save();
    const bands = [
      { y0: BASE_H - 90, h: 16, col: '#824', alpha: 0.10 },
      { y0: BASE_H - 74, h: 14, col: '#a36', alpha: 0.16 },
      { y0: BASE_H - 60, h: 18, col: '#d66', alpha: 0.22 },
      { y0: BASE_H - 42, h: 18, col: '#f86', alpha: 0.26 },
      { y0: BASE_H - 24, h: 20, col: '#fc8', alpha: 0.30 },
      { y0: BASE_H - 4,  h: 14, col: '#fec', alpha: 0.32 }
    ];
    for (const b of bands) {
      ctx.globalAlpha = b.alpha;
      ctx.fillStyle = b.col;
      ctx.fillRect(0, b.y0, BASE_W, b.h);
    }
    // Sun rising at right horizon — partial disc + glow
    const sunCx = BASE_W - 28, sunCy = BASE_H - 28;
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = '#fec';
    for (let by = -10; by <= 4; by++) {
      const w = Math.floor(Math.sqrt(Math.max(0, 100 - by * by)) * 2);
      ctx.fillRect(sunCx - w / 2, sunCy + by, w, 1);
    }
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#fec';
    ctx.fillRect(sunCx - 16, sunCy - 16, 32, 2); // halo
    ctx.fillRect(sunCx - 18, sunCy - 14, 36, 1);
    // Golden motes — bright particles drifting up (dawn light filtering)
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#fc8';
    for (let i = 0; i < 12; i++) {
      const px = ((i * 31 + t * 0.18) % BASE_W);
      const py = ((BASE_H - 30) - ((i * 41 + t * 0.10) % (BASE_H - 40)));
      ctx.fillRect(Math.round(px), Math.round(py), 1, 1);
    }
    ctx.restore();
  } else if (id === 'ice') {
    // ICE FIELD — white/cyan glacier surface across bottom + falling snow particles.
    // Brighter than dawn but cooler tone for variety.
    ctx.save();
    // Glacial surface — wavy white band
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = '#def';
    for (let x = 0; x < BASE_W; x += 1) {
      const wave = Math.floor(Math.sin(x * 0.18 + t * 0.005) * 3);
      const yTop = BASE_H - 32 + wave;
      ctx.fillRect(x, yTop, 1, BASE_H - yTop);
    }
    // Ice highlights — bright cyan crests along the surface
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#fff';
    for (let x = 0; x < BASE_W; x += 6) {
      const wave = Math.floor(Math.sin(x * 0.18 + t * 0.005) * 3);
      ctx.fillRect(x, BASE_H - 32 + wave, 2, 1);
    }
    // Falling snow — small drifting dots above the surface
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#fff';
    const snowCount = 18;
    for (let i = 0; i < snowCount; i++) {
      const sx = ((i * 53 + (t * 0.4)) % BASE_W);
      const sy = ((i * 47 + (t * 0.8)) % (BASE_H - 40));
      ctx.fillRect(Math.round(sx), Math.round(sy), 1, 1);
    }
    // Subtle cool-tint wash over the whole frame
    ctx.globalAlpha = 0.04;
    ctx.fillStyle = '#9cf';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
    ctx.restore();
  } else if (id === 'corona') {
    // SUN CORONA — golden/yellow brightness with looping flare ribbons across the
    // upper half of the screen, suggesting flight along a star's outer atmosphere.
    ctx.save();
    // Warm wash across upper half
    ctx.globalAlpha = 0.20;
    ctx.fillStyle = '#fc4';
    ctx.fillRect(0, 0, BASE_W, BASE_H / 2);
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = '#f84';
    ctx.fillRect(0, BASE_H / 2, BASE_W, BASE_H / 2);
    // Flare ribbons — sin-wave horizontal bands that drift
    const flareCount = 3;
    for (let f = 0; f < flareCount; f++) {
      ctx.globalAlpha = 0.22 + 0.10 * Math.sin(t * 0.04 + f * 1.3);
      ctx.fillStyle = f % 2 === 0 ? '#fec' : '#fa6';
      const yBase = 20 + f * 18;
      for (let x = 0; x < BASE_W; x += 2) {
        const wave = Math.sin(x * 0.06 + t * 0.03 + f * 1.7) * 6;
        const h = 4 + 2 * Math.sin(x * 0.08 - t * 0.02 + f);
        ctx.fillRect(x, yBase + wave, 2, h);
      }
    }
    // Bright pinpoint sparks
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 8; i++) {
      const sx = ((i * 41 + t * 0.2) % BASE_W);
      const sy = ((i * 23 + t * 0.4) % (BASE_H / 2));
      ctx.fillRect(Math.round(sx), Math.round(sy), 1, 1);
    }
    // Solar wind sparks — orange particles streaking diagonally
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#f84';
    for (let i = 0; i < 12; i++) {
      const px = ((i * 29 + t * 0.5) % BASE_W);
      const py = ((i * 47 + t * 0.3) % BASE_H);
      ctx.fillRect(Math.round(px), Math.round(py), 2, 1); // 2px wide for streaks
    }
    ctx.restore();
  } else if (id === 'starfield') {
    // STARFIELD — empty, peaceful sector with extra bright twinkling stars.
    // Acts as a "rest" cycle between dramatic biomes. Just brighter star density.
    ctx.save();
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 40; i++) {
      const seed = i * 137;
      const sx = (seed * 7 % BASE_W);
      const sy = (seed * 11 % BASE_H);
      const flick = (t + seed) % 60 < 35;
      if (flick) ctx.fillRect(sx, sy, 1, 1);
    }
    // Distant galactic core glow — soft band across mid-screen
    ctx.globalAlpha = 0.06;
    ctx.fillStyle = '#cef';
    ctx.fillRect(0, BASE_H / 2 - 30, BASE_W, 60);
    ctx.globalAlpha = 0.04;
    ctx.fillRect(0, BASE_H / 2 - 20, BASE_W, 40);
    ctx.restore();
  }
}

// --- AMBIENT EVENTS ---
// Atmospheric one-shot events that appear during a stage. No score impact, no
// gameplay effect — pure narrative/environment. Spawned on stage start (35% chance,
// stage > 3) so they don't crowd the tutorial. Single active event at a time —
// game.ambientEvent stores its state.
//
// Types:
//   cargoShip — large freighter silhouette traversing horizontally with running lights
//   supernova — bright corner flash that fades over ~3 seconds with shockwave ring
function pickAmbientEvent() {
  if (!game) return null;
  if (game.stage <= 3) return null;            // pure-space tutorial
  if (Math.random() >= 0.35) return null;      // 35% spawn rate
  const types = ['cargoShip', 'supernova', 'satellite', 'comet', 'pulsar', 'meteorShower'];
  return types[Math.floor(Math.random() * types.length)];
}
function startAmbientEvent(type) {
  if (!type) { game.ambientEvent = null; return; }
  // AMBIENT EVENT ENTRY BANNER — brief atmospheric label so the player notices
  // the event onset. Faded gray to keep ambient tone, not gameplay alarm.
  const _evLabels = {
    cargoShip: 'CARGO TRANSIT',
    supernova: 'DISTANT SUPERNOVA',
    satellite: 'SATELLITE PASS',
    comet:     'COMET DRIFT',
    pulsar:    'PULSAR PULSE',
    meteorShower: 'METEOR SHOWER'
  };
  const _lab = _evLabels[type];
  if (_lab && game.floatTexts) {
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H - 50, text: _lab,
      color: '#888', life: 50, maxLife: 50, size: 4
    });
  }
  if (type === 'cargoShip') {
    const fromLeft = Math.random() < 0.5;
    game.ambientEvent = {
      type, life: 0,
      maxLife: 1200,                  // ~20s — slow drift
      x: fromLeft ? -60 : BASE_W + 60,
      y: 30 + Math.random() * (BASE_H - 90),
      vx: (fromLeft ? 1 : -1) * 0.18,
      lightPhase: 0
    };
  } else if (type === 'supernova') {
    const corner = Math.floor(Math.random() * 4);
    game.ambientEvent = {
      type, life: 0,
      maxLife: 180,                  // ~3s flash + fade
      x: corner % 2 === 0 ? 30 : BASE_W - 30,
      y: corner < 2 ? 30 : BASE_H - 60,
      maxR: 40
    };
  } else if (type === 'satellite') {
    // Small rotating box drifting horizontally with blinking beacon
    const fromLeft = Math.random() < 0.5;
    game.ambientEvent = {
      type, life: 0,
      maxLife: 900,                  // ~15s
      x: fromLeft ? -10 : BASE_W + 10,
      y: 20 + Math.random() * 40,
      vx: (fromLeft ? 1 : -1) * 0.32,
      rot: 0
    };
  } else if (type === 'comet') {
    // Fast diagonal streak through upper screen — quick visual pop
    const fromLeft = Math.random() < 0.5;
    const startY = -8;
    game.ambientEvent = {
      type, life: 0,
      maxLife: 150,                  // ~2.5s
      x: fromLeft ? -10 : BASE_W + 10,
      y: startY,
      vx: (fromLeft ? 1 : -1) * 2.4,
      vy: 1.1
    };
  } else if (type === 'pulsar') {
    // PULSAR — fixed-position rapidly pulsing point with concentric rings.
    // ~5 second life, 4 pulses spaced ~70 frames apart.
    game.ambientEvent = {
      type, life: 0,
      maxLife: 300,
      x: 40 + Math.random() * (BASE_W - 80),
      y: 20 + Math.random() * 60
    };
  } else if (type === 'meteorShower') {
    // METEOR SHOWER — spawns 6-9 staggered comet-style streaks all from same edge.
    // Stored as an array of sub-streaks in `streaks`. Rendered with same comet logic.
    const fromLeft = Math.random() < 0.5;
    const count = 6 + Math.floor(Math.random() * 4);
    const streaks = [];
    for (let k = 0; k < count; k++) {
      streaks.push({
        x: fromLeft ? -10 - k * 18 : BASE_W + 10 + k * 18,
        y: -8 + Math.random() * 30,
        vx: (fromLeft ? 1 : -1) * (2.0 + Math.random() * 1.0),
        vy: 1.0 + Math.random() * 0.6,
        delay: k * 12  // staggered ignition
      });
    }
    game.ambientEvent = {
      type, life: 0,
      maxLife: 300,
      streaks
    };
  }
}
function updateAmbientEvent() {
  const ev = game.ambientEvent;
  if (!ev) return;
  ev.life++;
  if (ev.type === 'cargoShip') {
    ev.x += ev.vx;
    ev.lightPhase++;
    // Despawn when off-screen
    if (ev.x < -80 || ev.x > BASE_W + 80) game.ambientEvent = null;
  } else if (ev.type === 'supernova') {
    if (ev.life >= ev.maxLife) game.ambientEvent = null;
  } else if (ev.type === 'satellite') {
    ev.x += ev.vx;
    ev.rot += 0.04;
    if (ev.x < -20 || ev.x > BASE_W + 20) game.ambientEvent = null;
  } else if (ev.type === 'comet') {
    ev.x += ev.vx;
    ev.y += ev.vy;
    if (ev.x < -30 || ev.x > BASE_W + 30 || ev.y > BASE_H + 10) game.ambientEvent = null;
  } else if (ev.type === 'pulsar') {
    // Pulsar — fixed position, no movement; life counter drives the pulse pattern.
    if (ev.life >= ev.maxLife) game.ambientEvent = null;
  } else if (ev.type === 'meteorShower') {
    // Move each active streak; lifecycle ends when all streaks have left the screen.
    let anyOnScreen = false;
    for (const st of ev.streaks) {
      if (ev.life < st.delay) { anyOnScreen = true; continue; }
      st.x += st.vx;
      st.y += st.vy;
      if (st.x > -30 && st.x < BASE_W + 30 && st.y < BASE_H + 10) anyOnScreen = true;
    }
    if (!anyOnScreen) game.ambientEvent = null;
  }
}
function drawAmbientEvent() {
  const ev = game.ambientEvent;
  if (!ev) return;
  if (ev.type === 'cargoShip') {
    // Long rectangular silhouette (40 × 8 px) with running lights and a small bridge bump
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#234';
    ctx.fillRect(ev.x - 20, ev.y - 4, 40, 8);
    ctx.fillRect(ev.x - 8, ev.y - 6, 16, 2);   // bridge / superstructure
    ctx.fillRect(ev.x - 24, ev.y - 1, 4, 2);   // engine cowl trailing edge
    // Running lights — alternating amber/red along the hull
    const lights = (ev.lightPhase >> 4) % 2;
    ctx.fillStyle = lights ? '#fc4' : '#f44';
    ctx.fillRect(ev.x - 18, ev.y - 2, 1, 1);
    ctx.fillStyle = lights ? '#f44' : '#fc4';
    ctx.fillRect(ev.x - 6,  ev.y - 2, 1, 1);
    ctx.fillRect(ev.x + 6,  ev.y - 2, 1, 1);
    ctx.fillRect(ev.x + 16, ev.y - 2, 1, 1);
    // Engine glow trailing the direction of travel
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = '#0cf';
    const trailX = ev.vx > 0 ? ev.x - 28 : ev.x + 22;
    ctx.fillRect(trailX, ev.y - 1, 6, 2);
    ctx.restore();
  } else if (ev.type === 'supernova') {
    // Expanding ring + central flash. Alpha peaks early then fades.
    const ratio = ev.life / ev.maxLife;
    const fade = ratio < 0.15
      ? (ratio / 0.15)
      : (1 - (ratio - 0.15) / 0.85);
    const alpha = Math.max(0, fade);
    ctx.save();
    // Outer expanding ring
    const r = 4 + ratio * ev.maxR;
    ctx.globalAlpha = alpha * 0.45;
    ctx.fillStyle = '#fff';
    for (let a = 0; a < 24; a++) {
      const ang = (a / 24) * Math.PI * 2;
      const px = ev.x + Math.cos(ang) * r;
      const py = ev.y + Math.sin(ang) * r;
      ctx.fillRect(Math.round(px), Math.round(py), 1, 1);
    }
    // Central flash core
    ctx.globalAlpha = alpha * 0.75;
    ctx.fillStyle = '#ff8';
    ctx.fillRect(ev.x - 2, ev.y - 2, 4, 4);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff';
    ctx.fillRect(ev.x - 1, ev.y - 1, 2, 2);
    // Faint corner halo bleed
    ctx.globalAlpha = alpha * 0.18;
    ctx.fillStyle = '#fc8';
    ctx.fillRect(ev.x - 16, ev.y - 16, 32, 32);
    ctx.restore();
  } else if (ev.type === 'satellite') {
    // Small 5×5 rotating box with solar-panel wings + blinking red beacon
    ctx.save();
    ctx.globalAlpha = 0.65;
    ctx.translate(ev.x, ev.y);
    ctx.rotate(ev.rot);
    // Body
    ctx.fillStyle = '#888';
    ctx.fillRect(-2, -2, 5, 5);
    // Solar panel wings (left/right)
    ctx.fillStyle = '#48c';
    ctx.fillRect(-7, -1, 4, 3);
    ctx.fillRect(3, -1, 4, 3);
    // Beacon — blinking red dot
    if ((ev.life >> 3) % 2 === 0) {
      ctx.fillStyle = '#f44';
      ctx.fillRect(0, -3, 1, 1);
    }
    ctx.restore();
  } else if (ev.type === 'comet') {
    // Bright streak with fading tail behind
    ctx.save();
    ctx.fillStyle = '#fec';
    ctx.globalAlpha = 0.9;
    ctx.fillRect(Math.round(ev.x), Math.round(ev.y), 2, 2);
    // Tail — extrapolate backward from velocity
    const len = 14;
    for (let i = 1; i <= len; i++) {
      const t = i / len;
      const tx = ev.x - ev.vx * i * 0.7;
      const ty = ev.y - ev.vy * i * 0.7;
      ctx.globalAlpha = (1 - t) * 0.7;
      ctx.fillStyle = i < len * 0.4 ? '#fff' : i < len * 0.7 ? '#fec' : '#fa6';
      ctx.fillRect(Math.round(tx), Math.round(ty), 1, 1);
    }
    ctx.restore();
  } else if (ev.type === 'pulsar') {
    // PULSAR — fixed point with 3 concentric pulsing rings + bright core. 4-pulse
    // cycle spaced ~75 frames apart. Each pulse expands from r=2 to r=22.
    ctx.save();
    const cyclePhase = (ev.life % 75) / 75;
    const pulseR = 2 + cyclePhase * 20;
    const fade = 1 - cyclePhase;
    // 3 rings
    for (let ring = 0; ring < 3; ring++) {
      const ringR = pulseR + ring * 4;
      ctx.globalAlpha = fade * 0.45 * (1 - ring * 0.25);
      ctx.fillStyle = ring === 0 ? '#fff' : ring === 1 ? '#8cf' : '#48a';
      const segs = 16;
      for (let s = 0; s < segs; s++) {
        const a = (s / segs) * Math.PI * 2;
        const px = Math.round(ev.x + Math.cos(a) * ringR);
        const py = Math.round(ev.y + Math.sin(a) * ringR);
        ctx.fillRect(px, py, 1, 1);
      }
    }
    // Bright core
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#fff';
    ctx.fillRect(ev.x - 1, ev.y - 1, 3, 3);
    ctx.restore();
  } else if (ev.type === 'meteorShower') {
    // METEOR SHOWER — render each active streak as a mini comet trail
    ctx.save();
    for (const st of ev.streaks) {
      if (ev.life < st.delay) continue;
      ctx.fillStyle = '#fec';
      ctx.globalAlpha = 0.85;
      ctx.fillRect(Math.round(st.x), Math.round(st.y), 1, 1);
      // Short tail (8 segments)
      for (let i = 1; i <= 8; i++) {
        const tx = st.x - st.vx * i * 0.6;
        const ty = st.y - st.vy * i * 0.6;
        ctx.globalAlpha = (1 - i / 8) * 0.55;
        ctx.fillStyle = i < 3 ? '#fff' : '#fa6';
        ctx.fillRect(Math.round(tx), Math.round(ty), 1, 1);
      }
    }
    ctx.restore();
  }
}

function getFormationPos(col, row) {
  const startX = 32;
  const startY = 36;
  const spacingX = 16;
  const spacingY = 14;
  return { x: startX + col * spacingX, y: startY + row * spacingY };
}

function createEnemy(type, col, row, overrideX, overrideY) {
  const pos = (overrideX != null && overrideY != null)
    ? { x: overrideX, y: overrideY }
    : getFormationPos(col, row);
  // ELITE VARIANT — 3% (stage 5-9) / 5% (stage 10+) chance for formation enemies of
  // common types. Boss/shielded/UFO/golden/minibee skipped (they have native specialness).
  // Elite gets +1 HP, brighter outline, 1.5× score, and a higher power-up drop chance.
  const eliteCandidate = (type === 'bee' || type === 'butterfly' || type === 'mirror' || type === 'kamikaze');
  const stage = (game && game.stage) || 0;
  const eliteRate = stage >= 10 ? 0.05 : stage >= 5 ? 0.03 : 0;
  const isElite = eliteCandidate && Math.random() < eliteRate;
  // GHOST VARIANT — stage 60+ only, 3% chance. Invisible (alpha 0.15) until first
  // hit reveals it. Awards 2× score on kill. Mutex with elite (one variant max).
  const isGhost = !isElite && stage >= 60 && Math.random() < 0.03;
  const baseHp = (type === 'boss' || type === 'shielded') ? 2 : 1;
  const _maxHp = baseHp + (isElite ? 1 : 0);
  return {
    type, col, row,
    homeX: pos.x, homeY: pos.y,
    x: pos.x, y: pos.y,
    alive: true,
    hp: _maxHp,
    maxHp: _maxHp,
    elite: isElite,
    ghost: isGhost,
    state: 'formation', // formation, entering, diving, returning, capturing
    frame: 0, frameTimer: 0,
    pathProgress: 0, pathSpeed: 0.012,
    path: null, pathSegments: null, pathSegIndex: 0,
    capturedShip: false,
    captureTimer: 0,
    diveTimer: 0,
    scored: false
  };
}

function resetGame() {
  // RUN-START COMPLETION SNAPSHOT — captured before this run begins so the
  // game-over screen can show delta from this run's progression gains.
  const _runStartCmp = (typeof computeCompositeCompletion === 'function')
    ? computeCompositeCompletion() : 0;
  // Daily mode forces the ship by date hash before we capture shipAttrs()
  if (dailyModeRequested) {
    const ds = dailyShipFor(dailySeed());
    if (ds && SHIPS[ds]) selectedShip = ds;
    // Track distinct daily-mode days
    try {
      const days = JSON.parse(localStorage.getItem('galagaDailyDays') || '[]');
      const today = String(dailySeed());
      if (!days.includes(today)) {
        days.push(today);
        if (days.length > 365) days.shift();
        localStorage.setItem('galagaDailyDays', JSON.stringify(days));
      }
      if (days.length >= 7) unlockAchievement('dailyDevotee');
      if (days.length >= 14) unlockAchievement('globetrotter');
      if (days.length >= 30) unlockAchievement('starGazer');
    } catch (e) {}
  }
  // Track ships used across sessions for the TRIPLE PILOT achievement
  try {
    const used = new Set(JSON.parse(localStorage.getItem('galagaShipsUsed') || '[]'));
    used.add(selectedShip);
    localStorage.setItem('galagaShipsUsed', JSON.stringify([...used]));
    if (used.size >= 3) unlockAchievement('triplePilot');
  } catch (e) {}
  // CHECKPOINT achievement: starting from a milestone above 1
  if ((startStageRequested || 1) > 1) unlockAchievement('checkpointUser');
  // NO SHAKE achievement: shake mode set to OFF
  if (shakeMode === 'off') unlockAchievement('noShake');
  // WORLD TRIP — used all 3 difficulty modes (track in localStorage)
  try {
    const difs = new Set(JSON.parse(localStorage.getItem('galagaDifficultiesUsed') || '[]'));
    difs.add(difficultyMode);
    localStorage.setItem('galagaDifficultiesUsed', JSON.stringify([...difs]));
    if (difs.size >= 3) unlockAchievement('worldTrip');
  } catch (e) {}
  // NIGHT OWL — playing between 22:00 and 06:00 local time
  {
    const hr = new Date().getHours();
    if (hr >= 22 || hr < 6) unlockAchievement('nightOwl');
    if (hr >= 6 && hr < 9) unlockAchievement('earlyBird');

  game = {

// Returns the formation variant for the current stage:
//   'grid'    — default rectangular layout (most stages)
//   'v'       — V-shape pointing down (stage 11, 31, 51, ...)
//   'circle'  — concentric ring layout (stage 16, 36, 56, ...)
//   'diamond' — diamond/rhombus layout (stage 21 and beyond cycle)
//   'wave'    — sinusoidal staggered rows
function pickFormationVariant() {
  const s = game.stage;
  if (s < 8) return 'grid';
  const m = s % 20;
  if (m === 11) return 'v';
  if (m === 16) return 'circle';
  if (m === 1)  return 'diamond';
  if (m === 6)  return 'wave';
  return 'grid';
}

function createFormation() {
  game.enemies = [];
  game.formationVariant = pickFormationVariant();
  const shieldChance = game.stage >= 7 ? Math.min(0.30, (game.stage - 6) * 0.06) : 0;
  const splitterChance = game.stage >= 5 ? Math.min(0.25, (game.stage - 4) * 0.05) : 0;
  const pickButterfly = () => Math.random() < shieldChance ? 'shielded' : 'butterfly';
  const pickBee = () => Math.random() < splitterChance ? 'splitter' : 'bee';

  if (game.formationVariant === 'grid') {
    // Row 0: 4 bosses
    for (let c = 3; c <= 6; c++) game.enemies.push(createEnemy('boss', c, 0));
    // Row 1-2: 8 butterflies each
    for (let r = 1; r <= 2; r++)
      for (let c = 1; c <= 8; c++) game.enemies.push(createEnemy(pickButterfly(), c, r));
    // Row 3-4: 10 bees each
    for (let r = 3; r <= 4; r++)
      for (let c = 0; c <= 9; c++) game.enemies.push(createEnemy(pickBee(), c, r));
    return;
  }

  // Variant layouts use overrideX/overrideY. We give every entity a unique col/row tag
  // for downstream code that may key on it (entry-wave order).
  let tag = 0;
  const place = (type, x, y) => {
    const e = createEnemy(type, tag, 0, x, y);
    tag++;
    game.enemies.push(e);
  };

  if (game.formationVariant === 'v') {
    // V points downward: bosses at top corners, butterflies + bees down the sides
    const cx = BASE_W / 2;
    const topY = 32;
    const stepY = 12;
    const stepX = 12;
    place('boss', cx - 5 * stepX, topY);
    place('boss', cx + 5 * stepX, topY);
    place('boss', cx - 4 * stepX, topY + stepY);
    place('boss', cx + 4 * stepX, topY + stepY);
    for (let i = 0; i < 8; i++) {
      const y = topY + (i + 2) * stepY * 0.6;
      const dx = (3.5 - i * 0.35) * stepX;
      if (i < 5) {
        place(pickButterfly(), cx - dx, y);
        place(pickButterfly(), cx + dx, y);
      } else {
        place(pickBee(), cx - dx, y);
        place(pickBee(), cx + dx, y);
      }
    }
    // Tip of V (single bee) at bottom
    place(pickBee(), cx, topY + 10 * stepY * 0.6);
    return;
  }

  if (game.formationVariant === 'circle') {
    const cx = BASE_W / 2, cy = 70;
    // Outer ring of 12 bees
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      place(pickBee(), cx + Math.cos(a) * 56, cy + Math.sin(a) * 30);
    }
    // Middle ring of 8 butterflies
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 + Math.PI / 8;
      place(pickButterfly(), cx + Math.cos(a) * 36, cy + Math.sin(a) * 20);
    }
    // Center 4 bosses
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      place('boss', cx + Math.cos(a) * 14, cy + Math.sin(a) * 8);
    }
    return;
  }

  if (game.formationVariant === 'diamond') {
    const cx = BASE_W / 2, cy = 70;
    // Diamond rows: 1, 3, 5, 7, 9, 7, 5, 3, 1 (centered)
    const rows = [1, 3, 5, 7, 9, 7, 5, 3, 1];
    const stepY = 9;
    for (let r = 0; r < rows.length; r++) {
      const cnt = rows[r];
      const y = cy - 4 * stepY + r * stepY;
      for (let i = 0; i < cnt; i++) {
        const x = cx + (i - (cnt - 1) / 2) * 14;
        const t = r === 0 || r === rows.length - 1 ? pickBee()
                : r === 4 ? 'boss'
                : (r === 3 || r === 5) ? pickButterfly()
                : pickBee();
        place(t, x, y);
      }
    }
    return;
  }

  if (game.formationVariant === 'wave') {
    // 5 rows × 8 cols, sinusoidally offset in y
    const startX = 24;
    const stepX = 22;
    const baseY = 40;
    const stepY = 14;
    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 8; c++) {
        const x = startX + c * stepX;
        const y = baseY + r * stepY + Math.sin(c * 0.9 + r) * 6;
        const t = r === 0 ? 'boss' : r <= 2 ? pickButterfly() : pickBee();
        place(t, x, y);
      }
    }
    return;
  }
}

function setupEntryAnimation() {
  game.allEntered = false;
  game.entryWave = 0;
  game.entryTimer = 0;
  // Group enemies into entry waves
  const waves = [];
  // Wave 0: bees row 4 left half
  waves.push(game.enemies.filter(e => e.row === 4 && e.col < 5));
  // Wave 1: bees row 4 right half
  waves.push(game.enemies.filter(e => e.row === 4 && e.col >= 5));
  // Wave 2: bees row 3 left half
  waves.push(game.enemies.filter(e => e.row === 3 && e.col < 5));
  // Wave 3: bees row 3 right half
  waves.push(game.enemies.filter(e => e.row === 3 && e.col >= 5));
  // Wave 4: butterflies row 2
  waves.push(game.enemies.filter(e => e.row === 2));
  // Wave 5: butterflies row 1
  waves.push(game.enemies.filter(e => e.row === 1));
  // Wave 6: bosses
  waves.push(game.enemies.filter(e => e.row === 0));

  // Spiral entry on stage 18+ with 35% chance — replaces the side-curve Bezier with a center-spiral.
  const useSpiral = game.stage >= 18 && Math.random() < 0.35
    && game.formationVariant !== 'circle' && game.formationVariant !== 'diamond';
  game.entrySpiral = useSpiral;
  let totalIdx = 0;
  waves.forEach((wave, wi) => {
    wave.forEach((e, i) => {
      e.state = 'entering';
      if (useSpiral) {
        e.spiralEntry = true;
        e.spiralDir = (totalIdx % 2 === 0) ? 1 : -1;
        e.spiralStartAngle = (totalIdx / Math.max(1, game.enemies.length)) * Math.PI * 2;
        // Start point on the spiral's outermost angle (will be updated each frame)
        e.x = BASE_W/2 + Math.cos(e.spiralStartAngle) * 90;
        e.y = BASE_H/2 - 20 + Math.sin(e.spiralStartAngle) * 90 * 0.65;
      } else {
        e.spiralEntry = false;
        e.x = wi % 2 === 0 ? -10 : BASE_W + 10;
        e.y = -10 - i * 8;
        const side = wi % 2 === 0 ? 1 : -1;
        e.path = createEntryPath(e.x, e.y, e.homeX, e.homeY, side);
      }
      e.pathProgress = 0;
      e.pathSpeed = 0.015 + game.stage * 0.001;
      e.entryDelay = wi * 50 + i * 6;
      totalIdx++;
    });
  });
}

function setupChallengingStage() {
  game.challengeHits = 0;
  game.challengeTotal = 0;
  game.challengeWaves = [];
  game.challengeWaveIdx = 0;
  game.challengeWaveTimer = 35; // initial telegraph for first wave
  game.challengeWaveStartFrame = 0; // wave 1 starts at stageFrames 0
  game.enemies = [];
  game.enemyBullets = [];

  const numWaves = 8; // fixed: 8 waves → uniform 128 enemies/challenge stage
  const ALL_PATTERNS = ['sweep_lr', 'sweep_rl', 'pincer', 'top_down', 'diagonal', 'double_row'];

  // Shuffle once then cycle so all 6 patterns appear at least once across waves
  const shuffled = ALL_PATTERNS.slice().sort(() => Math.random() - 0.5);
  const patternOrder = [];
  while (patternOrder.length < numWaves) {
    patternOrder.push(...shuffled.slice().sort(() => Math.random() - 0.5));
  }

  const baseSpeed = 1.5 + game.stage * 0.05;
  // CHALLENGE DEPTH SCALING — base group size 8 enemies, +1 at stage 20+,
  // +2 at stage 40+. Adds 16 → 18-20 enemies per wave at deeper stages.
  const GROUP_SIZE = 8 + (game.stage >= 40 ? 2 : game.stage >= 20 ? 1 : 0);

  for (let w = 0; w < numWaves; w++) {
    const pattern = patternOrder[w];
    const numGroups = 2; // fixed: 2 sub-groups per wave → uniform 16 enemies/wave
    const wave = [];

    for (let g = 0; g < numGroups; g++) {
      const yBase = 40 + Math.random() * 110;
      const spacing = 12 + Math.random() * 2; // 12–14 px (tighter than old 18)
      const sinAmp = 20 + Math.random() * 10; // 20–30 px

      for (let i = 0; i < GROUP_SIZE; i++) {
        // Per-group: 1 boss + 3 butterflies + 4 bees
        let type;
        if (i < 1) type = 'boss';
        else if (i < 4) type = 'butterfly';
        else type = 'bee';

        const e = {
          type, alive: true, hp: type === 'boss' ? 2 : 1,
          frame: 0, frameTimer: 0,
          sinPhase: i * 0.8, sinAmp,
          pattern, state: 'challenge',
          vx: 0, vy: 0, x: 0, y: 0, baseY: 0, baseX: 0
        };

        switch (pattern) {
          case 'sweep_lr':
            e.x = -15 - i * spacing;
            e.y = yBase + g * 40;
            e.vx = baseSpeed;
            e.baseY = e.y;
            break;
          case 'sweep_rl':
            e.x = BASE_W + 15 + i * spacing;
            e.y = yBase + g * 40;
            e.vx = -baseSpeed;
            e.baseY = e.y;
            break;
          case 'pincer':
            if (g % 2 === 0) {
              e.x = -15 - i * spacing;
              e.y = yBase + g * 35;
              e.vx = baseSpeed;
            } else {
              e.x = BASE_W + 15 + i * spacing;
              e.y = yBase + (g - 1) * 35 + 20;
              e.vx = -baseSpeed;
            }
            e.baseY = e.y;
            break;
          case 'top_down': {
            const totalSlots = numGroups * GROUP_SIZE;
            const slot = g * GROUP_SIZE + i;
            e.x = 15 + slot * (BASE_W - 30) / Math.max(totalSlots - 1, 1);
            e.y = -15 - i * spacing;
            e.vy = baseSpeed;
            e.baseX = e.x;
            break;
          }
          case 'diagonal': {
            const fromLeft = g % 2 === 0;
            e.x = fromLeft ? -15 - i * spacing : BASE_W + 15 + i * spacing;
            e.y = -15 - i * spacing * 0.5;
            e.vx = fromLeft ? baseSpeed : -baseSpeed;
            e.vy = baseSpeed * 0.6;
            break;
          }
          case 'double_row':
          default:
            e.x = -15 - i * spacing;
            e.y = yBase + g * 40;
            e.vx = baseSpeed;
            e.baseY = e.y;
            break;
        }
        wave.push(e);
      }
    }

    game.challengeTotal += wave.length;
    game.challengeWaves.push(wave);
  }
}

// Boss archetype — 4-cycle visual + attack identity.
// Mapping: stage 10/50/90 → standard, 20/60/100 → horned, 30/70 → tendril, 40/80 → crystal.
// Layered ON TOP of existing super/double semantics so HP/scale/duo logic untouched.
function archetypeFor(stage) {
  const idx = Math.max(0, Math.floor(stage / BOSS_STAGE_INTERVAL) - 1);
  return ['standard', 'horned', 'tendril', 'crystal', 'phantom', 'rune'][idx % 6];
}

function makeMegaBoss(s, opts) {
  opts = opts || {};
  const baseHp = 20 + s * 3;
  return {
    x: opts.x != null ? opts.x : BASE_W / 2,
    y: 35,
    vx: (opts.vx != null ? opts.vx : (1.5 + s * 0.12)),
    maxHp: opts.hpScale ? Math.round(baseHp * opts.hpScale) : baseHp,
    hp:    opts.hpScale ? Math.round(baseHp * opts.hpScale) : baseHp,
    frame: 0,
    frameTimer: 0,
    shootTimer: opts.shootOffset || 0,
    shootInterval: opts.super
      ? Math.max(20, Math.floor((90 - s * 4) * 0.55))
      : Math.max(28, 90 - s * 4),
    spreadCount: opts.super ? 7 : (s >= 4 ? 5 : 3),
    alive: true,
    hitFlash: 0,
    dashTimer: opts.dashOffset || 0,
    dashInterval: opts.super
      ? Math.max(70, Math.floor((240 - s * 12) * 0.7))
      : Math.max(90, 240 - s * 12),
    dashing: false,
    dashVy: 0,
    phase2: false,
    super: !!opts.super,
    scale: opts.super ? 1.5 : 1,
    archetype: opts.archetype || archetypeFor(s),
    sigTimer: 0
  };
}

function setupBossStage() {
  const s = game.stage;
  game.bossStartFrame = game.runFrames || 0;
  game.megaBosses = [];
  // Reset one-shot BOSS HP CRITICAL threshold flags per boss encounter
  game._boss25Crossed = false;
  game._boss10Crossed = false;
  // Stage 30+: single SUPER boss (1.5× scale, 2.5× HP, faster everything)
  if (s >= 30) {
    game.megaBosses.push(makeMegaBoss(s, { super: true, hpScale: 2.5, vx: 1.7 + s * 0.10 }));
  } else if (s >= 20) {
    // Stage 20-29: two bosses with split positions, lower per-boss HP for fairness
