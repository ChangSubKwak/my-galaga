    ctx.globalAlpha = 0.18 * ratio;
    ctx.fillRect(0, 6, BASE_W, 4);
    ctx.fillRect(0, BASE_H - 10, BASE_W, 4);
    ctx.fillRect(6, 0, 4, BASE_H);
    ctx.fillRect(BASE_W - 10, 0, 4, BASE_H);
    ctx.restore();
  }
  // CRT scanline overlay — very subtle horizontal bands at alpha 0.06 sit on top of the
  // playfield for a retro arcade vibe. Skip during PAUSED so paused menu reads cleanly.
  if (game.state !== STATE.PAUSED && game.state !== STATE.TITLE) {
    ctx.save();
    ctx.globalAlpha = 0.06;
    ctx.fillStyle = '#000';
    for (let y = 0; y < BASE_H; y += 2) {
      ctx.fillRect(0, y, BASE_W, 1);
    }
    ctx.restore();
  }

  // Cinematic letterbox bars on boss kill (expand → hold → retract over 60 frames).
  // Timer ticks in update() so the bars don't shrink 2× faster on 144Hz monitors.
  if (game.cinematicBars > 0) {
    const t = 60 - game.cinematicBars; // 0..60
    let h;
    if (t < 12) h = (t / 12) * 24;          // expand
    else if (t > 48) h = ((60 - t) / 12) * 24; // retract
    else h = 24;
    ctx.fillStyle = '#000';
    ctx.fillRect(-10, -10, BASE_W + 20, h);
    ctx.fillRect(-10, BASE_H - h, BASE_W + 20, h + 10);
  }

  // POST-BOSS PERK SELECT overlay — 3-card UI with 1/2/3 hints. Drawn after most
  // game elements so it reads as a modal. Auto-expires when timer hits 0.
  if ((game.perkSelectFrames || 0) > 0 && game.perkOffered) {
    const remaining = game.perkSelectFrames;
    const fadeIn = Math.min(1, (PERK_SELECT_FRAMES - remaining) / 12);
    ctx.save();
    // Dim backdrop
    ctx.globalAlpha = 0.55 * fadeIn;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
    // PERK SELECT URGENCY — pulse red border + edge bars when <1.5s remaining
    if (remaining < 90) {
      const urgPulse = 0.5 + 0.5 * Math.sin(game.animFrame * 0.4);
      ctx.globalAlpha = 0.45 * urgPulse;
      ctx.fillStyle = '#f44';
      ctx.fillRect(0, 0, BASE_W, 3);
      ctx.fillRect(0, BASE_H - 3, BASE_W, 3);
      ctx.fillRect(0, 0, 3, BASE_H);
      ctx.fillRect(BASE_W - 3, 0, 3, BASE_H);
      // Tick sfx every 30 frame
      if (game.animFrame % 30 === 0 && typeof playSound === 'function') playSound('tick');
    }
    ctx.globalAlpha = fadeIn;
    const titleCol = remaining < 90 ? '#f44' : '#fc4';
    drawRetroText('CHOOSE A PERK', BASE_W/2, 70, 11, titleCol);
    const sec = Math.ceil(remaining / 60);
    drawRetroText(sec + 'S', BASE_W/2, 84, 6, remaining < 90 ? '#f44' : COL.gray);
    // 3 cards
    const cardW = 64, cardH = 60, gap = 6;
    const totalW = cardW * 3 + gap * 2;
    const startX = (BASE_W - totalW) / 2;
    const cardY = 100;
    for (let i = 0; i < game.perkOffered.length; i++) {
      const perkId = game.perkOffered[i];
      const p = PERKS[perkId];
      if (!p) continue;
      const cx = startX + i * (cardW + gap);
      // Card background
      ctx.fillStyle = '#012';
      ctx.fillRect(cx, cardY, cardW, cardH);
      // Border in perk color
      ctx.fillStyle = p.col;
      ctx.fillRect(cx, cardY, cardW, 1);
      ctx.fillRect(cx, cardY + cardH - 1, cardW, 1);
      ctx.fillRect(cx, cardY, 1, cardH);
      ctx.fillRect(cx + cardW - 1, cardY, 1, cardH);
      // Number key indicator (top center)
      const numCol = (game.animFrame >> 3) % 2 === 0 ? p.col : '#fff';
      drawRetroText(String(i + 1), cx + cardW / 2, cardY + 8, 11, numCol);
      // Perk name (mid)
      drawRetroText(p.name, cx + cardW / 2, cardY + 28, 6, p.col);
      // Description — split into 2 lines if too long
      const words = p.desc.split(' ');
      let line1 = '', line2 = '';
      for (const w of words) {
        const candidate = line1 ? line1 + ' ' + w : w;
        if (candidate.length <= 10) line1 = candidate;
        else line2 = line2 ? line2 + ' ' + w : w;
      }
      drawRetroText(line1, cx + cardW / 2, cardY + 40, 5, '#fff');
      if (line2) drawRetroText(line2, cx + cardW / 2, cardY + 48, 5, '#fff');
    }
    drawRetroText('PRESS 1  2  3', BASE_W/2, 170, 6, COL.gray);
    ctx.restore();
  }

  // Achievement toasts (top-right slide-in)
  if (game && game.toasts && game.toasts.length > 0) {
    drawAchievementToast(game.toasts[0]);
  }

  // Volume indicator (briefly shown after a change)
  if (volIndicatorTimer > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, volIndicatorTimer / 20);
    const px = BASE_W / 2 - 30, py = 4, pw = 60, ph = 12;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = audioMuted ? '#888' : COL.cyan;
    drawRetroText(audioMuted ? 'MUTE' : 'VOL', px + 10, py + 7, 6, audioMuted ? '#888' : '#fff');
    // Bar
    const segs = 10;
    const filled = audioMuted ? 0 : Math.round(audioVolume * segs);
    for (let i = 0; i < segs; i++) {
      ctx.fillStyle = i < filled ? COL.cyan : 'rgba(0,170,255,0.2)';
      ctx.fillRect(px + 22 + i * 3.5, py + 4, 2, 4);
    }
    ctx.restore();
    // BGM/SFX state badges below the bar
    drawRetroText('BGM', px + 14, py + 16, 5, bgmEnabled ? COL.cyan : '#666');
    drawRetroText('SFX', px + 46, py + 16, 5, sfxEnabled ? COL.cyan : '#666');
  }

  // Debug overlay (F3) — top-left corner, shows FPS + entity counts
  if (debugOverlay) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(2, 56, 78, 38);
    ctx.fillStyle = COL.green;
    ctx.fillRect(2, 56, 78, 1);
    drawRetroText('DBG', 5, 62, 5, COL.green, 'left');
    drawRetroText('FPS ' + _fpsValue,    5, 70, 5, '#fff', 'left');
    if (game) {
      const e = (game.enemies || []).filter(x => x.alive).length;
      const eb = (game.enemyBullets || []).length;
      const pb = (game.bullets || []).length;
      const par = (game.itemBursts || []).length + (game.debris || []).length + (game.hitSparks || []).length;
      drawRetroText('ENM ' + e + '  EB ' + eb, 5, 78, 5, COL.cyan, 'left');
      drawRetroText('PB ' + pb + '  PRT ' + par, 5, 86, 5, COL.cyan, 'left');
    }
    ctx.restore();
  }

  // CRT scanline overlay (subtle, drawn last)
  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = '#000';
  for (let yy = 0; yy < BASE_H; yy += 2) {
    ctx.fillRect(0, yy, BASE_W, 1);
  }
  ctx.restore();

  // Vignette — subtle dark gradient at the four corners (4-pass darkening)
  ctx.save();
  ctx.globalAlpha = 0.08;
  ctx.fillStyle = '#000';
  // Top + bottom strips, fading out toward the center
  for (let i = 0; i < 12; i++) {
    ctx.globalAlpha = 0.07 * (1 - i / 12);
    ctx.fillRect(0, i, BASE_W, 1);
    ctx.fillRect(0, BASE_H - 1 - i, BASE_W, 1);
    ctx.fillRect(i, 0, 1, BASE_H);
    ctx.fillRect(BASE_W - 1 - i, 0, 1, BASE_H);
  }
  ctx.restore();
  // DEEP STAGE FOG — additional subtle fog gradient at stage 60+. Pure visual
  // atmosphere on top of standard vignette. Animated alpha for slight breathing.
  if (game && game.stage >= 60
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    ctx.save();
    const fogPulse = 0.6 + 0.4 * Math.sin(game.animFrame * 0.04);
    ctx.fillStyle = '#445';
    for (let i = 0; i < 6; i++) {
      ctx.globalAlpha = 0.04 * fogPulse * (1 - i / 6);
      ctx.fillRect(0, i, BASE_W, 1);
      ctx.fillRect(0, BASE_H - 1 - i, BASE_W, 1);
      ctx.fillRect(i, 0, 1, BASE_H);
      ctx.fillRect(BASE_W - 1 - i, 0, 1, BASE_H);
    }
    ctx.restore();
  }

  // Night mode auto-dimmer — eases eye strain between 22:00 and 06:00 local time.
  // Toggle off persistently with localStorage galagaNightOff = '1'.
  if (localStorage.getItem('galagaNightOff') !== '1') {
    const hour = new Date().getHours();
    if (hour >= 22 || hour < 6) {
      ctx.save();
      ctx.globalAlpha = 0.10;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, BASE_W, BASE_H);
      ctx.restore();
    }
  }

  ctx.restore();
}

// First-launch cinematic — three short story cards over a warp-star backdrop.
function drawIntroCinematic() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  // Hyperspace warp streaks emanating from center
  const cx = BASE_W / 2, cy = BASE_H / 2;
  ctx.save();
  for (let i = 0; i < 36; i++) {
    const seed = i * 137.5; // golden-angle offset for even spread
    const a = (seed + cinematicFrame * 0.6) % 360 * Math.PI / 180;
    const phase = (cinematicFrame * 1.6 + i * 11) % 140;
    const r1 = 8 + phase;
    const r2 = r1 + 16 + (phase / 14);
    const x1 = cx + Math.cos(a) * r1;
    const y1 = cy + Math.sin(a) * r1;
    const x2 = cx + Math.cos(a) * r2;
    const y2 = cy + Math.sin(a) * r2;
    ctx.globalAlpha = Math.max(0, 1 - phase / 140) * 0.85;
    ctx.fillStyle = i % 7 === 0 ? '#0ff' : i % 5 === 0 ? '#fc4' : '#fff';
    // Pixelated line: step from p1 to p2 plotting points
    const dx = x2 - x1, dy = y2 - y1;
    const steps = Math.max(2, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy))));
    for (let s = 0; s <= steps; s++) {
      const tt = s / steps;
      ctx.fillRect(Math.round(x1 + dx * tt), Math.round(y1 + dy * tt), 1, 1);
    }
  }
  ctx.restore();

  // Vignette dimming
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  ctx.restore();

  // Three cards. Each card: fade-in 30 frames, hold, fade-out 30 frames.
  const cards = [
    { start: 0,   lines: ['EARTH 23XX',          'ALIEN HIVE FLEET',     'INVADES THE GALAXY'], cols: ['#fc4', '#f44', '#fff'] },
    { start: 140, lines: ['STARFIGHTER GAM-42',  'LAUNCHED',             'ONE PILOT REMAINS'],  cols: ['#0cf', '#fff', '#fc4'] },
    { start: 280, lines: ['DEFEND THE GALAXY',   '',                     'PRESS ANY KEY'],      cols: ['#ff4', '#fff', '#0ff'] }
  ];
  const f = cinematicFrame;
  for (const c of cards) {
    const local = f - c.start;
    if (local < 0 || local > 140) continue;
    let alpha;
    if (local < 30) alpha = local / 30;
    else if (local > 110) alpha = Math.max(0, 1 - (local - 110) / 30);
    else alpha = 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    drawRetroText(c.lines[0], BASE_W/2, BASE_H/2 - 18, 14, c.cols[0]);
    if (c.lines[1]) drawRetroText(c.lines[1], BASE_W/2, BASE_H/2 - 2, 10, c.cols[1]);
    drawRetroText(c.lines[2], BASE_W/2, BASE_H/2 + 14, 9, c.cols[2]);
    ctx.restore();
  }

  // "ANY KEY TO SKIP" hint at bottom
  if (cinematicFrame > 30) {
    if ((cinematicFrame >> 4) % 2 === 0) {
      drawRetroText('ANY KEY TO SKIP', BASE_W/2, BASE_H - 14, 6, COL.gray);
    }
  }
}

function drawTitleScreen() {
  const t = game.animFrame;

  // TIME-OF-DAY PILOT GREETING — top-left accent. Reads system clock at draw
  // time and picks one of 5 phases: NIGHT/DAWN/MORNING/AFTERNOON/EVENING.
  // Shown only when a callsign is set (not '???') and not in callsign editor.
  if (!callsignInput.active && playerCallsign && playerCallsign !== '???') {
    const _hr = new Date().getHours();
    let _phase, _phCol;
    if (_hr < 5)       { _phase = 'LATE NIGHT'; _phCol = '#a8f'; }
    else if (_hr < 9)  { _phase = 'GOOD MORNING'; _phCol = '#fc8'; }
    else if (_hr < 12) { _phase = 'GOOD MORNING'; _phCol = '#fc4'; }
    else if (_hr < 17) { _phase = 'GOOD AFTERNOON'; _phCol = '#0cf'; }
    else if (_hr < 21) { _phase = 'GOOD EVENING'; _phCol = '#f6c'; }
    else               { _phase = 'GOOD NIGHT'; _phCol = '#48f'; }
    drawRetroText(_phase + ', [' + playerCallsign + ']', BASE_W/2, 12, 5, _phCol);
  }

  // Top decorative dashed border (animated marquee)
  ctx.fillStyle = '#0af';
  for (let i = 0; i < BASE_W; i += 8) {
    if ((i + (t * 2)) % 16 < 4) {
      ctx.fillRect(i, 30, 4, 1);
      ctx.fillRect(i, 78, 4, 1);
    }
  }

  // GAME COMPLETE STAR — if user has ever beaten stage 80, show gold ★ above
  // the logo as a permanent badge of honor. Read from localStorage.
  try {
    const _gcCnt = parseInt(localStorage.getItem('galagaGameCompleteCount') || '0', 10) || 0;
    if (_gcCnt > 0) {
      const _gcBlink = (t >> 3) % 4 !== 0 ? '#fc4' : '#ff8';
      const _gcLabel = _gcCnt >= 5 ? '★ ★ ★' : _gcCnt >= 2 ? '★ ★' : '★';
      drawRetroText(_gcLabel, BASE_W/2, 40, 6, _gcBlink, 'center');

  } catch (e) {}
  // ALL SHIPS USED BADGE — if user has piloted all 4 ships, show 'ALL SHIPS'
  // ribbon. Reads galagaShipsUsed set.
  try {
    const _shipsUsed = JSON.parse(localStorage.getItem('galagaShipsUsed') || '[]');
    if (Array.isArray(_shipsUsed) && _shipsUsed.length >= 4) {
      drawRetroText('ALL SHIPS', BASE_W/2, 46, 4, '#0cf', 'center');
    }
  } catch (e) {}
  // ALL DIFFICULTIES USED BADGE — if user has tried easy/normal/hard, show.
  try {
    const _difsUsed = JSON.parse(localStorage.getItem('galagaDifficultiesUsed') || '[]');
    if (Array.isArray(_difsUsed) && _difsUsed.length >= 3) {
      drawRetroText('ALL DIFFICULTIES', BASE_W/2, 51, 4, '#f88', 'center');
    }
  } catch (e) {}
  // ALL BIOMES SEEN BADGE — if user has visited all 8 biomes, show.
  try {
    const _bsBadge = JSON.parse(localStorage.getItem('galagaBiomesSeen') || '[]');
    if (Array.isArray(_bsBadge) && _bsBadge.length >= 8) {
      drawRetroText('ALL BIOMES', BASE_W/2, 56, 4, '#9ef', 'center');
    }
  } catch (e) {}
  // BESTIARY COMPLETE BADGE — if dexUnlocked has all enemy types
  if (typeof dexUnlocked !== 'undefined' && dexUnlocked.size >= 8) {
    drawRetroText('BESTIARY', BASE_W/2, 61, 4, '#f6f', 'center');
  }
  // 100% ACHIEVEMENT BADGE — if all achievements unlocked, pulsing gold.
  if (typeof unlockedAchievements !== 'undefined' && typeof ACHIEVEMENTS !== 'undefined'
      && unlockedAchievements.size >= Object.keys(ACHIEVEMENTS).length) {
    const _achBlink = (t >> 2) % 4 !== 0 ? '#fc4' : '#ff8';
    drawRetroText('100% ★', BASE_W/2, 66, 5, _achBlink, 'center');
  }
  // PARRY MASTER BADGE — when lifetime parryStreakBest >= 10
  try {
    const _csNp = (typeof loadCumStats === 'function') ? loadCumStats(false) : {};
    const _csCp = (typeof loadCumStats === 'function') ? loadCumStats(true) : {};
    const _psPm = Math.max(_csNp.parryStreakBest || 0, _csCp.parryStreakBest || 0);

      drawRetroText('PARRY MASTER', BASE_W/2, 71, 4, '#0cf', 'center');

  } catch (e) {}
  // COMBO LEGEND BADGE — galagaMaxComboEver >= 50
  try {
    const _cbEver = parseInt(localStorage.getItem('galagaMaxComboEver') || '0', 10) || 0;
    if (_cbEver >= 50) {
      const _clCol = _cbEver >= 100 ? '#fc4' : '#0ff';
      const _clLabel = _cbEver >= 100 ? 'COMBO GOD' : 'COMBO LEGEND';
      drawRetroText(_clLabel, BASE_W/2, 76, 4, _clCol, 'center');
    }
  } catch (e) {}
  // COMPOSITE COMPLETION % — weighted aggregate via shared helper.
  if (typeof computeCompositeCompletion === 'function') {
    const _comp = computeCompositeCompletion();
    if (_comp >= 5) {
      const _cmpCol = _comp >= 80 ? '#fc4' : _comp >= 50 ? '#0ff' : _comp >= 20 ? '#0f8' : '#888';
      drawRetroText('CMPL ' + _comp + '%', BASE_W/2, 94, 4, _cmpCol, 'center');
      // Mini bar under text
      ctx.save();
      const _cbW = 40, _cbX = BASE_W/2 - _cbW/2, _cbY = 99;
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(_cbX, _cbY, _cbW, 1);
      ctx.fillStyle = _cmpCol;
      ctx.globalAlpha = 0.8;
      ctx.fillRect(_cbX, _cbY, Math.round(_cbW * _comp / 100), 1);
      ctx.restore();
    }
  }
  // PERKS DOTS — 10 dots showing perks tried at least once (lifetime).
  try {
    const _pkRaw = localStorage.getItem('galagaPerkPicks') || '{}';
    const _pkTot = JSON.parse(_pkRaw);
    if (typeof PERK_IDS !== 'undefined' && PERK_IDS && PERK_IDS.length > 0) {
      const _hasAny = PERK_IDS.some(id => (_pkTot[id] || 0) >= 1);
      if (_hasAny) {
        const _pY = 72;
        const _pStartX = BASE_W/2 - (PERK_IDS.length * 4) / 2;
        ctx.save();
        for (let _pi = 0; _pi < PERK_IDS.length; _pi++) {
          const _pId = PERK_IDS[_pi];
          const _pCol = (typeof PERKS !== 'undefined' && PERKS[_pId]) ? PERKS[_pId].col : '#fff';
          ctx.globalAlpha = (_pkTot[_pId] || 0) >= 1 ? 0.85 : 0.20;
          ctx.fillStyle = _pCol;
          ctx.fillRect(_pStartX + _pi * 4, _pY, 2, 2);
        }
        ctx.restore();
      }
    }
  } catch (e) {}
  // DIFFICULTIES DOTS — 3 dot row (green/white/red) above ships
  try {
    const _dRaw = localStorage.getItem('galagaDifficultiesUsed') || '[]';
    const _dArr = JSON.parse(_dRaw);
    if (Array.isArray(_dArr) && _dArr.length > 0) {
      const _dOrd = ['easy', 'normal', 'hard'];
      const _dCols = ['#0f8', '#fff', '#f44'];
      const _dSet = new Set(_dArr);
      const _dY = 76;
      const _dStartX = BASE_W/2 - 4;
      ctx.save();
      for (let _di = 0; _di < 3; _di++) {
        ctx.globalAlpha = _dSet.has(_dOrd[_di]) ? 0.85 : 0.20;
        ctx.fillStyle = _dCols[_di];
        ctx.fillRect(_dStartX + _di * 4, _dY, 2, 2);
      }
      ctx.restore();
    }
  } catch (e) {}
  // SHIPS DOTS — 4 dot row (color per ship) above bestiary
  try {
    const _spRaw = localStorage.getItem('galagaShipsUsed') || '[]';
    const _spArr = JSON.parse(_spRaw);
    if (Array.isArray(_spArr) && _spArr.length > 0) {
      const _spOrd = (typeof SHIP_ORDER !== 'undefined') ? SHIP_ORDER : ['default','scout','bruiser','spark'];
      const _spSet = new Set(_spArr);
      const _sY = 80;
      const _sStartX = BASE_W/2 - 6;
      ctx.save();
      for (let _si = 0; _si < _spOrd.length; _si++) {
        const _sk = _spOrd[_si];
        const _sCol = (typeof SHIPS !== 'undefined' && SHIPS[_sk]) ? SHIPS[_sk].color : '#fff';
        ctx.globalAlpha = _spSet.has(_sk) ? 0.85 : 0.20;
        ctx.fillStyle = _sCol;
        ctx.fillRect(_sStartX + _si * 4, _sY, 2, 2);
      }
      ctx.restore();
    }
  } catch (e) {}
  // BESTIARY DOTS — 8 small enemy-type dots beneath badge stack
  if (typeof dexUnlocked !== 'undefined' && dexUnlocked.size > 0
      && typeof ENEMY_INFO !== 'undefined') {
    const _eOrder = ['bee', 'butterfly', 'boss', 'mirror', 'splitter',
                     'shielded', 'ufo', 'kamikaze'];
    const _eY = 84;
    const _eStartX = BASE_W/2 - 14;
    ctx.save();
    for (let _ei = 0; _ei < 8; _ei++) {
      const _et = _eOrder[_ei];
      const _eCol = (ENEMY_INFO[_et] && ENEMY_INFO[_et].col) || '#fff';
      ctx.globalAlpha = dexUnlocked.has(_et) ? 0.85 : 0.20;
      ctx.fillStyle = _eCol;
      ctx.fillRect(_eStartX + _ei * 4, _eY, 2, 2);
    }
    ctx.restore();
  }
  // BIOMES DOTS — 8 small biome-colored dots beneath badge stack. Filled when
  // that biome has been visited, dim otherwise. At-a-glance exploration visual.
  try {
    const _bdRaw = localStorage.getItem('galagaBiomesSeen') || '[]';
    const _bdArr = JSON.parse(_bdRaw);
    if (Array.isArray(_bdArr) && _bdArr.length > 0) {
      const _order = ['planet', 'dawn', 'asteroid', 'ice', 'gasGiant', 'corona', 'blackhole', 'starfield'];
      const _seen = new Set(_bdArr);
      const _dY = 88;
      const _dStartX = BASE_W/2 - 14;
      ctx.save();
      for (let _di = 0; _di < 8; _di++) {
        const _bd = _order[_di];
        const _bdCol = (typeof BIOME_NAMES !== 'undefined' && BIOME_NAMES[_bd]) ? BIOME_NAMES[_bd].col : '#fff';
        ctx.globalAlpha = _seen.has(_bd) ? 0.85 : 0.20;
        ctx.fillStyle = _bdCol;
        ctx.fillRect(_dStartX + _di * 4, _dY, 2, 2);
      }
      ctx.restore();
    }
  } catch (e) {}
  // MARATHONER BADGE — longest single run tier (15/30/60 min)
  try {
    const _csNm = (typeof loadCumStats === 'function') ? loadCumStats(false) : {};
    const _csCm = (typeof loadCumStats === 'function') ? loadCumStats(true) : {};
    const _lr = Math.max(_csNm.longestRun || 0, _csCm.longestRun || 0);
    if (_lr >= 54000) { // 15 min+
      const _mLabel = _lr >= 216000 ? 'IRON PILOT' : _lr >= 108000 ? 'MARATHONER' : 'LONG RUNNER';
      const _mCol = _lr >= 216000 ? '#fc4' : _lr >= 108000 ? '#0ff' : '#0f8';
      drawRetroText(_mLabel, BASE_W/2, 81, 4, _mCol, 'center');
    }
  } catch (e) {}
  // Animated rainbow GALAGA logo with per-letter bobbing
  const letters = 'GALAGA'.split('');
  const palette = ['#f44', '#fa0', '#ff4', '#4f4', '#4af', '#f4f'];
  ctx.save();
  ctx.font = 'bold 28px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const charW = ctx.measureText('G').width;
  const totalW = charW * letters.length;
  let lx = BASE_W / 2 - totalW / 2 + charW / 2;
  for (let i = 0; i < letters.length; i++) {
    const bob = Math.sin(t * 0.1 + i * 0.7) * 3;
    const ci = (i + Math.floor(t * 0.04)) % palette.length;
    ctx.shadowColor = palette[ci];
    ctx.shadowBlur = 8;
    ctx.fillStyle = palette[ci];
    ctx.fillText(letters[i], lx, 54 + bob);
    lx += charW;
  }
  ctx.restore();

  // Demo enemy flyby across the band between borders
  const flybyTypes = [drawBee, drawButterfly, drawBoss];
  for (let i = 0; i < 4; i++) {
    const cycle = 280;
    const phase = (t + i * 70) % cycle;
    const fx = (phase / cycle) * (BASE_W + 40) - 20;
    const fy = 100 + Math.sin(phase * 0.04 + i * 1.3) * 6;
    const fn = flybyTypes[i % flybyTypes.length];
    if (fn === drawBoss) fn(fx, fy, t >> 4, false);
    else fn(fx, fy, t >> 4);
  }

  // Score legend
  drawBee(BASE_W/2 - 50, 140, t >> 4);
  drawRetroText('= 50 PTS', BASE_W/2 + 10, 140, 8, COL.white, 'left');
  drawButterfly(BASE_W/2 - 50, 160, t >> 4);
  drawRetroText('= 80 PTS', BASE_W/2 + 10, 160, 8, COL.white, 'left');
  drawBoss(BASE_W/2 - 50, 182, t >> 4, false);
  drawRetroText('= 150 PTS', BASE_W/2 + 10, 182, 8, COL.white, 'left');

  if (game.titleBlink % 60 < 40) {
    const sCol = challengeModeRequested ? COL.red : dailyModeRequested ? COL.green : COL.cyan;
    drawRetroText('PRESS SPACE TO START', BASE_W/2, 190, 8, sCol);
  }
  // LAST RUN SUMMARY — small one-line previous run summary at bottom-center
  // so players can compare new attempts. Hidden when first ever run.
  try {
    const _lrRaw = localStorage.getItem('galagaLastRun');
    if (_lrRaw && !callsignInput.active) {
      const _lr = JSON.parse(_lrRaw);
      if (_lr && _lr.stage > 0) {
        const _lrStr = 'LAST  S' + _lr.stage + '  ' + fmtScore(_lr.score) + '  C×' + _lr.combo;
        drawRetroText(_lrStr, BASE_W/2, BASE_H - 14, 4, '#555', 'center');
        if (_lr.wasPb) {
          const _pbB = (t >> 2) % 2 === 0 ? '#fc4' : '#ff8';
          drawRetroText('★ PB', BASE_W/2 + 60, BASE_H - 14, 4, _pbB, 'left');
        }
      }
    }
  } catch (e) {}
  // INPUT DEVICE ICON — detect gamepad / touch / keyboard at draw time.
  // Small label corner-bottom-right. Defaults to KBD when no other signal.
  {
    let _dev = 'KBD';
    if ('ontouchstart' in window) _dev = 'TCH';
    try {
      if (navigator.getGamepads) {
        const _gps = navigator.getGamepads();
        for (const _gp of _gps) { if (_gp) { _dev = 'GPD'; break; } }
      }
    } catch (e) {}
    drawRetroText(_dev, BASE_W - 4, BASE_H - 4, 4, '#666', 'right');
  }
  // BGM TRACK PEEK — show current track id at bottom-left if active. Helps
  // confirm audio is wired correctly and surfaces variety for music nerds.
  if (typeof bgmTrack === 'string' && bgmTrack) {
    drawRetroText('♪ ' + bgmTrack.toUpperCase(), 4, BASE_H - 4, 4, '#555', 'left');
  }
  // TITLE TIPS ROTATION — bottom hint area cycles gameplay reminders every
  // 216 frames (3.6s). Hidden during callsign editor. Pure educational nudge.
  if (!callsignInput.active) {
    const _titleTips = [
      'SHIFT TO DASH',
      'DASH THRU BULLETS = PARRY',
      'CHAIN 5 KILLS = X1.5 SCORE',
      'GRAB S / N / P TO POWER UP',
      'BOSS EVERY 10 STAGES',
      'CHALLENGE STAGE EVERY 4',
      'TAB FOR STATS',
      'P / ESC TO PAUSE',
      'U TO EDIT CALLSIGN'
    ];
    const _ttIdx = Math.floor(game.animFrame / 216) % _titleTips.length;
    const _ttLocal = (game.animFrame % 216);
    const _ttAlpha = _ttLocal < 30 ? _ttLocal / 30
                  : _ttLocal > 186 ? Math.max(0, 1 - (_ttLocal - 186) / 30)
                  : 1;
    ctx.save();
    ctx.globalAlpha = _ttAlpha * 0.65;
    drawRetroText(_titleTips[_ttIdx], BASE_W/2, 260, 5, '#888');
    ctx.restore();
  }
  // PILOT CALLSIGN — shown below the title, swaps to live editor when active.
  // Editor: 3 letter boxes, current slot highlighted + arrow hints.
  if (callsignInput.active) {
    drawRetroText('CALLSIGN', BASE_W/2, 220, 6, '#fc4');
    const cs = callsignInput.letters;
    const slotW = 12, gap = 4;
    const totalW = slotW * 3 + gap * 2;
    const startX = BASE_W/2 - totalW/2;
    for (let i = 0; i < 3; i++) {
      const bx = startX + i * (slotW + gap);
      const isCur = i === callsignInput.pos;
      // Slot frame
      ctx.fillStyle = isCur ? '#fc4' : '#fff';
      ctx.fillRect(bx, 226, slotW, 1);
      ctx.fillRect(bx, 226 + 11, slotW, 1);
      // Letter
      const flick = isCur && (game.animFrame >> 3) % 2 === 0;
      drawRetroText(cs[i], bx + slotW/2, 228, 9, flick ? '#fff' : (isCur ? '#fc4' : '#fff'));
    }
    drawRetroText('UP DN  L R   ENTER OK   ESC', BASE_W/2, 244, 5, COL.gray);
  } else {
    drawRetroText('PILOT [' + playerCallsign + ']', BASE_W/2, 222, 6, callsignColor());
    if ((game.animFrame >> 5) % 2 === 0) {
      drawRetroText('U CHANGE   O COLOR', BASE_W/2, 230, 5, COL.gray);
    }
    // TIME-OF-DAY GREETING — small in-world salutation tied to the player's local
    // clock. Cycles between four watch windows so the title feels live across
    // a day cycle. Drawn faded grey so it sits as marginal flavor.
    {
      const hour = new Date().getHours();
      let greet;
      if (hour < 5)        greet = 'NIGHT WATCH';
      else if (hour < 12)  greet = 'MORNING WATCH';
      else if (hour < 18)  greet = 'AFTERNOON SHIFT';
      else if (hour < 23)  greet = 'EVENING WATCH';
      else                 greet = 'DEEP NIGHT';
      drawRetroText('— ' + greet + ' —', BASE_W/2, 238, 4, '#888');
    }
  }
  // (First-time help nudge moved into the bottom controls hint to avoid overlapping top-score row 5)
  // Compact mode-toggle row: three small labels side-by-side at y=200 (size 5)
  {
    const cOn = challengeModeRequested;
    const dOn = dailyModeRequested;
    const cCol = cOn ? COL.red   : COL.gray;
    const dCol = dOn ? COL.green : COL.gray;
    const gCol = difficultyMode === 'hard' ? COL.red : difficultyMode === 'easy' ? COL.green : COL.cyan;
    // Append the daily-streak day count inline so it doesn't collide with PRESS SPACE.
    let dLabel;
    if (dOn) {
      let days = 0;
      try { days = JSON.parse(localStorage.getItem('galagaDailyDays') || '[]').length; } catch (e) {}
      dLabel = 'D:' + dailyLabel().slice(2) + (days > 0 ? '·' + days + 'D' : '');
    } else {
      dLabel = 'D:OFF';
    }
    drawRetroText(cOn ? 'C:CHAL'  : 'C:OFF',  BASE_W/2 - 56, 200, 5, cCol);
    drawRetroText(dLabel,                     BASE_W/2,      200, 5, dCol);
    drawRetroText('G:' + difficultyMode.slice(0, 4).toUpperCase(), BASE_W/2 + 56, 200, 5, gCol);
  }
  // Start-from-stage selector — only shown when at least one milestone has been cleared (compact, same row group)
  if (highestCheckpoint > 0) {
    const startCol = startStageRequested > 1 ? COL.yellow : COL.gray;
    drawRetroText('R:START STAGE ' + startStageRequested, BASE_W/2, 208, 5, startCol);
  }
  // Ship loadout indicator
  {
    const ship = shipAttrs();
    const tx = BASE_W/2 - 50, ty = 116;
    // Animated change pulse: scale ship + colored ring expanding outward
    if (shipChangeFrame > 0) {
      const t = 30 - shipChangeFrame;
      const scale = 1 + (1 - shipChangeFrame / 30) * 0.5 * (shipChangeFrame > 18 ? 1 : 0)
                  + (shipChangeFrame <= 18 ? Math.max(0, shipChangeFrame / 18) * 0.5 : 0);
      // Expanding ring
      ctx.save();
      ctx.globalAlpha = Math.max(0, shipChangeFrame / 30) * 0.7;
      ctx.strokeStyle = ship.color;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(tx, ty, 4 + t * 0.8, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(tx, ty, 4 + t * 1.4, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.translate(tx, ty);
      ctx.scale(scale, scale);
      drawPlayer(0, 0, ship.color);
      ctx.restore();
    } else {
      drawPlayer(tx, ty, ship.color);
    }
    // When daily mode is on, show LOCKED prefix and force-display the daily ship
    const lockedDaily = dailyModeRequested;
    const dailyShip = lockedDaily ? dailyShipFor(dailySeed()) : null;
    const showName = lockedDaily ? (SHIPS[dailyShip] ? SHIPS[dailyShip].name : ship.name) : ship.name;
    const labelPrefix = lockedDaily ? '[DAILY] ' : 'V  ';
    drawRetroText(labelPrefix + showName, BASE_W/2, ty, 7, lockedDaily ? COL.green : ship.color);
    // Stat tag
    const tag = selectedShip === 'scout'   ? 'FAST  3 SHOTS'
              : selectedShip === 'bruiser' ? 'TANKY +DAMAGE'
              : selectedShip === 'spark'   ? 'SPEED +35%'
                                            : 'BALANCED';
    drawRetroText(tag, BASE_W/2, 124, 5, COL.gray);
    // SHIP MASTERY — pull per-ship stats (kills/best stage). Cycles into view a second
    // after ship change so it doesn't clutter immediate ship-cycle feedback.
    try {
      const masteryRaw = localStorage.getItem('galagaShipMastery');
      const mastery = masteryRaw ? JSON.parse(masteryRaw) : {};
      const m = mastery[selectedShip];
      if (m && (m.runs || 0) > 0) {
        const masteryLine = 'MASTERY  ' + fmtScore(m.kills || 0) + ' KILLS  S' + (m.bestStage || 0);
        drawRetroText(masteryLine, BASE_W/2, 131, 5, '#fc4');
      }
    } catch (e) {}
  }

  // Top 5 scores — title shows whichever list matches the current toggle
  const showMode = dailyModeRequested ? 'daily'
                : challengeModeRequested ? 'challenge'
                : 'normal';
  const topHeader = showMode === 'daily'     ? 'TOP SCORES (DAILY)'
                  : showMode === 'challenge' ? 'TOP SCORES (CHALLENGE)'
                  : 'TOP SCORES';
  const topHeaderCol = showMode === 'daily' ? COL.green : COL.red;
  drawRetroText(topHeader, BASE_W/2, 218, 6, topHeaderCol);
  // DAILY MODIFIER preview — shows today's deterministic modifier so players know
  // what they're signing up for before pressing Start.
  if (dailyModeRequested) {
    // Re-derive without game context (TITLE)
    const seed = (typeof dailySeed === 'function' ? dailySeed() : 0) | 0;
    const dailyMod = STAGE_MUTATIONS[seed % STAGE_MUTATIONS.length];
    if (dailyMod) {
      const blink = (game.animFrame >> 3) % 2 === 0 ? dailyMod.color : '#fff';
      drawRetroText('TODAY: ' + dailyMod.label, BASE_W/2, 212, 5, blink);
    }
    // DAILY STREAK badge — shows consecutive-day count when > 0
    const streak = computeDailyStreak();
    if (streak >= 1) {
      const streakCol = streak >= 30 ? '#fc4' : streak >= 7 ? '#0f8' : '#cfc';
      drawRetroText('STREAK ' + streak + ' DAY' + (streak !== 1 ? 'S' : ''), BASE_W/2, 206, 5, streakCol);
    }
    // DAILY SEED CODE — shareable 4-char hash of today's date so players can
    // confirm they're comparing the same daily run with friends.
    if (typeof dailySeedCode === 'function') {
      drawRetroText('SEED  ' + dailySeedCode(), BASE_W/2, 218, 4, '#f6f');
    }
    // DAILY MISSION preview — today's mission target + completion state
    if (typeof dailyMission === 'function') {
      const m = dailyMission();
      const done = (typeof isDailyMissionDoneToday === 'function') && isDailyMissionDoneToday();
      const mLabel = (done ? 'DONE: ' : 'MISSION: ') + m.label;
      const mCol = done ? '#0f8' : '#fc4';
      drawRetroText(mLabel, BASE_W/2, 224, 4, mCol);
    }
    // DAILY RESET COUNTDOWN — hours/minutes until local midnight rollover
    {
      const _now = new Date();
      const _next = new Date(_now.getFullYear(), _now.getMonth(), _now.getDate() + 1, 0, 0, 0, 0);
      const _ms = _next.getTime() - _now.getTime();
      const _hr = Math.floor(_ms / 3600000);
      const _mn = Math.floor((_ms % 3600000) / 60000);
      const _cdStr = 'RESET IN ' + _hr + 'H ' + String(_mn).padStart(2, '0') + 'M';
      drawRetroText(_cdStr, BASE_W/2, 230, 4, '#888');
    }
  }
  const topList = loadTopScores(showMode);
  const startY = 226;
  for (let i = 0; i < 5; i++) {
    const e = topList[i];
    const rowY = startY + i * 7;
    const rowCol = i === 0 ? COL.yellow : (i < 3 ? '#fff' : COL.gray);
    if (e) {
      // SELF HIGHLIGHT — if this entry's callsign matches the current pilot, draw
      // a soft yellow background band and a ▶ marker. Makes self-identification
      // immediate on the leaderboard.
      const isMine = e.callsign && e.callsign === playerCallsign;
      if (isMine) {
        ctx.save();
        ctx.globalAlpha = 0.18 + 0.08 * Math.sin(game.animFrame * 0.18);
        ctx.fillStyle = '#fc4';
        ctx.fillRect(BASE_W/2 - 72, rowY - 3, 152, 7);
        ctx.restore();
        // ▶ marker on the left
        drawRetroText('>', BASE_W/2 - 73, rowY, 6, '#fc4', 'left');
      }
      // Crown for #1 (red crown for challenge mode king)
      if (i === 0) drawCrown(BASE_W/2 - 70, rowY, showMode === 'daily' ? COL.green : showMode === 'challenge' ? COL.red : COL.yellow);
      drawRetroText('#' + (i + 1), BASE_W/2 - 62, rowY, 6, rowCol, 'left');
      // CALLSIGN — 3-letter monogram (or '???' for legacy entries pre-callsign system)
      const cs = e.callsign || '???';
      const csCol = cs === '???' ? COL.gray : (isMine ? '#ff4' : '#fc4');
      drawRetroText(cs, BASE_W/2 - 44, rowY, 6, csCol, 'left');
      drawRetroText(fmtScore(e.score), BASE_W/2 - 22, rowY, 6, rowCol, 'left');
      drawRetroText('S' + e.stage, BASE_W/2 + 26, rowY, 6, rowCol, 'left');
      if (typeof e.accuracy === 'number' && e.accuracy > 0) {
        drawRetroText(e.accuracy + '%', BASE_W/2 + 46, rowY, 6, rowCol, 'left');
      }
    } else {
      drawRetroText('#' + (i + 1), BASE_W/2 - 62, rowY, 6, rowCol, 'left');
      drawRetroText('---', BASE_W/2 - 22, rowY, 6, rowCol, 'left');
    }
  }

  // Controls hint (two compact lines at the bottom)
  drawRetroText('ARROWS MOVE   SPACE FIRE', BASE_W/2, BASE_H - 14, 6, COL.gray);
  // First-time players get a brighter color on the H/I keys in this row to draw the eye
  const firstTime = (unlockedAchievements ? unlockedAchievements.size : 0) === 0;
  drawRetroText('P PAUSE  H HELP  I STATS  M MUTE', BASE_W/2, BASE_H - 6, 6, firstTime ? COL.cyan : COL.gray);
  // Gamepad connection indicator (small green dot bottom-right) — pulses
  if (navigator.getGamepads) {
    const pads = navigator.getGamepads();
    let connected = false;
    for (const p of pads) if (p) { connected = true; break; }
    if (connected) {
      const blink = (game.animFrame >> 5) % 2 === 0;
      ctx.fillStyle = blink ? COL.green : '#080';
      ctx.fillRect(BASE_W - 30, BASE_H - 22, 2, 2);
      drawRetroText('GP', BASE_W - 16, BASE_H - 22, 5, '#888', 'right');
    }
  }
  // Tiny build/version mark + total achievements unlocked indicator
  drawRetroText('GAM-42', BASE_W - 4, BASE_H - 22, 5, '#446', 'right');
  const ach = unlockedAchievements ? unlockedAchievements.size : 0;
  const total = Object.keys(ACHIEVEMENTS).length;
  drawRetroText('ACH ' + ach + '/' + total, 4, BASE_H - 22, 5, '#446', 'left');
  // Setting-change toasts (DIFFICULTY / SHAKE / RUMBLE / COLORBLIND / etc.) — visible feedback
  // when the player toggles a global setting from the title screen.
  if (game.floatTexts) for (const ft of game.floatTexts) drawFloatText(ft);
}

// Boss name table — adds identity to each milestone boss. Cycles with `% length` so
// stages beyond the table reuse names instead of crashing or showing 'undefined'.
const BOSS_NAMES = [
  'THE OVERSEER',     // 10
  'TWIN SOVEREIGNS',  // 20 (double)
  'APEX',             // 30 (super)
  'THE DEVOURER',     // 40
  'IRON SWARM',       // 50 (super or double)
  'NULLIFIER',        // 60
  'OBSIDIAN PRIME',   // 70
  'THE FINAL WALL'    // 80+
];
function bossNameFor(stage) {
  const idx = Math.floor(stage / BOSS_STAGE_INTERVAL) - 1;
  if (idx < 0) return 'BOSS';
  return BOSS_NAMES[idx % BOSS_NAMES.length];
}

// BOSS TAUNTS — archetype-tuned dialogue triggered at key moments (phase 2 entry,
// last 25% HP, first dash dive). Each archetype has its own voice: standard is
// commanding, horned is enraged, tendril is sinister, crystal is cold.
// Triggers stagger themselves via taunt cooldown so phase-2 + low-HP back-to-back
// don't both fire.
const BOSS_TAUNTS = {
  standard: {
    phase2:  'YOU FIGHT WELL.',
    lowHp:   'THIS IS NOT THE END.',
    dash:    'INCOMING.',
    intro:   'I HAVE WAITED.',
    death:   'WE WILL RETURN.'
  },
  horned: {

    lowHp:   'I REFUSE TO FALL.',
    dash:    'BREAK.',
    intro:   'YOU DARED COME HERE.',
    death:   'IMPOSSIBLE...'
  },
  tendril: {
    phase2:  'I HAVE MORE FORMS.',
    lowHp:   'YOU CANNOT KILL WHAT WAITS.',
    dash:    'REACH.',
    intro:   'THE DEPTHS GREET YOU.',
    death:   'I SLEEP, NOT DIE.'
  },
  crystal: {
    phase2:  'YOUR CALCULATIONS ARE WRONG.',
    lowHp:   'DATA INSUFFICIENT.',
    dash:    'COMPUTE.',
    intro:   'PROBABILITY: ZERO.',
    death:   'ANOMALY DETECTED.'
  }
};
function tauntFor(archetype, situation) {
  const set = BOSS_TAUNTS[archetype] || BOSS_TAUNTS.standard;
  return set[situation] || null;
}
// Trigger a taunt — sets the boss-scoped speech state. Cooldown 90 frames before
// the NEXT taunt fires so phase2 + lowHp consecutive triggers don't stack.
function triggerBossTaunt(mb, situation) {
  if (!mb || !mb.alive) return;
  if ((mb.tauntCooldown || 0) > 0) return;
  const text = tauntFor(mb.archetype, situation);
  if (!text) return;
  mb.tauntText = text;
  mb.tauntLife = 90;        // ~1.5s display
  mb.tauntMax  = 90;
  mb.tauntCooldown = 60;    // cool down before next taunt
}

function pickEpitaph(stage, acc) {
  let bucket;
  if (stage >= 50) bucket = 'voidwalker';
  else if (stage >= 30) bucket = 'apex';
  else if (stage >= 20) bucket = 'deepDive';
  else if (stage >= 10) bucket = 'veteran';
  else if (stage >= 5)  bucket = 'scout';
  else                  bucket = 'rookie';
  const arr = EPITAPHS[bucket];
  return arr[Math.floor(Math.random() * arr.length)];
}

// RUN HIGHLIGHTS — produce up to 3 "best moments" lines summarizing the run.
// Candidates are scored by impressiveness; top 3 picked for compact display.
// All values come from stats already tracked elsewhere — no new bookkeeping needed.
function pickRunHighlights() {
  const out = [];
  const s = game.stats || {};
  const acc = (s.shotsFired || 0) === 0 ? 0 : Math.round((s.shotsHit / s.shotsFired) * 100);
  const cBest = game.comboBest || 0;
  const parries = game.parryCount || 0;
  const bosses = game.bossKills || 0;
  const stages = s.maxStage || 0;
  const rescues = game.selfRescueCount || 0;
  const dual = !!game.dualFighter;

  const elites = game.eliteKills || 0;

  if (cBest >= 5)         out.push({ label: 'MAX COMBO',     value: String(cBest),       prio: cBest * 4, col: '#0ff' });
  if (parries >= 3)       out.push({ label: 'BULLETS PARRIED', value: String(parries),  prio: parries * 6, col: '#0ff' });
  const parryBest = game.parryStreakBest || 0;
  if (parryBest >= 3)     out.push({ label: 'PARRY CHAIN MAX', value: 'x' + parryBest,   prio: parryBest * 10, col: '#0cf' });
  const aceBest = game.aceStreakBest || 0;
  if (aceBest >= 3)       out.push({ label: 'ACE STREAK MAX', value: 'x' + aceBest,      prio: aceBest * 15, col: '#fc4' });
  const mkBest = game.multiKillBest || 0;
  if (mkBest >= 3)        out.push({ label: 'MULTIKILL MAX', value: 'x' + mkBest,        prio: mkBest * 20, col: '#fc4' });
  const pwRun = game.perfectWavesRun || 0;
  if (pwRun >= 1)         out.push({ label: 'PERFECT WAVES', value: String(pwRun),       prio: pwRun * 12, col: '#fc4' });
  const ckRun = game.critKillsRun || 0;
  if (ckRun >= 5)         out.push({ label: 'CRIT KILLS',    value: String(ckRun),       prio: ckRun * 5, col: '#fc4' });
  if (elites >= 1)        out.push({ label: 'ELITES SLAIN',  value: String(elites),       prio: elites * 18, col: '#f44' });
  const sGr = game.runSGrades || 0;
  if (sGr >= 1)           out.push({ label: 'S GRADES',      value: '★ ' + sGr,           prio: sGr * 40, col: '#fc4' });
  const untRun = game.runUntouched || 0;
  if (untRun >= 1)        out.push({ label: 'UNTOUCHED',     value: String(untRun),       prio: untRun * 28, col: '#0ff' });
  const lsRun = game.runLastStands || 0;
  if (lsRun >= 1)         out.push({ label: 'LAST STANDS',   value: String(lsRun),        prio: lsRun * 35, col: '#f44' });
  const ppRun = game.perfectParries || 0;
  if (ppRun >= 1)         out.push({ label: 'PERFECT PARRY', value: String(ppRun),        prio: ppRun * 22, col: '#fc4' });
  // PICKUP FAVORITE — most-collected powerup type this run (needs >= 3 of it)
  if (game.pickupTypesRun) {
    let _favT = null, _favC = 0;
    for (const _k in game.pickupTypesRun) {
      const _v = game.pickupTypesRun[_k] || 0;
      if (_v > _favC) { _favC = _v; _favT = _k; }
    }
    if (_favT && _favC >= 3) {
      const _favLbl = { S:'SHOT', N:'NUKE', P:'PIERCE', T:'SLOW', R:'RAPID',
                        W:'WAVE', H:'HOMING', L:'LASER', B:'BOMB', E:'SHIELD' }[_favT] || _favT;
      const _favCol = { S:'#0df', N:'#1e6', P:'#e3e', T:'#5af', R:'#fc4',
                        W:'#f6a', H:'#0cf', L:'#f6c', B:'#f44', E:'#4f8' }[_favT] || '#fff';
      out.push({ label: 'FAVORITE', value: _favLbl + ' x' + _favC, prio: 65, col: _favCol });
    }
  }
  if (stages >= 3)        out.push({ label: 'STAGES CLEARED', value: String(stages),     prio: stages * 8, col: '#fc4' });
  if (bosses >= 1)        out.push({ label: 'BOSSES DOWN',    value: String(bosses),     prio: bosses * 60, col: '#f8a' });
  if (rescues >= 1)       out.push({ label: 'SELF RESCUE',    value: String(rescues),    prio: rescues * 30, col: '#fc4' });
  if (dual)               out.push({ label: 'DUAL FIGHTER',   value: 'GAINED',           prio: 70, col: '#ff4' });
  if (acc >= 70 && (s.shotsFired || 0) > 50) {
    out.push({ label: 'ACCURACY',    value: acc + '%',                                     prio: acc, col: acc >= 90 ? '#0f8' : '#0ff' });
  }
  // DAILY STREAK — only meaningful when playing daily mode
  if (game.dailyMode) {
    const streak = computeDailyStreak();
    if (streak >= 2) {
      out.push({ label: 'DAILY STREAK',  value: streak + ' DAYS', prio: streak * 10 + 25, col: streak >= 7 ? '#0f8' : '#cfc' });
    }
  }
  // Top 3 by prio. Stable sort fallback: insertion order preserved when prio equal.
  out.sort((a, b) => b.prio - a.prio);
  return out.slice(0, 3);
}

function drawStageIntro() {
  // STAGE INTRO WARP — first 30 frames of intro draws radial hyperspace streaks
  // from screen center outward. Reads as cinematic transition between stages.
  // Color picked from biome for cohesion (or default cyan).
  const introElapsed = 120 - game.stageTimer;
  // TIME-OF-DAY ACCENT — top thin band tinted by real-world hour phase, so
  // each intro carries the day's mood. Subtle so it stays under stage-type
  // tint and warp.
  {
    const _hr = new Date().getHours();
    let _todCol = null;
    if (_hr < 5)       _todCol = '#48f';       // late night
    else if (_hr < 9)  _todCol = '#fc8';       // morning
    else if (_hr < 17) _todCol = '#0cf';       // afternoon
    else if (_hr < 21) _todCol = '#f6c';       // evening
    else               _todCol = '#48f';       // night
    if (_todCol) {
      ctx.save();
      ctx.globalAlpha = 0.08;
      ctx.fillStyle = _todCol;
      ctx.fillRect(0, 0, BASE_W, 2);
      ctx.restore();
    }
  }
  // DAILY/CHALLENGE INTRO BORDER — single-pixel full frame around intro when
  // these modes are active. Daily green, Challenge red. Reinforces mode at
  // every stage entry. Daily takes priority over challenge if both somehow set.
  if (game.dailyMode || game.challengeMode) {
    ctx.save();
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = game.dailyMode ? COL.green : COL.red;
    ctx.fillRect(0, 0, BASE_W, 1);
    ctx.fillRect(0, BASE_H - 1, BASE_W, 1);
    ctx.fillRect(0, 0, 1, BASE_H);
    ctx.fillRect(BASE_W - 1, 0, 1, BASE_H);
    ctx.restore();
  }
  // HARD MODE BANDS — when difficultyMode === 'hard', paint left/right 1px
  // red bands across the entire intro to reinforce the chosen challenge.
  if (typeof difficultyMode !== 'undefined' && difficultyMode === 'hard') {
    ctx.save();
    ctx.globalAlpha = 0.32 + 0.18 * Math.sin(game.animFrame * 0.18);
    ctx.fillStyle = '#f44';
    ctx.fillRect(0, 0, 1, BASE_H);
    ctx.fillRect(BASE_W - 1, 0, 1, BASE_H);
    ctx.restore();
  } else if (typeof difficultyMode !== 'undefined' && difficultyMode === 'easy') {
    // EASY MODE BANDS — softer green bands so the mode reads at a glance.
    ctx.save();
    ctx.globalAlpha = 0.20;
    ctx.fillStyle = '#0f8';
    ctx.fillRect(0, 0, 1, BASE_H);
    ctx.fillRect(BASE_W - 1, 0, 1, BASE_H);
    ctx.restore();
  }
  // BIOME EDGE PULSE — first 30 frames of intro paint biome-colored 1px
  // left/right edges to extend the warp identity into the intro proper.
  if (introElapsed < 30 && typeof biomeForStage === 'function') {
    const _bidE = biomeForStage(game.stage || 1);
    if (_bidE && typeof BIOME_NAMES !== 'undefined' && BIOME_NAMES[_bidE]) {
      ctx.save();
      ctx.globalAlpha = (1 - introElapsed / 30) * 0.4;
      ctx.fillStyle = BIOME_NAMES[_bidE].col;
      ctx.fillRect(0, 0, 1, BASE_H);
      ctx.fillRect(BASE_W - 1, 0, 1, BASE_H);
      ctx.restore();
    }
  }
  // STAGE TYPE BG TINT — faint 4-frame edge band by stage type so the player
  // instantly reads what kind of stage is starting. Boss/challenge get the
  // tint; normal stages stay clean (no distraction).
  {
    const _isBossT = game.stage % BOSS_STAGE_INTERVAL === 0;
    const _isChallT = !_isBossT && game.stage % 4 === 0;
    if ((_isBossT || _isChallT) && introElapsed < 36) {
      const _tBand = 1 - introElapsed / 36;
      ctx.save();
      ctx.globalAlpha = 0.18 * _tBand;
      ctx.fillStyle = _isBossT ? '#f44' : '#f6f';
      ctx.fillRect(0, 0, BASE_W, 6);
      ctx.fillRect(0, BASE_H - 6, BASE_W, 6);
      ctx.restore();
    }
  }
  // STAGE INTRO PARTICLE STREAM — first 30 frames, small dots flow from screen
  // edges toward the center stage label. Subtle motion that draws attention to
  // the title sequence without competing with warp streaks.
  if (introElapsed < 30) {
    const psSeed = (game.stage * 73) % 8;
    ctx.save();
    ctx.fillStyle = '#0cf';
    for (let k = 0; k < 6; k++) {
      const ang = ((k + psSeed) / 6) * Math.PI * 2 + introElapsed * 0.03;
      const ringR = 80 - introElapsed * 2.4;
      const px = BASE_W/2 + Math.cos(ang) * ringR;
      const py = BASE_H/2 + Math.sin(ang) * ringR;
      ctx.globalAlpha = Math.max(0, ringR / 80) * 0.6;
      ctx.fillRect(Math.round(px), Math.round(py), 1, 1);
    }
    ctx.restore();
  }

  // BIOME ENTRY FLASH — 12-frame screen-wide tint matching the upcoming biome.
  // Fades from 0.25 alpha to 0 over the window. Reads as "we just arrived here".
  // BIOME TRANSITION FANFARE — if biome id changed from last stage, boost flash
  // strength + extend window + play tick SFX once for emphasis.
  if (introElapsed < 24) {
    const biomeId = typeof biomeForStage === 'function' ? biomeForStage(game.stage) : null;
    const flashCol = (biomeId && BIOME_NAMES[biomeId]) ? BIOME_NAMES[biomeId].col : '#0ff';
    const _isTransition = biomeId !== null && biomeId !== (game._lastBiomeId || null);
    const winLen = _isTransition ? 24 : 12;
    if (introElapsed < winLen) {
      const flashFade = 1 - introElapsed / winLen;
      ctx.save();
      const baseAlpha = _isTransition ? 0.45 : 0.25;
      ctx.globalAlpha = baseAlpha * flashFade;
      ctx.fillStyle = flashCol;
      ctx.fillRect(0, 0, BASE_W, BASE_H);
      ctx.restore();
    }
    // One-shot SFX + flag update on first frame of transition
    if (_isTransition && introElapsed === 0 && typeof playSound === 'function') {
      playSound('milestone');
      game._lastBiomeId = biomeId;
    } else if (introElapsed === 0) {
      game._lastBiomeId = biomeId;
    }
  }
  if (introElapsed < 30) {
    const warpFade = 1 - introElapsed / 30;
    const cx = BASE_W / 2, cy = BASE_H / 2;
    ctx.save();
    // WARP BIOME COLOR — at biome-active stages, streaks pick up biome col
    // half the time (alternate i parity) so the warp reads as 'entering
    // <biome>'. Fully white otherwise so stage 1-7 stays clean.
    let _warpAlt = null;
    if (typeof biomeForStage === 'function') {
      const _bid = biomeForStage(game.stage || 1);
      if (_bid && BIOME_NAMES && BIOME_NAMES[_bid]) _warpAlt = BIOME_NAMES[_bid].col;
    }
    ctx.fillStyle = '#fff';
    // 24 radial streaks emanating from center
    for (let i = 0; i < 24; i++) {
      if (_warpAlt) ctx.fillStyle = (i & 1) ? _warpAlt : '#fff';
      const ang = (i / 24) * Math.PI * 2;
      const rStart = 20 + introElapsed * 6;
      const rEnd   = rStart + 18;
      // Step pixels along the line for chunky retro look
      const steps = 7;
      for (let s = 0; s < steps; s++) {
        const t = s / (steps - 1);
        const r = rStart + (rEnd - rStart) * t;
        const px = Math.round(cx + Math.cos(ang) * r);
        const py = Math.round(cy + Math.sin(ang) * r);
        ctx.globalAlpha = warpFade * (1 - t * 0.6) * 0.8;
        ctx.fillRect(px, py, 1, 1);
      }
    }
    // Center flash for first 8 frames
    if (introElapsed < 8) {
      ctx.globalAlpha = (1 - introElapsed / 8) * 0.65;
      ctx.fillRect(cx - 2, cy - 2, 4, 4);
      ctx.globalAlpha = (1 - introElapsed / 8) * 0.35;
      ctx.fillRect(cx - 5, cy - 5, 10, 10);
    }
    ctx.restore();
  }
  const isBoss = game.stage % BOSS_STAGE_INTERVAL === 0;
  const isChallenge = !isBoss && game.stage % 4 === 0;
  const isMilestone = MILESTONE_STAGES.indexOf(game.stage) >= 0;
  // BOSS APPROACH WARNING — stage 9/19/29/.../79 are one stage before a boss.
  // Surface "BOSS NEXT" text on the intro so the player knows to prep.
  const isBossNext = !isBoss && (game.stage + 1) % BOSS_STAGE_INTERVAL === 0 && (game.stage + 1) <= 80;
  // Variant formation only matters for non-boss/non-challenge stages
  const variant = (!isBoss && !isChallenge) ? pickFormationVariant() : 'grid';
  const isVariant = variant !== 'grid';
  // Pulsing red warning border during boss-stage intros
  if (isBoss) {
    const pulse = 0.5 + 0.5 * Math.sin(game.animFrame * 0.28);
    ctx.save();
    ctx.globalAlpha = 0.22 + 0.30 * pulse;
    ctx.fillStyle = COL.red;
    ctx.fillRect(0, 0, BASE_W, 3);
    ctx.fillRect(0, BASE_H - 3, BASE_W, 3);
    ctx.fillRect(0, 0, 3, BASE_H);
    ctx.fillRect(BASE_W - 3, 0, 3, BASE_H);
    ctx.restore();
  }
  const stageLabel = isBoss ? '!! BOSS STAGE !!' : isChallenge ? 'CHALLENGING STAGE' : ('STAGE ' + game.stage);
  const labelColor = isMilestone ? '#fc4' : (isBoss ? COL.red : (isChallenge ? '#f6f' : COL.cyan));

  // Slide-in progress over the first 30 frames (stageTimer counts DOWN from 120)
  const elapsed = 120 - game.stageTimer;
  const slide = Math.min(1, elapsed / 30);
  const offX = (1 - slide) * BASE_W;

  // Milestone: radiating gold rays behind the banner
  if (isMilestone) {
    ctx.save();
    const cx = BASE_W / 2, cy = BASE_H / 2 - 10;
    const rays = 12;
    const rot = game.animFrame * 0.012;
    for (let i = 0; i < rays; i++) {
      const a = (i / rays) * Math.PI * 2 + rot;
      ctx.globalAlpha = 0.16 + 0.12 * Math.sin(game.animFrame * 0.08 + i);
      ctx.fillStyle = i % 2 === 0 ? '#fc4' : '#f8a';
      const len = 90 + 16 * Math.sin(game.animFrame * 0.06 + i);
      const x2 = cx + Math.cos(a) * len;
      const y2 = cy + Math.sin(a) * len;
      // chunky pixel ray
      const steps = 18;
      for (let s = 1; s < steps; s++) {
        const tt = s / steps;
        const px = cx + (x2 - cx) * tt;
        const py = cy + (y2 - cy) * tt;
        const sz = Math.max(1, 3 - Math.floor(tt * 3));
        ctx.fillRect(Math.round(px), Math.round(py), sz, sz);
      }
    }
    ctx.restore();
  }

  // Top + bottom dashed banners marquee
  ctx.fillStyle = labelColor;
  for (let i = 0; i < BASE_W; i += 8) {
    if ((i + game.animFrame * 2) % 16 < 4) {
      ctx.fillRect(i, BASE_H/2 - 28, 4, 1);
      ctx.fillRect(i, BASE_H/2 + 4, 4, 1);
    }
  }

  // Banner panel
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, BASE_H/2 - 24, BASE_W, 28);
  ctx.restore();

  // Milestone caption above the panel (after slide-in)
  if (isMilestone && slide >= 1) {
    const blink = (game.animFrame >> 3) % 2 === 0;
    const captionCol = blink ? '#ff8' : '#fc4';
    const bt = loadBestTimes();
    const prev = bt[game.stage];
    drawRetroText('* MILESTONE *', BASE_W/2, BASE_H/2 - 38, 8, captionCol);
    if (typeof prev === 'number') {
      drawRetroText('BEST ' + fmtMS(prev), BASE_W/2, BASE_H/2 + 30, 6, COL.cyan);
    } else {
      drawRetroText('NEW RECORD AVAILABLE', BASE_W/2, BASE_H/2 + 30, 6, COL.cyan);
    }
  }

  // Stage label slides from right
  ctx.save();
  const glowPulse = 0.6 + 0.4 * Math.sin(game.animFrame * 0.15);
  ctx.shadowColor = labelColor;
  ctx.shadowBlur = 10 * glowPulse;
  drawRetroText(stageLabel, BASE_W/2 + offX, BASE_H/2 - 10, 12, labelColor);
  ctx.restore();
  // STAGE GOAL FRACTION — small 'N / 80' or 'N / ENDLESS' below the stage label
  // showing progress to canonical end. Cyan default; gold when past 80.
  if (slide >= 1 && !isBoss) {
    let _frac;
    if (game.stage > 80) _frac = game.stage + ' / ENDLESS';
    else _frac = game.stage + ' / 80';
    const _fCol = game.stage > 80 ? '#fc4' : '#666';
    drawRetroText(_frac, BASE_W/2 + offX, BASE_H/2 + 40, 4, _fCol);
  }
  // STAGE BIOME NAME — biome-themed sub-title under the stage label gives
  // each stage a thematic identity beyond the number. Renders only when a
  // biome is active (stage 8+) and not on boss stages (boss name takes priority).
  if (slide >= 1 && !isBoss) {
    const _biomeId = typeof biomeForStage === 'function' ? biomeForStage(game.stage) : null;
    if (_biomeId && BIOME_NAMES[_biomeId]) {
      const bInfo = BIOME_NAMES[_biomeId];
      drawRetroText('— ' + bInfo.label + ' —', BASE_W/2 + offX, BASE_H/2 + 2, 5, bInfo.col);
      // BIOME CYCLE INDEX — 1-based position within the 8-biome cycle
      const _bIdx = Math.floor((game.stage - 8) / 4) % 8;
      drawRetroText('(' + (_bIdx + 1) + ' / 8)', BASE_W/2 + offX, BASE_H/2 - 4, 3, '#555');
      // BIOME WHISPER — atmospheric one-liner under biome label, last 75 frames of
      // intro only (after the warp settles). Color softened from biome col.
      if (typeof BIOME_WHISPERS !== 'undefined' && BIOME_WHISPERS[_biomeId] && introElapsed > 45) {
        const variants = BIOME_WHISPERS[_biomeId];
        const wText = variants[game.stage % variants.length];
        ctx.save();
        ctx.globalAlpha = Math.min(1, (introElapsed - 45) / 18) * 0.65;
        drawRetroText(wText, BASE_W/2 + offX, BASE_H/2 + 12, 4, bInfo.col);
        ctx.restore();
      }
    }
  }
  // Tier hint — current background tier number tiny in corner
  if (slide >= 1) {
    const tier = Math.min(4, Math.floor((game.stage - 1) / 4));
    drawRetroText('TIER ' + tier, BASE_W - 4, BASE_H/2 - 22, 5, COL.gray, 'right');
    // TIER PIPS — 5-dot row (tier 0..4) below label
    ctx.save();
    const _tpCols = ['#0cf', '#0f8', '#fc4', '#f88', '#f6f'];
    for (let _tp = 0; _tp < 5; _tp++) {
      ctx.globalAlpha = _tp <= tier ? 0.85 : 0.20;
      ctx.fillStyle = _tpCols[_tp];
      ctx.fillRect(BASE_W - 27 + _tp * 5, BASE_H/2 - 18, 3, 1);
    }
    ctx.restore();
    // PILOT TITLE PEEK — small callsign + current rank near top-left corner so
    // each intro reminds the player who they are.
    if (playerCallsign && playerCallsign !== '???' && typeof computePilotTitle === 'function') {
      drawRetroText('[' + playerCallsign + ']', 4, BASE_H/2 - 22, 5, '#888', 'left');
      drawRetroText(computePilotTitle(), 4, BASE_H/2 - 15, 4, '#555', 'left');
      // NEXT RANK PEEK — show progress toward the next tier when available
      if (typeof computePilotNextRank === 'function') {
        try {
          const _nr = computePilotNextRank();
          if (_nr && _nr.next) {
            drawRetroText('→ ' + _nr.next, 4, BASE_H/2 - 30, 4, '#444', 'left');
            // Progress label (terse) — only first 20 chars to fit width
            if (_nr.label) {
              const _lbl = _nr.label.length > 20 ? _nr.label.slice(0, 20) : _nr.label;
              drawRetroText(_lbl, 4, BASE_H/2 - 36, 3, '#333', 'left');
            }
          }
        } catch (e) {}
      }
    }
    // COMPOSITE % PEEK — overall progression at top-right corner of intro
    if (typeof computeCompositeCompletion === 'function') {
      const _ciC = computeCompositeCompletion();
      if (_ciC >= 5) {
        const _ciCol = _ciC >= 80 ? '#fc4' : _ciC >= 50 ? '#0ff' : _ciC >= 20 ? '#0f8' : '#888';
        const _ciTier = _ciC >= 100 ? ' COMP'
                     : _ciC >= 80  ? ' ELITE'
                     : _ciC >= 50  ? ' VET'
                     : _ciC >= 20  ? ' EXPL'
                     : '';
        drawRetroText('CMPL ' + _ciC + '%' + _ciTier, BASE_W - 4, BASE_H/2 - 30, 4, _ciCol, 'right');
        // Mini progress bar (30px wide) right under the text
        ctx.save();
        const _ciBarX = BASE_W - 33, _ciBarY = BASE_H/2 - 25;
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fillRect(_ciBarX, _ciBarY, 30, 1);
        ctx.fillStyle = _ciCol;
        ctx.globalAlpha = 0.8;
        ctx.fillRect(_ciBarX, _ciBarY, Math.round(30 * _ciC / 100), 1);
        ctx.restore();
      }
    }
    // SHIP MASTERY PEEK — lifetime kills with current ship (above name)
    try {
      const _smRaw = localStorage.getItem('galagaShipMastery');
      if (_smRaw) {
        const _sm = JSON.parse(_smRaw);
        const _sid = (typeof selectedShip !== 'undefined') ? selectedShip : 'default';
        if (_sm && _sm[_sid] && _sm[_sid].kills >= 100) {
          drawRetroText('K' + fmtScore(_sm[_sid].kills), BASE_W - 4, BASE_H/2 - 14, 3, '#666', 'right');
        }
      }
    } catch (e) {}
    // SHIP NAME PEEK — current ship under pilot rank, in ship color.
    if (game.ship && game.ship.name) {
      drawRetroText(game.ship.name, BASE_W - 4, BASE_H/2 - 9, 4, game.ship.color || '#0cf', 'right');
      // SHIP BONUS PEEK — speed/dmg modifiers in compact label
      const _bonusParts = [];
      if (game.ship.speedMul && game.ship.speedMul !== 1) {
        _bonusParts.push('SPD' + (game.ship.speedMul > 1 ? '+' : '') + Math.round((game.ship.speedMul - 1) * 100) + '%');
      }
      if (game.ship.dmgBonus) {
        _bonusParts.push('DMG+' + game.ship.dmgBonus);
      }
      if (game.ship.bulletCap && game.ship.bulletCap !== 3) {
        _bonusParts.push('CAP' + game.ship.bulletCap);
      }
      if (_bonusParts.length) {
        drawRetroText(_bonusParts.join(' '), BASE_W - 4, BASE_H/2 - 4, 3, '#888', 'right');
      }
    }
    // LIFETIME SCORE PEEK — total score across all runs as K format
    try {
      const _csNs = (typeof loadCumStats === 'function') ? loadCumStats(false) : {};
      const _csCs = (typeof loadCumStats === 'function') ? loadCumStats(true) : {};
      const _scT = (_csNs.scoreTotal || 0) + (_csCs.scoreTotal || 0);
      if (_scT >= 10000) {
        const _scK = _scT >= 1000000 ? (Math.floor(_scT / 100000) / 10) + 'M'
                   : Math.floor(_scT / 1000) + 'K';
        drawRetroText('Σ ' + _scK, 4, BASE_H/2 + 12, 4, '#888', 'left');
      }
    } catch (e) {}
    // SHIP SPRITE PREVIEW — small ship icon next to TIER label so the player
    // sees the active ship at every intro entry. Reuses drawPlayer with lvl
    // to show current build state.
    if (typeof drawPlayer === 'function') {
      const _sCol = (game.ship && game.ship.color) || '#0cf';
      const _sx = BASE_W - 28, _sy = BASE_H/2 - 22;
      drawPlayer(_sx, _sy, _sCol, game.lvl);
    }
    // POWER LEVEL PEEK — S/N/P current levels at intro so the player sees the
    // build they're carrying in. Hidden when all 1/1/1 (no progress yet).
    if (game.lvl && (game.lvl.S > 1 || game.lvl.N > 1 || game.lvl.P > 1)) {
      const _plY = BASE_H/2 - 8;
      drawRetroText('S' + game.lvl.S, 4, _plY, 4, '#f44', 'left');
      drawRetroText('N' + game.lvl.N, 14, _plY, 4, '#0ff', 'left');
      drawRetroText('P' + game.lvl.P, 24, _plY, 4, '#f6f', 'left');
      // MAX BUILD BADGE — all three caps reached
      if (typeof isPowerMaxed === 'function' && isPowerMaxed()) {
        const _mxBl = (game.animFrame >> 3) % 2 === 0;
        drawRetroText('MAX', 34, _plY, 4, _mxBl ? '#fc4' : '#fff', 'left');
      } else if (game.maxPowerRevealed) {
        // MAX SEEN — was once at max this run (now reset by death)
        drawRetroText('MAX-X', 34, _plY, 3, '#888', 'left');
      }
    }
    // SHIELD CHARGES PEEK — small 'E xN' label at intro when any shield held.
    if ((game.shieldCharges || 0) > 0) {
      drawRetroText('E x' + game.shieldCharges, 4, BASE_H/2 - 1, 4, '#0f8', 'left');
    }
    // ARSENAL TIER PIPS — 4-dot row showing claimed combo arsenal tiers
    if (game.comboArsenalClaimed) {
      const _arT = [25, 50, 75, 100];
      const _arC = ['#fc4', '#f8a', '#0ef', '#fff'];
      let _anyClaimed = false;
      for (const _t of _arT) if (game.comboArsenalClaimed[_t]) { _anyClaimed = true; break; }
      if (_anyClaimed) {
        ctx.save();
        for (let _ai = 0; _ai < 4; _ai++) {
          ctx.globalAlpha = game.comboArsenalClaimed[_arT[_ai]] ? 0.85 : 0.20;
          ctx.fillStyle = _arC[_ai];
          ctx.fillRect(4 + _ai * 4, BASE_H/2 + 18, 2, 2);
        }
        ctx.restore();
      }
    }
    // LIVES PEEK — small lives count near power peek so the player sees how
    // many ships remain entering this stage. Red when last life.
    {
      const _lvCol = game.lives === 1 ? '#f44' : game.lives <= 2 ? '#fa8' : '#fff';
      drawRetroText('L:' + game.lives, 4, BASE_H/2 + 5, 4, _lvCol, 'left');
    }
    // HIGH SCORE PEEK — small 'HI: N' label at right side mirroring left peeks.
    // Lets player see the bar they're chasing without leaving the intro.
    if ((game.highScore || 0) > 0) {
      drawRetroText('HI:' + fmtScore(game.highScore), BASE_W - 4, BASE_H/2 - 1, 4, '#fc4', 'right');
    }
    // STREAK SUMMARY PEEK — zen (no-death) streak + parry streak best when active.
    // Right side, below HI score. Encourages preservation play.
    if ((game.zenStreak || 0) >= 2) {
      drawRetroText('NODIE x' + game.zenStreak, BASE_W - 4, BASE_H/2 + 5, 4, '#0f8', 'right');
    }
    // COMBO BEST PEEK — session combo best at right side stack.
    if ((game.comboBest || 0) >= 3) {
      drawRetroText('CB x' + game.comboBest, BASE_W - 4, BASE_H/2 + 11, 4, '#0ff', 'right');
    }
    // PARRY COUNT PEEK — session parry count
    if ((game.parryCount || 0) >= 3) {
      drawRetroText('PR x' + game.parryCount, BASE_W - 4, BASE_H/2 + 17, 4, '#0cf', 'right');
    }
    // RUN KILLS PEEK — session kill count when meaningful (>= 10).
    if (game.stats && (game.stats.kills || 0) >= 10) {
      drawRetroText('K x' + game.stats.kills, BASE_W - 4, BASE_H/2 + 23, 4, '#f88', 'right');
    }
    // PERFECT WAVES PEEK — count of no-escape challenge waves this run.
    if ((game.perfectWavesRun || 0) >= 1) {
      drawRetroText('PW x' + game.perfectWavesRun, BASE_W - 4, BASE_H/2 + 29, 4, '#fc4', 'right');
    }
    // ACCURACY PEEK — current run accuracy when sample is meaningful.
    if (game.stats && (game.stats.shotsFired || 0) >= 10) {
      const _accInt = Math.round((game.stats.shotsHit / game.stats.shotsFired) * 100);
      const _accCol = _accInt >= 90 ? '#0f8' : _accInt >= 70 ? '#0ff' : _accInt >= 50 ? '#fc4' : '#f88';
      drawRetroText('ACC ' + _accInt + '%', BASE_W - 4, BASE_H/2 + 35, 4, _accCol, 'right');
    }
    // ELITE COUNT PEEK — run elite kills counter when active.
    if ((game.eliteKills || 0) >= 1) {
      drawRetroText('EL x' + game.eliteKills, BASE_W - 4, BASE_H/2 + 41, 4, '#f44', 'right');
    }
    // CRIT KILLS PEEK — run crit kill counter when active.
    if ((game.critKillsRun || 0) >= 3) {
      drawRetroText('CR x' + game.critKillsRun, BASE_W - 4, BASE_H/2 + 53, 4, '#fc4', 'right');
    }
    // MULTIKILL BEST RUN PEEK — biggest same-frame kill count this run.
    if ((game.multiKillBest || 0) >= 3) {
      drawRetroText('MK x' + game.multiKillBest, BASE_W - 4, BASE_H/2 + 95, 4, '#fc4', 'right');
    }
    // DASH COUNT PEEK — total dashes this run
    if ((game.dashCount || 0) >= 5) {
      drawRetroText('DS x' + game.dashCount, BASE_W - 4, BASE_H/2 + 101, 4, '#0ff', 'right');
    }
    // PICKUP STREAK BEST RUN PEEK — best no-death pickup streak this run
    if ((game.pickupStreakBest || 0) >= 3) {
      drawRetroText('PS x' + game.pickupStreakBest, BASE_W - 4, BASE_H/2 + 107, 4, '#0cf', 'right');
    }
    // EXTRA SHIPS PEEK — count of extra lives earned this run
    if ((game.extraShipsRun || 0) >= 1) {
      drawRetroText('+SHIP x' + game.extraShipsRun, BASE_W - 4, BASE_H/2 + 113, 4, '#ff4', 'right');
    }
    // RUN BIOMES PEEK — distinct biomes visited this run
    if (game.runBiomesSeen && game.runBiomesSeen.size >= 2) {
      drawRetroText('B ' + game.runBiomesSeen.size + '/8', BASE_W - 4, BASE_H/2 + 119, 4, '#9ef', 'right');
    }
    // LAST STAGE GRADE PEEK — directly compare last grade to current run target
    if (game.lastStageGrade) {
      drawRetroText('PREV ' + game.lastStageGrade, BASE_W - 4, BASE_H/2 + 125, 4,
                    game.lastStageGradeCol || '#fff', 'right');
    }
    // RECENT GRADE QUEUE — last 3 grades, oldest → newest, colored per letter.
    // Helps player feel streaks (e.g. "SSS" momentum, "DDC" recovery needed).
    if (Array.isArray(game.recentGrades) && game.recentGrades.length >= 2) {
      const _gqMap = { S: '#fc4', A: '#0f8', B: '#0cf', C: '#fff', D: '#f88' };
      let _qx = BASE_W - 4;
      for (let _qi = game.recentGrades.length - 1; _qi >= 0; _qi--) {
        const _gL = game.recentGrades[_qi];
        drawRetroText(_gL, _qx, BASE_H/2 + 119, 4, _gqMap[_gL] || '#fff', 'right');
        _qx -= 5;
      }
    }
    // S GRADE TARGET HINT — show condition trio for top-tier rating, dim.
    // Only on normal stages (boss/chall use different scoring). Skip stage 1.
    if ((game.stage || 0) >= 2
        && (game.stage % BOSS_STAGE_INTERVAL !== 0)
        && (game.stage % 4 !== 0)) {
      drawRetroText('S: 95% NO-DIE PB', BASE_W - 4, BASE_H/2 + 131, 3, '#666', 'right');
    }
    // PB STATUS HINT — show whether this stage has a stored PB. "FIRST PB" tag
    // when missing (motivates discovery), "PB " + time when set. Only on
    // normal stages (boss/challenge run different timing schemes).
    if ((game.stage || 0) >= 1
        && (game.stage % BOSS_STAGE_INTERVAL !== 0)
        && (game.stage % 4 !== 0)
        && typeof stagePBs !== 'undefined' && stagePBs) {
      const _pbF2 = stagePBs[String(game.stage)];
      if (typeof _pbF2 === 'number' && _pbF2 > 0
          && typeof fmtFrameTime === 'function') {
        drawRetroText('PB ' + fmtFrameTime(_pbF2), BASE_W - 4, BASE_H/2 + 137, 3, '#0cf', 'right');
      } else {
        const _blink = (game.animFrame >> 4) % 2 === 0;
        drawRetroText('FIRST PB', BASE_W - 4, BASE_H/2 + 137, 3,
                      _blink ? '#fc4' : '#fa8', 'right');
      }
    }
    // RUN ELAPSED PEEK — current run time in MM:SS when meaningful (>= 30s)
    if ((game.runFrames || 0) >= 1800) {
      const _rs = Math.floor(game.runFrames / 60);
      const _rm = Math.floor(_rs / 60);
      const _rss = _rs % 60;
      drawRetroText('T ' + _rm + ':' + String(_rss).padStart(2, '0'),
                    BASE_W - 4, BASE_H/2 + 59, 4, '#888', 'right');
    }
    // LIFETIME RUNS PEEK — total sessions across modes when meaningful (>= 10)
    try {
      const _csNr = (typeof loadCumStats === 'function') ? loadCumStats(false) : {};
      const _csCr = (typeof loadCumStats === 'function') ? loadCumStats(true) : {};
      const _sess = (_csNr.sessions || 0) + (_csCr.sessions || 0);
      if (_sess >= 10) {
        drawRetroText('R ' + _sess, BASE_W - 4, BASE_H/2 + 65, 4, '#666', 'right');
      }
    } catch (e) {}
    // BIOMES SEEN PEEK — lifetime biomes encountered fraction.
    try {
      const _bsRaw = localStorage.getItem('galagaBiomesSeen') || '[]';
      const _bsArr = JSON.parse(_bsRaw);
      const _bsCount = Array.isArray(_bsArr) ? _bsArr.length : 0;
      if (_bsCount >= 1) {
        const _bsCol = _bsCount === 8 ? '#fc4' : '#0cf';
        drawRetroText('BIO ' + _bsCount + '/8', BASE_W - 4, BASE_H/2 + 47, 4, _bsCol, 'right');
        // Mini 8-cell bar under text — filled cells = biomes seen
        ctx.save();
        const _bsBarX = BASE_W - 28, _bsBarY = BASE_H/2 + 52;
        for (let _bi = 0; _bi < 8; _bi++) {
          ctx.globalAlpha = _bi < _bsCount ? 0.8 : 0.18;
          ctx.fillStyle = _bsCol;
          ctx.fillRect(_bsBarX + _bi * 3, _bsBarY, 2, 1);
        }
        ctx.restore();
      }
    } catch (e) {}
    // DAILY STREAK PEEK — current daily-mission streak when >= 2 days.
    if (typeof computeDailyStreak === 'function') {
      const _dStreak = computeDailyStreak();
      if (_dStreak >= 2) {
        const _dsCol = _dStreak >= 30 ? '#fc4' : _dStreak >= 7 ? '#0f8' : '#cce';
        drawRetroText('D' + _dStreak, BASE_W - 4, BASE_H/2 + 71, 4, _dsCol, 'right');
      }
    }
    // BOSS COUNT PEEK — bosses defeated this run.
    if ((game.bossesKilledThisRun || 0) >= 1) {
      drawRetroText('BS x' + game.bossesKilledThisRun, BASE_W - 4, BASE_H/2 + 77, 4, '#f8a', 'right');
    }
    // KILLED TYPES PEEK — unique enemy types killed this run (variety hunter)
    if (game.killedTypes && game.killedTypes.size >= 3) {
      drawRetroText('TYP ' + game.killedTypes.size, BASE_W - 4, BASE_H/2 + 83, 4, '#0cf', 'right');
    }
    // BESTIARY MINI BAR — lifetime dex unlocked fraction
    if (typeof dexUnlocked !== 'undefined' && dexUnlocked.size >= 1) {
      const _dxCol = dexUnlocked.size >= 8 ? '#fc4' : '#f6f';
      drawRetroText('DEX ' + dexUnlocked.size + '/8', BASE_W - 4, BASE_H/2 + 89, 4, _dxCol, 'right');
      ctx.save();
      const _dxBarX = BASE_W - 28, _dxBarY = BASE_H/2 + 94;
      for (let _di = 0; _di < 8; _di++) {
        ctx.globalAlpha = _di < dexUnlocked.size ? 0.8 : 0.18;
        ctx.fillStyle = _dxCol;
        ctx.fillRect(_dxBarX + _di * 3, _dxBarY, 2, 1);
      }
      ctx.restore();
    }
    // BUFF TIMER PEEK — single highest-priority active temp buff as small letter
    // (L/H/W/R/T) at the right side mirror of left peeks. Hidden when none.
    {
      let _bp = null, _bpCol = '#fff';
      if ((game.laserTimer  || 0) > 0)      { _bp = 'LASER'; _bpCol = '#f6c'; }
      else if ((game.homingTimer || 0) > 0) { _bp = 'HOMING'; _bpCol = '#0f8'; }
      else if ((game.waveTimer   || 0) > 0) { _bp = 'WAVE'; _bpCol = '#6cf'; }
      else if ((game.rapidTimer  || 0) > 0) { _bp = 'RAPID'; _bpCol = '#fc4'; }
      else if ((game.slowTimer   || 0) > 0) { _bp = 'SLOW'; _bpCol = '#8ff'; }
      if (_bp) drawRetroText(_bp, BASE_W - 4, BASE_H/2 - 15, 4, _bpCol, 'right');
    }
  }
  // RUN QUICK STATS — single-line summary of in-progress run shown at stage 2+.
  // Combo / Score / Accuracy. Score-neutral context for player decisions.
  if (slide >= 1 && game.stage >= 2) {
    const _sc = game.score || 0;
    const _cb = game.comboBest || 0;
    const _accNum = (game.stats && game.stats.shotsFired)
      ? Math.round((game.stats.shotsHit / game.stats.shotsFired) * 100) : 0;
    const _scStr = _sc >= 1000 ? Math.round(_sc / 1000) + 'K' : String(_sc);
    const _runLine = 'RUN  C×' + _cb + '  ' + _scStr + 'PT  ' + _accNum + '%';
    ctx.save();
    ctx.globalAlpha = 0.7;
    drawRetroText(_runLine, BASE_W/2, BASE_H/2 + 32, 4, '#aaa');
    ctx.restore();
  }
  // ADAPTIVE TIP — surface skill hint based on first matching weakness check
  if (slide >= 1 && !isBoss && typeof STAGE_TIPS !== 'undefined' && introElapsed > 60) {
    let _tip = null;
    for (const t of STAGE_TIPS) {
      try { if (t.check(game)) { _tip = t.tip; break; } } catch (e) {}
    }
    if (_tip) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, (introElapsed - 60) / 18) * 0.85;
      drawRetroText(_tip, BASE_W/2 + offX, BASE_H/2 + 22, 4, '#0cf');
      ctx.restore();
    }
  }

  // BOSS INTRO CINEMATIC — WARNING flash band + boss name + silhouette preview.
  // Drawn ABOVE the standard count label so the boss identity is the first thing the
  // player parses. Only on boss stages — tries hard to avoid disturbing the existing
  // STAGE/CHALLENGING flow.
  if (isBoss && slide >= 1) {
    const t = game.animFrame;
    // 1) WARNING red strobe band across mid-screen
    const warnPulse = (t >> 2) % 2 === 0;
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = warnPulse ? '#f44' : '#000';
    ctx.fillRect(0, BASE_H/2 + 30, BASE_W, 18);
    ctx.restore();
    drawRetroText('WARNING', BASE_W/2 + offX, BASE_H/2 + 38, 9, warnPulse ? '#f44' : '#fff');
    // 2) Boss name (between WARNING band and the bottom)
    drawRetroText(bossNameFor(game.stage), BASE_W/2 + offX, BASE_H/2 + 50, 8, '#fc4');
    // BOSS HP PREVIEW — predict total HP from stage formula (matches makeMegaBoss)
    {
      const _s = game.stage;
      const _baseHp = 20 + _s * 3;
      let _totalHp;
      if (_s >= 30) _totalHp = Math.round(_baseHp * 2.5);
      else if (_s >= 20) _totalHp = Math.round(_baseHp * 0.65) * 2;
      else _totalHp = _baseHp;
      drawRetroText('HP ' + _totalHp, BASE_W/2 + offX, BASE_H/2 + 60, 5, '#f88');
    }
    // BOSS ARCHETYPE PREVIEW — small subtitle with the archetype type + color so
    // player can prep for signature pattern (split / laser / fragment / pulse).
    if (typeof archetypeFor === 'function') {
      const arch = archetypeFor(game.stage);
      const archLabel = arch === 'horned'  ? 'TYPE — HORNED'
                       : arch === 'tendril' ? 'TYPE — TENDRIL'
                       : arch === 'crystal' ? 'TYPE — CRYSTAL'
                       : arch === 'phantom' ? 'TYPE — PHANTOM'
                       : arch === 'rune'    ? 'TYPE — RUNE'
                       : 'TYPE — STANDARD';
      const archCol = arch === 'horned'  ? '#f86'
                     : arch === 'tendril' ? '#8af'
                     : arch === 'crystal' ? '#cef'
                     : arch === 'phantom' ? '#a8f'
                     : arch === 'rune'    ? '#a4f'
                     : '#fc4';
      drawRetroText(archLabel, BASE_W/2 + offX, BASE_H/2 + 58, 5, archCol);
    }
    // 3) Boss silhouette preview at bottom (semi-transparent, drawn at 1.5× via canvas scale)
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.20 * Math.sin(t * 0.12);
    ctx.translate(BASE_W/2, BASE_H/2 + 70);
    ctx.scale(1.4, 1.4);
    drawMegaBoss(0, 0, t >> 4, false);
    ctx.restore();
  }

  // Enemy count estimate (slides in with the label, fading in slightly delayed)
  if (slide >= 1) {
    const countLabel = isBoss
      ? (game.stage >= 30 ? '1 SUPER BOSS' : game.stage >= 20 ? '2 BOSSES' : '1 BOSS')
      : isChallenge
      ? '8 WAVES'
      : '~40 ENEMIES';
    const countCol = isBoss ? COL.red : isChallenge ? '#f6f' : COL.cyan;
    drawRetroText(countLabel, BASE_W/2 + offX, BASE_H/2 + 0, 6, countCol);
    // CHALLENGE WAVE INTRO PIPS — 8 magenta dots showing upcoming wave count.
    // Visual reinforcement of "8 WAVES" label for instant pattern recognition.
    if (isChallenge) {
      ctx.save();
      ctx.fillStyle = '#f6f';
      const totW = 8;
      const sp = 5;
      const startX = BASE_W/2 + offX - (totW - 1) * sp / 2;
      for (let i = 0; i < totW; i++) {
        ctx.globalAlpha = 0.55 + 0.25 * Math.sin(game.animFrame * 0.12 + i * 0.5);
        ctx.fillRect(Math.round(startX + i * sp) - 1, BASE_H/2 + 8, 2, 2);
      }
      ctx.restore();
    }
    // BIOME PREVIEW — tiny label of the upcoming environment (stage 8+ only)
    const biomeId = biomeForStage(game.stage);
    if (biomeId && BIOME_NAMES[biomeId]) {
      const b = BIOME_NAMES[biomeId];
      drawRetroText('BIOME: ' + b.label, BASE_W/2 + offX, BASE_H/2 - 24, 5, b.col);
    }
    // PERSONAL BEST display — time AND score for this stage. Two-axis self-challenge
    // visible at stage start. Both are optional (first clear has neither).
    const pbFrames = (typeof stagePBs !== 'undefined') && stagePBs[String(game.stage)];
    const pbScore  = (typeof stageScorePBs !== 'undefined') && stageScorePBs[String(game.stage)];
    if (pbFrames || pbScore) {
      const parts = [];
      if (pbFrames) parts.push('TIME ' + fmtFrameTime(pbFrames));
      if (pbScore)  parts.push('SCORE ' + fmtScore(pbScore));
      drawRetroText('PB  ' + parts.join('   '),
                    BASE_W/2 + offX, BASE_H/2 - 18, 5, COL.gray);
    } else {
      // PB OPEN BADGE — no PB yet for this stage = automatic record on clear.
      // Surface as gold call to action.
      const _blink = (game.animFrame >> 3) % 2 === 0;
      drawRetroText('PB OPEN', BASE_W/2 + offX, BASE_H/2 - 18, 5,
                    _blink ? '#fc4' : '#ff4');
    }
    // STAGE MUTATION banner — only on normal stages where it's been rolled.
    if (game.stageMutation) {
      const m = game.stageMutation;
      const blink = (game.animFrame >> 2) % 2 === 0 ? m.color : '#fff';
      drawRetroText('* ' + m.label + ' *', BASE_W/2 + offX, BASE_H/2 + 10, 8, blink);
      drawRetroText(m.desc, BASE_W/2 + offX, BASE_H/2 + 18, 5, '#fff');
    }
  }

  // TRANSMISSION LOG — narrative beat for milestone-tier stages. Drawn after the
  // banner slide-in so player sees stage label first, then the world reveals itself.
  // Typewriter reveal: each character appears every ~2 frames.
  const log = TRANSMISSION_LOGS[game.stage];
  if (log && slide >= 1) {
    const tStart = 30;                         // begin reveal once banner has slid in
    const charsPer = 2;                        // ~30 chars/sec, feels like CRT terminal
    const fullChars = log.reduce((s, line) => s + line.length, 0) + log.length;
    const revealed = Math.max(0, Math.min(fullChars, Math.floor((elapsed - tStart) / charsPer)));
    if (revealed > 0) {
      // Panel position: top-left, leaving room for stage label / boss intro center
      const lx = 8, ly = 100;
      const panelW = BASE_W - 16, panelH = 28;
      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = '#020';
      ctx.fillRect(lx, ly, panelW, panelH);
      ctx.fillStyle = '#0f8';
      ctx.fillRect(lx, ly, panelW, 1);
      ctx.fillRect(lx, ly + panelH - 1, panelW, 1);
      ctx.fillRect(lx, ly, 1, panelH);
      ctx.fillRect(lx + panelW - 1, ly, 1, panelH);
      // Blinking cursor at the right end of the reveal frontier
      ctx.restore();
      let charBudget = revealed;
      for (let i = 0; i < log.length; i++) {
        const lineFull = log[i];
        const showLen = Math.min(lineFull.length, charBudget);
        if (showLen > 0) {
          const partial = lineFull.slice(0, showLen);
          const lineCol = i === 0 ? '#fc4' : '#cfc'; // header gold, body soft green
          drawRetroText(partial, lx + 4, ly + 4 + i * 8, 5, lineCol, 'left');
        }
        charBudget -= lineFull.length + 1; // +1 for inter-line spacing
        if (charBudget < 0) break;
      }
      // Cursor blink at end of last revealed line
      if ((game.animFrame >> 2) % 2 === 0 && revealed < fullChars) {
        // Find current line for cursor position
        let cursorLine = 0, cursorCol = 0, used = 0;
        for (let i = 0; i < log.length; i++) {
          const ln = log[i].length + 1;
          if (used + ln > revealed) {
            cursorLine = i;
            cursorCol = revealed - used;
            break;
          }
          used += ln;
        }
        const cx = lx + 4 + cursorCol * 5; // approx 5px/char at size 5
        const cy = ly + 4 + cursorLine * 8;
        ctx.fillStyle = '#0f8';
        ctx.fillRect(cx, cy, 3, 5);
      }
    }
  }

  // SYNERGY DISTANCE HINT — show OVERLOAD/BLINK/HEAVY distance when no synergy
  // is active. Helps the player prioritize pickups (e.g., "OVERLOAD: +1 N").
