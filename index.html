            const seg = e.pathSegments[0];
            const dots = [];
            for (let pp = 1; pp <= 14; pp++) {
              const tt = pp / 14;
              const pt = bezierPoint(seg.p0, seg.p1, seg.p2, seg.p3, tt);
              dots.push({ x: pt.x, y: pt.y, t: tt });
            }
            e.divePathDots = dots;
            e.divePathLife = 22;
          }
          _diveStartCount++;
        }
      }
    }
  }
  // SWARM DIVE WARNING — 3+ simultaneous dives in same frame = elevated threat.
  // Rate-limited to once per 180 frames (~3s) so wave-driven cascades don't spam.
  if (_diveStartCount >= 3 && (game.swarmWarnCooldown || 0) <= 0) {
    game.swarmWarnLife = 36;
    game.swarmWarnCooldown = 180;
    playSound('tick');
  }
  if ((game.swarmWarnLife || 0) > 0) game.swarmWarnLife--;
  if ((game.swarmWarnCooldown || 0) > 0) game.swarmWarnCooldown--;
}

function updateEnemies() {
  let anyEntering = false;

  // CRITICAL HP PULSE tick — moved from draw path (Turn 120 had a draw-rate
  // mutation bug that drained the timer 2.4× on 144Hz monitors).
  for (const e of game.enemies) {
    if (e.criticalPulseTimer && e.criticalPulseTimer > 0) e.criticalPulseTimer--;
    if (e.hitFlashTimer && e.hitFlashTimer > 0) e.hitFlashTimer--;
    if (e.divePathLife && e.divePathLife > 0) {
      e.divePathLife--;
      if (e.divePathLife <= 0) { e.divePathDots = null; }
    }
  }

  // LAST STAND ANNOUNCEMENT — one-shot "LAST ONE!" floatText when count crosses
  // from 2 → 1 in PLAYING. Cooled by lastStandAnnounced flag (reset per stage).
  if (game.state === STATE.PLAYING && game.allEntered && !game.lastStandAnnounced) {
    const aliveCount = game.enemies.filter(en => en.alive).length;
    if (aliveCount === 1) {
      game.lastStandAnnounced = true;
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 30, text: 'LAST ONE!',
        color: '#fc4', life: 60, maxLife: 60, size: 10
      });
      playSound('milestone');
    }
  }

  for (const e of game.enemies) {
    if (!e.alive) continue;
    e.frameTimer++;
    if (e.frameTimer > 15) { e.frame++; e.frameTimer = 0; }

    if (e.state === 'entering') {
      anyEntering = true;
      if (e.entryDelay > 0) { e.entryDelay--; continue; }
      // Warp-in flash on the FIRST tick the enemy becomes visible (entryDelay just hit 0)
      if (!e.warpedIn) {
        e.warpedIn = true;
        // Push a small warp ring + 4 sparks behind the enemy
        for (let k = 0; k < 5; k++) {
          const a = (k / 5) * Math.PI * 2;
          game.itemBursts.push({
            x: e.x + Math.cos(a) * 5,
            y: e.y + Math.sin(a) * 5,
            life: -k,
            color: e.type === 'boss' ? '#f6f' : e.type === 'butterfly' ? '#f8a' : '#0ff'
          });
        }
        game.hitSparks.push({ x: e.x, y: e.y, life: 0 });
        // Mini shockwave at warp-in for boss/shielded
        if ((e.type === 'boss' || e.type === 'shielded') && game.shockwaves) {
          game.shockwaves.push({ x: e.x, y: e.y, life: 0, maxLife: 12, maxR: 14, color: '#88f' });
        }
      }
      e.pathProgress += e.pathSpeed;
      if (e.pathProgress >= 1) {
        e.state = 'formation';
        e.x = e.homeX; e.y = e.homeY;
      } else if (e.spiralEntry) {
        // Spiral inward then ease toward home position
        const t = e.pathProgress;
        const cx = BASE_W/2, cy = BASE_H/2 - 20;
        const startR = 90, endR = 12;
        const radius = startR + (endR - startR) * t;
        const turns = 2.0;
        const angle = (e.spiralStartAngle || 0) + (e.spiralDir || 1) * t * Math.PI * 2 * turns;
        const sx = cx + Math.cos(angle) * radius;
        const sy = cy + Math.sin(angle) * radius * 0.65;
        // Smoothly blend into home position over the last 35% of the path
        const k = Math.max(0, Math.min(1, (t - 0.65) / 0.35));
        e.x = sx * (1 - k) + e.homeX * k;
        e.y = sy * (1 - k) + e.homeY * k;
      } else {
        const p = bezierPoint(e.path.p0, e.path.p1, e.path.p2, e.path.p3, e.pathProgress);
        e.x = p.x; e.y = p.y;
      }
    }

    if (e.state === 'diving') {
      // FAST DIVES mutation accelerates dive curve traversal by 1.3×.
      const diveBoost = (game.stageMutation && game.stageMutation.id === 'fastDives') ? 1.3 : 1;
      // LAST STAND — single remaining enemy slows to 0.65× for cinematic finish.
      const lsBoost = (game.state === STATE.PLAYING && game.allEntered
        && game.enemies.filter(en => en.alive).length === 1) ? 0.65 : 1;
      if (e.pathSegments) {
        const seg = e.pathSegments[e.pathSegIndex];
        e.pathProgress += e.pathSpeed * diveBoost * lsBoost;
        if (e.pathProgress >= 1) {
          e.pathSegIndex++;
          e.pathProgress = 0;
          if (e.pathSegIndex >= e.pathSegments.length) {
            // Wrap around from bottom
            if (e.y > BASE_H) {
              e.y = -15;
              e.state = 'returning';
              e.path = createEntryPath(e.x, -15, e.homeX, e.homeY, e.x < BASE_W/2 ? 1 : -1);
              e.pathProgress = 0;
            }
          }
        } else {
          const p = bezierPoint(seg.p0, seg.p1, seg.p2, seg.p3, e.pathProgress);
          e.x = p.x; e.y = p.y;
        }
      }
      // Evasion AI: at stage 8+, occasionally dodge an incoming player bullet
      if (game.stage >= 8 && (e.evadeOffsetX || 0) === 0) {
        for (const b of game.bullets) {
          if (b.y > e.y && b.y - e.y < 22 && Math.abs(b.x - e.x) < 5) {
            if (Math.random() < 0.18) {
              e.evadeOffsetX = (b.x < e.x ? 1 : -1) * 6;
            }
            break;
          }
        }
      }
      if (e.evadeOffsetX) {
        e.x += e.evadeOffsetX;
        e.evadeOffsetX *= 0.92;
        if (Math.abs(e.evadeOffsetX) < 0.1) e.evadeOffsetX = 0;
      }
      // Faint dive trail — sparse trailing particles every few frames
      if (e.diveTimer % 4 === 0 && Math.random() < 0.4) {
        const tCol = e.type === 'kamikaze' ? '#f80' : e.type === 'boss' ? '#f8a' : '#cef';
        game.itemBursts.push({
          x: e.x + (Math.random() - 0.5) * 2,
          y: e.y + (Math.random() - 0.5) * 2,
          life: 12, color: tCol
        });
      }
      // Enemy shoots during dive — fires more often at higher stages, but bullet speed is bounded
      // for fairness (no homing trackers — straight aimed shots only).
      e.diveTimer++;
      const shootEvery = Math.max(14, Math.round((42 - Math.floor(game.stage * 1.0)) * diffFireMul()));
      if (e.diveTimer % shootEvery === 0 && game.playerAlive) {
        const dx = game.playerX - e.x, dy = game.playerY - e.y;
        const len = Math.sqrt(dx*dx+dy*dy) || 1;
        // Capped speed: 2.0 baseline + smaller stage scaling, max 3.4
        const spd = Math.min(3.4, 2.0 + game.stage * 0.045) * diffSpeedMul();
        game.enemyBullets.push({
          x: e.x, y: e.y + 4,
          vx: dx / len * spd, vy: dy / len * spd,
          kind: 'dive'
        });
      }
    }

    if (e.state === 'returning') {
      e.pathProgress += e.pathSpeed * 1.2;
      if (e.pathProgress >= 1) {
        e.state = 'formation';
        e.x = e.homeX; e.y = e.homeY;
      } else {
        const p = bezierPoint(e.path.p0, e.path.p1, e.path.p2, e.path.p3, e.pathProgress);
        e.x = p.x; e.y = p.y;
      }
    }

    if (e.state === 'kamikaze') {
      // Mild homing on x-axis
      if (game.playerAlive) {
        const dx = game.playerX - e.x;
        e.vx += Math.sign(dx) * 0.04;
        e.vx = Math.max(-2, Math.min(2, e.vx));
      }
      e.x += e.vx;
      e.y += e.vy;
      if (e.y > BASE_H + 10) e.alive = false;
    }

    if (e.state === 'minibee') {
      e.x += e.vx;
      e.y += e.vy;
      if (e.y > BASE_H + 10 || e.x < -10 || e.x > BASE_W + 10) e.alive = false;
    }

    if (e.state === 'ufo') {
      e.x += e.vx;
      // Tiny vertical sine wobble for visual life
      e.y += Math.sin((game.animFrame + e.frame * 5) * 0.08) * 0.2;
      if (e.x < -20 || e.x > BASE_W + 20) e.alive = false;
    }

    if (e.state === 'goldenBee') {
      e.zigPhase += 0.12;
      e.x += Math.sin(e.zigPhase) * 1.6;
      e.y += e.vy;
      // Gentle tracking toward player x in last third of descent
      if (e.y > BASE_H * 0.5 && game.playerAlive) {
        const dx = game.playerX - e.x;
        e.x += Math.sign(dx) * 0.08;
      }
      if (e.y > BASE_H + 10) e.alive = false;
    }

    if (e.state === 'hoverer') {
      e.x += e.vx;
      e.sweepPhase += 0.04;
      e.y = 36 + Math.sin(e.sweepPhase) * 4;
      // Bounce off walls
      if (e.x > BASE_W - 12) { e.x = BASE_W - 12; e.vx = -Math.abs(e.vx); }
      if (e.x < 12)          { e.x = 12;          e.vx =  Math.abs(e.vx); }
      // Aimed shots (difficulty-scaled, speed capped)
      e.shootTimer++;
      const shootEvery = Math.max(40, Math.round((100 - game.stage * 1.2) * diffFireMul()));
      if (e.shootTimer >= shootEvery && game.playerAlive) {
        e.shootTimer = 0;
        const dx = game.playerX - e.x, dy = game.playerY - e.y;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        const spd = Math.min(3.2, 1.8 + game.stage * 0.03) * diffSpeedMul();
        game.enemyBullets.push({
          x: e.x, y: e.y + 6,
          vx: dx / len * spd, vy: dy / len * spd,
          kind: 'dive'
        });
      }
      // Despawn if hovers too long without progress (after 600 frames)
      e.lifeFrames = (e.lifeFrames || 0) + 1;
      if (e.lifeFrames > 600) e.alive = false;
    }

    if (e.state === 'mirror') {
      // Mirror player horizontally with smoothing; bob vertically
      const targetX = BASE_W - game.playerX;
      e.x += (targetX - e.x) * 0.10;
      e.bobPhase += 0.05;
      e.y = 30 + Math.sin(e.bobPhase) * 6;
      // Periodic shot aimed at the player (difficulty-scaled, speed capped)
      e.shootTimer++;
      const shootEvery = Math.max(40, Math.round((110 - game.stage * 1.5) * diffFireMul()));
      if (e.shootTimer >= shootEvery && game.playerAlive) {
        e.shootTimer = 0;
        const dx = game.playerX - e.x, dy = game.playerY - e.y;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        const spd = Math.min(3.2, 1.9 + game.stage * 0.03) * diffSpeedMul();
        game.enemyBullets.push({
          x: e.x, y: e.y + 6,
          vx: dx / len * spd, vy: dy / len * spd,
          kind: 'dive'
        });
      }
    }

    if (e.state === 'capturing') {
      e.captureTimer++;
      // Boss flies down
      if (e.captureTimer < 60) {
        e.y += 1.5;
      } else if (e.captureTimer < 180) {
        // Tractor beam active — check if player is under
        if (game.playerAlive) {
          const dx = Math.abs(game.playerX - e.x);
          if (dx < 20 && game.playerY > e.y) {
            // Capture the player
            game.playerAlive = false;
            e.capturedShip = true;
            game.capturedShipEnemy = e;
            playSound('capture');
            game.state = STATE.CAPTURED;
            game.capturePhase = 0;
            game.captureTimer = 0;
            // Dim BGM during the capture cutscene for tension
            if (bgmGain) bgmGain.gain.value = bgmEnabled ? 0.5 : 0;
            // Cutscene flair — blue flash + spiral particles being sucked up
            game.flashTimer = 8;
            game.flashColor = '#08f';
            for (let k = 0; k < 12; k++) {
              const angle = (k / 12) * Math.PI * 2;
              const r = 4 + (k % 3) * 4;
              game.itemBursts.push({
                x: game.playerX + Math.cos(angle) * r,
                y: game.playerY + Math.sin(angle) * r,
                life: -k * 2,
                color: k % 2 === 0 ? '#0cf' : '#fff'
              });
            }
            game.shakeTimer = 16;
          }
        }
      } else {
        // Return to formation
        e.state = 'returning';
        e.path = createEntryPath(e.x, e.y, e.homeX, e.homeY, 1);
        e.pathProgress = 0;
      }
    }
  }

  if (!anyEntering && !game.allEntered) {
    game.allEntered = true;
  }

  // Trigger dives
  if (game.allEntered) {
    game.diveTimer++;
    if (game.diveTimer >= game.diveInterval) {
      game.diveTimer = 0;
      // Pick a random formation enemy to dive
      const candidates = game.enemies.filter(e => e.alive && e.state === 'formation');
      if (candidates.length > 0) {
        const e = candidates[Math.floor(Math.random() * candidates.length)];
        // Boss might try to capture
        if (e.type === 'boss' && !e.capturedShip && !game.dualFighter && Math.random() < 0.2 && game.capturedShipEnemy === null) {
          e.state = 'capturing';
          e.captureTimer = 0;
          playSound('captureSiren');
          setTimeout(() => playSound('capture'), 250);
        } else {
          // Telegraph the dive: 30-frame preview where the path is visible but the enemy stays put.
          e.previewTimer = 30;
          e.previewPath = createLoopPath(e.x, e.y, e.x < BASE_W/2 ? 1 : -1);
          playSound('enemyDive');
          // If boss, escorts get a slightly-delayed preview
          if (e.type === 'boss') {
            const escorts = game.enemies.filter(es => es.alive && es.state === 'formation' && es.type === 'butterfly' && Math.abs(es.col - e.col) <= 1 && es.row === 1);
            escorts.slice(0, 2).forEach((es, idx) => {
              setTimeout(() => {
                if (es.alive && es.state === 'formation' && !es.previewTimer) {
                  es.previewTimer = 30;
                  es.previewPath = createLoopPath(es.x, es.y, idx === 0 ? 1 : -1);
                }
              }, 200);
            });
          }
        }
      }
    }
  }

  // Kamikaze spawn (stage 3+, only during normal gameplay after entry)
  if (game.allEntered && game.stage >= 3 && game.playerAlive) {
    game.kamikazeTimer++;
    const interval = Math.max(180, 540 - game.stage * 25);
    if (game.kamikazeTimer >= interval) {
      game.kamikazeTimer = 0;
      const k = {
        type: 'kamikaze',
        alive: true, hp: 1,
        x: 30 + Math.random() * (BASE_W - 60),
        y: -12,
        vx: 0,
        vy: 1.6 + game.stage * 0.08,
        state: 'kamikaze',
        frame: 0, frameTimer: 0
      };
      game.enemies.push(k);
      playSound('enemyDive');
    }
  }

  // UFO bonus spawn (stage 4+, rare)
  if (game.allEntered && game.stage >= 4 && game.playerAlive) {
    game.ufoTimer++;
    const ufoInterval = Math.max(420, 900 - game.stage * 18);
    const alreadyOut = game.enemies.some(e => e.alive && e.type === 'ufo');
    if (!alreadyOut && game.ufoTimer >= ufoInterval && Math.random() < 0.6) {
      game.ufoTimer = 0;
      const fromLeft = Math.random() < 0.5;
      game.enemies.push({
        type: 'ufo',
        alive: true, hp: 1,
        x: fromLeft ? -14 : BASE_W + 14,
        y: 22 + Math.random() * 18,
        vx: (fromLeft ? 1 : -1) * (1.6 + game.stage * 0.04),
        vy: 0,
        state: 'ufo',
        frame: 0, frameTimer: 0
      });
      // RARE SPAWN ALERT — let the player know to chase the UFO
      game.rareSpawnAlertLife = 90;
      game.rareSpawnAlertText = '! UFO !';
      game.rareSpawnAlertColor = '#0ef';
    }
  }

  // Golden bee bonus spawn (stage 6+, rarer than UFO, zig-zags down from top)
  if (game.allEntered && game.stage >= 6 && game.playerAlive) {
    game.goldenBeeTimer++;
    const gbInterval = Math.max(720, 1500 - game.stage * 24);
    const alreadyOut = game.enemies.some(e => e.alive && e.type === 'goldenBee');
    if (!alreadyOut && game.goldenBeeTimer >= gbInterval && Math.random() < 0.35) {
      game.goldenBeeTimer = 0;
      game.enemies.push({
        type: 'goldenBee',
        alive: true, hp: 1,
        x: 30 + Math.random() * (BASE_W - 60),
        y: -10,
        vx: 0, vy: 1.0 + game.stage * 0.03,
        state: 'goldenBee',
        zigPhase: Math.random() * Math.PI * 2,
        frame: 0, frameTimer: 0
      });
      // RARE SPAWN ALERT — golden bee is even rarer, brighter alert
      game.rareSpawnAlertLife = 120;
      game.rareSpawnAlertText = '★ GOLDEN BEE ★';
      game.rareSpawnAlertColor = '#fc4';
    }
  }

  // Boomerang hover (stage 11+) — helicopter that sweeps left-right firing aimed shots
  if (game.allEntered && game.stage >= 11 && game.playerAlive) {
    game.hovererTimer++;
    const hInterval = Math.max(660, 1320 - game.stage * 22);
    const alreadyOut = game.enemies.some(e => e.alive && e.type === 'hoverer');
    if (!alreadyOut && game.hovererTimer >= hInterval && Math.random() < 0.32) {
      game.hovererTimer = 0;
      const fromLeft = Math.random() < 0.5;
      game.enemies.push({
        type: 'hoverer',
        alive: true, hp: 2,
        x: fromLeft ? -14 : BASE_W + 14,
        y: 36,
        vx: (fromLeft ? 1 : -1) * (1.0 + game.stage * 0.025),
        vy: 0,
        state: 'hoverer',
        sweepPhase: 0,
        shootTimer: 0,
        frame: 0, frameTimer: 0
      });
    }
  }

  // Mirror clone (stage 13+) — ghosts a mirrored copy of the player at fixed altitude
  if (game.allEntered && game.stage >= 13 && game.playerAlive) {
    game.mirrorTimer++;
    const mInterval = Math.max(540, 1200 - game.stage * 20);
    const alreadyOut = game.enemies.some(e => e.alive && e.type === 'mirror');
    if (!alreadyOut && game.mirrorTimer >= mInterval && Math.random() < 0.30) {
      game.mirrorTimer = 0;
      game.enemies.push({
        type: 'mirror',
        alive: true, hp: 2,
        x: BASE_W - game.playerX, y: 30,
        vx: 0, vy: 0,
        state: 'mirror',
        shootTimer: 0,
        bobPhase: 0,
        frame: 0, frameTimer: 0
      });
    }
  }
}

function updateChallengeEnemies() {
  const wave = game.challengeWaves[game.challengeWaveIdx];
  if (!wave) return;

  for (const e of wave) {
    if (!e.alive) continue;
    e.frameTimer = (e.frameTimer || 0) + 1;
    if (e.frameTimer > 15) { e.frame++; e.frameTimer = 0; }

    e.x += e.vx;
    e.y += e.vy;

    if (e.pattern === 'top_down') {
      // Sine oscillation on x axis; movement is vertical
      e.sinPhase += 0.05;
      e.x = e.baseX + Math.sin(e.sinPhase) * e.sinAmp;
      if (e.y >= BASE_H + 20) { e.alive = false; e.escaped = true; }
    } else if (e.pattern === 'diagonal') {
      // Straight diagonal — no sine; exit on any far edge or bottom
      if (e.x <= -30 || e.x >= BASE_W + 30 || e.y >= BASE_H + 30) { e.alive = false; e.escaped = true; }
    } else {
      // Horizontal patterns (sweep_lr, sweep_rl, pincer, double_row)
      e.sinPhase += 0.05;
      e.y = e.baseY + Math.sin(e.sinPhase) * e.sinAmp;
      if (e.x <= -20 || e.x >= BASE_W + 20) { e.alive = false; e.escaped = true; }
    }
  }

  if (wave.every(e => !e.alive)) {
    // CHALLENGE QUICK CLEAR — bonus when the wave was cleared inside 6 seconds
    // (360 frames). Tracks wave-start frame so cumulative elapsed is measured
    // per wave, not per stage. Pure additive bonus, capped by 8 waves/stage.
    if (game.state === STATE.CHALLENGING && typeof game.challengeWaveStartFrame === 'number') {
      const waveElapsed = game.stageFrames - game.challengeWaveStartFrame;
      if (waveElapsed <= 360 && waveElapsed > 0) {
        addScore(250);
        game.floatTexts.push({
          x: BASE_W/2, y: BASE_H/2 - 24, text: 'QUICK CLEAR +250',
          color: '#0ff', life: 50, maxLife: 50, size: 7
        });
        playSound('powerUp');
      }
    }
    // PERFECT WAVE — every enemy killed (none escaped). Gold banner + SFX.
    const _anyEscaped = wave.some(e => e.escaped);
    if (!_anyEscaped) {
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 + 18,
        text: 'PERFECT WAVE!',
        color: '#fc4', life: 60, maxLife: 60, size: 8
      });
      game.perfectWavesRun = (game.perfectWavesRun || 0) + 1;
      game.stagePerfectWaves = (game.stagePerfectWaves || 0) + 1;
      if (typeof playSound === 'function') playSound('milestone');
      // RUN PERFECT WAVE MILESTONES — gold banner at 5/10/20 lifetime-of-run
      if (game.perfectWavesRun === 5 || game.perfectWavesRun === 10 || game.perfectWavesRun === 20) {
        game.floatTexts.push({
          x: BASE_W/2, y: BASE_H/2 - 18,
          text: 'PERFECT WAVES x' + game.perfectWavesRun,
          color: '#fc4', life: 90, maxLife: 90, size: 9
        });
        if (typeof spawnConfetti === 'function') spawnConfetti(10);
      }
      // ALL-PERFECT STAGE BANNER — all waves in this stage perfect (final wave).
      if (game.challengeWaves
          && (game.challengeWaveIdx + 1) === game.challengeWaves.length
          && game.stagePerfectWaves === game.challengeWaves.length) {
        game.floatTexts.push({
          x: BASE_W/2, y: BASE_H/2 + 8,
          text: 'ALL-PERFECT STAGE!',
          color: '#fc4', life: 110, maxLife: 110, size: 11
        });
        if (typeof spawnConfetti === 'function') spawnConfetti(20);
        game.flashTimer = Math.max(game.flashTimer || 0, 10);
        game.flashColor = '#fc4';
        game.allPerfectStagesRun = (game.allPerfectStagesRun || 0) + 1;
      }
    } else {
      game.stagePerfectWaves = 0; // any escape breaks all-perfect streak
    }
    // WAVE CLEAR FEEDBACK — short tick on every wave clear (not just quick ones)
    // so the player gets immediate auditory confirmation. Skip on the FINAL wave
    // (about to transition to stage clear, which has its own fanfare).
    const isFinalWave = (game.challengeWaveIdx + 1) >= (game.challengeWaves ? game.challengeWaves.length : 0);
    if (!isFinalWave) {
      playSound('tick');
      // Small "+1" wave count pip near top
      game.floatTexts.push({
        x: BASE_W - 18, y: 36, text: '+1',
        color: '#f6f', life: 30, maxLife: 30, size: 5
      });
      // WAVE TRANSITION SHOCKWAVE — magenta expanding ring from center for a
      // cinematic between-wave beat. Skipped on final wave (stage clear fanfare).
      if (game.shockwaves) {
        game.shockwaves.push({
          x: BASE_W/2, y: BASE_H/2,
          life: 0, maxLife: 18, maxR: 100, color: '#f6f'
        });
      }
    }
    game.challengeWaveIdx++;
    game.challengeWaveStartFrame = game.stageFrames; // mark start of next wave
    game.challengeWaveTimer = 35; // brief telegraph window between waves
    // FINAL WAVE BANNER — when the NEXT wave is the last one, surface a clear
    // "FINAL WAVE!" callout so the player knows the stage closes after it.
    if (game.challengeWaves
        && (game.challengeWaveIdx + 1) === game.challengeWaves.length) {
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 30, text: 'FINAL WAVE!',
        color: '#f6f', life: 70, maxLife: 70, size: 10
      });
    }
  }
}

function updateCollisions() {
  const enemies = game.state === STATE.CHALLENGING
    ? (game.challengeWaves[game.challengeWaveIdx] || [])
    : game.enemies;

  // SHOOTING STAR WISH — player bullets can hit a wish-variant shooting star for
  // +100 score, gold confetti, and a celebratory floatText. Single-hit consumes
  // the star (splice). Skipped for laser to avoid auto-vacuuming wishes on touch.
  if (game.shootingStars) {
    for (let bi = game.bullets.length - 1; bi >= 0; bi--) {
      const b = game.bullets[bi];
      if (b.kind === 'laser') continue;
      for (let si = game.shootingStars.length - 1; si >= 0; si--) {
        const ss = game.shootingStars[si];
        if (!ss.wish) continue;
        if (Math.abs(b.x - ss.x) < 6 && Math.abs(b.y - ss.y) < 6) {
          addScore(100);
          try {
            const wt = parseInt(localStorage.getItem('galagaWishCount') || '0', 10) || 0;
            const nw = wt + 1;
            localStorage.setItem('galagaWishCount', String(nw));
            if (nw >= 10) unlockAchievement('wishHunter');
          } catch (e) {}
          game.shootingStars.splice(si, 1);
          game.bullets.splice(bi, 1);
          game.floatTexts.push({
            x: ss.x, y: ss.y - 6, text: 'WISH +100',
            color: '#fc4', life: 50, maxLife: 50, size: 7
          });
          // Gold sparkle ring
          for (let k = 0; k < 8; k++) {
            const a = (k / 8) * Math.PI * 2;
            game.itemBursts.push({
              x: ss.x + Math.cos(a) * 4,
              y: ss.y + Math.sin(a) * 4,
              life: -k, color: '#fc4'
            });
          }
          playSound('powerUp');
          break;
        }
      }
    }
  }

  // Player bullets vs enemies
  for (let bi = game.bullets.length - 1; bi >= 0; bi--) {
    const b = game.bullets[bi];
    const isLaser = b.kind === 'laser';
    for (const e of enemies) {
      if (!e.alive) continue;
      // Laser pierces — skip enemies it has already damaged this run so a beam doesn't
      // re-tick the same target every frame while passing through.
      if (isLaser && b.pierced && b.pierced.has(e)) continue;
      const dx = Math.abs(b.x - e.x), dy = Math.abs(b.y - e.y);
      if (dx < 8 && dy < 8) {
        if (isLaser) { b.pierced.add(e); }
        else { game.bullets.splice(bi, 1); }
        game.stats.shotsHit++;
        game.stageShotsHit++;
        const _prevHp = e.hp;
        e.hp -= b.dmg || 1;
        // CRITICAL HP PULSE — when an enemy drops to hp 1 (one hit from death),
        // start a 16-frame red pulse on the sprite. Skipped on instant kills.
        if (e.hp === 1 && _prevHp > 1) {
          e.criticalPulseTimer = 16;
        }
        // ENEMY HIT FLASH — 4-frame white tint on non-fatal hit. Reads as
        // "I damaged it" without needing to read sparks. Only meaningful when
        // enemy still alive (skipped on kill — explosion takes over).
        if (e.hp > 0) e.hitFlashTimer = 4;
        // CRIT NON-KILL FLAIR — even if crit didn't finish the enemy, mark
        // the moment with a small gold spark trio + 'CRIT' text so the player
        // sees the +50% damage land. Kill-crit cinematic stays untouched below.
        if (b.crit && e.hp > 0) {
          for (let k = 0; k < 3; k++) {
            const _a = (k / 3) * Math.PI * 2 + Math.random() * 0.5;
            game.itemBursts.push({
              x: e.x + Math.cos(_a) * 5,
              y: e.y + Math.sin(_a) * 5,
              life: -k, color: '#fc4'
            });
          }
          game.floatTexts.push({
            x: e.x, y: e.y - 10, text: 'CRIT',
            color: '#fc4', life: 28, maxLife: 28, size: 5
          });
        }
        // GHOST REVEAL — first hit on a ghost variant reveals it (full alpha)
        if (e.ghost && !e.ghostRevealed) e.ghostRevealed = true;
        // Shield-break feedback (only when not killed in same hit)
        if (e.hp > 0 && e.type === 'shielded' && !e.shieldBroken) {
          e.shieldBroken = true;
          for (let s = 0; s < 6; s++) {
            game.hitSparks.push({x: e.x + (Math.random()-0.5)*10, y: e.y + (Math.random()-0.5)*8, life: -s});
          }
          playSound('crit');
        }
        if (e.hp <= 0) {
          e.alive = false;
          // CRIT KILL CINEMATIC — when a crit bullet lands the killing blow,
          // award gold sparkle ring + 'CRIT KILL!' text + persistent counter.
          if (b.crit) {
            for (let k = 0; k < 8; k++) {
              const a = (k / 8) * Math.PI * 2;
              game.itemBursts.push({
                x: e.x + Math.cos(a) * 6,
                y: e.y + Math.sin(a) * 6,
                life: -k, color: '#fc4'
              });
            }
            game.floatTexts.push({
              x: e.x, y: e.y - 14, text: 'CRIT KILL!',
              color: '#fc4', life: 42, maxLife: 42, size: 7
            });
            try {
              const ck = parseInt(localStorage.getItem('galagaCritKills') || '0', 10) || 0;
              localStorage.setItem('galagaCritKills', String(ck + 1));
            } catch (e) {}
            // Session counter for intro peek
            game.critKillsRun = (game.critKillsRun || 0) + 1;
          }
          game.stats.kills++;
          game.stageKills = (game.stageKills || 0) + 1;
          // SAME-TYPE KILL STREAK — track consecutive kills of same enemy type
          if (game._lastKillType === e.type) {
            game._sameTypeStreak = (game._sameTypeStreak || 1) + 1;
          } else {
            game._sameTypeStreak = 1;
            game._lastKillType = e.type;
          }
          // KILLED TYPES SET — track unique types killed this run (for variety peek)
          if (!game.killedTypes) game.killedTypes = new Set();
          game.killedTypes.add(e.type);
          // KILLS-BY-TYPE SESSION TALLY — batched to localStorage at run end
          // (commitGameToCumStats) to avoid hot-path localStorage writes that
          // can stutter under dense bomb/laser kills.
          if (!game.killsByTypeRun) game.killsByTypeRun = {};
          game.killsByTypeRun[e.type] = (game.killsByTypeRun[e.type] || 0) + 1;
          // VARIETY HUNTER — one-shot banner when 8 unique types killed
          if (game.killedTypes.size === 8 && !game._varietyFired) {
            game._varietyFired = true;
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 - 30, text: 'VARIETY HUNTER',
              color: '#fc4', life: 90, maxLife: 90, size: 9
            });
            if (typeof spawnConfetti === 'function') spawnConfetti(10);
            if (typeof playSound === 'function') playSound('milestone');
          }
          if (game._sameTypeStreak === 5 || game._sameTypeStreak === 10) {
            const _typeColors = {
              bee: '#fc4', butterfly: '#f48', boss: '#f8a', mirror: '#8ff',
              splitter: '#0fc', shielded: '#4f8', ufo: '#f6f',
              hoverer: '#fa0', kamikaze: '#f80', goldenBee: '#fc4', minibee: '#fa4'
            };
            game.floatTexts.push({
              x: e.x, y: e.y - 18,
              text: e.type.toUpperCase() + ' HUNT x' + game._sameTypeStreak,
              color: _typeColors[e.type] || '#fff',
              life: 50, maxLife: 50, size: 7
            });
            if (typeof playSound === 'function') playSound('tick');
          }
          if (game.stats.kills === 1) {
            unlockAchievement('firstBlood');
            markTutorialDone(); // First kill = player understands fire
          }
          // PERK 'vampire' — every 10th non-bomb kill grants +1 shield (capped by SHIELD_MAX).
          if (game.activePerk === 'vampire' && game.stats.kills > 0 && game.stats.kills % 10 === 0
              && (game.shieldCharges || 0) < SHIELD_MAX) {
            game.shieldCharges = (game.shieldCharges || 0) + 1;
            game.floatTexts.push({
              x: game.playerX, y: game.playerY - 12, text: 'VAMPIRE +SHIELD',
              color: '#f6f', life: 50, maxLife: 50, size: 6
            });
            playSound('powerUp');
          }
          bumpCombo();
          const inForm = e.state === 'formation';
          // EARLY INTERCEPT — kill while enemy is still in entering path.
          // Small flat bonus + callout. Rewards aggressive opening play.
          const isIntercept = e.state === 'entering';
          const basePts = getEnemyPoints(e.type, inForm);
          const mult = comboMultiplier(game.combo);
          const eliteMul = e.elite ? 1.5 : 1;
          const ghostMul = e.ghost ? 2 : 1;
          const pts = Math.round(basePts * mult * eliteMul * ghostMul);
          addScore(pts);
          if (isIntercept) {
            addScore(50);
            game.interceptCount = (game.interceptCount || 0) + 1;
            game.stageInterceptCount = (game.stageInterceptCount || 0) + 1;
            game.floatTexts.push({
              x: e.x, y: e.y - 14, text: 'INTERCEPT +50',
              color: '#0ff', life: 30, maxLife: 30, size: 5
            });
            // OPENING SALVO — first 5 intercepts within first 180 frames of a
            // stage. Bonus banner + score on the 5th intercept of the stage.
            if (game.stageInterceptCount === 5
                && (game.stageFrames || 0) <= 180
                && !game._openingSalvoFired) {
              game._openingSalvoFired = true;
              addScore(500);
              game.floatTexts.push({
                x: BASE_W/2, y: BASE_H/2 - 20, text: 'OPENING SALVO',
                color: '#ff4', life: 70, maxLife: 70, size: 11
              });
              game.floatTexts.push({
                x: BASE_W/2, y: BASE_H/2 - 8, text: '+500',
                color: '#fff', life: 70, maxLife: 70, size: 6
              });
              game.flashTimer = Math.max(game.flashTimer || 0, 5);
              game.flashColor = '#ff4';
              if (typeof spawnConfetti === 'function') spawnConfetti(8);
              if (typeof playSound === 'function') playSound('milestone');
            }
          }
          game.comboBonusAccum = (game.comboBonusAccum || 0) + pts;
          // KILL SCORE FLOATER — per-kill "+N" at the kill site for kills that
          // earned a meaningful score (≥200). Color escalates with point value so
          // big combo kills stand out. Skipped on tiny base kills to keep the
          // screen readable during normal play.
          if (pts >= 200) {
            const ksCol = pts >= 1000 ? '#ff4' : pts >= 500 ? '#fc4' : '#fff';
            game.floatTexts.push({
              x: e.x + (Math.random() * 4 - 2),
              y: e.y - 6,
              text: '+' + pts,
              color: ksCol, life: 22, maxLife: 22, size: pts >= 1000 ? 7 : 5
            });
          }
          if (e.ghost) {
            // GHOST KILL CELEBRATION — purple sparkle burst + banner + persistent counter
            game.floatTexts.push({
              x: e.x, y: e.y - 12, text: 'GHOST KILL!',
              color: '#a8f', life: 50, maxLife: 50, size: 8
            });
            // GHOST CHAIN — per-stage tally. 2nd+ ghost in same stage adds
            // a +100 bonus and a "GHOST CHAIN x N" callout.
            game.stageGhostKills = (game.stageGhostKills || 0) + 1;
            if (game.stageGhostKills >= 2) {
              addScore(100);
              game.floatTexts.push({
                x: BASE_W/2, y: BASE_H/2 - 14,
                text: 'GHOST CHAIN x' + game.stageGhostKills,
                color: '#a8f', life: 70, maxLife: 70, size: 9
              });
            }
            if (game.shockwaves) {
              game.shockwaves.push({ x: e.x, y: e.y, life: 0, maxLife: 18, maxR: 16, color: '#a8f' });
            }
            for (let k = 0; k < 8; k++) {
              const a = (k / 8) * Math.PI * 2;
              game.itemBursts.push({
                x: e.x + Math.cos(a) * 6,
                y: e.y + Math.sin(a) * 6,
                life: -k, color: '#a8f'
              });
            }
            playSound('powerUp');
            try {
              const gk = parseInt(localStorage.getItem('galagaGhostKills') || '0', 10) || 0;
              const ngk = gk + 1;
              localStorage.setItem('galagaGhostKills', String(ngk));
              if (ngk >= 5 && typeof unlockAchievement === 'function')  unlockAchievement('ghost5');
              if (ngk >= 25 && typeof unlockAchievement === 'function') unlockAchievement('ghost25');
            } catch (e) {}
          }
          if (e.elite) {
            game.eliteKills = (game.eliteKills || 0) + 1;
            // Brief floating "ELITE!" tag so the kill reads as more meaningful
            game.floatTexts.push({
              x: e.x, y: e.y - 10, text: 'ELITE!',
              color: '#f44', life: 32, maxLife: 32, size: 6
            });
            // ELITE KILL FLASH — extra cinematic: red shockwave + 8 radial sparks.
            // Purely visual (no AoE damage); differentiates elite kills from base.
            if (game.shockwaves) {
              game.shockwaves.push({
                x: e.x, y: e.y, life: 0, maxLife: 16, maxR: 14, color: '#f44'
              });
            }
            for (let k = 0; k < 8; k++) {
              const a = (k / 8) * Math.PI * 2;
              game.itemBursts.push({
                x: e.x + Math.cos(a) * 5,
                y: e.y + Math.sin(a) * 5,
                life: -k, color: '#fc4'
              });
            }
            game.shakeTimer = Math.max(game.shakeTimer || 0, 4);
          }
          game.explosions.push({x: e.x, y: e.y, timer: 0, maxTime: 20});
          // TYPE-SPECIFIC DEATH FLAIR — adds visual identity per enemy type on top of
          // the base explosion. Splitter (already splits into minibees) and goldenBee
          // (already meteor shower) skipped — they have native flair already.
          // Layered effects use existing pools (itemBursts / hitSparks / shockwaves)
          // so no new buffer types need management.
          if (e.type === 'mirror') {
            // Glass shatter — 6 cyan shards radiating outward + central flash
            for (let s = 0; s < 6; s++) {
              const a = (s / 6) * Math.PI * 2 + Math.random() * 0.3;
              const r = 4 + Math.random() * 6;
              game.itemBursts.push({
                x: e.x + Math.cos(a) * r,
                y: e.y + Math.sin(a) * r,
                life: -s * 2, color: '#0ff'
              });
            }
            for (let s = 0; s < 4; s++) {
              game.hitSparks.push({
                x: e.x + (Math.random() - 0.5) * 8,
                y: e.y + (Math.random() - 0.5) * 8,
                life: -s
              });
            }
          } else if (e.type === 'shielded') {
            // 2-stage death — cyan shield burst ring (first) + delayed pale-blue ring (second)
            game.shockwaves.push({ x: e.x, y: e.y, life: 0, maxLife: 12, maxR: 14, color: '#cef' });
            game.shockwaves.push({ x: e.x, y: e.y, life: -8, maxLife: 14, maxR: 18, color: '#0ff' });
            for (let s = 0; s < 8; s++) {
              const a = (s / 8) * Math.PI * 2;
              game.itemBursts.push({
                x: e.x + Math.cos(a) * 10,
                y: e.y + Math.sin(a) * 10,
                life: -s, color: '#cef'
              });
            }
          } else if (e.type === 'kamikaze') {
            // Red shockwave + radial debris burst (the kamikaze "explodes ITSELF" feel)
            game.shockwaves.push({ x: e.x, y: e.y, life: 0, maxLife: 16, maxR: 20, color: '#f44' });
            for (let s = 0; s < 10; s++) {
              const a = (s / 10) * Math.PI * 2;
              const sp = 1.2 + Math.random() * 0.8;
              game.shootingStars.push({
                x: e.x, y: e.y,
                vx: Math.cos(a) * sp,
                vy: Math.sin(a) * sp,
                life: 0, maxLife: 18 + Math.floor(Math.random() * 8)
              });
            }
            game.flashTimer = Math.max(game.flashTimer, 4);
            game.flashColor = '#f44';
          } else if (e.type === 'ufo') {
            // Implosion — 4 sparks rush INWARD then central white flash
            for (let s = 0; s < 4; s++) {
              const a = (s / 4) * Math.PI * 2 + Math.PI / 4;
              game.itemBursts.push({
                x: e.x + Math.cos(a) * 10,
                y: e.y + Math.sin(a) * 10,
                life: -s * 2, color: '#0ef'
              });
              game.itemBursts.push({
                x: e.x + Math.cos(a) * 5,
                y: e.y + Math.sin(a) * 5,
                life: -s * 2 - 4, color: '#fff'
              });
            }
            // Central flash (faux brightness via white pixel sparks)
            for (let s = 0; s < 6; s++) {
              game.hitSparks.push({ x: e.x, y: e.y, life: -s });
            }
          }
          // Kill score popup — color escalates by enemy value, multiplier glow
          const popColor = mult >= 2 ? '#f6f'
                         : mult >= 1.5 ? '#ff4'
                         : e.type === 'goldenBee' ? '#fc4'
                         : e.type === 'ufo' ? '#0ef'
                         : e.type === 'mirror' ? '#0ff'
                         : e.type === 'shielded' ? '#cef'
                         : e.type === 'boss' ? '#f8a'
                         : e.type === 'butterfly' ? '#f6a' : '#fff';
          const popText = mult > 1 ? '+' + pts + ' ×' + mult : '+' + pts;
          // Pop size scales with multiplier: bigger combos = more visible numbers
          const popSize = mult >= 2.5 ? 9 : mult >= 2 ? 8 : mult >= 1.5 ? 7 : 6;
          game.floatTexts.push({
            x: e.x, y: e.y - 4, text: popText,
            color: popColor, life: 40, maxLife: 40, size: popSize
          });
          // Hit spark burst at impact point
          game.hitSparks.push({x: b.x, y: b.y, life: 0});
          // TYPE-SPECIFIC KILL SFX — distinct audio identity for each major enemy type.
          // minibee falls back to 'explode' (splitter spawns many; unique sfx would spam).
          const killSfx = e.type === 'mirror'    ? 'killMirror'
                       : e.type === 'shielded'  ? 'killShielded'
                       : e.type === 'kamikaze'  ? 'killKamikaze'
                       : e.type === 'ufo'       ? 'killUfo'
                       : e.type === 'bee'       ? 'killBee'
                       : e.type === 'butterfly' ? 'killButterfly'
                       : e.type === 'hoverer'   ? 'killHoverer'
                       : e.type === 'splitter'  ? 'killSplitter'
                       : e.type === 'boss'      ? 'killFormationBoss'
                       : e.type === 'goldenBee' ? 'killGoldenBee'
                       :                          'explode';
          // KILL CHAIN AUDIO — chain count tracks consecutive kills within 30
          // frames of each other. At tier 5+, swap base SFX for 'crit' to add
          // audio cresc to long streaks. Decay is checked at the chain branch.
          if ((game.animFrame - (game.lastKillFrame || 0)) <= 30) {
            game._killChainAudio = (game._killChainAudio || 0) + 1;
          } else {
            game._killChainAudio = 1;
          }
          // Use 'crit' SFX as a high-tier substitute when chain ≥ 5; keeps the
          // type-specific killSfx for solo kills and short chains.
          if (game._killChainAudio >= 5) {
            playSound('crit');
          } else {
            playSound(killSfx);
          }

          // TRICK SHOT — 2+ kills in the same frame (typically chained off explosions/splitter chain)
          if (game.lastKillFrame === game.animFrame) {
            unlockAchievement('trickShot');
          }
          // MULTI-KILL BONUS — track kills per animFrame; award tiered bonus
          // on the 3rd, 5th, and 10th kill of the same frame (laser pierce or
          // splitter chain reactions). One bonus per tier per frame.
          if (game._multiKillFrame !== game.animFrame) {
            game._multiKillFrame = game.animFrame;
            game._multiKillCount = 0;
          }
          game._multiKillCount++;
          const _mkc = game._multiKillCount;
          let _mkBonus = 0, _mkLabel = '';
          if (_mkc === 3)       { _mkBonus = 300;  _mkLabel = 'MULTI x3!'; }
          else if (_mkc === 5)  { _mkBonus = 800;  _mkLabel = 'MULTI x5!'; }
          else if (_mkc === 10) { _mkBonus = 2000; _mkLabel = 'MULTI x10!'; }
          if (_mkBonus > 0) {
            addScore(_mkBonus);
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 - 12, text: _mkLabel + ' +' + _mkBonus,
              color: '#fc4', life: 50, maxLife: 50, size: _mkc >= 10 ? 11 : 9
            });
            playSound('milestone');
          }
          game.lastKillFrame = game.animFrame;
          // Bestiary unlock — first kill of each type registers in the codex.
          // Idempotent: subsequent kills no-op the unlock path.
          unlockDex(e.type);
          // Per-run kill-by-type counters for various achievements
          if (e.type === 'butterfly') {
            game.butterflyKills = (game.butterflyKills || 0) + 1;
            if (game.butterflyKills === 100) unlockAchievement('butterflyHunt');
          }
          if (e.type === 'bee') {
            game.beeKills = (game.beeKills || 0) + 1;
            if (game.beeKills === 200) unlockAchievement('beeBlitz');
          }
          if (e.type === 'boss') {
            game.bossKills = (game.bossKills || 0) + 1;
            if (game.bossKills === 50) unlockAchievement('bossHunter');
          }
          if (e.type === 'mirror') {
            game.mirrorKills = (game.mirrorKills || 0) + 1;
            if (game.mirrorKills === 5) unlockAchievement('mirrorBreaker');
          }
          if (e.type === 'splitter') {
            game.splitterKills = (game.splitterKills || 0) + 1;
            if (game.splitterKills === 20) unlockAchievement('splitterPro');
          }
          if (e.type === 'shielded') {
            game.shieldedKills = (game.shieldedKills || 0) + 1;
            if (game.shieldedKills === 10) unlockAchievement('shieldBreaker');
          }
          if (e.type === 'ufo') {
            game.ufoKills = (game.ufoKills || 0) + 1;
            if (game.ufoKills === 3) unlockAchievement('ufoChaser');
            if (game.ufoKills === 10) unlockAchievement('ufoFleet');
          }
          if (e.type === 'hoverer') {
            game.hovererKills = (game.hovererKills || 0) + 1;
            if (game.hovererKills === 10) unlockAchievement('hovererSlay');
          }
          if (e.type === 'kamikaze') {
            game.kamikazeKills = (game.kamikazeKills || 0) + 1;
            if (game.kamikazeKills === 30) unlockAchievement('kamikazeStop');
          }
          if (e.type === 'goldenBee') {
            game.goldenKills = (game.goldenKills || 0) + 1;
            if (game.goldenKills === 5) unlockAchievement('goldRush');
          }
          if (e.type === 'minibee') {
            game.minibeeKills = (game.minibeeKills || 0) + 1;
            if (game.minibeeKills === 50) unlockAchievement('miniBuster');
          }
          // Achievement: shooting a golden bee
          if (e.type === 'goldenBee') {
            unlockAchievement('goldenTouch');
            // Meteor shower — 12 streaks radiating outward, with shooting-star tails
            for (let k = 0; k < 12; k++) {
              const a = (k / 12) * Math.PI * 2 + (Math.random() - 0.5) * 0.2;
              const sp = 1.6 + Math.random() * 1.4;
              game.shootingStars.push({
                x: e.x, y: e.y,
                vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                life: 0, maxLife: 28 + Math.floor(Math.random() * 14)
              });
            }
            // Extra confetti for the celebration
            spawnConfetti(10);
          }
          // Tiny "+1" near kill point — only while in an active combo, so it reinforces the streak
          if (game.combo >= 3) {
            const offX = (Math.random() - 0.5) * 6;
            game.floatTexts.push({
              x: e.x + offX, y: e.y - 8, text: '+1',
              color: '#fff', life: 22, maxLife: 22, size: 5
            });
          }
          // OVERKILL — track kill timestamps and trigger when many fall in a short window
          {
            const now = game.animFrame;
            game.recentKillFrames = game.recentKillFrames || [];
            game.recentKillFrames = game.recentKillFrames.filter(f => now - f <= 60);
            game.recentKillFrames.push(now);
            if ((game.overkillCooldown || 0) <= 0) {
              const n = game.recentKillFrames.length;
              let label = null, bonus = 0, col = '#fff', size = 12;
              let shake = 0;
              // Halved from 5000/2500/1000 — these stack with comboMul (up to 3×) and DAILY
              // 1.25×, so the original values inflated late-stage runs heavily.
              if (n >= 12)      { label = 'GODLIKE!';  bonus = 3000; col = '#f6f'; size = 16; shake = 14; unlockAchievement('overkillMaster'); }
              else if (n >= 8)  { label = 'MASSACRE!'; bonus = 1500; col = '#f80'; size = 14; shake = 10; }
              else if (n >= 5)  { label = 'OVERKILL!'; bonus = 500;  col = '#ff4'; size = 12; shake = 6; }
              if (label) {
                addScore(bonus);
                game.floatTexts.push({
                  x: BASE_W/2, y: BASE_H/3, text: label,
                  color: col, life: 70, maxLife: 70, size
                });
                game.floatTexts.push({
                  x: BASE_W/2, y: BASE_H/3 + size, text: '+' + bonus,
                  color: '#ff4', life: 70, maxLife: 70, size: 10
                });
                game.overkillCooldown = 90;
                game.shakeTimer = Math.min(20, (game.shakeTimer || 0) + shake);
                game.flashTimer = Math.max(game.flashTimer || 0, n >= 12 ? 8 : n >= 8 ? 6 : 4);
                game.flashColor = col;
                rumble(120 + shake * 8, 0.4 + shake * 0.04, 0.2 + shake * 0.02);
                playSound('comboStep');
              }
            }
          }
          // Light haptic tick on each kill — heavier for special targets
          if (e.type === 'goldenBee' || e.type === 'ufo')      rumble(110, 0.55, 0.30);
          else if (e.type === 'boss' || e.type === 'shielded') rumble(70,  0.35, 0.15);
          else                                                  rumble(35,  0.20, 0.05);
          // Debris chunks scaled by enemy size
          spawnDebris(e.x, e.y, e.type);
          // Strike line — brief flash from player ship to kill site (4-frame fade)
          (game.strikeFx = game.strikeFx || []).push({
            x1: game.playerX, y1: game.playerY - 6,
            x2: e.x, y2: e.y, life: 0
          });
          // KILL CHAIN VISUAL — append kill position to recent buffer; drawn as a
          // line connecting consecutive kills, faded by age. Only renders when combo
          // >= 3 to keep it from spamming on low-skill play.
          (game.recentKillPositions = game.recentKillPositions || []).unshift({
            x: e.x, y: e.y, age: 0
          });
          if (game.recentKillPositions.length > 6) game.recentKillPositions.length = 6;
          // Brief radial flash at kill location — extra impact for boss/super kills
          if (e.type === 'boss' || e.type === 'shielded' || e.type === 'mirror') {
            for (let q = 0; q < 6; q++) {
              const a = (q / 6) * Math.PI * 2;
              game.itemBursts.push({
                x: e.x + Math.cos(a) * 6,
                y: e.y + Math.sin(a) * 6,
                life: -q, color: '#fff'
              });
            }
          }
          // Nearby formation enemies "flinch" briefly — set a visual flinch counter
          for (const ne of game.enemies) {
            if (!ne.alive || ne.state !== 'formation') continue;
            const ddx = Math.abs(ne.x - e.x), ddy = Math.abs(ne.y - e.y);
            if (ddx < 24 && ddy < 24) ne.flinch = 6;
          }
          // Shockwave ring — radius scales with enemy size
          const shockMax = e.type === 'goldenBee' ? 22 : e.type === 'ufo' || e.type === 'mirror' ? 18
                         : e.type === 'boss' || e.type === 'shielded' ? 16 : 12;
          const shockCol = e.type === 'goldenBee' ? '#fc4'
                         : e.type === 'ufo'       ? '#0ef'
                         : e.type === 'mirror'    ? '#0ff'
                         : e.type === 'boss' || e.type === 'shielded' ? '#f6f' : '#ff4';
          game.shockwaves.push({ x: e.x, y: e.y, life: 0, maxLife: 14, maxR: shockMax, color: shockCol });
          // Camera shake scaled by kill significance (additive — bigger kills feel bigger)
          let shakeAdd;
          if (e.type === 'goldenBee')                          shakeAdd = 8;
          else if (e.type === 'ufo')                           shakeAdd = 6;
          else if (e.type === 'boss' || e.type === 'shielded' || e.type === 'mirror') shakeAdd = 4;
          else if (e.type === 'splitter' || e.type === 'kamikaze') shakeAdd = 2;
          else                                                  shakeAdd = 0;
          if (shakeAdd > 0) game.shakeTimer = Math.min(20, game.shakeTimer + shakeAdd);
          // Hit-stop: brief pause-the-game on impactful kills (not every bee)
          let stopFrames = 0;
          if (e.type === 'goldenBee') stopFrames = 6;
          else if (e.type === 'ufo' || e.type === 'mirror') stopFrames = 4;
          else if (e.type === 'boss' || e.type === 'shielded') stopFrames = 2;
          if (stopFrames > game.hitStopFrames) game.hitStopFrames = stopFrames;
          // Zoom pulse on visually heavy kills — brief 1.04× swell + ease back
          let zoomPF = 0;
          if (e.type === 'goldenBee') zoomPF = 14;
          else if (e.type === 'ufo' || e.type === 'mirror') zoomPF = 10;
          else if (e.type === 'boss' || e.type === 'shielded') zoomPF = 7;
          if (zoomPF > (game.zoomPulse || 0)) game.zoomPulse = zoomPF;
          // Camera nudge — pull view briefly toward the kill site for big targets
          if (zoomPF > 0) {
            const nudge = e.type === 'goldenBee' ? 4 : e.type === 'ufo' || e.type === 'mirror' ? 3 : 2;
            const dx = e.x - BASE_W/2, dy = e.y - BASE_H/2;
            const len = Math.sqrt(dx*dx + dy*dy) || 1;
            game.camNudgeX = (dx / len) * nudge;
            game.camNudgeY = (dy / len) * nudge;
          }

          // Power-up drop (20% chance, golden bee = 100%). Type weights:
          //   S/N/P each ~17% (52% combined) — permanent level-up
          //   T  7%   — slow-time (timed)
          //   R  9%   — rapid fire (timed)
          //   W  9%   — wave/zigzag bullets (timed)
          //   H  8%   — homing bullets (timed)
          //   L  6%   — piercing laser (timed, rare/strong)
          //   E  7%   — shield charge (defensive, stackable)
          //   B  6%   — screen-clear bomb (instant)
          // Elite enemies have a boosted 35% drop chance (vs 20% normal); goldenBee always drops.
          // POWER UP PITY — track kills without a drop; force a drop at 15 to cap
          // unlucky streaks. Counter resets to 0 each time a power-up actually drops.
          const dropRate = e.elite ? 0.35 : 0.20;
          const pityForced = (game.killsSincePowerUp || 0) >= 15;
          const willDrop = e.type === 'goldenBee' || pityForced || Math.random() < dropRate;
          if (!willDrop) {
            game.killsSincePowerUp = (game.killsSincePowerUp || 0) + 1;
          }
          if (willDrop) {
            game.killsSincePowerUp = 0;
            // SMART POWER DROPS — zero-weight any S/N/P type that's already maxed,
            // then redistribute among remaining types. Avoids wasted pickups when
            // the player has S5 / N3 / P3. Other types (T/R/W/H/L/B/E) unaffected.
            const W = { S: 15, N: 16, P: 16, T: 10, R: 9, W: 8, H: 8, L: 6, B: 6, E: 6 };
            if ((game.lvl.S || 1) >= MAX_POWER_LVL.S) W.S = 0;
            if ((game.lvl.N || 1) >= MAX_POWER_LVL.N) W.N = 0;
            if ((game.lvl.P || 1) >= MAX_POWER_LVL.P) W.P = 0;
            let total = 0;
            for (const k in W) total += W[k];
            const pick = Math.random() * total;
            let acc = 0, type = 'E';
            for (const k in W) {
              acc += W[k];
              if (pick < acc) { type = k; break; }
            }
            game.powerUps.push({x: e.x, y: e.y, vy: 0.6, type});
            // POWERUP SPAWN BURST — small ring + 6-particle starburst at the drop
            // origin so the player visually catches the moment a pickup appears.
            // Rare types (L/B) get a stronger 2x-radius gold ring for emphasis.
            {
              const _puCols = { S:'#f44', N:'#0ff', P:'#f6f', T:'#8ff', R:'#fc4',
                                W:'#6cf', H:'#0f8', L:'#f6c', B:'#fff', E:'#0f8' };
              const _puCol = _puCols[type] || '#fff';
              const _rare = (type === 'L' || type === 'B');
              if (game.shockwaves) {
                game.shockwaves.push({
                  x: e.x, y: e.y, life: 0,
                  maxLife: _rare ? 24 : 16,
                  maxR: _rare ? 18 : 12,
                  color: _rare ? '#fc4' : _puCol
                });
              }
              if (game.itemBursts) {
                for (let k = 0; k < 6; k++) {
                  const _a = (k / 6) * Math.PI * 2;
                  game.itemBursts.push({
                    x: e.x + Math.cos(_a) * 4,
                    y: e.y + Math.sin(_a) * 4,
                    life: -k, color: _puCol
                  });
                }
              }
            }
            // POWERUP DROP CUE — type-aware spawn SFX so the player can hear
            // what's incoming before looking. Rare types get a stronger cue.
            const dropSfx = (type === 'L' || type === 'B') ? 'milestone'
                          : (type === 'H' || type === 'W') ? 'tick'
                          : 'tick';
            playSound(dropSfx);
          }

          // Splitter splits into 2 mini-bees on death
          if (e.type === 'splitter') {
            for (let s = 0; s < 2; s++) {
              game.enemies.push({
                type: 'minibee', alive: true, hp: 1,
                x: e.x, y: e.y,
                vx: (s === 0 ? -1 : 1) * (0.7 + Math.random() * 0.4),
                vy: 1.5 + Math.random() * 0.6,
                state: 'minibee',
                frame: 0, frameTimer: 0
              });
            }
          }

          // Self-rescue bonus — killing a boss MID-CAPTURE before it grabs your ship
          if (e.type === 'boss' && e.state === 'capturing' && !e.capturedShip) {
            addScore(1500);
            game.selfRescueCount = (game.selfRescueCount || 0) + 1;
            if (game.selfRescueCount === 5) unlockAchievement('savior');
            game.floatTexts.push({
              x: e.x, y: e.y - 12, text: 'SELF RESCUE!',
              color: '#fc4', life: 80, maxLife: 80, size: 9
            });
            game.floatTexts.push({
              x: e.x, y: e.y - 4, text: '+1500',
              color: '#ff4', life: 80, maxLife: 80, size: 8
            });
          }
          // If boss had captured ship, release it (enhanced rescue sequence)
          if (e.type === 'boss' && e.capturedShip && game.capturedShipEnemy === e) {
            game.dualFighter = true;
            game.capturedShipEnemy = null;
            unlockAchievement('dualPilot');
            playSound('rescue');
            playSound('dualFighter');
            // Triple-line celebration banner
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 - 18, text: 'DUAL FIGHTER!',
              color: '#ff4', life: 110, maxLife: 110, size: 14
            });
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 - 4, text: 'RESCUED',
              color: '#0ff', life: 100, maxLife: 100, size: 9
            });
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 + 8, text: 'FORMATION!',
              color: '#f6f', life: 100, maxLife: 100, size: 8
            });
            // Cascading vertical beam from rescue point down to the player
            const beamSteps = 22;
            const beamCols = ['#ff4', '#0ff', '#fff', '#f6f'];
            for (let k = 0; k < beamSteps; k++) {
              const t = k / (beamSteps - 1);
              const bx = e.x + (game.playerX - e.x) * t + (Math.random() - 0.5) * 3;
              const by = e.y + (game.playerY - e.y) * t;
              game.itemBursts.push({
                x: bx, y: by,
                life: -k * 1,
                color: beamCols[k % beamCols.length]
              });
            }
            // Ring burst around player (bigger than before)
            for (let k = 0; k < 16; k++) {
              const angle = (k / 16) * Math.PI * 2;
              const r = 16 + Math.random() * 12;
              game.itemBursts.push({
                x: game.playerX + Math.cos(angle) * r,
                y: game.playerY + Math.sin(angle) * r,
                life: -k * 2 - 22,
                color: k % 2 === 0 ? '#ff4' : '#0ff'
              });
            }
            // Ring burst at the freed boss location
            for (let k = 0; k < 8; k++) {
              const angle = (k / 8) * Math.PI * 2;
              const r = 12 + Math.random() * 6;
              game.itemBursts.push({
                x: e.x + Math.cos(angle) * r,
                y: e.y + Math.sin(angle) * r,
                life: -k,
                color: '#fff'
              });
            }
            spawnConfetti(20);
            game.flashTimer = 10;
            game.flashColor = '#ff4';
            game.shakeTimer = 8;
          }

          if (game.state === STATE.CHALLENGING) {
            game.challengeHits++;
          }
        }
        // Laser keeps going through the formation; normal bullets are consumed on hit.
        if (!isLaser) break;
      }
    }
  }

  // DASH PARRY — during a dash (dashTimer > 0), the player can DEFLECT enemy bullets
  // by passing through them. Each parried bullet: removed, +50 score, spark, sound.
  // Lives ABOVE the regular collision check (which skips while invincible) so we get
  // the parry effect during exactly the same iframe window as dash invincibility.
  if (game.playerAlive && (game.dashTimer || 0) > 0) {
    const hitW = game.dualFighter ? 16 : 7;
    for (let i = game.enemyBullets.length - 1; i >= 0; i--) {
      const b = game.enemyBullets[i];
      if (Math.abs(b.x - game.playerX) < hitW + 2 && Math.abs(b.y - game.playerY) < 9) {
        // PARRY DEFLECT GHOST — push 3 fading cyan ghosts upward from bullet pos
        // before removing the bullet. Reads as 'deflected back at sender'.
        if (game.itemBursts) {
          for (let _g = 0; _g < 3; _g++) {
            game.itemBursts.push({
              x: b.x, y: b.y - _g * 3,
              life: -_g * 2, color: '#0ff'
            });
          }
        }
        game.enemyBullets.splice(i, 1);
        // PARRY STREAK — chain parries within 90 frames stack. Tier-up base score
        // 50 → 75 → 100 → 150 (cap). Tier color cyan → purple → gold so chains
        // read as escalating skill expression.
        const streakActive = (game.parryStreakTimer || 0) > 0;
        game.parryStreak = streakActive ? (game.parryStreak || 0) + 1 : 1;
        game.parryStreakTimer = 90;
        if ((game.parryStreak || 0) > (game.parryStreakBest || 0)) game.parryStreakBest = game.parryStreak;
        if ((game.parryStreak || 0) >= 5) unlockAchievement('parryChain');
        // PARRY STREAK 10+ unlocks ULTRA tier (white-gold, 250 score). Below 10
        // the original 4-tier ramp applies. One-time ULTRA fanfare at streak===10.
        const tier = (game.parryStreak >= 10) ? 4
                    : Math.min(3, Math.floor((game.parryStreak - 1) / 2));
        const baseScore = [50, 75, 100, 150, 250][tier];
        const tierCol = ['#0ff', '#a8f', '#f6f', '#fc4', '#fff'][tier];
        const tierLabel = game.parryStreak >= 2 ? ('PARRY x' + game.parryStreak) : 'PARRY';
        // ULTRA PARRY fanfare — fires exactly once when streak crosses 10
        if (game.parryStreak === 10 && !game._ultraParryFired) {
          game._ultraParryFired = true;
          addScore(500);
          game.floatTexts.push({
            x: BASE_W/2, y: BASE_H/2 - 24, text: 'ULTRA PARRY',
            color: '#fff', life: 80, maxLife: 80, size: 12
          });
          game.floatTexts.push({
            x: BASE_W/2, y: BASE_H/2 - 12, text: 'CHAIN x10  +500',
            color: '#fc4', life: 70, maxLife: 70, size: 6
          });
          game.flashTimer = Math.max(game.flashTimer || 0, 8);
          game.flashColor = '#fff';
          if (typeof spawnConfetti === 'function') spawnConfetti(14);
          if (typeof playSound === 'function') playSound('milestone');
          rumble(280, 0.9, 0.5);
        }
        // PERK 'parryDividend' — parry score → 3×
        addScore(game.activePerk === 'parryDividend' ? baseScore * 3 : baseScore);
        // PERFECT PARRY — parry within the first 3 frames of dash (dashTimer
        // 10-12 of starting 12). Bonus +50 + gold "PERFECT" callout above the
        // bullet's deflect spot. Encourages tight timing reads.
        if ((game.dashTimer || 0) >= 10) {
          addScore(50);
          game.floatTexts.push({
            x: b.x, y: b.y - 14,
            text: 'PERFECT', color: '#fc4', life: 35, maxLife: 35, size: 6
          });
          game.perfectParries = (game.perfectParries || 0) + 1;
          try {
            const _pp = parseInt(localStorage.getItem('galagaPerfectParries') || '0', 10) || 0;
            localStorage.setItem('galagaPerfectParries', String(_pp + 1));
          } catch (e) {}
        }
        game.parryCount = (game.parryCount || 0) + 1;
        // PARRY LIFETIME TROPHIES — accumulate to localStorage for cross-run trophies
        try {
          const pt = parseInt(localStorage.getItem('galagaParryTotal') || '0', 10) || 0;
          const npt = pt + 1;
          localStorage.setItem('galagaParryTotal', String(npt));
          if (npt >= 50)  unlockAchievement('parry50');
          if (npt >= 200) unlockAchievement('parry200');
          if (npt >= 500) unlockAchievement('parry500');
        } catch (e) {}
        // Visual + audio feedback at parry site
        game.hitSparks.push({ x: b.x, y: b.y, life: 0 });
        const sparkCount = 4 + tier * 2;
        for (let k = 0; k < sparkCount; k++) {
          const a = (k / sparkCount) * Math.PI * 2;
          game.itemBursts.push({
            x: b.x + Math.cos(a) * 4,
            y: b.y + Math.sin(a) * 4,
            life: -k, color: tierCol
          });
        }
        game.floatTexts.push({
          x: b.x, y: b.y - 6, text: tierLabel + ' +' + baseScore,
          color: tierCol, life: 30 + tier * 6, maxLife: 30 + tier * 6, size: 5 + tier
        });
        if (tier >= 2 && game.parryStreak % 2 === 1) {
          // Higher tier — small rumble + flash for emphasis
          game.flashTimer = Math.max(game.flashTimer || 0, 4);
          game.flashColor = tierCol;
          rumble(110, 0.5, 0.25);
        }
        playSound('graze'); // metallic ping reused — short, bright, fits parry feel
      }
    }
  }
  // Enemy bullets vs player (skip while invincible)
  if (game.playerAlive && game.invincibleTimer <= 0) {
    for (let i = game.enemyBullets.length - 1; i >= 0; i--) {
      const b = game.enemyBullets[i];
      const hitW = game.dualFighter ? 16 : 7;
      if (Math.abs(b.x - game.playerX) < hitW && Math.abs(b.y - game.playerY) < 7) {
        if (tryTriggerWitchTime(b.x, b.y)) break;  // bullet not consumed; witch window opened
        const _bX = b.x, _bY = b.y;
        game.enemyBullets.splice(i, 1);
        killPlayer(_bX, _bY, 'bullet');
        break;
      }
    }
  }

  // Diving enemies vs player (collision; skip while invincible)
  if (game.playerAlive && game.invincibleTimer <= 0) {
    for (const e of game.enemies) {
      if (!e.alive || e.state === 'formation' || e.state === 'entering') continue;
      const hitW = game.dualFighter ? 16 : 7;
      if (Math.abs(e.x - game.playerX) < hitW + 6 && Math.abs(e.y - game.playerY) < 10) {
        if (tryTriggerWitchTime(e.x, e.y)) break;  // collision not resolved; witch window opened
        const _eX = e.x, _eY = e.y;
        e.alive = false;
        game.explosions.push({x: e.x, y: e.y, timer: 0, maxTime: 20});
        playSound('explode');
        killPlayer(_eX, _eY, 'collision');
        break;
      }
    }
  }
}

// WITCH TIME — opens a slow-mo grace window before applying a fatal hit. Returns true
// when the window opened (caller must NOT proceed with the kill); false when no save
// is available (cooldown active, shield+cheat handle their own paths anyway).
// The window expires in update() — if dash fired, save; else kill resolves there.
function tryTriggerWitchTime(srcX, srcY) {
  if (game.witchTimer > 0) return true;          // already in a window — defer
  if (game.witchCooldown > 0) return false;       // can't save again yet
  if (game.cheatInvincible) return false;         // cheat path handles it
  if ((game.shieldCharges || 0) > 0) return false; // shield path handles it (cheaper)
  game.witchTimer = WITCH_WINDOW;
  game.witchSrcX = srcX;
  game.witchSrcY = srcY;
  game.witchSaved = false;
  // Brief invincibility flicker so the same bullet doesn't re-collide while we're paused
  game.invincibleTimer = Math.max(game.invincibleTimer, WITCH_WINDOW + 6);
  game.flashTimer = 6;
  game.flashColor = '#fff';
  game.shakeTimer = Math.max(game.shakeTimer || 0, 6);
  game.floatTexts.push({
    x: BASE_W/2, y: BASE_H/2 - 24, text: 'DASH!',
    color: '#ff4', life: WITCH_WINDOW, maxLife: WITCH_WINDOW, size: 14
  });
  playSound('powerUp');
  rumble(180, 0.7, 0.4);
  return true;
}

function killPlayer(srcX, srcY, cause) {
  // STAGE HIT REGISTRY — any hit attempt counted (even cheat/shield-absorbed) so
  // UNTOUCHED STAGE detection at clear sees zero only on truly clean runs.
  // Witch time pre-check (which can save) does NOT increment — that's a player
  // skill window, not a touch.
  game.stageHitTaken = (game.stageHitTaken || 0) + 1;
  // DEATH POSTMORTEM — capture the offending hit source so the renderer can draw
  // a red expanding ring at the culprit for the next ~30 frames. Only set when a
  // source is supplied (witch/shield/cheat paths bail out before the visual).
  if (typeof srcX === 'number' && typeof srcY === 'number') {
    game.deathSrcX = srcX;
    game.deathSrcY = srcY;
    game.deathMarkerLife = 30;
  }
  // DEATH CAUSE TALLY — accumulate per-cause death counts to localStorage.
  // Only counted if the kill actually lands (witch/shield/cheat skip below).
  // Stash on game; finalized in the lives-- branch where deathDidLand is known.
  game._deathCausePending = cause || 'unknown';
  // Cheat: GOD MODE absorbs the hit. Brief flash + score-flick to make the save visible.
  if (game.cheatInvincible) {
    game.flashTimer = 4;
    game.flashColor = '#fc4';
    game.invincibleTimer = Math.max(game.invincibleTimer, 30);
    return;
  }
  // SHIELD absorb — consume one charge, brief iframes, no death. Shield is stackable
  // (E pickup adds +1, max SHIELD_MAX) so the player can bank defensive runs.
  if ((game.shieldCharges || 0) > 0) {
    game.shieldCharges--;
    game.invincibleTimer = Math.max(game.invincibleTimer, 60);
    game.flashTimer = 10;
    game.flashColor = '#4f8';
    game.shakeTimer = Math.max(game.shakeTimer || 0, 10);
    // SHIELD ABSORB CINEMATIC — 3 staggered expanding shockwave rings + 12
    // itemBurst sparks + bigger banner + tiny hitStop. Makes the save feel
    // earned without changing the gameplay outcome.
    if (game.shockwaves) {
      game.shockwaves.push({ x: game.playerX, y: game.playerY, life: 0,  maxLife: 22, maxR: 24, color: '#4f8' });
      game.shockwaves.push({ x: game.playerX, y: game.playerY, life: -6, maxLife: 22, maxR: 32, color: '#0f8' });
      game.shockwaves.push({ x: game.playerX, y: game.playerY, life: -12, maxLife: 22, maxR: 40, color: '#fff' });
    }
    game.hitStopFrames = Math.max(game.hitStopFrames || 0, 4);
    // Visual ring burst at player position so the save is unmissable
    for (let k = 0; k < 12; k++) {
      const a = (k / 12) * Math.PI * 2;
      game.itemBursts.push({
        x: game.playerX + Math.cos(a) * 12,
        y: game.playerY + Math.sin(a) * 12,
        life: -k, color: '#4f8'
      });
    }
    game.floatTexts.push({
      x: game.playerX, y: game.playerY - 18, text: 'SHIELD!',
      color: '#4f8', life: 60, maxLife: 60, size: 11
    });
    if (typeof spawnConfetti === 'function') spawnConfetti(6);
    playSound('powerUp');
    rumble(220, 0.7, 0.4);
    return;
  }
  game.playerAlive = false;
  game.stageDied = true;
  game.lvl = {S: 1, N: 1, P: 1};
  game._typeMaxedFlags = {};
  game.powerUps = [];
  // Lose timed power-ups too, for consistency with lvl reset
  game.slowTimer = 0;
  game.rapidTimer = 0;
  game.waveTimer = 0;
  game.homingTimer = 0;
  game.laserTimer = 0;
  game.shieldCharges = 0;
  // Witch window may have been the trigger for this kill — clear so the death cutscene
  // isn't visually framed by lingering edge glow.
  game.witchTimer = 0;
  // DEATH GHOST TRAIL — snapshot the last 10 motion-trail entries before clearing
  // so the renderer can ghost the player's final path during RESPAWN. 40-frame life.
  if (game.playerTrail && game.playerTrail.length > 0) {
    game.deathGhostTrail = game.playerTrail.slice(0, 10).map(t => ({ x: t.x, y: t.y }));
    game.deathGhostLife = 40;
  }
  // PICKUP STREAK reset — death breaks the no-death pickup chain
  game.pickupStreak = 0;
  // Clear the motion-trail ghost so the dead ship doesn't leave behind ~14 frames
  // of after-image during the RESPAWN cutscene.
  game.playerTrail = [];
  // Cancel mid-dash so respawn isn't already moving
  game.dashTimer = 0;
  game.dashCooldown = 0;
  // Clear any in-flight fire cooldown so the post-respawn first shot isn't briefly delayed.
  game.fireCooldown = 0;
  // Cinematic death hit-stop — pauses the simulation for 12 frames so the player feels the moment
  game.hitStopFrames = Math.max(game.hitStopFrames || 0, 12);
  // Multi-stage debris burst centered on the ship
  for (let i = 0; i < 5; i++) {
    const ox = (Math.random() - 0.5) * 14;
    const oy = (Math.random() - 0.5) * 10;
    game.explosions.push({
      x: game.playerX + ox, y: game.playerY + oy,
      timer: -i * 4, maxTime: 36
    });
  }
  // Spark shower around the wreck
  for (let i = 0; i < 4; i++) {
    game.hitSparks.push({
      x: game.playerX + (Math.random() - 0.5) * 12,
      y: game.playerY + (Math.random() - 0.5) * 8,
      life: -i * 2
    });
  }
  // Screen flash + heavy controller rumble
  game.flashTimer = 8;
  game.flashColor = '#fff';
  rumble(420, 1.0, 0.6);
  playSound('explode');
  game.shakeTimer = 30;
  game.pausedState = game.state; // remember current state for respawn
  if (game.dualFighter) {
    game.dualFighter = false;
    // Lose one ship from dual, continue with single
    game.state = STATE.RESPAWN;
    game.respawnTimer = 90;
  } else {
    game.lives--;
    // LAST LIFE ALERT — fires once when lives transitions to exactly 1.
    // Dramatic red banner + flash + rumble. Re-arms when lives goes back up.
    if (game.lives === 1 && !game._lastLifeAlertFired) {
      game._lastLifeAlertFired = true;
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 30, text: 'LAST LIFE',
        color: '#f44', life: 100, maxLife: 100, size: 14
      });
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 16, text: 'MAKE IT COUNT',
        color: '#fff', life: 90, maxLife: 90, size: 6
      });
      game.flashTimer = Math.max(game.flashTimer || 0, 12);
      game.flashColor = '#f44';
      if (typeof rumble === 'function') rumble(300, 0.95, 0.6);
      if (typeof playSound === 'function') playSound('lowHealth');
    }
    // Re-arm when player gains a life (extra ship pickup brings >=2)
    // Handled lazily in addScore/extra life paths (see below) but ensure flag
    // is not stale here.
    // DEATH CAUSE TALLY — record cause to localStorage (death landed)
    if (game._deathCausePending) {
      // FINAL CAUSE — keep on game for GAME_OVER recap line (cleared at resetGame)
      game.lastDeathCause = game._deathCausePending;
      try {
        const raw = localStorage.getItem('galagaDeathCauses') || '{}';
        const tally = JSON.parse(raw);
        const c = game._deathCausePending;
        tally[c] = (tally[c] || 0) + 1;
        localStorage.setItem('galagaDeathCauses', JSON.stringify(tally));
      } catch (e) {}
      game._deathCausePending = null;
    }
    if (game.lives <= 0) {
      // Demo runs end silently and return to title
      if (game.isDemo) {
        resetGame();
        game.state = STATE.TITLE;
        stopBGM();
        return;
      }
      game.state = STATE.GAME_OVER;
      game.gameOverTimer = 180;
      // GAME OVER FANFARE TIER — SFX scaled by max stage reached so deeper
      // runs end with more triumphant tone even at game over.
      {
        const _ms = (game.stats && game.stats.maxStage) || game.stage || 1;
        const _fSfx = _ms >= 50 ? 'milestone'
                    : _ms >= 30 ? 'powerUp'
                    : _ms >= 10 ? 'tick'
                    : 'lowLife';
        if (typeof playSound === 'function') playSound(_fSfx);
      }
      // GAME OVER BIOME FAREWELL FLASH — last biome col tinted screen flash
      // at game over entry. Atmospheric continuity from the place player died.
      if (typeof biomeForStage === 'function') {
        const _gBid = biomeForStage(game.stage || 1);
        if (_gBid && typeof BIOME_NAMES !== 'undefined' && BIOME_NAMES[_gBid]) {
          game.flashTimer = Math.max(game.flashTimer || 0, 14);
          game.flashColor = BIOME_NAMES[_gBid].col;
        }
      }
      // DEATH MEMORIAL — append final death event to a rolling 5-entry log so the
      // PROFILE page can show recent run memorials. Skipped in demo / challenge
      // tests where deaths are scripted or transient.
      try {
        const memRaw = localStorage.getItem('galagaDeathMemorials') || '[]';
        const mem = JSON.parse(memRaw);
        if (Array.isArray(mem)) {
          mem.unshift({
            stage: game.stage || 0,
            score: game.score || 0,
            mode: game.dailyMode ? 'DAILY' : game.challengeMode ? 'CHAL' : 'NORM',
            ts: Date.now()
          });
          if (mem.length > 5) mem.length = 5;
          localStorage.setItem('galagaDeathMemorials', JSON.stringify(mem));
        }
      } catch (e) {}
      // RUN HISTORY — rolling 10-entry log of final run scores for trend chart.
      try {
        const hRaw = localStorage.getItem('galagaRunHistory') || '[]';
        const hist = JSON.parse(hRaw);
        if (Array.isArray(hist)) {
          hist.push(game.score || 0);
          if (hist.length > 10) hist.splice(0, hist.length - 10);
          localStorage.setItem('galagaRunHistory', JSON.stringify(hist));
        }
      } catch (e) {}
      // Final flush of pending combo PB on game over (batched writer may have
      // missed the last increment within its 60-frame interval).
      if ((game._comboPbPending || 0) > 0) {
        try {
          const cur = parseInt(localStorage.getItem('galagaMaxComboEver') || '0', 10) || 0;
          if (game._comboPbPending > cur) {
            localStorage.setItem('galagaMaxComboEver', String(game._comboPbPending));
          }
        } catch (e) {}
        game._comboPbPending = 0;
      }
      const acc = game.stats.shotsFired === 0 ? 0
        : Math.round((game.stats.shotsHit / game.stats.shotsFired) * 100);
      if (acc >= 80 && game.stats.shotsFired > 30) unlockAchievement('deadEye');
      game.topRank = submitTopScore(game.score, game.stats.maxStage, acc);
      commitGameToCumStats();
      // EPITAPH — narrative bookend that contextualizes this run's death.
      // Voice matches TRANSMISSION_LOGS: terse, in-world, second-person command-room tone.
      game.runEpitaph = pickEpitaph(game.stage, acc);
      // RUN HIGHLIGHTS — top 3 stats from this run, shown below epitaph on GAME_OVER.
      game.runHighlights = pickRunHighlights();
      // RUN TIP — random pilot tip surfaced on GAME_OVER so each death teaches one
      // mechanic the player might not know yet. Lighter than EPITAPHS (no death-tier
      // pick), pure mechanic surfacing.
      if (typeof PILOT_TIPS !== 'undefined') {
        game.runTip = PILOT_TIPS[Math.floor(Math.random() * PILOT_TIPS.length)];
      }
      // RUN NEXT GOAL — pick the nearest reachable milestone so the death screen
      // ends with a concrete forward target ("NEXT: STAGE 10"). Priority order:
      // next stage milestone within +5 → next boss (×10) → BESTIARY missing → fallback.
      {
        const reached = game.stats.maxStage || 0;
        let goal = null, gColor = '#fc4';
        // Stage milestones from MILESTONE_STAGES + every boss stage
        const tiers = [5, 10, 15, 20, 25, 30, 40, 50, 60, 70, 80];
