        case 'shielded': drawShielded(e.x, e.y, e.frame, e.hp); break;
        case 'kamikaze': drawKamikaze(e.x, e.y, e.frame); break;
        case 'splitter': drawSplitter(e.x, e.y, e.frame); break;
        case 'minibee': drawMiniBee(e.x, e.y, e.frame); break;
        case 'ufo': drawUFO(e.x, e.y, e.frame); break;
        case 'goldenBee': drawGoldenBee(e.x, e.y, e.frame); break;
        case 'mirror': drawMirror(e.x, e.y, e.frame); break;
        case 'warper': drawWarper(e.x, e.y, e.frame, e.warpFade || 0); break;
        case 'hoverer': drawHoverer(e.x, e.y, e.frame); break;
        case 'boss':
          drawBoss(e.x, e.y, e.frame, e.hp < 2);
          // (BIOME ENEMY TINT — applied after switch, below)
          // Draw captured ship attached to the boss in ALL states (formation, diving, returning)
          // — previously only in formation, which made the ship visually vanish during dives.
          if (e.capturedShip && e.state !== 'capturing') {
            drawPlayer(e.x, e.y - 14, COL.red);
          }
          // Draw tractor beam
          if (e.state === 'capturing' && e.captureTimer >= 60 && e.captureTimer < 180) {
            drawTractorBeam(e.x, e.y + 6, 80);
          }
          break;
      }
      // GHOST stealth restore + telltale dot (1px white at center) so the
      // hidden enemy is still detectable by careful observation.
      if (_ghostStealth) {
        ctx.restore();
        ctx.save();
        ctx.globalAlpha = 0.55;
        ctx.fillStyle = '#fff';
        ctx.fillRect(e.x, e.y, 1, 1);
        ctx.restore();
      }
      // MORALE TINT — faint colored overlay reflecting faction morale state.
      // Only applied to standard formation types; special spawns (UFO / goldenBee /
      // minibee) keep signature colors. NORMAL state = no tint. ROUTED adds a faint
      // horizontal jitter to convey breakdown.
      if (game.enemyMorale && game.enemyMorale !== 'NORMAL'
          && typeof MORALE_STATES !== 'undefined' && MORALE_STATES[game.enemyMorale]
          && e.type !== 'ufo' && e.type !== 'goldenBee' && e.type !== 'minibee') {
        const _ms = MORALE_STATES[game.enemyMorale];
        let _mAlpha = 0.16;
        let _mShake = 0;
        if (game.enemyMorale === 'CONFIDENT') {
          _mAlpha = 0.18 + 0.08 * Math.sin(game.animFrame * 0.12 + e.x * 0.05);
        } else if (game.enemyMorale === 'SHAKEN') {
          _mAlpha = 0.14;
        } else if (game.enemyMorale === 'ROUTED') {
          _mAlpha = 0.22;
          _mShake = Math.sin(game.animFrame * 0.45 + e.x * 0.1) * 0.6;
        }
        ctx.save();
        ctx.globalAlpha = _mAlpha;
        ctx.fillStyle = _ms.col;
        ctx.fillRect(Math.round(e.x - 8 + _mShake), Math.round(e.y - 8), 16, 16);
        ctx.restore();
      }
      // ENEMY MINI HP BAR — 1px bar above damaged multi-HP enemies. Shows
      // remaining HP fraction. Only when maxHp > 1 AND hp < maxHp. Hidden for
      // single-HP enemies and unhit multi-HP enemies (clean view).
      if (e.maxHp && e.maxHp > 1 && e.hp > 0 && e.hp < e.maxHp) {
        const _ratio = e.hp / e.maxHp;
        const _bw = 12;
        const _bx = e.x - _bw/2, _by = e.y - 12;
        ctx.save();
        ctx.globalAlpha = 0.7;
        ctx.fillStyle = '#222';
        ctx.fillRect(_bx, _by, _bw, 1);
        ctx.fillStyle = _ratio > 0.5 ? '#0f8' : _ratio > 0.25 ? '#fc4' : '#f44';
        ctx.fillRect(_bx, _by, Math.round(_bw * _ratio), 1);
        ctx.restore();
      }
      // ENEMY HIT FLASH — 4-frame white tint after non-fatal damage. Sits on top
      // of sprite + biome tint. Pure feedback: "I damaged it but not killed yet".
      if ((e.hitFlashTimer || 0) > 0) {
        ctx.save();
        ctx.globalAlpha = (e.hitFlashTimer / 4) * 0.6;
        ctx.fillStyle = '#fff';
        ctx.fillRect(e.x - 8, e.y - 8, 16, 16);
        ctx.restore();
      }
      // CRITICAL HP PULSE — red ring around enemy when 1 hit from death.
      // 16-frame life, ticked in update() (not draw — was draining 2.4× faster on
      // 144Hz monitors due to draw-rate-bound mutation; moved here for correctness).
      if ((e.criticalPulseTimer || 0) > 0) {
        const cp = e.criticalPulseTimer;
        const cpFade = cp / 16;
        ctx.save();
        ctx.globalAlpha = cpFade * 0.8;
        ctx.strokeStyle = '#f44';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(e.x, e.y, 11 + (16 - cp) * 0.4, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      // BIOME ENEMY TINT — subtle color wash matching active biome on top of the
      // sprite. ~10% alpha so the sprite identity reads through. Skipped when no
      // biome (stage ≤ 7) or for goldenBee (preserves rare-spawn visual signal).
      {
        const _biome = biomeForStage(game.stage);
        if (_biome && BIOME_NAMES[_biome] && e.type !== 'goldenBee') {
          ctx.save();
          ctx.globalAlpha = 0.10;
          ctx.fillStyle = BIOME_NAMES[_biome].col;
          ctx.fillRect(e.x - 8, e.y - 8, 16, 16);
          ctx.restore();
        }
      }
      // ENEMY HEALTH PIPS — hp > 1 only (avoids clutter on the common hp=1 enemies).
      // Pips drawn above the sprite, color tinted by enemy type for instant recognition.
      // Each pip is 2×1 px so 2-3 pips read clearly without dominating the sprite.
      if (e.hp > 1) {
        const pipCol = e.type === 'shielded' ? '#cef'
                    : e.elite             ? '#f44'
                    : e.type === 'boss'    ? '#f8a'
                    : '#fff';
        const pipY = e.y - 10;
        const totalW = e.hp * 3 - 1; // 2px pip + 1px gap, last has no gap
        const startX = e.x - totalW / 2;
        ctx.save();
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = pipCol;
        for (let p = 0; p < e.hp; p++) {
          ctx.fillRect(Math.round(startX + p * 3), pipY, 2, 1);
        }
        ctx.restore();
      }
      // DIVE TELEGRAPH FLASH — red chevron above enemy for 16 frames after dive start.
      // Tick down here so the timer expires in lockstep with the visual.
      if (e.diveFlashTimer && e.diveFlashTimer > 0) {
        e.diveFlashTimer--;
        const flashRatio = e.diveFlashTimer / 16;
        ctx.save();
        ctx.globalAlpha = flashRatio * 0.9;
        ctx.fillStyle = '#f44';
        // Downward chevron: ▼ shape made of 3 pixel rows
        const cy = e.y - 12;
        ctx.fillRect(e.x - 3, cy,     7, 1);
        ctx.fillRect(e.x - 2, cy + 1, 5, 1);
        ctx.fillRect(e.x - 1, cy + 2, 3, 1);
        ctx.fillRect(e.x,     cy + 3, 1, 1);
        // Outer ring (faded)
        ctx.globalAlpha = flashRatio * 0.45;
        ctx.fillStyle = '#fc4';
        ctx.fillRect(e.x - 5, cy - 1, 11, 1);
        ctx.restore();
      }
      // FORMATION MORALE BREAK visual — orange trembling outline on scattered enemies.
      // Active when panicTimer > 0 and enemy is in formation state (scattered off-grid).
      if (e.state === 'formation' && (game.panicTimer || 0) > 0) {
        const _pFade = Math.min(1, game.panicTimer / 60);
        const _pPulse = 0.25 + 0.30 * Math.abs(Math.sin(game.animFrame * 0.18));
        ctx.save();
        ctx.globalAlpha = _pFade * _pPulse;
        ctx.fillStyle = '#f84';
        ctx.fillRect(e.x - 8, e.y - 8, 16, 1);
        ctx.fillRect(e.x - 8, e.y + 7, 16, 1);
        ctx.fillRect(e.x - 8, e.y - 8, 1, 16);
        ctx.fillRect(e.x + 7, e.y - 8, 1, 16);
        ctx.restore();
      }
      // FORMATION COMMANDER crown pip — gold crown above the designated commander.
      // Pulses faster when rage is active (commander has been killed → enrage incoming).
      // Crown is drawn last so it sits on top of all other overlays.
      if (e.isCommander && e.alive) {
        const t = game.animFrame;
        const _raging = (game.commanderRageTimer || 0) > 0;
        const _pulse = _raging
          ? (0.70 + 0.30 * Math.sin(t * 0.45))
          : (0.65 + 0.35 * Math.sin(t * 0.14));
        ctx.save();
        ctx.globalAlpha = _pulse;
        // Small gold glow under the crown for readability
        ctx.fillStyle = '#fc4';
        ctx.globalAlpha = _pulse * 0.25;
        ctx.fillRect(e.x - 5, e.y - 16, 11, 7);
        ctx.globalAlpha = _pulse;
        drawCrown(e.x, e.y - 13, '#fc4');
        ctx.restore();
      }
    }
  }

  // Draw power-up capsules
  // MAGNETIC PERK LINE — when the magnetic perk is active, draw a dashed green line
  // from each in-range power-up toward the player, showing the pull effect.
  if (game.activePerk === 'magnetic' && game.playerAlive) {
    const MAGNET_RANGE_VIS = 72;
    ctx.save();
    // MAGNET RANGE RING — dashed circle showing the magnet's effective radius.
    // 24 segments rotating slowly; alpha low so it doesn't dominate the playfield.
    {
      const segs = 24;
      const rotPhase = game.animFrame * 0.012;
      ctx.fillStyle = '#0f8';
      for (let k = 0; k < segs; k++) {
        if (k % 2 !== 0) continue; // dashed gap
        const a = (k / segs) * Math.PI * 2 + rotPhase;
        const px = game.playerX + Math.cos(a) * MAGNET_RANGE_VIS;
        const py = game.playerY + Math.sin(a) * MAGNET_RANGE_VIS;
        ctx.globalAlpha = 0.22;
        ctx.fillRect(Math.round(px - 1), Math.round(py - 1), 2, 2);
      }
    }
    ctx.fillStyle = '#0f8';
    for (const p of game.powerUps) {
      const dx = game.playerX - p.x, dy = game.playerY - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < MAGNET_RANGE_VIS && dist > 6) {
        // Dashed segments — every other 2px step
        const steps = Math.floor(dist / 3);
        for (let s = 1; s < steps; s++) {
          if ((s + (game.animFrame >> 1)) % 2 !== 0) continue; // animate dash flow
          const t = s / steps;
          const lx = Math.round(p.x + dx * t);
          const ly = Math.round(p.y + dy * t);
          ctx.globalAlpha = (1 - t) * 0.4;
          ctx.fillRect(lx, ly, 1, 1);
        }
      }
    }
    ctx.restore();
  }
  for (const p of game.powerUps) drawPowerUp(p);

  // Draw player bullets — GAM-42 tier visuals (Sleek / Nova / Shard)
  for (const b of game.bullets) {
    // HOMING TARGET LINE — faint 1px line from bullet to current lock-on target
    if (b.kind === 'homing' && b.tgtX != null && b.tgtY != null) {
      ctx.save();
      ctx.globalAlpha = 0.25;
      ctx.strokeStyle = '#0f8';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(Math.round(b.x), Math.round(b.y));
      ctx.lineTo(Math.round(b.tgtX), Math.round(b.tgtY));
      ctx.stroke();
      ctx.restore();
      // HOMING TARGET RETICLE — small 4-corner bracket around target enemy.
      // Pulses subtly with animFrame so lock-on reads clearly even amid chaos.
      const _tx = Math.round(b.tgtX), _ty = Math.round(b.tgtY);
      const _rpulse = 0.5 + 0.5 * Math.sin(game.animFrame * 0.4);
      ctx.save();
      ctx.globalAlpha = 0.40 + 0.30 * _rpulse;
      ctx.fillStyle = '#0f8';
      // Four 2-pixel L brackets at ±5 from target center
      ctx.fillRect(_tx - 5, _ty - 5, 2, 1); ctx.fillRect(_tx - 5, _ty - 5, 1, 2);
      ctx.fillRect(_tx + 4, _ty - 5, 2, 1); ctx.fillRect(_tx + 5, _ty - 5, 1, 2);
      ctx.fillRect(_tx - 5, _ty + 5, 2, 1); ctx.fillRect(_tx - 5, _ty + 4, 1, 2);
      ctx.fillRect(_tx + 4, _ty + 5, 2, 1); ctx.fillRect(_tx + 5, _ty + 4, 1, 2);
      ctx.restore();
    }
    // HOMING TRAIL — fade-out green dot trail showing recent path of homing bullets
    // WAVE TRAIL — same pattern for zigzag wave-mode bullets, cyan color
    if (b.trail && b.trail.length > 0 && (b.kind === 'homing' || b.kind === 'wave')) {
      ctx.save();
      ctx.fillStyle = b.kind === 'wave' ? '#6cf' : '#0f8';
      for (let ti = 0; ti < b.trail.length; ti++) {
        const tp = b.trail[ti];
        ctx.globalAlpha = (1 - ti / b.trail.length) * 0.6;
        ctx.fillRect(Math.round(tp.x), Math.round(tp.y), 1, 1);
      }
      ctx.restore();
    }
    // CRITICAL HIT outline — pre-render gold halo for crit bullets so the
    // player anticipates the +50% damage hit before it lands.
    if (b.crit) {
      ctx.save();
      const cPulse = 0.55 + 0.45 * Math.sin(game.animFrame * 0.4);
      ctx.globalAlpha = cPulse;
      ctx.fillStyle = '#fc4';
      ctx.fillRect(Math.round(b.x - 2), Math.round(b.y - 3), 5, 1);
      ctx.fillRect(Math.round(b.x - 2), Math.round(b.y + 2), 5, 1);
      ctx.fillRect(Math.round(b.x - 3), Math.round(b.y - 2), 1, 5);
      ctx.fillRect(Math.round(b.x + 2), Math.round(b.y - 2), 1, 5);
      ctx.restore();
    }
    drawPlayerBullet(b.x, b.y, b.lvl ?? 1, b.kind, b._parryEcho, b._guardian ? b._gCol : null, b.crit, b.fork);
  }

  // Draw enemy bullets
  for (const b of game.enemyBullets) drawEnemyBullet(b);

  // Engine trail (drawn before player so ship sits on top)
  drawExhaustDust();
  drawPlayerTrail();

  // Shield ring while invincible (only when not from a brief dash — show >= 30 frames)
  if (game.playerAlive && game.invincibleTimer >= 30) {
    const t = game.animFrame;
    const r = 13 + Math.sin(t * 0.25) * 2;
    ctx.save();
    ctx.globalAlpha = 0.45 + 0.30 * Math.sin(t * 0.18);
    ctx.strokeStyle = '#0ff';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(game.playerX, game.playerY, r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha *= 0.5;
    ctx.beginPath(); ctx.arc(game.playerX, game.playerY, r + 3, 0, Math.PI * 2); ctx.stroke();
    // Tiny orbiting sparkles (3) tracing the ring
    ctx.fillStyle = '#cff';
    ctx.globalAlpha = 0.85;
    for (let i = 0; i < 3; i++) {
      const a = t * 0.08 + i * (Math.PI * 2 / 3);
      ctx.fillRect(Math.round(game.playerX + Math.cos(a) * r), Math.round(game.playerY + Math.sin(a) * r), 1, 1);
    }
    ctx.restore();
  }

  // Draw player (blink during invincibility)
  if (game.playerAlive && (game.invincibleTimer <= 0 || (game.invincibleTimer >> 2) % 2 === 0)) {
    const pcol = (game.ship && game.ship.color) || '#0cf';
    drawShipMaxedGlow(game.playerX, game.playerY);
    // SHIELD ring — draws BEHIND the ship so it reads as an aura. Outer arc count = charges.
    if ((game.shieldCharges || 0) > 0) {
      const t = game.animFrame;
      const ringR = 13 + Math.sin(t * 0.16) * 1.5;
      ctx.save();
      ctx.globalAlpha = 0.55 + 0.25 * Math.sin(t * 0.22);
      ctx.fillStyle = '#4f8';
      // 8-segment arc, with N segments brightened where N = charges
      for (let k = 0; k < 8; k++) {
        const a = (k / 8) * Math.PI * 2 + t * 0.04;
        const px = game.playerX + Math.cos(a) * ringR;
        const py = game.playerY + Math.sin(a) * ringR;
        const bright = k < game.shieldCharges * 3;
        ctx.globalAlpha = bright ? 0.9 : 0.25;
        ctx.fillRect(Math.round(px - 1), Math.round(py - 1), 2, 2);
      }
      ctx.restore();
    }
    // ASCENDING FLOW AURA — when PILOT MOMENTUM reads ASCENDING (combo ≥ 20 +
    // clean streak ≥ 3, the peak-flow state), 3 cyan/white sparks orbit the ship
    // as a subtle reward. Fuses the PILOT MOMENTUM narrative layer with ship
    // rendering. Pure visual; distinct radius (11) and spark form from the shield
    // (green 8-seg), cheat (gold frame), and dash (cyan frame) rings so they
    // never read as the same thing. computePilotMomentum only reads state.
    if (typeof computePilotMomentum === 'function' && computePilotMomentum() === 'ASCENDING') {
      const t = game.animFrame;
      ctx.save();
      for (let k = 0; k < 3; k++) {
        const a = (k / 3) * Math.PI * 2 + t * 0.08;
        const r = 11 + Math.sin(t * 0.18 + k) * 1.5;
        const px = game.playerX + Math.cos(a) * r;
        const py = game.playerY + Math.sin(a) * r;
        ctx.globalAlpha = 0.5 + 0.3 * Math.sin(t * 0.2 + k * 2);
        ctx.fillStyle = k === 0 ? '#fff' : '#0ff';
        ctx.fillRect(Math.round(px - 1), Math.round(py - 1), 2, 2);
      }
      ctx.restore();
    }
    // CHEAT INVINCIBLE GLOW — golden pulsing ring around the ship while GOD mode
    // is active. Pairs with the "GOD" corner tag for unmissable visual feedback
    // that the cheat is on (so it's never on by mistake).
    if (game.cheatInvincible) {
      const t = game.animFrame;
      const pulse = 0.5 + 0.5 * Math.sin(t * 0.22);
      ctx.save();
      ctx.globalAlpha = 0.35 + 0.30 * pulse;
      ctx.fillStyle = '#fc4';
      const r = 14 + Math.round(2 * pulse);
      // 4-side border framing the ship
      ctx.fillRect(game.playerX - r, game.playerY - r, r * 2 + 1, 1);
      ctx.fillRect(game.playerX - r, game.playerY + r, r * 2 + 1, 1);
      ctx.fillRect(game.playerX - r, game.playerY - r, 1, r * 2 + 1);
      ctx.fillRect(game.playerX + r, game.playerY - r, 1, r * 2 + 1);
      // Corner sparkles
      ctx.globalAlpha = 0.6 + 0.3 * pulse;
      ctx.fillStyle = '#ff4';
      ctx.fillRect(game.playerX - r, game.playerY - r, 1, 1);
      ctx.fillRect(game.playerX + r, game.playerY - r, 1, 1);
      ctx.fillRect(game.playerX - r, game.playerY + r, 1, 1);
      ctx.fillRect(game.playerX + r, game.playerY + r, 1, 1);
      ctx.restore();
    }
    // DASH READY ring — short cyan halo when dash recharges. Drawn behind ship.
    if ((game.dashReadyFrames || 0) > 0) {
      const dr = game.dashReadyFrames / 30;
      ctx.save();
      ctx.globalAlpha = dr * 0.7;
      ctx.fillStyle = '#0ff';
      const r = Math.round(10 + (1 - dr) * 6);
      // 4-side thin frame around ship
      ctx.fillRect(game.playerX - r, game.playerY - r, r * 2 + 1, 1);
      ctx.fillRect(game.playerX - r, game.playerY + r, r * 2 + 1, 1);
      ctx.fillRect(game.playerX - r, game.playerY - r, 1, r * 2 + 1);
      ctx.fillRect(game.playerX + r, game.playerY - r, 1, r * 2 + 1);
      ctx.restore();
    }
    // SHIP MOMENTUM TILT — rotate ship sprite ± up to ~10° based on game.playerTilt.
    // Aura is drawn unrotated so it sits flat to the world, then ship is drawn rotated.
    const tiltRad = (game.playerTilt || 0) * 0.18; // ~10.3° max
    // PERK ACTIVE SHIP DOTS — 4 corner dots in perk color so the player sees
    // their current perk reflected on the ship sprite. Suppressed during dash.
    function _drawPerkDots(cx, cy) {
      if (!game.activePerk || !PERKS[game.activePerk]) return;
      if (game.dashTimer > 0) return;
      const pCol = PERKS[game.activePerk].col;
      const t = game.animFrame;
      const pulse = 0.55 + 0.35 * Math.sin(t * 0.18);
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.fillStyle = pCol;
      // 4 corner pixels at ±8 from center
      ctx.fillRect(cx - 8, cy - 8, 1, 1);
      ctx.fillRect(cx + 7, cy - 8, 1, 1);
      ctx.fillRect(cx - 8, cy + 7, 1, 1);
      ctx.fillRect(cx + 7, cy + 7, 1, 1);
      ctx.restore();
    }
    // SYNERGY AURA — rotating ring of 8 dots matching active WEAPON SYNERGY.
    // Drawn before the ship so it reads as a halo. Suppressed during dash so the
    // dash trail/iframes stay visually clean.
    function _drawSynergyAura(cx, cy) {
      if (!game.activeSynergy || game.dashTimer > 0) return;
      const auraCol = game.activeSynergy === 'OVERLOAD' ? '#fc4'
                    : game.activeSynergy === 'BLINK'    ? '#0ff' : '#f8a';
      const t = game.animFrame;
      const r = 14 + Math.sin(t * 0.10) * 1.5;
      ctx.save();
      for (let k = 0; k < 8; k++) {
        const a = (k / 8) * Math.PI * 2 + t * 0.03;
        const px = cx + Math.cos(a) * r;
        const py = cy + Math.sin(a) * r;
        ctx.globalAlpha = 0.38 + 0.20 * Math.sin(t * 0.12 + k * 0.6);
        ctx.fillStyle = auraCol;
        ctx.fillRect(Math.round(px - 1), Math.round(py - 1), 2, 2);
      }
      ctx.restore();
    }
    if (game.dualFighter) {
      drawShipTraitAura(game.playerX - 8, game.playerY, selectedShip);
      drawShipTraitAura(game.playerX + 8, game.playerY, selectedShip);
      _drawSynergyAura(game.playerX - 8, game.playerY);
      _drawSynergyAura(game.playerX + 8, game.playerY);
      _drawPerkDots(game.playerX - 8, game.playerY);
      _drawPerkDots(game.playerX + 8, game.playerY);
      ctx.save();
      ctx.translate(game.playerX - 8, game.playerY);
      ctx.rotate(tiltRad);
      drawPlayer(0, 0, pcol, game.lvl);
      ctx.restore();
      ctx.save();
      ctx.translate(game.playerX + 8, game.playerY);
      ctx.rotate(tiltRad);
      drawPlayer(0, 0, pcol, game.lvl);
      ctx.restore();
      // DUAL FIGHTER TETHER — energy line connecting the two ships, sells the
      // "linked formation" identity. 3 dots between the wing inner edges with a
      // pulsing center, slight color cycle. Skipped while dash for visual clarity.
      if (game.dashTimer <= 0) {
        const t = game.animFrame;
        const cy = game.playerY;
        const pulse = 0.6 + 0.4 * Math.sin(t * 0.18);
        ctx.save();
        ctx.globalAlpha = 0.55 * pulse;
        ctx.fillStyle = pcol;
        ctx.fillRect(game.playerX - 3, cy, 1, 1);
        ctx.fillRect(game.playerX,     cy, 1, 1);
        ctx.fillRect(game.playerX + 2, cy, 1, 1);
        ctx.globalAlpha = 0.85 * pulse;
        ctx.fillStyle = '#fff';
        ctx.fillRect(game.playerX, cy - 1, 1, 1);
        ctx.fillRect(game.playerX, cy + 1, 1, 1);
        ctx.restore();
      }
    } else {
      drawShipTraitAura(game.playerX, game.playerY, selectedShip);
      _drawSynergyAura(game.playerX, game.playerY);
      _drawPerkDots(game.playerX, game.playerY);
      ctx.save();
      ctx.translate(game.playerX, game.playerY);
      ctx.rotate(tiltRad);
      drawPlayer(0, 0, pcol, game.lvl);
      ctx.restore();
    }
  }

  // Draw explosions
  for (const ex of game.explosions) {
    drawExplosion(ex.x, ex.y, ex.timer, ex.maxTime);
  }
  drawDebris();
  drawShockwaves();
  drawStrikeFx();
  drawMuzzleFlashes();
  // DEATH GHOST TRAIL — faint red ship silhouettes along player's final path.
  // Most recent silhouette brightest; oldest faintest. Drawn during RESPAWN
  // cutscene so the player sees where they were a moment before the fatal hit.
  if ((game.deathGhostLife || 0) > 0 && game.deathGhostTrail && game.deathGhostTrail.length) {
    const dgLife = game.deathGhostLife;
    const fade = dgLife / 40;
    ctx.save();
    for (let i = 0; i < game.deathGhostTrail.length; i++) {
      const p = game.deathGhostTrail[i];
      const pos = i / Math.max(1, game.deathGhostTrail.length - 1);
      ctx.globalAlpha = fade * (1 - pos) * 0.45;
      ctx.fillStyle = '#f88';
      // Small 5×5 box silhouette
      ctx.fillRect(p.x - 2, p.y - 2, 5, 5);
      ctx.globalAlpha = fade * (1 - pos) * 0.20;
      ctx.fillRect(p.x - 3, p.y - 3, 7, 7);
    }
    ctx.restore();
  }

  // DEATH POSTMORTEM — red expanding ring + arrow at the offending hit source.
  // Fades over 30 frames (set by killPlayer). Only renders during RESPAWN cutscene
  // so it doesn't overlap with active gameplay.
  if ((game.deathMarkerLife || 0) > 0 && typeof game.deathSrcX === 'number') {
    const dml = game.deathMarkerLife;
    const dRatio = dml / 30;
    const dRad = (30 - dml) * 0.7 + 4;
    ctx.save();
    ctx.globalAlpha = dRatio * 0.9;
    ctx.strokeStyle = '#f44';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(game.deathSrcX, game.deathSrcY, dRad, 0, Math.PI * 2);
    ctx.stroke();
    // Inner crosshair
    ctx.fillStyle = '#f88';
    ctx.fillRect(game.deathSrcX - 3, game.deathSrcY, 7, 1);
    ctx.fillRect(game.deathSrcX, game.deathSrcY - 3, 1, 7);
    ctx.restore();
  }
  // KILL CHAIN VISUAL — connect consecutive recent kill positions when combo >= 3.
  // Line color tracks combo multiplier tier; alpha fades with each kill's age.
  if ((game.combo || 0) >= 3 && game.recentKillPositions && game.recentKillPositions.length >= 2) {
    const kc = game.recentKillPositions;
    const mult = comboMultiplier(game.combo);
    const lineCol = mult >= 2.5 ? '#f6f' : mult >= 2 ? '#f80' : mult >= 1.5 ? '#ff4' : '#0ff';
    ctx.save();
    ctx.fillStyle = lineCol;
    for (let i = 0; i < kc.length - 1; i++) {
      const a = kc[i], b = kc[i + 1];
      const fade = 1 - Math.max(a.age, b.age) / 30;
      if (fade <= 0) continue;
      ctx.globalAlpha = fade * 0.45;
      // Bresenham-style chunky pixel line (cheap, ~12 segments)
      const dx = b.x - a.x, dy = b.y - a.y;
      const steps = Math.max(2, Math.floor(Math.sqrt(dx * dx + dy * dy) / 4));
      for (let s = 1; s < steps; s++) {
        const t = s / steps;
        const lx = Math.round(a.x + dx * t);
        const ly = Math.round(a.y + dy * t);
        ctx.fillRect(lx, ly, 1, 1);
      }
    }
    ctx.restore();
  }

  // Pickup feedback (burst + floating text + hit sparks)
  for (const b of game.itemBursts) drawItemBurst(b);
  for (const s of game.hitSparks) drawHitSpark(s);
  for (const ft of game.floatTexts) drawFloatText(ft);

  // PILOT CAPTURE CINEMATIC — staged 120-frame dramatic sequence replacing the
  // minimal single-banner. Three phases:
  //   A (ct 20-50):  dark overlay + "FIGHTER / CAPTURED" headline slides in
  //   B (ct 50-108): full intel panel — SOS dots, callsign typed text, lives, countdown bar
  //   C (ct 108-120): fade-out across all elements
  if (game.state === STATE.CAPTURED && game.captureTimer > 20) {
    const ct         = game.captureTimer;
    const _t         = game.animFrame;
    const _captor    = game.capturedShipEnemy;
    const _isBoss    = _captor && (_captor.type === 'boss' || _captor.type === 'ufo');
    const _captorCol = _isBoss ? '#a04' : '#c22';
    const _accentCol = _isBoss ? '#f4a' : '#f88';
    const _outFade   = ct >= 108 ? Math.max(0, (120 - ct) / 12) : 1;
    const slideA     = Math.min(1, (ct - 20) / 22);

    // Dark overlay (deepens the scene)
    ctx.save();
    ctx.globalAlpha = 0.62 * slideA * _outFade;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
    ctx.restore();

    // Slow red scan-sweep top→bottom (cycles every ~60 frames)
    {
      const sp = (ct % 60) / 60;
      if (sp < 0.80) {
        ctx.save();
        ctx.globalAlpha = 0.12 * slideA * _outFade;
        ctx.fillStyle = _captorCol;
        ctx.fillRect(0, Math.round(sp / 0.80 * BASE_H) - 1, BASE_W, 2);
        ctx.restore();
      }
    }

    // Sparse glitch bar
    if ((_t & 5) === 0) {
      ctx.save();
      ctx.globalAlpha = 0.20 * slideA * _outFade;
      ctx.fillStyle = _captorCol;
      ctx.fillRect(0, 20 + (_t * 37) % (BASE_H - 40), BASE_W, 1);
      ctx.restore();
    }

    // ── "FIGHTER / CAPTURED" headline (Phase A) ─────────────────────────────
    {
      const blink = (_t >> 2) % 3 !== 0;
      ctx.save();
      ctx.shadowColor = _captorCol;
      ctx.shadowBlur = 14;
      ctx.globalAlpha = (blink ? 1.0 : 0.55) * slideA * _outFade;
      drawRetroText('FIGHTER', BASE_W / 2, BASE_H / 2 - 26, 11, _accentCol);
      drawRetroText('CAPTURED', BASE_W / 2, BASE_H / 2 - 12, 11, blink ? '#f44' : _accentCol);
      ctx.restore();
    }

    // ── Phase B: Intel panel (ct >= 50) ─────────────────────────────────────
    if (ct >= 50) {
      const slideB = Math.min(1, (ct - 50) / 18);
      const _bAlpha = slideB * _outFade;
      const panW = 170, panH = 58;
      const panX = Math.round((BASE_W - panW) / 2);
      const panY = Math.round(BASE_H / 2 + 4);

      // Panel background
      ctx.save();
      ctx.globalAlpha = 0.90 * _bAlpha;
      ctx.fillStyle = '#160004';
      ctx.fillRect(panX, panY, panW, panH);
      ctx.restore();

      // Corner brackets in captor color
      ctx.save();
      ctx.globalAlpha = 0.80 * _bAlpha;
      ctx.fillStyle = _captorCol;
      const _co = 4;
      ctx.fillRect(panX, panY, _co, 1);             ctx.fillRect(panX, panY, 1, _co);
      ctx.fillRect(panX + panW - _co, panY, _co, 1); ctx.fillRect(panX + panW - 1, panY, 1, _co);
      ctx.fillRect(panX, panY + panH - 1, _co, 1);   ctx.fillRect(panX, panY + panH - _co, 1, _co);
      ctx.fillRect(panX + panW - _co, panY + panH - 1, _co, 1);
      ctx.fillRect(panX + panW - 1, panY + panH - _co, 1, _co);
      ctx.restore();

      // SOS dot row — 3 lit · gap · 3 lit, blinking
      {
        const sosBlink = (_t >> 2) % 2 === 0;
        const _sosY    = panY + 10;
        const _dotsX   = Math.round(BASE_W / 2) - 16;
        ctx.save();
        for (let di = 0; di < 7; di++) {
          const lit = di !== 3;
          ctx.globalAlpha = (lit ? (sosBlink ? 0.92 : 0.30) : 0.08) * _bAlpha;
          ctx.fillStyle = lit ? '#f44' : '#300';
          ctx.fillRect(_dotsX + di * 5, _sosY, 3, 3);
        }
        ctx.restore();
      }

      // Callsign typed-in line (character-by-character reveal)
      {
        const fullText = 'PILOT ' + (playerCallsign || '???') + ' — SIGNAL LOST';
        const typeLen  = Math.min(fullText.length, Math.floor((ct - 50) * 0.75));
        ctx.save();
        ctx.globalAlpha = _bAlpha;
        drawRetroText(fullText.slice(0, typeLen), BASE_W / 2, panY + 23, 5, '#f88', 'center');
        ctx.restore();
      }

      // Lives remaining
      {
        const livesLeft = Math.max(0, game.lives || 0);
        const livesCol  = livesLeft <= 1 ? '#f44' : livesLeft <= 2 ? '#fc4' : '#aaa';
        ctx.save();
        ctx.globalAlpha = _bAlpha;
        drawRetroText('LIVES REMAINING: ' + livesLeft, BASE_W / 2, panY + 33, 5, livesCol, 'center');
        ctx.restore();
      }

      // Countdown bar draining to zero (captureTimer 0→120)
      {
        const barW  = panW - 22;
        const barX  = panX + 11;
        const barY  = panY + panH - 10;
        const ratio = Math.max(0, 1 - ct / 120);
        const barCol = ratio > 0.40 ? '#f44' : ratio > 0.20 ? '#f80' : '#f00';
        ctx.save();
        ctx.globalAlpha = _bAlpha;
        ctx.fillStyle = '#200';
        ctx.fillRect(barX, barY, barW, 3);
        ctx.fillStyle = barCol;
        ctx.fillRect(barX, barY, Math.round(barW * ratio), 3);
        if (ratio < 0.40) {
          const pp = 0.5 + 0.5 * Math.sin(_t * 0.4);
          ctx.globalAlpha = 0.40 * pp * _bAlpha;
          ctx.fillStyle = '#f00';
          ctx.fillRect(barX + Math.round(barW * ratio) - 2, barY - 1, 4, 5);
        }
        ctx.restore();
        ctx.save();
        ctx.globalAlpha = 0.50 * _bAlpha;
        drawRetroText('EJECTION', panX + 11, barY - 6, 4, '#555', 'left');
        ctx.restore();
      }
    }
  }

  drawLastStandOverlay();
  drawDivePreviewPaths();
  drawThreatIndicators();
  drawLastEnemyAlert();
  drawCaptureDanger();
  // RESPAWN CINEMATIC — DEATH DEBRIEF TERMINAL (3-phase revival)
  if (game.state === STATE.RESPAWN && game.respawnTimer > 0) {
    const rt   = game.respawnTimer;
    const t    = game.animFrame;
    const pcol = (game.ship && game.ship.color) || '#0cf';
    const _rx  = BASE_W / 2;
    const _ry  = game.playerY;
    const sec  = Math.ceil(rt / 60);
    ctx.save();

    // Shared cause-of-death data read once (all phases may reference)
    const _dc = game.lastDeathCause || 'unknown';
    const _dcLabel = _dc === 'bullet'    ? 'ENEMY FIRE'
                   : _dc === 'collision' ? 'COLLISION'
                   : _dc === 'capture'   ? 'FIGHTER CAPTURE'
                   : 'UNKNOWN CAUSE';
    const _dcCol   = _dc === 'bullet'    ? '#f88'
                   : _dc === 'collision' ? '#fa8'
                   : _dc === 'capture'   ? '#f6f'
                   : '#888';
    const _kills   = (game.stats && game.stats.kills)       || 0;
    const _sf      = (game.stats && game.stats.shotsFired)  || 0;
    const _sh      = (game.stats && game.stats.shotsHit)    || 0;
    const _acc     = _sf >= 5 ? Math.round((_sh / _sf) * 100) + '%' : '--';
    const _best    = game.comboBest || 0;

    if (rt >= 60) {
      // ── PHASE A: TACTICAL CASUALTY REPORT (rt 90→60) ────────────
      const fadeIn = Math.max(0, Math.min(1, 1 - (rt - 60) / 30));

      // Deep dark overlay — crisis atmosphere
      ctx.globalAlpha = 0.72 * fadeIn;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, BASE_W, BASE_H);
      ctx.globalAlpha = 1;

      // Red CRT scan sweep (marks the death moment spatially)
      {
        const swY = Math.round(((1 - fadeIn) * BASE_H));
        ctx.save();
        ctx.globalAlpha = 0.18 * fadeIn;
        ctx.fillStyle = '#f00';
        ctx.fillRect(0, swY, BASE_W, 2);
        ctx.restore();
      }

      // "PILOT DOWN" headline — strong blink
      const blink = (t >> 2) % 2 === 0;
      ctx.save();
      ctx.shadowColor = '#f44'; ctx.shadowBlur = 12;
      ctx.globalAlpha = (blink ? 1.0 : 0.35) * fadeIn;
      drawRetroText('PILOT DOWN', BASE_W/2, 40, 13, '#f44');
      ctx.restore();

      // TACTICAL CASUALTY REPORT panel — slides up with fadeIn
      const panW = 168, panH = 76;
      const panX = Math.round((BASE_W - panW) / 2);
      const panY = 60;
      ctx.save();
      ctx.globalAlpha = Math.min(1, fadeIn * 1.4) * 0.92;

      // Panel BG
      ctx.fillStyle = 'rgba(20,0,0,0.85)';
      ctx.fillRect(panX, panY, panW, panH);

      // Red top border + corner pips
      ctx.fillStyle = '#f44';
      ctx.fillRect(panX, panY, panW, 1);
      ctx.fillRect(panX, panY + panH - 1, panW, 1);
      const _cp = 4;
      ctx.fillRect(panX, panY, _cp, 1);         ctx.fillRect(panX, panY, 1, _cp);
      ctx.fillRect(panX + panW - _cp, panY, _cp, 1); ctx.fillRect(panX + panW - 1, panY, 1, _cp);
      ctx.fillRect(panX, panY + panH - 1, _cp, 1);  ctx.fillRect(panX, panY + panH - _cp, 1, _cp);
      ctx.fillRect(panX + panW - _cp, panY + panH - 1, _cp, 1);
      ctx.fillRect(panX + panW - 1, panY + panH - _cp, 1, _cp);

      // Header
      ctx.globalAlpha = Math.min(1, fadeIn * 1.4) * 0.90;
      drawRetroText('CASUALTY REPORT', BASE_W/2, panY + 9, 6, '#f44');

      // Separator
      ctx.globalAlpha = 0.30;
      ctx.fillStyle = '#f44';
      ctx.fillRect(panX + 10, panY + 15, panW - 20, 1);
      ctx.globalAlpha = Math.min(1, fadeIn * 1.4) * 0.85;

      // Cause row (prominent)
      drawRetroText('CAUSE', panX + 12, panY + 23, 5, '#666', 'left');
      drawRetroText(_dcLabel, panX + panW - 12, panY + 23, 5, _dcCol, 'right');

      // Stage + kills row
      drawRetroText('STAGE', panX + 12, panY + 33, 5, '#555', 'left');
      drawRetroText(String(game.stage || 1), panX + panW - 12, panY + 33, 5, '#0cf', 'right');

      drawRetroText('KILLS', panX + 12, panY + 43, 5, '#555', 'left');
      drawRetroText(String(_kills), panX + panW - 12, panY + 43, 5, '#0cf', 'right');

      // Accuracy + combo row
      drawRetroText('ACC', panX + 12, panY + 53, 5, '#555', 'left');
      drawRetroText(_acc, panX + 70, panY + 53, 5,
        _sf >= 5 && parseInt(_acc) >= 80 ? '#0f8' : _sf >= 5 && parseInt(_acc) >= 60 ? '#fc4' : '#888', 'right');
      drawRetroText('PEAK×' + _best, panX + panW - 12, panY + 53, 5,
        _best >= 10 ? '#fc4' : _best >= 5 ? '#0cf' : '#888', 'right');

      // Lives remaining — bottom of panel
      ctx.globalAlpha = Math.min(1, fadeIn * 1.4) * 0.75;
      ctx.fillStyle = '#300';
      ctx.fillRect(panX, panY + panH - 16, panW, 16);
      ctx.globalAlpha = Math.min(1, fadeIn * 1.4);
      const _lvLeft = Math.max(0, game.lives || 0);
      const _lvCol2 = _lvLeft <= 1 ? '#f44' : _lvLeft <= 2 ? '#fa8' : '#f88';
      drawRetroText('LIVES REMAINING  ' + _lvLeft, BASE_W/2, panY + panH - 8, 5, _lvCol2);

      ctx.restore();

      // "REVIVAL SEQUENCE INITIATED" — below panel, fades in second
      ctx.save();
      ctx.globalAlpha = Math.max(0, fadeIn - 0.4) / 0.6 * 0.60;
      drawRetroText('REVIVAL SEQUENCE INITIATED', BASE_W/2, panY + panH + 10, 5, '#a44');
      ctx.restore();

    } else if (rt >= 20) {
      // ── PHASE B: HULL REBOOT + DIAGNOSTIC TICKER (rt 60→20) ────
      const prog = Math.max(0, Math.min(1, (60 - rt) / 40));  // 0→1

      // Lighter vignette — enemies partially visible
      ctx.globalAlpha = 0.38;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, BASE_W, BASE_H);
      ctx.globalAlpha = 1;

      // "HULL REBOOT" label above bar
      drawRetroText('HULL REBOOT', BASE_W/2, _ry - 30, 7, '#0c8');

      // DIAGNOSTIC TICKER — 4 stages type in sequentially as bar fills
      {
        const _diag = [
          { at: 0.00, text: 'POWER CORE........RESET',    col: '#0a6' },
          { at: 0.30, text: 'WEAPON SYSTEMS....OFFLINE',  col: '#fa8' },
          { at: 0.60, text: 'HULL INTEGRITY....REBUILD',  col: '#0c8' },
          { at: 0.88, text: 'ALL SYSTEMS.......ONLINE',   col: '#0f8' },
        ];
        const _tickerY = _ry - 18;
        for (let di = _diag.length - 1; di >= 0; di--) {
          if (prog >= _diag[di].at) {
            const _dFade = Math.min(1, (prog - _diag[di].at) / 0.12);
            const _revChars = Math.floor(_dFade * _diag[di].text.length);
            const _shown = _diag[di].text.slice(0, _revChars);
            ctx.save();
            ctx.globalAlpha = 0.80 * _dFade;
            drawRetroText(_shown, BASE_W/2, _tickerY, 5, _diag[di].col);
            // Blinking cursor after last char
            if (_revChars < _diag[di].text.length && (t >> 2) % 2 === 0) {
              const _cw = _revChars * 3.5;
              ctx.globalAlpha = 0.90 * _dFade;
              ctx.fillStyle = _diag[di].col;
              ctx.fillRect(BASE_W/2 - (_diag[di].text.length * 1.75) + _cw, _tickerY - 5, 2, 5);
            }
            ctx.restore();
            break;
          }
        }
      }

      // Progress bar (72px wide, 4px tall)
      const barW = 72, barH = 4;
      const barX = Math.round(BASE_W/2 - barW/2);
      const barY = _ry - 8;
      ctx.fillStyle = '#012'; ctx.fillRect(barX, barY, barW, barH);
      // Bar fill color shifts green→cyan as progress completes
      const _barFill = prog > 0.75 ? '#0ff' : '#0f8';
      ctx.fillStyle = _barFill;
      ctx.fillRect(barX, barY, Math.round(barW * prog), barH);
      // Glow at fill tip
      if (prog > 0.02 && prog < 0.99) {
        ctx.save();
        ctx.globalAlpha = 0.55 + 0.35 * Math.sin(t * 0.4);
        ctx.fillStyle = _barFill;
        ctx.fillRect(barX + Math.round(barW * prog) - 1, barY - 1, 3, barH + 2);
        ctx.restore();
      }
      // Quarter-tick marks
      ctx.fillStyle = '#0a5';
      for (let k = 1; k < 4; k++) ctx.fillRect(barX + Math.round(barW * k / 4), barY - 1, 1, barH + 2);

      // Ship silhouette materializing — opacity rises with prog
      ctx.save();
      ctx.globalAlpha = Math.min(0.85, prog * 1.1);
      const revealClip = _ry + 10 - Math.round(prog * 24);
      const _drawSilhouette = (sx, sy, col) => {
        ctx.fillStyle = col;
        if (sy - 7 >= revealClip) ctx.fillRect(sx,     sy - 7, 1, 2);
        if (sy - 4 >= revealClip) ctx.fillRect(sx - 2, sy - 4, 5, 3);
        if (sy     >= revealClip) ctx.fillRect(sx - 2, sy,     5, 4);
        if (sy + 2 >= revealClip) { ctx.fillRect(sx - 6, sy + 2, 3, 2); ctx.fillRect(sx + 3, sy + 2, 3, 2); }
      };
      _drawSilhouette(_rx, _ry, pcol);
      // Scan-line shimmer across materializing zone
      ctx.globalAlpha = (0.25 + 0.20 * Math.sin(t * 0.55)) * prog;
      ctx.fillStyle = pcol;
      const scanY = Math.round(_ry - 10 + (t % 24) * 0.85);
      ctx.fillRect(_rx - 9, Math.max(_ry - 10, Math.min(_ry + 10, scanY)), 18, 1);
      ctx.restore();

      // Percent label
      ctx.globalAlpha = 0.72;
      drawRetroText(Math.round(prog * 100) + '%', BASE_W/2, _ry + 10, 5, '#0c8');
      ctx.globalAlpha = 1;

      // POWER LEVEL READOUT — S/N/P at 1/1/1 after death, shown so player
      // knows their starting state. Fades in after 50% progress.
      if (prog >= 0.50) {
        const _pFade = Math.min(1, (prog - 0.50) / 0.25);
        ctx.save();
        ctx.globalAlpha = _pFade * 0.75;
        drawRetroText('PWR  S1  N1  P1', BASE_W/2, _ry + 20, 5, '#666');
        ctx.restore();
      }

    } else {
      // ── PHASE C: COMBAT SYSTEMS ONLINE (rt 20→0) ────────────────
      const _cProg = 1 - rt / 20;  // 0→1 as rt goes 20→0

      // Overlay fades out — enemies fully visible
      ctx.globalAlpha = 0.22 * (rt / 20);
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, BASE_W, BASE_H);
      ctx.globalAlpha = 1;

      // Ship — fades in fully
      ctx.save();
      ctx.globalAlpha = 0.6 + 0.4 * _cProg;
      drawPlayer(_rx, _ry, pcol, game.lvl);
      ctx.restore();

      // Inner ring (existing, fades as it expands)
      ctx.save();
      const ringR = 10 + _cProg * 12;
      ctx.globalAlpha = (rt / 20) * 0.75;
      ctx.strokeStyle = '#0ff'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(_rx, _ry, ringR, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();

      // Outer burst ring — expands outward fast, brief
      if (_cProg < 0.7) {
        ctx.save();
        const _outerR = 16 + _cProg * 40;
        const _outerA = (1 - _cProg / 0.7) * 0.55;
        ctx.globalAlpha = _outerA;
        ctx.strokeStyle = pcol; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(_rx, _ry, _outerR, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }

      // 4 corner sparks radiating outward
      {
        ctx.save();
        ctx.globalAlpha = (1 - _cProg) * 0.65;
        ctx.fillStyle = pcol;
        const _sR = 8 + _cProg * 22;
        for (let si = 0; si < 4; si++) {
          const _sa = (si / 4) * Math.PI * 2 + Math.PI / 4;
          const _sx = Math.round(_rx + Math.cos(_sa) * _sR);
          const _sy = Math.round(_ry + Math.sin(_sa) * _sR);
          ctx.fillRect(_sx - 1, _sy - 1, 2, 2);
        }
        ctx.restore();
      }

      // "COMBAT SYSTEMS ONLINE" — replaces plain "ENTERING COMBAT"
      ctx.save();
      const _cMsg = _cProg < 0.4 ? 'COMBAT SYSTEMS ONLINE' : 'ENTERING COMBAT';
      const _cMsgCol = _cProg < 0.4 ? '#0f8' : '#0ff';
      ctx.globalAlpha = 0.85;
      drawRetroText(_cMsg, BASE_W/2, _ry - 26, 6, _cMsgCol);
      ctx.restore();

      // Enemies remaining count — tactical re-entry context
      {
        const _remEnemies = (game.megaBosses ? game.megaBosses.filter(mb => mb.alive).length : 0)
                          + (game.enemies ? game.enemies.filter(e => e && e.alive).length : 0)
                          + (game.challengeWaves && game.challengeWaveIdx < (game.challengeWaves.length || 0)
                              ? (game.challengeWaves[game.challengeWaveIdx] || []).filter(e => e && e.alive).length : 0);
        if (_remEnemies > 0) {
          ctx.save();
          ctx.globalAlpha = 0.50 * _cProg;
          drawRetroText(_remEnemies + ' ENEMIES REMAIN', BASE_W/2, _ry - 14, 4, '#f88');
          ctx.restore();
        }
      }

      ctx.globalAlpha = 1;
      // Lives + shield mini-display below ship
      const _liveStr = 'LIVES ' + Math.max(0, game.lives || 0);
      const _shStr   = (game.shieldCharges || 0) > 0 ? '  SHIELD×' + game.shieldCharges : '';
      drawRetroText(_liveStr + _shStr, BASE_W/2, _ry + 20, 5, '#888');
    }

    ctx.restore();
  }
  // STAGE INTRO STATS PEEK — top 2 run highlights at very bottom (above intercept echo).
  // Gives the player a sense of "what's been great this run" between stages. Reuses
  // pickRunHighlights logic so labels match the GAME_OVER summary.
  if (typeof pickRunHighlights === 'function') {
    const _hl = pickRunHighlights();
    if (_hl && _hl.length > 0) {
      ctx.save();
      ctx.globalAlpha = 0.80;
      const _peekParts = [];
      const _peekMax = Math.min(2, _hl.length);
      for (let i = 0; i < _peekMax; i++) {
        const h = _hl[i];
        _peekParts.push(h.label + ' ' + h.value);
      }
      const _peekStr = 'BEST: ' + _peekParts.join('  ·  ');
      drawRetroText(_peekStr, BASE_W / 2, BASE_H - 64, 4, '#0c8', 'center');
      ctx.restore();
    }
  }
  // STAGE INTRO INTERCEPT ECHO — show the 2 most recent enemy comms above the HUD
  // separator. Carries narrative continuity across stage transitions when the live
  // terminal is hidden. Subtle green, low alpha so it doesn't compete with stage data.
  if (game.interceptQueue && game.interceptQueue.length > 0) {
    ctx.save();
    const _maxLines = Math.min(2, game.interceptQueue.length);
    for (let i = 0; i < _maxLines; i++) {
      const m = game.interceptQueue[i];
      const _y = BASE_H - 50 + i * 7;
      // Steady alpha during STAGE_INTRO (no tick); subtle so it reads as backdrop
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = '#020';
      ctx.fillRect(2, _y - 1, 132, 7);
      ctx.globalAlpha = 0.75;
      drawRetroText('< ' + m.text, 4, _y + 5, 4, '#0a8', 'left');
    }
    ctx.restore();
  }
  drawHUD();
}

// Dashed bezier preview of a dive trajectory — drawn while previewTimer is counting down.
function drawDivePreviewPaths() {
  if (!game.enemies) return;
  const t = game.animFrame;
  for (const e of game.enemies) {
    if (!e.alive || !e.previewPath || !e.previewTimer) continue;
    const segs = e.previewPath;
    if (!segs || !segs.length) continue;
    ctx.save();
    // Fade in over first 6 frames, then full alpha
    const lifeFade = Math.min(1, (30 - e.previewTimer) / 6);
    // Subtle pulse: dashes slide along
    ctx.fillStyle = COL.red;
    let drawn = 0;
    for (const seg of segs) {
      const samples = 24;
      for (let s = 0; s < samples; s++) {
        const tt = s / samples;
        const p = bezierPoint(seg.p0, seg.p1, seg.p2, seg.p3, tt);
        // Dash pattern that animates: visible when (s + offset) % 4 < 2
        if ((s + Math.floor(t / 2)) % 4 >= 2) continue;
        ctx.globalAlpha = 0.28 * lifeFade * (1 - tt * 0.4);
        ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
        drawn++;
      }
    }
    ctx.restore();
    // Telegraph flash on the enemy itself (red blink)
    if ((t >> 1) % 2 === 0) {
      ctx.save();
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = COL.red;
      ctx.fillRect(Math.round(e.x) - 8, Math.round(e.y) - 8, 16, 16);
      ctx.restore();
    }
  }
}

// Off-screen threat arrows — red blips on the screen edge pointing at incoming dives.
// Pulsing red screen-edge warning when a tractor beam is overhead and the player is in danger
function drawCaptureDanger() {
  if (!game.playerAlive) return;
  const beamBoss = (game.enemies || []).find(e => e.alive && e.state === 'capturing'
    && e.captureTimer >= 60 && e.captureTimer < 180);
  if (!beamBoss) return;
  // Only when player is under or near the beam
  if (Math.abs(beamBoss.x - game.playerX) > 28) return;
  ctx.save();
  const pulse = 0.5 + 0.5 * Math.sin(game.animFrame * 0.4);
  ctx.globalAlpha = 0.18 + 0.30 * pulse;
  ctx.fillStyle = COL.red;
  ctx.fillRect(0, 0, BASE_W, 4);
  ctx.fillRect(0, BASE_H - 4, BASE_W, 4);
  ctx.fillRect(0, 0, 4, BASE_H);
  ctx.fillRect(BASE_W - 4, 0, 4, BASE_H);
  ctx.restore();
  if ((game.animFrame >> 3) % 2 === 0) {
    drawRetroText('!! BEAM !!', BASE_W/2, 60, 8, COL.red);
  }
}

// Highlight the last surviving formation enemy with a pulsing 'LAST!' label + ring
function drawLastEnemyAlert() {
  if (game.state !== STATE.PLAYING) return;
  // Only when formation is fully entered to avoid alerting during entrance
  if (!game.allEntered) return;
  const alive = (game.enemies || []).filter(e => e.alive);
  // (STAGE END COUNTDOWN "N LEFT" removed in HUD cleanup. Top progress bar
  // already encodes how many enemies remain. The 1-enemy LAST! ring + label
  // below still fires as the final-kill signal.)
  if (alive.length !== 1) return;
  const e = alive[0];
  const t = game.animFrame;
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.25);
  ctx.save();
  // Targeting ring
  ctx.globalAlpha = 0.45 + 0.40 * pulse;
  ctx.strokeStyle = COL.yellow;
  ctx.lineWidth = 1;
  const r = 12 + Math.sin(t * 0.3) * 2;
  ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
  // 'LAST!' label above enemy (clamped within screen)
  const lblY = Math.max(34, e.y - 16);
  if ((t >> 2) % 2 === 0) {
    drawRetroText('LAST!', e.x, lblY, 6, COL.yellow);
  }
}

function drawThreatIndicators() {
  const enemies = game.state === STATE.CHALLENGING
    ? (game.challengeWaves && game.challengeWaves[game.challengeWaveIdx] || [])
    : game.enemies;
  if (!enemies) return;
  const pulse = 0.55 + 0.45 * Math.sin(game.animFrame * 0.32);
  ctx.save();
  ctx.fillStyle = COL.red;
  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.state !== 'diving') continue;
    // On-screen bounds with a small margin (24..BASE_W-4 horizontal, 28..BASE_H-20 vertical)
    if (e.x >= 4 && e.x <= BASE_W - 4 && e.y >= 28 && e.y <= BASE_H - 20) continue;
    const ex = Math.max(4, Math.min(BASE_W - 4, e.x));
    const ey = Math.max(28, Math.min(BASE_H - 20, e.y));
    ctx.globalAlpha = pulse;
    // Filled diamond at edge
    ctx.fillRect(Math.round(ex) - 1, Math.round(ey) - 1, 3, 3);
    ctx.fillRect(Math.round(ex), Math.round(ey) - 2, 1, 5);
    ctx.fillRect(Math.round(ex) - 2, Math.round(ey), 5, 1);
  }
  ctx.restore();
}

// Tiny power-up gem dot — 4×4 with shine, used in HUD slot indicators
function drawMiniGem(x, y, color) {
  ctx.fillStyle = '#fff';
  ctx.fillRect(x - 2, y - 2, 4, 4);
  ctx.fillStyle = color;
  ctx.fillRect(x - 1, y - 2, 2, 4);
  ctx.fillRect(x - 2, y - 1, 4, 2);
  ctx.fillStyle = '#fff';
  ctx.fillRect(x - 1, y - 1, 1, 1);
}

// Mini-radar (29×20) at top-right under the stage progression bar — only during normal play.
function drawMiniRadar() {
  if (game.state !== STATE.PLAYING && game.state !== STATE.CHALLENGING) return;
  const enemies = game.state === STATE.CHALLENGING
    ? (game.challengeWaves && game.challengeWaves[game.challengeWaveIdx] || [])
    : game.enemies;
  if (!enemies) return;
  const rw = 30, rh = 22;
  const rx = BASE_W - rw - 2;
  const ry = 28;
  ctx.save();
  ctx.fillStyle = 'rgba(0,30,60,0.55)';
  ctx.fillRect(rx, ry, rw, rh);
  ctx.fillStyle = 'rgba(0,200,255,0.40)';
  ctx.fillRect(rx, ry, rw, 1);
  ctx.fillRect(rx, ry + rh - 1, rw, 1);
  ctx.fillRect(rx, ry, 1, rh);
  ctx.fillRect(rx + rw - 1, ry, 1, rh);
  // Player marker (yellow)
  if (game.playerAlive) {
    const px = rx + Math.round((game.playerX / BASE_W) * (rw - 2)) + 1;
    const py = ry + Math.round((game.playerY / BASE_H) * (rh - 2)) + 1;
    ctx.fillStyle = '#ff4';
    ctx.fillRect(px, py, 1, 1);
  }
  // Enemy markers — color by state/type for readability
  for (const e of enemies) {
    if (!e.alive) continue;
    const px = rx + Math.round((e.x / BASE_W) * (rw - 2)) + 1;
    const py = ry + Math.round((e.y / BASE_H) * (rh - 2)) + 1;
    if (px < rx + 1 || px > rx + rw - 2 || py < ry + 1 || py > ry + rh - 2) continue;
    ctx.fillStyle = e.state === 'diving' ? COL.red
                  : e.type === 'goldenBee' ? '#fc4'
                  : e.type === 'boss' || e.type === 'shielded' ? '#f6f'
                  : '#0ff';
    // Diving and below mid-screen: 2-pixel dot (more visible threat)
    const sz = (e.state === 'diving' && e.y > BASE_H * 0.5) ? 2 : 1;
    ctx.fillRect(px, py, sz, sz);
  }
  ctx.restore();
}

// Tiny pixel crown — denotes #1 score (yellow normal, red challenge)
function drawCrown(x, y, color) {
  ctx.fillStyle = color;
  // Three spikes
  ctx.fillRect(x - 2, y - 3, 1, 2);
  ctx.fillRect(x,     y - 4, 1, 3);
  ctx.fillRect(x + 2, y - 3, 1, 2);
  // Band
  ctx.fillRect(x - 2, y - 1, 5, 2);
  // Gem on band
  ctx.fillStyle = '#fff';
  ctx.fillRect(x, y - 1, 1, 1);
}

function drawHUD() {
  // (BULLET HELL EDGE WARNING removed — the pulsing red bands were a major
  // contributor to perceived blinking. Bullet pressure now reads naturally
  // through the sheer bullet count on screen.)
  // PLAYER EDGE VIGNETTE — faint cyan band on left/right when player is within
  // 20px of that edge. Alpha grows as player approaches the wall, peaking at
  // touching. Helps spatial awareness without compromising the playfield read.
  if (game.playerAlive
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    const _edgeMax = 20;
    const _distL = Math.max(0, game.playerX);
    const _distR = Math.max(0, BASE_W - game.playerX);
    if (_distL < _edgeMax) {
      ctx.save();
      ctx.globalAlpha = (1 - _distL / _edgeMax) * 0.25;
      ctx.fillStyle = '#0cf';
      ctx.fillRect(0, 0, 3, BASE_H);
      ctx.restore();
    }
    if (_distR < _edgeMax) {
      ctx.save();
      ctx.globalAlpha = (1 - _distR / _edgeMax) * 0.25;
      ctx.fillStyle = '#0cf';
      ctx.fillRect(BASE_W - 3, 0, 3, BASE_H);
      ctx.restore();
    }
  }
  // STAGE PROGRESS BAR — 1px high bar at top of screen showing how far into the
  // current stage the player is. Stage-type specific:
  //   PLAYING:     killed/total formation enemies
  //   CHALLENGING: completed waves / total waves
  //   BOSS_STAGE:  cumulative damage dealt to bosses
  // Drawn here so the bar reads above the score row without competing.
  if (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE) {
    let prog = 0, barCol = COL.cyan;
    if (game.state === STATE.PLAYING) {
      const total = game.enemies ? game.enemies.length : 0;
      const alive = total === 0 ? 0 : game.enemies.filter(e => e.alive).length;
      prog = total === 0 ? 0 : 1 - alive / total;
      barCol = COL.cyan;
    } else if (game.state === STATE.CHALLENGING) {
      const totalW = game.challengeWaves ? game.challengeWaves.length : 1;
      prog = Math.min(1, (game.challengeWaveIdx || 0) / totalW);
      barCol = '#f6f';
    } else if (game.state === STATE.BOSS_STAGE) {
      const bosses = game.megaBosses || [];
      let maxSum = 0, curSum = 0;
      for (const mb of bosses) { maxSum += mb.maxHp || 0; curSum += mb.alive ? (mb.hp || 0) : 0; }
      prog = maxSum > 0 ? 1 - curSum / maxSum : 0;
      barCol = COL.red;
    }
    ctx.save();
    // Track (dim) — near-end (prog >= 0.9) pulses brighter so the player
    // reads 'this stage is almost done' at a glance. Stage type color
    // preserved; only alpha varies. Stays subtle in the 1px bar.
    const _nearEnd = prog >= 0.9;
    ctx.globalAlpha = _nearEnd
      ? (0.4 + 0.3 * Math.sin(game.animFrame * 0.4))
      : 0.25;
    ctx.fillStyle = barCol;
    ctx.fillRect(0, 0, BASE_W, 1);
    // Filled portion (bright)
    ctx.globalAlpha = 0.85;
    ctx.fillRect(0, 0, Math.round(BASE_W * prog), 1);
    ctx.restore();
    // STAGE PROGRESS PERCENT — small N% number once progress >= 25% so the
    // player sees exact stage completion (helps "almost done" decisions).
    if (!minimalHud && prog >= 0.25) {
      const pct = Math.round(prog * 100);
      drawRetroText(pct + '%', BASE_W/2, 4, 4, barCol, 'center');
    }
  }
  // 1UP + PILOT callsign small line below (pilot identity persistent across runs).
  // Daily mode swaps red → green so the mode reads at a glance (challenge mode
  // already uses red elsewhere and keeps the standard 1UP red).
  if (game.animFrame % 60 < 40) {
    const _1upCol = game.dailyMode ? COL.green : COL.red;
    drawRetroText('1UP', 28, 8, 7, _1upCol, 'center');
  }
  drawRetroText('[' + playerCallsign + ']', 28, 15, 5, callsignColor(), 'center');
  // PILOT TITLE under callsign — cached once per second to avoid recomputing each frame
  if (!game._titleCacheFrame || (game.animFrame - game._titleCacheFrame) > 60) {
    game._titleCacheFrame = game.animFrame;
    const _newTitle = computePilotTitle();
    // PILOT PROMOTION DETECTION — compare to last seen title persisted in
    // localStorage. On change to a new tier, fire banner + SFX once. Skips
    // first observation (no prior 'seen' value) — treats it as baseline.
    try {
      const _prevSeen = localStorage.getItem('galagaTitleSeen');
      if (_prevSeen != null && _prevSeen !== _newTitle && !game._titlePromoFired) {
        game._titlePromoFired = true;
        // New-tier color preview — the banner _newTitle uses the upcoming
        // tier's signature color so promotion shows the rank's identity from
        // the first beat (matches the 4-location ACE PILOT cohesion).
        const _newCol = (typeof pilotTitleColor === 'function')
          ? pilotTitleColor(_newTitle) : '#fc4';
        game.floatTexts.push({
          x: BASE_W/2, y: BASE_H/2 - 50, text: 'PROMOTED',
          color: '#fff', life: 100, maxLife: 100, size: 7, glow: 5
        });
        game.floatTexts.push({
          x: BASE_W/2, y: BASE_H/2 - 38, text: _newTitle,
          color: _newCol, life: 110, maxLife: 110, size: 11
        });
        if (typeof playSound === 'function') playSound('milestone');
        if (typeof spawnConfetti === 'function') spawnConfetti(14);
      }
      localStorage.setItem('galagaTitleSeen', _newTitle);
    } catch (e) {}
    game._titleCache = _newTitle;
  }
  {
    const _hudTitleCol = typeof pilotTitleColor === 'function'
      ? pilotTitleColor(game._titleCache) : COL.gray;
    // ACE PILOT (peak tier) — HUD title glows so the apex rank reads at every
    // frame, completing the 3-location ACE PILOT cohesion (STAGE_INTRO / HUD
    // / GAME_OVER).
    ctx.save();
    if (game._titleCache === 'ACE PILOT') {
      ctx.shadowColor = _hudTitleCol;
      ctx.shadowBlur = 4;
    }
    drawRetroText(game._titleCache, 28, 21, 4, _hudTitleCol, 'center');
    ctx.restore();
  }

  // MISSILE LOCK — red crosshair brackets around the player when any mega-boss is
  // within 18 frames of firing its signature pattern. Reads as "an attack is
  // imminent, prepare to evade". Suppressed if player is dead or invincible.
  if (game.state === STATE.BOSS_STAGE && game.playerAlive && game.invincibleTimer <= 0
      && game.megaBosses && game.megaBosses.some(mb => mb.alive && mb.sigLocking)) {
    const t = game.animFrame;
    const blink = (t >> 1) % 2 === 0;
    ctx.save();
    ctx.globalAlpha = blink ? 0.85 : 0.35;
    ctx.fillStyle = '#f44';
    const px = game.playerX, py = game.playerY;
    // 4 corner brackets (8px from center)
    const off = 9;
    // top-left
    ctx.fillRect(px - off, py - off, 4, 1);
    ctx.fillRect(px - off, py - off, 1, 4);
    // top-right
    ctx.fillRect(px + off - 3, py - off, 4, 1);
    ctx.fillRect(px + off, py - off, 1, 4);
    // bottom-left
    ctx.fillRect(px - off, py + off, 4, 1);
    ctx.fillRect(px - off, py + off - 3, 1, 4);
    // bottom-right
    ctx.fillRect(px + off - 3, py + off, 4, 1);
    ctx.fillRect(px + off, py + off - 3, 1, 4);
    ctx.restore();
  }

  // NEXT STAGE PREVIEW — during the end-of-stage grace window, render a small
  // preview of the upcoming stage type so the player can mentally prepare during
  // the bonus tally. Reads game.stage as still-current; next stage = stage+1.
  if ((game.stageEndGraceTimer || 0) > 30 && game.stageEndGraceTimer < 110
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    const nextStage = (game.stage || 0) + 1;
    const isBossNext = nextStage % BOSS_STAGE_INTERVAL === 0;
    const isChallNext = !isBossNext && nextStage % 4 === 0;
    const typeLabel = isBossNext ? (nextStage >= 30 ? 'SUPER BOSS' : 'BOSS')
                    : isChallNext ? 'CHALLENGING' : 'NORMAL';
    const typeCol = isBossNext ? (nextStage >= 30 ? '#fc4' : '#f44')
                  : isChallNext ? '#f6f' : '#0ff';
    const previewTxt = 'NEXT: STAGE ' + nextStage + ' (' + typeLabel + ')';
    ctx.save();
    const fade = (game.stageEndGraceTimer - 30) / 30;
    ctx.globalAlpha = Math.min(1, fade) * 0.9;
    drawRetroText(previewTxt, BASE_W/2, BASE_H - 18, 5, typeCol);
    ctx.restore();
  }

  // STAGE AFTER-ACTION REPORT — compact summary panel at grace frames 60-115.
  // Positions below the rising "STAGE CLEAR!" float text (y≈134→80) and above
  // the NEXT STAGE PREVIEW banner (y=270). Shows grade, accuracy, time, earned PT.
  if ((game.stageEndGraceTimer || 0) >= 60 && game.stageEndGraceTimer < 115
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)
      && game.lastStageGrade) {
    const _sgt  = game.stageEndGraceTimer;
    const _sfi  = Math.min(1, (_sgt - 60) / 10);
    const _sfo  = _sgt >= 108 ? Math.max(0, (115 - _sgt) / 7) : 1;
    const _senv = _sfi * _sfo;
    const _ssf  = game.stageShotsFired || 0;
    const _ssh  = game.stageShotsHit || 0;
    const _sacc = _ssf >= 5 ? Math.round((_ssh / _ssf) * 100) : null;
    const _sEarned = Math.max(0, (game.score || 0) - (game.stageStartScore || 0));
    const _sTime   = typeof fmtFrameTime === 'function' ? fmtFrameTime(game.stageFrames || 0) : '';
    const _sGrade  = game.lastStageGrade;
    const _sGCol   = game.lastStageGradeCol || '#fff';
    // PB flag — check if this stage's frame count beat stored PB
    let _sPBNew = false;
    try {
      if (typeof stagePBs !== 'undefined' && stagePBs) {
        const _sPbF = stagePBs[String(game.stage)];
        if (typeof _sPbF === 'number' && _sPbF > 0 && (game.stageFrames || 0) < _sPbF) _sPBNew = true;
      }
    } catch (_e) {}
    // Earned-PT compact label (raw number for clarity, not zero-padded fmtScore)
    const _sEarnStr = _sEarned >= 1000 ? Math.round(_sEarned / 100) / 10 + 'K' : '+' + _sEarned;

    const _panW = 186, _panH = 30;
    const _panX = Math.round((BASE_W - _panW) / 2);
    const _panY = 186;

    ctx.save();
    // Background panel
    ctx.globalAlpha = 0.74 * _senv;
    ctx.fillStyle = '#000';
    ctx.fillRect(_panX, _panY, _panW, _panH);
    // Grade-colored side bars + hairlines
    ctx.globalAlpha = 0.60 * _senv;
    ctx.fillStyle = _sGCol;
    ctx.fillRect(_panX, _panY, 2, _panH);
    ctx.fillRect(_panX + _panW - 2, _panY, 2, _panH);
    ctx.globalAlpha = 0.25 * _senv;
    ctx.fillRect(_panX, _panY, _panW, 1);
    ctx.fillRect(_panX, _panY + _panH - 1, _panW, 1);
    ctx.globalAlpha = _senv;

    // Grade letter — large, left zone
    ctx.save();
    ctx.shadowColor = _sGCol; ctx.shadowBlur = 6;
    drawRetroText(_sGrade, _panX + 24, _panY + 15, 13, _sGCol, 'center');
    ctx.restore();

    // PB star next to grade
    if (_sPBNew) {
      ctx.save();
      ctx.globalAlpha = (0.7 + 0.3 * Math.sin(game.animFrame * 0.22)) * _senv;
      drawRetroText('★', _panX + 38, _panY + 8, 4, '#fc4', 'left');
      ctx.restore();
    }

    // Vertical divider
    ctx.globalAlpha = 0.25 * _senv;
    ctx.fillStyle = '#555';
    ctx.fillRect(_panX + 46, _panY + 4, 1, _panH - 8);
    ctx.globalAlpha = _senv;

    // Right info: two rows
    const _irx = _panX + 56;
    const _rY1 = _panY + 8;
    const _rY2 = _panY + 20;

    if (_sacc !== null) {
      const _acCol = _sacc >= 90 ? '#0f8' : _sacc >= 70 ? '#0ff' : _sacc >= 50 ? '#fc4' : '#f88';
      drawRetroText('ACC ' + _sacc + '%', _irx, _rY1, 5, _acCol, 'left');
    }
    if (_sTime) {
      drawRetroText('TIME ' + _sTime, _irx + 70, _rY1, 5, '#666', 'left');
    }
    if (_sEarned > 0) {
      const _ptCol = _sEarned >= 10000 ? '#fc4' : _sEarned >= 3000 ? '#0cf' : '#888';
      drawRetroText(_sEarnStr + ' PT', _irx, _rY2, 5, _ptCol, 'left');
    }
    if (_sacc !== null && _sacc >= 95 && !game.stageDied) {
      drawRetroText('DEADEYE', _irx + 70, _rY2, 4, '#f6f', 'left');
    } else if (!game.stageDied && (_ssf || 0) >= 5) {
      drawRetroText('NO DEATH', _irx + 70, _rY2, 4, '#0a6', 'left');
    }

    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // STAGE CLEAR SPOTLIGHT — radial vignette centered on player ship during stage
  // clear cinematic. Inner circle ~30px stays bright; outside fades to dark.
  // Drawn here (HUD pre-text layer) so it darkens the playfield but not text.
  if ((game.stageClearSpotlightFrames || 0) > 0 && game.playerAlive) {
    const sfp = game.stageClearSpotlightFrames;
    const fade = sfp > 30 ? 1 : sfp / 30; // hold 30 frames, fade out over last 30
    ctx.save();
    ctx.globalAlpha = 0.55 * fade;
    ctx.fillStyle = '#000';
    // 4-ring concentric vignette around player position
    const cx = game.playerX, cy = game.playerY;
    for (let r = 0; r < 6; r++) {
      const rin = 30 + r * 8;
      const rout = rin + 8;
      ctx.globalAlpha = 0.10 * fade * (r + 1);
      // Top strip

  // SWARM DIVE WARNING — appears when 3+ enemies transition to dive same frame.

    const sBlink = (game.animFrame >> 1) % 2 === 0;

    ctx.fillStyle = sCol;
    ctx.fillRect(BASE_W/2 - sw/2, 36, sw, 1);
    ctx.fillRect(BASE_W/2 - sw/2, 45, sw, 1);
    drawRetroText(sText, BASE_W/2, 39, 6, sCol);
    ctx.restore();
  }

  // RARE SPAWN ALERT — flashing banner near top of screen when UFO / golden bee enters
  if ((game.rareSpawnAlertLife || 0) > 0 && game.rareSpawnAlertText) {

    const blink = (game.animFrame >> 2) % 2 === 0;
    ctx.save();
    ctx.globalAlpha = ratio;
    // Bracket box around the text
    const w = game.rareSpawnAlertText.length * 5 + 8;
    ctx.fillStyle = '#100';
    ctx.fillRect(BASE_W/2 - w/2, 23, w, 10);
    const col = blink ? game.rareSpawnAlertColor : '#fff';
    ctx.fillStyle = col;

    ctx.fillRect(BASE_W/2 - w/2, 23, w, 1);
    ctx.fillRect(BASE_W/2 - w/2, 32, w, 1);
    drawRetroText(game.rareSpawnAlertText, BASE_W/2, 26, 6, col);
    ctx.restore();
  }

  // FIRST-PLAY TUTORIAL HINTS — only on the very first stage 1 of a new install.

  // after 18s total. Hints sit at the top-center where they don't block gameplay.
  if (!tutorialDone && game.stage === 1 && game.state === STATE.PLAYING) {
    const tf = game.stageFrames || 0;
    let hint = null;
    if (tf < 300)        hint = 'ARROWS / A D : MOVE';
    else if (tf < 600)   hint = 'SPACE : FIRE';
    else if (tf < 900)   hint = 'SHIFT : DASH (INVINCIBLE)';
    else if (tf < 1080)  hint = 'H : HELP, I : STATS';
    if (hint) {
      const blink = (game.animFrame >> 3) % 2 === 0 ? '#fc4' : '#fff';
      drawRetroText(hint, BASE_W/2, 30, 6, blink);
      // (Removed the decorative "FIRST FLIGHT" label at y=38 — it overlapped the
      // "SWARM DIVE!" combat alert at y=39 on stage 1, and the control hint above
      // already conveys the tutorial context. Declutters the center column.)
    }
  }
  // Score: glow yellow + flicker between yellow/white when a NEW HIGH was just set
  if (game.highScoreGlow > 0) {

    ctx.shadowColor = '#ff4';
    ctx.shadowBlur = 6 + 4 * Math.sin(game.animFrame * 0.3);

    const _sc = game.score || 0;
    if (_sc >= 1000000) {

    } else if (_sc >= 100000) {

  // NEAR-BEST INDICATOR — small ▲ symbol next to the score when chasing the

  if (game.score < game.liveHighThreshold

    const sym = ratio >= 0.97 ? '!' : ratio >= 0.94 ? '^' : '~';
    const col = ratio >= 0.97 ? '#fc4' : ratio >= 0.94 ? '#ff4' : '#cf4';

  if (!game.crossedHighOnce && game.liveHighThreshold > 0

    const _cdRatio = Math.max(0, Math.min(1, (game.comboTimer || 0) / COMBO_DECAY));

    ctx.globalAlpha = game._bossTitleGlow || 1;
    drawRetroText(game._bossTitle, BASE_W/2, 12, game._bossTitleSize || 8, COL.red);

  } else {

    if (typeof loadTopScores === 'function') {

      const top1 = (loadTopScores(mode)[0]) || null;
      if (top1 && top1.callsign && top1.callsign !== '???' && top1.score > 0) {

  }

  let stageCol;

  else if (game.stage >= 11) stageCol = '#0cf';

  {

  {

    if (!minimalHud && typeof ACT_TITLES !== 'undefined' && ACT_TITLES) {

      ctx.globalAlpha = 0.65;

      // chapter reads visually distinct (matches the 9-peak-threshold GLOW

      ctx.fillStyle = '#000';

  if (!minimalHud

  if ((game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)

      clockCol = game.stageFrames < pb ? '#0f8' : '#f88';
      // PB ALARM — when within 90-100% of PB, pulse the clock urgent yellow
      // to signal "hurry, you can still beat your record".
      if (game.stageFrames >= pb * 0.9 && game.stageFrames < pb) {
        pbAlarm = (game.animFrame >> 2) % 2 === 0;
        if (pbAlarm) clockCol = '#ff4';
      }
    }
    // PB ALARM glow — 90-100% PB urgency tier picks up a yellow shadowBlur on
    // the clock so the emergency speedrun beat reads beyond just the color flip.
    ctx.save();
    if (pbAlarm) {
      ctx.shadowColor = clockCol;
      ctx.shadowBlur = 5;
    }
    drawRetroText(timeStr, BASE_W - 5, 22, 5, clockCol, 'right');
    ctx.restore();
    // PB DELTA NUMBER — small "(-0.8s)" / "(+1.2s)" relative to PB so the
    // speedrunner sees exact pace, not just ahead/behind color.
    if (typeof pb === 'number' && pb > 0) {
      const deltaFrames = game.stageFrames - pb;
      const deltaSec = (deltaFrames / 60).toFixed(1);
      const sign = deltaFrames >= 0 ? '+' : '';
      const deltaCol = deltaFrames < 0 ? '#0f8' : '#f88';
      // Position to the left of the clock so it reads naturally
      drawRetroText('(' + sign + deltaSec + 's)', BASE_W - 5 - (timeStr.length * 5) - 2, 22, 4, deltaCol, 'right');
      // STAGE TIMER PB BAR — 30px bar under clock showing frames / PB ratio
      const _pbR = Math.min(1.2, game.stageFrames / pb);
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(BASE_W - 33, 28, 28, 1);
      ctx.fillStyle = _pbR < 0.7 ? '#0f8' : _pbR < 1 ? '#fc4' : '#f88';
      ctx.globalAlpha = 0.8;
      ctx.fillRect(BASE_W - 33, 28, Math.round(Math.min(28, 28 * _pbR)), 1);
      ctx.restore();
    }
    // HUD RUN TIMER — cumulative run time under the stage clock. Speedrun aid.
    // Hidden in minimal HUD mode to keep clean view. Also yields its y=28 slot to
    // the transient DIVE SURGE alert (commander rage) so the two don't overprint;
    // the timer reappears the moment the surge ends.
    if (!minimalHud && (game.runFrames || 0) > 0
        && !((game.commanderRageTimer || 0) > 0 && game.state === STATE.PLAYING)) {
      const runStr = fmtFrameTime(game.runFrames || 0);
      drawRetroText('R ' + runStr, BASE_W - 5, 28, 4, '#888', 'right');
    // EXTRA LIFE PROGRESS — 30px green bar showing distance to next 30K threshold.
    // Skipped in challenge mode (hardcore = 1 life, no extras). Pulse at >=90%.
    if (!game.challengeMode && !minimalHud) {
      const intoNext = (game.score || 0) % 30000;
      const elRatio = intoNext / 30000;
      const barW = 30;
      const bx = BASE_W - 5 - barW;
      const by = 39;
      ctx.save();
      ctx.fillStyle = '#020';
      ctx.fillRect(bx, by, barW, 2);
      ctx.fillStyle = elRatio >= 0.9 ? '#0f8' : '#0a4';
      if (elRatio >= 0.9) ctx.globalAlpha = 0.5 + 0.5 * Math.sin(game.animFrame * 0.3);
      ctx.fillRect(bx, by, Math.round(barW * elRatio), 2);
      ctx.restore();
    }
    // HUD DIFFICULTY — small label under run timer (non-default only)
    if (typeof difficultyMode === 'string' && difficultyMode !== 'normal') {
      const dCol = difficultyMode === 'hard' ? '#f44' : '#0f8';
      const dTag = difficultyMode === 'hard' ? 'HARD' : 'EASY';
      drawRetroText(dTag, BASE_W - 5, 33, 4, dCol, 'right');
    }
    }
    // PB ALARM tick — once per second SFX while in alarm zone
    if (pbAlarm && game.animFrame % 60 === 0 && typeof playSound === 'function') {
      playSound('tick');
    }
  }
  // INCOMING WAVE ALERT CINEMATIC — between CHALLENGING waves the 35-frame
  // telegraph window becomes a 3-phase tactical briefing (backdrop flash-in →
  // pattern info hold → urgent fade-out). Fuses with drawChallengeTelegraph()
  // arrows (drawn at y≈144+) which sit below the cinematic strip and remain.
  if (game.state === STATE.CHALLENGING
      && (game.challengeWaveTimer || 0) > 0
      && game.challengeWaves && game.challengeWaveIdx < game.challengeWaves.length) {
    const cwT    = game.challengeWaveTimer;
    const nextW  = (game.challengeWaveIdx || 0) + 1;
    const totW   = (game.challengeWaves || []).length;
    const _nxtWv = game.challengeWaves[game.challengeWaveIdx];
    const pattern= _nxtWv && _nxtWv[0] ? _nxtWv[0].pattern : 'sweep_lr';

    const _PLBL = { sweep_lr: 'SWEEP RIGHT', sweep_rl: 'SWEEP LEFT',
                    pincer: 'PINCER',         top_down: 'RAIN ATTACK',
                    diagonal: 'DIAGONAL CROSS', double_row: 'DOUBLE ROW' };
    const _PCOL = { sweep_lr: '#0ff',  sweep_rl: '#0cf',
                    pincer: '#f44',    top_down: '#fc4',
                    diagonal: '#f8a',  double_row: '#0f8' };
    const pLabel = _PLBL[pattern] || pattern.toUpperCase();
    const pCol   = _PCOL[pattern] || '#fff';
    const lastPerfect = (game.stagePerfectWaves || 0) > 0;
    const isFinal = nextW === totW;

    const TOTAL   = 35;
    const age     = TOTAL - cwT;                          // 0→34 (increases with time)
    const fadeIn  = age  < 8 ? age  / 8 : 1;
    const fadeOut = cwT  < 8 ? cwT  / 8 : 1;
    const env     = Math.min(fadeIn, fadeOut);

    ctx.save();

    // ── BACKDROP ─────────────────────────────────────────────────────────────
    ctx.globalAlpha = 0.62 * env;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 54, BASE_W, 52);
    ctx.globalAlpha = 0.40 * env;
    ctx.fillStyle = pCol;
    ctx.fillRect(0, 54, 2, 52);
    ctx.fillRect(BASE_W - 2, 54, 2, 52);

    // ── PATTERN NAME BANNER (Phases A + B) ──────────────────────────────────
    if (!minimalHud || cwT < 8) {
      ctx.save();
      ctx.globalAlpha = env;
      ctx.shadowColor = pCol; ctx.shadowBlur = 8;
      drawRetroText(pLabel, BASE_W / 2, 66, 9, pCol);
      ctx.restore();

      const subLabel = isFinal ? 'FINAL WAVE !'
                                : 'INCOMING · WAVE ' + nextW + ' / ' + totW;
      const subCol   = isFinal ? '#f55' : '#777';
      ctx.globalAlpha = 0.72 * env;
      drawRetroText(subLabel, BASE_W / 2, 76, 4, subCol);

      ctx.globalAlpha = 0.28 * env;
      ctx.fillStyle = pCol;
      ctx.fillRect(40, 81, BASE_W - 80, 1);
    }

    // ── PHASE B INFO PANEL (age ≥ 8) ────────────────────────────────────────
    if (age >= 8 && !minimalHud) {
      const infoAlpha = Math.min(1, (age - 8) / 6) * fadeOut;

      // Enemy composition dots: 2 boss (red), 6 butterfly (blue), 8 bee (cyan)
      const _DOTS = [{ n: 2, col: '#f88' }, { n: 6, col: '#88f' }, { n: 8, col: '#0cf' }];
      let dotX = BASE_W / 2 - 24;
      ctx.save();
      for (const dg of _DOTS) {
        ctx.globalAlpha = 0.78 * infoAlpha;
        ctx.fillStyle = dg.col;
        for (let d = 0; d < Math.min(dg.n, 5); d++) ctx.fillRect(dotX + d * 3, 87, 2, 2);
        if (dg.n > 5) ctx.fillRect(dotX + 15, 88, 1, 1); // '+' overflow dot
        dotX += (Math.min(dg.n, 5)) * 3 + 5;
      }
      ctx.restore();

      // Last-wave grade (only for waves 2+)
      if (nextW > 1) {
        ctx.save();
        ctx.globalAlpha = 0.85 * infoAlpha;
        if (lastPerfect) {
          ctx.shadowColor = '#fc4'; ctx.shadowBlur = 5;
          drawRetroText('LAST: PERFECT ★', BASE_W / 2, 95, 4, '#fc4');
        } else {
          drawRetroText('LAST: CLEARED', BASE_W / 2, 95, 4, '#555');
        }
        ctx.restore();
      }

      // Wave pip row — centered, one pip per wave
      const pipSpacing  = 5;
      const pipTotalPx  = (totW - 1) * pipSpacing;
      const pipStartX   = Math.round(BASE_W / 2 - pipTotalPx / 2);
      ctx.save();
      for (let pi = 0; pi < totW; pi++) {
        const px       = pipStartX + pi * pipSpacing;
        const isDone   = pi < nextW - 1;   // completed waves
        const isActive = pi === nextW - 1; // current (about to start)
        ctx.globalAlpha = (isDone ? 0.60 : isActive ? 0.95 : 0.22) * infoAlpha;
        ctx.fillStyle = isDone ? pCol : isActive ? '#fff' : '#333';
        const sz = isActive ? 3 : 2;
        ctx.fillRect(px - Math.floor(sz / 2), 102 - Math.floor(sz / 2), sz, sz);
      }
      ctx.restore();
    }

    // ── PHASE C: urgent pulse on final frames (cwT < 8) ─────────────────────
    if (cwT < 8) {
      const urgPulse = 0.5 + 0.5 * Math.sin(game.animFrame * 0.8);
      ctx.save();
      ctx.globalAlpha = urgPulse * (cwT / 8) * 0.8;
      ctx.fillStyle = pCol;
      ctx.fillRect(0, 54, BASE_W, 1);
      ctx.fillRect(0, 105, BASE_W, 1);
      ctx.restore();
    }

    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // DAILY MISSION HUD — small label during daily-mode runs reminding the player
  // of today's objective. Only shows when mission is incomplete + during active
  // gameplay. Provides live progress (X/Y or ✓/—) via mission.progress(g).
  if (game.dailyMode && typeof dailyMission === 'function'
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    const isDone = game._dailyMissionFired
                  || (typeof isDailyMissionDoneToday === 'function' && isDailyMissionDoneToday());
    if (!isDone) {
      const m = dailyMission();
      if (m) {
        const pStr = (typeof m.progress === 'function') ? m.progress(game) : '';
        const label = pStr ? ('M: ' + m.label + ' ' + pStr) : ('M: ' + m.label);
        // y=50 (one row below the biome chip at y=44) — daily mode and stage 8+
        // both put a chip on the right rail, and biome owns y=44.
        drawRetroText(label, BASE_W - 5, 50, 4, '#f6f', 'right');
        // Small pulse dot to the left of the mission label — daily mode signal
        ctx.save();
        const dotPulse = 0.5 + 0.5 * Math.sin(game.animFrame * 0.18);
        ctx.globalAlpha = dotPulse;
        ctx.fillStyle = '#f6f';
        const dotX = BASE_W - 5 - label.length * 4 - 5;
        ctx.fillRect(dotX, 51, 2, 2);
        ctx.restore();
      }
    } else {
      // DAILY MISSION DONE — show ✓ in green so the player has a persistent
      // visual confirmation that today's mission was completed.
      drawRetroText('M: ✓ DONE', BASE_W - 5, 50, 4, '#0f8', 'right');
    }
  }

  // Wave counter + pip row superseded by drawChallengeWaveHUD() (called from drawGameplay).
  // STAGE MUTATION mini-badge — under the stage label, blinks between mutation color/white
  // so the player remembers the rule change is active for the whole stage.
  if (game.stageMutation && game.state === STATE.PLAYING) {
    const m = game.stageMutation;
    const blink = (game.animFrame >> 3) % 2 === 0 ? m.color : '#fff';
    drawRetroText(m.label, BASE_W - 5, 16, 5, blink, 'right');
    // MUTATION DESCRIPTOR — show desc for the first ~5 seconds of the stage so
    // the player learns the rule change before settling into play.
    if (m.desc && (game.stageFrames || 0) < 300) {
      const fade = 1 - (game.stageFrames || 0) / 300;
      ctx.save();
      ctx.globalAlpha = Math.max(0, fade) * 0.85;
      drawRetroText(m.desc, BASE_W - 5, 22, 4, '#888', 'right');
      ctx.restore();
    }
  }
  // COMMANDER RAGE indicator — flashing "SURGE" badge when commanderRageTimer active.
  // Only on PLAYING state (where commander can exist). Fades as timer runs out.
  if ((game.commanderRageTimer || 0) > 0 && game.state === STATE.PLAYING) {
    const _rage = game.commanderRageTimer;
    const _rageAlpha = Math.min(1, _rage / 60) * (0.70 + 0.30 * Math.sin(game.animFrame * 0.35));
    ctx.save();
    ctx.globalAlpha = _rageAlpha;
    drawRetroText('DIVE SURGE', BASE_W - 5, 28, 5, '#f84', 'right');
    ctx.restore();
  }
  // SECONDARY OBJECTIVE mini-badge — small two-line under stage label (or below
  // mutation if both active). Soft green so it doesn't shout for attention.
  if (game.stageObjective && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    const obj = game.stageObjective;
    const baseY = game.stageMutation ? 22 : 16;
    const met = obj.met(game);
    drawRetroText(obj.label, BASE_W - 5, baseY, 5, met ? '#0f8' : '#cfc', 'right');
    drawRetroText(String(obj.progress(game)), BASE_W - 5, baseY + 6, 5, met ? '#0f8' : COL.gray, 'right');
  }
  // ENEMY MORALE chip — bottom-left, above lives row, tiny pulse on state changes.
  // Only shown in active combat states. State color signals enemy mindset at a glance.
  if (!minimalHud && game.enemyMorale && typeof MORALE_STATES !== 'undefined'
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING
          || game.state === STATE.BOSS_STAGE)) {
    const ms = MORALE_STATES[game.enemyMorale];
    if (ms) {
      ctx.save();
      // Subtle pulse — stronger when state isn't NORMAL
      const intensity = game.enemyMorale === 'NORMAL' ? 0.55 : 0.85;
      ctx.globalAlpha = intensity;
      // ROUTED peak — chip glows cyan so the rare peak morale state reads as a
      // visual reward beyond the arrow + label. Matches the peak-threshold
      // GLOW pattern (HIGH SCORE / ACC / COMBO MAX / PARRY ULTRA / SHIELD MAX
      // / PB ALARM / MORALE ROUTED).
