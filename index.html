function drawStatsOverlay() {
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  const panelW = 208, panelH = 286;
  const px = (BASE_W - panelW) / 2;
  const py = (BASE_H - panelH) / 2;

  ctx.fillStyle = 'rgba(0,30,60,0.92)';
  ctx.fillRect(px, py, panelW, panelH);
  ctx.fillStyle = COL.green;
  ctx.fillRect(px, py, panelW, 1);
  ctx.fillRect(px, py + panelH - 1, panelW, 1);
  ctx.fillRect(px, py, 1, panelH);
  ctx.fillRect(px + panelW - 1, py, 1, panelH);

  ctx.save();
  const glow = 0.6 + 0.4 * Math.sin(game.animFrame * 0.1);
  ctx.shadowColor = COL.green;
  ctx.shadowBlur = 8 * glow;
  drawRetroText('LIFETIME STATS', BASE_W/2, py + 12, 10, COL.yellow);
  // Decorative dashed border below title
  ctx.fillStyle = COL.green;
  for (let i = 0; i < panelW - 16; i += 6) {
    if ((i + game.animFrame) % 12 < 4) ctx.fillRect(px + 8 + i, py + 20, 3, 1);
  }
  ctx.restore();

  // Combined totals across both modes for the OVERALL block
  const csN = loadCumStats(false);
  const csC = loadCumStats(true);
  const cs = {
    sessions:   (csN.sessions   || 0) + (csC.sessions   || 0),
    kills:      (csN.kills      || 0) + (csC.kills      || 0),
    shotsFired: (csN.shotsFired || 0) + (csC.shotsFired || 0),
    shotsHit:   (csN.shotsHit   || 0) + (csC.shotsHit   || 0),
    runFrames:  (csN.runFrames  || 0) + (csC.runFrames  || 0),
    bestStage:  Math.max(csN.bestStage || 0, csC.bestStage || 0)
  };
  const acc = cs.shotsFired === 0 ? 0 : Math.round((cs.shotsHit / cs.shotsFired) * 100);
  const fmtTime = (frames) => {
    const t = Math.floor((frames || 0) / 60);
    return String(Math.floor(t / 3600)).padStart(2, '0') + ':' +
           String(Math.floor((t % 3600) / 60)).padStart(2, '0') + ':' +
           String(t % 60).padStart(2, '0');
  };
  const playTime = fmtTime(cs.runFrames);
  const ach = (typeof unlockedAchievements !== 'undefined' ? unlockedAchievements.size : 0);
  const totalAch = Object.keys(ACHIEVEMENTS || {}).length;

  let y = py + 28;

  // Profile page: detect early so it gets full panel space (no OVERALL/BEST TIMES overhead)
  {
    const _ppIds = Object.keys(ACHIEVEMENTS || {});
    const _ppPgs = Math.max(1, Math.ceil(_ppIds.length / 30));
    const _ppNp  = _ppPgs + 2;
    if (typeof game.statsAchPage !== 'number') game.statsAchPage = 0;
    game.statsAchPage = Math.max(0, Math.min(_ppNp - 1, game.statsAchPage));
    if (game.statsAchPage === _ppPgs + 1) {
      const _rk  = computePilotTitle();
      const _ni  = computePilotNextRank();
      const _cN2 = loadCumStats(false), _cC2 = loadCumStats(true);
      const _tK  = (_cN2.kills || 0) + (_cC2.kills || 0);
      const _dxC = (typeof dexUnlocked !== 'undefined') ? dexUnlocked.size : 0;
      const _dxT = Object.keys(ENEMY_INFO || {}).length;
      function _pRow(k, v, col) {
        // size 5 / 6px line height (was 6 / 8px) so the now-lengthy lifetime-stat
        // list fits the panel — a fully-unlocked profile (~18 mastery rows + bosses
        // + last runs) used to overflow past the fixed footer at py+panelH-8.
        drawRetroText(k, px + 8, y, 5, COL.white, 'left');
        drawRetroText(v, px + panelW - 8, y, 5, col || COL.yellow, 'right');
        y += 6;
      }
      function _pDiv() {
        ctx.fillStyle = '#246';
        ctx.fillRect(px + 8, y, panelW - 16, 1);
        y += 4;
      }
      drawRetroText('PILOT PROFILE', BASE_W / 2, y, 9, COL.yellow);
      y += 13;
      // Identity: callsign + current rank
      drawRetroText('[' + playerCallsign + ']', px + 8, y, 8, callsignColor(), 'left');
      {
        const _rkCol = typeof pilotTitleColor === 'function' ? pilotTitleColor(_rk) : '#0cf';
        // ACE PILOT (peak tier) — STATS rank glow completes the 4-location
        // ACE PILOT cohesion (STAGE_INTRO / HUD / STATS / GAME_OVER).
        ctx.save();
        if (_rk === 'ACE PILOT') {
          ctx.shadowColor = _rkCol;
          ctx.shadowBlur = 4;
        }
        drawRetroText(_rk, px + panelW - 8, y, 6, _rkCol, 'right');
        ctx.restore();
      }
      y += 11;
      // Next rank progress — label color matches the upcoming tier so the
      // player sees a preview of the rank's visual identity.
      if (_ni.next) {
        const _niCol = typeof pilotTitleColor === 'function'
          ? pilotTitleColor(_ni.next) : '#fc8';
        drawRetroText('→ ' + _ni.next, px + 8, y, 5, _niCol, 'left');
        drawRetroText(_ni.label, px + panelW - 8, y, 5, COL.gray, 'right');
        y += 7;
        try {
          const _bsR = Math.max(_cN2.bestStage || 0, _cC2.bestStage || 0);
          const _aC  = (typeof unlockedAchievements !== 'undefined') ? unlockedAchievements.size : 0;
          const _aT  = Object.keys(ACHIEVEMENTS || {}).length || 1;
          let _rR = 0;
          if (_ni.next === 'PILOT')            _rR = ((_cN2.sessions || 0) + (_cC2.sessions || 0)) / 10;
          else if (_ni.next === 'VETERAN')     _rR = _tK / 1000;
          else if (_ni.next === 'APEX SURVIVOR')   _rR = _bsR / 30;
          else if (_ni.next === 'BESTIARY MASTER') _rR = _dxC / 8;
          else if (_ni.next === 'ACE PILOT')   _rR = (_aC / _aT) * 100 / 80;
          _rR = Math.max(0, Math.min(1, _rR));
          ctx.save();
          ctx.fillStyle = '#222'; ctx.fillRect(px + 8, y, panelW - 16, 2);
          ctx.fillStyle = _rR >= 0.85 ? '#0f8' : _rR >= 0.5 ? '#0cf' : '#fc8';
          ctx.fillRect(px + 8, y, Math.round((panelW - 16) * _rR), 2);
          ctx.restore();
          y += 5;
        } catch(e){}
      }
      _pDiv();
      // Core stats
      if (typeof computeCompositeCompletion === 'function') {
        const _cmp = computeCompositeCompletion();
        const _nS  = Math.min(5, Math.round(_cmp / 20));
        _pRow('COMPLETION', '★'.repeat(_nS) + '☆'.repeat(5 - _nS) + ' ' + _cmp + '%',
              _cmp >= 80 ? '#fc4' : _cmp >= 50 ? '#0ff' : '#0f8');
      }
      _pRow('BEST STAGE', String(cs.bestStage),
            cs.bestStage >= 30 ? COL.red : cs.bestStage >= 10 ? COL.yellow : COL.cyan);
      _pRow('PLAY TIME', playTime, '#fff');
      _pRow('TOTAL KILLS', fmtScore(_tK));
      _pRow('BESTIARY', _dxC + ' / ' + _dxT, _dxC === _dxT ? '#0f8' : '#0ff');
      _pRow('ACHIEVEMENTS', ach + ' / ' + totalAch + '  ' + Math.round(ach / Math.max(1, totalAch) * 100) + '%',
            ach >= totalAch * 0.8 ? '#0f8' : COL.magenta);
      _pDiv();
      // Mastery highlights (conditional — only shown when earned)
      const _pT = parseInt(localStorage.getItem('galagaParryTotal') || '0', 10);
      if (_pT >= 5) {
        const _pt = _pT >= 500 ? 'GUARDIAN' : _pT >= 200 ? 'WARDEN' : _pT >= 50 ? 'DEFLECTOR' : '';
        _pRow('PARRY', _pT + (_pt ? '  ' + _pt : ''),
              _pT >= 500 ? '#fc4' : _pT >= 200 ? '#0ff' : '#0f8');
      }
      // NEAR MISS lifetime — passive evasion stat, mirrors PARRY surface pattern.
      // Tier thresholds chosen higher than parry (near miss is passive — easier
      // to accumulate). 100 = EVADER / 500 = WRAITH / 1000 = PHANTOM.
      const _nT = parseInt(localStorage.getItem('galagaNearMissTotal') || '0', 10);
      if (_nT >= 25) {
        const _nt = _nT >= 1000 ? 'PHANTOM' : _nT >= 500 ? 'WRAITH' : _nT >= 100 ? 'EVADER' : '';
        _pRow('NEAR MISS', _nT + (_nt ? '  ' + _nt : ''),
              _nT >= 1000 ? '#fc4' : _nT >= 500 ? '#0ff' : '#fff');
        // LIFETIME GRAZE CHAIN — peak consecutive near-miss chain across all runs.
        // Sibling of NEAR MISS (cumulative count); GRAZE CHAIN measures sustained
        // bullet-dance pressure. Tier labels: SLIPSTREAM (3) / GHOSTWALK (5) /
        // SHADOWDANCE (10) / BULLET BALLET (15). Distinct vocab from NEAR MISS
        // tiers (EVADER/WRAITH/PHANTOM) to avoid label collision.
        const _gcT = parseInt(localStorage.getItem('galagaGrazeChainBest') || '0', 10) || 0;
        if (_gcT >= 3) {
          const _gcL = _gcT >= 15 ? 'BULLET BALLET'
                      : _gcT >= 10 ? 'SHADOWDANCE'
                      : _gcT >= 5 ? 'GHOSTWALK'
                      : 'SLIPSTREAM';
          _pRow('GRAZE CHAIN', _gcT + '  ' + _gcL,
                _gcT >= 15 ? '#fc4' : _gcT >= 10 ? '#0ff' : _gcT >= 5 ? '#0f8' : '#cfc');
        }
      }
      try {
        const _sg = JSON.parse(localStorage.getItem('galagaStageGrades') || '{}');
        const _sC = _sg.S || 0;
        if (_sC >= 1) _pRow('S GRADES', '★ ' + _sC, _sC >= 50 ? '#fc4' : _sC >= 20 ? '#ff4' : '#fc8');
      } catch(e){}
      const _wS = parseInt(localStorage.getItem('galagaWitchSaves') || '0', 10);
      if (_wS >= 5) _pRow('WITCH SAVES', String(_wS), _wS >= 100 ? '#fc4' : '#a8f');
      // LIFETIME PB BEATS — speedrun skill stat. Mirrors PARRY / NEAR MISS
      // pattern. Tier labels: BREAKER (25) / RECORD HUNTER (100) / SPEEDRUN ACE (500).
      const _pbB = parseInt(localStorage.getItem('galagaPBBeats') || '0', 10);
      if (_pbB >= 5) {
        const _pbT = _pbB >= 500 ? 'SPEEDRUN ACE'
                    : _pbB >= 100 ? 'RECORD HUNTER'
                    : _pbB >= 25 ? 'BREAKER' : '';
        _pRow('PB BEATS', _pbB + (_pbT ? '  ' + _pbT : ''),
              _pbB >= 500 ? '#fc4' : _pbB >= 100 ? '#0ff' : '#0f8');
      }
      // LIFETIME ELITE KILLS — offensive skill stat. Tier labels: ACE HUNTER
      // (50) / COMMANDER SLAYER (200) / ELITE LEGEND (1000).
      const _ekT = parseInt(localStorage.getItem('galagaEliteKills') || '0', 10);
      if (_ekT >= 5) {
        const _ekL = _ekT >= 1000 ? 'ELITE LEGEND'
                    : _ekT >= 200 ? 'COMMANDER SLAYER'
                    : _ekT >= 50 ? 'ACE HUNTER' : '';
        _pRow('ELITE KILLS', _ekT + (_ekL ? '  ' + _ekL : ''),
              _ekT >= 1000 ? '#fc4' : _ekT >= 200 ? '#fa0' : '#f44');
      }
      // LIFETIME MULTIKILL BEST — peak same-frame kill count across all runs (both
      // modes max). Stored in cumStats per-mode (s.multiKillBest); merged here so
      // the overlay sees the absolute peak regardless of normal vs challenge.
      // Tiers: SPRAY (3) / BARRAGE (5) / MASSACRE (8) / EXTINCTION (12).
      const _mkLifeT = Math.max(_cN2.multiKillBest || 0, _cC2.multiKillBest || 0);
      if (_mkLifeT >= 3) {
        const _mkLifeL = _mkLifeT >= 12 ? 'EXTINCTION'
                       : _mkLifeT >= 8 ? 'MASSACRE'
                       : _mkLifeT >= 5 ? 'BARRAGE'
                       : 'SPRAY';
        _pRow('MULTIKILL', 'x' + _mkLifeT + '  ' + _mkLifeL,
              _mkLifeT >= 12 ? '#fc4' : _mkLifeT >= 8 ? '#f44' : _mkLifeT >= 5 ? '#fa0' : '#cfc');
      }
      // LIFETIME TOP THREAT — dominant death cause across all runs as a self-
      // improvement insight. Reads galagaDeathCauses (bullet/collision tally).
      // Shows the dominant cause + its share %. Red coaching tone. Pairs with
      // DEATH RECAP WHISPER (which coaches the same cause categories at respawn).
      try {
        const _dcR = JSON.parse(localStorage.getItem('galagaDeathCauses') || '{}');
        let _dcTot = 0, _dcDom = null, _dcDomC = 0;
        for (const _dk in _dcR) {
          const _dv = _dcR[_dk] || 0;
          _dcTot += _dv;
          if (_dv > _dcDomC) { _dcDomC = _dv; _dcDom = _dk; }
        }
        if (_dcTot >= 10 && _dcDom) {
          const _dcL = { bullet: 'ENEMY FIRE', collision: 'COLLISION', unknown: 'MISC' }[_dcDom]
                     || _dcDom.toUpperCase();
          const _dcPct = Math.round((_dcDomC / _dcTot) * 100);
          _pRow('TOP THREAT', _dcL + ' ' + _dcPct + '%', '#f88');
        }
      } catch (_eDC) {}
      // LIFETIME PICKUP TOTALS — sum of every pickup collected across all runs
      // + the most-collected type label. Reads galagaPickupTotals (per-pickup
      // write). Tier labels: GATHERER (50) / ENTHUSIAST (200) / ARCHIVIST (1000).
      // Avoids 'COLLECTOR' (used by the 30-pickup run achievement).
      try {
        const _pkR = JSON.parse(localStorage.getItem('galagaPickupTotals') || '{}');
        let _pkTot = 0, _pkFav = null, _pkFavC = 0;
        for (const _pkK in _pkR) {
          const _pkV = _pkR[_pkK] || 0;
          _pkTot += _pkV;
          if (_pkV > _pkFavC) { _pkFavC = _pkV; _pkFav = _pkK; }
        }
        if (_pkTot >= 50) {
          const _pkL = _pkTot >= 1000 ? 'ARCHIVIST'
                     : _pkTot >= 200 ? 'ENTHUSIAST'
                     : 'GATHERER';
          const _pkSuf = _pkFav ? '  (' + _pkFav + ')' : '';
          _pRow('PICKUPS', _pkTot + '  ' + _pkL + _pkSuf,
                _pkTot >= 1000 ? '#fc4' : _pkTot >= 200 ? '#0ff' : '#0f8');
        }
      } catch (_ePK) {}
      // LIFETIME SPECIALTY TARGET — most-killed enemy type across all runs.
      // Reads galagaKillsByType (batched on commit). Tier labels: HUNTER (50) /
      // SPECIALIST (200) / NEMESIS (1000). Color ramps from cyan (hunter) to
      // magenta (specialist) to gold (nemesis). Distinct from "FAVORITE" run
      // highlight which tracks pickup type, not victim type.
      try {
        const _kbtL = JSON.parse(localStorage.getItem('galagaKillsByType') || '{}');
        let _spT = null, _spC = 0;
        for (const _kt in _kbtL) {
          const _kv = _kbtL[_kt] || 0;
          if (_kv > _spC) { _spC = _kv; _spT = _kt; }
        }
        if (_spT && _spC >= 50) {
          const _spL = _spC >= 1000 ? 'NEMESIS'
                     : _spC >= 200 ? 'SPECIALIST'
                     : 'HUNTER';
          _pRow('SPECIALTY', _spT.toUpperCase() + ' x' + _spC + '  ' + _spL,
                _spC >= 1000 ? '#fc4' : _spC >= 200 ? '#f6f' : '#0ff');
        }
      } catch (_eK) {}
      // LIFETIME LASER PIERCE BEST — peak enemies pierced by a single laser bullet
      // (laserPierceBest in cumStats). Surfaces weapon mastery for the rare laser
      // pickup. Tiers: PIERCE (3) / SHAFT (5) / SUNBEAM (8) / STARSTRIKE (12).
      // Pink/gold ramp matches laser visual color (#f6c).
      const _lpLifeT = Math.max(_cN2.laserPierceBest || 0, _cC2.laserPierceBest || 0);
      if (_lpLifeT >= 3) {
        const _lpLifeL = _lpLifeT >= 12 ? 'STARSTRIKE'
                       : _lpLifeT >= 8 ? 'SUNBEAM'
                       : _lpLifeT >= 5 ? 'SHAFT'
                       : 'PIERCE';
        _pRow('LASER PIERCE', 'x' + _lpLifeT + '  ' + _lpLifeL,
              _lpLifeT >= 12 ? '#fc4' : _lpLifeT >= 8 ? '#f6c' : _lpLifeT >= 5 ? '#f8a' : '#cfc');
      }
      // LIFETIME FLAWLESS BOSS — boss stages cleared without taking a hit, across
      // all runs. Tier labels: CLEAN KILL (1) / SURGEON (10) / IMMACULATE (50).
      // Distinct vocab from CLEAN STREAK (UNTOUCHABLE) + perfectionist achievement.
      const _fbT = parseInt(localStorage.getItem('galagaFlawlessBosses') || '0', 10) || 0;
      if (_fbT >= 1) {
        const _fbL = _fbT >= 50 ? 'IMMACULATE'
                   : _fbT >= 10 ? 'SURGEON'
                   : 'CLEAN KILL';
        _pRow('FLAWLESS BOSS', _fbT + '  ' + _fbL,
              _fbT >= 50 ? '#fc4' : _fbT >= 10 ? '#0ff' : '#0f8');
      }
      // LIFETIME REVENGE — count of collision-death payback kills across all
      // runs. Tier labels: AVENGER (1) / RETALIATOR (5) / VENGEANCE (15) /
      // SCORE-SETTLER (50). Red ramp matches REVENGE! floattext + narrative tone.
      const _rvT = parseInt(localStorage.getItem('galagaRevengeTotal') || '0', 10) || 0;
      if (_rvT >= 1) {
        const _rvL = _rvT >= 50 ? 'SCORE-SETTLER'
                   : _rvT >= 15 ? 'VENGEANCE'
                   : _rvT >= 5 ? 'RETALIATOR'
                   : 'AVENGER';
        _pRow('REVENGE', _rvT + '  ' + _rvL,
              _rvT >= 50 ? '#fc4' : _rvT >= 15 ? '#fa0' : _rvT >= 5 ? '#f44' : '#f88');
      }
      // LIFETIME CLEAN STREAK — peak consecutive no-death stages across all runs.
      // Tier labels: FOCUSED (5) / RELENTLESS (15) / UNTOUCHABLE (30) / PERFECT FORM (60).
      // Green/gold ramp matches safe-state PB convention; peak tier promotes to gold.
      const _csT = parseInt(localStorage.getItem('galagaCleanStreakBest') || '0', 10) || 0;
      if (_csT >= 3) {
        const _csL = _csT >= 60 ? 'PERFECT FORM'
                    : _csT >= 30 ? 'UNTOUCHABLE'
                    : _csT >= 15 ? 'RELENTLESS'
                    : _csT >= 5 ? 'FOCUSED' : '';
        _pRow('CLEAN STREAK', _csT + (_csL ? '  ' + _csL : ''),
              _csT >= 60 ? '#fc4' : _csT >= 30 ? '#0ff' : _csT >= 15 ? '#0f8' : '#cfc');
      }
      // LIFETIME GHOST KILLS — rare stealth-variant kills. Tier: STALKER (25)
      // / APEX PHANTOM (100). Purple ghost color throughout.
      const _gkT = parseInt(localStorage.getItem('galagaGhostKills') || '0', 10);
      if (_gkT >= 5) {
        const _gkL = _gkT >= 100 ? 'APEX PHANTOM'
                    : _gkT >= 25 ? 'STALKER'
                    : 'PHANTOM HUNTER';
        _pRow('GHOST KILLS', _gkT + '  ' + _gkL,
              _gkT >= 100 ? '#fc4' : _gkT >= 25 ? '#f6f' : '#a8f');
      }
      // LIFETIME PERFECT WAVES — sums normal + challenge cumStats. Tier:
      // FORMATION BREAKER (50) / WAVE MASTER (200) / PERFECT LEGEND (1000).
      const _pwT = (_cN2.perfectWavesTotal || 0) + (_cC2.perfectWavesTotal || 0);
      if (_pwT >= 5) {
        const _pwL = _pwT >= 1000 ? 'PERFECT LEGEND'
                    : _pwT >= 200 ? 'WAVE MASTER'
                    : _pwT >= 50 ? 'FORMATION BREAKER' : '';
        _pRow('PERFECT WAVES', _pwT + (_pwL ? '  ' + _pwL : ''),
              _pwT >= 1000 ? '#fc4' : _pwT >= 200 ? '#f6f' : _pwT >= 50 ? '#0ff' : '#0f8');
      }
      const _gC = parseInt(localStorage.getItem('galagaGameCompleteCount') || '0', 10);
      if (_gC >= 1) _pRow('GAME COMPLETE', '★ ' + _gC, '#fc4');
      // Boss checklist
      try {
        const _bD  = JSON.parse(localStorage.getItem('galagaBossesDefeated') || '{}');
        const _bMs = [10, 20, 30, 40, 50, 60, 70, 80];
        const _bDf = _bMs.filter(m => _bD[String(m)]).length;
        _pDiv();
        drawRetroText('BOSSES  ' + _bDf + ' / 8', px + 8, y, 6, COL.cyan, 'left');
        y += 8;
        for (let i = 0; i < _bMs.length; i++) {
          const _g = !!_bD[String(_bMs[i])];
          drawRetroText((_g ? '✓' : '·') + ' S' + _bMs[i],
                        px + 8 + (i % 4) * 50, y + Math.floor(i / 4) * 7,
                        5, _g ? '#fc4' : '#444', 'left');
        }
        y += 16;
      } catch(e){}
      // Last 3 runs
      try {
        const _mem = JSON.parse(localStorage.getItem('galagaDeathMemorials') || '[]');
        if (Array.isArray(_mem) && _mem.length > 0) {
          _pDiv();
          drawRetroText('LAST RUNS', px + 8, y, 6, '#f88', 'left');
          y += 8;
          for (let i = 0; i < Math.min(3, _mem.length); i++) {
            const _m = _mem[i];
            drawRetroText('S' + (_m.stage || 0), px + 8, y, 5, '#aaa', 'left');
            drawRetroText(fmtScore(_m.score || 0), px + 55, y, 5, '#fff', 'left');
            drawRetroText('[' + (_m.mode || 'NORM') + ']', px + panelW - 8, y, 5, '#888', 'right');
            y += 7;
          }
        }
      } catch(e){}
      drawRetroText(_ppNp + '/' + _ppNp + '  TAB', px + panelW - 8, py + panelH - 8, 5, COL.gray, 'right');
      drawRetroText('I  CLOSE', px + 8, py + panelH - 8, 6, COL.gray, 'left');
      return;
    }
  }

  // BESTIARY page — dedicated full panel (mirrors the profile early-return). Drawn
  // on its own page rather than appended below the OVERALL/TOP SCORES/BEST TIMES
  // block, which used to push the 12-row enemy codex ~46px past the panel footer.
  {
    const _bIds = Object.keys(ACHIEVEMENTS || {});
    const _bPgs = Math.max(1, Math.ceil(_bIds.length / 30));
    if (game.statsAchPage === _bPgs) {
      drawRetroText('BESTIARY', px + 8, y, 7, COL.cyan, 'left');
      drawRetroText((game.statsAchPage + 1) + '/' + (_bPgs + 2) + '  TAB',
                    px + panelW - 8, y, 5, COL.gray, 'right');
      y += 9;
      const dexIds = Object.keys(ENEMY_INFO);
      const unlockedCount = dexIds.filter(t => dexUnlocked.has(t)).length;
      drawRetroText(unlockedCount + '/' + dexIds.length + ' ENCOUNTERED', px + 8, y, 5, COL.gray, 'left');
      y += 8;
      for (const t of dexIds) {
        const info = ENEMY_INFO[t];
        const got = dexUnlocked.has(t);
        ctx.fillStyle = got ? 'rgba(0,255,136,0.10)' : 'rgba(40,40,40,0.40)';
        ctx.fillRect(px + 6, y - 1, panelW - 12, 8);
        drawRetroText(got ? info.name : '???', px + 8, y + 1, 6, got ? info.col : '#444', 'left');
        drawRetroText(got ? info.trait : 'DEFEAT TO REVEAL',
                      px + panelW - 8, y + 1, 5, got ? '#fff' : '#333', 'right');
        y += 9;
      }
      drawRetroText('I  CLOSE', px + 8, py + panelH - 8, 6, COL.gray, 'left');
      return;
    }
  }

  drawRetroText('OVERALL', px + 8, y, 7, COL.cyan, 'left');
  y += 9;

  function row(label, value, valueCol) {
    drawRetroText(label, px + 8, y, 6, COL.white, 'left');
    drawRetroText(value, px + panelW - 8, y, 6, valueCol || COL.yellow, 'right');
    y += 8;
  }

  {
    const _ss = cs.sessions || 0;
    const _ssTier = _ss >= 500 ? 'COMMITTED'
                  : _ss >= 100 ? 'DEDICATED'
                  : _ss >= 30  ? 'REGULAR'
                  : _ss >= 5   ? 'PILOT'
                  : '';
    row('SESSIONS', _ss + (_ssTier ? ' ' + _ssTier : ''), COL.cyan);
  }
  {
    const _hours = (cs.runFrames || 0) / 3600 / 60;
    const _ptTier = _hours >= 50 ? 'OBSESSED'
                  : _hours >= 10 ? 'DEVOTED'
                  : _hours >= 5  ? 'SERIOUS'
                  : _hours >= 1  ? 'WARMED UP'
                  : '';
    row('PLAY TIME', playTime + (_ptTier ? ' ' + _ptTier : ''), '#fff');
  }
  {
    const _tk = cs.kills || 0;
    const _tkTier = _tk >= 10000 ? 'LEGENDARY'
                  : _tk >= 2000  ? 'EXTERMINATOR'
                  : _tk >= 500   ? 'SLAYER'
                  : _tk >= 100   ? 'HUNTER' : '';
    row('TOTAL KILLS', fmtScore(_tk) + (_tkTier ? ' ' + _tkTier : ''), COL.yellow);
  }
  {
    const _accTier = acc >= 95 ? 'SHARPSHOOTER'
                   : acc >= 85 ? 'CRACK SHOT'
                   : acc >= 70 ? 'MARKSMAN'
                   : acc >= 50 ? 'STEADY' : '';
    const _accLab = _accTier ? (acc + '% ' + _accTier) : (acc + '%');
    row('OVERALL ACC', _accLab, acc >= 80 ? COL.green : COL.yellow);
  }
  {
    const _bsS = cs.bestStage || 0;
    const _bsTier = _bsS >= 80 ? 'VOIDWALKER'
                  : _bsS >= 50 ? 'APEX'
                  : _bsS >= 30 ? 'VOYAGER'
                  : _bsS >= 15 ? 'PATHFINDER'
                  : _bsS >= 5  ? 'SCOUT' : '';
    row('BEST STAGE', _bsS + (_bsTier ? ' ' + _bsTier : ''),
        _bsS >= 30 ? COL.red : _bsS >= 10 ? COL.yellow : COL.cyan);
  }

  // Mode-specific compact summary row
  y += 2;
  drawRetroText('N:' + (csN.sessions || 0) + 'S', px + 8, y, 5, '#fff', 'left');
  drawRetroText('C:' + (csC.sessions || 0) + 'S', px + panelW - 8, y, 5, COL.red, 'right');
  y += 7;

  y += 6;
  drawRetroText('TOP SCORES', px + 8, y, 7, COL.cyan, 'left');
  y += 9;
  const norm  = (loadTopScores('normal')[0]    || {}).score || 0;
  const chal  = (loadTopScores('challenge')[0] || {}).score || 0;
  const daily = (loadTopScores('daily')[0]     || {}).score || 0;
  row('NORMAL',    fmtScore(norm),  '#fff');
  row('CHALLENGE', fmtScore(chal),  COL.red);
  row('DAILY',     fmtScore(daily), COL.green);

  y += 6;
  drawRetroText('PROGRESS', px + 8, y, 7, COL.cyan, 'left');
  y += 9;
  row('ACHIEVEMENTS', ach + ' / ' + totalAch, COL.magenta);
  // Achievement progress bar
  const barW = panelW - 16;
  const ratio = totalAch > 0 ? ach / totalAch : 0;
  ctx.fillStyle = '#222';
  ctx.fillRect(px + 8, y, barW, 3);
  ctx.fillStyle = COL.magenta;
  ctx.fillRect(px + 8, y, Math.round(barW * ratio), 3);
  y += 6;

  y += 4;
  drawRetroText('BEST TIMES', px + 8, y, 7, COL.cyan, 'left');
  y += 9;
  const bt = loadBestTimes();
  for (const ms of MILESTONE_STAGES) {
    const c = bt[ms] != null ? COL.yellow : COL.gray;
    drawRetroText('S' + ms, px + 8, y, 6, c, 'left');
    drawRetroText(fmtMS(bt[ms]), px + panelW - 8, y, 6, c, 'right');
    y += 7;
  }

  // Achievement grid (3-col, one cell per achievement). BESTIARY (enemy codex)
  // and PROFILE are dedicated pages handled by their own early-returns above.
  y += 4;
  const ids = Object.keys(ACHIEVEMENTS);
  const cellW = (panelW - 16) / 3;
  const cellH = 7;
  const PER_PAGE = 30; // 10 rows × 3 cols
  const achPages = Math.max(1, Math.ceil(ids.length / PER_PAGE));
  const numPages = achPages + 2; // +1 bestiary, +1 profile (last)
  if (typeof game.statsAchPage !== 'number') game.statsAchPage = 0;
  game.statsAchPage = Math.max(0, Math.min(numPages - 1, game.statsAchPage));
  drawRetroText('ACHIEVEMENTS', px + 8, y, 7, COL.cyan, 'left');
  drawRetroText((game.statsAchPage + 1) + '/' + numPages + '  TAB', px + panelW - 8, y, 5, COL.gray, 'right');
  y += 9;
  const start = game.statsAchPage * PER_PAGE;
  const end = Math.min(ids.length, start + PER_PAGE);
  for (let i = start; i < end; i++) {
    const id = ids[i];
    const offset = i - start;
    const r = Math.floor(offset / 3), c = offset % 3;
    const cx = px + 8 + c * cellW;
    const cy = y + r * cellH;
    const got = unlockedAchievements.has(id);
    ctx.fillStyle = got ? 'rgba(255,170,68,0.20)' : 'rgba(40,40,40,0.45)';
    ctx.fillRect(cx, cy, cellW - 2, cellH - 2);
    ctx.fillStyle = got ? '#fc4' : '#333';
    ctx.fillRect(cx, cy, cellW - 2, 1);
    ctx.fillRect(cx, cy + cellH - 3, cellW - 2, 1);
    const gemX = cx + 4, gemY = cy + (cellH - 2) / 2;
    if (got) drawMiniGem(gemX, gemY, '#fc4');
    else { ctx.fillStyle = '#555'; ctx.fillRect(gemX - 1, gemY - 1, 3, 3); }
    const name = ACHIEVEMENTS[id].name;
    drawRetroText(name.length > 12 ? name.slice(0, 12) : name, cx + 9, cy + (cellH - 1) / 2, 5, got ? '#fff' : '#666', 'left');
  }

  drawRetroText('I  CLOSE', BASE_W/2, py + panelH - 8, 6, COL.gray);
}

// --- Game loop ---
let lastTime = 0;
let accumulator = 0;
const TICK = 1000 / FPS;

function gameLoop(timestamp) {
  // FREEZE GUARD — wrap entire loop in try/finally so a thrown error in
  // update() or draw() can't strand requestAnimationFrame and freeze the game.
  // Errors logged to console; loop keeps running.
  try {
    if (lastTime === 0) lastTime = timestamp;
    let dt = timestamp - lastTime;
    lastTime = timestamp;
    if (dt > 100) dt = 100; // cap

    // FPS sampler — averages over the last ~30 frames
    _fpsAcc += dt;
    _fpsCount++;
    if (timestamp - _fpsLastSample > 500) {
      _fpsValue = Math.round((1000 * _fpsCount) / Math.max(1, _fpsAcc));
      _fpsAcc = 0; _fpsCount = 0;
      _fpsLastSample = timestamp;
    }

    accumulator += dt;
    // Spiral-of-death guard: if accumulator is far behind (heavy frame stutter or
    // browser stall), cap iterations and reset accumulator so we don't compound
    // multiple expensive update() calls per draw and lock the main thread.
    let maxIters = 6;
    while (accumulator >= TICK && maxIters > 0) {
      // Hit-stop: pause the simulation for a few frames after big impacts (game state only;
      // animFrame still advances so explosions/sparks keep moving for visual flair)
      if (game && game.hitStopFrames > 0) {
        game.hitStopFrames--;
        game.animFrame++;
      } else {
        try { update(); } catch (uErr) { console.error('update() error:', uErr); }
      }
      accumulator -= TICK;
      maxIters--;
    }
    if (maxIters === 0) accumulator = 0; // drain remainder if we hit the cap
    try { draw(); } catch (dErr) { console.error('draw() error:', dErr); }
  } finally {
    requestAnimationFrame(gameLoop);
  }
}

// --- Init ---
function init() {
  resetGame();
  initStars();
  initInput();
  resize();
  requestAnimationFrame(gameLoop);
}

init();
</script>
