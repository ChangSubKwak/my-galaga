    const dx = x2 - x1, dy = y2 - y1;
    const steps = Math.max(2, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy))));
    for (let s = 0; s <= steps; s++) {
      const tt = s / steps;
      ctx.fillRect(Math.round(x1 + dx * tt), Math.round(y1 + dy * tt), 1, 1);
    }
  }
  ctx.restore();

  // Vignette dimming
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  ctx.restore();

  // Three cards. Each card: fade-in 30 frames, hold, fade-out 30 frames.
  const cards = [
    { start: 0,   lines: ['EARTH 23XX',          'ALIEN HIVE FLEET',     'INVADES THE GALAXY'], cols: ['#fc4', '#f44', '#fff'] },
    { start: 140, lines: ['STARFIGHTER GAM-42',  'LAUNCHED',             'ONE PILOT REMAINS'],  cols: ['#0cf', '#fff', '#fc4'] },
    { start: 280, lines: ['DEFEND THE GALAXY',   '',                     'PRESS ANY KEY'],      cols: ['#ff4', '#fff', '#0ff'] }
  ];
  const f = cinematicFrame;
  for (const c of cards) {
    const local = f - c.start;
    if (local < 0 || local > 140) continue;
    let alpha;
    if (local < 30) alpha = local / 30;
    else if (local > 110) alpha = Math.max(0, 1 - (local - 110) / 30);
    else alpha = 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    drawRetroText(c.lines[0], BASE_W/2, BASE_H/2 - 18, 14, c.cols[0]);
    if (c.lines[1]) drawRetroText(c.lines[1], BASE_W/2, BASE_H/2 - 2, 10, c.cols[1]);
    drawRetroText(c.lines[2], BASE_W/2, BASE_H/2 + 14, 9, c.cols[2]);
    ctx.restore();
  }

  // "ANY KEY TO SKIP" hint at bottom
  if (cinematicFrame > 30) {
    if ((cinematicFrame >> 4) % 2 === 0) {
      drawRetroText('ANY KEY TO SKIP', BASE_W/2, BASE_H - 14, 6, COL.gray);
    }
  }
}

function drawTitleScreen() {
  const t = game.animFrame;

  // TIME-OF-DAY PILOT GREETING — top-left accent. Reads system clock at draw
  // time and picks one of 5 phases: NIGHT/DAWN/MORNING/AFTERNOON/EVENING.
  // Shown only when a callsign is set (not '???') and not in callsign editor.
  if (!callsignInput.active && playerCallsign && playerCallsign !== '???') {
    const _hr = new Date().getHours();
    let _phase, _phCol;
    if (_hr < 5)       { _phase = 'LATE NIGHT'; _phCol = '#a8f'; }
    else if (_hr < 9)  { _phase = 'GOOD MORNING'; _phCol = '#fc8'; }
    else if (_hr < 12) { _phase = 'GOOD MORNING'; _phCol = '#fc4'; }
    else if (_hr < 17) { _phase = 'GOOD AFTERNOON'; _phCol = '#0cf'; }
    else if (_hr < 21) { _phase = 'GOOD EVENING'; _phCol = '#f6c'; }
    else               { _phase = 'GOOD NIGHT'; _phCol = '#48f'; }
    drawRetroText(_phase + ', [' + playerCallsign + ']', BASE_W/2, 12, 5, _phCol);
  }

  // Top decorative dashed border (animated marquee)
  ctx.fillStyle = '#0af';
  for (let i = 0; i < BASE_W; i += 8) {
    if ((i + (t * 2)) % 16 < 4) {
      ctx.fillRect(i, 30, 4, 1);
      ctx.fillRect(i, 78, 4, 1);
    }
  }

  // TROPHY ROW — single horizontal badge strip at y=22 (above top dashed
  // border, below greeting). Previously badges stacked at y=40-76 *inside*
  // the GALAGA logo zone and overlapped the rainbow letters. Now compact
  // 2-letter codes on one row. ALL SHIPS / ALL DIFFICULTIES / ALL BIOMES /
  // BESTIARY text labels removed — the colored dot rows below the logo
  // already communicate that progression visually, avoiding duplication.
  try {
    const _gcCnt = parseInt(localStorage.getItem('galagaGameCompleteCount') || '0', 10) || 0;
    const _achAll = (typeof unlockedAchievements !== 'undefined' && typeof ACHIEVEMENTS !== 'undefined'
                    && unlockedAchievements.size >= Object.keys(ACHIEVEMENTS).length);
    const _csNp = (typeof loadCumStats === 'function') ? loadCumStats(false) : {};
    const _csCp = (typeof loadCumStats === 'function') ? loadCumStats(true) : {};
    const _psPm = Math.max(_csNp.parryStreakBest || 0, _csCp.parryStreakBest || 0);
    const _cbEver = parseInt(localStorage.getItem('galagaMaxComboEver') || '0', 10) || 0;
    const _lr = Math.max(_csNp.longestRun || 0, _csCp.longestRun || 0);
    const _trophies = [];
    if (_gcCnt > 0) {
      _trophies.push({ text: _gcCnt >= 5 ? '★3' : _gcCnt >= 2 ? '★2' : '★', col: '#fc4' });
    }
    if (_achAll) {
      _trophies.push({ text: '100%', col: '#fc4' });
    }
    if (_psPm >= 10) _trophies.push({ text: 'PM', col: '#0cf' });
    if (_cbEver >= 50) _trophies.push({ text: _cbEver >= 100 ? 'CG' : 'CL', col: _cbEver >= 100 ? '#fc4' : '#0ff' });
    if (_lr >= 54000) _trophies.push({ text: _lr >= 216000 ? 'IP' : _lr >= 108000 ? 'MR' : 'LR',
                                        col: _lr >= 216000 ? '#fc4' : _lr >= 108000 ? '#0ff' : '#0f8' });
    if (_trophies.length > 0) {
      const _gap = 8;
      const _slotW = 16;  // fixed slot width keeps spacing uniform
      const _trTotal = _trophies.length * _slotW + (_trophies.length - 1) * _gap;
      let _trX = BASE_W/2 - _trTotal/2 + _slotW/2;
      for (const _e of _trophies) {
        drawRetroText(_e.text, _trX, 22, 5, _e.col, 'center');
        _trX += _slotW + _gap;
      }
    }
  } catch (e) {}
  // (ALL SHIPS / ALL DIFFICULTIES / ALL BIOMES / BESTIARY / 100% ACH /
  // PARRY MASTER / COMBO LEGEND text badges removed — consolidated into the
  // trophy row above. Dot rows below still cover the categorical progression.)
  // COMPOSITE COMPLETION % — weighted aggregate via shared helper.
  if (typeof computeCompositeCompletion === 'function') {
    const _comp = computeCompositeCompletion();
    if (_comp >= 5) {
      const _cmpCol = _comp >= 80 ? '#fc4' : _comp >= 50 ? '#0ff' : _comp >= 20 ? '#0f8' : '#888';
      drawRetroText('CMPL ' + _comp + '%', BASE_W/2, 94, 4, _cmpCol, 'center');
      // Mini bar under text
      ctx.save();
      const _cbW = 40, _cbX = BASE_W/2 - _cbW/2, _cbY = 99;
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(_cbX, _cbY, _cbW, 1);
      ctx.fillStyle = _cmpCol;
      ctx.globalAlpha = 0.8;
      ctx.fillRect(_cbX, _cbY, Math.round(_cbW * _comp / 100), 1);
      ctx.restore();
    }
  }
  // PERKS DOTS — 10 dots showing perks tried at least once (lifetime).
  try {
    const _pkRaw = localStorage.getItem('galagaPerkPicks') || '{}';
    const _pkTot = JSON.parse(_pkRaw);
    if (typeof PERK_IDS !== 'undefined' && PERK_IDS && PERK_IDS.length > 0) {
      const _hasAny = PERK_IDS.some(id => (_pkTot[id] || 0) >= 1);
      if (_hasAny) {
        const _pY = 72;
        const _pStartX = BASE_W/2 - (PERK_IDS.length * 4) / 2;
        ctx.save();
        for (let _pi = 0; _pi < PERK_IDS.length; _pi++) {
          const _pId = PERK_IDS[_pi];
          const _pCol = (typeof PERKS !== 'undefined' && PERKS[_pId]) ? PERKS[_pId].col : '#fff';
          ctx.globalAlpha = (_pkTot[_pId] || 0) >= 1 ? 0.85 : 0.20;
          ctx.fillStyle = _pCol;
          ctx.fillRect(_pStartX + _pi * 4, _pY, 2, 2);
        }
        ctx.restore();
      }
    }
  } catch (e) {}
  // DIFFICULTIES DOTS — 3 dot row (green/white/red) above ships
  try {
    const _dRaw = localStorage.getItem('galagaDifficultiesUsed') || '[]';
    const _dArr = JSON.parse(_dRaw);
    if (Array.isArray(_dArr) && _dArr.length > 0) {
      const _dOrd = ['easy', 'normal', 'hard'];
      const _dCols = ['#0f8', '#fff', '#f44'];
      const _dSet = new Set(_dArr);
      const _dY = 76;
      const _dStartX = BASE_W/2 - 4;
      ctx.save();
      for (let _di = 0; _di < 3; _di++) {
        ctx.globalAlpha = _dSet.has(_dOrd[_di]) ? 0.85 : 0.20;
        ctx.fillStyle = _dCols[_di];
        ctx.fillRect(_dStartX + _di * 4, _dY, 2, 2);
      }
      ctx.restore();
    }
  } catch (e) {}
  // SHIPS DOTS — 4 dot row (color per ship) above bestiary
  try {
    const _spRaw = localStorage.getItem('galagaShipsUsed') || '[]';
    const _spArr = JSON.parse(_spRaw);
    if (Array.isArray(_spArr) && _spArr.length > 0) {
      const _spOrd = (typeof SHIP_ORDER !== 'undefined') ? SHIP_ORDER : ['default','scout','bruiser','spark'];
      const _spSet = new Set(_spArr);
      const _sY = 80;
      const _sStartX = BASE_W/2 - 6;
      ctx.save();
      for (let _si = 0; _si < _spOrd.length; _si++) {
        const _sk = _spOrd[_si];
        const _sCol = (typeof SHIPS !== 'undefined' && SHIPS[_sk]) ? SHIPS[_sk].color : '#fff';
        ctx.globalAlpha = _spSet.has(_sk) ? 0.85 : 0.20;
        ctx.fillStyle = _sCol;
        ctx.fillRect(_sStartX + _si * 4, _sY, 2, 2);
      }
      ctx.restore();
    }
  } catch (e) {}
  // BESTIARY DOTS — 8 small enemy-type dots beneath badge stack
  if (typeof dexUnlocked !== 'undefined' && dexUnlocked.size > 0
      && typeof ENEMY_INFO !== 'undefined') {
    const _eOrder = ['bee', 'butterfly', 'boss', 'mirror', 'splitter',
                     'shielded', 'ufo', 'kamikaze'];
    const _eY = 84;
    const _eStartX = BASE_W/2 - 14;
    ctx.save();
    for (let _ei = 0; _ei < 8; _ei++) {
      const _et = _eOrder[_ei];
      const _eCol = (ENEMY_INFO[_et] && ENEMY_INFO[_et].col) || '#fff';
      ctx.globalAlpha = dexUnlocked.has(_et) ? 0.85 : 0.20;
      ctx.fillStyle = _eCol;
      ctx.fillRect(_eStartX + _ei * 4, _eY, 2, 2);
    }
    ctx.restore();
  }
  // BIOMES DOTS — 8 small biome-colored dots beneath badge stack. Filled when
  // that biome has been visited, dim otherwise. At-a-glance exploration visual.
  try {
    const _bdRaw = localStorage.getItem('galagaBiomesSeen') || '[]';
    const _bdArr = JSON.parse(_bdRaw);
    if (Array.isArray(_bdArr) && _bdArr.length > 0) {
      const _order = ['planet', 'dawn', 'asteroid', 'ice', 'gasGiant', 'corona', 'blackhole', 'starfield'];
      const _seen = new Set(_bdArr);
      const _dY = 88;
      const _dStartX = BASE_W/2 - 14;
      ctx.save();
      for (let _di = 0; _di < 8; _di++) {
        const _bd = _order[_di];
        const _bdCol = (typeof BIOME_NAMES !== 'undefined' && BIOME_NAMES[_bd]) ? BIOME_NAMES[_bd].col : '#fff';
        ctx.globalAlpha = _seen.has(_bd) ? 0.85 : 0.20;
        ctx.fillStyle = _bdCol;
        ctx.fillRect(_dStartX + _di * 4, _dY, 2, 2);
      }
      ctx.restore();
    }
  } catch (e) {}
  // (MARATHONER badge consolidated into the trophy row at y=22 above —
  // 'LR' / 'MR' / 'IP' code by tier.)
  // Animated rainbow GALAGA logo with per-letter bobbing
  const letters = 'GALAGA'.split('');
  const palette = ['#f44', '#fa0', '#ff4', '#4f4', '#4af', '#f4f'];
  ctx.save();
  ctx.font = 'bold 28px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const charW = ctx.measureText('G').width;
  const totalW = charW * letters.length;
  let lx = BASE_W / 2 - totalW / 2 + charW / 2;
  for (let i = 0; i < letters.length; i++) {
    const bob = Math.sin(t * 0.1 + i * 0.7) * 3;
    const ci = (i + Math.floor(t * 0.04)) % palette.length;
    ctx.shadowColor = palette[ci];
    ctx.shadowBlur = 8;
    ctx.fillStyle = palette[ci];
    ctx.fillText(letters[i], lx, 54 + bob);
    lx += charW;
  }
  ctx.restore();

  // Demo enemy flyby across the band between borders
  const flybyTypes = [drawBee, drawButterfly, drawBoss];
  for (let i = 0; i < 4; i++) {
    const cycle = 280;
    const phase = (t + i * 70) % cycle;
    const fx = (phase / cycle) * (BASE_W + 40) - 20;
    const fy = 100 + Math.sin(phase * 0.04 + i * 1.3) * 6;
    const fn = flybyTypes[i % flybyTypes.length];
    if (fn === drawBoss) fn(fx, fy, t >> 4, false);
    else fn(fx, fy, t >> 4);
  }

  // Score legend
  drawBee(BASE_W/2 - 50, 140, t >> 4);
  drawRetroText('= 50 PTS', BASE_W/2 + 10, 140, 8, COL.white, 'left');
  drawButterfly(BASE_W/2 - 50, 160, t >> 4);
  drawRetroText('= 80 PTS', BASE_W/2 + 10, 160, 8, COL.white, 'left');
  drawBoss(BASE_W/2 - 50, 182, t >> 4, false);
  drawRetroText('= 150 PTS', BASE_W/2 + 10, 182, 8, COL.white, 'left');

  if (game.titleBlink % 60 < 40) {
    const sCol = challengeModeRequested ? COL.red : dailyModeRequested ? COL.green : COL.cyan;
    drawRetroText('PRESS SPACE TO START', BASE_W/2, 190, 8, sCol);
  }
  // LAST RUN SUMMARY — small one-line previous run summary at bottom-center
  // so players can compare new attempts. Hidden when first ever run, or when
  // daily mode is showing its extras at the bottom (which reuse this slot).
  try {
    const _lrRaw = localStorage.getItem('galagaLastRun');
    if (_lrRaw && !callsignInput.active && !dailyModeRequested) {
      const _lr = JSON.parse(_lrRaw);
      if (_lr && _lr.stage > 0) {
        const _lrStr = 'LAST  S' + _lr.stage + '  ' + fmtScore(_lr.score) + '  C×' + _lr.combo;
        drawRetroText(_lrStr, BASE_W/2, BASE_H - 14, 4, '#555', 'center');
        if (_lr.wasPb) {
          const _pbB = (t >> 2) % 2 === 0 ? '#fc4' : '#ff8';
          // Gold glow on the PB star — matches the 10-peak-threshold GLOW
          // pattern so PB pride reads on TITLE without extra elements.
          ctx.save();
          ctx.shadowColor = '#fc4';
          ctx.shadowBlur = 4;
          drawRetroText('★ PB', BASE_W/2 + 60, BASE_H - 14, 4, _pbB, 'left');
          ctx.restore();
        }
      }
    }
  } catch (e) {}
  // INPUT DEVICE ICON — detect gamepad / touch / keyboard at draw time.
  // Small label corner-bottom-right. Defaults to KBD when no other signal.
  {
    let _dev = 'KBD';
    if ('ontouchstart' in window) _dev = 'TCH';
    try {
      if (navigator.getGamepads) {
        const _gps = navigator.getGamepads();
        for (const _gp of _gps) { if (_gp) { _dev = 'GPD'; break; } }
      }
    } catch (e) {}
    drawRetroText(_dev, BASE_W - 4, BASE_H - 4, 4, '#666', 'right');
  }
  // BGM TRACK PEEK — show current track id at bottom-left if active. Helps
  // confirm audio is wired correctly and surfaces variety for music nerds.
  if (typeof bgmTrack === 'string' && bgmTrack) {
    drawRetroText('♪ ' + bgmTrack.toUpperCase(), 4, BASE_H - 4, 4, '#555', 'left');
  }
  // TITLE TIPS ROTATION — bottom hint area cycles gameplay reminders every
  // 216 frames (3.6s). Hidden during callsign editor and in daily mode (daily
  // extras at y=266/272 reuse that slot).
  if (!callsignInput.active && !dailyModeRequested) {
    const _titleTips = [
      'SHIFT TO DASH',
      'DASH THRU BULLETS = PARRY',
      'DASH MANY BULLETS = CLUSTER PARRY',
      'CHAIN 5 KILLS = X1.5 SCORE',
      'GRAB S / N / P TO POWER UP',
      'BOSS EVERY 10 STAGES',
      'CHALLENGE STAGE EVERY 4',
      'FIRE SKIPS STAGE INTRO',
      'TAP FIRE TO STOP BONUS SLOTS',
      'AVENGE THE TYPE THAT KILLS YOU',
      'TAB FOR STATS',
      'P / ESC TO PAUSE',
      'U TO EDIT CALLSIGN'
    ];
    const _ttIdx = Math.floor(game.animFrame / 216) % _titleTips.length;
    const _ttLocal = (game.animFrame % 216);
    const _ttAlpha = _ttLocal < 30 ? _ttLocal / 30
                  : _ttLocal > 186 ? Math.max(0, 1 - (_ttLocal - 186) / 30)
                  : 1;
    ctx.save();
    ctx.globalAlpha = _ttAlpha * 0.65;
    drawRetroText(_titleTips[_ttIdx], BASE_W/2, 266, 4, '#888');
    ctx.restore();
  }
  // PILOT CALLSIGN — shown below the title, swaps to live editor when active.
  // Editor: 3 letter boxes, current slot highlighted + arrow hints.
  if (callsignInput.active) {
    drawRetroText('CALLSIGN', BASE_W/2, 220, 6, '#fc4');
    const cs = callsignInput.letters;
    const slotW = 12, gap = 4;
    const totalW = slotW * 3 + gap * 2;
    const startX = BASE_W/2 - totalW/2;
    for (let i = 0; i < 3; i++) {
      const bx = startX + i * (slotW + gap);
      const isCur = i === callsignInput.pos;
      // Slot frame
      ctx.fillStyle = isCur ? '#fc4' : '#fff';
      ctx.fillRect(bx, 226, slotW, 1);
      ctx.fillRect(bx, 226 + 11, slotW, 1);
      // Letter
      const flick = isCur && (game.animFrame >> 3) % 2 === 0;
      drawRetroText(cs[i], bx + slotW/2, 228, 9, flick ? '#fff' : (isCur ? '#fc4' : '#fff'));
    }
    drawRetroText('UP DN  L R   ENTER OK   ESC', BASE_W/2, 244, 5, COL.gray);
  } else {
    // PILOT line sits at y=208 between the mode-toggle row (y=200) and the
    // R:START STAGE conditional row (y=216). U CHANGE/O COLOR hint removed —
    // already cycles through the tips rotation at y=265.
    drawRetroText('PILOT [' + playerCallsign + ']', BASE_W/2, 208, 6, callsignColor());
    // TIME-OF-DAY GREETING — small in-world salutation tied to the player's local
    // clock. Cycles between four watch windows so the title feels live across
    // a day cycle. Drawn faded grey so it sits as marginal flavor.
    {
      // (Time-of-day greeting at y=238 removed — it landed inside the
      // 5 leaderboard rows at y=230-258 and overlapped row #3 text.
      // Greeting is already shown at top of screen at y=12.)
    }
  }
  // (First-time help nudge moved into the bottom controls hint to avoid overlapping top-score row 5)
  // Compact mode-toggle row: three small labels side-by-side at y=200 (size 5)
  {
    const cOn = challengeModeRequested;
    const dOn = dailyModeRequested;
    const cCol = cOn ? COL.red   : COL.gray;
    const dCol = dOn ? COL.green : COL.gray;
    const gCol = difficultyMode === 'hard' ? COL.red : difficultyMode === 'easy' ? COL.green : COL.cyan;
    // Append the daily-streak day count inline so it doesn't collide with PRESS SPACE.
    let dLabel;
    if (dOn) {
      let days = 0;
      try { days = JSON.parse(localStorage.getItem('galagaDailyDays') || '[]').length; } catch (e) {}
      dLabel = 'D:' + dailyLabel().slice(2) + (days > 0 ? '·' + days + 'D' : '');
    } else {
      dLabel = 'D:OFF';
    }
    drawRetroText(cOn ? 'C:CHAL'  : 'C:OFF',  BASE_W/2 - 56, 200, 5, cCol);
    drawRetroText(dLabel,                     BASE_W/2,      200, 5, dCol);
    drawRetroText('G:' + difficultyMode.slice(0, 4).toUpperCase(), BASE_W/2 + 56, 200, 5, gCol);
  }
  // Start-from-stage selector — only shown when at least one milestone has been cleared (compact, same row group)
  if (highestCheckpoint > 0) {
    const startCol = startStageRequested > 1 ? COL.yellow : COL.gray;
    drawRetroText('R:START STAGE ' + startStageRequested, BASE_W/2, 216, 4, startCol);
  }
  // Ship loadout indicator
  {
    const ship = shipAttrs();
    const tx = BASE_W/2 - 50, ty = 116;
    // Animated change pulse: scale ship + colored ring expanding outward
    if (shipChangeFrame > 0) {
      const t = 30 - shipChangeFrame;
      const scale = 1 + (1 - shipChangeFrame / 30) * 0.5 * (shipChangeFrame > 18 ? 1 : 0)
                  + (shipChangeFrame <= 18 ? Math.max(0, shipChangeFrame / 18) * 0.5 : 0);
      // Expanding ring
      ctx.save();
      ctx.globalAlpha = Math.max(0, shipChangeFrame / 30) * 0.7;
      ctx.strokeStyle = ship.color;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(tx, ty, 4 + t * 0.8, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(tx, ty, 4 + t * 1.4, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.translate(tx, ty);
      ctx.scale(scale, scale);
      drawPlayer(0, 0, ship.color);
      ctx.restore();
    } else {
      drawPlayer(tx, ty, ship.color);
    }
    // When daily mode is on, show LOCKED prefix and force-display the daily ship
    const lockedDaily = dailyModeRequested;
    const dailyShip = lockedDaily ? dailyShipFor(dailySeed()) : null;
    const showName = lockedDaily ? (SHIPS[dailyShip] ? SHIPS[dailyShip].name : ship.name) : ship.name;
    const labelPrefix = lockedDaily ? '[DAILY] ' : 'V  ';
    drawRetroText(labelPrefix + showName, BASE_W/2, ty, 7, lockedDaily ? COL.green : ship.color);
    // Stat tag — sourced from the SHIPS definition (single source of truth). In
    // daily mode the tag follows the locked daily ship so it matches the shown name.
    const _tagShip = (lockedDaily && SHIPS[dailyShip]) ? SHIPS[dailyShip] : ship;
    const tag = (_tagShip && _tagShip.tag) || 'BALANCED';
    drawRetroText(tag, BASE_W/2, 124, 5, COL.gray);
    // SHIP MASTERY — pull per-ship stats (kills/best stage). Cycles into view a second
    // after ship change so it doesn't clutter immediate ship-cycle feedback.
    try {
      const masteryRaw = localStorage.getItem('galagaShipMastery');
      const mastery = masteryRaw ? JSON.parse(masteryRaw) : {};
      const m = mastery[selectedShip];
      if (m && (m.runs || 0) > 0) {
        const masteryLine = 'MASTERY  ' + fmtScore(m.kills || 0) + ' KILLS  S' + (m.bestStage || 0);
        drawRetroText(masteryLine, BASE_W/2, 131, 5, '#fc4');
      }
    } catch (e) {}
  }

  // Top 5 scores — title shows whichever list matches the current toggle.
  // Hidden while editing the callsign (the editor's CALLSIGN label at y=220 +
  // letter slots at y=228 sit right on top of the TOP SCORES header at y=222 and
  // the score rows at y=230+, so the editor needs this space to itself).
  if (!callsignInput.active) {
  const showMode = dailyModeRequested ? 'daily'
                : challengeModeRequested ? 'challenge'
                : 'normal';
  const topHeader = showMode === 'daily'     ? 'TOP SCORES (DAILY)'
                  : showMode === 'challenge' ? 'TOP SCORES (CHALLENGE)'
                  : 'TOP SCORES';
  const topHeaderCol = showMode === 'daily' ? COL.green : COL.red;
  drawRetroText(topHeader, BASE_W/2, 222, 6, topHeaderCol);
  // DAILY MODIFIER preview — shows today's deterministic modifier so players know
  // what they're signing up for before pressing Start.
  if (dailyModeRequested) {
    // Daily extras live BELOW the score rows (which now end at y=258) and
    // replace the tips rotation slot. Two compact rows so no overlap with
    // mode toggles (y=200), PILOT (y=208), or TOP SCORES header (y=222).
    const seed = (typeof dailySeed === 'function' ? dailySeed() : 0) | 0;
    const dailyMod = STAGE_MUTATIONS[seed % STAGE_MUTATIONS.length];
    const streak = computeDailyStreak();
    if (streak >= 1) {
      const streakCol = streak >= 30 ? '#fc4' : streak >= 7 ? '#0f8' : '#cfc';
      drawRetroText('STREAK ' + streak + 'D', BASE_W/2 - 50, 266, 4, streakCol, 'center');
    }
    if (dailyMod) {
      const blink = (game.animFrame >> 3) % 2 === 0 ? dailyMod.color : '#fff';
      drawRetroText('TODAY ' + dailyMod.label, BASE_W/2 + 20, 266, 4, blink, 'center');
    }
    if (typeof dailySeedCode === 'function') {
      drawRetroText('SEED ' + dailySeedCode(), BASE_W/2 - 50, 272, 4, '#f6f', 'center');
    }
    if (typeof dailyMission === 'function') {
      const m = dailyMission();
      const done = (typeof isDailyMissionDoneToday === 'function') && isDailyMissionDoneToday();
      const mLabel = (done ? 'DONE ' : 'GOAL ') + m.label;
      const mCol = done ? '#0f8' : '#fc4';
      drawRetroText(mLabel, BASE_W/2 + 20, 272, 4, mCol, 'center');
    }
  }
  const topList = loadTopScores(showMode);
  const startY = 230;
  for (let i = 0; i < 5; i++) {
    const e = topList[i];
    const rowY = startY + i * 7;
    const rowCol = i === 0 ? COL.yellow : (i < 3 ? '#fff' : COL.gray);
    if (e) {
      // SELF HIGHLIGHT — if this entry's callsign matches the current pilot, draw
      // a soft yellow background band and a ▶ marker. Makes self-identification
      // immediate on the leaderboard.
      const isMine = e.callsign && e.callsign === playerCallsign;
      if (isMine) {
        ctx.save();
        ctx.globalAlpha = 0.18 + 0.08 * Math.sin(game.animFrame * 0.18);
        ctx.fillStyle = '#fc4';
        ctx.fillRect(BASE_W/2 - 72, rowY - 3, 152, 7);
        ctx.restore();
        // ▶ marker on the left
        drawRetroText('>', BASE_W/2 - 73, rowY, 6, '#fc4', 'left');
      }
      // Crown for #1 (red crown for challenge mode king)
      if (i === 0) drawCrown(BASE_W/2 - 70, rowY, showMode === 'daily' ? COL.green : showMode === 'challenge' ? COL.red : COL.yellow);
      drawRetroText('#' + (i + 1), BASE_W/2 - 62, rowY, 6, rowCol, 'left');
      // CALLSIGN — 3-letter monogram (or '???' for legacy entries pre-callsign system)
      const cs = e.callsign || '???';
      const csCol = cs === '???' ? COL.gray : (isMine ? '#ff4' : '#fc4');
      drawRetroText(cs, BASE_W/2 - 44, rowY, 6, csCol, 'left');
      drawRetroText(fmtScore(e.score), BASE_W/2 - 22, rowY, 6, rowCol, 'left');
      drawRetroText('S' + e.stage, BASE_W/2 + 26, rowY, 6, rowCol, 'left');
      if (typeof e.accuracy === 'number' && e.accuracy > 0) {
        drawRetroText(e.accuracy + '%', BASE_W/2 + 46, rowY, 6, rowCol, 'left');
      }
    } else {
      drawRetroText('#' + (i + 1), BASE_W/2 - 62, rowY, 6, rowCol, 'left');
      drawRetroText('---', BASE_W/2 - 22, rowY, 6, rowCol, 'left');
    }
  }
  } // end !callsignInput.active (TOP SCORES block)

  // Controls hint (two compact lines at the bottom)
  drawRetroText('ARROWS MOVE   SPACE FIRE', BASE_W/2, BASE_H - 14, 6, COL.gray);
  // First-time players get a brighter color on the H/I keys in this row to draw the eye
  const firstTime = (unlockedAchievements ? unlockedAchievements.size : 0) === 0;
  drawRetroText('P PAUSE  H HELP  I STATS  M MUTE', BASE_W/2, BASE_H - 6, 6, firstTime ? COL.cyan : COL.gray);
  // Gamepad connection indicator (small green dot bottom-right) — pulses
  if (navigator.getGamepads) {
    const pads = navigator.getGamepads();
    let connected = false;
    for (const p of pads) if (p) { connected = true; break; }
    if (connected) {
      const blink = (game.animFrame >> 5) % 2 === 0;
      ctx.fillStyle = blink ? COL.green : '#080';
      ctx.fillRect(BASE_W - 30, BASE_H - 22, 2, 2);
      drawRetroText('GP', BASE_W - 16, BASE_H - 22, 5, '#888', 'right');
    }
  }
  // Tiny build/version mark + total achievements unlocked indicator
  drawRetroText('GAM-42', BASE_W - 4, BASE_H - 22, 5, '#446', 'right');
  const ach = unlockedAchievements ? unlockedAchievements.size : 0;
  const total = Object.keys(ACHIEVEMENTS).length;
  drawRetroText('ACH ' + ach + '/' + total, 4, BASE_H - 22, 5, '#446', 'left');
  // Setting-change toasts (DIFFICULTY / SHAKE / RUMBLE / COLORBLIND / etc.) — visible feedback
  // when the player toggles a global setting from the title screen.
  if (game.floatTexts) for (const ft of game.floatTexts) drawFloatText(ft);
}

// Boss name table — adds identity to each milestone boss. Cycles with `% length` so
// stages beyond the table reuse names instead of crashing or showing 'undefined'.
const BOSS_NAMES = [
  'THE OVERSEER',     // 10
  'TWIN SOVEREIGNS',  // 20 (double)
  'APEX',             // 30 (super)
  'THE DEVOURER',     // 40
  'IRON SWARM',       // 50 (super or double)
  'NULLIFIER',        // 60

];
function bossNameFor(stage) {
  const idx = Math.floor(stage / BOSS_STAGE_INTERVAL) - 1;
  if (idx < 0) return 'BOSS';
  return BOSS_NAMES[idx % BOSS_NAMES.length];
}

// Trigger a taunt — sets the boss-scoped speech state. Cooldown 90 frames before
// the NEXT taunt fires so phase2 + lowHp consecutive triggers don't stack.
function triggerBossTaunt(mb, situation) {
  if (!mb || !mb.alive) return;
  if ((mb.tauntCooldown || 0) > 0) return;
  const text = tauntFor(mb.archetype, situation);
  if (!text) return;
  mb.tauntText = text;
  mb.tauntLife = 90;        // ~1.5s display
  mb.tauntMax  = 90;
  mb.tauntCooldown = 60;    // cool down before next taunt
}

// RUN HIGHLIGHTS — produce up to 3 "best moments" lines summarizing the run.
// Candidates are scored by impressiveness; top 3 picked for compact display.
// All values come from stats already tracked elsewhere — no new bookkeeping needed.
// RUN TITLE — a one-line epithet earned from this run's dominant playstyle, shown
// in the GAME_OVER epitaph header so each run gets a memorable identity ("how you
// flew") on top of the death-tier epitaph ("how you fell"). Priority order runs
// rarest/most-distinctive first. Pure read of existing run stats; no score impact.
function pickRunTitle() {
  if (!game) return 'THE PILOT';
  const s = game.stats || {};
  const acc = (s.shotsFired || 0) > 50 ? Math.round((s.shotsHit / s.shotsFired) * 100) : 0;
  if ((game.runFlawlessBosses || 0) >= 1)   return 'THE SURGEON';
  if ((game.bossKills || 0) >= 3)            return 'THE SLAYER';
  if ((game.clusterParryBest || 0) >= 5)     return 'THE STORM-DANCER';
  if ((game.witchSaves || 0) >= 3)           return 'THE TIME-BENDER';
  if ((game.parryCount || 0) >= 15)          return 'THE DEFLECTOR';
  if ((game.comboBest || 0) >= 30)           return 'THE CHAINMASTER';
  if ((game.nearMissChainBest || 0) >= 8)    return 'THE GHOSTWALKER';
  if ((game.revengeCount || 0) >= 3)         return 'THE AVENGER';
  if ((game.eliteKills || 0) >= 5)           return 'THE ELITE HUNTER';
  if (acc >= 90)                             return 'THE MARKSMAN';
  if ((s.maxStage || 0) >= 30)               return 'THE VOIDWALKER';
  if (game.dualFighter)                      return 'THE TWIN-WING';
  if ((s.maxStage || 0) >= 10)               return 'THE VETERAN';
  return 'THE PILOT';
}
function pickRunHighlights() {
  const out = [];
  const s = game.stats || {};
  const acc = (s.shotsFired || 0) === 0 ? 0 : Math.round((s.shotsHit / s.shotsFired) * 100);
  const cBest = game.comboBest || 0;
  const parries = game.parryCount || 0;
  const bosses = game.bossKills || 0;
  const stages = s.maxStage || 0;
  const rescues = game.selfRescueCount || 0;
  const dual = !!game.dualFighter;

  const elites = game.eliteKills || 0;

  if (cBest >= 5)         out.push({ label: 'MAX COMBO',     value: String(cBest),       prio: cBest * 4, col: '#0ff' });
  if (parries >= 3)       out.push({ label: 'BULLETS PARRIED', value: String(parries),  prio: parries * 6, col: '#0ff' });
  // NEAR MISS HIGHLIGHT — surfaces the passive-evasion skill stat (counted in
  // updateCollisions when an enemy bullet grazes the safety margin). White by
  // default, cyan once the run hits the EVASION SPECIALIST intercept threshold
  // (25) so visual matches the in-run beat.
  const nmRun = game.nearMissCount || 0;
  if (nmRun >= 10)        out.push({ label: 'NEAR MISSES',   value: String(nmRun),       prio: nmRun * 8, col: nmRun >= 25 ? '#0ff' : '#fff' });
  // GRAZE CHAIN MAX — peak consecutive near-misses within the 90f decay window.
  // Distinct from total NEAR MISSES count (which is cumulative). Threshold 3+
  // (matches the in-run floattext threshold) so single grazes don't surface.
  const nmcBest = game.nearMissChainBest || 0;
  if (nmcBest >= 3)       out.push({ label: 'GRAZE CHAIN MAX', value: 'x' + nmcBest,    prio: nmcBest * 15, col: '#0ff' });
  // CLEAN STREAK MAX — peak consecutive no-death stages this run. Distinct
  // from total UNTOUCHED count (already separately surfaced). Green to match
  // the safe-state PB convention.
  const csBest = game.cleanStreakBest || 0;
  if (csBest >= 3)        out.push({ label: 'CLEAN STREAK MAX', value: 'x' + csBest,    prio: csBest * 18, col: '#0f8' });
  // REVENGE — count of collision-death payback kills this run. Pairs narratively
  // with DEATH RECAP WHISPER. Red color matches the in-stage REVENGE! floattext.
  const _rvR = game.revengeCount || 0;
  if (_rvR >= 1)          out.push({ label: 'REVENGE',         value: String(_rvR),     prio: _rvR * 14, col: '#f44' });
  // CLUSTER PARRY MAX — most bullets deflected in one dash frame. High-skill
  // dive-into-fire stat. Gold to match the in-stage CLUSTER PARRY banner.
  const _cpBest = game.clusterParryBest || 0;
  if (_cpBest >= 3)       out.push({ label: 'CLUSTER PARRY',   value: 'x' + _cpBest,    prio: _cpBest * 16, col: '#fc4' });
  // FLAWLESS BOSS — boss stages cleared without taking a hit this run. High-skill
  // clean-execution stat; gold to match the in-stage FLAWLESS KILL banner.
  const _fbR = game.runFlawlessBosses || 0;
  if (_fbR >= 1)          out.push({ label: 'FLAWLESS BOSS',   value: String(_fbR),     prio: _fbR * 45, col: '#fc4' });
  const parryBest = game.parryStreakBest || 0;
  if (parryBest >= 3)     out.push({ label: 'PARRY CHAIN MAX', value: 'x' + parryBest,   prio: parryBest * 10, col: '#0cf' });
  // ECHO HITS — number of perfect-parry echo bullets that landed on enemies.
  // Surface payoff of the parry→echo→land skill chain (PARRY ECHO HIT cinematic).
  const pEcho = game.parryEchoLandings || 0;
  if (pEcho >= 3)         out.push({ label: 'ECHO HITS',    value: String(pEcho),         prio: pEcho * 14, col: '#0ff' });
  // WITCH SAVES HIGHLIGHT — defensive skill stat. Witch save = dash within the
  // 30-frame slow window saved the player from a fatal hit. Rare and hard;
  // priority 18/save reflects skill expression weight. Purple matches witch
  // time visual color.
  const wSaves = game.witchSaves || 0;
  if (wSaves >= 2)        out.push({ label: 'WITCH SAVES',   value: String(wSaves),       prio: wSaves * 18, col: '#a8f' });
  // BOMBS USED HIGHLIGHT — strategic resource stat. Each bomb is a panic tool
  // (clears bullets, damages all). Surface count shows how often the player
  // leaned on it. Threshold 2+ filters single-use noise.
  const bU = (game.stats && game.stats.bombsUsed) || 0;
  if (bU >= 2)            out.push({ label: 'BOMBS USED',   value: String(bU),            prio: bU * 12, col: '#f44' });
  // PB BEATS HIGHLIGHT — count of stages whose PB was beaten this run. Pure
  // speedrun skill stat; green to match the PB-beat color convention.
  const pbBeats = game.runPBBeats || 0;
  if (pbBeats >= 2)       out.push({ label: 'PB BEATS',     value: String(pbBeats),       prio: pbBeats * 15, col: '#0f8' });
  const aceBest = game.aceStreakBest || 0;
  if (aceBest >= 3)       out.push({ label: 'ACE STREAK MAX', value: 'x' + aceBest,      prio: aceBest * 15, col: '#fc4' });
  const mkBest = game.multiKillBest || 0;
  if (mkBest >= 3)        out.push({ label: 'MULTIKILL MAX', value: 'x' + mkBest,        prio: mkBest * 20, col: '#fc4' });
  const pwRun = game.perfectWavesRun || 0;
  if (pwRun >= 1)         out.push({ label: 'PERFECT WAVES', value: String(pwRun),       prio: pwRun * 12, col: '#fc4' });
  const ckRun = game.critKillsRun || 0;
  if (ckRun >= 5)         out.push({ label: 'CRIT KILLS',    value: String(ckRun),       prio: ckRun * 5, col: '#fc4' });
  if (elites >= 1)        out.push({ label: 'ELITES SLAIN',  value: String(elites),       prio: elites * 18, col: '#f44' });
  const sGr = game.runSGrades || 0;
  if (sGr >= 1)           out.push({ label: 'S GRADES',      value: '★ ' + sGr,           prio: sGr * 40, col: '#fc4' });
  const untRun = game.runUntouched || 0;
  if (untRun >= 1)        out.push({ label: 'UNTOUCHED',     value: String(untRun),       prio: untRun * 28, col: '#0ff' });
  const lsRun = game.runLastStands || 0;
  if (lsRun >= 1)         out.push({ label: 'LAST STANDS',   value: String(lsRun),        prio: lsRun * 35, col: '#f44' });
  const ppRun = game.perfectParries || 0;
  if (ppRun >= 1)         out.push({ label: 'PERFECT PARRY', value: String(ppRun),        prio: ppRun * 22, col: '#fc4' });
  // PICKUP FAVORITE — most-collected powerup type this run (needs >= 3 of it)
  if (game.pickupTypesRun) {
    let _favT = null, _favC = 0;
    for (const _k in game.pickupTypesRun) {
      const _v = game.pickupTypesRun[_k] || 0;
      if (_v > _favC) { _favC = _v; _favT = _k; }
    }
    if (_favT && _favC >= 3) {
      const _favLbl = { S:'SHOT', N:'NUKE', P:'PIERCE', T:'SLOW', R:'RAPID',
                        W:'WAVE', H:'HOMING', L:'LASER', B:'BOMB', E:'SHIELD' }[_favT] || _favT;
      const _favCol = { S:'#0df', N:'#1e6', P:'#e3e', T:'#5af', R:'#fc4',
                        W:'#f6a', H:'#0cf', L:'#f6c', B:'#f44', E:'#4f8' }[_favT] || '#fff';
      out.push({ label: 'FAVORITE', value: _favLbl + ' x' + _favC, prio: 65, col: _favCol });
    }
  }
  if (stages >= 3)        out.push({ label: 'STAGES CLEARED', value: String(stages),     prio: stages * 8, col: '#fc4' });
  if (bosses >= 1)        out.push({ label: 'BOSSES DOWN',    value: String(bosses),     prio: bosses * 60, col: '#f8a' });
  if (rescues >= 1)       out.push({ label: 'SELF RESCUE',    value: String(rescues),    prio: rescues * 30, col: '#fc4' });
  if (dual)               out.push({ label: 'DUAL FIGHTER',   value: 'GAINED',           prio: 70, col: '#ff4' });
  if (acc >= 70 && (s.shotsFired || 0) > 50) {
    out.push({ label: 'ACCURACY',    value: acc + '%',                                     prio: acc, col: acc >= 90 ? '#0f8' : '#0ff' });
  }
  // DAILY STREAK — only meaningful when playing daily mode
  if (game.dailyMode) {
    const streak = computeDailyStreak();
    if (streak >= 2) {
      out.push({ label: 'DAILY STREAK',  value: streak + ' DAYS', prio: streak * 10 + 25, col: streak >= 7 ? '#0f8' : '#cfc' });
    }
  }
  // Top 3 by prio. Stable sort fallback: insertion order preserved when prio equal.
  out.sort((a, b) => b.prio - a.prio);
  return out.slice(0, 3);
}

function drawStageIntro() {
  // STAGE INTRO WARP — first 30 frames of intro draws radial hyperspace streaks
  // from screen center outward. Reads as cinematic transition between stages.
  // Color picked from biome for cohesion (or default cyan).
  const introElapsed = 120 - game.stageTimer;
  // TIME-OF-DAY ACCENT — top thin band tinted by real-world hour phase, so
  // each intro carries the day's mood. Subtle so it stays under stage-type
  // tint and warp.
  {
    const _hr = new Date().getHours();
    let _todCol = null;
    if (_hr < 5)       _todCol = '#48f';       // late night
    else if (_hr < 9)  _todCol = '#fc8';       // morning
    else if (_hr < 17) _todCol = '#0cf';       // afternoon

        drawRetroText('PB ' + fmtFrameTime(_pbF2), BASE_W - 4, BASE_H/2 + 25, 4, '#0cf', 'right');
      } else {
        drawRetroText('NO PB YET', BASE_W - 4, BASE_H/2 + 25, 4, '#888', 'right');
      }
    }
    // Previous stage clear time — reflection point. Surfaced under PB row.
    // Green when the prior clear beat its PB, gray otherwise; matches the
    // STAGE TIME CLOCK ahead/behind color convention. Appends '(-N.Ns)' delta
    // on PB-beat clears so the player sees the improvement margin.
    if ((game.lastStageFrames || 0) > 0 && typeof fmtFrameTime === 'function') {
      const _prvCol = game.lastStagePBBeat ? '#0f8' : '#888';
      const _prvTxt = 'PRV ' + fmtFrameTime(game.lastStageFrames);
      const _prvSfx = game.lastStagePBBeat && (game.lastStagePBDelta || 0) > 0
        ? ' (-' + (game.lastStagePBDelta / 60).toFixed(1) + 's)'
        : '';
      drawRetroText(_prvTxt + _prvSfx,
                    BASE_W - 4, BASE_H/2 + 32, 4, _prvCol, 'right');
    }
  }
  // CHALLENGING STAGE MISSION BRIEF — for challenge intros, replace generic
  // stat columns with a tactical briefing panel: wave count, unit total,
  // objective line, and an 8-pip sequential wave preview.
  if (slide >= 1 && isChallenge) {
    const _gs = 8 + (game.stage >= 40 ? 2 : game.stage >= 20 ? 1 : 0);
    const _totalUnits = _gs * 2 * 8;
    const _numWaves = 8;
    const _t = game.animFrame;
    const briefW = 140, briefH = 82;
    const bx = Math.round((BASE_W - briefW) / 2);
    const by = Math.round(BASE_H / 2 + 18);
    const fadeIn = Math.min(1, Math.max(0, (introElapsed - 28) / 22));
    ctx.save();
    ctx.globalAlpha = fadeIn;
    // Panel background
    ctx.fillStyle = 'rgba(16,0,32,0.82)';
    ctx.fillRect(bx, by, briefW, briefH);
    // Magenta corner accents
    ctx.fillStyle = '#f6f';
    const _co = 4;
    ctx.fillRect(bx, by, _co, 1);          ctx.fillRect(bx, by, 1, _co);
    ctx.fillRect(bx + briefW - _co, by, _co, 1); ctx.fillRect(bx + briefW - 1, by, 1, _co);
    ctx.fillRect(bx, by + briefH - 1, _co, 1);   ctx.fillRect(bx, by + briefH - _co, 1, _co);
    ctx.fillRect(bx + briefW - _co, by + briefH - 1, _co, 1);
    ctx.fillRect(bx + briefW - 1, by + briefH - _co, 1, _co);
    // Header
    ctx.save();
    ctx.shadowColor = '#f6f'; ctx.shadowBlur = 6;
    drawRetroText('CHALLENGE BRIEF', BASE_W / 2, by + 9, 6, '#f6f');
    ctx.restore();
    // Separator
    ctx.globalAlpha = 0.28 * fadeIn;
    ctx.fillStyle = '#f6f';
    ctx.fillRect(bx + 12, by + 15, briefW - 24, 1);
    ctx.globalAlpha = fadeIn;
    // Info rows
    let _bry = by + 23;
    const _bRowGap = 9;
    const _bRow = (lbl, val, vCol) => {
      drawRetroText(lbl, bx + 14, _bry, 5, '#777', 'left');
      drawRetroText(val, bx + briefW - 14, _bry, 5, vCol || '#fff', 'right');
      _bry += _bRowGap;
    };
    _bRow('WAVES',  String(_numWaves),        '#f6f');
    _bRow('UNITS',  _totalUnits + ' TOTAL',   '#0cf');
    _bRow('REWARD', 'PERFECT BONUS',          '#fc4');
    // Mid separator
    ctx.globalAlpha = 0.22 * fadeIn;
    ctx.fillStyle = '#f6f';
    ctx.fillRect(bx + 12, _bry - 3, briefW - 24, 1);
    ctx.globalAlpha = fadeIn;
    // Objective (blinking)
    const _objBlink = ((_t >> 3) % 2 === 0);
    ctx.globalAlpha = (_objBlink ? 0.92 : 0.48) * fadeIn;
    drawRetroText('DESTROY ALL · ZERO ESCAPES', BASE_W / 2, _bry + 4, 4, '#f6f');
    ctx.globalAlpha = fadeIn;
    // 8-pip sequential reveal: lights up one pip every ~3 frames after fadeIn starts
    const _pipY = by + briefH - 9;
    const _pipSp = 6;
    const _pipPX = Math.round(BASE_W / 2 - (_numWaves - 1) * _pipSp / 2);
    for (let pi = 0; pi < _numWaves; pi++) {
      const lit = pi <= Math.floor(Math.max(0, introElapsed - 28) * 0.32);
      ctx.fillStyle = lit ? '#f6f' : '#333';
      ctx.globalAlpha = (lit ? 0.75 : 0.22) * fadeIn;
      ctx.fillRect(_pipPX + pi * _pipSp - 1, _pipY, 2, 2);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  // RUN QUICK STATS — single-line summary of in-progress run shown at stage 2+.
  // Combo / Score / Accuracy. Score-neutral context for player decisions.
  if (slide >= 1 && game.stage >= 2 && !isBoss && !isChallenge) {
    const _sc = game.score || 0;
    const _cb = game.comboBest || 0;
    const _accNum = (game.stats && game.stats.shotsFired)
      ? Math.round((game.stats.shotsHit / game.stats.shotsFired) * 100) : 0;
    const _scStr = _sc >= 1000 ? Math.round(_sc / 1000) + 'K' : String(_sc);
    const _runLine = 'RUN  C×' + _cb + '  ' + _scStr + 'PT  ' + _accNum + '%';
    ctx.save();
    ctx.globalAlpha = 0.7;
    drawRetroText(_runLine, BASE_W/2, BASE_H/2 + 32, 4, '#aaa');
    ctx.restore();
  }
  // ADAPTIVE TIP — surface skill hint based on first matching weakness check
  if (slide >= 1 && !isBoss && !isChallenge && typeof STAGE_TIPS !== 'undefined' && introElapsed > 60) {
    let _tip = null;
    for (const t of STAGE_TIPS) {
      try { if (t.check(game)) { _tip = t.tip; break; } } catch (e) {}
    }
    if (_tip) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, (introElapsed - 60) / 18) * 0.85;
      drawRetroText(_tip, BASE_W/2 + offX, BASE_H/2 + 22, 4, '#0cf');
      ctx.restore();
    }
  }

  // BOSS INTRO CINEMATIC — full-screen dramatic reveal replacing the generic
  // stat panel. Dark vignette + large boss name + archetype class + intro taunt
  // + segmented HP bar. Gives each boss encounter its own identity.
  if (isBoss && slide >= 1) {
    const _t = game.animFrame;
    // Dark overlay — deepen the scene, cut noise from background stars
    ctx.save();
    ctx.fillStyle = '#000';
    ctx.globalAlpha = 0.55 + 0.08 * Math.sin(_t * 0.07);
    ctx.fillRect(0, 0, BASE_W, BASE_H);
    ctx.restore();
    // Slow red scan-sweep (top → bottom, cycles every 4 sec)
    {
      const sp = (_t % 240) / 240;
      if (sp < 0.72) {
        ctx.save();
        ctx.globalAlpha = 0.10;
        ctx.fillStyle = '#f44';
        ctx.fillRect(0, Math.round(sp / 0.72 * BASE_H) - 1, BASE_W, 2);
        ctx.restore();
      }
    }
    // Glitch bar (sparse, flickers)
    if ((_t & 7) === 0) {
      ctx.save();
      ctx.globalAlpha = 0.20;
      ctx.fillStyle = '#f44';
      ctx.fillRect(0, 28 + (_t * 41) % (BASE_H - 56), BASE_W, 1);
      ctx.restore();
    }
    // Boss silhouette — large, centered, ghostly
    ctx.save();
    ctx.globalAlpha = 0.18 + 0.07 * Math.sin(_t * 0.05);
    ctx.translate(BASE_W / 2, BASE_H / 2 - 18);
    ctx.scale(2.6, 2.6);
    drawMegaBoss(0, 0, _t >> 3, false);
    ctx.restore();
    // "BOSS INCOMING" flash at very top
    {
      const _wf = (_t >> 2) % 2 === 0;
      ctx.save();
      ctx.globalAlpha = _wf ? 0.85 : 0.35;
      drawRetroText('!! BOSS INCOMING !!', BASE_W / 2 + offX, 18, 7, '#f44');
      ctx.restore();
    }
    // Boss name — large gold glow
    ctx.save();
    ctx.shadowColor = '#f84';
    ctx.shadowBlur  = 12 + 5 * Math.sin(_t * 0.1);
    drawRetroText(bossNameFor(game.stage), BASE_W / 2 + offX, BASE_H / 2 - 10, 14, '#fc4');
    ctx.restore();
    // Archetype class line
    if (typeof archetypeFor === 'function') {
      const _arch = archetypeFor(game.stage);
      const _aLab = _arch === 'horned'  ? '— HORNED CLASS —'
                  : _arch === 'tendril' ? '— TENDRIL CLASS —'
                  : _arch === 'crystal' ? '— CRYSTAL CLASS —'
                  : _arch === 'phantom' ? '— PHANTOM CLASS —'
                  : _arch === 'rune'    ? '— RUNE CLASS —'
                  : '— STANDARD CLASS —';
      const _aCol = _arch === 'horned'  ? '#f86'
                  : _arch === 'tendril' ? '#8af'
                  : _arch === 'crystal' ? '#cef'
                  : _arch === 'phantom' ? '#a8f'
                  : _arch === 'rune'    ? '#a4f'
                  : '#f84';
      drawRetroText(_aLab, BASE_W / 2 + offX, BASE_H / 2 + 4, 6, _aCol);
      // Boss intro taunt (fades in after 30 frames)
      if (introElapsed > 30) {
        const _taunt = tauntFor(_arch, 'intro');
        if (_taunt) {
          ctx.save();
          ctx.globalAlpha = Math.min(1, (introElapsed - 30) / 20) * 0.75;
          drawRetroText('"' + _taunt + '"', BASE_W / 2 + offX, BASE_H / 2 + 15, 4, '#f88');
          ctx.restore();
        }
      }
    }
    // HP segmented bar
    {
      const _s = game.stage;
      const _bHp = 20 + _s * 3;
      const _hp  = _s >= 30 ? Math.round(_bHp * 2.5) : _s >= 20 ? Math.round(_bHp * 0.65) * 2 : _bHp;
      drawRetroText('HP ' + _hp, BASE_W / 2 + offX, BASE_H / 2 + 28, 5, '#f88');
      const _bw = 88, _bx = BASE_W / 2 - _bw / 2, _by = BASE_H / 2 + 34;
      ctx.save();
      ctx.fillStyle = '#300'; ctx.fillRect(_bx, _by, _bw, 3);
      const _segs = Math.min(10, Math.ceil(_hp / Math.max(1, Math.ceil(_hp / 10))));
      const _sw   = Math.floor(_bw / _segs);
      for (let _i = 0; _i < _segs; _i++) {
        ctx.globalAlpha = 0.7 + 0.2 * Math.sin(_t * 0.12 + _i * 0.6);
        ctx.fillStyle   = _i < _segs * 0.4 ? '#0f4' : _i < _segs * 0.7 ? '#fc4' : '#f44';
        ctx.fillRect(_bx + _i * _sw + 1, _by, _sw - 1, 3);
      }
      ctx.restore();
    }
    // Enemy count label
    {
      const _cLab = game.stage >= 30 ? '1 SUPER BOSS' : game.stage >= 20 ? '2 BOSSES' : '1 BOSS';
      drawRetroText(_cLab, BASE_W / 2 + offX, BASE_H / 2 + 44, 6, COL.red);
    }
  }

  // Enemy count + biome preview + PB — boss stages handled by cinematic above
  if (slide >= 1 && !isBoss) {
    // Count label — moved BELOW the banner panel (no overlap with stage label)
    const countLabel = isChallenge ? '8 WAVES' : '~40 ENEMIES';
    const countCol = isChallenge ? '#f6f' : COL.cyan;
    drawRetroText(countLabel, BASE_W/2 + offX, BASE_H/2 + 16, 6, countCol);
    // Challenge wave pips — below count label
    if (isChallenge) {
      ctx.save();
      ctx.fillStyle = '#f6f';
      const _sp = 5, _startX = BASE_W/2 + offX - 3 * _sp;
      for (let i = 0; i < 8; i++) {
        ctx.globalAlpha = 0.55 + 0.25 * Math.sin(game.animFrame * 0.12 + i * 0.5);
        ctx.fillRect(Math.round(_startX + i * _sp) - 1, BASE_H/2 + 24, 2, 2);
      }
      ctx.restore();
    }
    // Mutation banner — clear space below the panel (PB info is in right stat column)
    if (game.stageMutation) {
      const m = game.stageMutation;
      const blink = (game.animFrame >> 2) % 2 === 0 ? m.color : '#fff';
      drawRetroText('* ' + m.label + ' *', BASE_W/2 + offX, BASE_H/2 + 16, 8, blink);
      drawRetroText(m.desc, BASE_W/2 + offX, BASE_H/2 + 26, 5, '#fff');
    }
  }

  // TRANSMISSION LOG — narrative beat for milestone-tier stages. Drawn after the
  // banner slide-in so player sees stage label first, then the world reveals itself.
  // Typewriter reveal: each character appears every frame (was 2 — caused most
  // transmissions to be cut off before stage start since logs run ~90 chars and
  // available frames after slide-in were ~90). Now charsPer=1 fits ~90 chars
  // within the 120-frame intro window.
  const log = TRANSMISSION_LOGS[game.stage];
  if (log && slide >= 1) {
    const tStart = 20;                         // begin reveal sooner — more frames for text
    const charsPer = 1;                        // ~60 chars/sec, fits within 120-frame intro
    const fullChars = log.reduce((s, line) => s + line.length, 0) + log.length;
    const revealed = Math.max(0, Math.min(fullChars, Math.floor((elapsed - tStart) / charsPer)));
    if (revealed > 0) {
      // Panel position: top-left, leaving room for stage label / boss intro center
      const lx = 8, ly = 100;
      const panelW = BASE_W - 16, panelH = 28;
      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = '#020';
      ctx.fillRect(lx, ly, panelW, panelH);
      ctx.fillStyle = '#0f8';
      ctx.fillRect(lx, ly, panelW, 1);
      ctx.fillRect(lx, ly + panelH - 1, panelW, 1);
      ctx.fillRect(lx, ly, 1, panelH);
      ctx.fillRect(lx + panelW - 1, ly, 1, panelH);
      // Blinking cursor at the right end of the reveal frontier
      ctx.restore();
      let charBudget = revealed;
      for (let i = 0; i < log.length; i++) {
        const lineFull = log[i];
        const showLen = Math.min(lineFull.length, charBudget);
        if (showLen > 0) {
          const partial = lineFull.slice(0, showLen);
          const lineCol = i === 0 ? '#fc4' : '#cfc'; // header gold, body soft green
          drawRetroText(partial, lx + 4, ly + 4 + i * 8, 5, lineCol, 'left');
        }
        charBudget -= lineFull.length + 1; // +1 for inter-line spacing
        if (charBudget < 0) break;
      }
      // Cursor blink at end of last revealed line
      if ((game.animFrame >> 2) % 2 === 0 && revealed < fullChars) {
        // Find current line for cursor position
        let cursorLine = 0, cursorCol = 0, used = 0;
        for (let i = 0; i < log.length; i++) {
          const ln = log[i].length + 1;
          if (used + ln > revealed) {
            cursorLine = i;
            cursorCol = revealed - used;
            break;
          }
          used += ln;
        }
        const cx = lx + 4 + cursorCol * 5; // approx 5px/char at size 5
        const cy = ly + 4 + cursorLine * 8;
        ctx.fillStyle = '#0f8';
        ctx.fillRect(cx, cy, 3, 5);
      }
    }
  }

  // SYNERGY DISTANCE HINT — show OVERLOAD/BLINK/HEAVY distance when no synergy
  // is active. Helps the player prioritize pickups (e.g., "OVERLOAD: +1 N").
  if (slide >= 1 && game.lvl && !game.activeSynergy) {
    const lvS = game.lvl.S || 1, lvN = game.lvl.N || 1, lvP = game.lvl.P || 1;
    // Compute distances; only show if very close (need ≤2 total upgrades)
    const distOverload = Math.max(0, 5 - lvS) + Math.max(0, 3 - lvN) + Math.max(0, 3 - lvP);
    const distBlink    = Math.max(0, 5 - lvS) + Math.max(0, lvN - 1) + Math.max(0, lvP - 1);
    const distHeavy    = Math.max(0, lvS - 1) + Math.max(0, lvN - 1) + Math.max(0, 3 - lvP);
    let closest = null, closeName = '', closeDist = 99;
    if (distOverload < closeDist) { closest = 'OVERLOAD'; closeDist = distOverload; closeName = 'OVERLOAD'; }
    if (distBlink < closeDist)    { closest = 'BLINK';    closeDist = distBlink;    closeName = 'BLINK'; }
    if (distHeavy < closeDist)    { closest = 'HEAVY';    closeDist = distHeavy;    closeName = 'HEAVY'; }
    if (closest && closeDist > 0 && closeDist <= 2) {
      const sCol = closest === 'OVERLOAD' ? '#fc4' : closest === 'BLINK' ? '#0ff' : '#f8a';
      drawRetroText(closeName + ' IN ' + closeDist + ' MORE', BASE_W/2, BASE_H - 52, 4, sCol);
    }
  }

  // POWER CARRY-OVER — small S/N/P readout + active WEAPON SYNERGY label so the
  // player can plan pickup priorities for the new stage from the intro alone.
  // Drawn above the pilot quote band, fades in with same slide timing.
  if (slide >= 1 && game.lvl) {
    const lvS = game.lvl.S || 1, lvN = game.lvl.N || 1, lvP = game.lvl.P || 1;
    const synergyLabel = game.activeSynergy
                       ? game.activeSynergy
                       : null;
    const synergyCol = synergyLabel === 'OVERLOAD' ? '#fc4'
                     : synergyLabel === 'BLINK'    ? '#0ff'
                     : synergyLabel === 'HEAVY'    ? '#f8a' : '#888';
    const pcY = BASE_H - 44;
    drawRetroText('POWER', BASE_W/2 - 36, pcY, 5, '#888', 'left');
    // S / N / P with type-specific colors. MAX cap: gold pulse on letter.
    const _sMax = lvS >= MAX_POWER_LVL.S, _nMax = lvN >= MAX_POWER_LVL.N, _pMax = lvP >= MAX_POWER_LVL.P;
    const _maxPulse = (game.animFrame >> 3) % 2 === 0 ? '#fc4' : '#fff';
    drawRetroText('S' + lvS, BASE_W/2 - 10, pcY, 6, _sMax ? _maxPulse : '#f44', 'left');
    drawRetroText('N' + lvN, BASE_W/2 + 4,  pcY, 6, _nMax ? _maxPulse : '#0ff', 'left');
    drawRetroText('P' + lvP, BASE_W/2 + 18, pcY, 6, _pMax ? _maxPulse : '#f6f', 'left');
    // POWER MAX INDICATOR — small "MAX" label when all three caps reached
    if (_sMax && _nMax && _pMax) {
      const _mxBlink = (game.animFrame >> 2) % 2 === 0 ? '#fc4' : '#fff';
      drawRetroText('MAX', BASE_W/2 + 33, pcY, 5, _mxBlink, 'left');
    }
    if (synergyLabel) {
      const synBlink = (game.animFrame >> 2) % 2 === 0 ? synergyCol : '#fff';
      drawRetroText(synergyLabel + ' BUILD', BASE_W/2, pcY + 7, 5, synBlink);
    }
  }

  // STAGE 100+ ENDLESS BANNER — major milestone in endless mode. Stage 100/150/200
  // get a special "ENDLESS LEGEND" gold blink at top so the player knows they
  // crossed a marathon threshold beyond the canonical 80-stage arc.
  if (slide >= 1 && (game.stage === 100 || game.stage === 150 || game.stage === 200)) {
    const eb = (game.animFrame >> 2) % 2 === 0;
    drawRetroText('★ ENDLESS LEGEND ★', BASE_W/2, 18, 7, eb ? '#fc4' : '#fff');
    drawRetroText('STAGE ' + game.stage, BASE_W/2, 27, 5, '#888');
  }

  // BOSS APPROACH WARNING — when this stage's clear will be followed by a boss
  // stage, paint a small red 'BOSS NEXT' tag near the bottom-center of the intro.
  if (isBossNext && slide >= 1) {
    const blink = (game.animFrame >> 2) % 2 === 0;
    // SUPER BOSS NEXT — stage 30+ boss approach picks up a gold/red alternation
    // instead of the standard red/white so the player reads the higher tier.
    const _isSuperNext = (game.stage + 1) >= 30;
    const _bnCol = _isSuperNext
      ? (blink ? '#fc4' : '#f44')
      : (blink ? '#f44' : '#fff');
    drawRetroText('BOSS NEXT', BASE_W/2, BASE_H - 38, 6, _bnCol);
    // BOSS NAME PREVIEW — surface upcoming boss name just below the BOSS NEXT
    // tag so the player can mentally prep for the archetype/personality. Super
    // boss tier (stage+1 >= 30) picks up a gold tint matching the BOSS NEXT
    // gold/red alternation for paired super-boss tier visual cue.
    if (typeof bossNameFor === 'function') {
      const _bn = bossNameFor(game.stage + 1);
      if (_bn) {
        const _bnPCol = _isSuperNext ? '#fc4' : '#fc8';
        drawRetroText(_bn, BASE_W/2, BASE_H - 30, 5, _bnPCol);
      }
    }
  } else if (slide >= 1 && !isBoss && !isChallenge
      && (game.stage + 1) % BOSS_STAGE_INTERVAL !== 0
      && (game.stage + 1) % 4 === 0) {
    // CHALLENGE NEXT — next stage is a challenging stage (every 4 except boss)
    const _cnBlink = (game.animFrame >> 2) % 2 === 0;
    drawRetroText('CHALLENGE NEXT', BASE_W/2, BASE_H - 38, 5, _cnBlink ? '#f6f' : '#fff');
  } else if (slide >= 1 && !isBoss && !isChallenge) {
    // CHALLENGE-IN-N PEEK — when next challenge is 2-4 stages away, show small
    // dim 'CHALL IN N' label. Helps planning + sustaining no-death runs.
    let _cInN = 0;
    for (let _s = game.stage + 1; _s < game.stage + 5; _s++) {
      if (_s % BOSS_STAGE_INTERVAL === 0) break;
      if (_s % 4 === 0) { _cInN = _s - game.stage; break; }
    }
    if (_cInN >= 2 && _cInN <= 4) {
      drawRetroText('CHALL IN ' + _cInN, BASE_W/2, BASE_H - 38, 4, '#888');
    }
  }

  // BOSS COUNTDOWN PEEK — when next boss is 2-9 stages away, show dim
  // "BOSS IN N" tag so the player can plan power-up retention. Lives at
  // y = BASE_H - 30 so it doesn't conflict with BOSS NEXT / CHALL NEXT at -38.
  if (slide >= 1 && !isBoss && !isBossNext) {
    const _nextBossS = Math.ceil((game.stage + 1) / BOSS_STAGE_INTERVAL) * BOSS_STAGE_INTERVAL;
    const _bossIn = _nextBossS - game.stage;
    if (_bossIn >= 2 && _bossIn <= 9 && _nextBossS <= 80) {
      const _biCol = _bossIn <= 2 ? '#fc8' : _bossIn <= 5 ? '#fc4' : '#888';
      drawRetroText('BOSS IN ' + _bossIn, BASE_W/2, BASE_H - 30, 4, _biCol);
    }
  }

  // STAGE INTRO MARATHON PROGRESS — when no-death stage streak ≥ 2, show
  // current streak + distance to next milestone (5/10/20). Encourages
  // preservation by making progress visible at stage entry.
  if (slide >= 1 && (game.zenStreak || 0) >= 2) {
    const zs = game.zenStreak;
    const nextMilestone = zs < 5 ? 5 : zs < 10 ? 10 : zs < 20 ? 20 : null;
    const label = nextMilestone
                ? 'MARATHON x' + zs + ' → x' + nextMilestone
                : 'MARATHON x' + zs;
    drawRetroText(label, BASE_W/2, BASE_H - 28, 4, '#fc4');
  }

  // PERK COUNTDOWN — show how many stages until the next boss (= next perk
  // pick opportunity). Useful for planning around expiring perks/build state.
  if (slide >= 1 && !isBoss && game.stage > 0 && game.stage < 80) {
    const nextBoss = Math.ceil(game.stage / 10) * 10;
    const distance = nextBoss - game.stage;
    if (distance > 0 && distance <= 5) {
      drawRetroText('PERK IN ' + distance + ' STAGE' + (distance === 1 ? '' : 'S'),
        BASE_W/2, BASE_H - 60, 4, '#888');
    }
  }

  // STAGE INTRO ACTIVE PERK — if a perk is currently active (from prior boss),
  // surface it in the intro so the player knows their build going into the
  // next stage. Reminder fades in with the rest of the intro content.
  if (game.activePerk && PERKS[game.activePerk] && slide >= 1) {
    const _activePerk = PERKS[game.activePerk];
    drawRetroText('PERK: ' + _activePerk.name, BASE_W/2, BASE_H - 18, 4, _activePerk.col);
    // PERK EFFECT DESCRIPTION — surface the perk's actual bonus so the player
    // re-reads the active modifier each stage entry. Drawn smaller below name.
    if (_activePerk.desc) {
      ctx.save();
      ctx.globalAlpha = 0.65;
      drawRetroText(_activePerk.desc, BASE_W/2, BASE_H - 12, 3, '#aaa');
      ctx.restore();
    }
  }
  // COUNTDOWN SECONDS — last ~1.5s of STAGE_INTRO countdown shown as 3/2/1
  // bottom-center. Helps signal mission-imminent. Final 200ms (frames 12→1)
  // flips to a brighter, larger cyan "GO!" so the handoff to PLAYING feels
  // punchy instead of a stale "1" cutting to gameplay.
  if (slide >= 1 && game.stageTimer > 0 && game.stageTimer <= 90) {
    if (game.stageTimer <= 12) {
      // STAGE LAUNCH GO! — final beat, slight scale pulse for liftoff feel
      const _gp = 1 + 0.18 * Math.sin(game.animFrame * 0.9);
      const _gs = Math.round(11 * _gp);
      ctx.save();
      ctx.shadowColor = '#0fc'; ctx.shadowBlur = 6;
      drawRetroText('GO!', BASE_W/2, BASE_H - 16, _gs, '#0fc');
      ctx.restore();
    } else {
      const _csNum = Math.ceil(game.stageTimer / 30);
      const _csCol = _csNum === 1 ? '#fc4' : _csNum === 2 ? '#ff8' : '#888';
      // Last second '1' picks up a small glow so the urgency builds into GO!.
      ctx.save();
      if (_csNum === 1) {
        ctx.shadowColor = _csCol;
        ctx.shadowBlur = 4;
      }
      drawRetroText(String(_csNum), BASE_W/2, BASE_H - 16, 9, _csCol);
      ctx.restore();
    }
  }
  // PREV DEATH WARNING — if any of last 3 memorial entries died on this stage,
  // show small 'PREV DEATH HERE' red label. Encourages caution at danger stages.
  if (slide >= 1) {
    try {
      const _memRaw = localStorage.getItem('galagaDeathMemorials') || '[]';
      const _mem = JSON.parse(_memRaw);
      if (Array.isArray(_mem)) {
        const _recent = _mem.slice(0, 3);
        if (_recent.some(m => m && m.stage === game.stage)) {
          const _pdBl = (game.animFrame >> 3) % 2 === 0;
          drawRetroText('PREV DEATH HERE', BASE_W/2, BASE_H - 50, 5,
                        _pdBl ? '#f44' : '#f88');
        }
      }
    } catch (e) {}
  }
  // CYCLE DOTS — 10-dot row showing position within current boss cycle.
  // Pos 0 = just-after-boss (stage 1/11/21...), pos 9 = next boss.
  // Dot colors: current = bright stage type col, past = dim, future = ghost.
  if (slide >= 1) {
    const _cycPos = (game.stage - 1) % BOSS_STAGE_INTERVAL;
    const _dotY = BASE_H - 28;
    const _dotW = 5, _gap = 1;
    const _totalW = BOSS_STAGE_INTERVAL * (_dotW + _gap) - _gap;
    const _startX = BASE_W/2 - _totalW/2;
    ctx.save();
    for (let i = 0; i < BOSS_STAGE_INTERVAL; i++) {
      const _x = _startX + i * (_dotW + _gap);
      const _stg = game.stage - _cycPos + i;
      const _isBoss = (i === BOSS_STAGE_INTERVAL - 1);
      const _isChall = (i + 1) % 4 === 0 && !_isBoss;
      const _isPast = i < _cycPos;
      const _isCur = i === _cycPos;
      let _col = '#444';
      if (_isCur) _col = _isBoss ? '#f44' : _isChall ? '#f6f' : '#0cf';
      else if (_isPast) _col = '#666';
      else if (_isBoss) _col = '#823';
      else if (_isChall) _col = '#525';
      // Current dot breathes (alpha pulse) so 'you are here' reads at a glance.
      ctx.globalAlpha = _isCur
        ? (0.85 + 0.15 * Math.sin(game.animFrame * 0.2))
        : _isPast ? 0.55 : 0.40;
      ctx.fillStyle = _col;
      const _sz = _isCur ? 3 : 2;
      ctx.fillRect(_x + (_dotW - _sz)/2, _dotY + (_dotW - _sz)/2, _sz, _sz);
    }
    ctx.restore();
  }

  // STAGE INTRO MISSION REMINDER — daily mode shows today's mission status at the
  // very bottom so it reads as the last thing before the countdown. Only when a
  // mission is active and incomplete; auto-hides on completion.
  if (game.dailyMode && typeof dailyMission === 'function'
      && !game._dailyMissionFired
      && !(typeof isDailyMissionDoneToday === 'function' && isDailyMissionDoneToday())
      && slide >= 1) {
    const m = dailyMission();
    if (m) {
      ctx.save();
      ctx.globalAlpha = 0.85;
      // PROGRESS APPEND — small live progress fraction after the mission label
      const _pStr = (typeof m.progress === 'function') ? m.progress(game) : '';
      const _txt = _pStr ? ('TODAY: ' + m.label + '  ' + _pStr) : ('TODAY: ' + m.label);
      drawRetroText(_txt, BASE_W/2, BASE_H - 8, 4, '#f6f');
      ctx.restore();
    }
  }

  // PILOT QUOTE — narrative texture for normal stages (no boss, no transmission log).
  // Color reflects the pilot tier so the maxim feels like it's spoken in the pilot's
  // own voice. Fades in over first 30 frames then holds.
  if (game.stageQuote && !log && slide >= 1) {
    const qElapsed = Math.max(0, elapsed - 24);
    const qFade = Math.min(1, qElapsed / 30);
    const _pqCol = (typeof pilotTitleColor === 'function' && typeof computePilotTitle === 'function')
      ? pilotTitleColor(computePilotTitle())
      : '#aaa';
    ctx.save();
    ctx.globalAlpha = qFade * 0.85;
    drawRetroText('— ' + game.stageQuote + ' —', BASE_W/2, BASE_H - 28, 5, _pqCol);
    ctx.restore();
  }

  // Countdown for the last 60 frames: 3 → 2 → 1 → GO!
  // Each digit lasts 20 frames; "GO!" appears as timer hits 0 (handled by stage start).
  if (slide >= 1 && game.stageTimer <= 60) {
    let digit, digitCol, digitTimer;
    if (game.stageTimer > 40)      { digit = '3'; digitCol = '#0f8'; digitTimer = 60 - game.stageTimer; }
    else if (game.stageTimer > 20) { digit = '2'; digitCol = '#ff4'; digitTimer = 40 - game.stageTimer; }
    else                            { digit = '1'; digitCol = '#f44'; digitTimer = 20 - game.stageTimer; }
    // Backdrop tint flash when a new digit begins (first 4 frames of each)
    if (digitTimer < 4) {
      ctx.save();
      ctx.globalAlpha = (4 - digitTimer) / 4 * 0.10;
      ctx.fillStyle = digitCol;
      ctx.fillRect(0, 0, BASE_W, BASE_H);
      ctx.restore();
    }
    // Pop-in scale animation: scale up from 0.4× → 1.2× over first 6 frames, settle to 1.0×
    const scale = digitTimer < 6 ? 0.4 + (digitTimer / 6) * 0.8 : 1.0 + Math.max(0, (12 - digitTimer)) * 0.02;
    ctx.save();
    const cx = BASE_W/2, cy = BASE_H/2 + 22;
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.shadowColor = digitCol;
    ctx.shadowBlur = 16;
    drawRetroText(digit, 0, 0, 24, digitCol);
    ctx.restore();
    // Concentric pulse ring fading out
    const ringR = digitTimer * 4;
    if (digitTimer < 14) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - digitTimer / 14) * 0.6;
      ctx.strokeStyle = digitCol;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(BASE_W/2, BASE_H/2 + 22, ringR, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  } else if (slide >= 1) {
    // READY pulses for the early portion
    const readyPulse = (Math.floor(elapsed / 15)) % 2 === 0;
    if (readyPulse) drawRetroText('READY', BASE_W/2, BASE_H/2 + 18, 12, COL.yellow);
  }

  // Subtype hint (boss → boss icon, challenge → swirl, normal → enemies row)
  // NEW THREAT warning takes precedence on debut stages
  const NEW_THREATS = {
    3:  { name: 'KAMIKAZE',       draw: (x, y) => drawKamikaze(x, y, game.animFrame >> 3) },
    4:  { name: 'UFO',            draw: (x, y) => drawUFO(x, y, game.animFrame >> 2) },
    5:  { name: 'SPLITTER',       draw: (x, y) => drawSplitter(x, y, game.animFrame >> 4) },
    6:  { name: 'GOLDEN BEE',     draw: (x, y) => drawGoldenBee(x, y, game.animFrame >> 4) },
    7:  { name: 'SHIELDED',       draw: (x, y) => drawShielded(x, y, game.animFrame >> 4, 2) },
    11: { name: 'HOVERER',        draw: (x, y) => drawHoverer(x, y, game.animFrame >> 1) },
    13: { name: 'MIRROR CLONE',   draw: (x, y) => drawMirror(x, y, game.animFrame >> 4) },
    20: { name: 'DOUBLE BOSS',    draw: (x, y) => { drawMegaBoss(x - 18, y, game.animFrame >> 3, false); drawMegaBoss(x + 18, y, game.animFrame >> 3, false); } },
    30: { name: 'SUPER BOSS',     draw: (x, y) => {
      ctx.save(); ctx.translate(x, y); ctx.scale(1.5, 1.5);
      drawMegaBoss(0, 0, game.animFrame >> 3, false);
      ctx.restore();
    }}
  };
  // Formation variant emblem (small schematic + caption) — shown on top-left when applicable
  if (isVariant && slide >= 1) {
    const ex = 26, ey = BASE_H/2 + 28;
    drawRetroText('FORMATION', ex, ey - 12, 6, COL.green, 'left');
    drawRetroText(variant.toUpperCase(), ex, ey - 4, 7, '#0f8', 'left');
    // Schematic
    ctx.save();
    ctx.fillStyle = '#0f8';
    const cx = ex + 14, cy = ey + 12;
    if (variant === 'v') {
      for (let i = 0; i < 5; i++) {
        ctx.fillRect(cx - 8 + i * 2, cy - 5 + i, 1, 1);
        ctx.fillRect(cx + 8 - i * 2, cy - 5 + i, 1, 1);
      }
    } else if (variant === 'circle') {
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        ctx.fillRect(cx + Math.round(Math.cos(a) * 6), cy + Math.round(Math.sin(a) * 4), 1, 1);
      }
    } else if (variant === 'diamond') {
      for (let i = -4; i <= 4; i++) {
        const w = 5 - Math.abs(i);
        for (let j = -w; j <= w; j += 2) ctx.fillRect(cx + j, cy + i, 1, 1);
      }
    } else if (variant === 'wave') {
      for (let i = 0; i < 12; i++) {
        ctx.fillRect(cx - 6 + i, cy + Math.round(Math.sin(i * 0.7) * 3), 1, 1);
      }
    }
    ctx.restore();
  }

  const threat = NEW_THREATS[game.stage];
  if (slide >= 1 && elapsed > 40) {
    if (threat) {
      // Pulsing red WARNING caption
      const blink = (game.animFrame >> 2) % 2 === 0;
      const wcol = blink ? COL.red : '#f88';
      drawRetroText('! WARNING !', BASE_W/2, BASE_H/2 + 32, 9, wcol);
      drawRetroText('NEW THREAT: ' + threat.name, BASE_W/2, BASE_H/2 + 44, 6, COL.yellow);
      // Telegraph rectangle behind the enemy
      ctx.save();
      ctx.globalAlpha = 0.18 + 0.12 * Math.sin(game.animFrame * 0.18);
      ctx.fillStyle = COL.red;
      ctx.fillRect(BASE_W/2 - 42, BASE_H/2 + 50, 84, 28);
      ctx.restore();
      threat.draw(BASE_W/2, BASE_H/2 + 64);
    } else if (isBoss) {
      // Camera-zoom effect: scale ramps up while showing boss, plus expanding shockwave rings
      const t = Math.max(0, elapsed - 40);
      const zoomT = Math.min(1, t / 40);
      const scale = 0.4 + zoomT * 1.4 + (zoomT >= 1 ? Math.sin(game.animFrame * 0.12) * 0.05 : 0);
      const cx = BASE_W/2, cy = BASE_H/2 + 60;
      // Expanding shockwave rings (only during the zoom)
      for (let r = 0; r < 3; r++) {
        const ringAge = (game.animFrame + r * 14) % 42;
        const ringR = ringAge * 1.5;
        const alpha = (1 - ringAge / 42) * 0.5;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = COL.red;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      drawMegaBoss(0, 0, game.animFrame >> 3, false);
      ctx.restore();
    } else if (isChallenge) {
      for (let i = 0; i < 3; i++) {
        const fx = BASE_W/2 + (i - 1) * 24 + Math.sin(game.animFrame * 0.1 + i) * 3;
        drawButterfly(fx, BASE_H/2 + 50, game.animFrame >> 4);
      }
    } else {
      drawBee(BASE_W/2 - 30, BASE_H/2 + 50, game.animFrame >> 4);
      drawButterfly(BASE_W/2, BASE_H/2 + 50, game.animFrame >> 4);
      drawBoss(BASE_W/2 + 30, BASE_H/2 + 50, game.animFrame >> 4, false);
    }
  }

  // Stage flags (bottom strip — count up to current stage)
  const flagsPerRow = 10;
  const totalFlags = Math.min(game.stage, 30);
  const flagW = 8;
  const flagSpacing = 9;
  const rowW = Math.min(totalFlags, flagsPerRow) * flagSpacing;
  const baseY = BASE_H - 38;
  for (let i = 0; i < totalFlags; i++) {
    const row = Math.floor(i / flagsPerRow);
    const col = i % flagsPerRow;
    const rowFlags = Math.min(totalFlags - row * flagsPerRow, flagsPerRow);
    const rowStart = BASE_W/2 - (rowFlags * flagSpacing) / 2 + flagSpacing / 2;
    const fx = rowStart + col * flagSpacing - flagW / 2;
    const fy = baseY + row * 11;
    // Pole
    ctx.fillStyle = '#888';
    ctx.fillRect(fx, fy, 1, 9);
    // FLAG ROW TIER — boss stages (every 10th) get a split red/black flag with
    // skull dot. Milestone stages (every 5th, not boss) get gold. Others red/blue.
    const stageN = i + 1;
    const isBossFlag = stageN % 10 === 0;
    const isGold = !isBossFlag && stageN % 5 === 0;
    if (isBossFlag) {
      // Boss flag: top half red, bottom half black, white center dot (skull)
      ctx.fillStyle = COL.red;
      ctx.fillRect(fx + 1, fy, flagW - 2, 2);
      ctx.fillStyle = '#000';
      ctx.fillRect(fx + 1, fy + 2, flagW - 2, 2);
      // White skull dot
      ctx.fillStyle = '#fff';
      ctx.fillRect(fx + 3, fy + 2, 1, 1);
      // Super-boss (stage 30+): add gold pip atop the pole for extra emphasis
      if (stageN >= 30) {
        ctx.fillStyle = '#fc4';
        ctx.fillRect(fx, fy - 1, 2, 1);
      }
    } else {
      ctx.fillStyle = isGold ? '#fc4' : (i % 2 === 0 ? COL.red : COL.blue);
      ctx.fillRect(fx + 1, fy, flagW - 2, 4);
      ctx.fillStyle = '#fff';
      ctx.fillRect(fx + 2, fy + 1, 1, 1);
    }
  }

  // ACT TITLE CARD — upper-screen overlay for stages that open a new act.
  // Sits above the stage label area so it doesn't clash. 120-frame intro window:
  // first 30 frames fade-in, last 30 frames fade-out. Centered horizontally,
  // upper third vertically (y ≈ 28-66). Uses act-specific accent color.
  {
    const _act = (typeof actStartFor === 'function') ? actStartFor(game.stage) : null;
    if (_act) {
      const _e = introElapsed;
      const _fadeIn = Math.min(1, _e / 30);
      const _fadeOut = Math.min(1, (game.stageTimer || 0) / 30);
      const _alpha = _fadeIn * _fadeOut;
      ctx.save();
      // Dark backing band — softens text against busy background
      ctx.globalAlpha = _alpha * 0.55;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 24, BASE_W, 46);
      // Thin top/bottom accent lines tied to act color
      ctx.globalAlpha = _alpha * 0.85;
      ctx.fillStyle = _act.col;
      ctx.fillRect(0, 24, BASE_W, 1);
      ctx.fillRect(0, 69, BASE_W, 1);
      // ACT label — small roman numeral header
      ctx.globalAlpha = _alpha * 0.90;
      drawRetroText('— ACT ' + _act.num + ' —', BASE_W / 2, 33, 5, _act.col, 'center');
      // Title — large, glowing
      ctx.globalAlpha = _alpha;
      ctx.shadowColor = _act.col;
      ctx.shadowBlur = 8;
      drawRetroText(_act.title, BASE_W / 2, 49, 10, _act.col, 'center');
      ctx.shadowBlur = 0;
      // Subtitle — atmospheric one-liner
      ctx.globalAlpha = _alpha * 0.70;
      drawRetroText(_act.sub, BASE_W / 2, 63, 4, '#aaa', 'center');
      ctx.restore();
    }
  }

  // STAGE_INTRO SKIP HINT — once skipping is allowed (≥ 30 frames shown), prompt
  // the player they can fast-forward. Subtle gray, bottom of screen, pulsing.
  if (game.stageTimer <= 90 && game.stageTimer > 2 && (game.animFrame >> 3) % 2 === 0) {
    drawRetroText('FIRE: SKIP', BASE_W / 2, BASE_H - 8, 4, '#888', 'center');
  }

  drawHUD();
}

function drawGameplay() {
  // Wave entry telegraph for challenge stages
  drawChallengeTelegraph();
  // Wave Tactical HUD — persistent strip showing wave progress dots, perfect tracking,
  // and incoming-wave enemy composition. Only active during CHALLENGING state.
  drawChallengeWaveHUD();
  // Draw enemies
  if (game.state === STATE.CHALLENGING) {
    const wave = game.challengeWaves[game.challengeWaveIdx];
    if (wave) {
      for (const e of wave) {
        if (!e.alive) continue;
        if (e.type === 'bee') drawBee(e.x, e.y, e.frame);
        else if (e.type === 'butterfly') drawButterfly(e.x, e.y, e.frame);
        else if (e.type === 'boss') drawBoss(e.x, e.y, e.frame, e.hp < 2);
      }
    }
  } else {
    // High-stage threat aura — small magenta halo behind each enemy from stage 15 onward
    // Stronger aura at stage 30+
    const auraStage = game.stage >= 15;
    const auraStrong = game.stage >= 30;
    // FORMATION PREVIEW — faint dot at the home position of every entering enemy
    // so the player can read the incoming formation shape before all sprites land.
    // Skipped once allEntered (formation is visibly assembled).
    if (game.state === STATE.PLAYING && !game.allEntered) {
      ctx.save();
      ctx.fillStyle = '#888';
      for (const e of game.enemies) {
        if (e.alive && e.state === 'entering') {
          // Anchor preview dot at the eventual home position, fade in over the
          // enemy's path progress (closer to formation = brighter target).
          const fade = Math.min(1, (e.pathProgress || 0) + 0.2);
          ctx.globalAlpha = 0.18 * (1 - fade) + 0.05;
          ctx.fillRect(e.homeX - 1, e.homeY - 1, 3, 3);
        }
      }
      ctx.restore();
    }
    // DIVE LAUNCH AFTERIMAGE — render faint silhouettes at the home positions of
    // enemies that just started diving. Visual anchor of "where they came from".
    if (game.diveAfterimages && game.diveAfterimages.length) {
      ctx.save();
      for (const ai of game.diveAfterimages) {
        const fade = 1 - ai.life / ai.maxLife;
        ctx.globalAlpha = fade * 0.35;
        ctx.fillStyle = '#888';
        // Simple 7×6 silhouette box at home position
        ctx.fillRect(ai.x - 4, ai.y - 4, 9, 9);
      }
      ctx.restore();
    }
    // DIVE PATH PREVIEW — render fading dots along upcoming dive trajectory so
    // the player can read it before the enemy commits. Faded by global lifetime
    // (divePathLife). Drawn before the sprite so the enemy reads above its own path.
    {
      ctx.save();
      ctx.fillStyle = '#f44';
      for (const e of game.enemies) {
        if (!e.alive || !e.divePathDots || (e.divePathLife || 0) <= 0) continue;
        const lifeFrac = e.divePathLife / 22;
        for (const d of e.divePathDots) {
          ctx.globalAlpha = (1 - d.t) * 0.55 * lifeFrac + 0.05 * lifeFrac;
          ctx.fillRect(Math.round(d.x), Math.round(d.y), 1, 1);
        }
      }
      ctx.restore();
    }
    // LAST STAND — golden pulsing aura on the sole surviving enemy of the stage.
    const _lsActive = game.state === STATE.PLAYING && game.allEntered
      && game.enemies.filter(en => en.alive).length === 1;
    for (const e of game.enemies) {
      if (!e.alive) continue;
      // KAMIKAZE LEAD INDICATOR — predict landing X by extrapolating velocity to player Y.
      // Helps player read incoming straight-dive threats early and pre-commit to a side.
      if (e.state === 'kamikaze' && e.vy > 0.1 && game.playerAlive && e.y < game.playerY - 24) {
        const dt = (game.playerY - e.y) / e.vy;
        const leadX = e.x + e.vx * dt;
        if (leadX >= 4 && leadX <= BASE_W - 4) {
          ctx.save();
          const _blk = (game.animFrame >> 2) % 2 === 0;
          ctx.globalAlpha = _blk ? 0.75 : 0.35;
          ctx.fillStyle = '#f44';
          // Down-triangle marker at predicted landing point on player Y line
          ctx.fillRect(leadX - 3, game.playerY - 10, 6, 1);
          ctx.fillRect(leadX - 2, game.playerY - 9,  4, 1);
          ctx.fillRect(leadX - 1, game.playerY - 8,  2, 1);
          ctx.restore();
        }
      }
      if (_lsActive) {
        const t = game.animFrame;
        const pulseR = 11 + Math.sin(t * 0.22) * 2;
        ctx.save();
        ctx.globalAlpha = 0.55 + 0.30 * Math.sin(t * 0.18);
        ctx.strokeStyle = '#fc4';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(e.x, e.y, pulseR, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      // ELITE outline — drawn BEFORE the sprite so it reads as a halo/border.
      // Pulsing red box around the enemy + diagonal corner pips for an "ace" feel.
      if (e.elite) {
        ctx.save();
        const pulse = 0.55 + 0.35 * Math.sin(game.animFrame * 0.20 + e.x * 0.03);
        ctx.globalAlpha = pulse;
        ctx.fillStyle = '#f44';
        // 4-side border (1px) at ±9 radius
        ctx.fillRect(e.x - 9, e.y - 9, 18, 1);
        ctx.fillRect(e.x - 9, e.y + 8, 18, 1);
        ctx.fillRect(e.x - 9, e.y - 9, 1, 18);
        ctx.fillRect(e.x + 8, e.y - 9, 1, 18);
        // Corner pips (4) at the diagonals for extra signal
        ctx.fillStyle = '#fc4';
        ctx.fillRect(e.x - 9, e.y - 9, 2, 1);
        ctx.fillRect(e.x + 7, e.y - 9, 2, 1);
        ctx.fillRect(e.x - 9, e.y + 8, 2, 1);
        ctx.fillRect(e.x + 7, e.y + 8, 2, 1);
        ctx.restore();
      }
      if (auraStage && e.type !== 'minibee' && e.type !== 'goldenBee' && e.type !== 'ufo') {
        ctx.save();
        const auraCol = game.stage >= 25 ? '#f44' : game.stage >= 20 ? '#f60' : '#f6f';
        const baseAlpha = auraStrong ? 0.28 : 0.20;
        ctx.globalAlpha = baseAlpha + 0.10 * Math.sin(game.animFrame * 0.18 + e.x * 0.05);
        ctx.fillStyle = auraCol;
        ctx.fillRect(e.x - 9, e.y - 9, 18, 18);
        ctx.globalAlpha *= 0.6;
        ctx.fillRect(e.x - 12, e.y - 12, 24, 24);
        if (auraStrong) {
          ctx.globalAlpha *= 0.5;
          ctx.fillRect(e.x - 16, e.y - 16, 32, 32);
        }
        // Color-blind: white outline so the aura tier (red/orange/magenta) is recognizable by shape
        if (colorBlindMode) {
          ctx.globalAlpha = 0.7;
          ctx.fillStyle = '#fff';
          ctx.fillRect(e.x - 9, e.y - 9, 18, 1);
          ctx.fillRect(e.x - 9, e.y + 8, 18, 1);
          ctx.fillRect(e.x - 9, e.y - 9, 1, 18);
          ctx.fillRect(e.x + 8, e.y - 9, 1, 18);
        }
        ctx.restore();
      }
      // GHOST stealth wrap — only sprite is dimmed; pips/flash stay readable
      const _ghostStealth = e.ghost && !e.ghostRevealed;
      if (_ghostStealth) { ctx.save(); ctx.globalAlpha = 0.15; }
      switch(e.type) {
        case 'bee': drawBee(e.x, e.y, e.frame); break;
        case 'butterfly': drawButterfly(e.x, e.y, e.frame); break;
