const INTERCEPT_COOLDOWN_FRAMES = 300;
const INTERCEPT_LIFE = 180;

function pushIntercept(type) {
  if (!game) return;
  if (!INTERCEPT_MSG[type]) return;
  game._interceptLastT = game._interceptLastT || {};
  const last = game._interceptLastT[type] || -9999;
  const now = game.runFrames || 0;
  if ((now - last) < INTERCEPT_COOLDOWN_FRAMES) return;
  game._interceptLastT[type] = now;
  const variants = INTERCEPT_MSG[type];
  const text = variants[Math.floor(Math.random() * variants.length)];
  game.interceptQueue = game.interceptQueue || [];
  game.interceptQueue.unshift({ text, life: INTERCEPT_LIFE, maxLife: INTERCEPT_LIFE });
  if (game.interceptQueue.length > 3) game.interceptQueue.length = 3;
}

function updateInterceptQueue() {
  if (!game || !game.interceptQueue) return;
  if (game.state !== STATE.PLAYING && game.state !== STATE.CHALLENGING
      && game.state !== STATE.BOSS_STAGE && game.state !== STATE.RESPAWN
      && game.state !== STATE.CAPTURED) return;
  for (const m of game.interceptQueue) m.life--;
  game.interceptQueue = game.interceptQueue.filter(m => m.life > 0);
}

function drawInterceptTerminal() {
  if (!game || !game.interceptQueue || game.interceptQueue.length === 0) return;
  if (minimalHud) return; // enemy-comms flavor — hidden in the clean/minimal view
  if (game.state === STATE.TITLE || game.state === STATE.STAGE_INTRO
      || game.state === STATE.GAME_OVER || game.state === STATE.BONUS_GAME) return;
  ctx.save();
  // Stack at bottom-left, newest on TOP, oldest below (terminal feel).
  // Position above the lives row (which sits at y ≈ BASE_H - 6).
  const newestY = BASE_H - 36;
  for (let i = 0; i < game.interceptQueue.length; i++) {
    const m = game.interceptQueue[i];
    const y = newestY + i * 7;
    const fadeIn = Math.min(1, (m.maxLife - m.life) / 12);
    const fadeOut = Math.min(1, m.life / 30);
    const alpha = fadeIn * fadeOut;
    // Dark background bar for readability over any biome / weather
    ctx.globalAlpha = alpha * 0.40;
    ctx.fillStyle = '#020';
    ctx.fillRect(2, y - 1, 132, 7);
    // Green terminal text with "< " prefix
    ctx.globalAlpha = alpha * 0.90;
    drawRetroText('< ' + m.text, 4, y + 5, 4, '#0f8', 'left');
    // NEW INTERCEPT DOT — first 30 frames after arrival, a pulsing white dot
    // sits at the leftmost edge to flag "new". Helps player catch arriving comms.
    const _age = m.maxLife - m.life;
    if (_age < 30) {
      const _newFade = (30 - _age) / 30;
      ctx.globalAlpha = _newFade * (0.65 + 0.35 * Math.sin(game.animFrame * 0.30));
      ctx.fillStyle = '#fff';
      ctx.fillRect(135, y + 2, 1, 2);
    }
  }
  ctx.restore();
}

// SUPPLY CRATE — mid-stage shootable resupply target. 30% chance on normal stages 5+.
// Spawns when player has cleared ~50% of formation OR 600 frames into the stage.
// hp=3 (resists stray hits), drops 1 random timed power-up (T/R/W/H) on break.
// Off-screen fall-through = no penalty. Score-neutral by design — drop is the reward.
// ACT TRANSITIONS — long-run narrative chapter markers. Each act starts at a
// specific stage with a title card overlay during STAGE_INTRO. ACT I (stages 1-10)
// is the implicit starting state — no card. Subsequent acts each introduce a
// thematic shift and signal "new chapter" to keep 100-stage runs from feeling flat.
const ACT_TITLES = [
  { startStage: 11, num: 'II',  title: 'THE BREACH',     sub: 'WE PASS THE FIRST GATE',     col: '#f84', endStage: 20 },
  { startStage: 21, num: 'III', title: 'DESCENT',        sub: 'THE FLOOR DROPS AWAY',       col: '#f48', endStage: 30 },
  { startStage: 31, num: 'IV',  title: 'EVENT HORIZON',  sub: 'THERE IS NO GOING BACK',     col: '#f6c', endStage: 50 },
  { startStage: 51, num: 'V',   title: 'HOLLOW DEPTHS',  sub: 'WE ARE BEYOND THE MAP',      col: '#a4f', endStage: 70 },
  { startStage: 71, num: 'VI',  title: 'ECHO OF ORIGIN', sub: 'SOMETHING CALLS FROM AHEAD', col: '#48f', endStage: 90 },
  { startStage: 91, num: 'VII', title: 'THE END LOOP',   sub: 'WHEN DID THIS BEGIN?',       col: '#0ff', endStage: null }
];
// ACT I (stages 1-10) has no start card (implicit) but DOES have an end ceremony
const ACT_ONE_END = { num: 'I', title: 'AWAKENING', sub: 'THE FIRST GATE OPENS', col: '#8cf', endStage: 10 };
function actStartFor(stage) {
  return ACT_TITLES.find(a => a.startStage === stage) || null;
}
function actEndingAt(stage) {
  if (stage === ACT_ONE_END.endStage) return ACT_ONE_END;
  return ACT_TITLES.find(a => a.endStage === stage) || null;
}

// PLAYER GUARDIAN — temporary AI escort drone with 4 trigger-specific variants.
// All variants follow player above-ship with damped orbit, fire bullets upward.
// witch save → standard (cyan, balanced)
// combo 50+ first kill → attack (red, +dmg, faster fire)
// boss phase2 entry → support (gold, longer TTL, slower but steady)
// supply crate break (15%) → rapid (blue, very fast fire, short TTL)
// Player death immediately retires whichever variant is active.
const GUARDIAN_VARIANTS = {
  standard: { col: '#0ff', body: '#0ff', ttl: 600, fireCd: 30, dmg: 1, fireRateLabel: 'BALANCED', chip: 'BASE' },
  attack:   { col: '#f44', body: '#f88', ttl: 480, fireCd: 20, dmg: 2, fireRateLabel: 'ATTACK',   chip: 'ATK'  },
  support:  { col: '#fc4', body: '#ff8', ttl: 900, fireCd: 36, dmg: 1, fireRateLabel: 'SUPPORT',  chip: 'SPT'  },
  rapid:    { col: '#48f', body: '#8af', ttl: 360, fireCd: 12, dmg: 1, fireRateLabel: 'RAPID',   chip: 'RAP'  }
};

function spawnGuardian(variant) {
  if (!game) return;
  const v = GUARDIAN_VARIANTS[variant] || GUARDIAN_VARIANTS.standard;
  const variantId = GUARDIAN_VARIANTS[variant] ? variant : 'standard';
  // If guardian already active, refresh TTL + swap variant to the newer trigger
  if (game.guardian) {
    game.guardian.ttl = Math.max(game.guardian.ttl, v.ttl);
    game.guardian.maxTtl = Math.max(game.guardian.maxTtl, v.ttl);
    game.guardian.fadeIn = 20;
    game.guardian.variant = variantId;
    game.guardian.col = v.col;
    game.guardian.body = v.body;
    game.guardian.dmg = v.dmg;
    game.guardian.baseFireCd = v.fireCd;
    game.guardian.fireCd = Math.min(game.guardian.fireCd, v.fireCd);
    return;
  }
  game.guardian = {
    x: game.playerX, y: game.playerY - 24,
    ttl: v.ttl, maxTtl: v.ttl,
    fireCd: 24, baseFireCd: v.fireCd,
    fadeIn: 20,
    variant: variantId,
    col: v.col, body: v.body, dmg: v.dmg
  };
  // Spawn cinematic — variant-colored ring + 8 radial sparks at drone arrival point
  if (game.shockwaves) {
    game.shockwaves.push({
      x: game.playerX, y: game.playerY - 24,
      life: 0, maxLife: 20, maxR: 18, color: v.col
    });
  }
  for (let k = 0; k < 8; k++) {
    const a = (k / 8) * Math.PI * 2;
    game.itemBursts.push({
      x: game.playerX + Math.cos(a) * 6,
      y: game.playerY - 24 + Math.sin(a) * 6,
      life: -k, color: v.col
    });
  }
  if (typeof pushIntercept === 'function') pushIntercept('guardianArrives');
  // GUARDIAN MASTER milestone — track unique variants summoned this run; fire once
  // at 4 (all variants experienced). Deep run mastery narrative.
  if (game._guardianVariants && typeof pushIntercept === 'function') {
    const _wasNewG = !game._guardianVariants.has(variantId);
    game._guardianVariants.add(variantId);
    if (_wasNewG && game._guardianVariants.size === 4) {
      pushIntercept('guardianMaster');
    }
  }
  // GUARDIAN ARRIVAL LABEL — variant chip ('ALLY: BASE/ATK/SPT/RAP') in
  // variant color so the player reads which drone joined without studying the
  // sprite. Sits just above the spawn point.
  if (game.floatTexts) {
    game.floatTexts.push({
      x: game.playerX, y: game.playerY - 36,
      text: 'ALLY: ' + v.chip,
      color: v.col, life: 50, maxLife: 50, size: 6
    });
  }
  playSound('dualFighter');
}

function updateGuardian() {
  if (!game || !game.guardian) return;
  if (game.state !== STATE.PLAYING && game.state !== STATE.CHALLENGING
      && game.state !== STATE.BOSS_STAGE) return;
  const g = game.guardian;
  const guardCol = g.col || '#0ff';
  // Player dead → immediate retirement (no in-flight drone over dead pilot)
  if (!game.playerAlive) {
    for (let k = 0; k < 6; k++) {
      const a = (k / 6) * Math.PI * 2;
      game.itemBursts.push({
        x: g.x + Math.cos(a) * 4,
        y: g.y + Math.sin(a) * 4,
        life: -k, color: guardCol
      });
    }
    game.guardian = null;
    return;
  }
  g.ttl--;
  if (g.fadeIn > 0) g.fadeIn--;
  // Damped follow with gentle horizontal orbit
  const targetX = game.playerX + Math.sin(game.animFrame * 0.05) * 9;
  const targetY = game.playerY - 22;
  g.x += (targetX - g.x) * 0.18;
  g.y += (targetY - g.y) * 0.18;
  // Fire at variant-specific cadence — only after spawn cinematic finishes
  g.fireCd--;
  if (g.fireCd <= 0 && g.fadeIn === 0) {
    g.fireCd = g.baseFireCd || 30;
    game.bullets.push({
      x: g.x, y: g.y - 4,
      vy: -BULLET_SPEED, dmg: g.dmg || 1, lvl: 1,
      _guardian: true,
      _gCol: g.col || '#0ff'
    });
    playSound('shoot');
  }
  // TTL expired → departure cinematic
  if (g.ttl <= 0) {
    for (let k = 0; k < 6; k++) {
      const a = (k / 6) * Math.PI * 2;
      game.itemBursts.push({
        x: g.x + Math.cos(a) * 4,
        y: g.y + Math.sin(a) * 4,
        life: -k, color: guardCol
      });
    }
    if (game.shockwaves) {
      game.shockwaves.push({
        x: g.x, y: g.y, life: 0, maxLife: 18, maxR: 14, color: guardCol
      });
    }
    // GUARDIAN DEPARTURE LABEL — variant-colored 'ALLY OFFLINE' floattext.
    // Pairs with the arrival label so entrance and exit beats both register.
    if (game.floatTexts) {
      game.floatTexts.push({
        x: g.x, y: g.y - 8, text: 'ALLY OFFLINE',
        color: guardCol, life: 45, maxLife: 45, size: 5
      });
    }
    game.guardian = null;
  }
}

function drawGuardian() {
  if (!game || !game.guardian) return;
  if (game.state === STATE.STAGE_INTRO || game.state === STATE.GAME_OVER
      || game.state === STATE.TITLE || game.state === STATE.BONUS_GAME) return;
  const g = game.guardian;
  const t = game.animFrame;
  ctx.save();
  // Fade-in pulse during first 20 frames, smooth alpha thereafter
  const lifeFrac = g.ttl / g.maxTtl;
  const fadeOutAlpha = Math.min(1, g.ttl / 60);
  const fadeInAlpha = g.fadeIn > 0 ? (1 - g.fadeIn / 20) : 1;
  const alpha = fadeInAlpha * fadeOutAlpha;
  // Outer variant-colored glow (1px ring around the drone body)
  const ringCol = g.col || '#0ff';
  const bodyCol = g.body || '#0ff';
  // LOW-TTL PULSE — pulse accelerates as the drone runs out of time. Matches
  // BUFF EXPIRY URGENCY pattern so weapon/guardian/shield resource expiry all
  // read as the same urgency dialect. <90 warn (0.3), <45 critical (0.6).
  const _lowTtl  = g.ttl < 90;
  const _critTtl = g.ttl < 45;
  const _pulseSp = _critTtl ? 0.6 : _lowTtl ? 0.3 : 0.15;
  ctx.globalAlpha = alpha * (0.45 + 0.25 * Math.sin(t * _pulseSp));
  ctx.fillStyle = ringCol;
  ctx.fillRect(Math.round(g.x) - 3, Math.round(g.y) - 3, 6, 1);
  ctx.fillRect(Math.round(g.x) - 3, Math.round(g.y) + 2, 6, 1);
  ctx.fillRect(Math.round(g.x) - 3, Math.round(g.y) - 3, 1, 6);
  ctx.fillRect(Math.round(g.x) + 2, Math.round(g.y) - 3, 1, 6);
  // Body — solid variant-color 3×3 with white core
  ctx.globalAlpha = alpha * 0.95;
  ctx.fillStyle = bodyCol;
  ctx.fillRect(Math.round(g.x) - 1, Math.round(g.y) - 1, 3, 3);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#fff';
  ctx.fillRect(Math.round(g.x), Math.round(g.y), 1, 1);
  // TTL progress pip — small trail of variant-color dots showing time remaining
  if (g.fadeIn === 0) {
    ctx.globalAlpha = alpha * 0.5;
    ctx.fillStyle = ringCol;
    const pipCount = Math.floor(lifeFrac * 4);
    for (let p = 0; p < pipCount; p++) {
      ctx.fillRect(Math.round(g.x) - 4 + p * 3, Math.round(g.y) + 4, 1, 1);
    }
  }
  ctx.restore();
}

function pickSupplyCrate() {
  if (!game) return false;
  const isBoss = game.stage % BOSS_STAGE_INTERVAL === 0;
  const isChallenge = !isBoss && game.stage % 4 === 0;
  if (isBoss || isChallenge) return false;
  if (game.stage < 5) return false;
  return Math.random() < 0.30;
}

function updateSupplyCrate() {
  if (!game) return;
  if (game.state !== STATE.PLAYING) return;

  // SPAWN check — armed by pickSupplyCrate at stage start, fires once when conditions met
  if (game.supplyCrateRolled && !game.supplyCrateSpawned && !game.supplyCrate
      && game.allEntered) {
    const _aliveNow = game.enemies.filter(en => en.alive).length;
    const _maxCount = game.formationMaxCount || 1;
    const killRatio = 1 - (_aliveNow / _maxCount);
    const stageF = game.stageFrames || 0;
    if (killRatio >= 0.50 || stageF >= 600) {
      game.supplyCrate = {
        x: 24 + Math.random() * (BASE_W - 48),
        y: -10,
        vy: 0.55,
        hp: 3, maxHp: 3,
        life: 0,
        rot: 0, rotSpeed: 0.025
      };
      game.supplyCrateSpawned = true;
      if (typeof pushIntercept === 'function') pushIntercept('supplyDrop');
      // SUPPLY CRATE SPAWN BANNER — gold floattext alerting the player to the
      // mid-stage drop. Gold matches the crate's inner pulse so visual identity
      // is consistent. Pairs with the existing supplyDrop INTERCEPT.
      if (game.floatTexts) {
        game.floatTexts.push({
          x: BASE_W/2, y: 50,
          text: '◢ SUPPLY DROP ◣',
          color: '#fc4', life: 70, maxLife: 70, size: 6
        });
      }
      playSound('graze');
    }
  }

  // TICK existing crate
  const c = game.supplyCrate;
  if (!c) return;
  c.life++;
  c.y += c.vy;
  c.rot += c.rotSpeed;
  // Off-screen fall-through — no penalty, just cleared
  if (c.y > BASE_H + 12) {
    // SUPPLY MISSED BANNER — gray floattext at the floor so the player notices
    // the missed opportunity. Pairs with the SPAWN banner for entry/exit
    // visual symmetry. Color is muted (no real penalty, just informational).
    if (game.floatTexts) {
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H - 60, text: 'SUPPLY LOST',
        color: '#a88', life: 50, maxLife: 50, size: 6
      });
    }
    game.supplyCrate = null;
    return;
  }
  // Player bullet collision (3 hp absorbs 3 hits)
  for (let bi = game.bullets.length - 1; bi >= 0; bi--) {
    const b = game.bullets[bi];
    if (Math.abs(b.x - c.x) < 6 && Math.abs(b.y - c.y) < 6) {
      c.hp--;
      game.bullets.splice(bi, 1);
      game.itemBursts.push({ x: b.x, y: b.y, life: 0, color: '#fc4' });
      game.shakeTimer = Math.max(game.shakeTimer || 0, 2);
      playSound('hit');
      if (c.hp <= 0) {
        // BREAK — spawn random timed power-up. Permanent S/N/P excluded to keep
        // mid-stage event from inflating long-term progression.
        const typesT = ['T', 'R', 'W', 'H'];
        const type = typesT[Math.floor(Math.random() * typesT.length)];
        game.powerUps.push({ x: c.x, y: c.y, vy: 0.6, type });
        // GUARDIAN VARIANT — 15% chance to also drop a blue RAPID-fire drone
        if (Math.random() < 0.15 && typeof spawnGuardian === 'function') {
          spawnGuardian('rapid');
        }
        // Cinematic break — gold shockwave + 10 sparks + floatText + shake
        for (let k = 0; k < 10; k++) {
          const a = (k / 10) * Math.PI * 2;
          game.itemBursts.push({
            x: c.x + Math.cos(a) * 4,
            y: c.y + Math.sin(a) * 4,
            life: -k, color: '#fc4'
          });
        }
        if (game.shockwaves) {
          game.shockwaves.push({
            x: c.x, y: c.y, life: 0, maxLife: 22, maxR: 22, color: '#fc4'
          });
        }
        game.floatTexts.push({
          x: c.x, y: c.y - 12, text: 'SUPPLY!',
          color: '#fc4', life: 50, maxLife: 50, size: 7
        });
        game.shakeTimer = Math.max(game.shakeTimer || 0, 4);
        playSound('powerUp');
        game.supplyCrate = null;
      }
      break;
    }
  }
}

function drawSupplyCrate() {
  if (!game || !game.supplyCrate) return;
  if (game.state === STATE.STAGE_INTRO || game.state === STATE.GAME_OVER
      || game.state === STATE.TITLE || game.state === STATE.BONUS_GAME) return;
  const c = game.supplyCrate;
  const t = game.animFrame;
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(c.rot);
  // HP-based tint: intact gray → damaged amber → critical red
  const hpRatio = c.hp / c.maxHp;
  const baseCol = hpRatio > 0.66 ? '#888' : hpRatio > 0.33 ? '#a84' : '#c44';
  ctx.fillStyle = baseCol;
  ctx.fillRect(-4, -4, 8, 8);
  ctx.fillStyle = '#bbb';
  ctx.fillRect(-4, -4, 8, 1);
  ctx.fillStyle = '#555';
  ctx.fillRect(-4, 3, 8, 1);
  // Center pulse — yellow inner glow signals it's shootable / valuable
  const pulse = 0.55 + 0.45 * Math.sin(t * 0.2);
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#fc4';
  ctx.fillRect(-2, -2, 4, 4);
  ctx.globalAlpha = pulse * 0.5;
  ctx.fillStyle = '#fff';
  ctx.fillRect(-1, -1, 2, 2);
  ctx.restore();
  // HP pip row below crate — shows damage state at a glance
  if (c.hp < c.maxHp) {
    ctx.save();
    ctx.globalAlpha = 0.85;
    for (let i = 0; i < c.maxHp; i++) {
      ctx.fillStyle = i < c.hp ? '#fc4' : '#333';
      ctx.fillRect(c.x - 4 + i * 3, c.y + 7, 2, 1);
    }
    ctx.restore();
  }
}

// Lazy-init asteroid drift state. Each asteroid: x, y, vy, size, rot for parallax feel.
let _biomeAsteroids = null;
function ensureAsteroids() {
  if (_biomeAsteroids) return;
  _biomeAsteroids = [];
  for (let i = 0; i < 8; i++) {
    _biomeAsteroids.push({
      x: Math.random() * BASE_W,
      y: Math.random() * BASE_H,
      vy: 0.15 + Math.random() * 0.25,
      size: 4 + Math.floor(Math.random() * 5),
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.02
    });
  }
}

function drawBiome() {
  if (!game) return;
  const id = biomeForStage(game.stage || 1);
  if (!id) return;
  const t = game.animFrame;

  if (id === 'planet') {
    // PLANET HORIZON — lower band of curved planet surface w/ atmospheric glow.
    // Color palette tied loosely to TIER_PALETTES so it harmonizes, not clashes.
    ctx.save();
    // Atmospheric glow band just above the surface
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#48f';
    ctx.fillRect(0, BASE_H - 60, BASE_W, 6);
    ctx.globalAlpha = 0.10;
    ctx.fillRect(0, BASE_H - 66, BASE_W, 8);
    ctx.restore();
    // Planet curve — chunky pixel arc made from horizontal rects of varying width
    ctx.fillStyle = '#236';
    for (let py = 0; py < 50; py++) {
      const y = BASE_H - 50 + py;
      // Crude curve: width based on parabola from y
      const k = py / 50;
      const w = BASE_W * (1 - k * 0.05); // very gentle curve at top, more at bottom
      const x = (BASE_W - w) / 2;
      ctx.fillRect(x, y, w, 1);
    }
    // Surface highlights — moving lights (cities)
    ctx.fillStyle = '#fc4';
    for (let i = 0; i < 6; i++) {
      const cx = ((i * 47 + (t * 0.05)) % BASE_W);
      const cy = BASE_H - 30 + (i % 3) * 6;
      if ((t + i * 7) % 60 < 30) ctx.fillRect(Math.round(cx), cy, 1, 1);
    }
    // Atmospheric dust — slow drift upward (atmospheric scatter)
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#a86';
    for (let i = 0; i < 10; i++) {
      const px = ((i * 23 + t * 0.15) % BASE_W);
      const py = ((BASE_H - 50) - ((i * 37 + t * 0.08) % (BASE_H - 60)));
      ctx.fillRect(Math.round(px), Math.round(py), 1, 1);
    }
    ctx.restore();
  } else if (id === 'asteroid') {
    // ASTEROID FIELD — chunky drifting rocks, parallax slower than near stars.
    ensureAsteroids();
    for (const a of _biomeAsteroids) {
      a.y += a.vy;
      a.rot += a.rotSpeed;
      if (a.y - a.size > BASE_H) {
        a.y = -a.size;
        a.x = Math.random() * BASE_W;
        a.size = 4 + Math.floor(Math.random() * 5);
      }
      // Rotated chunky pixel cluster — 4 cardinal pieces + center
      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.translate(a.x, a.y);
      ctx.rotate(a.rot);
      ctx.fillStyle = '#867';
      ctx.fillRect(-a.size / 2, -a.size / 2, a.size, a.size);
      ctx.fillStyle = '#a98';
      ctx.fillRect(-a.size / 2, -a.size / 2, 1, 1);
      ctx.fillRect(a.size / 2 - 1, a.size / 2 - 1, 1, 1);
      ctx.fillStyle = '#534';
      ctx.fillRect(-a.size / 2 + 1, a.size / 2 - 1, 1, 1);
      ctx.restore();
    }
  } else if (id === 'gasGiant') {
    // GAS GIANT — large ringed planet in upper-right, slowly rotating tilt.
    ctx.save();
    const cx = BASE_W - 30, cy = 50;
    const r = 28;
    // Body — concentric square layers with banding
    const bandCols = ['#a64', '#b75', '#c86', '#a64', '#864'];
    for (let by = -r; by < r; by++) {
      const ratio = (by + r) / (2 * r);
      const w = Math.floor(Math.sqrt(r * r - by * by) * 2);
      const colIdx = Math.floor((ratio + Math.sin(t * 0.01 + by * 0.1) * 0.05) * bandCols.length);
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = bandCols[Math.max(0, Math.min(bandCols.length - 1, colIdx))];
      ctx.fillRect(cx - w / 2, cy + by, w, 1);
    }
    // Ring — slanted ellipse approximation: 2 horizontal lines extending past planet
    ctx.globalAlpha = 0.40;
    ctx.fillStyle = '#dca';
    const ringInner = r + 5, ringOuter = r + 14;
    ctx.fillRect(cx - ringOuter, cy - 1, ringOuter - ringInner, 1);
    ctx.fillRect(cx - ringOuter, cy, ringOuter - ringInner, 1);
    ctx.fillRect(cx + ringInner, cy - 1, ringOuter - ringInner, 1);
    ctx.fillRect(cx + ringInner, cy, ringOuter - ringInner, 1);
    // Floating gas particles — slow vertical drift, warm amber
    ctx.globalAlpha = 0.40;
    ctx.fillStyle = '#fa6';
    for (let i = 0; i < 8; i++) {
      const px = ((i * 53 + t * 0.10) % BASE_W);
      const py = ((i * 67 + t * 0.07) % BASE_H);
      ctx.fillRect(Math.round(px), Math.round(py), 1, 1);
    }
    ctx.restore();
  } else if (id === 'blackhole') {
    // BLACK HOLE — rotating accretion disk + central void.
    ctx.save();
    const cx = BASE_W / 2, cy = BASE_H / 3;
    const innerR = 12, outerR = 32;
    // Disk — radial spokes that rotate
    const spokes = 24;
    const rot = t * 0.04;
    for (let s = 0; s < spokes; s++) {
      const a = (s / spokes) * Math.PI * 2 + rot;
      const intensity = 0.3 + 0.4 * Math.sin(s * 1.2 + t * 0.05);
      ctx.globalAlpha = 0.10 + intensity * 0.18;
      // Color hue shift based on radius
      ctx.fillStyle = (s % 3 === 0) ? '#f80' : (s % 3 === 1) ? '#fc4' : '#f48';
      // Draw spoke as a series of pixels from inner to outer radius
      for (let rPos = innerR; rPos < outerR; rPos += 2) {
        const px = cx + Math.cos(a) * rPos;
        const py = cy + Math.sin(a) * rPos * 0.5; // squish for depth (face-on disk)
        ctx.fillRect(Math.round(px), Math.round(py), 1, 1);
      }
    }
    // Inner void — pure black circle
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    for (let by = -innerR; by < innerR; by++) {
      const w = Math.floor(Math.sqrt(innerR * innerR - by * by) * 2);
      ctx.fillRect(cx - w / 2, cy + by * 0.5, w, 1);
    }
    // Accretion dust — particles spiraling INTO the void (gravity pull)
    ctx.globalAlpha = 0.50;
    ctx.fillStyle = '#f84';
    for (let i = 0; i < 14; i++) {
      const ang = (i / 14) * Math.PI * 2 + t * 0.02;
      const baseR = 50 + (i * 7 % 30);
      const r = baseR - ((t * 0.3 + i * 19) % 40); // decrease over time = inward pull
      const px = cx + Math.cos(ang) * r;
      const py = cy + Math.sin(ang) * r * 0.5;
      if (r > innerR + 2) ctx.fillRect(Math.round(px), Math.round(py), 1, 1);
    }
    ctx.restore();
  } else if (id === 'dawn') {
    // DAWN SKY — orange/pink gradient covering bottom half of screen for a "rising
    // over a planet" feel. Bright lift to contrast the deep-space biomes around it.
    // Alpha kept ≤0.30 so player/enemy sprites remain clearly readable.
    ctx.save();
    const bands = [
      { y0: BASE_H - 90, h: 16, col: '#824', alpha: 0.10 },
      { y0: BASE_H - 74, h: 14, col: '#a36', alpha: 0.16 },
      { y0: BASE_H - 60, h: 18, col: '#d66', alpha: 0.22 },
      { y0: BASE_H - 42, h: 18, col: '#f86', alpha: 0.26 },
      { y0: BASE_H - 24, h: 20, col: '#fc8', alpha: 0.30 },
      { y0: BASE_H - 4,  h: 14, col: '#fec', alpha: 0.32 }
    ];
    for (const b of bands) {
      ctx.globalAlpha = b.alpha;
      ctx.fillStyle = b.col;
      ctx.fillRect(0, b.y0, BASE_W, b.h);
    }
    // Sun rising at right horizon — partial disc + glow
    const sunCx = BASE_W - 28, sunCy = BASE_H - 28;
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = '#fec';
    for (let by = -10; by <= 4; by++) {
      const w = Math.floor(Math.sqrt(Math.max(0, 100 - by * by)) * 2);
      ctx.fillRect(sunCx - w / 2, sunCy + by, w, 1);
    }
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#fec';
    ctx.fillRect(sunCx - 16, sunCy - 16, 32, 2); // halo
    ctx.fillRect(sunCx - 18, sunCy - 14, 36, 1);
    // Golden motes — bright particles drifting up (dawn light filtering)
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#fc8';
    for (let i = 0; i < 12; i++) {
      const px = ((i * 31 + t * 0.18) % BASE_W);
      const py = ((BASE_H - 30) - ((i * 41 + t * 0.10) % (BASE_H - 40)));
      ctx.fillRect(Math.round(px), Math.round(py), 1, 1);
    }
    ctx.restore();
  } else if (id === 'ice') {
    // ICE FIELD — white/cyan glacier surface across bottom + falling snow particles.
    // Brighter than dawn but cooler tone for variety.
    ctx.save();
    // Glacial surface — wavy white band
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = '#def';
    for (let x = 0; x < BASE_W; x += 1) {
      const wave = Math.floor(Math.sin(x * 0.18 + t * 0.005) * 3);
      const yTop = BASE_H - 32 + wave;
      ctx.fillRect(x, yTop, 1, BASE_H - yTop);
    }
    // Ice highlights — bright cyan crests along the surface
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#fff';
    for (let x = 0; x < BASE_W; x += 6) {
      const wave = Math.floor(Math.sin(x * 0.18 + t * 0.005) * 3);
      ctx.fillRect(x, BASE_H - 32 + wave, 2, 1);
    }
    // Falling snow — small drifting dots above the surface
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#fff';
    const snowCount = 18;
    for (let i = 0; i < snowCount; i++) {
      const sx = ((i * 53 + (t * 0.4)) % BASE_W);
      const sy = ((i * 47 + (t * 0.8)) % (BASE_H - 40));
      ctx.fillRect(Math.round(sx), Math.round(sy), 1, 1);
    }
    // Subtle cool-tint wash over the whole frame
    ctx.globalAlpha = 0.04;
    ctx.fillStyle = '#9cf';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
    ctx.restore();
  } else if (id === 'corona') {
    // SUN CORONA — golden/yellow brightness with looping flare ribbons across the
    // upper half of the screen, suggesting flight along a star's outer atmosphere.
    ctx.save();
    // Warm wash across upper half
    ctx.globalAlpha = 0.20;
    ctx.fillStyle = '#fc4';
    ctx.fillRect(0, 0, BASE_W, BASE_H / 2);
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = '#f84';
    ctx.fillRect(0, BASE_H / 2, BASE_W, BASE_H / 2);
    // Flare ribbons — sin-wave horizontal bands that drift
    const flareCount = 3;
    for (let f = 0; f < flareCount; f++) {
      ctx.globalAlpha = 0.22 + 0.10 * Math.sin(t * 0.04 + f * 1.3);
      ctx.fillStyle = f % 2 === 0 ? '#fec' : '#fa6';
      const yBase = 20 + f * 18;
      for (let x = 0; x < BASE_W; x += 2) {
        const wave = Math.sin(x * 0.06 + t * 0.03 + f * 1.7) * 6;
        const h = 4 + 2 * Math.sin(x * 0.08 - t * 0.02 + f);
        ctx.fillRect(x, yBase + wave, 2, h);
      }
    }
    // Bright pinpoint sparks
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 8; i++) {
      const sx = ((i * 41 + t * 0.2) % BASE_W);
      const sy = ((i * 23 + t * 0.4) % (BASE_H / 2));
      ctx.fillRect(Math.round(sx), Math.round(sy), 1, 1);
    }
    // Solar wind sparks — orange particles streaking diagonally
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#f84';
    for (let i = 0; i < 12; i++) {
      const px = ((i * 29 + t * 0.5) % BASE_W);
      const py = ((i * 47 + t * 0.3) % BASE_H);
      ctx.fillRect(Math.round(px), Math.round(py), 2, 1); // 2px wide for streaks
    }
    ctx.restore();
  } else if (id === 'starfield') {
    // STARFIELD — empty, peaceful sector with extra bright twinkling stars.
    // Acts as a "rest" cycle between dramatic biomes. Just brighter star density.
    ctx.save();
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 40; i++) {
      const seed = i * 137;
      const sx = (seed * 7 % BASE_W);
      const sy = (seed * 11 % BASE_H);
      const flick = (t + seed) % 60 < 35;
      if (flick) ctx.fillRect(sx, sy, 1, 1);
    }
    // Distant galactic core glow — soft band across mid-screen
    ctx.globalAlpha = 0.06;
    ctx.fillStyle = '#cef';
    ctx.fillRect(0, BASE_H / 2 - 30, BASE_W, 60);
    ctx.globalAlpha = 0.04;
    ctx.fillRect(0, BASE_H / 2 - 20, BASE_W, 40);
    ctx.restore();
  } else if (id === 'nebula') {
    // STAR NURSERY — large drifting violet gas clouds with embedded white stars.
    // 3 elliptical clouds at different depths, gentle horizontal drift, plus
    // dense star sparkle. Softer than corona/blackhole but visually distinct.
    ctx.save();
    // Faint violet wash over whole screen for ambient tint
    ctx.globalAlpha = 0.08;
    ctx.fillStyle = '#a4f';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
    // 3 large elliptical clouds at varying x positions, slow horizontal drift
    const clouds = [
      { cx: 40 + Math.sin(t * 0.008) * 10,  cy: 60,  rx: 60, ry: 24, col: '#a4f', alpha: 0.16 },
      { cx: 160 + Math.cos(t * 0.006) * 12, cy: 110, rx: 50, ry: 20, col: '#f6c', alpha: 0.14 },
      { cx: 100 + Math.sin(t * 0.010) * 8,  cy: 170, rx: 70, ry: 28, col: '#48f', alpha: 0.12 }
    ];
    for (const c of clouds) {
      ctx.globalAlpha = c.alpha;
      ctx.fillStyle = c.col;
      // Render ellipse as horizontal scanlines
      for (let dy = -c.ry; dy < c.ry; dy++) {
        const ratio = dy / c.ry;
        const w = Math.floor(c.rx * Math.sqrt(Math.max(0, 1 - ratio * ratio)) * 2);
        ctx.fillRect(Math.round(c.cx - w / 2), Math.round(c.cy + dy), w, 1);
      }
    }
    // Embedded bright stars — twinkling white points scattered across nebula clouds
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 28; i++) {
      const seed = i * 173;
      const sx = (seed * 7 % BASE_W);
      const sy = (seed * 13 % BASE_H);
      const twinkle = (t + seed) % 40 < 22;
      if (twinkle) ctx.fillRect(sx, sy, 1, 1);
    }
    // Brighter "newborn" stars — 4 bigger pulsing white points
    for (let i = 0; i < 4; i++) {
      const px = 50 + i * 40 + Math.sin(t * 0.02 + i) * 6;
      const py = 50 + (i % 2) * 60;
      const pulse = 0.5 + 0.5 * Math.sin(t * 0.08 + i * 1.2);
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#fff';
      ctx.fillRect(Math.round(px), Math.round(py), 2, 2);
    }
    ctx.restore();
  } else if (id === 'ruins') {
    // RUINED CITY — bombed skyline silhouette, smoke columns, amber haze.
    // Building heights seeded by index so they're deterministic every frame.
    ctx.save();
    // Amber-red sky wash from below (fire glow on horizon)
    const ruinBands = [
      { y: BASE_H - 80, h: 20, col: '#421', a: 0.12 },
      { y: BASE_H - 60, h: 22, col: '#632', a: 0.18 },
      { y: BASE_H - 38, h: 20, col: '#864', a: 0.22 },
      { y: BASE_H - 18, h: 18, col: '#a75', a: 0.28 },
    ];
    for (const b of ruinBands) {
      ctx.globalAlpha = b.a;
      ctx.fillStyle = b.col;
      ctx.fillRect(0, b.y, BASE_W, b.h);
    }
    // Building silhouettes — 9 buildings across the bottom
    const buildingData = [
      { x: 0,   w: 18, h: 55, notch: 4 },
      { x: 20,  w: 12, h: 40, notch: 0 },
      { x: 34,  w: 22, h: 65, notch: 6 },
      { x: 58,  w: 14, h: 48, notch: 2 },
      { x: 74,  w: 26, h: 72, notch: 8 },
      { x: 102, w: 16, h: 44, notch: 3 },
      { x: 120, w: 20, h: 60, notch: 5 },
      { x: 142, w: 30, h: 52, notch: 0 },
      { x: 174, w: 22, h: 68, notch: 7 },
      { x: 198, w: 26, h: 45, notch: 4 },
    ];
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = '#1a1410';
    for (const bd of buildingData) {
      const top = BASE_H - bd.h;
      ctx.fillRect(bd.x, top, bd.w, bd.h);
      // Broken top — jagged notch
      if (bd.notch > 0) {
        ctx.fillStyle = '#000';
        ctx.fillRect(bd.x + bd.w - bd.notch, top, bd.notch, bd.notch + 2);
        ctx.fillStyle = '#1a1410';
      }
      // Dim windows — 2×2 grids of faint lighter squares
      ctx.globalAlpha = 0.30;
      ctx.fillStyle = '#fc8';
      for (let wy = top + 4; wy < BASE_H - 8; wy += 7) {
        for (let wx = bd.x + 2; wx < bd.x + bd.w - 2; wx += 5) {
          if ((wx * 7 + wy * 3 + bd.h) % 5 !== 0) continue; // sparse
          ctx.fillRect(wx, wy, 2, 2);
        }
      }
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = '#1a1410';
    }
    // Smoke columns — rising from 4 buildings, slow upward drift
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#876';
    const smokeSrcs = [34, 74, 120, 174];
    for (let s = 0; s < smokeSrcs.length; s++) {
      for (let p = 0; p < 12; p++) {
        const px = smokeSrcs[s] + 6 + Math.sin((t * 0.04 + p * 0.9 + s * 2.1)) * 4;
        const py = BASE_H - 60 - ((p * 14 + t * 0.5 + s * 22) % (BASE_H - 60));
        ctx.fillRect(Math.round(px), Math.round(py), 2, 3);
      }
    }
    ctx.restore();
  } else if (id === 'desert') {
    // DESERT WASTES — orange sand dunes, heat shimmer, dust haze.
    ctx.save();
    // Hot sky gradient — orange-brown at bottom fading upward
    const desertBands = [
      { y: BASE_H - 90, h: 18, col: '#62300a', a: 0.10 },
      { y: BASE_H - 72, h: 18, col: '#8b450e', a: 0.14 },
      { y: BASE_H - 54, h: 20, col: '#b05a14', a: 0.18 },
      { y: BASE_H - 34, h: 20, col: '#c87028', a: 0.22 },
      { y: BASE_H - 14, h: 14, col: '#d4843a', a: 0.28 },
    ];
    for (const b of desertBands) {
      ctx.globalAlpha = b.a;
      ctx.fillStyle = b.col;
      ctx.fillRect(0, b.y, BASE_W, b.h);
    }
    // Dune silhouette — sin-based wavy horizon
    ctx.globalAlpha = 0.70;
    ctx.fillStyle = '#9a5a1a';
    for (let x = 0; x < BASE_W; x++) {
      const dune = Math.floor(
        Math.sin(x * 0.04 + t * 0.003) * 10 +
        Math.sin(x * 0.09 + 1.2 + t * 0.005) * 5 +
        Math.sin(x * 0.02 + 2.7) * 7
      );
      const yTop = BASE_H - 28 + dune;
      ctx.fillRect(x, yTop, 1, BASE_H - yTop);
    }
    // Dune highlights — lighter crest along the ridge
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = '#d49050';
    for (let x = 0; x < BASE_W; x++) {
      const dune = Math.floor(
        Math.sin(x * 0.04 + t * 0.003) * 10 +
        Math.sin(x * 0.09 + 1.2 + t * 0.005) * 5 +
        Math.sin(x * 0.02 + 2.7) * 7
      );
      const yTop = BASE_H - 28 + dune;
      ctx.fillRect(x, yTop, 1, 1);
    }
    // Heat shimmer — thin transparent bands that oscillate vertically
    ctx.globalAlpha = 0.08;
    ctx.fillStyle = '#ffa840';
    for (let i = 0; i < 5; i++) {
      const hy = BASE_H - 80 + i * 12 + Math.sin(t * 0.06 + i * 0.8) * 3;
      ctx.fillRect(0, Math.round(hy), BASE_W, 1);
    }
    // Dust particles — brown motes drifting diagonally
    ctx.globalAlpha = 0.40;
    ctx.fillStyle = '#a06030';
    for (let i = 0; i < 16; i++) {
      const px = ((i * 43 + t * 0.22) % BASE_W);
      const py = ((BASE_H - 80) - ((i * 31 + t * 0.15) % (BASE_H - 95)));
      ctx.fillRect(Math.round(px), Math.round(py), 1, 1);
    }
    ctx.restore();
  } else if (id === 'canyon') {
    // CRIMSON CANYON — red rock walls flanking both sides, strata bands, rocky floor.
    ctx.save();
    // Deep red-brown tint wash (ambient canyon light)
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = '#7a2010';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
    // Left rock wall — tapers inward going up
    const wallColor = '#5a2010';
    const wallHighlight = '#7a3818';
    const wallDepth = 40; // max wall width at bottom
    ctx.globalAlpha = 0.70;
    for (let y = 0; y < BASE_H; y++) {
      const wallW = Math.floor(wallDepth * (1 - y / BASE_H) * 0.9 + 4);
      ctx.fillStyle = wallColor;
      ctx.fillRect(0, y, wallW, 1);
      // Strata highlight bands every 8px
      if (y % 8 < 2) {
        ctx.fillStyle = wallHighlight;
        ctx.fillRect(0, y, wallW - 1, 1);
        ctx.fillStyle = wallColor;
      }
    }
    // Right rock wall — mirror
    for (let y = 0; y < BASE_H; y++) {
      const wallW = Math.floor(wallDepth * (1 - y / BASE_H) * 0.9 + 4);
      ctx.fillStyle = wallColor;
      ctx.fillRect(BASE_W - wallW, y, wallW, 1);
      if (y % 8 < 2) {
        ctx.fillStyle = wallHighlight;
        ctx.fillRect(BASE_W - wallW + 1, y, wallW - 1, 1);
        ctx.fillStyle = wallColor;
      }
    }
    // Rocky ground — solid dark band at very bottom
    ctx.globalAlpha = 0.80;
    ctx.fillStyle = '#3d1808';
    ctx.fillRect(0, BASE_H - 18, BASE_W, 18);
    // Ground surface highlights — scattered lighter pebbles
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = '#7a3818';
    for (let i = 0; i < 20; i++) {
      const seed = i * 97;
      const px = seed * 11 % BASE_W;
      ctx.fillRect(px, BASE_H - 16 + (seed % 8), 2 + (seed % 3), 1);
    }
    // Falling rock dust — sparse downward motes from the walls
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = '#8b4020';
    for (let i = 0; i < 10; i++) {
      const side = i % 2 === 0 ? (i * 7 % 35) : (BASE_W - 5 - (i * 11 % 30));
      const py = (i * 41 + t * 0.4) % BASE_H;
      ctx.fillRect(Math.round(side), Math.round(py), 1, 2);
    }
    ctx.restore();
  }
}

// --- AMBIENT EVENTS ---
// Atmospheric one-shot events that appear during a stage. No score impact, no
// gameplay effect — pure narrative/environment. Spawned on stage start (35% chance,
// stage > 3) so they don't crowd the tutorial. Single active event at a time —
// game.ambientEvent stores its state.
//
// Types:
//   cargoShip — large freighter silhouette traversing horizontally with running lights
//   supernova — bright corner flash that fades over ~3 seconds with shockwave ring
function pickAmbientEvent() {
  if (!game) return null;
  if (game.stage <= 3) return null;            // pure-space tutorial
  if (Math.random() >= 0.35) return null;      // 35% spawn rate
  const types = ['cargoShip', 'supernova', 'satellite', 'comet', 'pulsar', 'meteorShower'];
  return types[Math.floor(Math.random() * types.length)];
}
function startAmbientEvent(type) {
  if (!type) { game.ambientEvent = null; return; }
  // AMBIENT EVENT ENTRY BANNER — brief atmospheric label so the player notices
  // the event onset. Faded gray to keep ambient tone, not gameplay alarm.
  const _evLabels = {
    cargoShip: 'CARGO TRANSIT',
    supernova: 'DISTANT SUPERNOVA',
    satellite: 'SATELLITE PASS',
    comet:     'COMET DRIFT',
    pulsar:    'PULSAR PULSE',
    meteorShower: 'METEOR SHOWER'
  };
  const _lab = _evLabels[type];
  if (_lab && game.floatTexts) {
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H - 50, text: _lab,
      color: '#888', life: 50, maxLife: 50, size: 4
    });
  }
  if (type === 'cargoShip') {
    const fromLeft = Math.random() < 0.5;
    game.ambientEvent = {
      type, life: 0,
      maxLife: 1200,                  // ~20s — slow drift
      x: fromLeft ? -60 : BASE_W + 60,
      y: 30 + Math.random() * (BASE_H - 90),
      vx: (fromLeft ? 1 : -1) * 0.18,
      lightPhase: 0
    };
  } else if (type === 'supernova') {
    const corner = Math.floor(Math.random() * 4);
    game.ambientEvent = {
      type, life: 0,
      maxLife: 180,                  // ~3s flash + fade
      x: corner % 2 === 0 ? 30 : BASE_W - 30,
      y: corner < 2 ? 30 : BASE_H - 60,
      maxR: 40
    };
  } else if (type === 'satellite') {
    // Small rotating box drifting horizontally with blinking beacon
    const fromLeft = Math.random() < 0.5;
    game.ambientEvent = {
      type, life: 0,
      maxLife: 900,                  // ~15s
      x: fromLeft ? -10 : BASE_W + 10,
      y: 20 + Math.random() * 40,
      vx: (fromLeft ? 1 : -1) * 0.32,
      rot: 0
    };
  } else if (type === 'comet') {
    // Fast diagonal streak through upper screen — quick visual pop
    const fromLeft = Math.random() < 0.5;
    const startY = -8;
    game.ambientEvent = {
      type, life: 0,
      maxLife: 150,                  // ~2.5s
      x: fromLeft ? -10 : BASE_W + 10,
      y: startY,
      vx: (fromLeft ? 1 : -1) * 2.4,
      vy: 1.1
    };
  } else if (type === 'pulsar') {
    // PULSAR — fixed-position rapidly pulsing point with concentric rings.
    // ~5 second life, 4 pulses spaced ~70 frames apart.
    game.ambientEvent = {
      type, life: 0,
      maxLife: 300,
      x: 40 + Math.random() * (BASE_W - 80),
      y: 20 + Math.random() * 60
    };
  } else if (type === 'meteorShower') {
    // METEOR SHOWER — spawns 6-9 staggered comet-style streaks all from same edge.
    // Stored as an array of sub-streaks in `streaks`. Rendered with same comet logic.
    const fromLeft = Math.random() < 0.5;
    const count = 6 + Math.floor(Math.random() * 4);
    const streaks = [];
    for (let k = 0; k < count; k++) {
      streaks.push({
        x: fromLeft ? -10 - k * 18 : BASE_W + 10 + k * 18,
        y: -8 + Math.random() * 30,
        vx: (fromLeft ? 1 : -1) * (2.0 + Math.random() * 1.0),
        vy: 1.0 + Math.random() * 0.6,
        delay: k * 12  // staggered ignition
      });
    }
    game.ambientEvent = {
      type, life: 0,
      maxLife: 300,
      streaks
    };
  }
}
function updateAmbientEvent() {
  const ev = game.ambientEvent;
  if (!ev) return;
  ev.life++;
  if (ev.type === 'cargoShip') {
    ev.x += ev.vx;
    ev.lightPhase++;
    // Despawn when off-screen
    if (ev.x < -80 || ev.x > BASE_W + 80) game.ambientEvent = null;
  } else if (ev.type === 'supernova') {
    if (ev.life >= ev.maxLife) game.ambientEvent = null;
  } else if (ev.type === 'satellite') {
    ev.x += ev.vx;
    ev.rot += 0.04;
    if (ev.x < -20 || ev.x > BASE_W + 20) game.ambientEvent = null;
  } else if (ev.type === 'comet') {
    ev.x += ev.vx;
    ev.y += ev.vy;
    if (ev.x < -30 || ev.x > BASE_W + 30 || ev.y > BASE_H + 10) game.ambientEvent = null;
  } else if (ev.type === 'pulsar') {
    // Pulsar — fixed position, no movement; life counter drives the pulse pattern.
    if (ev.life >= ev.maxLife) game.ambientEvent = null;
  } else if (ev.type === 'meteorShower') {
    // Move each active streak; lifecycle ends when all streaks have left the screen.
    let anyOnScreen = false;
    for (const st of ev.streaks) {
      if (ev.life < st.delay) { anyOnScreen = true; continue; }
      st.x += st.vx;
      st.y += st.vy;
      if (st.x > -30 && st.x < BASE_W + 30 && st.y < BASE_H + 10) anyOnScreen = true;
    }
    if (!anyOnScreen) game.ambientEvent = null;
  }
}
function drawAmbientEvent() {
  const ev = game.ambientEvent;
  if (!ev) return;
  if (ev.type === 'cargoShip') {
    // Long rectangular silhouette (40 × 8 px) with running lights and a small bridge bump
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#234';
    ctx.fillRect(ev.x - 20, ev.y - 4, 40, 8);
    ctx.fillRect(ev.x - 8, ev.y - 6, 16, 2);   // bridge / superstructure
    ctx.fillRect(ev.x - 24, ev.y - 1, 4, 2);   // engine cowl trailing edge
    // Running lights — alternating amber/red along the hull
    const lights = (ev.lightPhase >> 4) % 2;
    ctx.fillStyle = lights ? '#fc4' : '#f44';
    ctx.fillRect(ev.x - 18, ev.y - 2, 1, 1);
    ctx.fillStyle = lights ? '#f44' : '#fc4';
    ctx.fillRect(ev.x - 6,  ev.y - 2, 1, 1);
    ctx.fillRect(ev.x + 6,  ev.y - 2, 1, 1);
    ctx.fillRect(ev.x + 16, ev.y - 2, 1, 1);
    // Engine glow trailing the direction of travel
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = '#0cf';
    const trailX = ev.vx > 0 ? ev.x - 28 : ev.x + 22;
    ctx.fillRect(trailX, ev.y - 1, 6, 2);
    ctx.restore();
  } else if (ev.type === 'supernova') {
    // Expanding ring + central flash. Alpha peaks early then fades.
    const ratio = ev.life / ev.maxLife;
    const fade = ratio < 0.15
      ? (ratio / 0.15)
      : (1 - (ratio - 0.15) / 0.85);
    const alpha = Math.max(0, fade);
    ctx.save();
    // Outer expanding ring
    const r = 4 + ratio * ev.maxR;
    ctx.globalAlpha = alpha * 0.45;
    ctx.fillStyle = '#fff';
    for (let a = 0; a < 24; a++) {
      const ang = (a / 24) * Math.PI * 2;
      const px = ev.x + Math.cos(ang) * r;
      const py = ev.y + Math.sin(ang) * r;
      ctx.fillRect(Math.round(px), Math.round(py), 1, 1);
    }
    // Central flash core
    ctx.globalAlpha = alpha * 0.75;
    ctx.fillStyle = '#ff8';
    ctx.fillRect(ev.x - 2, ev.y - 2, 4, 4);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff';
    ctx.fillRect(ev.x - 1, ev.y - 1, 2, 2);
    // Faint corner halo bleed
    ctx.globalAlpha = alpha * 0.18;
    ctx.fillStyle = '#fc8';
    ctx.fillRect(ev.x - 16, ev.y - 16, 32, 32);
    ctx.restore();
  } else if (ev.type === 'satellite') {
    // Small 5×5 rotating box with solar-panel wings + blinking red beacon
    ctx.save();
    ctx.globalAlpha = 0.65;
    ctx.translate(ev.x, ev.y);
    ctx.rotate(ev.rot);
    // Body
    ctx.fillStyle = '#888';
    ctx.fillRect(-2, -2, 5, 5);
    // Solar panel wings (left/right)
    ctx.fillStyle = '#48c';
    ctx.fillRect(-7, -1, 4, 3);
    ctx.fillRect(3, -1, 4, 3);
    // Beacon — blinking red dot
    if ((ev.life >> 3) % 2 === 0) {
      ctx.fillStyle = '#f44';
      ctx.fillRect(0, -3, 1, 1);
    }
    ctx.restore();
  } else if (ev.type === 'comet') {
    // Bright streak with fading tail behind
    ctx.save();
    ctx.fillStyle = '#fec';
    ctx.globalAlpha = 0.9;
    ctx.fillRect(Math.round(ev.x), Math.round(ev.y), 2, 2);
    // Tail — extrapolate backward from velocity
    const len = 14;
    for (let i = 1; i <= len; i++) {
      const t = i / len;
      const tx = ev.x - ev.vx * i * 0.7;
      const ty = ev.y - ev.vy * i * 0.7;
      ctx.globalAlpha = (1 - t) * 0.7;
      ctx.fillStyle = i < len * 0.4 ? '#fff' : i < len * 0.7 ? '#fec' : '#fa6';
      ctx.fillRect(Math.round(tx), Math.round(ty), 1, 1);
    }
    ctx.restore();
  } else if (ev.type === 'pulsar') {
    // PULSAR — fixed point with 3 concentric pulsing rings + bright core. 4-pulse
    // cycle spaced ~75 frames apart. Each pulse expands from r=2 to r=22.
    ctx.save();
    const cyclePhase = (ev.life % 75) / 75;
    const pulseR = 2 + cyclePhase * 20;
    const fade = 1 - cyclePhase;
    // 3 rings
    for (let ring = 0; ring < 3; ring++) {
      const ringR = pulseR + ring * 4;
      ctx.globalAlpha = fade * 0.45 * (1 - ring * 0.25);
      ctx.fillStyle = ring === 0 ? '#fff' : ring === 1 ? '#8cf' : '#48a';
      const segs = 16;
      for (let s = 0; s < segs; s++) {
        const a = (s / segs) * Math.PI * 2;
        const px = Math.round(ev.x + Math.cos(a) * ringR);
        const py = Math.round(ev.y + Math.sin(a) * ringR);
        ctx.fillRect(px, py, 1, 1);
      }
    }
    // Bright core
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#fff';
    ctx.fillRect(ev.x - 1, ev.y - 1, 3, 3);
    ctx.restore();
  } else if (ev.type === 'meteorShower') {
    // METEOR SHOWER — render each active streak as a mini comet trail
    ctx.save();
    for (const st of ev.streaks) {
      if (ev.life < st.delay) continue;
      ctx.fillStyle = '#fec';
      ctx.globalAlpha = 0.85;
      ctx.fillRect(Math.round(st.x), Math.round(st.y), 1, 1);
      // Short tail (8 segments)
      for (let i = 1; i <= 8; i++) {
        const tx = st.x - st.vx * i * 0.6;
        const ty = st.y - st.vy * i * 0.6;
        ctx.globalAlpha = (1 - i / 8) * 0.55;
        ctx.fillStyle = i < 3 ? '#fff' : '#fa6';
        ctx.fillRect(Math.round(tx), Math.round(ty), 1, 1);
      }
    }
    ctx.restore();
  }
}

function getFormationPos(col, row) {
  const startX = 32;
  const startY = 36;
  const spacingX = 16;
  const spacingY = 14;
  return { x: startX + col * spacingX, y: startY + row * spacingY };
}

// ELITE SPAWN RATE — base curve by stage (0 before stage 5, 3% at 5-9, 5% at 10+),
// scaled by difficulty so hard runs face more elites (more threat + more loot) and
// easy runs face fewer. Extracted from createEnemy for testability + reuse. The
// difficulty multiplier is skipped when the base is 0 so pre-stage-5 stays elite-free.
function eliteRateForStage(stage, mode) {
  const base = stage >= 10 ? 0.05 : stage >= 5 ? 0.03 : 0;
  if (base === 0) return 0;
  const dm = mode || ((typeof difficultyMode === 'string') ? difficultyMode : 'normal');
  const mul = dm === 'hard' ? 1.5 : dm === 'easy' ? 0.5 : 1;
  return base * mul;
}

// POWER-UP DROP RATE — base chance per kill (20% normal, 35% elite), shifted by
// difficulty so easy runs get more loot (helps newer pilots) and hard runs get
// less (more pressure). Floored at 5% so a drop is always possible; the kill-15
// pity force-drop still backstops unlucky streaks. Extracted for testability.
function powerUpDropRate(isElite, mode) {
  const base = isElite ? 0.35 : 0.20;
  const dm = mode || ((typeof difficultyMode === 'string') ? difficultyMode : 'normal');
  const delta = dm === 'easy' ? 0.05 : dm === 'hard' ? -0.05 : 0;
  return Math.max(0.05, base + delta);
}

function createEnemy(type, col, row, overrideX, overrideY) {
  const pos = (overrideX != null && overrideY != null)
    ? { x: overrideX, y: overrideY }
    : getFormationPos(col, row);
  // ELITE VARIANT — 3% (stage 5-9) / 5% (stage 10+) chance for formation enemies of
  // common types. Boss/shielded/UFO/golden/minibee skipped (they have native specialness).
  // Elite gets +1 HP, brighter outline, 1.5× score, and a higher power-up drop chance.
  const eliteCandidate = (type === 'bee' || type === 'butterfly' || type === 'mirror' || type === 'kamikaze');
  const stage = (game && game.stage) || 0;
  const eliteRate = eliteRateForStage(stage);
  const isElite = eliteCandidate && Math.random() < eliteRate;
  // GHOST VARIANT — stage 60+ only, 3% chance. Invisible (alpha 0.15) until first
  // hit reveals it. Awards 2× score on kill. Mutex with elite (one variant max).
  const isGhost = !isElite && stage >= 60 && Math.random() < 0.03;
  const baseHp = (type === 'boss' || type === 'shielded') ? 2 : 1;
  const _maxHp = baseHp + (isElite ? 1 : 0);
  return {
    type, col, row,
    homeX: pos.x, homeY: pos.y,
    x: pos.x, y: pos.y,
    alive: true,
    hp: _maxHp,
    maxHp: _maxHp,
    elite: isElite,
    ghost: isGhost,
    state: 'formation', // formation, entering, diving, returning, capturing
    frame: 0, frameTimer: 0,
    pathProgress: 0, pathSpeed: 0.012,
    path: null, pathSegments: null, pathSegIndex: 0,
    capturedShip: false,
    captureTimer: 0,
    diveTimer: 0,
    scored: false
  };
}

function resetGame() {
  // RUN-START COMPLETION SNAPSHOT — captured before this run begins so the
  // game-over screen can show delta from this run's progression gains.
  const _runStartCmp = (typeof computeCompositeCompletion === 'function')
    ? computeCompositeCompletion() : 0;
  // Daily mode forces the ship by date hash before we capture shipAttrs()
  if (dailyModeRequested) {
    const ds = dailyShipFor(dailySeed());
    if (ds && SHIPS[ds]) selectedShip = ds;
    // Track distinct daily-mode days
    try {
      const days = JSON.parse(localStorage.getItem('galagaDailyDays') || '[]');
      const today = String(dailySeed());
      if (!days.includes(today)) {
        days.push(today);
        if (days.length > 365) days.shift();
        localStorage.setItem('galagaDailyDays', JSON.stringify(days));
      }
      if (days.length >= 7) unlockAchievement('dailyDevotee');
      if (days.length >= 14) unlockAchievement('globetrotter');
      if (days.length >= 30) unlockAchievement('starGazer');
    } catch (e) {}
  }
  // Track ships used across sessions for the TRIPLE PILOT achievement
  try {
    const used = new Set(JSON.parse(localStorage.getItem('galagaShipsUsed') || '[]'));
    used.add(selectedShip);
    localStorage.setItem('galagaShipsUsed', JSON.stringify([...used]));
    if (used.size >= 3) unlockAchievement('triplePilot');
  } catch (e) {}
  // CHECKPOINT achievement: starting from a milestone above 1
  if ((startStageRequested || 1) > 1) unlockAchievement('checkpointUser');
  // NO SHAKE achievement: shake mode set to OFF
  if (shakeMode === 'off') unlockAchievement('noShake');
  // WORLD TRIP — used all 3 difficulty modes (track in localStorage)
  try {
    const difs = new Set(JSON.parse(localStorage.getItem('galagaDifficultiesUsed') || '[]'));
    difs.add(difficultyMode);
    localStorage.setItem('galagaDifficultiesUsed', JSON.stringify([...difs]));
    if (difs.size >= 3) unlockAchievement('worldTrip');
  } catch (e) {}
  // NIGHT OWL — playing between 22:00 and 06:00 local time
  {
    const hr = new Date().getHours();
    if (hr >= 22 || hr < 6) unlockAchievement('nightOwl');
    if (hr >= 6 && hr < 9) unlockAchievement('earlyBird');
  }
  game = {
    state: STATE.TITLE,
    stage: Math.max(1, startStageRequested || 1),

    highScore: parseInt(localStorage.getItem('galagaHigh') || '0'),

    // is per-mode (daily / challenge / normal each have their own top list).
    liveHighThreshold: ((loadTopScores(
      dailyModeRequested ? 'daily' : challengeModeRequested ? 'challenge' : 'normal'
    )[0] || {}).score) || 0,

// Returns the formation variant for the current stage:
//   'grid'    — default rectangular layout (most stages)
//   'v'       — V-shape pointing down (stage 11, 31, 51, ...)
//   'circle'  — concentric ring layout (stage 16, 36, 56, ...)
//   'diamond' — diamond/rhombus layout (stage 21 and beyond cycle)
//   'wave'    — sinusoidal staggered rows
function pickFormationVariant() {
  const s = game.stage;
  if (s < 8) return 'grid';
  const m = s % 20;
  if (m === 11) return 'v';
  if (m === 16) return 'circle';
  if (m === 1)  return 'diamond';
  if (m === 6)  return 'wave';
  return 'grid';
}

function createFormation() {
  game.enemies = [];
  game.formationVariant = pickFormationVariant();
  const shieldChance = game.stage >= 7 ? Math.min(0.30, (game.stage - 6) * 0.06) : 0;
  const splitterChance = game.stage >= 5 ? Math.min(0.25, (game.stage - 4) * 0.05) : 0;
  // WARPER chance — starts stage 8, scales up to ~20% by stage 15. Replaces a
  // small fraction of butterfly/bee picks so total enemy count stays stable.
  const warperChance = game.stage >= 8 ? Math.min(0.20, (game.stage - 7) * 0.03) : 0;
  const pickButterfly = () => Math.random() < warperChance ? 'warper'
                            : Math.random() < shieldChance ? 'shielded'
                            : 'butterfly';
  const pickBee = () => Math.random() < (warperChance * 0.6) ? 'warper'
                      : Math.random() < splitterChance ? 'splitter'
                      : 'bee';

  if (game.formationVariant === 'grid') {
    // Row 0: 4 bosses
    for (let c = 3; c <= 6; c++) game.enemies.push(createEnemy('boss', c, 0));
    // Row 1-2: 8 butterflies each
    for (let r = 1; r <= 2; r++)
      for (let c = 1; c <= 8; c++) game.enemies.push(createEnemy(pickButterfly(), c, r));
    // Row 3-4: 10 bees each
    for (let r = 3; r <= 4; r++)
      for (let c = 0; c <= 9; c++) game.enemies.push(createEnemy(pickBee(), c, r));
    return;
  }

  // Variant layouts use overrideX/overrideY. We give every entity a unique col/row tag
  // for downstream code that may key on it (entry-wave order).
  let tag = 0;
  const place = (type, x, y) => {
    const e = createEnemy(type, tag, 0, x, y);
    tag++;
    game.enemies.push(e);
  };

  if (game.formationVariant === 'v') {
    // V points downward: bosses at top corners, butterflies + bees down the sides
    const cx = BASE_W / 2;
    const topY = 32;
    const stepY = 12;
    const stepX = 12;
    place('boss', cx - 5 * stepX, topY);
    place('boss', cx + 5 * stepX, topY);
    place('boss', cx - 4 * stepX, topY + stepY);
    place('boss', cx + 4 * stepX, topY + stepY);
    for (let i = 0; i < 8; i++) {
      const y = topY + (i + 2) * stepY * 0.6;
      const dx = (3.5 - i * 0.35) * stepX;
      if (i < 5) {
        place(pickButterfly(), cx - dx, y);
        place(pickButterfly(), cx + dx, y);
      } else {
        place(pickBee(), cx - dx, y);
        place(pickBee(), cx + dx, y);
      }
    }
    // Tip of V (single bee) at bottom
    place(pickBee(), cx, topY + 10 * stepY * 0.6);
    return;
  }

  if (game.formationVariant === 'circle') {
    const cx = BASE_W / 2, cy = 70;
    // Outer ring of 12 bees
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      place(pickBee(), cx + Math.cos(a) * 56, cy + Math.sin(a) * 30);
    }
    // Middle ring of 8 butterflies
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 + Math.PI / 8;
      place(pickButterfly(), cx + Math.cos(a) * 36, cy + Math.sin(a) * 20);
    }
    // Center 4 bosses
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      place('boss', cx + Math.cos(a) * 14, cy + Math.sin(a) * 8);
    }
    return;
  }

  if (game.formationVariant === 'diamond') {
    const cx = BASE_W / 2, cy = 70;
    // Diamond rows: 1, 3, 5, 7, 9, 7, 5, 3, 1 (centered)
    const rows = [1, 3, 5, 7, 9, 7, 5, 3, 1];
    const stepY = 9;
    for (let r = 0; r < rows.length; r++) {
      const cnt = rows[r];
      const y = cy - 4 * stepY + r * stepY;
      for (let i = 0; i < cnt; i++) {
        const x = cx + (i - (cnt - 1) / 2) * 14;
        const t = r === 0 || r === rows.length - 1 ? pickBee()
                : r === 4 ? 'boss'
                : (r === 3 || r === 5) ? pickButterfly()
                : pickBee();
        place(t, x, y);
      }
    }
    return;
  }

  if (game.formationVariant === 'wave') {
    // 5 rows × 8 cols, sinusoidally offset in y
    const startX = 24;
    const stepX = 22;
    const baseY = 40;
    const stepY = 14;
    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 8; c++) {
        const x = startX + c * stepX;
        const y = baseY + r * stepY + Math.sin(c * 0.9 + r) * 6;
        const t = r === 0 ? 'boss' : r <= 2 ? pickButterfly() : pickBee();
        place(t, x, y);
      }
    }
    return;
  }
}

function setupEntryAnimation() {
  game.allEntered = false;
  game.entryWave = 0;
  game.entryTimer = 0;
  // Group enemies into entry waves
  const waves = [];
  // Wave 0: bees row 4 left half
  waves.push(game.enemies.filter(e => e.row === 4 && e.col < 5));
  // Wave 1: bees row 4 right half
  waves.push(game.enemies.filter(e => e.row === 4 && e.col >= 5));
  // Wave 2: bees row 3 left half
  waves.push(game.enemies.filter(e => e.row === 3 && e.col < 5));
  // Wave 3: bees row 3 right half
  waves.push(game.enemies.filter(e => e.row === 3 && e.col >= 5));
  // Wave 4: butterflies row 2
  waves.push(game.enemies.filter(e => e.row === 2));
  // Wave 5: butterflies row 1
  waves.push(game.enemies.filter(e => e.row === 1));
  // Wave 6: bosses
  waves.push(game.enemies.filter(e => e.row === 0));

  // Spiral entry on stage 18+ with 35% chance — replaces the side-curve Bezier with a center-spiral.
  const useSpiral = game.stage >= 18 && Math.random() < 0.35
    && game.formationVariant !== 'circle' && game.formationVariant !== 'diamond';
  game.entrySpiral = useSpiral;
  let totalIdx = 0;
  waves.forEach((wave, wi) => {
    wave.forEach((e, i) => {
      e.state = 'entering';
      if (useSpiral) {
        e.spiralEntry = true;
        e.spiralDir = (totalIdx % 2 === 0) ? 1 : -1;
        e.spiralStartAngle = (totalIdx / Math.max(1, game.enemies.length)) * Math.PI * 2;
        // Start point on the spiral's outermost angle (will be updated each frame)
        e.x = BASE_W/2 + Math.cos(e.spiralStartAngle) * 90;
        e.y = BASE_H/2 - 20 + Math.sin(e.spiralStartAngle) * 90 * 0.65;
      } else {
        e.spiralEntry = false;
        e.x = wi % 2 === 0 ? -10 : BASE_W + 10;
        e.y = -10 - i * 8;
        const side = wi % 2 === 0 ? 1 : -1;
        e.path = createEntryPath(e.x, e.y, e.homeX, e.homeY, side);
      }
      e.pathProgress = 0;
      e.pathSpeed = 0.015 + game.stage * 0.001;
      e.entryDelay = wi * 50 + i * 6;
      totalIdx++;
    });
  });
}

function setupChallengingStage() {
  game.challengeHits = 0;
  game.challengeTotal = 0;
  game.challengeWaves = [];
  game.challengeWaveIdx = 0;
  game.challengeWaveTimer = 35; // initial telegraph for first wave
  game.challengeWaveStartFrame = 0; // wave 1 starts at stageFrames 0
  game.waveClrFlash   = new Array(8).fill(0);    // per-wave clear flash countdown (0-20)
  game.waveClrPerfect = new Array(8).fill(false); // per-wave perfect flag (no escapes)
  game.stagePerfectWaves = 0;
  game.enemies = [];
  game.enemyBullets = [];

  const numWaves = 8; // fixed: 8 waves → uniform 128 enemies/challenge stage
  const ALL_PATTERNS = ['sweep_lr', 'sweep_rl', 'pincer', 'top_down', 'diagonal', 'double_row'];

  // Shuffle once then cycle so all 6 patterns appear at least once across waves
  const shuffled = ALL_PATTERNS.slice().sort(() => Math.random() - 0.5);
  const patternOrder = [];
  while (patternOrder.length < numWaves) {
    patternOrder.push(...shuffled.slice().sort(() => Math.random() - 0.5));
  }

  const baseSpeed = 1.5 + game.stage * 0.05;
  // CHALLENGE DEPTH SCALING — base group size 8 enemies, +1 at stage 20+,
  // +2 at stage 40+. Adds 16 → 18-20 enemies per wave at deeper stages.
  const GROUP_SIZE = 8 + (game.stage >= 40 ? 2 : game.stage >= 20 ? 1 : 0);

  for (let w = 0; w < numWaves; w++) {
    const pattern = patternOrder[w];
    const numGroups = 2; // fixed: 2 sub-groups per wave → uniform 16 enemies/wave
    const wave = [];

    for (let g = 0; g < numGroups; g++) {
      const yBase = 40 + Math.random() * 110;
      const spacing = 12 + Math.random() * 2; // 12–14 px (tighter than old 18)
      const sinAmp = 20 + Math.random() * 10; // 20–30 px

      for (let i = 0; i < GROUP_SIZE; i++) {
        // Per-group: 1 boss + 3 butterflies + 4 bees
        let type;
        if (i < 1) type = 'boss';
        else if (i < 4) type = 'butterfly';
        else type = 'bee';

        const e = {
          type, alive: true, hp: type === 'boss' ? 2 : 1,
          frame: 0, frameTimer: 0,
          sinPhase: i * 0.8, sinAmp,
          pattern, state: 'challenge',
          vx: 0, vy: 0, x: 0, y: 0, baseY: 0, baseX: 0
        };

        switch (pattern) {
          case 'sweep_lr':
            e.x = -15 - i * spacing;
            e.y = yBase + g * 40;
            e.vx = baseSpeed;
            e.baseY = e.y;
            break;
          case 'sweep_rl':
            e.x = BASE_W + 15 + i * spacing;
            e.y = yBase + g * 40;
            e.vx = -baseSpeed;
            e.baseY = e.y;
            break;
          case 'pincer':
            if (g % 2 === 0) {
              e.x = -15 - i * spacing;
              e.y = yBase + g * 35;
              e.vx = baseSpeed;
            } else {
              e.x = BASE_W + 15 + i * spacing;
              e.y = yBase + (g - 1) * 35 + 20;
              e.vx = -baseSpeed;
            }
            e.baseY = e.y;
            break;
          case 'top_down': {
            const totalSlots = numGroups * GROUP_SIZE;
            const slot = g * GROUP_SIZE + i;
            e.x = 15 + slot * (BASE_W - 30) / Math.max(totalSlots - 1, 1);
            e.y = -15 - i * spacing;
            e.vy = baseSpeed;
            e.baseX = e.x;
            break;
          }
          case 'diagonal': {
            const fromLeft = g % 2 === 0;
            e.x = fromLeft ? -15 - i * spacing : BASE_W + 15 + i * spacing;
            e.y = -15 - i * spacing * 0.5;
            e.vx = fromLeft ? baseSpeed : -baseSpeed;
            e.vy = baseSpeed * 0.6;
            break;
          }
          case 'double_row':
          default:
            e.x = -15 - i * spacing;
            e.y = yBase + g * 40;
            e.vx = baseSpeed;
            e.baseY = e.y;
            break;
        }
        wave.push(e);
      }
    }

    game.challengeTotal += wave.length;
    game.challengeWaves.push(wave);
  }
}

// Boss archetype — 4-cycle visual + attack identity.
// Mapping: stage 10/50/90 → standard, 20/60/100 → horned, 30/70 → tendril, 40/80 → crystal.
// Layered ON TOP of existing super/double semantics so HP/scale/duo logic untouched.
function archetypeFor(stage) {
  const idx = Math.max(0, Math.floor(stage / BOSS_STAGE_INTERVAL) - 1);
  return ['standard', 'horned', 'tendril', 'crystal', 'phantom', 'rune'][idx % 6];
}

function makeMegaBoss(s, opts) {
  opts = opts || {};
  const baseHp = 20 + s * 3;
  return {
    x: opts.x != null ? opts.x : BASE_W / 2,
    y: 35,
    vx: (opts.vx != null ? opts.vx : (1.5 + s * 0.12)),
    maxHp: opts.hpScale ? Math.round(baseHp * opts.hpScale) : baseHp,
    hp:    opts.hpScale ? Math.round(baseHp * opts.hpScale) : baseHp,
    frame: 0,
    frameTimer: 0,
    shootTimer: opts.shootOffset || 0,
    shootInterval: opts.super
      ? Math.max(20, Math.floor((90 - s * 4) * 0.55))
      : Math.max(28, 90 - s * 4),
    spreadCount: opts.super ? 7 : (s >= 4 ? 5 : 3),
    alive: true,
    hitFlash: 0,
    dashTimer: opts.dashOffset || 0,
    dashInterval: opts.super
      ? Math.max(70, Math.floor((240 - s * 12) * 0.7))
      : Math.max(90, 240 - s * 12),
    dashing: false,
    dashVy: 0,
    phase2: false,
    phase3: false,
    super: !!opts.super,
    scale: opts.super ? 1.5 : 1,
    archetype: opts.archetype || archetypeFor(s),
    sigTimer: 0
  };
}

function setupBossStage() {
  const s = game.stage;
  game.bossStartFrame = game.runFrames || 0;
  game.megaBosses = [];
  // Reset one-shot BOSS HP CRITICAL threshold flags per boss encounter
  game._boss25Crossed = false;
  game._boss10Crossed = false;
  // Stage 30+: single SUPER boss (1.5× scale, 2.5× HP, faster everything)
  if (s >= 30) {
    game.megaBosses.push(makeMegaBoss(s, { super: true, hpScale: 2.5, vx: 1.7 + s * 0.10 }));
  } else if (s >= 20) {
    // Stage 20-29: two bosses with split positions, lower per-boss HP for fairness
    game.megaBosses.push(makeMegaBoss(s, { x: BASE_W * 0.32,  vx:  1.5 + s * 0.10, hpScale: 0.65 }));
    game.megaBosses.push(makeMegaBoss(s, { x: BASE_W * 0.68,  vx: -1.5 - s * 0.10, hpScale: 0.65, shootOffset: Math.floor((90 - s * 4) / 2), dashOffset: Math.floor((240 - s * 12) / 2) }));
  } else {
    game.megaBosses.push(makeMegaBoss(s));
  }
}

function updateBossStage() {
  const bosses = (game.megaBosses || []).filter(mb => mb.alive);
  if (bosses.length === 0) return;
  for (const mb of bosses) updateOneMegaBoss(mb);
}

function updateOneMegaBoss(mb) {
  // Phase telegraph at 50% HP — boss briefly freezes with red flash before phase 2 hits at 40%
  if (!mb.phaseTelegraphed && !mb.phase2 && mb.hp <= mb.maxHp * 0.5) {
    mb.phaseTelegraphed = true;
    mb.telegraphFrames = 30;
    game.flashTimer = 8;
    game.flashColor = COL.red;
    playSound('bossWarning');
    rumble(180, 0.55, 0.3);
  }
  // Telegraph freeze: skip movement / shoot / dash but allow bullet hits to register
  const frozen = mb.telegraphFrames > 0;
  if (frozen) {
    mb.telegraphFrames--;
    mb.hitFlash = 4;
  }

  // Phase 2 trigger at 40% HP — METAMORPHOSIS: boss morphs to a new archetype with
  // a different signature attack pattern. Visual cinematic: brief freeze, ring burst at
  // boss center, "TRANSFORMING!" text, BGM cut over to bossEnrage.
  // metamorphFor: standard → horned → tendril → crystal → standard cycle. New form
  // means new color, new decorations, and a new signature pattern (split/sweep/fragment).
  if (!frozen && !mb.phase2 && mb.hp <= mb.maxHp * 0.4) {
    mb.phase2 = true;
    mb.vx *= 1.5;
    mb.shootInterval = Math.max(18, Math.floor(mb.shootInterval * 0.6));
    // Full 6-archetype morph cycle so phantom/rune bosses metamorphose into the
    // next class instead of falling back to horned (the old 4-key map dead-ended).
    const morphMap = { standard: 'horned', horned: 'tendril', tendril: 'crystal', crystal: 'phantom', phantom: 'rune', rune: 'standard' };
    const oldArc = mb.archetype || 'standard';
    mb.archetype = morphMap[oldArc] || 'horned';
    mb.sigTimer = 0; // reset signature timer so the NEW signature lands soon
    mb.telegraphFrames = 24; // brief metamorphosis freeze
    startBGM('bossEnrage');
    game.flashTimer = 12;
    game.flashColor = '#fff';
    game.shakeTimer = Math.max(game.shakeTimer || 0, 14);
    // Visual: ring burst centered on boss + transforming text
    for (let r = 0; r < 14; r++) {
      const a = (r / 14) * Math.PI * 2;
      const dist = 18;
      game.itemBursts.push({
        x: mb.x + Math.cos(a) * dist,
        y: mb.y + Math.sin(a) * dist,
        life: -r, color: '#fff'
      });
    }
    game.floatTexts.push({
      x: mb.x, y: mb.y - 26, text: 'TRANSFORMING!',
      color: '#f44', life: 60, maxLife: 60, size: 9
    });
    game.floatTexts.push({
      x: mb.x, y: mb.y - 16, text: mb.archetype.toUpperCase(),
      color: '#fc4', life: 60, maxLife: 60, size: 7
    });
    game.cinematicBars = Math.max(game.cinematicBars || 0, 60);
    playSound('milestoneStage');
    rumble(420, 0.95, 0.6);
    // TAUNT: phase 2 entry — use the NEW archetype's voice (boss has just morphed)
    triggerBossTaunt(mb, 'phase2');
    // GUARDIAN VARIANT — boss METAMORPHOSIS calls in a gold SUPPORT drone for the player.
    // One-shot per stage (boss is already one-shot phase2 trigger).
    if (typeof spawnGuardian === 'function') spawnGuardian('support');
  }

  // TAUNT: low HP threshold (25%) — boss recognizes imminent defeat
  if (!frozen && mb.alive && !mb.lowHpTaunted && mb.hp <= mb.maxHp * 0.25) {
    mb.lowHpTaunted = true;
    triggerBossTaunt(mb, 'lowHp');
  }

  // PHASE 3 RAGE trigger at 15% HP — final-stand escalation. Speed and fire rate
  // bump (stacks on phase 2), red telegraph flash, "RAGE!" banner, archetype-specific
  // FINAL STAND taunt. Tracks 'rageColor' for renderer to apply pulsing red outline.
  if (!frozen && mb.alive && !mb.phase3 && mb.phase2 && mb.hp <= mb.maxHp * 0.15) {
    mb.phase3 = true;
    mb.vx *= 1.2;
    mb.shootInterval = Math.max(14, Math.floor(mb.shootInterval * 0.8));
    mb.telegraphFrames = 18; // brief pause before rage attacks land
    game.flashTimer = Math.max(game.flashTimer || 0, 10);
    game.flashColor = '#f44';
    game.shakeTimer = Math.max(game.shakeTimer || 0, 12);
    // 12-spoke crimson ring burst centered on boss
    for (let r = 0; r < 12; r++) {
      const a = (r / 12) * Math.PI * 2;
      game.itemBursts.push({
        x: mb.x + Math.cos(a) * 14,
        y: mb.y + Math.sin(a) * 14,
        life: -r, color: '#f44'
      });
    }
    if (game.shockwaves) {
      game.shockwaves.push({
        x: mb.x, y: mb.y, life: 0, maxLife: 30, maxR: 36, color: '#f44'
      });
    }
    game.floatTexts.push({
      x: mb.x, y: mb.y - 28, text: 'RAGE!',
      color: '#f44', life: 70, maxLife: 70, size: 12
    });
    game.cinematicBars = Math.max(game.cinematicBars || 0, 40);
    playSound('bossWarning');
    rumble(380, 0.95, 0.55);
    triggerBossTaunt(mb, 'finalStand');
    if (typeof pushIntercept === 'function') pushIntercept('bossRage');
  }

  // Horizontal patrol
  if (!frozen && !mb.dashing) {
    mb.x += mb.vx;
    if (mb.x > BASE_W - 20) { mb.x = BASE_W - 20; mb.vx = -Math.abs(mb.vx); }
    if (mb.x < 20)           { mb.x = 20;           mb.vx =  Math.abs(mb.vx); }
  }

  // Dash attack: telegraph → dive toward player → return
  if (!frozen) mb.dashTimer++;
  const TELEGRAPH = 30;
  mb.telegraphing = !frozen && !mb.dashing && game.playerAlive
    && mb.dashTimer >= mb.dashInterval - TELEGRAPH
    && mb.dashTimer < mb.dashInterval;
  if (!frozen && !mb.dashing && mb.dashTimer >= mb.dashInterval && game.playerAlive) {
    mb.dashTimer = 0;
    mb.dashing = true;
    mb.telegraphing = false;
    mb.dashVy = 2.8 + game.stage * 0.08;
    mb.dashTargetX = game.playerX; // remember x for warning indicator
    // TAUNT: dash dive — only on the FIRST dash to avoid spammy chatter every dash cycle
    if (!mb.dashTaunted) {
      mb.dashTaunted = true;
      triggerBossTaunt(mb, 'dash');
    }
  }
  if (!frozen && mb.dashing) {
    mb.y += mb.dashVy;
    if (mb.dashVy > 0 && mb.y > BASE_H * 0.65) mb.dashVy = -(mb.dashVy * 1.1);
    if (mb.dashVy < 0 && mb.y <= 35) {
      mb.y = 35;
      mb.dashing = false;
      mb.dashVy = 0;
    }
  }

  // Animate (faster in phase 2)
  mb.frameTimer++;
  const frameSpeed = mb.phase2 ? 4 : 8;
  if (mb.frameTimer >= frameSpeed) { mb.frame = (mb.frame + 1) % 2; mb.frameTimer = 0; }
  // Taunt life + cooldown tick (PAUSED check unnecessary — updateOneMegaBoss only
  // runs in BOSS_STAGE, which freezes via the same outer state guard)
  if ((mb.tauntLife || 0) > 0) mb.tauntLife--;
  if ((mb.tauntCooldown || 0) > 0) mb.tauntCooldown--;

  // Shoot spread (or rotating spiral burst at stage 12+)
  if (!frozen && game.playerAlive) {
    mb.shootTimer++;
    if (mb.shootTimer >= mb.shootInterval) {
      mb.shootTimer = 0;
      mb.shotCount = (mb.shotCount || 0) + 1;
      // Every 4th shot at stage 12+ becomes a spiral
      if (game.stage >= 12 && mb.shotCount % 4 === 0) {
        mb.spiralRemaining = 8;
        mb.spiralAngleStart = (mb.spiralAngle || 0);
        mb.spiralAngle = (mb.spiralAngle || 0) + 0.5;
        playSound('enemyDive');
      } else {
        const count = mb.spreadCount;
        const step = count > 1 ? 0.45 : 0;
        const start = -step * (count - 1) / 2;
        // Capped boss aim speed (1.5 base, +stage scaling, max 2.7)
        const bSpeed = Math.min(2.7, 1.5 + game.stage * 0.03) * diffSpeedMul();
        for (let k = 0; k < count; k++) {
          const offset = start + step * k;
          const dx = game.playerX - mb.x, dy = game.playerY - mb.y;
          const len = Math.sqrt(dx*dx + dy*dy) || 1;
          const bvx = (dx/len) * bSpeed, bvy = (dy/len) * bSpeed;
          const cos = Math.cos(offset), sin = Math.sin(offset);
          game.enemyBullets.push({
            x: mb.x, y: mb.y + 8,
            vx: bvx * cos - bvy * sin,
            vy: bvx * sin + bvy * cos,
            kind: 'mega'
          });
        }
      }
    }
    // Spiral fire — emit 1 bullet per frame for 8 frames at increasing angle
    if (mb.spiralRemaining && mb.spiralRemaining > 0) {
      const k = 8 - mb.spiralRemaining;
      const a = mb.spiralAngleStart + (k / 8) * Math.PI * 2;
      const bSpeed = Math.min(2.0, 1.1 + game.stage * 0.02) * diffSpeedMul();
      game.enemyBullets.push({
        x: mb.x, y: mb.y + 8,
        vx: Math.cos(a) * bSpeed,
        vy: Math.sin(a) * bSpeed,
        kind: 'spiral'
      });
      mb.spiralRemaining--;
    }
    // SIGNATURE PATTERNS — archetype-specific attacks fire on their own timer, layered
    // ON TOP of base aimed/spiral. Periodicity tuned so they don't dominate gameplay
    // (one signature ~ every 4-5 seconds at stage 10, faster as stage scales).
    mb.sigTimer = (mb.sigTimer || 0) + 1;
    const sigInterval = Math.max(120, 240 - game.stage * 4);
    // MISSILE LOCK INDICATOR — within the final 18 frames before a signature fires,
    // mark the boss as locking on. drawHUD reads this to render a crosshair on the
    // player. One-shot lock-on tick: play 'tick' sfx when entering the lock window.
    if (!frozen && mb.sigTimer >= sigInterval - 18 && mb.sigTimer < sigInterval) {
      if (!mb.sigLocking) {
        mb.sigLocking = true;
        playSound('tick');
      }
    } else {
      mb.sigLocking = false;
    }
    if (!frozen && mb.sigTimer >= sigInterval) {
      mb.sigTimer = 0;
      if (mb.archetype === 'horned') {
        // SPLIT SHOT — single fast bullet that splits into 3 fan after 28 frames
        const dx0 = game.playerX - mb.x, dy0 = game.playerY - mb.y;
        const len0 = Math.sqrt(dx0*dx0 + dy0*dy0) || 1;
        const sp = Math.min(2.4, 1.4 + game.stage * 0.025) * diffSpeedMul();
        game.enemyBullets.push({
          x: mb.x, y: mb.y + 8,
          vx: (dx0 / len0) * sp,
          vy: (dy0 / len0) * sp,
          kind: 'mega',
          splitAt: 28,
          splitFan: 0.45,
          splitSpeed: sp
        });
        playSound('enemyDive');
      } else if (mb.archetype === 'tendril') {
        // LASER SWEEP — wide horizontal beam (4 bullets along horizontal line, slow)
        const sp = Math.min(1.5, 0.9 + game.stage * 0.012) * diffSpeedMul();
        for (let k = -2; k <= 2; k++) {
          game.enemyBullets.push({
            x: mb.x + k * 6, y: mb.y + 10,
            vx: 0, vy: sp,
            kind: 'spiral'
          });
        }
        playSound('enemyDive');
      } else if (mb.archetype === 'crystal') {
        // FRAGMENT BURST — 6-shot quick fan all aimed at player (denser than base aimed spread)
        const dx0 = game.playerX - mb.x, dy0 = game.playerY - mb.y;
        const len0 = Math.sqrt(dx0*dx0 + dy0*dy0) || 1;
        const sp = Math.min(2.0, 1.2 + game.stage * 0.02) * diffSpeedMul();
        const baseAng = Math.atan2(dy0, dx0);
        for (let k = -2; k <= 3; k++) {
          const a = baseAng + k * 0.18;
          game.enemyBullets.push({
            x: mb.x, y: mb.y + 8,
            vx: Math.cos(a) * sp,
            vy: Math.sin(a) * sp,
            kind: 'mega'
          });
        }
        playSound('enemyDive');
      } else if (mb.archetype === 'rune') {
        // GLYPH VOLLEY — 4 bullets in a slowly-rotating cross (cardinal ward).
        // Distinct from aimed (horned/crystal) and sweep (tendril): a spinning
        // omni-directional pattern that fills space rather than tracking. Brings
        // rune to signature parity with the other classes (was attack-less).
        const sp = Math.min(1.8, 1.1 + game.stage * 0.018) * diffSpeedMul();
        mb.runeSpin = (mb.runeSpin || 0) + 0.4;
        for (let k = 0; k < 4; k++) {
          const a = mb.runeSpin + k * (Math.PI / 2);
          game.enemyBullets.push({
            x: mb.x, y: mb.y + 6,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            kind: 'spiral'
          });
        }
        playSound('enemyDive');
      }
      // 'standard' archetype gets no signature — keeps it as the base experience.
      // 'phantom' has no bullet signature by design — its identity is the phase-2
      // teleport (evasion), handled in the phase-2 block below.
    }

    // Phase-2 ring burst — every ~3 seconds, fire 8 bullets in a 360° ring (mega/spiral kind alternate)
    if (mb.phase2 && !frozen) {
      mb.ringTimer = (mb.ringTimer || 0) + 1;
      if (mb.ringTimer >= 180) {
        mb.ringTimer = 0;
        const ringSpeed = Math.min(1.8, 1.0 + game.stage * 0.015) * diffSpeedMul();
        const ringCount = 8;
        const offsetA = Math.random() * Math.PI / ringCount;
        for (let r = 0; r < ringCount; r++) {
          const a = (r / ringCount) * Math.PI * 2 + offsetA;
          game.enemyBullets.push({
            x: mb.x, y: mb.y + 4,
            vx: Math.cos(a) * ringSpeed,
            vy: Math.sin(a) * ringSpeed,
            kind: 'spiral'
          });
        }
        playSound('enemyDive');
      }
      // PHANTOM teleFlash tick
      if ((mb.teleFlash || 0) > 0) mb.teleFlash--;
      // PHANTOM archetype — periodic teleport during phase 2. Every ~5 seconds
      // the boss vanishes for 6 frames (invincibility), re-spawns at a new x
      // position avoiding the player ±40 corridor. Visual: 2 explosion puffs at
      // depart + arrive sites, plus brief invincibility flash.
      if (mb.archetype === 'phantom') {
        mb.teleTimer = (mb.teleTimer || 0) + 1;
        if (mb.teleTimer >= 300) {
          mb.teleTimer = 0;
          const oldX = mb.x;
          // Find new x avoiding player corridor (±40)
          const pX = game.playerX || BASE_W / 2;
          let nx;
          for (let tries = 0; tries < 6; tries++) {
            nx = 30 + Math.random() * (BASE_W - 60);
            if (Math.abs(nx - pX) >= 40) break;
          }
          mb.x = nx;
          mb.teleFlash = 12;
          // Depart + arrive puffs
