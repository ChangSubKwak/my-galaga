  if (slide >= 1 && game.lvl && !game.activeSynergy) {
    const lvS = game.lvl.S || 1, lvN = game.lvl.N || 1, lvP = game.lvl.P || 1;
    // Compute distances; only show if very close (need ≤2 total upgrades)
    const distOverload = Math.max(0, 5 - lvS) + Math.max(0, 3 - lvN) + Math.max(0, 3 - lvP);
    const distBlink    = Math.max(0, 5 - lvS) + Math.max(0, lvN - 1) + Math.max(0, lvP - 1);
    const distHeavy    = Math.max(0, lvS - 1) + Math.max(0, lvN - 1) + Math.max(0, 3 - lvP);
    let closest = null, closeName = '', closeDist = 99;
    if (distOverload < closeDist) { closest = 'OVERLOAD'; closeDist = distOverload; closeName = 'OVERLOAD'; }
    if (distBlink < closeDist)    { closest = 'BLINK';    closeDist = distBlink;    closeName = 'BLINK'; }
    if (distHeavy < closeDist)    { closest = 'HEAVY';    closeDist = distHeavy;    closeName = 'HEAVY'; }
    if (closest && closeDist > 0 && closeDist <= 2) {
      const sCol = closest === 'OVERLOAD' ? '#fc4' : closest === 'BLINK' ? '#0ff' : '#f8a';
      drawRetroText(closeName + ' IN ' + closeDist + ' MORE', BASE_W/2, BASE_H - 52, 4, sCol);
    }
  }

  // POWER CARRY-OVER — small S/N/P readout + active WEAPON SYNERGY label so the
  // player can plan pickup priorities for the new stage from the intro alone.
  // Drawn above the pilot quote band, fades in with same slide timing.
  if (slide >= 1 && game.lvl) {
    const lvS = game.lvl.S || 1, lvN = game.lvl.N || 1, lvP = game.lvl.P || 1;
    const synergyLabel = game.activeSynergy
                       ? game.activeSynergy
                       : null;
    const synergyCol = synergyLabel === 'OVERLOAD' ? '#fc4'
                     : synergyLabel === 'BLINK'    ? '#0ff'
                     : synergyLabel === 'HEAVY'    ? '#f8a' : '#888';
    const pcY = BASE_H - 44;
    drawRetroText('POWER', BASE_W/2 - 36, pcY, 5, '#888', 'left');
    // S / N / P with type-specific colors. MAX cap: gold pulse on letter.
    const _sMax = lvS >= MAX_POWER_LVL.S, _nMax = lvN >= MAX_POWER_LVL.N, _pMax = lvP >= MAX_POWER_LVL.P;
    const _maxPulse = (game.animFrame >> 3) % 2 === 0 ? '#fc4' : '#fff';
    drawRetroText('S' + lvS, BASE_W/2 - 10, pcY, 6, _sMax ? _maxPulse : '#f44', 'left');
    drawRetroText('N' + lvN, BASE_W/2 + 4,  pcY, 6, _nMax ? _maxPulse : '#0ff', 'left');
    drawRetroText('P' + lvP, BASE_W/2 + 18, pcY, 6, _pMax ? _maxPulse : '#f6f', 'left');
    // POWER MAX INDICATOR — small "MAX" label when all three caps reached
    if (_sMax && _nMax && _pMax) {
      const _mxBlink = (game.animFrame >> 2) % 2 === 0 ? '#fc4' : '#fff';
      drawRetroText('MAX', BASE_W/2 + 33, pcY, 5, _mxBlink, 'left');
    }
    if (synergyLabel) {
      const synBlink = (game.animFrame >> 2) % 2 === 0 ? synergyCol : '#fff';
      drawRetroText(synergyLabel + ' BUILD', BASE_W/2, pcY + 7, 5, synBlink);
    }
  }

  // STAGE 100+ ENDLESS BANNER — major milestone in endless mode. Stage 100/150/200
  // get a special "ENDLESS LEGEND" gold blink at top so the player knows they
  // crossed a marathon threshold beyond the canonical 80-stage arc.
  if (slide >= 1 && (game.stage === 100 || game.stage === 150 || game.stage === 200)) {
    const eb = (game.animFrame >> 2) % 2 === 0;
    drawRetroText('★ ENDLESS LEGEND ★', BASE_W/2, 18, 7, eb ? '#fc4' : '#fff');
    drawRetroText('STAGE ' + game.stage, BASE_W/2, 27, 5, '#888');
  }

  // BOSS APPROACH WARNING — when this stage's clear will be followed by a boss
  // stage, paint a small red 'BOSS NEXT' tag near the bottom-center of the intro.
  if (isBossNext && slide >= 1) {
    const blink = (game.animFrame >> 2) % 2 === 0;
    drawRetroText('BOSS NEXT', BASE_W/2, BASE_H - 38, 6, blink ? '#f44' : '#fff');
    // BOSS NAME PREVIEW — surface upcoming boss name just below the BOSS NEXT
    // tag so the player can mentally prep for the archetype/personality.
    if (typeof bossNameFor === 'function') {
      const _bn = bossNameFor(game.stage + 1);
      if (_bn) drawRetroText(_bn, BASE_W/2, BASE_H - 30, 5, '#fc8');
    }
  } else if (slide >= 1 && !isBoss && !isChallenge
      && (game.stage + 1) % BOSS_STAGE_INTERVAL !== 0
      && (game.stage + 1) % 4 === 0) {
    // CHALLENGE NEXT — next stage is a challenging stage (every 4 except boss)
    const _cnBlink = (game.animFrame >> 2) % 2 === 0;
    drawRetroText('CHALLENGE NEXT', BASE_W/2, BASE_H - 38, 5, _cnBlink ? '#f6f' : '#fff');
  } else if (slide >= 1 && !isBoss && !isChallenge) {
    // CHALLENGE-IN-N PEEK — when next challenge is 2-4 stages away, show small
    // dim 'CHALL IN N' label. Helps planning + sustaining no-death runs.
    let _cInN = 0;
    for (let _s = game.stage + 1; _s < game.stage + 5; _s++) {
      if (_s % BOSS_STAGE_INTERVAL === 0) break;
      if (_s % 4 === 0) { _cInN = _s - game.stage; break; }
    }
    if (_cInN >= 2 && _cInN <= 4) {
      drawRetroText('CHALL IN ' + _cInN, BASE_W/2, BASE_H - 38, 4, '#888');
    }
  }

  // BOSS COUNTDOWN PEEK — when next boss is 2-9 stages away, show dim
  // "BOSS IN N" tag so the player can plan power-up retention. Lives at
  // y = BASE_H - 30 so it doesn't conflict with BOSS NEXT / CHALL NEXT at -38.
  if (slide >= 1 && !isBoss && !isBossNext) {
    const _nextBossS = Math.ceil((game.stage + 1) / BOSS_STAGE_INTERVAL) * BOSS_STAGE_INTERVAL;
    const _bossIn = _nextBossS - game.stage;
    if (_bossIn >= 2 && _bossIn <= 9 && _nextBossS <= 80) {
      const _biCol = _bossIn <= 2 ? '#fc8' : _bossIn <= 5 ? '#fc4' : '#888';
      drawRetroText('BOSS IN ' + _bossIn, BASE_W/2, BASE_H - 30, 4, _biCol);
    }
  }

  // STAGE INTRO MARATHON PROGRESS — when no-death stage streak ≥ 2, show
  // current streak + distance to next milestone (5/10/20). Encourages
  // preservation by making progress visible at stage entry.
  if (slide >= 1 && (game.zenStreak || 0) >= 2) {
    const zs = game.zenStreak;
    const nextMilestone = zs < 5 ? 5 : zs < 10 ? 10 : zs < 20 ? 20 : null;
    const label = nextMilestone
                ? 'MARATHON x' + zs + ' → x' + nextMilestone
                : 'MARATHON x' + zs;
    drawRetroText(label, BASE_W/2, BASE_H - 28, 4, '#fc4');
  }

  // PERK COUNTDOWN — show how many stages until the next boss (= next perk
  // pick opportunity). Useful for planning around expiring perks/build state.
  if (slide >= 1 && !isBoss && game.stage > 0 && game.stage < 80) {
    const nextBoss = Math.ceil(game.stage / 10) * 10;
    const distance = nextBoss - game.stage;
    if (distance > 0 && distance <= 5) {
      drawRetroText('PERK IN ' + distance + ' STAGE' + (distance === 1 ? '' : 'S'),
        BASE_W/2, BASE_H - 60, 4, '#888');
    }
  }

  // STAGE INTRO ACTIVE PERK — if a perk is currently active (from prior boss),
  // surface it in the intro so the player knows their build going into the
  // next stage. Reminder fades in with the rest of the intro content.
  if (game.activePerk && PERKS[game.activePerk] && slide >= 1) {
    const _activePerk = PERKS[game.activePerk];
    drawRetroText('PERK: ' + _activePerk.name, BASE_W/2, BASE_H - 18, 4, _activePerk.col);
  }
  // COUNTDOWN SECONDS — last ~1.5s of STAGE_INTRO countdown shown as 3/2/1
  // bottom-center. Helps signal mission-imminent.
  if (slide >= 1 && game.stageTimer > 0 && game.stageTimer <= 90) {
    const _csNum = Math.ceil(game.stageTimer / 30);
    const _csCol = _csNum === 1 ? '#fc4' : _csNum === 2 ? '#ff8' : '#888';
    drawRetroText(String(_csNum), BASE_W/2, BASE_H - 16, 9, _csCol);
  }
  // PREV DEATH WARNING — if any of last 3 memorial entries died on this stage,
  // show small 'PREV DEATH HERE' red label. Encourages caution at danger stages.
  if (slide >= 1) {
    try {
      const _memRaw = localStorage.getItem('galagaDeathMemorials') || '[]';
      const _mem = JSON.parse(_memRaw);
      if (Array.isArray(_mem)) {
        const _recent = _mem.slice(0, 3);
        if (_recent.some(m => m && m.stage === game.stage)) {
          const _pdBl = (game.animFrame >> 3) % 2 === 0;
          drawRetroText('PREV DEATH HERE', BASE_W/2, BASE_H - 50, 5,
                        _pdBl ? '#f44' : '#f88');
        }
      }
    } catch (e) {}
  }
  // CYCLE DOTS — 10-dot row showing position within current boss cycle.
  // Pos 0 = just-after-boss (stage 1/11/21...), pos 9 = next boss.
  // Dot colors: current = bright stage type col, past = dim, future = ghost.
  if (slide >= 1) {
    const _cycPos = (game.stage - 1) % BOSS_STAGE_INTERVAL;
    const _dotY = BASE_H - 28;
    const _dotW = 5, _gap = 1;
    const _totalW = BOSS_STAGE_INTERVAL * (_dotW + _gap) - _gap;
    const _startX = BASE_W/2 - _totalW/2;
    ctx.save();
    for (let i = 0; i < BOSS_STAGE_INTERVAL; i++) {
      const _x = _startX + i * (_dotW + _gap);
      const _stg = game.stage - _cycPos + i;
      const _isBoss = (i === BOSS_STAGE_INTERVAL - 1);
      const _isChall = (i + 1) % 4 === 0 && !_isBoss;
      const _isPast = i < _cycPos;
      const _isCur = i === _cycPos;
      let _col = '#444';
      if (_isCur) _col = _isBoss ? '#f44' : _isChall ? '#f6f' : '#0cf';
      else if (_isPast) _col = '#666';
      else if (_isBoss) _col = '#823';
      else if (_isChall) _col = '#525';
      ctx.globalAlpha = _isCur ? 0.95 : _isPast ? 0.55 : 0.40;
      ctx.fillStyle = _col;
      const _sz = _isCur ? 3 : 2;
      ctx.fillRect(_x + (_dotW - _sz)/2, _dotY + (_dotW - _sz)/2, _sz, _sz);
    }
    ctx.restore();
  }

  // STAGE INTRO MISSION REMINDER — daily mode shows today's mission status at the
  // very bottom so it reads as the last thing before the countdown. Only when a
  // mission is active and incomplete; auto-hides on completion.
  if (game.dailyMode && typeof dailyMission === 'function'
      && !game._dailyMissionFired
      && !(typeof isDailyMissionDoneToday === 'function' && isDailyMissionDoneToday())
      && slide >= 1) {
    const m = dailyMission();
    if (m) {
      ctx.save();
      ctx.globalAlpha = 0.85;
      // PROGRESS APPEND — small live progress fraction after the mission label
      const _pStr = (typeof m.progress === 'function') ? m.progress(game) : '';
      const _txt = _pStr ? ('TODAY: ' + m.label + '  ' + _pStr) : ('TODAY: ' + m.label);
      drawRetroText(_txt, BASE_W/2, BASE_H - 8, 4, '#f6f');
      ctx.restore();
    }
  }

  // PILOT QUOTE — narrative texture for normal stages (no boss, no transmission log).
  // Drawn near bottom in muted grey so it reads as marginal flavor, not a directive.
  // Fades in over first 30 frames then holds.
  if (game.stageQuote && !log && slide >= 1) {
    const qElapsed = Math.max(0, elapsed - 24);
    const qFade = Math.min(1, qElapsed / 30);
    ctx.save();
    ctx.globalAlpha = qFade * 0.85;
    drawRetroText('— ' + game.stageQuote + ' —', BASE_W/2, BASE_H - 28, 5, '#aaa');
    ctx.restore();
  }

  // Countdown for the last 60 frames: 3 → 2 → 1 → GO!
  // Each digit lasts 20 frames; "GO!" appears as timer hits 0 (handled by stage start).
  if (slide >= 1 && game.stageTimer <= 60) {
    let digit, digitCol, digitTimer;
    if (game.stageTimer > 40)      { digit = '3'; digitCol = '#0f8'; digitTimer = 60 - game.stageTimer; }
    else if (game.stageTimer > 20) { digit = '2'; digitCol = '#ff4'; digitTimer = 40 - game.stageTimer; }
    else                            { digit = '1'; digitCol = '#f44'; digitTimer = 20 - game.stageTimer; }
    // Backdrop tint flash when a new digit begins (first 4 frames of each)
    if (digitTimer < 4) {
      ctx.save();
      ctx.globalAlpha = (4 - digitTimer) / 4 * 0.10;
      ctx.fillStyle = digitCol;
      ctx.fillRect(0, 0, BASE_W, BASE_H);
      ctx.restore();
    }
    // Pop-in scale animation: scale up from 0.4× → 1.2× over first 6 frames, settle to 1.0×
    const scale = digitTimer < 6 ? 0.4 + (digitTimer / 6) * 0.8 : 1.0 + Math.max(0, (12 - digitTimer)) * 0.02;
    ctx.save();
    const cx = BASE_W/2, cy = BASE_H/2 + 22;
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.shadowColor = digitCol;
    ctx.shadowBlur = 16;
    drawRetroText(digit, 0, 0, 24, digitCol);
    ctx.restore();
    // Concentric pulse ring fading out
    const ringR = digitTimer * 4;
    if (digitTimer < 14) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - digitTimer / 14) * 0.6;
      ctx.strokeStyle = digitCol;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(BASE_W/2, BASE_H/2 + 22, ringR, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  } else if (slide >= 1) {
    // READY pulses for the early portion
    const readyPulse = (Math.floor(elapsed / 15)) % 2 === 0;
    if (readyPulse) drawRetroText('READY', BASE_W/2, BASE_H/2 + 18, 12, COL.yellow);
  }

  // Subtype hint (boss → boss icon, challenge → swirl, normal → enemies row)
  // NEW THREAT warning takes precedence on debut stages
  const NEW_THREATS = {
    3:  { name: 'KAMIKAZE',       draw: (x, y) => drawKamikaze(x, y, game.animFrame >> 3) },
    4:  { name: 'UFO',            draw: (x, y) => drawUFO(x, y, game.animFrame >> 2) },
    5:  { name: 'SPLITTER',       draw: (x, y) => drawSplitter(x, y, game.animFrame >> 4) },
    6:  { name: 'GOLDEN BEE',     draw: (x, y) => drawGoldenBee(x, y, game.animFrame >> 4) },
    7:  { name: 'SHIELDED',       draw: (x, y) => drawShielded(x, y, game.animFrame >> 4, 2) },
    11: { name: 'HOVERER',        draw: (x, y) => drawHoverer(x, y, game.animFrame >> 1) },
    13: { name: 'MIRROR CLONE',   draw: (x, y) => drawMirror(x, y, game.animFrame >> 4) },
    20: { name: 'DOUBLE BOSS',    draw: (x, y) => { drawMegaBoss(x - 18, y, game.animFrame >> 3, false); drawMegaBoss(x + 18, y, game.animFrame >> 3, false); } },
    30: { name: 'SUPER BOSS',     draw: (x, y) => {
      ctx.save(); ctx.translate(x, y); ctx.scale(1.5, 1.5);
      drawMegaBoss(0, 0, game.animFrame >> 3, false);
      ctx.restore();
    }}
  };
  // Formation variant emblem (small schematic + caption) — shown on top-left when applicable
  if (isVariant && slide >= 1) {
    const ex = 26, ey = BASE_H/2 + 28;
    drawRetroText('FORMATION', ex, ey - 12, 6, COL.green, 'left');
    drawRetroText(variant.toUpperCase(), ex, ey - 4, 7, '#0f8', 'left');
    // Schematic
    ctx.save();
    ctx.fillStyle = '#0f8';
    const cx = ex + 14, cy = ey + 12;
    if (variant === 'v') {
      for (let i = 0; i < 5; i++) {
        ctx.fillRect(cx - 8 + i * 2, cy - 5 + i, 1, 1);
        ctx.fillRect(cx + 8 - i * 2, cy - 5 + i, 1, 1);
      }
    } else if (variant === 'circle') {
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        ctx.fillRect(cx + Math.round(Math.cos(a) * 6), cy + Math.round(Math.sin(a) * 4), 1, 1);
      }
    } else if (variant === 'diamond') {
      for (let i = -4; i <= 4; i++) {
        const w = 5 - Math.abs(i);
        for (let j = -w; j <= w; j += 2) ctx.fillRect(cx + j, cy + i, 1, 1);
      }
    } else if (variant === 'wave') {
      for (let i = 0; i < 12; i++) {
        ctx.fillRect(cx - 6 + i, cy + Math.round(Math.sin(i * 0.7) * 3), 1, 1);
      }
    }
    ctx.restore();
  }

  const threat = NEW_THREATS[game.stage];
  if (slide >= 1 && elapsed > 40) {
    if (threat) {
      // Pulsing red WARNING caption
      const blink = (game.animFrame >> 2) % 2 === 0;
      const wcol = blink ? COL.red : '#f88';
      drawRetroText('! WARNING !', BASE_W/2, BASE_H/2 + 32, 9, wcol);
      drawRetroText('NEW THREAT: ' + threat.name, BASE_W/2, BASE_H/2 + 44, 6, COL.yellow);
      // Telegraph rectangle behind the enemy
      ctx.save();
      ctx.globalAlpha = 0.18 + 0.12 * Math.sin(game.animFrame * 0.18);
      ctx.fillStyle = COL.red;
      ctx.fillRect(BASE_W/2 - 42, BASE_H/2 + 50, 84, 28);
      ctx.restore();
      threat.draw(BASE_W/2, BASE_H/2 + 64);
    } else if (isBoss) {
      // Camera-zoom effect: scale ramps up while showing boss, plus expanding shockwave rings
      const t = Math.max(0, elapsed - 40);
      const zoomT = Math.min(1, t / 40);
      const scale = 0.4 + zoomT * 1.4 + (zoomT >= 1 ? Math.sin(game.animFrame * 0.12) * 0.05 : 0);
      const cx = BASE_W/2, cy = BASE_H/2 + 60;
      // Expanding shockwave rings (only during the zoom)
      for (let r = 0; r < 3; r++) {
        const ringAge = (game.animFrame + r * 14) % 42;
        const ringR = ringAge * 1.5;
        const alpha = (1 - ringAge / 42) * 0.5;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = COL.red;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      drawMegaBoss(0, 0, game.animFrame >> 3, false);
      ctx.restore();
    } else if (isChallenge) {
      for (let i = 0; i < 3; i++) {
        const fx = BASE_W/2 + (i - 1) * 24 + Math.sin(game.animFrame * 0.1 + i) * 3;
        drawButterfly(fx, BASE_H/2 + 50, game.animFrame >> 4);
      }
    } else {
      drawBee(BASE_W/2 - 30, BASE_H/2 + 50, game.animFrame >> 4);
      drawButterfly(BASE_W/2, BASE_H/2 + 50, game.animFrame >> 4);
      drawBoss(BASE_W/2 + 30, BASE_H/2 + 50, game.animFrame >> 4, false);
    }
  }

  // Stage flags (bottom strip — count up to current stage)
  const flagsPerRow = 10;
  const totalFlags = Math.min(game.stage, 30);
  const flagW = 8;
  const flagSpacing = 9;
  const rowW = Math.min(totalFlags, flagsPerRow) * flagSpacing;
  const baseY = BASE_H - 38;
  for (let i = 0; i < totalFlags; i++) {
    const row = Math.floor(i / flagsPerRow);
    const col = i % flagsPerRow;
    const rowFlags = Math.min(totalFlags - row * flagsPerRow, flagsPerRow);
    const rowStart = BASE_W/2 - (rowFlags * flagSpacing) / 2 + flagSpacing / 2;
    const fx = rowStart + col * flagSpacing - flagW / 2;
    const fy = baseY + row * 11;
    // Pole
    ctx.fillStyle = '#888';
    ctx.fillRect(fx, fy, 1, 9);
    // FLAG ROW TIER — boss stages (every 10th) get a split red/black flag with
    // skull dot. Milestone stages (every 5th, not boss) get gold. Others red/blue.
    const stageN = i + 1;
    const isBossFlag = stageN % 10 === 0;
    const isGold = !isBossFlag && stageN % 5 === 0;
    if (isBossFlag) {
      // Boss flag: top half red, bottom half black, white center dot (skull)
      ctx.fillStyle = COL.red;
      ctx.fillRect(fx + 1, fy, flagW - 2, 2);
      ctx.fillStyle = '#000';
      ctx.fillRect(fx + 1, fy + 2, flagW - 2, 2);
      // White skull dot
      ctx.fillStyle = '#fff';
      ctx.fillRect(fx + 3, fy + 2, 1, 1);
      // Super-boss (stage 30+): add gold pip atop the pole for extra emphasis
      if (stageN >= 30) {
        ctx.fillStyle = '#fc4';
        ctx.fillRect(fx, fy - 1, 2, 1);
      }
    } else {
      ctx.fillStyle = isGold ? '#fc4' : (i % 2 === 0 ? COL.red : COL.blue);
      ctx.fillRect(fx + 1, fy, flagW - 2, 4);
      ctx.fillStyle = '#fff';
      ctx.fillRect(fx + 2, fy + 1, 1, 1);
    }
  }

  drawHUD();
}

function drawGameplay() {
  // Wave entry telegraph for challenge stages
  drawChallengeTelegraph();
  // Draw enemies
  if (game.state === STATE.CHALLENGING) {
    const wave = game.challengeWaves[game.challengeWaveIdx];
    if (wave) {
      for (const e of wave) {
        if (!e.alive) continue;
        if (e.type === 'bee') drawBee(e.x, e.y, e.frame);
        else if (e.type === 'butterfly') drawButterfly(e.x, e.y, e.frame);
        else if (e.type === 'boss') drawBoss(e.x, e.y, e.frame, e.hp < 2);
      }
    }
  } else {
    // High-stage threat aura — small magenta halo behind each enemy from stage 15 onward
    // Stronger aura at stage 30+
    const auraStage = game.stage >= 15;
    const auraStrong = game.stage >= 30;
    // FORMATION PREVIEW — faint dot at the home position of every entering enemy
    // so the player can read the incoming formation shape before all sprites land.
    // Skipped once allEntered (formation is visibly assembled).
    if (game.state === STATE.PLAYING && !game.allEntered) {
      ctx.save();
      ctx.fillStyle = '#888';
      for (const e of game.enemies) {
        if (e.alive && e.state === 'entering') {
          // Anchor preview dot at the eventual home position, fade in over the
          // enemy's path progress (closer to formation = brighter target).
          const fade = Math.min(1, (e.pathProgress || 0) + 0.2);
          ctx.globalAlpha = 0.18 * (1 - fade) + 0.05;
          ctx.fillRect(e.homeX - 1, e.homeY - 1, 3, 3);
        }
      }
      ctx.restore();
    }
    // DIVE LAUNCH AFTERIMAGE — render faint silhouettes at the home positions of
    // enemies that just started diving. Visual anchor of "where they came from".
    if (game.diveAfterimages && game.diveAfterimages.length) {
      ctx.save();
      for (const ai of game.diveAfterimages) {
        const fade = 1 - ai.life / ai.maxLife;
        ctx.globalAlpha = fade * 0.35;
        ctx.fillStyle = '#888';
        // Simple 7×6 silhouette box at home position
        ctx.fillRect(ai.x - 4, ai.y - 4, 9, 9);
      }
      ctx.restore();
    }
    // DIVE PATH PREVIEW — render fading dots along upcoming dive trajectory so
    // the player can read it before the enemy commits. Faded by global lifetime
    // (divePathLife). Drawn before the sprite so the enemy reads above its own path.
    {
      ctx.save();
      ctx.fillStyle = '#f44';
      for (const e of game.enemies) {
        if (!e.alive || !e.divePathDots || (e.divePathLife || 0) <= 0) continue;
        const lifeFrac = e.divePathLife / 22;
        for (const d of e.divePathDots) {
          ctx.globalAlpha = (1 - d.t) * 0.55 * lifeFrac + 0.05 * lifeFrac;
          ctx.fillRect(Math.round(d.x), Math.round(d.y), 1, 1);
        }
      }
      ctx.restore();
    }
    // LAST STAND — golden pulsing aura on the sole surviving enemy of the stage.
    const _lsActive = game.state === STATE.PLAYING && game.allEntered
      && game.enemies.filter(en => en.alive).length === 1;
    for (const e of game.enemies) {
      if (!e.alive) continue;
      // KAMIKAZE LEAD INDICATOR — predict landing X by extrapolating velocity to player Y.
      // Helps player read incoming straight-dive threats early and pre-commit to a side.
      if (e.state === 'kamikaze' && e.vy > 0.1 && game.playerAlive && e.y < game.playerY - 24) {
        const dt = (game.playerY - e.y) / e.vy;
        const leadX = e.x + e.vx * dt;
        if (leadX >= 4 && leadX <= BASE_W - 4) {
          ctx.save();
          const _blk = (game.animFrame >> 2) % 2 === 0;
          ctx.globalAlpha = _blk ? 0.75 : 0.35;
          ctx.fillStyle = '#f44';
          // Down-triangle marker at predicted landing point on player Y line
          ctx.fillRect(leadX - 3, game.playerY - 10, 6, 1);
          ctx.fillRect(leadX - 2, game.playerY - 9,  4, 1);
          ctx.fillRect(leadX - 1, game.playerY - 8,  2, 1);
          ctx.restore();
        }
      }
      if (_lsActive) {
        const t = game.animFrame;
        const pulseR = 11 + Math.sin(t * 0.22) * 2;
        ctx.save();
        ctx.globalAlpha = 0.55 + 0.30 * Math.sin(t * 0.18);
        ctx.strokeStyle = '#fc4';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(e.x, e.y, pulseR, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      // ELITE outline — drawn BEFORE the sprite so it reads as a halo/border.
      // Pulsing red box around the enemy + diagonal corner pips for an "ace" feel.
      if (e.elite) {
        ctx.save();
        const pulse = 0.55 + 0.35 * Math.sin(game.animFrame * 0.20 + e.x * 0.03);
        ctx.globalAlpha = pulse;
        ctx.fillStyle = '#f44';
        // 4-side border (1px) at ±9 radius
        ctx.fillRect(e.x - 9, e.y - 9, 18, 1);
        ctx.fillRect(e.x - 9, e.y + 8, 18, 1);
        ctx.fillRect(e.x - 9, e.y - 9, 1, 18);
        ctx.fillRect(e.x + 8, e.y - 9, 1, 18);
        // Corner pips (4) at the diagonals for extra signal
        ctx.fillStyle = '#fc4';
        ctx.fillRect(e.x - 9, e.y - 9, 2, 1);
        ctx.fillRect(e.x + 7, e.y - 9, 2, 1);
        ctx.fillRect(e.x - 9, e.y + 8, 2, 1);
        ctx.fillRect(e.x + 7, e.y + 8, 2, 1);
        ctx.restore();
      }
      if (auraStage && e.type !== 'minibee' && e.type !== 'goldenBee' && e.type !== 'ufo') {
        ctx.save();
        const auraCol = game.stage >= 25 ? '#f44' : game.stage >= 20 ? '#f60' : '#f6f';
        const baseAlpha = auraStrong ? 0.28 : 0.20;
        ctx.globalAlpha = baseAlpha + 0.10 * Math.sin(game.animFrame * 0.18 + e.x * 0.05);
        ctx.fillStyle = auraCol;
        ctx.fillRect(e.x - 9, e.y - 9, 18, 18);
        ctx.globalAlpha *= 0.6;
        ctx.fillRect(e.x - 12, e.y - 12, 24, 24);
        if (auraStrong) {
          ctx.globalAlpha *= 0.5;
          ctx.fillRect(e.x - 16, e.y - 16, 32, 32);
        }
        // Color-blind: white outline so the aura tier (red/orange/magenta) is recognizable by shape
        if (colorBlindMode) {
          ctx.globalAlpha = 0.7;
          ctx.fillStyle = '#fff';
          ctx.fillRect(e.x - 9, e.y - 9, 18, 1);
          ctx.fillRect(e.x - 9, e.y + 8, 18, 1);
          ctx.fillRect(e.x - 9, e.y - 9, 1, 18);
          ctx.fillRect(e.x + 8, e.y - 9, 1, 18);
        }
        ctx.restore();
      }
      // GHOST stealth wrap — only sprite is dimmed; pips/flash stay readable
      const _ghostStealth = e.ghost && !e.ghostRevealed;
      if (_ghostStealth) { ctx.save(); ctx.globalAlpha = 0.15; }
      switch(e.type) {
        case 'bee': drawBee(e.x, e.y, e.frame); break;
        case 'butterfly': drawButterfly(e.x, e.y, e.frame); break;
        case 'shielded': drawShielded(e.x, e.y, e.frame, e.hp); break;
        case 'kamikaze': drawKamikaze(e.x, e.y, e.frame); break;
        case 'splitter': drawSplitter(e.x, e.y, e.frame); break;
        case 'minibee': drawMiniBee(e.x, e.y, e.frame); break;
        case 'ufo': drawUFO(e.x, e.y, e.frame); break;
        case 'goldenBee': drawGoldenBee(e.x, e.y, e.frame); break;
        case 'mirror': drawMirror(e.x, e.y, e.frame); break;
        case 'hoverer': drawHoverer(e.x, e.y, e.frame); break;
        case 'boss':
          drawBoss(e.x, e.y, e.frame, e.hp < 2);
          // (BIOME ENEMY TINT — applied after switch, below)
          // Draw captured ship attached to the boss in ALL states (formation, diving, returning)
          // — previously only in formation, which made the ship visually vanish during dives.
          if (e.capturedShip && e.state !== 'capturing') {
            drawPlayer(e.x, e.y - 14, COL.red);
          }
          // Draw tractor beam
          if (e.state === 'capturing' && e.captureTimer >= 60 && e.captureTimer < 180) {
            drawTractorBeam(e.x, e.y + 6, 80);
          }
          break;
      }
      // GHOST stealth restore + telltale dot (1px white at center) so the
      // hidden enemy is still detectable by careful observation.
      if (_ghostStealth) {
        ctx.restore();
        ctx.save();
        ctx.globalAlpha = 0.55;
        ctx.fillStyle = '#fff';
        ctx.fillRect(e.x, e.y, 1, 1);
        ctx.restore();
      }
      // ENEMY MINI HP BAR — 1px bar above damaged multi-HP enemies. Shows
      // remaining HP fraction. Only when maxHp > 1 AND hp < maxHp. Hidden for
      // single-HP enemies and unhit multi-HP enemies (clean view).
      if (e.maxHp && e.maxHp > 1 && e.hp > 0 && e.hp < e.maxHp) {
        const _ratio = e.hp / e.maxHp;
        const _bw = 12;
        const _bx = e.x - _bw/2, _by = e.y - 12;
        ctx.save();
        ctx.globalAlpha = 0.7;
        ctx.fillStyle = '#222';
        ctx.fillRect(_bx, _by, _bw, 1);
        ctx.fillStyle = _ratio > 0.5 ? '#0f8' : _ratio > 0.25 ? '#fc4' : '#f44';
        ctx.fillRect(_bx, _by, Math.round(_bw * _ratio), 1);
        ctx.restore();
      }
      // ENEMY HIT FLASH — 4-frame white tint after non-fatal damage. Sits on top
      // of sprite + biome tint. Pure feedback: "I damaged it but not killed yet".
      if ((e.hitFlashTimer || 0) > 0) {
        ctx.save();
        ctx.globalAlpha = (e.hitFlashTimer / 4) * 0.6;
        ctx.fillStyle = '#fff';
        ctx.fillRect(e.x - 8, e.y - 8, 16, 16);
        ctx.restore();
      }
      // CRITICAL HP PULSE — red ring around enemy when 1 hit from death.
      // 16-frame life, ticked in update() (not draw — was draining 2.4× faster on
      // 144Hz monitors due to draw-rate-bound mutation; moved here for correctness).
      if ((e.criticalPulseTimer || 0) > 0) {
        const cp = e.criticalPulseTimer;
        const cpFade = cp / 16;
        ctx.save();
        ctx.globalAlpha = cpFade * 0.8;
        ctx.strokeStyle = '#f44';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(e.x, e.y, 11 + (16 - cp) * 0.4, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      // BIOME ENEMY TINT — subtle color wash matching active biome on top of the
      // sprite. ~10% alpha so the sprite identity reads through. Skipped when no
      // biome (stage ≤ 7) or for goldenBee (preserves rare-spawn visual signal).
      {
        const _biome = biomeForStage(game.stage);
        if (_biome && BIOME_NAMES[_biome] && e.type !== 'goldenBee') {
          ctx.save();
          ctx.globalAlpha = 0.10;
          ctx.fillStyle = BIOME_NAMES[_biome].col;
          ctx.fillRect(e.x - 8, e.y - 8, 16, 16);
          ctx.restore();
        }
      }
      // ENEMY HEALTH PIPS — hp > 1 only (avoids clutter on the common hp=1 enemies).
      // Pips drawn above the sprite, color tinted by enemy type for instant recognition.
      // Each pip is 2×1 px so 2-3 pips read clearly without dominating the sprite.
      if (e.hp > 1) {
        const pipCol = e.type === 'shielded' ? '#cef'
                    : e.elite             ? '#f44'
                    : e.type === 'boss'    ? '#f8a'
                    : '#fff';
        const pipY = e.y - 10;
        const totalW = e.hp * 3 - 1; // 2px pip + 1px gap, last has no gap
        const startX = e.x - totalW / 2;
        ctx.save();
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = pipCol;
        for (let p = 0; p < e.hp; p++) {
          ctx.fillRect(Math.round(startX + p * 3), pipY, 2, 1);
        }
        ctx.restore();
      }
      // DIVE TELEGRAPH FLASH — red chevron above enemy for 16 frames after dive start.
      // Tick down here so the timer expires in lockstep with the visual.
      if (e.diveFlashTimer && e.diveFlashTimer > 0) {
        e.diveFlashTimer--;
        const flashRatio = e.diveFlashTimer / 16;
        ctx.save();
        ctx.globalAlpha = flashRatio * 0.9;
        ctx.fillStyle = '#f44';
        // Downward chevron: ▼ shape made of 3 pixel rows
        const cy = e.y - 12;
        ctx.fillRect(e.x - 3, cy,     7, 1);
        ctx.fillRect(e.x - 2, cy + 1, 5, 1);
        ctx.fillRect(e.x - 1, cy + 2, 3, 1);
        ctx.fillRect(e.x,     cy + 3, 1, 1);
        // Outer ring (faded)
        ctx.globalAlpha = flashRatio * 0.45;
        ctx.fillStyle = '#fc4';
        ctx.fillRect(e.x - 5, cy - 1, 11, 1);
        ctx.restore();
      }
    }
  }

  // Draw power-up capsules
  // MAGNETIC PERK LINE — when the magnetic perk is active, draw a dashed green line
  // from each in-range power-up toward the player, showing the pull effect.
  if (game.activePerk === 'magnetic' && game.playerAlive) {
    const MAGNET_RANGE_VIS = 72;
    ctx.save();
    // MAGNET RANGE RING — dashed circle showing the magnet's effective radius.
    // 24 segments rotating slowly; alpha low so it doesn't dominate the playfield.
    {
      const segs = 24;
      const rotPhase = game.animFrame * 0.012;
      ctx.fillStyle = '#0f8';
      for (let k = 0; k < segs; k++) {
        if (k % 2 !== 0) continue; // dashed gap
        const a = (k / segs) * Math.PI * 2 + rotPhase;
        const px = game.playerX + Math.cos(a) * MAGNET_RANGE_VIS;
        const py = game.playerY + Math.sin(a) * MAGNET_RANGE_VIS;
        ctx.globalAlpha = 0.22;
        ctx.fillRect(Math.round(px - 1), Math.round(py - 1), 2, 2);
      }
    }
    ctx.fillStyle = '#0f8';
    for (const p of game.powerUps) {
      const dx = game.playerX - p.x, dy = game.playerY - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < MAGNET_RANGE_VIS && dist > 6) {
        // Dashed segments — every other 2px step
        const steps = Math.floor(dist / 3);
        for (let s = 1; s < steps; s++) {
          if ((s + (game.animFrame >> 1)) % 2 !== 0) continue; // animate dash flow
          const t = s / steps;
          const lx = Math.round(p.x + dx * t);
          const ly = Math.round(p.y + dy * t);
          ctx.globalAlpha = (1 - t) * 0.4;
          ctx.fillRect(lx, ly, 1, 1);
        }
      }
    }
    ctx.restore();
  }
  for (const p of game.powerUps) drawPowerUp(p);

  // Draw player bullets — GAM-42 tier visuals (Sleek / Nova / Shard)
  for (const b of game.bullets) {
    // HOMING TARGET LINE — faint 1px line from bullet to current lock-on target
    if (b.kind === 'homing' && b.tgtX != null && b.tgtY != null) {
      ctx.save();
      ctx.globalAlpha = 0.25;
      ctx.strokeStyle = '#0f8';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(Math.round(b.x), Math.round(b.y));
      ctx.lineTo(Math.round(b.tgtX), Math.round(b.tgtY));
      ctx.stroke();
      ctx.restore();
      // HOMING TARGET RETICLE — small 4-corner bracket around target enemy.
      // Pulses subtly with animFrame so lock-on reads clearly even amid chaos.
      const _tx = Math.round(b.tgtX), _ty = Math.round(b.tgtY);
      const _rpulse = 0.5 + 0.5 * Math.sin(game.animFrame * 0.4);
      ctx.save();
      ctx.globalAlpha = 0.40 + 0.30 * _rpulse;
      ctx.fillStyle = '#0f8';
      // Four 2-pixel L brackets at ±5 from target center
      ctx.fillRect(_tx - 5, _ty - 5, 2, 1); ctx.fillRect(_tx - 5, _ty - 5, 1, 2);
      ctx.fillRect(_tx + 4, _ty - 5, 2, 1); ctx.fillRect(_tx + 5, _ty - 5, 1, 2);
      ctx.fillRect(_tx - 5, _ty + 5, 2, 1); ctx.fillRect(_tx - 5, _ty + 4, 1, 2);
      ctx.fillRect(_tx + 4, _ty + 5, 2, 1); ctx.fillRect(_tx + 5, _ty + 4, 1, 2);
      ctx.restore();
    }
    // HOMING TRAIL — fade-out green dot trail showing recent path of homing bullets
    // WAVE TRAIL — same pattern for zigzag wave-mode bullets, cyan color
    if (b.trail && b.trail.length > 0 && (b.kind === 'homing' || b.kind === 'wave')) {
      ctx.save();
      ctx.fillStyle = b.kind === 'wave' ? '#6cf' : '#0f8';
      for (let ti = 0; ti < b.trail.length; ti++) {
        const tp = b.trail[ti];
        ctx.globalAlpha = (1 - ti / b.trail.length) * 0.6;
        ctx.fillRect(Math.round(tp.x), Math.round(tp.y), 1, 1);
      }
      ctx.restore();
    }
    // CRITICAL HIT outline — pre-render gold halo for crit bullets so the
    // player anticipates the +50% damage hit before it lands.
    if (b.crit) {
      ctx.save();
      const cPulse = 0.55 + 0.45 * Math.sin(game.animFrame * 0.4);
      ctx.globalAlpha = cPulse;
      ctx.fillStyle = '#fc4';
      ctx.fillRect(Math.round(b.x - 2), Math.round(b.y - 3), 5, 1);
      ctx.fillRect(Math.round(b.x - 2), Math.round(b.y + 2), 5, 1);
      ctx.fillRect(Math.round(b.x - 3), Math.round(b.y - 2), 1, 5);
      ctx.fillRect(Math.round(b.x + 2), Math.round(b.y - 2), 1, 5);
      ctx.restore();
    }
    drawPlayerBullet(b.x, b.y, b.lvl ?? 1, b.kind);
  }

  // Draw enemy bullets
  for (const b of game.enemyBullets) drawEnemyBullet(b);

  // Engine trail (drawn before player so ship sits on top)
  drawExhaustDust();
  drawPlayerTrail();

  // Shield ring while invincible (only when not from a brief dash — show >= 30 frames)
  if (game.playerAlive && game.invincibleTimer >= 30) {
    const t = game.animFrame;
    const r = 13 + Math.sin(t * 0.25) * 2;
    ctx.save();
    ctx.globalAlpha = 0.45 + 0.30 * Math.sin(t * 0.18);
    ctx.strokeStyle = '#0ff';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(game.playerX, game.playerY, r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha *= 0.5;
    ctx.beginPath(); ctx.arc(game.playerX, game.playerY, r + 3, 0, Math.PI * 2); ctx.stroke();
    // Tiny orbiting sparkles (3) tracing the ring
    ctx.fillStyle = '#cff';
    ctx.globalAlpha = 0.85;
    for (let i = 0; i < 3; i++) {
      const a = t * 0.08 + i * (Math.PI * 2 / 3);
      ctx.fillRect(Math.round(game.playerX + Math.cos(a) * r), Math.round(game.playerY + Math.sin(a) * r), 1, 1);
    }
    ctx.restore();
  }

  // Draw player (blink during invincibility)
  if (game.playerAlive && (game.invincibleTimer <= 0 || (game.invincibleTimer >> 2) % 2 === 0)) {
    const pcol = (game.ship && game.ship.color) || '#0cf';
    drawShipMaxedGlow(game.playerX, game.playerY);
    // SHIELD ring — draws BEHIND the ship so it reads as an aura. Outer arc count = charges.
    if ((game.shieldCharges || 0) > 0) {
      const t = game.animFrame;
      const ringR = 13 + Math.sin(t * 0.16) * 1.5;
      ctx.save();
      ctx.globalAlpha = 0.55 + 0.25 * Math.sin(t * 0.22);
      ctx.fillStyle = '#4f8';
      // 8-segment arc, with N segments brightened where N = charges
      for (let k = 0; k < 8; k++) {
        const a = (k / 8) * Math.PI * 2 + t * 0.04;
        const px = game.playerX + Math.cos(a) * ringR;
        const py = game.playerY + Math.sin(a) * ringR;
        const bright = k < game.shieldCharges * 3;
        ctx.globalAlpha = bright ? 0.9 : 0.25;
        ctx.fillRect(Math.round(px - 1), Math.round(py - 1), 2, 2);
      }
      ctx.restore();
    }
    // CHEAT INVINCIBLE GLOW — golden pulsing ring around the ship while GOD mode
    // is active. Pairs with the "GOD" corner tag for unmissable visual feedback
    // that the cheat is on (so it's never on by mistake).
    if (game.cheatInvincible) {
      const t = game.animFrame;
      const pulse = 0.5 + 0.5 * Math.sin(t * 0.22);
      ctx.save();
      ctx.globalAlpha = 0.35 + 0.30 * pulse;
      ctx.fillStyle = '#fc4';
      const r = 14 + Math.round(2 * pulse);
      // 4-side border framing the ship
      ctx.fillRect(game.playerX - r, game.playerY - r, r * 2 + 1, 1);
      ctx.fillRect(game.playerX - r, game.playerY + r, r * 2 + 1, 1);
      ctx.fillRect(game.playerX - r, game.playerY - r, 1, r * 2 + 1);
      ctx.fillRect(game.playerX + r, game.playerY - r, 1, r * 2 + 1);
      // Corner sparkles
      ctx.globalAlpha = 0.6 + 0.3 * pulse;
      ctx.fillStyle = '#ff4';
      ctx.fillRect(game.playerX - r, game.playerY - r, 1, 1);
      ctx.fillRect(game.playerX + r, game.playerY - r, 1, 1);
      ctx.fillRect(game.playerX - r, game.playerY + r, 1, 1);
      ctx.fillRect(game.playerX + r, game.playerY + r, 1, 1);
      ctx.restore();
    }
    // DASH READY ring — short cyan halo when dash recharges. Drawn behind ship.
    if ((game.dashReadyFrames || 0) > 0) {
      const dr = game.dashReadyFrames / 30;
      ctx.save();
      ctx.globalAlpha = dr * 0.7;
      ctx.fillStyle = '#0ff';
      const r = Math.round(10 + (1 - dr) * 6);
      // 4-side thin frame around ship
      ctx.fillRect(game.playerX - r, game.playerY - r, r * 2 + 1, 1);
      ctx.fillRect(game.playerX - r, game.playerY + r, r * 2 + 1, 1);
      ctx.fillRect(game.playerX - r, game.playerY - r, 1, r * 2 + 1);
      ctx.fillRect(game.playerX + r, game.playerY - r, 1, r * 2 + 1);
      ctx.restore();
    }
    // SHIP MOMENTUM TILT — rotate ship sprite ± up to ~10° based on game.playerTilt.
    // Aura is drawn unrotated so it sits flat to the world, then ship is drawn rotated.
    const tiltRad = (game.playerTilt || 0) * 0.18; // ~10.3° max
    // PERK ACTIVE SHIP DOTS — 4 corner dots in perk color so the player sees
    // their current perk reflected on the ship sprite. Suppressed during dash.
    function _drawPerkDots(cx, cy) {
      if (!game.activePerk || !PERKS[game.activePerk]) return;
      if (game.dashTimer > 0) return;
      const pCol = PERKS[game.activePerk].col;
      const t = game.animFrame;
      const pulse = 0.55 + 0.35 * Math.sin(t * 0.18);
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.fillStyle = pCol;
      // 4 corner pixels at ±8 from center
      ctx.fillRect(cx - 8, cy - 8, 1, 1);
      ctx.fillRect(cx + 7, cy - 8, 1, 1);
      ctx.fillRect(cx - 8, cy + 7, 1, 1);
      ctx.fillRect(cx + 7, cy + 7, 1, 1);
      ctx.restore();
    }
    // SYNERGY AURA — rotating ring of 8 dots matching active WEAPON SYNERGY.
    // Drawn before the ship so it reads as a halo. Suppressed during dash so the
    // dash trail/iframes stay visually clean.
    function _drawSynergyAura(cx, cy) {
      if (!game.activeSynergy || game.dashTimer > 0) return;
      const auraCol = game.activeSynergy === 'OVERLOAD' ? '#fc4'
                    : game.activeSynergy === 'BLINK'    ? '#0ff' : '#f8a';
      const t = game.animFrame;
      const r = 14 + Math.sin(t * 0.10) * 1.5;
      ctx.save();
      for (let k = 0; k < 8; k++) {
        const a = (k / 8) * Math.PI * 2 + t * 0.03;
        const px = cx + Math.cos(a) * r;
        const py = cy + Math.sin(a) * r;
        ctx.globalAlpha = 0.38 + 0.20 * Math.sin(t * 0.12 + k * 0.6);
        ctx.fillStyle = auraCol;
        ctx.fillRect(Math.round(px - 1), Math.round(py - 1), 2, 2);
      }
      ctx.restore();
    }
    if (game.dualFighter) {
      drawShipTraitAura(game.playerX - 8, game.playerY, selectedShip);
      drawShipTraitAura(game.playerX + 8, game.playerY, selectedShip);
      _drawSynergyAura(game.playerX - 8, game.playerY);
      _drawSynergyAura(game.playerX + 8, game.playerY);
      _drawPerkDots(game.playerX - 8, game.playerY);
      _drawPerkDots(game.playerX + 8, game.playerY);
      ctx.save();
      ctx.translate(game.playerX - 8, game.playerY);
      ctx.rotate(tiltRad);
      drawPlayer(0, 0, pcol, game.lvl);
      ctx.restore();
      ctx.save();
      ctx.translate(game.playerX + 8, game.playerY);
      ctx.rotate(tiltRad);
      drawPlayer(0, 0, pcol, game.lvl);
      ctx.restore();
      // DUAL FIGHTER TETHER — energy line connecting the two ships, sells the
      // "linked formation" identity. 3 dots between the wing inner edges with a
      // pulsing center, slight color cycle. Skipped while dash for visual clarity.
      if (game.dashTimer <= 0) {
        const t = game.animFrame;
        const cy = game.playerY;
        const pulse = 0.6 + 0.4 * Math.sin(t * 0.18);
        ctx.save();
        ctx.globalAlpha = 0.55 * pulse;
        ctx.fillStyle = pcol;
        ctx.fillRect(game.playerX - 3, cy, 1, 1);
        ctx.fillRect(game.playerX,     cy, 1, 1);
        ctx.fillRect(game.playerX + 2, cy, 1, 1);
        ctx.globalAlpha = 0.85 * pulse;
        ctx.fillStyle = '#fff';
        ctx.fillRect(game.playerX, cy - 1, 1, 1);
        ctx.fillRect(game.playerX, cy + 1, 1, 1);
        ctx.restore();
      }
    } else {
      drawShipTraitAura(game.playerX, game.playerY, selectedShip);
      _drawSynergyAura(game.playerX, game.playerY);
      _drawPerkDots(game.playerX, game.playerY);
      ctx.save();
      ctx.translate(game.playerX, game.playerY);
      ctx.rotate(tiltRad);
      drawPlayer(0, 0, pcol, game.lvl);
      ctx.restore();
    }
  }

  // Draw explosions
  for (const ex of game.explosions) {
    drawExplosion(ex.x, ex.y, ex.timer, ex.maxTime);
  }
  drawDebris();
  drawShockwaves();
  drawStrikeFx();
  drawMuzzleFlashes();
  // DEATH GHOST TRAIL — faint red ship silhouettes along player's final path.
  // Most recent silhouette brightest; oldest faintest. Drawn during RESPAWN
  // cutscene so the player sees where they were a moment before the fatal hit.
  if ((game.deathGhostLife || 0) > 0 && game.deathGhostTrail && game.deathGhostTrail.length) {
    const dgLife = game.deathGhostLife;
    const fade = dgLife / 40;
    ctx.save();
    for (let i = 0; i < game.deathGhostTrail.length; i++) {
      const p = game.deathGhostTrail[i];
      const pos = i / Math.max(1, game.deathGhostTrail.length - 1);
      ctx.globalAlpha = fade * (1 - pos) * 0.45;
      ctx.fillStyle = '#f88';
      // Small 5×5 box silhouette
      ctx.fillRect(p.x - 2, p.y - 2, 5, 5);
      ctx.globalAlpha = fade * (1 - pos) * 0.20;
      ctx.fillRect(p.x - 3, p.y - 3, 7, 7);
    }
    ctx.restore();
  }

  // DEATH POSTMORTEM — red expanding ring + arrow at the offending hit source.
  // Fades over 30 frames (set by killPlayer). Only renders during RESPAWN cutscene
  // so it doesn't overlap with active gameplay.
  if ((game.deathMarkerLife || 0) > 0 && typeof game.deathSrcX === 'number') {
    const dml = game.deathMarkerLife;
    const dRatio = dml / 30;
    const dRad = (30 - dml) * 0.7 + 4;
    ctx.save();
    ctx.globalAlpha = dRatio * 0.9;
    ctx.strokeStyle = '#f44';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(game.deathSrcX, game.deathSrcY, dRad, 0, Math.PI * 2);
    ctx.stroke();
    // Inner crosshair
    ctx.fillStyle = '#f88';
    ctx.fillRect(game.deathSrcX - 3, game.deathSrcY, 7, 1);
    ctx.fillRect(game.deathSrcX, game.deathSrcY - 3, 1, 7);
    ctx.restore();
  }
  // KILL CHAIN VISUAL — connect consecutive recent kill positions when combo >= 3.
  // Line color tracks combo multiplier tier; alpha fades with each kill's age.
  if ((game.combo || 0) >= 3 && game.recentKillPositions && game.recentKillPositions.length >= 2) {
    const kc = game.recentKillPositions;
    const mult = comboMultiplier(game.combo);
    const lineCol = mult >= 2.5 ? '#f6f' : mult >= 2 ? '#f80' : mult >= 1.5 ? '#ff4' : '#0ff';
    ctx.save();
    ctx.fillStyle = lineCol;
    for (let i = 0; i < kc.length - 1; i++) {
      const a = kc[i], b = kc[i + 1];
      const fade = 1 - Math.max(a.age, b.age) / 30;
      if (fade <= 0) continue;
      ctx.globalAlpha = fade * 0.45;
      // Bresenham-style chunky pixel line (cheap, ~12 segments)
      const dx = b.x - a.x, dy = b.y - a.y;
      const steps = Math.max(2, Math.floor(Math.sqrt(dx * dx + dy * dy) / 4));
      for (let s = 1; s < steps; s++) {
        const t = s / steps;
        const lx = Math.round(a.x + dx * t);
        const ly = Math.round(a.y + dy * t);
        ctx.fillRect(lx, ly, 1, 1);
      }
    }
    ctx.restore();
  }

  // Pickup feedback (burst + floating text + hit sparks)
  for (const b of game.itemBursts) drawItemBurst(b);
  for (const s of game.hitSparks) drawHitSpark(s);
  for (const ft of game.floatTexts) drawFloatText(ft);

  // Captured state text — animated banner panel
  if (game.state === STATE.CAPTURED && game.captureTimer > 20) {
    const t = game.captureTimer;
    // Slide-in animation over first 30 frames
    const slide = Math.min(1, (t - 20) / 30);
    const cy = BASE_H / 2 + 36;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    const panelH = 22 * slide;
    ctx.fillRect(0, cy - panelH / 2, BASE_W, panelH);
    // Red dashed borders
    ctx.fillStyle = 'rgba(228,68,68,0.7)';
    for (let i = 0; i < BASE_W; i += 6) {
      ctx.fillRect(i, cy - panelH / 2, 3, 1);
      ctx.fillRect(i, cy + panelH / 2 - 1, 3, 1);
    }
    ctx.restore();
    if (slide >= 1) {
      // Pulsing glow text
      const blink = (game.animFrame >> 3) % 2 === 0;
      ctx.save();
      ctx.shadowColor = COL.red;
      ctx.shadowBlur = blink ? 12 : 4;
      drawRetroText('!! FIGHTER CAPTURED !!', BASE_W/2, cy, 9, blink ? COL.red : '#f88');
      ctx.restore();
    }
  }

  drawDivePreviewPaths();
  drawThreatIndicators();
  drawLastEnemyAlert();
  drawCaptureDanger();
  // RESPAWN visualization — show "READY..." with timer in middle of screen
  if (game.state === STATE.RESPAWN && game.respawnTimer > 0) {
    const sec = Math.ceil(game.respawnTimer / 60);
    drawRetroText('READY ' + sec, BASE_W/2, BASE_H/2 + 20, 8, COL.cyan);
  }
  drawHUD();
}

// Dashed bezier preview of a dive trajectory — drawn while previewTimer is counting down.
function drawDivePreviewPaths() {
  if (!game.enemies) return;
  const t = game.animFrame;
  for (const e of game.enemies) {
    if (!e.alive || !e.previewPath || !e.previewTimer) continue;
    const segs = e.previewPath;
    if (!segs || !segs.length) continue;
    ctx.save();
    // Fade in over first 6 frames, then full alpha
    const lifeFade = Math.min(1, (30 - e.previewTimer) / 6);
    // Subtle pulse: dashes slide along
    ctx.fillStyle = COL.red;
    let drawn = 0;
    for (const seg of segs) {
      const samples = 24;
      for (let s = 0; s < samples; s++) {
        const tt = s / samples;
        const p = bezierPoint(seg.p0, seg.p1, seg.p2, seg.p3, tt);
        // Dash pattern that animates: visible when (s + offset) % 4 < 2
        if ((s + Math.floor(t / 2)) % 4 >= 2) continue;
        ctx.globalAlpha = 0.28 * lifeFade * (1 - tt * 0.4);
        ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
        drawn++;
      }
    }
    ctx.restore();
    // Telegraph flash on the enemy itself (red blink)
    if ((t >> 1) % 2 === 0) {
      ctx.save();
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = COL.red;
      ctx.fillRect(Math.round(e.x) - 8, Math.round(e.y) - 8, 16, 16);
      ctx.restore();
    }
  }
}

// Off-screen threat arrows — red blips on the screen edge pointing at incoming dives.
// Pulsing red screen-edge warning when a tractor beam is overhead and the player is in danger
function drawCaptureDanger() {
  if (!game.playerAlive) return;
  const beamBoss = (game.enemies || []).find(e => e.alive && e.state === 'capturing'
    && e.captureTimer >= 60 && e.captureTimer < 180);
  if (!beamBoss) return;
  // Only when player is under or near the beam
  if (Math.abs(beamBoss.x - game.playerX) > 28) return;
  ctx.save();
  const pulse = 0.5 + 0.5 * Math.sin(game.animFrame * 0.4);
  ctx.globalAlpha = 0.18 + 0.30 * pulse;
  ctx.fillStyle = COL.red;
  ctx.fillRect(0, 0, BASE_W, 4);
  ctx.fillRect(0, BASE_H - 4, BASE_W, 4);
  ctx.fillRect(0, 0, 4, BASE_H);
  ctx.fillRect(BASE_W - 4, 0, 4, BASE_H);
  ctx.restore();
  if ((game.animFrame >> 3) % 2 === 0) {
    drawRetroText('!! BEAM !!', BASE_W/2, 60, 8, COL.red);
  }
}

// Highlight the last surviving formation enemy with a pulsing 'LAST!' label + ring
function drawLastEnemyAlert() {
  if (game.state !== STATE.PLAYING) return;
  // Only when formation is fully entered to avoid alerting during entrance
  if (!game.allEntered) return;
  const alive = (game.enemies || []).filter(e => e.alive);
  if (alive.length !== 1) return;
  const e = alive[0];
  const t = game.animFrame;
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.25);
  ctx.save();
  // Targeting ring
  ctx.globalAlpha = 0.45 + 0.40 * pulse;
  ctx.strokeStyle = COL.yellow;
  ctx.lineWidth = 1;
  const r = 12 + Math.sin(t * 0.3) * 2;
  ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
  // 'LAST!' label above enemy (clamped within screen)
  const lblY = Math.max(34, e.y - 16);
  if ((t >> 2) % 2 === 0) {
    drawRetroText('LAST!', e.x, lblY, 6, COL.yellow);
  }
}

function drawThreatIndicators() {
  const enemies = game.state === STATE.CHALLENGING
    ? (game.challengeWaves && game.challengeWaves[game.challengeWaveIdx] || [])
    : game.enemies;
  if (!enemies) return;
  const pulse = 0.55 + 0.45 * Math.sin(game.animFrame * 0.32);
  ctx.save();
  ctx.fillStyle = COL.red;
  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.state !== 'diving') continue;
    // On-screen bounds with a small margin (24..BASE_W-4 horizontal, 28..BASE_H-20 vertical)
    if (e.x >= 4 && e.x <= BASE_W - 4 && e.y >= 28 && e.y <= BASE_H - 20) continue;
    const ex = Math.max(4, Math.min(BASE_W - 4, e.x));
    const ey = Math.max(28, Math.min(BASE_H - 20, e.y));
    ctx.globalAlpha = pulse;
    // Filled diamond at edge
    ctx.fillRect(Math.round(ex) - 1, Math.round(ey) - 1, 3, 3);
    ctx.fillRect(Math.round(ex), Math.round(ey) - 2, 1, 5);
    ctx.fillRect(Math.round(ex) - 2, Math.round(ey), 5, 1);
  }
  ctx.restore();
}

// Tiny power-up gem dot — 4×4 with shine, used in HUD slot indicators
function drawMiniGem(x, y, color) {
  ctx.fillStyle = '#fff';
  ctx.fillRect(x - 2, y - 2, 4, 4);
  ctx.fillStyle = color;
  ctx.fillRect(x - 1, y - 2, 2, 4);
  ctx.fillRect(x - 2, y - 1, 4, 2);
  ctx.fillStyle = '#fff';
  ctx.fillRect(x - 1, y - 1, 1, 1);
}

// Mini-radar (29×20) at top-right under the stage progression bar — only during normal play.
function drawMiniRadar() {
  if (game.state !== STATE.PLAYING && game.state !== STATE.CHALLENGING) return;
  const enemies = game.state === STATE.CHALLENGING
    ? (game.challengeWaves && game.challengeWaves[game.challengeWaveIdx] || [])
    : game.enemies;
  if (!enemies) return;
  const rw = 30, rh = 22;
  const rx = BASE_W - rw - 2;
  const ry = 28;
  ctx.save();
  ctx.fillStyle = 'rgba(0,30,60,0.55)';
  ctx.fillRect(rx, ry, rw, rh);
  ctx.fillStyle = 'rgba(0,200,255,0.40)';
  ctx.fillRect(rx, ry, rw, 1);
  ctx.fillRect(rx, ry + rh - 1, rw, 1);
  ctx.fillRect(rx, ry, 1, rh);
  ctx.fillRect(rx + rw - 1, ry, 1, rh);
  // Player marker (yellow)
  if (game.playerAlive) {
    const px = rx + Math.round((game.playerX / BASE_W) * (rw - 2)) + 1;
    const py = ry + Math.round((game.playerY / BASE_H) * (rh - 2)) + 1;
    ctx.fillStyle = '#ff4';
    ctx.fillRect(px, py, 1, 1);
  }
  // Enemy markers — color by state/type for readability
  for (const e of enemies) {
    if (!e.alive) continue;
    const px = rx + Math.round((e.x / BASE_W) * (rw - 2)) + 1;
    const py = ry + Math.round((e.y / BASE_H) * (rh - 2)) + 1;
    if (px < rx + 1 || px > rx + rw - 2 || py < ry + 1 || py > ry + rh - 2) continue;
    ctx.fillStyle = e.state === 'diving' ? COL.red
                  : e.type === 'goldenBee' ? '#fc4'
                  : e.type === 'boss' || e.type === 'shielded' ? '#f6f'
                  : '#0ff';
    // Diving and below mid-screen: 2-pixel dot (more visible threat)
    const sz = (e.state === 'diving' && e.y > BASE_H * 0.5) ? 2 : 1;
    ctx.fillRect(px, py, sz, sz);
  }
  ctx.restore();
}

// Tiny pixel crown — denotes #1 score (yellow normal, red challenge)
function drawCrown(x, y, color) {
  ctx.fillStyle = color;
  // Three spikes
  ctx.fillRect(x - 2, y - 3, 1, 2);
  ctx.fillRect(x,     y - 4, 1, 3);
  ctx.fillRect(x + 2, y - 3, 1, 2);
  // Band
  ctx.fillRect(x - 2, y - 1, 5, 2);
  // Gem on band
  ctx.fillStyle = '#fff';
  ctx.fillRect(x, y - 1, 1, 1);
}

function drawHUD() {
  // BULLET HELL EDGE WARNING — pulsing red top/bottom bands when enemy bullet
  // count is high. Reads as "screen pressure" — pushes player to evade/clear.
  // Threshold raised for boss stages (naturally bullet-dense).
  if (game && game.enemyBullets
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    const _bhThresh = game.state === STATE.BOSS_STAGE ? 22 : 15;
    const _bhN = game.enemyBullets.length;
    if (_bhN >= _bhThresh) {
      const _bhOver = Math.min(1, (_bhN - _bhThresh) / 12);  // 0 at threshold, 1 at +12
      const _bhPulse = 0.5 + 0.5 * Math.sin(game.animFrame * 0.25);
      const _bhAlpha = 0.15 + 0.35 * _bhOver * _bhPulse;
      ctx.save();
      ctx.globalAlpha = _bhAlpha;
      ctx.fillStyle = '#f44';
      ctx.fillRect(0, 0, BASE_W, 2);
      ctx.fillRect(0, BASE_H - 2, BASE_W, 2);
      ctx.restore();
    }
  }
  // PLAYER EDGE VIGNETTE — faint cyan band on left/right when player is within
  // 20px of that edge. Alpha grows as player approaches the wall, peaking at
  // touching. Helps spatial awareness without compromising the playfield read.
  if (game.playerAlive
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    const _edgeMax = 20;
    const _distL = Math.max(0, game.playerX);
    const _distR = Math.max(0, BASE_W - game.playerX);
    if (_distL < _edgeMax) {
      ctx.save();
      ctx.globalAlpha = (1 - _distL / _edgeMax) * 0.25;
      ctx.fillStyle = '#0cf';
      ctx.fillRect(0, 0, 3, BASE_H);
      ctx.restore();
    }
    if (_distR < _edgeMax) {
      ctx.save();
      ctx.globalAlpha = (1 - _distR / _edgeMax) * 0.25;
      ctx.fillStyle = '#0cf';
      ctx.fillRect(BASE_W - 3, 0, 3, BASE_H);
      ctx.restore();
    }
  }
  // STAGE PROGRESS BAR — 1px high bar at top of screen showing how far into the
  // current stage the player is. Stage-type specific:
  //   PLAYING:     killed/total formation enemies
  //   CHALLENGING: completed waves / total waves
  //   BOSS_STAGE:  cumulative damage dealt to bosses
  // Drawn here so the bar reads above the score row without competing.
  if (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE) {
    let prog = 0, barCol = COL.cyan;
    if (game.state === STATE.PLAYING) {
      const total = game.enemies ? game.enemies.length : 0;
      const alive = total === 0 ? 0 : game.enemies.filter(e => e.alive).length;
      prog = total === 0 ? 0 : 1 - alive / total;
      barCol = COL.cyan;
    } else if (game.state === STATE.CHALLENGING) {
      const totalW = game.challengeWaves ? game.challengeWaves.length : 1;
      prog = Math.min(1, (game.challengeWaveIdx || 0) / totalW);
      barCol = '#f6f';
    } else if (game.state === STATE.BOSS_STAGE) {
      const bosses = game.megaBosses || [];
      let maxSum = 0, curSum = 0;
      for (const mb of bosses) { maxSum += mb.maxHp || 0; curSum += mb.alive ? (mb.hp || 0) : 0; }
      prog = maxSum > 0 ? 1 - curSum / maxSum : 0;
      barCol = COL.red;
    }
    ctx.save();
    // Track (dim)
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = barCol;
    ctx.fillRect(0, 0, BASE_W, 1);
    // Filled portion (bright)
    ctx.globalAlpha = 0.85;
    ctx.fillRect(0, 0, Math.round(BASE_W * prog), 1);
    ctx.restore();
    // STAGE PROGRESS PERCENT — small N% number once progress >= 25% so the
    // player sees exact stage completion (helps "almost done" decisions).
    if (!minimalHud && prog >= 0.25) {
      const pct = Math.round(prog * 100);
      drawRetroText(pct + '%', BASE_W/2, 4, 4, barCol, 'center');
    }
  }
  // 1UP + PILOT callsign small line below (pilot identity persistent across runs)
  if (game.animFrame % 60 < 40) {
    drawRetroText('1UP', 28, 8, 7, COL.red, 'center');
  }
  drawRetroText('[' + playerCallsign + ']', 28, 15, 5, callsignColor(), 'center');
  // PILOT TITLE under callsign — cached once per second to avoid recomputing each frame
  if (!game._titleCacheFrame || (game.animFrame - game._titleCacheFrame) > 60) {
    game._titleCacheFrame = game.animFrame;
    const _newTitle = computePilotTitle();
    // PILOT PROMOTION DETECTION — compare to last seen title persisted in
    // localStorage. On change to a new tier, fire banner + SFX once. Skips
    // first observation (no prior 'seen' value) — treats it as baseline.
    try {
      const _prevSeen = localStorage.getItem('galagaTitleSeen');
      if (_prevSeen != null && _prevSeen !== _newTitle && !game._titlePromoFired) {
        game._titlePromoFired = true;
        game.floatTexts.push({
          x: BASE_W/2, y: BASE_H/2 - 50, text: 'PROMOTED',
          color: '#fff', life: 100, maxLife: 100, size: 7
        });
        game.floatTexts.push({
          x: BASE_W/2, y: BASE_H/2 - 38, text: _newTitle,
          color: '#fc4', life: 110, maxLife: 110, size: 11
        });
        if (typeof playSound === 'function') playSound('milestone');
        if (typeof spawnConfetti === 'function') spawnConfetti(14);
      }
      localStorage.setItem('galagaTitleSeen', _newTitle);
    } catch (e) {}
    game._titleCache = _newTitle;
  }
  drawRetroText(game._titleCache, 28, 21, 4, COL.gray, 'center');

  // MISSILE LOCK — red crosshair brackets around the player when any mega-boss is
  // within 18 frames of firing its signature pattern. Reads as "an attack is
  // imminent, prepare to evade". Suppressed if player is dead or invincible.
  if (game.state === STATE.BOSS_STAGE && game.playerAlive && game.invincibleTimer <= 0
      && game.megaBosses && game.megaBosses.some(mb => mb.alive && mb.sigLocking)) {
    const t = game.animFrame;
    const blink = (t >> 1) % 2 === 0;
    ctx.save();
    ctx.globalAlpha = blink ? 0.85 : 0.35;
    ctx.fillStyle = '#f44';
    const px = game.playerX, py = game.playerY;
    // 4 corner brackets (8px from center)
    const off = 9;
    // top-left
    ctx.fillRect(px - off, py - off, 4, 1);
    ctx.fillRect(px - off, py - off, 1, 4);
    // top-right
    ctx.fillRect(px + off - 3, py - off, 4, 1);
    ctx.fillRect(px + off, py - off, 1, 4);
    // bottom-left
    ctx.fillRect(px - off, py + off, 4, 1);
    ctx.fillRect(px - off, py + off - 3, 1, 4);
    // bottom-right
    ctx.fillRect(px + off - 3, py + off, 4, 1);
    ctx.fillRect(px + off, py + off - 3, 1, 4);
    ctx.restore();
  }

  // NEXT STAGE PREVIEW — during the end-of-stage grace window, render a small
  // preview of the upcoming stage type so the player can mentally prepare during
  // the bonus tally. Reads game.stage as still-current; next stage = stage+1.
  if ((game.stageEndGraceTimer || 0) > 30 && game.stageEndGraceTimer < 110
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    const nextStage = (game.stage || 0) + 1;
    const isBossNext = nextStage % BOSS_STAGE_INTERVAL === 0;
    const isChallNext = !isBossNext && nextStage % 4 === 0;
    const typeLabel = isBossNext ? (nextStage >= 30 ? 'SUPER BOSS' : 'BOSS')
                    : isChallNext ? 'CHALLENGING' : 'NORMAL';
    const typeCol = isBossNext ? (nextStage >= 30 ? '#fc4' : '#f44')
                  : isChallNext ? '#f6f' : '#0ff';
    const previewTxt = 'NEXT: STAGE ' + nextStage + ' (' + typeLabel + ')';
    ctx.save();
    const fade = (game.stageEndGraceTimer - 30) / 30;
    ctx.globalAlpha = Math.min(1, fade) * 0.9;
    drawRetroText(previewTxt, BASE_W/2, BASE_H - 18, 5, typeCol);
    ctx.restore();
  }

  // STAGE CLEAR SPOTLIGHT — radial vignette centered on player ship during stage
  // clear cinematic. Inner circle ~30px stays bright; outside fades to dark.
  // Drawn here (HUD pre-text layer) so it darkens the playfield but not text.
  if ((game.stageClearSpotlightFrames || 0) > 0 && game.playerAlive) {
    const sfp = game.stageClearSpotlightFrames;
    const fade = sfp > 30 ? 1 : sfp / 30; // hold 30 frames, fade out over last 30
    ctx.save();
    ctx.globalAlpha = 0.55 * fade;
    ctx.fillStyle = '#000';
    // 4-ring concentric vignette around player position
    const cx = game.playerX, cy = game.playerY;
    for (let r = 0; r < 6; r++) {
      const rin = 30 + r * 8;
      const rout = rin + 8;
      ctx.globalAlpha = 0.10 * fade * (r + 1);
      // Top strip
      ctx.fillRect(0, 0, BASE_W, Math.max(0, cy - rout));
      // Bottom strip
      ctx.fillRect(0, cy + rout, BASE_W, Math.max(0, BASE_H - (cy + rout)));
      // Left strip
      ctx.fillRect(0, Math.max(0, cy - rout), Math.max(0, cx - rout), Math.min(BASE_H, 2 * rout));
      // Right strip
      ctx.fillRect(cx + rout, Math.max(0, cy - rout), Math.max(0, BASE_W - (cx + rout)), Math.min(BASE_H, 2 * rout));
      break; // single iteration — outer dim only
    }
    ctx.restore();
  }

  // SWARM DIVE WARNING — appears when 3+ enemies transition to dive same frame.
  // Center-top red bracketed banner, shorter life than rare-spawn alert.
  if ((game.swarmWarnLife || 0) > 0) {
    const sRatio = Math.min(1, game.swarmWarnLife / 36);
    const sBlink = (game.animFrame >> 1) % 2 === 0;
    ctx.save();
    ctx.globalAlpha = sRatio;
    const sText = 'SWARM DIVE!';
    const sw = sText.length * 5 + 10;
    ctx.fillStyle = '#200';
    ctx.fillRect(BASE_W/2 - sw/2, 36, sw, 10);
    const sCol = sBlink ? '#f44' : '#fff';
    ctx.fillStyle = sCol;
    ctx.fillRect(BASE_W/2 - sw/2, 36, sw, 1);
    ctx.fillRect(BASE_W/2 - sw/2, 45, sw, 1);
    drawRetroText(sText, BASE_W/2, 39, 6, sCol);
    ctx.restore();
  }

  // RARE SPAWN ALERT — flashing banner near top of screen when UFO / golden bee enters
  if ((game.rareSpawnAlertLife || 0) > 0 && game.rareSpawnAlertText) {
    const ratio = Math.min(1, game.rareSpawnAlertLife / 90);
    const blink = (game.animFrame >> 2) % 2 === 0;
    ctx.save();
    ctx.globalAlpha = ratio;
    // Bracket box around the text
    const w = game.rareSpawnAlertText.length * 5 + 8;
    ctx.fillStyle = '#100';
    ctx.fillRect(BASE_W/2 - w/2, 23, w, 10);
    const col = blink ? game.rareSpawnAlertColor : '#fff';
    ctx.fillStyle = col;
    // Top + bottom border (1px each)
    ctx.fillRect(BASE_W/2 - w/2, 23, w, 1);
    ctx.fillRect(BASE_W/2 - w/2, 32, w, 1);
    drawRetroText(game.rareSpawnAlertText, BASE_W/2, 26, 6, col);
    ctx.restore();
  }

  // FIRST-PLAY TUTORIAL HINTS — only on the very first stage 1 of a new install.
  // 3-phase sequence (5s each); auto-dismisses on first kill (markTutorialDone) or
  // after 18s total. Hints sit at the top-center where they don't block gameplay.
  if (!tutorialDone && game.stage === 1 && game.state === STATE.PLAYING) {
    const tf = game.stageFrames || 0;
    let hint = null;
    if (tf < 300)        hint = 'ARROWS / A D : MOVE';
    else if (tf < 600)   hint = 'SPACE : FIRE';
    else if (tf < 900)   hint = 'SHIFT : DASH (INVINCIBLE)';
    else if (tf < 1080)  hint = 'H : HELP, I : STATS';
    if (hint) {
      const blink = (game.animFrame >> 3) % 2 === 0 ? '#fc4' : '#fff';
      drawRetroText(hint, BASE_W/2, 30, 6, blink);
      drawRetroText('FIRST FLIGHT', BASE_W/2, 38, 5, COL.gray);
    }
  }
  // Score: glow yellow + flicker between yellow/white when a NEW HIGH was just set
  if (game.highScoreGlow > 0) {
    ctx.save();
    ctx.shadowColor = '#ff4';
    ctx.shadowBlur = 6 + 4 * Math.sin(game.animFrame * 0.3);
    const flick = (game.animFrame >> 2) % 2 === 0 ? '#ff4' : '#fff';
    drawRetroText(fmtScore(game.scoreDisplay || 0), 50, 17, 7, flick, 'right');
    ctx.restore();
  } else if ((game.comboLostFlashTimer || 0) > 0) {
    drawRetroText(fmtScore(game.scoreDisplay || 0), 50, 17, 7, '#888', 'right');
  } else {
    // SCORE TIER COLOR — dynamic color progression by score crossings
    // 1M+: rainbow cycle | 500k+: magenta | 100k+: gold | 25k+: cyan | else: white
    let _scCol = COL.white;
    const _sc = game.score || 0;
    if (_sc >= 1000000) {
      const _rb = ['#f44', '#fc4', '#ff4', '#0f8', '#0cf', '#a8f'];
      _scCol = _rb[Math.floor(game.animFrame / 6) % _rb.length];
    } else if (_sc >= 500000) {
      _scCol = '#f6f';
    } else if (_sc >= 100000) {
      _scCol = '#fc4';
    } else if (_sc >= 25000) {
      _scCol = COL.cyan;
    }
    drawRetroText(fmtScore(game.scoreDisplay || 0), 50, 17, 7, _scCol, 'right');
  }
  // NEAR-BEST INDICATOR — small ▲ symbol next to the score when chasing the
  // best-ever (90-99% of highScore). Pulses faster as the player gets closer.
  // Disappears once they pass the threshold (highScoreGlow takes over there).
  if (game.score < game.liveHighThreshold
      && game.liveHighThreshold > 0
      && game.score >= game.liveHighThreshold * 0.9) {
    const ratio = game.score / game.liveHighThreshold; // 0.9-0.999
    // Pulse rate scales with closeness (faster near best)
    const pulseRate = 0.15 + (ratio - 0.9) * 5;        // ~0.15 at 90%, ~0.65 at 100%
    const blink = (Math.sin(game.animFrame * pulseRate) + 1) * 0.5;
    const sym = ratio >= 0.97 ? '!' : ratio >= 0.94 ? '^' : '~';
    const col = ratio >= 0.97 ? '#fc4' : ratio >= 0.94 ? '#ff4' : '#cf4';
    ctx.save();
    ctx.globalAlpha = 0.5 + blink * 0.5;
    drawRetroText(sym, 53, 17, 6, col, 'left');

  // High score (replaced by boss title during BOSS_STAGE so they don't fight for the same row)

  }
  // STAGE PB PROGRESS BAR — 1px-tall bar showing current stage vs lifetime

  if (!minimalHud

  if (!minimalHud
