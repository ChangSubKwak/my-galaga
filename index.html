      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(_rx, _ry, 10 + (30 - game.lifeGainPulseTimer) * 0.3, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }
  if (game.lives > 5) {
    drawRetroText('+' + (game.lives - 5), 15 + 5 * 16, BASE_H - 8, 6, COL.white, 'left');
  }
  // DUAL FIGHTER badge — right after the lives row, indicates active dual-fighter mode
  let badgeX = 15 + Math.min(game.lives, 5) * 16 + 4;
  if (game.lives > 5) badgeX += 16; // make room for the +N overflow label
  if (game.dualFighter) {
    const blink = (game.animFrame >> 2) % 2 === 0 ? COL.yellow : '#fc4';
    drawRetroText('DUAL', badgeX, BASE_H - 8, 6, blink, 'left');
    badgeX += 24;
  }
  // SHIELD stack indicator — small green chevron icons, one per charge.
  // Without this, the only feedback for shield count was the orbital ring around the ship,
  // which is hard to read while dodging.
  if ((game.shieldCharges || 0) > 0) {
    const sy = BASE_H - 11;
    for (let s = 0; s < game.shieldCharges; s++) {
      const sx = badgeX + s * 6;
      ctx.fillStyle = '#4f8';
      ctx.fillRect(sx,     sy + 1, 4, 1);   // top bracket
      ctx.fillRect(sx,     sy + 2, 1, 4);   // left side
      ctx.fillRect(sx + 3, sy + 2, 1, 4);   // right side
      ctx.fillStyle = '#cfe';
      ctx.fillRect(sx + 1, sy + 5, 2, 1);   // chevron
    }
  }
  if (dangerLives && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    if ((game.animFrame >> 3) % 2 === 0) {
      drawRetroText('LAST LIFE', BASE_W/2, BASE_H - 22, 6, COL.red);
    }
    // Audio cue every 240 frames (existing)
    if (game.animFrame % 240 === 0) playSound('lowLife');
    // HEARTBEAT — additional low-thump sfx every 96 frames (1.6s) for visceral urgency
    if (game.animFrame % 96 === 0) playSound('heartbeat');
    // Screen edge red pulse — synced with heartbeat (peaks at the start of each cycle)
    const beatPhase = (game.animFrame % 96) / 96;
    const beatPulse = Math.max(0, 1 - beatPhase * 3.5); // sharp peak at phase 0, fade by 0.3
    if (beatPulse > 0) {
      ctx.save();
      ctx.globalAlpha = 0.18 * beatPulse;
      ctx.fillStyle = '#f22';
      ctx.fillRect(0, 0, BASE_W, 4);
      ctx.fillRect(0, BASE_H - 4, BASE_W, 4);
      ctx.fillRect(0, 0, 4, BASE_H);
      ctx.fillRect(BASE_W - 4, 0, 4, BASE_H);
      ctx.restore();
    }
  }

  // HUD STAGE SCORE EARNED — '+N' label below main score showing what was
  // gained THIS stage. Helps player gauge per-stage performance. Hidden when
  // minimal HUD or stage just started (delta 0).
  if (!minimalHud
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    const _stgScore = (game.score || 0) - (game.stageScoreStart || 0);
    if (_stgScore >= 100) {
      drawRetroText('+' + fmtScore(_stgScore), 50, 25, 4, '#888', 'right');
    }
  }
  // HIGH SCORE PROGRESS BAR — 1px bar at upper-center showing fraction of
  // current score toward the live high threshold. Hidden under minimal HUD
  // or when no high score is set yet.
  if (!minimalHud
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)
      && (game.liveHighThreshold || 0) > 0) {
    const _hsRatio = Math.min(1, (game.score || 0) / game.liveHighThreshold);
    const _hsBarX = 12, _hsBarY = 21, _hsBarW = 36;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(_hsBarX, _hsBarY, _hsBarW, 1);
    ctx.fillStyle = _hsRatio >= 1 ? '#fc4' : _hsRatio >= 0.9 ? '#ff4' : _hsRatio >= 0.5 ? '#0ff' : '#0f8';
    ctx.globalAlpha = 0.8;
    ctx.fillRect(_hsBarX, _hsBarY, Math.round(_hsBarW * _hsRatio), 1);
    ctx.restore();
  }
  // HUD PICKUP STREAK — small "P×N" cyan counter when consecutive no-death
  // pickups reach 2+. Hides on death (streak resets). Visible in normal HUD only.
  if (!minimalHud && (game.pickupStreak || 0) >= 2
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    const psStr = 'P×' + game.pickupStreak;
    const psCol = game.pickupStreak >= 10 ? '#fc4' : '#0ff';
    drawRetroText(psStr, BASE_W - 5, 38, 4, psCol, 'right');
  }
  // HUD STAGE PICKUP COUNTER — stage-level pickup count for thrifty awareness
  if (!minimalHud && (game.stagePowerUpsPicked || 0) >= 1
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    drawRetroText('S:' + game.stagePowerUpsPicked, BASE_W - 5, 46, 4, '#fc8', 'right');
  }
  // ENEMY BULLET COUNT — 'B N' when bullet density is meaningful (>=10).
  if (!minimalHud
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)
      && (game.enemyBullets || []).length >= 10) {
    const _bN = game.enemyBullets.length;
    const _bCol = _bN >= 40 ? '#f44' : _bN >= 25 ? '#f88' : '#fa8';
    drawRetroText('B ' + _bN, BASE_W - 5, 60, 4, _bCol, 'right');
  }

  // PICKUP HISTORY TICKER — last 5 drop types as small colored letter chips at
  // top-right (under S:N stage counter). Newest at right, oldest at left. Fades
  // older entries (alpha drop). Surfaces only mid-stage when there's data.
  if (!minimalHud && game.pickupHistory && game.pickupHistory.length > 0
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    const _pColors = { S:'#f44', N:'#0ff', P:'#f6f', T:'#8ff', R:'#fc4',
                       W:'#6cf', H:'#0f8', L:'#f6c', B:'#fff', E:'#0f8' };
    const _phHist = game.pickupHistory;
    const _phY = 54;
    for (let i = 0; i < _phHist.length; i++) {
      const tp = _phHist[i];
      const col = _pColors[tp] || '#aaa';
      ctx.save();
      ctx.globalAlpha = Math.max(0.3, 1 - i * 0.18);
      drawRetroText(tp, BASE_W - 5 - i * 6, _phY, 4, col, 'right');
      ctx.restore();
    }
  }

  // POWER UP PITY INDICATOR — small 15-dot row near top-left showing pity progress
  // (kills without a drop). Filled dots = kills accumulated; empty = headroom.
  // Drops invisibly when 0 — only surfaces when there's something to communicate.
  if (!minimalHud && (game.killsSincePowerUp || 0) >= 4
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    const pityCount = Math.min(15, game.killsSincePowerUp || 0);
    const py = BASE_H - 30;
    ctx.save();
    const dotsX = BASE_W - 5 - 15 * 3;
    for (let i = 0; i < 15; i++) {
      const filled = i < pityCount;
      ctx.globalAlpha = filled ? 0.85 : 0.20;
      ctx.fillStyle = pityCount >= 12 ? '#fc4' : '#0f8';
      ctx.fillRect(dotsX + i * 3, py, 2, 2);
    }
    ctx.restore();
  }

  // POWER-UP TIMER STRIP — compact 5-slot horizontal indicator showing remaining
  // time on each active temporary weapon timer. Pip + 1px progress bar per slot,
  // color-coded. Drawn right above lives row when at least one timer is active.
  // Pure read of existing rapidTimer/waveTimer/homingTimer/laserTimer/slowTimer.
  {
    const slots = [
      { t: game.rapidTimer  || 0, max: RAPID_DURATION,  label: 'R', col: '#fc4' },
      { t: game.waveTimer   || 0, max: WAVE_DURATION,   label: 'W', col: '#6cf' },
      { t: game.homingTimer || 0, max: HOMING_DURATION, label: 'H', col: '#0f8' },
      { t: game.laserTimer  || 0, max: LASER_DURATION,  label: 'L', col: '#f6c' },
      { t: game.slowTimer   || 0, max: SLOW_DURATION,   label: 'T', col: '#8ff' }
    ];
    const active = slots.filter(s => s.t > 0);
    if (active.length > 0) {
      const stripY = BASE_H - 23;
      const slotW = 16;
      const totalW = active.length * slotW;
      const startX = BASE_W/2 - totalW/2;
      ctx.save();
      for (let i = 0; i < active.length; i++) {
        const s = active[i];
        const sx = startX + i * slotW;
        const ratio = Math.max(0, Math.min(1, s.t / s.max));
        // Letter label (slot icon)
        const lowFlash = ratio < 0.2 && (game.animFrame >> 2) % 2 === 0;
        drawRetroText(s.label, sx + 6, stripY, 6, lowFlash ? '#f44' : s.col, 'center');
        // COUNTDOWN SECONDS — when timer < 1.5s, show '1s' / '0s' at top right
        // of letter so the player gets exact remaining seconds for last calls.
        if (s.t > 0 && s.t < 90) {
          const _sec = Math.ceil(s.t / 60);
          drawRetroText(_sec + 's', sx + slotW - 1, stripY - 4, 4, '#fff', 'right');
        }
        // 1px progress bar under label
        ctx.fillStyle = s.col;
        ctx.globalAlpha = 0.3;
        ctx.fillRect(sx + 1, stripY + 7, slotW - 2, 1);
        ctx.globalAlpha = 0.9;
        ctx.fillRect(sx + 1, stripY + 7, Math.round((slotW - 2) * ratio), 1);
      }
      ctx.restore();
    }
  }

  // Power-up levels (bottom right) — color-coded with mini gems + progression pip bar
  const lv = game.lvl || {S: 1, N: 1, P: 1};
  let px = BASE_W - 4;
  for (const type of ['P', 'N', 'S']) {
    drawRetroText(lv[type].toString(), px, BASE_H - 8, 7, '#fff', 'right');
    px -= 6;
    drawMiniGem(px - 2, BASE_H - 8, POWERUP_COL[type]);
    // POWER LEVEL PIPS — small fill bar above the gem (P/N/S 1x1 pixel pips, lit
    // up to current level). Visualizes lvl progress at a glance.
    const maxLvl = MAX_POWER_LVL[type] || 5;
    const pipBaseX = px - 2 - maxLvl + 1; // align right edge with gem
    const pipY = BASE_H - 14;
    for (let i = 0; i < maxLvl; i++) {
      const litCol = i < lv[type] ? POWERUP_COL[type] : '#333';
      ctx.fillStyle = litCol;
      ctx.fillRect(pipBaseX + i, pipY, 1, 2);
    }
    px -= 8;
  }

  // Challenge mode badge (red, blinking) — top center under HIGH SCORE
  if (game.challengeMode) {
    const blink = (game.animFrame >> 3) % 2 === 0;
    drawRetroText('CHALLENGE', BASE_W/2, 35, 6, blink ? COL.red : '#f88');
  }
  // Daily mode 1.25× score multiplier badge
  if (game.dailyMode) {
    const blink = (game.animFrame >> 3) % 2 === 0;
    drawRetroText('DAILY  1.25x', BASE_W/2, 35, 6, blink ? COL.green : '#8c8');
  }
  // HUD DIFFICULTY BADGE — small badge in lower-left when not on default 'normal'.
  if (difficultyMode === 'hard' || difficultyMode === 'easy') {
    const _diffCol = difficultyMode === 'hard' ? COL.red : COL.green;
    drawRetroText(difficultyMode.toUpperCase(), 4, 30, 4, _diffCol, 'left');
  }

  // Timed buff HUD: stacked countdown bars at top-center (most-recent on top).
  // Each bar: 60×3px, label below, fades the last 0.5s.
  {
    const buffs = [
      { t: game.slowTimer   || 0, max: SLOW_DURATION,   label: 'SLOW',   col: '#8df', icon: 'slow' },
      { t: game.rapidTimer  || 0, max: RAPID_DURATION,  label: 'RAPID',  col: '#fc4', icon: 'rapid' },
      { t: game.waveTimer   || 0, max: WAVE_DURATION,   label: 'WAVE',   col: '#f8a', icon: 'wave' },
      { t: game.homingTimer || 0, max: HOMING_DURATION, label: 'HOMING', col: '#0ef', icon: 'homing' },
      { t: game.laserTimer  || 0, max: LASER_DURATION,  label: 'LASER',  col: '#fff', icon: 'laser' }
    ].filter(b => b.t > 0);
    let by = 41;
    for (const b of buffs) {
      const ratio = b.t / b.max;
      const barW = 60;
      const bx = BASE_W/2 - barW/2;
      ctx.fillStyle = '#024';
      ctx.fillRect(bx, by, barW, 3);
      ctx.fillStyle = b.col;
      ctx.fillRect(bx, by, Math.round(barW * ratio), 3);
      // WEAPON KIND ICON — small picto-icon left of the timer bar.
      const ix = bx - 9, iy = by + 1;
      ctx.fillStyle = b.col;
      if (b.icon === 'slow') {
        // Clock face — circle outline + center dot + hand
        ctx.fillRect(ix + 1, iy, 5, 1);
        ctx.fillRect(ix + 1, iy + 4, 5, 1);
        ctx.fillRect(ix, iy + 1, 1, 3);
        ctx.fillRect(ix + 6, iy + 1, 1, 3);
        ctx.fillRect(ix + 3, iy + 2, 1, 1);
        ctx.fillRect(ix + 3, iy + 3, 2, 1); // clock hand
      } else if (b.icon === 'rapid') {
        // Three forward chevrons (suggests speed)
        for (let k = 0; k < 3; k++) {
          ctx.fillRect(ix + k * 2, iy + 1, 1, 3);
          ctx.fillRect(ix + k * 2 + 1, iy + 2, 1, 1);
        }
      } else if (b.icon === 'wave') {
        // Sine zigzag pattern
        ctx.fillRect(ix,     iy + 2, 1, 1);
        ctx.fillRect(ix + 1, iy + 1, 1, 1);
        ctx.fillRect(ix + 2, iy + 2, 1, 1);
        ctx.fillRect(ix + 3, iy + 3, 1, 1);
        ctx.fillRect(ix + 4, iy + 2, 1, 1);
        ctx.fillRect(ix + 5, iy + 1, 1, 1);
        ctx.fillRect(ix + 6, iy + 2, 1, 1);
      } else if (b.icon === 'homing') {
        // Crosshair (+ in box)
        ctx.fillRect(ix + 1, iy, 5, 1);
        ctx.fillRect(ix + 1, iy + 4, 5, 1);
        ctx.fillRect(ix, iy + 1, 1, 3);
        ctx.fillRect(ix + 6, iy + 1, 1, 3);
        ctx.fillRect(ix + 3, iy + 2, 1, 1);
      } else if (b.icon === 'laser') {
        // Vertical beam thin
        ctx.fillRect(ix + 3, iy, 1, 5);
        ctx.fillRect(ix + 2, iy + 1, 1, 1);
        ctx.fillRect(ix + 4, iy + 1, 1, 1);
        ctx.fillRect(ix + 2, iy + 3, 1, 1);
        ctx.fillRect(ix + 4, iy + 3, 1, 1);
      }
      drawRetroText(b.label, BASE_W/2, by + 6, 5, b.col);
      by += 11;
    }
  }
  // COMBO DECAY WARNING — when an active combo (>= 5) is about to expire (last
  // ~0.4s of decay timer), pulse a red edge band so the player knows to chain a
  // kill fast. Skipped at low combos (< 5) to avoid spam on routine play.
  if (game.combo >= 5 && (game.comboTimer || 0) > 0 && game.comboTimer < 24) {
    const decayRatio = 1 - game.comboTimer / 24; // 0 → 1 as it approaches expiry
    const pulse = 0.5 + 0.5 * Math.sin(game.animFrame * 0.5);
    ctx.save();
    ctx.globalAlpha = (0.18 + 0.18 * pulse) * decayRatio;
    ctx.fillStyle = '#f44';
    // Top + bottom thin bands (HUD-safe)
    ctx.fillRect(0, 6, BASE_W, 2);
    ctx.fillRect(0, BASE_H - 8, BASE_W, 2);
    ctx.restore();
  }
  // Cheat indicator — small blinking GOD tag in the corner so it's obviously not legit
  if (game.cheatInvincible) {
    const blink = (game.animFrame >> 3) % 2 === 0;
    drawRetroText('GOD', 4, 35, 6, blink ? '#fc4' : '#fa0', 'left');
  }
  // ACTIVE PERK BADGE — small label in the timed-buff region so the player always
  // knows which perk is influencing this stage. Drawn left of the timer column.
  if (game.activePerk && PERKS[game.activePerk]) {
    const p = PERKS[game.activePerk];
    drawRetroText('PERK: ' + p.name, 4, 47, 5, p.col, 'left');
  }

  // Demo mode banner
  if (game.isDemo) {
    if ((game.animFrame >> 4) % 2 === 0) {
      drawRetroText('* DEMO MODE *', BASE_W/2, 35, 9, COL.yellow);
    }
    drawRetroText('PRESS ANY KEY', BASE_W/2, 46, 6, COL.gray);
  }

  // Combo indicator (only when combo ≥ 3) — top-left under HUD
  if (game.combo >= 3) {
    const mult = comboMultiplier(game.combo);
    const col = mult >= 2.5 ? '#f6f' : mult >= 2 ? '#f80' : mult >= 1.5 ? '#ff4' : '#0ff';
    const decay = game.comboTimer / COMBO_DECAY;
    // Decay bar — pulse glow when combo just bumped (timer near full)
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(4, 28, 60, 9);
    ctx.fillStyle = col;
    // TIER HEIGHT — bar height 2 normally, 3 at combo >= 20 for high-tier weight
    const _bH = game.combo >= 20 ? 3 : 2;
    ctx.fillRect(4, 28, Math.round(60 * decay), _bH);
    if (decay > 0.92) {
      ctx.globalAlpha = (decay - 0.92) * 12;
      ctx.fillStyle = '#fff';
      ctx.fillRect(4, 28, Math.round(60 * decay), _bH);
    }
    ctx.restore();
    drawRetroText('×' + mult + ' COMBO ' + game.combo, 6, 33, 6, col, 'left');
    // COMBO TIER NAME — tier label by combo level
    {
      let _tierN = null;
      if (game.combo >= 30) _tierN = 'MAX';
      else if (game.combo >= 20) _tierN = 'PLATINUM';
      else if (game.combo >= 15) _tierN = 'GOLD';
      else if (game.combo >= 10) _tierN = 'SILVER';
      else if (game.combo >= 5) _tierN = 'BRONZE';
      if (_tierN) drawRetroText(_tierN, 70, 33, 4, col, 'left');
    }
    // Running combo total (small, just below)
    const accum = game.comboBonusAccum || 0;
    if (accum > 0) {
      drawRetroText('+' + fmtScore(accum), 6, 39, 5, '#ff4', 'left');
    }
    // COMBO DECAY SECONDS — when timer drops below 1s (60 frames), show countdown
    // text to the right of combo bar so the player sees how much time is left.
    if (game.comboTimer < 60 && game.comboTimer > 0) {
      const secs = (game.comboTimer / 60).toFixed(1);
      drawRetroText(secs + 's', 66, 33, 5, '#f44', 'left');
    }
    // COMBO MILESTONE PROGRESS — find next unclaimed arsenal tier and draw a tiny
    // bar showing distance-to-next-unlock. Bar at y=45, 60px wide.
    const arsenalTiers = [25, 50, 75, 100];
    const arsenalColors = ['#fc4', '#f8a', '#0ef', '#fff'];
    let nextTier = null, nextCol = '#fff', prevTier = 0;
    for (let i = 0; i < arsenalTiers.length; i++) {
      if (!game.comboArsenalClaimed[arsenalTiers[i]]) {
        nextTier = arsenalTiers[i];
        nextCol = arsenalColors[i];
        prevTier = i === 0 ? 0 : arsenalTiers[i - 1];
        break;
      }
    }
    if (nextTier !== null && game.combo > 0) {
      const span = nextTier - prevTier;
      const into = Math.max(0, Math.min(span, game.combo - prevTier));
      const ratio = into / span;
      ctx.save();
      // Track
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(4, 45, 60, 3);
      // Fill
      ctx.fillStyle = nextCol;
      ctx.globalAlpha = 0.85;
      ctx.fillRect(4, 45, Math.round(60 * ratio), 3);
      // Pulse glow when ≥90% to next tier
      if (ratio >= 0.9) {
        ctx.globalAlpha = 0.5 + 0.5 * Math.sin(game.animFrame * 0.4);
        ctx.fillStyle = '#fff';
        ctx.fillRect(4, 45, Math.round(60 * ratio), 1);
      }
      ctx.restore();
      drawRetroText('→' + nextTier, 66, 45, 5, nextCol, 'left');
      // ARSENAL TIER IMMINENT — within 3 combo of next tier, blink gold tag
      if ((nextTier - game.combo) <= 3 && (nextTier - game.combo) > 0) {
        const _aiB = (game.animFrame >> 2) % 2 === 0;
        if (_aiB) drawRetroText('IMMINENT', 4, 53, 4, '#fc4', 'left');
      }
    }
    // COMBO ARSENAL PROGRESS DOTS — 4-tier overview row (just below bar)
    // Claimed: filled gold/pink/cyan/white. Next-target: pulsing. Future: dim outline.
    {
      const dotY = 50;
      for (let i = 0; i < arsenalTiers.length; i++) {
        const dx = 4 + i * 5;
        const claimed = !!game.comboArsenalClaimed[arsenalTiers[i]];
        const isNext = !claimed && nextTier === arsenalTiers[i];
        ctx.save();
        if (claimed) {
          ctx.fillStyle = arsenalColors[i];
          ctx.globalAlpha = 0.95;
          ctx.fillRect(dx, dotY, 3, 3);
        } else if (isNext) {
          ctx.fillStyle = arsenalColors[i];
          ctx.globalAlpha = 0.5 + 0.5 * Math.sin(game.animFrame * 0.3);
          ctx.fillRect(dx, dotY, 3, 3);
        } else {
          ctx.fillStyle = arsenalColors[i];
          ctx.globalAlpha = 0.25;
          ctx.fillRect(dx, dotY, 3, 1);
          ctx.fillRect(dx, dotY + 2, 3, 1);
          ctx.fillRect(dx, dotY, 1, 3);
          ctx.fillRect(dx + 2, dotY, 1, 3);
        }
        ctx.restore();
      }
    }
    // Tier transition flash — within 12 frames of hitting tier-up combo (5/10/15/30)
    if ([5, 10, 15, 30, 60, 100].some(t => game.combo === t)) {
      ctx.save();
      ctx.globalAlpha = 0.5 - (game.animFrame % 12) / 24;
      ctx.fillStyle = col;
      ctx.fillRect(2, 26, 64, 17);
      ctx.restore();
    }
  }

  // Real-time stage accuracy (top-left, second row) — only after some shots fired
  if (!minimalHud && (game.stageShotsFired || 0) >= 4) {
    const acc = Math.round((game.stageShotsHit / game.stageShotsFired) * 100);
    const accCol = acc >= 90 ? '#0f8' : acc >= 70 ? COL.cyan : acc >= 40 ? COL.yellow : '#f88';
    drawRetroText('ACC ' + acc + '%', 6, game.combo >= 3 ? 41 : 30, 6, accCol, 'left');
  }

  // RUN KILL COUNTER — small "K: N" near accuracy showing cumulative kills this run.
  // Activates only after the player has actually killed something (≥ 10 kills) so
  // the HUD stays clean for the opening stage.
  if (!minimalHud && (game.stats && game.stats.kills) >= 10
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    const kY = game.combo >= 3
              ? ((game.stageShotsFired || 0) >= 4 ? 49 : 41)
              : ((game.stageShotsFired || 0) >= 4 ? 38 : 30);
    const k = game.stats.kills;
    const kCol = k >= 1000 ? '#fc4' : k >= 500 ? '#0ff' : '#aaa';
    drawRetroText('K ' + k, 6, kY, 5, kCol, 'left');
    // HUD KILLS PER MINUTE — after 60s of run, show K/M rate metric below kill
    // counter. Useful speedrun / efficiency feedback.
    if ((game.runFrames || 0) >= 3600) {
      const minutes = (game.runFrames || 0) / 3600;
      const kpm = Math.round(k / minutes);
      const kpmCol = kpm >= 60 ? '#fc4' : kpm >= 30 ? '#0ff' : '#888';
      drawRetroText(kpm + ' K/M', 6, kY + 6, 4, kpmCol, 'left');
    }
  }

  // "ENEMIES LEFT" mini-counter when the stage is nearly done (≤ 6 alive in PLAYING)
  if (game.state === STATE.PLAYING && game.allEntered) {
    const alive = (game.enemies || []).filter(e => e.alive).length;
    if (alive > 0 && alive <= 6) {
      const lblY = game.combo >= 3 ? 49 : 38;
      drawRetroText(alive + ' LEFT', 6, lblY, 6, COL.yellow, 'left');
    }
  }

  // Difficulty indicator on HUD when not normal — small badge
  if (difficultyMode !== 'normal' && (game.state === STATE.PLAYING || game.state === STATE.BOSS_STAGE || game.state === STATE.CHALLENGING)) {
    const dCol = difficultyMode === 'hard' ? COL.red : COL.green;
    const tag = difficultyMode === 'hard' ? '!H!' : '~E~';
    drawRetroText(tag, BASE_W - 5, 26, 5, dCol, 'right');
  }
  // Boss HP bar + phase marker — visualizes aggregate boss health with color
  // gradient (green > yellow > red), phase-2 threshold tick (40%), and pulsing
  // glow when HP < 25%. Replaces the prior text-only indicator with richer info.
  if (game.state === STATE.BOSS_STAGE && game.megaBosses && game.megaBosses.length) {
    const totalMax = game.megaBosses.reduce((s, mb) => s + mb.maxHp, 0);
    const totalHp  = game.megaBosses.reduce((s, mb) => s + (mb.alive ? mb.hp : 0), 0);
    const pct      = totalMax > 0 ? Math.round((totalHp / totalMax) * 100) : 0;
    const ratio    = totalMax > 0 ? totalHp / totalMax : 0;
    const barW = 110;
    const bx = BASE_W/2 - barW/2;
    const by = 34;
    // Track (dim)
    ctx.save();
    ctx.fillStyle = '#311';
    ctx.fillRect(bx - 1, by - 1, barW + 2, 5);
    ctx.fillStyle = '#100';
    ctx.fillRect(bx, by, barW, 3);
    // Color stops along the fill — gradient via segmented draw
    const fillW = Math.round(barW * ratio);
    if (fillW > 0) {
      // Pulse glow when low HP
      if (ratio < 0.25) {
        const pulse = 0.5 + 0.5 * Math.sin(game.animFrame * 0.4);
        ctx.globalAlpha = 0.4 + 0.3 * pulse;
        ctx.fillStyle = '#f44';
        ctx.fillRect(bx - 2, by - 2, fillW + 4, 7);
        ctx.globalAlpha = 1;
      }
      // Segment colors: green (full) → yellow (mid) → red (low)
      const fillCol = ratio > 0.6 ? '#0f8'
                    : ratio > 0.3 ? '#fc4'
                    : '#f44';
      ctx.fillStyle = fillCol;
      ctx.fillRect(bx, by, fillW, 3);
      // Highlight inner line for shine
      ctx.fillStyle = '#fff';
      ctx.globalAlpha = 0.3;
      ctx.fillRect(bx, by, fillW, 1);
      ctx.globalAlpha = 1;
    }
    // Phase 2 marker — vertical tick at 40% threshold (boss morphs there)
    const p2X = bx + Math.round(barW * 0.4);
    ctx.fillStyle = ratio > 0.4 ? '#fc4' : '#f44';
    ctx.fillRect(p2X, by - 2, 1, 7);
    ctx.restore();
    // Percentage label below bar
    const labelCol = ratio > 0.5 ? COL.green : ratio > 0.25 ? COL.yellow : COL.red;
    drawRetroText('HP ' + pct + '%', BASE_W/2, 41, 5, labelCol);
  }

  drawMiniRadar();

  // Dash cooldown bar (bottom-right, above the power-up gems)
  if (game.dashCooldown > 0 || game.dashTimer > 0) {
    const ratio = game.dashTimer > 0 ? 1 : (1 - game.dashCooldown / 60);
    const barW = 28;
    const bx = BASE_W - 6 - barW;
    const by = BASE_H - 16;
    ctx.fillStyle = '#022';
    ctx.fillRect(bx, by, barW, 2);
    ctx.fillStyle = game.dashTimer > 0 ? '#fff' : COL.cyan;
    ctx.fillRect(bx, by, Math.round(barW * ratio), 2);
  }
}

function drawGameOverScreen() {
  // Animated entrance — slide in from edges over the first 30 frames
  const elapsedGo = 180 - game.gameOverTimer;
  const entry = Math.min(1, elapsedGo / 30);
  const cy = BASE_H / 2 - 8;

  // GAME OVER WARP OUT — first 60 frames: stars collapse inward (gravity well).
  // Symmetric to STAGE INTRO WARP (radial outward); here stars converge to center,
  // suggesting the player's universe folding in. Visual cinematic close.
  if (elapsedGo < 60) {
    const warpRatio = elapsedGo / 60;          // 0 → 1
    const pullStrength = warpRatio * 0.85;      // 0 → 0.85
    const cx = BASE_W / 2, ccy = BASE_H / 2;
    ctx.save();
    ctx.fillStyle = '#fff';
    for (const s of stars) {
      // Pull star position toward center; render at lerped position
      const dx = cx - s.x, dy = ccy - s.y;
      const px = s.x + dx * pullStrength;
      const py = s.y + dy * pullStrength;
      // Streak from original to current position for motion blur
      ctx.globalAlpha = (1 - warpRatio * 0.5) * s.brightness;
      ctx.fillRect(Math.round(px), Math.round(py), 1, 1);
      // Trail line back to original (3 segments)
      if (warpRatio > 0.15) {
        for (let k = 1; k <= 3; k++) {
          const tk = k / 4;
          const ix = s.x + dx * pullStrength * (1 - tk);
          const iy = s.y + dy * pullStrength * (1 - tk);
          ctx.globalAlpha = (1 - tk) * 0.5 * s.brightness;
          ctx.fillRect(Math.round(ix), Math.round(iy), 1, 1);
        }
      }
    }
    // Central white flash near the end of the warp
    if (elapsedGo > 50) {
      ctx.globalAlpha = (elapsedGo - 50) / 10 * 0.35;
      ctx.fillStyle = '#fff';
      ctx.fillRect(cx - 6, ccy - 6, 12, 12);
    }
    ctx.restore();
  }

  // Dimmed backdrop expanding height
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  const panelH = 110 * entry;
  ctx.fillRect(0, cy - panelH / 2, BASE_W, panelH);
  // Decorative dashed borders
  ctx.fillStyle = 'rgba(255,68,68,0.6)';
  for (let i = 0; i < BASE_W; i += 6) {
    ctx.fillRect(i, cy - panelH / 2, 3, 1);
    ctx.fillRect(i, cy + panelH / 2 - 1, 3, 1);
  }
  ctx.restore();

  if (entry < 1) return;

  // Glowing GAME OVER title — initial frames have a strong shake, then settle
  ctx.save();
  const glow = 0.6 + 0.4 * Math.sin(game.animFrame * 0.08);
  ctx.shadowColor = COL.red;
  ctx.shadowBlur = 12 * glow;
  // Shake: strong in first 30 entry frames, decays with elapsedGo
  const goShake = Math.max(0, 1 - elapsedGo / 30) * 4;
  const goSx = (Math.random() - 0.5) * goShake;
  const goSy = (Math.random() - 0.5) * goShake;
  drawRetroText('GAME OVER', BASE_W/2 + goSx, cy - 35 + goSy, 16, COL.red);
  ctx.restore();
  // PILOT TITLE LABEL — '[CSN] TITLE' below GAME OVER
  if (playerCallsign && playerCallsign !== '???' && typeof computePilotTitle === 'function') {
    const _csCol = (typeof callsignColor === 'function') ? callsignColor() : '#888';
    drawRetroText('[' + playerCallsign + ']  ' + computePilotTitle(),
                  BASE_W/2, cy - 28, 5, _csCol);
  }

  // Ship + mode badge (between title and SCORE row)
  {
    const shipName = (game.ship && game.ship.name) || 'GAM-42';
    const shipCol = (game.ship && game.ship.color) || '#0cf';
    const modeLabel = game.dailyMode ? 'DAILY ' + dailyLabel()
                    : game.challengeMode ? 'CHALLENGE'
                    : 'NORMAL';
    const modeCol = game.dailyMode ? COL.green
                  : game.challengeMode ? COL.red
                  : COL.gray;
    drawPlayer(BASE_W/2 - 50, cy - 23, shipCol);
    drawRetroText(shipName, BASE_W/2 - 36, cy - 23, 6, shipCol, 'left');
    drawRetroText('|  ' + modeLabel, BASE_W/2 + 4, cy - 23, 6, modeCol, 'left');
  }

  // Score (counts up from 0 during frames 30→90 of the entrance) — eased curve for satisfying tally
  const countStart = 30, countEnd = 90;
  const linearT = Math.max(0, Math.min(1, (elapsedGo - countStart) / (countEnd - countStart)));
  // Ease-out curve so big scores ramp up fast at first then settle
  const countT = 1 - Math.pow(1 - linearT, 2);
  const displayScore = Math.floor(game.score * countT);
  drawRetroText('SCORE', BASE_W/2 - 40, cy - 12, 7, COL.cyan);
  // Score color escalates as it counts up — yellow at high totals, magenta at 10M+
  const scCol = game.score >= 10000000 ? '#f6f' : game.score >= 1000000 ? COL.yellow : game.score >= 100000 ? '#ff8' : COL.white;
  drawRetroText(fmtScore(displayScore), BASE_W/2 + 40, cy - 12, 9, scCol, 'right');
  // SCORE TIER LABEL — name tier based on final score
  if (linearT >= 1) {
    const _sT = game.score >= 10000000 ? 'LEGEND'
              : game.score >= 1000000  ? 'PLATINUM'
              : game.score >= 100000   ? 'GOLD'
              : game.score >= 10000    ? 'SILVER'
              : game.score >= 1000     ? 'BRONZE'
              : null;
    if (_sT) {
      const _sTcol = game.score >= 10000000 ? '#f6f'
                   : game.score >= 1000000  ? '#fc4'
                   : game.score >= 100000   ? '#ff8'
                   : game.score >= 10000    ? '#0ff' : '#0f8';
      drawRetroText(_sT + ' TIER', BASE_W/2 - 40, cy - 4, 4, _sTcol, 'left');
    }
  }
  // SCORE PB COMPARE — when count finishes (linearT >=1) show 'NEW HIGH!' or 'HI: N'.
  if (linearT >= 1 && (game.highScore || 0) > 0) {
    if (game.score >= game.highScore) {
      const _hsB = (game.animFrame >> 2) % 2 === 0 ? '#fc4' : '#ff4';
      drawRetroText('NEW HIGH!', BASE_W/2 + 40, cy - 4, 4, _hsB, 'right');
    } else {
      drawRetroText('HI: ' + fmtScore(game.highScore), BASE_W/2 + 40, cy - 4, 4, '#888', 'right');
    }
  }

  // Stats: kills, accuracy, max stage
  const s = game.stats || { kills: 0, shotsFired: 0, shotsHit: 0, maxStage: game.stage };
  const acc = s.shotsFired === 0 ? 0 : Math.round((s.shotsHit / s.shotsFired) * 100);

  // Each row uses its own count-up window so they roll up sequentially after SCORE finishes
  function rollT(start, end) {
    return Math.max(0, Math.min(1, (elapsedGo - start) / (end - start)));
  }
  const tKills    = rollT(95, 115);
  const tAcc      = rollT(105, 125);
  const tStage    = rollT(115, 130);
  const tCombo    = rollT(125, 140);
  const tTime     = rollT(135, 150);

  drawRetroText('KILLS', BASE_W/2 - 40, cy, 6, COL.cyan);
  drawRetroText(Math.floor(s.kills * tKills).toString(), BASE_W/2 + 40, cy, 7, COL.yellow, 'right');
  // KILLS TIER LABEL — after count completes
  if (tKills >= 1) {
    const _kT = s.kills >= 1000 ? 'EXTERMINATOR'
              : s.kills >= 500  ? 'SLAYER'
              : s.kills >= 200  ? 'HUNTER'
              : s.kills >= 50   ? 'TRACKER'
              : null;
    if (_kT) {
      const _kTcol = s.kills >= 1000 ? '#fc4' : s.kills >= 500 ? '#0ff' : s.kills >= 200 ? '#0f8' : '#888';
      drawRetroText(_kT, BASE_W/2 + 40, cy + 6, 4, _kTcol, 'right');
    }
  }

  drawRetroText('ACCURACY', BASE_W/2 - 40, cy + 10, 6, COL.cyan);
  drawRetroText(Math.floor(acc * tAcc) + '%', BASE_W/2 + 40, cy + 10, 7, COL.yellow, 'right');
  // ACC TIER LABEL — after count completes
  if (tAcc >= 1) {
    const _aT = acc >= 95 ? 'SHARPSHOOTER'
              : acc >= 85 ? 'CRACK SHOT'
              : acc >= 70 ? 'MARKSMAN'
              : acc >= 50 ? 'STEADY HAND'
              : null;
    if (_aT) {
      const _aTcol = acc >= 95 ? '#fc4' : acc >= 85 ? '#0ff' : acc >= 70 ? '#0f8' : '#888';
      drawRetroText(_aT, BASE_W/2 - 40, cy + 16, 4, _aTcol, 'left');
    }
  }

  drawRetroText('MAX STAGE', BASE_W/2 - 40, cy + 18, 6, COL.cyan);
  drawRetroText(Math.floor(s.maxStage * tStage).toString(), BASE_W/2 + 40, cy + 18, 7, COL.yellow, 'right');
  // STAGE TIER LABEL — after stage count completes
  if (tStage >= 1) {
    const _ms = s.maxStage || 0;
    const _sgT = _ms >= 80 ? 'VOIDWALKER'
              : _ms >= 50 ? 'APEX'
              : _ms >= 30 ? 'VOYAGER'
              : _ms >= 15 ? 'PATHFINDER'
              : _ms >= 5  ? 'SCOUT'
              : null;
    if (_sgT) {
      const _sgTcol = _ms >= 80 ? '#f6f' : _ms >= 50 ? '#fc4' : _ms >= 30 ? '#0ff' : _ms >= 15 ? '#0f8' : '#888';
      drawRetroText(_sgT, BASE_W/2 - 40, cy + 24, 4, _sgTcol, 'left');
    }
  }
  // PB COMPARISON — tiny 'BEST: N' below max stage when we have lifetime PB to compare
  try {
    const _csNg = (typeof loadCumStats === 'function') ? loadCumStats(false) : {};
    const _csCg = (typeof loadCumStats === 'function') ? loadCumStats(true) : {};
    const _pbStage = Math.max(_csNg.bestStage || 0, _csCg.bestStage || 0);
    if (_pbStage > 0 && tStage >= 1) {
      const _pbCol = (s.maxStage || 0) >= _pbStage ? '#fc4' : '#888';
      const _pbLab = (s.maxStage || 0) >= _pbStage ? 'PB!' : 'BEST: ' + _pbStage;
      drawRetroText(_pbLab, BASE_W/2 + 40, cy + 24, 4, _pbCol, 'right');
    }
  } catch (e) {}

  drawRetroText('BEST COMBO', BASE_W/2 - 40, cy + 26, 6, COL.cyan);
  drawRetroText(Math.floor((game.comboBest || 0) * tCombo).toString(), BASE_W/2 + 40, cy + 26, 7, COL.yellow, 'right');
  // COMBO TIER LABEL — after count completes
  if (tCombo >= 1) {
    const _cb = game.comboBest || 0;
    const _cT = _cb >= 30 ? 'MAX'
             : _cb >= 20 ? 'PLATINUM'
             : _cb >= 15 ? 'GOLD'
             : _cb >= 10 ? 'SILVER'
             : _cb >= 5  ? 'BRONZE'
             : null;
    if (_cT) {
      const _cTcol = _cb >= 30 ? '#fc4' : _cb >= 20 ? '#f6f' : _cb >= 15 ? '#ff8' : _cb >= 10 ? '#0ff' : '#0f8';
      drawRetroText(_cT, BASE_W/2 - 40, cy + 32, 4, _cTcol, 'left');
    }
  }
  // COMBO PB COMPARE — when count finishes show NEW BEST! or PB: N
  if (tCombo >= 1) {
    try {
      const _cbE = parseInt(localStorage.getItem('galagaMaxComboEver') || '0', 10) || 0;
      if (_cbE > 0) {
        if ((game.comboBest || 0) >= _cbE) {
          drawRetroText('NEW BEST!', BASE_W/2 + 40, cy + 32, 4, '#fc4', 'right');
        } else {
          drawRetroText('PB: x' + _cbE, BASE_W/2 + 40, cy + 32, 4, '#888', 'right');
        }
      }
    } catch (e) {}
  }

  const ts = Math.floor((game.runFrames || 0) / 60);
  const tsShown = Math.floor(ts * tTime);
  const mmgo = String(Math.floor(tsShown / 60)).padStart(2, '0');
  const ssgo = String(tsShown % 60).padStart(2, '0');
  drawRetroText('TIME', BASE_W/2 - 40, cy + 34, 6, COL.cyan);
  drawRetroText(mmgo + ':' + ssgo, BASE_W/2 + 40, cy + 34, 7, COL.yellow, 'right');
  // TIME TIER LABEL — after count completes
  if (tTime >= 1) {
    const _rt = game.runFrames || 0;
    const _tT = _rt >= 108000 ? 'MARATHONER'   // 30 min
              : _rt >= 54000  ? 'VETERAN'      // 15 min
              : _rt >= 18000  ? 'SURVIVOR'     // 5 min
              : _rt >= 7200   ? 'RECRUIT'      // 2 min
              : null;
    if (_tT) {
      const _tTcol = _rt >= 108000 ? '#fc4' : _rt >= 54000 ? '#0ff' : _rt >= 18000 ? '#0f8' : '#888';
      drawRetroText(_tT, BASE_W/2 - 40, cy + 40, 4, _tTcol, 'left');
    }
  }
  // COMPLETION DELTA — show gain over the run when finishing tally completes
  if (tTime >= 1 && typeof computeCompositeCompletion === 'function') {
    const _endCmp = computeCompositeCompletion();
    const _delta = _endCmp - (game.runStartCmp || 0);
    if (_delta >= 1) {
      drawRetroText('+' + _delta + '% PROGRESS', BASE_W/2 + 40, cy + 40, 4, '#fc4', 'right');
    }
    // TIER CROSSING — when CMPL crossed 25/50/75/100 this run
    const _tiers = [25, 50, 75, 100];
    let _xed = 0;
    for (const _tt of _tiers) {
      if ((game.runStartCmp || 0) < _tt && _endCmp >= _tt) _xed = _tt;
    }
    if (_xed > 0) {
      drawRetroText(_xed + '% TIER CROSSED', BASE_W/2 + 40, cy + 46, 4,
                    _xed >= 100 ? '#fc4' : _xed >= 75 ? '#f6f' : _xed >= 50 ? '#0ff' : '#0f8',
                    'right');
    }
    // CMPL TIER NAME — small tier name with %
    const _gcTier = _endCmp >= 100 ? 'COMPLETED'
                 : _endCmp >= 80 ? 'ELITE'
                 : _endCmp >= 50 ? 'VETERAN'
                 : _endCmp >= 20 ? 'EXPLORER'
                 : 'BEGINNER';
    drawRetroText('CMPL ' + _endCmp + '% ' + _gcTier, BASE_W/2 - 40, cy + 40, 4, '#888', 'left');
  }
  // DAILY MISSION DONE BADGE — if mission completed during this run
  if (tTime >= 1 && game.dailyMode && game._dailyMissionFired) {
    drawRetroText('★ DAILY MISSION DONE', BASE_W/2, cy + 46, 4, '#fc4');
  }
  // PERK PEEK — active perk used this run
  if (tTime >= 1 && game.activePerk && typeof PERKS !== 'undefined' && PERKS[game.activePerk]) {
    const _gpP = PERKS[game.activePerk];
    drawRetroText('PERK ' + _gpP.name, BASE_W/2 - 40, cy + 46, 4, _gpP.col, 'left');
  }
  // KILLS PER MINUTE — efficiency metric below stats
  if (tTime >= 1 && (game.runFrames || 0) >= 1800 && (s.kills || 0) >= 5) {
    const _mins = (game.runFrames || 1) / 3600;
    const _kpm = Math.round((s.kills || 0) / _mins);
    const _kpmCol = _kpm >= 100 ? '#fc4' : _kpm >= 50 ? '#0ff' : _kpm >= 25 ? '#0f8' : '#888';
    const _kpmN = _kpm >= 100 ? ' RAPID'
              : _kpm >= 50  ? ' QUICK'
              : _kpm >= 25  ? ' STEADY'
              : '';
    drawRetroText('K/MIN ' + _kpm + _kpmN, BASE_W/2 - 30, cy + 52, 4, _kpmCol);
    // SCORE/MIN — symmetric efficiency metric
    if ((game.score || 0) >= 1000) {
      const _spm = Math.round((game.score || 0) / _mins);
      const _spmCol = _spm >= 50000 ? '#fc4' : _spm >= 20000 ? '#0ff' : _spm >= 5000 ? '#0f8' : '#888';
      const _spmN = _spm >= 50000 ? ' PRODIGY'
                 : _spm >= 20000 ? ' STRONG'
                 : _spm >= 5000  ? ' STEADY'
                 : '';
      drawRetroText('S/MIN ' + fmtScore(_spm) + _spmN, BASE_W/2 + 30, cy + 52, 4, _spmCol);
    }
  }
  // SHIP KILLS CONTRIBUTION — kills added to current ship mastery this run.
  if (tTime >= 1 && (s.kills || 0) >= 10 && typeof selectedShip !== 'undefined') {
    const _sCol2 = (game.ship && game.ship.color) || '#0cf';
    const _skN = (s.kills) >= 500 ? ' CHAMPION'
              : (s.kills) >= 200 ? ' ACE'
              : (s.kills) >= 50  ? ' PILOT'
              : '';
    drawRetroText('+' + fmtScore(s.kills) + ' SHIP KILLS' + _skN, BASE_W/2, cy + 58, 4, _sCol2);
  }
  // EXTRA SHIPS EARNED — count of extra lives gained this run
  if (tTime >= 1 && (game.extraShipsRun || 0) >= 1) {
    const _es = game.extraShipsRun;
    const _esN = _es >= 5 ? ' ARMADA'
              : _es >= 3 ? ' FLEET'
              : ' REINFORCED';
    drawRetroText('+' + _es + ' SHIPS EARNED' + _esN, BASE_W/2, cy + 70, 4, '#ff4');
  }
  // MULTIKILL BEST — biggest same-frame kill count this run
  if (tTime >= 1 && (game.multiKillBest || 0) >= 3) {
    const _mkb = game.multiKillBest;
    const _mkN = _mkb >= 8 ? ' OCTOKILL'
              : _mkb >= 5 ? ' OVERKILL'
              : _mkb >= 3 ? ' TRIPLE'
              : '';
    drawRetroText('MULTIKILL x' + _mkb + _mkN, BASE_W/2 - 30, cy + 82, 4, '#fc4');
  }
  // LASER PIERCE BEST — biggest single-bullet pierce count this run
  if (tTime >= 1 && (game.laserPierceBest || 0) >= 3) {
    const _lpb = game.laserPierceBest;
    const _lpN = _lpb >= 10 ? ' LANCE'
              : _lpb >= 6  ? ' SPEAR'
              : _lpb >= 3  ? ' PIERCER'
              : '';
    drawRetroText('PIERCE x' + _lpb + _lpN, BASE_W/2 + 30, cy + 82, 4, '#f6c');
  }
  // ACE STREAK BEST — best S/A grade streak this run
  if (tTime >= 1 && (game.aceStreakBest || 0) >= 3) {
    const _asb = game.aceStreakBest;
    const _asN = _asb >= 15 ? ' ACE-LEGEND'
              : _asb >= 10 ? ' ACE-PRO'
              : _asb >= 5  ? ' VIRTUOSO'
              : '';
    drawRetroText('ACE x' + _asb + _asN, BASE_W/2 - 30, cy + 88, 4, '#fc4');
  }
  // OBJECTIVES MET — secondary objectives completed this run
  if (tTime >= 1 && (game.objectivesMetRun || 0) >= 1) {
    const _obj = game.objectivesMetRun;
    const _objN = _obj >= 10 ? ' MASTERMIND'
               : _obj >= 5  ? ' STRATEGIST'
               : _obj >= 1  ? ' TACTICIAN'
               : '';
    drawRetroText('OBJ x' + _obj + _objN, BASE_W/2 + 30, cy + 88, 4, '#0f8');
  }
  // PARRY CHAIN BEST — best parry streak this run
  if (tTime >= 1 && (game.parryStreakBest || 0) >= 3) {
    const _psB = game.parryStreakBest;
    const _psT = _psB >= 15 ? ' GUARDIAN'
              : _psB >= 10 ? ' WARDEN'
              : _psB >= 5  ? ' DEFLECTOR'
              : '';
    drawRetroText('PARRY x' + _psB + _psT, BASE_W/2 - 30, cy + 94, 4, '#0cf');
  }
  // RUN BIOMES SEEN — distinct biomes traversed this run
  if (tTime >= 1 && game.runBiomesSeen && game.runBiomesSeen.size >= 2) {
    const _rbs = game.runBiomesSeen.size;
    const _rbsN = _rbs === 8 ? ' COMPLETE'
               : _rbs >= 6  ? ' EXPLORER'
               : _rbs >= 4  ? ' WANDERER'
               : '';
    drawRetroText('BIOMES ' + _rbs + '/8' + _rbsN, BASE_W/2 + 30, cy + 94, 4, '#9ef');
  }
  // MAX CORRUPTION REACHED — translate maxStage to corruption tier
  if (tTime >= 1) {
    const _msC = (s.maxStage || 0);
    const _maxCorr = _msC >= 80 ? 100
                  : _msC >= 70 ? 80
                  : _msC >= 60 ? 65
                  : _msC >= 50 ? 45
                  : _msC >= 40 ? 25
                  : _msC >= 30 ? 10 : 0;
    if (_maxCorr >= 10) {
      const _mcTier = _maxCorr >= 95 ? 'OBLIVION'
                   : _maxCorr >= 75 ? 'NULL'
                   : _maxCorr >= 60 ? 'VOID'
                   : _maxCorr >= 45 ? 'DEEP'
                   : 'EDGE';
      drawRetroText('CORR REACHED: ' + _mcTier, BASE_W/2, cy + 76, 4, '#f48');
    }
  }
  // TOP RUN ENEMY — most-killed type this run when meaningful
  if (tTime >= 1 && game.killsByTypeRun) {
    let _tT = null, _tC = 0;
    for (const _k in game.killsByTypeRun) {
      if ((game.killsByTypeRun[_k] || 0) > _tC) { _tC = game.killsByTypeRun[_k]; _tT = _k; }
    }
    if (_tT && _tC >= 10) {
      const _tCol2 = (typeof ENEMY_INFO !== 'undefined' && ENEMY_INFO[_tT])
        ? ENEMY_INFO[_tT].col : '#fff';
      drawRetroText('TOP: ' + _tT.toUpperCase() + ' x' + _tC, BASE_W/2, cy + 64, 4, _tCol2);
    }
  }

  // Tick sound for each row when it just begins counting
  // (uses gameOverTimer which decrements every tick)
  if (game.gameOverTimer === 180 - 95 || game.gameOverTimer === 180 - 105
      || game.gameOverTimer === 180 - 115 || game.gameOverTimer === 180 - 125
      || game.gameOverTimer === 180 - 135) {
    playSound('tick');
  }

  // Composite grade — combines score, accuracy, and max stage into a single S/A/B/C/D rank
  if (elapsedGo > 145) {
    const sF = Math.min(1, (game.score || 0) / 100000) * 0.5;
    const aF = (acc / 100) * 0.3;
    const stF = Math.min(1, (s.maxStage || 1) / 30) * 0.2;
    const total = sF + aF + stF;
    let grade, gcol;
    if      (total >= 0.85) { grade = 'S'; gcol = '#f6f'; }
    else if (total >= 0.70) { grade = 'A'; gcol = COL.yellow; }
    else if (total >= 0.55) { grade = 'B'; gcol = COL.green; }
    else if (total >= 0.40) { grade = 'C'; gcol = COL.cyan; }
    else                    { grade = 'D'; gcol = COL.gray; }
    // Big GRADE letter on the far right of the stats column (next to TIME row)
    drawRetroText('GRADE', BASE_W/2 + 56, cy + 4, 5, COL.cyan);
    ctx.save();
    ctx.shadowColor = gcol;
    ctx.shadowBlur = 6 + 4 * Math.sin(game.animFrame * 0.2);
    drawRetroText(grade, BASE_W/2 + 56, cy + 18, 22, gcol);
    ctx.restore();
  }

  // VS BEST comparison — only shown when this run did NOT set a new top-5 (those already get NEW HIGH).
  // Uses pre-run threshold so we compare against the personal best BEFORE this run was submitted.
  if (elapsedGo > 150 && game.topRank < 0) {
    const prevBest = game.liveHighThreshold || 0;
    let label, lcol;
    if (prevBest === 0) {
      label = 'FIRST RUN!';
      lcol = COL.cyan;
    } else if (game.score === prevBest) {
      label = 'TIED PERSONAL BEST';
      lcol = COL.cyan;
    } else {
      const delta = prevBest - game.score;
      const pct = Math.round((game.score / prevBest) * 100);
      label = 'VS BEST  -' + fmtScore(delta) + ' (' + pct + '%)';
      lcol = '#fa8';
    }
    drawRetroText(label, BASE_W/2, cy + 44, 6, lcol);
  }

  // New top-rank celebration — daily mode prefixes "DAILY" so it's clear which leaderboard ranked
  if (game.topRank >= 0) {
    const nhsCol = (game.animFrame >> 3) % 2 === 0 ? COL.yellow : COL.magenta;
    const prefix = game.dailyMode ? 'DAILY ' : game.challengeMode ? 'CHAL ' : '';
    const text = game.topRank === 0
      ? (prefix ? prefix + 'BEST!' : 'NEW HIGH SCORE!')
      : (prefix + 'RANK #' + (game.topRank + 1) + '!');
    drawRetroText(text, BASE_W/2, cy + 44, 8, nhsCol);
  } else if (game.dailyMode && elapsedGo > 150) {
    // Daily mode but didn't make top 5 — still show today's seed as a small footer
    drawRetroText('DAILY ' + dailyLabel(), BASE_W/2, cy + 44, 6, COL.green);
  }

  // DEATH CAUSE RECAP — final hit attribution shown just before epitaph (~frame 95).
  // Map raw cause to display string. Helps player diagnose what to evade next run.
  if (game.lastDeathCause && elapsedGo > 95) {
    const fade = Math.min(1, (elapsedGo - 95) / 20);
    const dcMap = {
      bullet:    'FELLED BY ENEMY FIRE',
      collision:'FELLED BY DIVE IMPACT',
      unknown:   'CAUSE UNKNOWN'
    };
    const dcLine = dcMap[game.lastDeathCause] || ('FELLED BY ' + String(game.lastDeathCause).toUpperCase());
    ctx.save();
    ctx.globalAlpha = 0.65 * fade;
    drawRetroText(dcLine, BASE_W/2, cy + 62, 5, '#f88');
    ctx.restore();
  }
  // EPITAPH — narrative bookend, fades in at frame ~120 (after grade reveal at 145
  // happens later, but we want this BEFORE the action prompt so the closing line
  // reads as final transmission rather than UI noise). Soft gray italic-feel rendering
  // so it sits below the score row without competing with it.
  if (game.runEpitaph && elapsedGo > 110) {
    const fade = Math.min(1, (elapsedGo - 110) / 30);
    const ey = cy + 72;
    ctx.save();
    ctx.globalAlpha = 0.55 * fade;
    drawRetroText('— FINAL TRANSMISSION —', BASE_W/2, ey, 5, '#888');
    ctx.globalAlpha = 0.85 * fade;
    drawRetroText(game.runEpitaph, BASE_W/2, ey + 8, 6, '#cfc');
    // LAST TRANSMISSION ECHO — show the most recent narrative log seen (last
    // TRANSMISSION_LOGS stage <= maxStage) for arc continuity.
    if (typeof TRANSMISSION_LOGS !== 'undefined') {
      const _mxS = (game.stats && game.stats.maxStage) || game.stage || 1;
      const _keys = Object.keys(TRANSMISSION_LOGS).map(Number).filter(k => k <= _mxS).sort((a, b) => b - a);
      if (_keys.length > 0) {
        const _lastLog = TRANSMISSION_LOGS[_keys[0]];
        if (Array.isArray(_lastLog) && _lastLog[0]) {
          ctx.globalAlpha = 0.35 * fade;
          drawRetroText(_lastLog[0], BASE_W/2, ey - 6, 4, '#666');
        }
      }
    }
    // TIME-OF-DAY MOOD — atmospheric line below epitaph based on real-world hour.
    const _h = new Date().getHours();
    const _mood = _h < 5  ? 'THE LATE NIGHT KEEPS WATCH.'
                : _h < 9  ? 'THE DAY BEGINS WITHOUT YOU.'
                : _h < 12 ? 'MORNING LIGHT REACHES THE WRECK.'
                : _h < 17 ? 'THE AFTERNOON HOLDS QUIET.'
                : _h < 21 ? 'EVENING SETTLES OVER THE FIELD.'
                : 'THE NIGHT REMEMBERS.';
    ctx.globalAlpha = 0.45 * fade;
    drawRetroText(_mood, BASE_W/2, ey + 16, 4, '#888');
    ctx.restore();
  }

  // RUN HIGHLIGHTS — fades in shortly after epitaph (frame 140+). Up to 3 lines,
  // compact stat-card style. Sits between epitaph and the SPACE/RETRY prompt.
  // Stagger per-line fade so they appear sequentially (~6 frame gap) for ceremony feel.
  if (game.runHighlights && game.runHighlights.length > 0 && elapsedGo > 140) {
    const hy = cy + 92;
    ctx.save();
    ctx.globalAlpha = 0.55 * Math.min(1, (elapsedGo - 140) / 20);
    drawRetroText('— PILOT [' + playerCallsign + '] HIGHLIGHTS —', BASE_W/2, hy, 5, '#888');
    ctx.restore();
    for (let i = 0; i < game.runHighlights.length; i++) {
      const h = game.runHighlights[i];
      const lineFrame = 150 + i * 6;
      if (elapsedGo < lineFrame) continue;
      const lineFade = Math.min(1, (elapsedGo - lineFrame) / 14);
      ctx.save();
      ctx.globalAlpha = lineFade;
      drawRetroText(h.label, BASE_W/2 - 30, hy + 8 + i * 8, 5, '#888', 'right');
      drawRetroText(h.value, BASE_W/2 - 24, hy + 8 + i * 8, 6, h.col, 'left');
      ctx.restore();
    }
    // PILOT TIP — single mechanic hint, surfaced near the bottom after highlights
    // finish settling in. Reveals after the run-highlights cascade so it lands as
    // a separate beat ("you fell — here's something you may not know yet").
    if (game.runTip && elapsedGo > 200) {
      const tipFade = Math.min(1, (elapsedGo - 200) / 30);
      ctx.save();
      ctx.globalAlpha = tipFade * 0.9;
      const tipY = hy + 8 + game.runHighlights.length * 8 + 8;
      drawRetroText(game.runTip, BASE_W/2, tipY, 5, '#cfc');
      ctx.restore();
    }
    // NEXT GOAL — single forward-looking target. Reveals one beat after the tip
    // so the player ends the death screen looking ahead instead of at the past.
    if (game.runGoal && elapsedGo > 240) {
      const goalFade = Math.min(1, (elapsedGo - 240) / 30);
      ctx.save();
      ctx.globalAlpha = goalFade;
      const goalY = hy + 8 + game.runHighlights.length * 8 + 16;
      const blink = (game.animFrame >> 4) % 2 === 0 ? game.runGoalCol : '#fff';
      drawRetroText(game.runGoal, BASE_W/2, goalY, 6, blink);
      ctx.restore();
    }
    // NEXT ACHIEVEMENT — first un-unlocked achievement as a forward target. Helps
    // the player end the death screen with one specific trophy in mind.
    if (elapsedGo > 260 && typeof ACHIEVEMENTS !== 'undefined' && typeof unlockedAchievements !== 'undefined') {
      const allIds = Object.keys(ACHIEVEMENTS);
      let nextAch = null;
      for (const id of allIds) {
        if (!unlockedAchievements.has(id)) { nextAch = ACHIEVEMENTS[id]; break; }
      }
      if (nextAch) {
        const aFade = Math.min(1, (elapsedGo - 260) / 30);
        ctx.save();
        ctx.globalAlpha = aFade * 0.85;
        const aY = hy + 8 + game.runHighlights.length * 8 + 22;
        drawRetroText('TRY: ' + nextAch.name, BASE_W/2, aY, 4, '#0ff');
        ctx.restore();
      }
    }
    // GAME OVER SHARE LINE — compact stat string for manual share/transcription.
    // "[CSK] S25 145K 76% DAILY" format. Reveals last so it lands as a coda.
    if (elapsedGo > 280) {
      const shrFade = Math.min(1, (elapsedGo - 280) / 30);
      const accStr = (() => {
        const sf = game.stats.shotsFired || 0;
        return sf > 0 ? Math.round((game.stats.shotsHit / sf) * 100) + '%' : '-';
      })();
      const modeTag = game.dailyMode ? 'DAILY' : game.challengeMode ? 'CHAL' : 'NORM';
      const scoreShort = (game.score >= 1000) ? Math.round(game.score / 1000) + 'K' : String(game.score || 0);
      const shareLine = '[' + playerCallsign + '] S' + (game.stats.maxStage || 0)
                      + '  ' + scoreShort + '  ' + accStr + '  ' + modeTag;
      ctx.save();
      ctx.globalAlpha = shrFade * 0.75;
      drawRetroText(shareLine, BASE_W/2, hy + 8 + game.runHighlights.length * 8 + 26, 4, '#0cf');
      ctx.restore();
    }
  }

  if (game.gameOverTimer <= 0) {
    if (game.animFrame % 60 < 40) {
      drawRetroText('SPACE TITLE   R RETRY', BASE_W/2, cy + 54, 6, COL.cyan);
    }
    // PROFILE TAB HINT — gray reminder you can dive into stats from TITLE
    drawRetroText('TITLE → TAB PROFILE', BASE_W/2, cy + 60, 4, '#666');
    // CHEAT-USED INDICATOR — surface honor flag when god mode was toggled on
    // at any point during this run.
    if (game._cheatUsedAtAnyTime) {
      drawRetroText('(GOD MODE USED)', BASE_W/2, cy + 66, 4, '#a88');
    } else if (game._stageJumpUsed) {
      drawRetroText('(STAGE JUMP USED)', BASE_W/2, cy + 66, 4, '#a88');
    }
    // Auto-retry countdown — always visible (no blink) so the second-counter doesn't jitter
    if (game.autoRestartTimer > 0) {
      const sec = Math.ceil(game.autoRestartTimer / 60);
      const cdCol = sec <= 2 ? '#fa8' : COL.gray;
      drawRetroText('AUTO RETRY ' + sec, BASE_W/2, cy + 62, 5, cdCol);
      // AUTO RETRY PROGRESS BAR — visual countdown under the text. Fill drains
      // left-to-right as timer counts down.
      const arProg = game.autoRestartTimer / 480;
      const arBarW = 60;
      const arBarX = BASE_W/2 - arBarW/2;
      const arBarY = cy + 69;
      ctx.save();
      ctx.fillStyle = '#222';
      ctx.fillRect(arBarX, arBarY, arBarW, 2);
      ctx.fillStyle = cdCol;
      ctx.fillRect(arBarX, arBarY, Math.round(arBarW * arProg), 2);
      ctx.restore();
    }
  }
}

function drawBossStage() {
  const bosses = game.megaBosses || [];
  const aliveBosses = bosses.filter(mb => mb.alive);

  // Boss title — SUPER (single 1.5×) > DOUBLE (two) > regular
  const glow = Math.sin(game.animFrame * 0.08) * 0.4 + 0.6;
  const anySuper = aliveBosses.some(mb => mb.super);
  // Boss title is rendered AFTER drawHUD (in drawHUD itself) to avoid overlap with HIGH SCORE row.
  // Just store the metadata for drawHUD to read.
  game._bossTitle = anySuper ? '!! SUPER BOSS !!'
                  : aliveBosses.length > 1 ? '!! DOUBLE BOSS !!'
                  : '!! BOSS !!';
  game._bossTitleSize = anySuper ? 9 : aliveBosses.length > 1 ? 7 : 8;
  game._bossTitleGlow = glow;

  // Mega-bosses (super bosses render at 1.5× scale)
  for (const mb of aliveBosses) {
    const drawScale = mb.scale || 1;
    // PHANTOM teleFlash — blink the boss sprite during the 12-frame
    // intangibility window so the player sees the dodge happened.
    if ((mb.teleFlash || 0) > 0 && (mb.teleFlash >> 1) % 2 === 0) continue;
    const renderBoss = (hit) => {
      if (drawScale === 1) {
        drawMegaBoss(mb.x, mb.y, mb.frame, hit, mb.archetype);
      } else {
        ctx.save();
        ctx.translate(mb.x, mb.y);
        ctx.scale(drawScale, drawScale);
        drawMegaBoss(0, 0, mb.frame, hit, mb.archetype);
        ctx.restore();
      }
    };
    if (mb.telegraphing) {
      const blink = (game.animFrame >> 1) % 2 === 0;
      renderBoss(blink);
      ctx.save();
      ctx.globalAlpha = 0.35 + 0.25 * Math.sin(game.animFrame * 0.4);
      ctx.fillStyle = COL.red;
      const lineX = Math.round(mb.x);
      for (let yy = mb.y + 16; yy < BASE_H - 18; yy += 4) {
        ctx.fillRect(lineX, yy, 1, 2);
      }
      ctx.restore();
      if (game.playerAlive && blink) {
        ctx.fillStyle = COL.red;
        ctx.fillRect(game.playerX - 1, game.playerY - 22, 2, 5);
        ctx.fillRect(game.playerX - 1, game.playerY - 15, 2, 2);
      }
    } else {
      renderBoss(mb.hitFlash > 0);
    }
    // RUNE archetype — 8 rotating violet glyphs orbiting the boss for visual ID
    if (mb.archetype === 'rune') {
      const t = game.animFrame;
      ctx.save();
      const orbitR = 22;
      ctx.fillStyle = '#a4f';
      for (let k = 0; k < 8; k++) {
        const a = (k / 8) * Math.PI * 2 + t * 0.02;
        const rx = Math.round(mb.x + Math.cos(a) * orbitR);
        const ry = Math.round(mb.y + Math.sin(a) * orbitR);
        ctx.globalAlpha = 0.45 + 0.25 * Math.sin(t * 0.10 + k * 0.6);
        ctx.fillRect(rx - 1, ry - 1, 2, 2);
      }
      ctx.restore();
    }
    // TAUNT BUBBLE — speech above boss when tauntLife > 0. Fades over its lifetime.
    // Position: above boss (y - 30 ish, scaled with boss size). Width auto-fits text.
    if ((mb.tauntLife || 0) > 0 && mb.tauntText) {
      const tx = mb.x;
      const ty = mb.y - 28 - (mb.scale > 1 ? 10 : 0);
      const fade = Math.min(1, mb.tauntLife / 30); // fade in last 0.5s
      const padW = mb.tauntText.length * 3 + 6;
      ctx.save();
      ctx.globalAlpha = 0.75 * fade;
      // Bubble background (semi-transparent dark)
      ctx.fillStyle = '#100';
      ctx.fillRect(tx - padW / 2, ty - 5, padW, 9);
      // Bubble border (matches archetype tint)
      const borderCol = mb.archetype === 'horned'  ? '#f88'
                     : mb.archetype === 'tendril' ? '#8ff'
                     : mb.archetype === 'crystal' ? '#caf'
                     : '#fc8';
      ctx.fillStyle = borderCol;
      ctx.fillRect(tx - padW / 2, ty - 5, padW, 1);
      ctx.fillRect(tx - padW / 2, ty + 3, padW, 1);
      ctx.fillRect(tx - padW / 2, ty - 5, 1, 9);
      ctx.fillRect(tx + padW / 2 - 1, ty - 5, 1, 9);
      // Tail pointing down toward boss
      ctx.fillRect(tx - 2, ty + 4, 4, 1);
      ctx.fillRect(tx - 1, ty + 5, 2, 1);
      // Text
      ctx.globalAlpha = fade;
      drawRetroText(mb.tauntText, tx, ty - 1, 5, '#fff');
      ctx.restore();
    }
  }

  // Phase-telegraph caution-tape sirens — red diagonal stripes scrolling along the edges
  const anyTelegraph = aliveBosses.some(mb => (mb.telegraphFrames || 0) > 0);
  if (anyTelegraph) {
    ctx.save();
    ctx.fillStyle = COL.red;
    const off = (game.animFrame * 2) % 16;
    for (let i = -16; i < BASE_W + 16; i += 8) {
      const x = i + off;
      // Top tape (y=24..28): diagonal slabs
      ctx.fillRect(x, 24, 4, 4);
      ctx.fillRect(x + 4, 25, 4, 3);
      // Bottom tape
      ctx.fillRect(x, BASE_H - 16, 4, 4);
      ctx.fillRect(x + 4, BASE_H - 17, 4, 3);
    }
    // Side flickers
    if ((game.animFrame >> 1) % 2 === 0) {
      ctx.globalAlpha = 0.55;
      ctx.fillRect(0, 24, 3, BASE_H - 40);
      ctx.fillRect(BASE_W - 3, 24, 3, BASE_H - 40);
    }
    ctx.restore();
    drawRetroText('PHASE INCOMING', BASE_W/2, BASE_H/2 - 30, 9, (game.animFrame >> 2) % 2 === 0 ? COL.red : '#f88');
  }

  // Combined HP bar — sum of all bosses. Placed BELOW the HUD top area to avoid score-row overlap.
  if (bosses.length > 0) {
    const totalMax = bosses.reduce((s, mb) => s + mb.maxHp, 0);
    const totalHp  = bosses.reduce((s, mb) => s + (mb.alive ? mb.hp : 0), 0);
    const anyEnrage = aliveBosses.some(mb => mb.phase2);
    const barW = BASE_W - 20;
    const barY = 30;
    const ratio = totalMax > 0 ? totalHp / totalMax : 0;
    ctx.fillStyle = '#333';
    ctx.fillRect(10, barY, barW, 5);
    const barColor = anyEnrage
      ? (game.animFrame % 10 < 5 ? COL.red : '#f80')
      : (ratio > 0.5 ? COL.green : ratio > 0.25 ? COL.yellow : COL.red);
    ctx.fillStyle = barColor;
    ctx.fillRect(10, barY, Math.round(barW * ratio), 5);
    // Per-boss segment markers (only when more than one boss exists)
    if (bosses.length > 1) {
      ctx.fillStyle = '#000';
      let acc = 0;
      for (let i = 0; i < bosses.length - 1; i++) {
        acc += bosses[i].maxHp / totalMax;
        ctx.fillRect(10 + Math.round(barW * acc) - 1, barY, 1, 5);
      }
    }
    // HP SEGMENT DIVIDERS — 10 evenly-spaced 1px tick marks across the bar so
    // damage progress reads as discrete chunks. Sits on top of fill, under stroke.
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    for (let _s = 1; _s < 10; _s++) {
      ctx.fillRect(10 + Math.round(barW * _s / 10), barY, 1, 5);
    }
    ctx.strokeStyle = COL.white;
    ctx.lineWidth = 0.5;
    ctx.strokeRect(10, barY, barW, 5);
    if (anyEnrage) {
      drawRetroText('!! ENRAGE !!', BASE_W/2, barY + 12, 6, game.animFrame % 10 < 5 ? COL.red : '#f80');
    }
  }

  // Power-ups
  for (const p of game.powerUps) drawPowerUp(p);

  // Player bullets — GAM-42 tier visuals
  for (const b of game.bullets) drawPlayerBullet(b.x, b.y, b.lvl ?? 1);

  // Enemy bullets
  for (const b of game.enemyBullets) drawEnemyBullet(b);

  // Engine trail
  drawExhaustDust();
  drawPlayerTrail();

  // Player (blink during invincibility)
  if (game.playerAlive && (game.invincibleTimer <= 0 || (game.invincibleTimer >> 2) % 2 === 0)) {
    const pcol = (game.ship && game.ship.color) || '#0cf';
    // PLAYER BUFF AURA — single highest-priority temp buff produces a colored
    // pulsing ring around the ship. Priority: laser > homing > wave > rapid > slow.
    let _buffCol = null;
    if ((game.laserTimer  || 0) > 0)      _buffCol = '#f6c';
    else if ((game.homingTimer || 0) > 0) _buffCol = '#0f8';
    else if ((game.waveTimer   || 0) > 0) _buffCol = '#6cf';
    else if ((game.rapidTimer  || 0) > 0) _buffCol = '#fc4';
    else if ((game.slowTimer   || 0) > 0) _buffCol = '#8ff';
    if (_buffCol) {
      ctx.save();
      ctx.globalAlpha = 0.35 + 0.20 * Math.sin(game.animFrame * 0.18);
      ctx.strokeStyle = _buffCol;
      ctx.lineWidth = 1;
      const _r = 10 + 1 * Math.sin(game.animFrame * 0.25);
      if (game.dualFighter) {
        ctx.beginPath(); ctx.arc(game.playerX - 8, game.playerY, _r, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(game.playerX + 8, game.playerY, _r, 0, Math.PI * 2); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(game.playerX, game.playerY, _r, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    }
    // MAGNET FIELD RING — combo ≥ 30 draws a faint pulsing cyan ring at the
    // magnet range to visualize the pickup attraction zone. combo ≥ 60 doubles
    // brightness. Draw BEFORE the ship so the ring sits underneath.
    if (game.combo >= 30 && game.playerAlive) {
      const _mr = 36 + ((game.combo >= 60) ? 40 : 20)
                + ((game.activePerk === 'magnetic') ? 36 : 0);
      const _pulse = 0.5 + 0.5 * Math.sin(game.animFrame * 0.18);
      const _alpha = (game.combo >= 60 ? 0.18 : 0.10) * (0.6 + 0.4 * _pulse);
      ctx.save();
      ctx.globalAlpha = _alpha;
      ctx.strokeStyle = '#0cf';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(game.playerX, game.playerY, _mr, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    if (game.dualFighter) {
      drawShipTraitAura(game.playerX - 8, game.playerY, selectedShip);
      drawShipTraitAura(game.playerX + 8, game.playerY, selectedShip);
      drawPlayer(game.playerX - 8, game.playerY, pcol, game.lvl);
      drawPlayer(game.playerX + 8, game.playerY, pcol, game.lvl);
    } else {
      drawShipTraitAura(game.playerX, game.playerY, selectedShip);
      drawPlayer(game.playerX, game.playerY, pcol, game.lvl);
    }
    // DASH COOLDOWN BAR — small cyan progress strip under the ship while
    // dash cooldown is active. Fills empty→full as cooldown counts down so
    // ready state corresponds to "bar full." 60-frame cooldown total.
    if ((game.dashCooldown || 0) > 0) {
      const _dcW = 14;
      const _dcRatio = 1 - (game.dashCooldown / 60);
      const _dcY = game.playerY + 7;
      const _dcX = game.playerX - _dcW / 2;
      ctx.save();
      ctx.globalAlpha = 0.45;
      ctx.fillStyle = '#0cf';
      ctx.fillRect(_dcX, _dcY, _dcW, 1);
      ctx.globalAlpha = 0.95;
      ctx.fillRect(_dcX, _dcY, Math.round(_dcW * _dcRatio), 1);
      ctx.restore();
    }
    // WITCH TIME COOLDOWN BAR — second progress strip directly below the dash
    // bar (1px gap). Magenta to distinguish from dash cyan. Only while
    // witchCooldown > 0 (i.e., a witch-time save was just used).
    if ((game.witchCooldown || 0) > 0) {
      const _wcW = 14;
      const _wcRatio = 1 - (game.witchCooldown / 720);
      const _wcY = game.playerY + 9;
      const _wcX = game.playerX - _wcW / 2;
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#f6c';
      ctx.fillRect(_wcX, _wcY, _wcW, 1);
      ctx.globalAlpha = 0.95;
      ctx.fillRect(_wcX, _wcY, Math.round(_wcW * _wcRatio), 1);
      ctx.restore();
    }
  }

  // Explosions
  for (const ex of game.explosions) drawExplosion(ex.x, ex.y, ex.timer, ex.maxTime);
  drawDebris();
  drawShockwaves();
  drawStrikeFx();
  drawMuzzleFlashes();

  // Pickup feedback (burst + sparks + floating text)
  for (const b of game.itemBursts) drawItemBurst(b);
  for (const s of game.hitSparks) drawHitSpark(s);
  for (const ft of game.floatTexts) drawFloatText(ft);

  drawHUD();
}

function drawPauseScreen() {
  // Heavy backdrop dim with subtle grid pattern for distinct paused mood
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  ctx.fillStyle = 'rgba(0,170,255,0.06)';
  for (let yy = 0; yy < BASE_H; yy += 8) ctx.fillRect(0, yy, BASE_W, 1);

  const cy = BASE_H / 2;
  const panelW = 144, panelH = 132;
  const px = (BASE_W - panelW) / 2;
  const py = cy - panelH / 2;

  // Panel background
  ctx.fillStyle = 'rgba(0,30,60,0.88)';
  ctx.fillRect(px, py, panelW, panelH);

  // Yellow corner brackets
  ctx.fillStyle = COL.yellow;
  const corner = 6;
  ctx.fillRect(px, py, corner, 1); ctx.fillRect(px, py, 1, corner);
  ctx.fillRect(px + panelW - corner, py, corner, 1); ctx.fillRect(px + panelW - 1, py, 1, corner);
  ctx.fillRect(px, py + panelH - 1, corner, 1); ctx.fillRect(px, py + panelH - corner, 1, corner);
  ctx.fillRect(px + panelW - corner, py + panelH - 1, corner, 1); ctx.fillRect(px + panelW - 1, py + panelH - corner, 1, corner);

  // Pause icon glyph (two vertical bars) — top of panel
  ctx.fillStyle = COL.yellow;
  ctx.fillRect(BASE_W/2 - 14, py + 8, 4, 12);
  ctx.fillRect(BASE_W/2 + 10, py + 8, 4, 12);

  // PAUSED title with glow
  ctx.save();
  const glow = 0.6 + 0.4 * Math.sin(game.animFrame * 0.1);
  ctx.shadowColor = COL.yellow;
  ctx.shadowBlur = 8 * glow;
  drawRetroText('PAUSED', BASE_W/2, py + 32, 11, COL.yellow);
  ctx.restore();

  // Run summary
  let ry = py + 46;
  function infoRow(label, value, vCol) {
    drawRetroText(label, px + 10, ry, 6, COL.cyan, 'left');
    drawRetroText(value, px + panelW - 10, ry, 6, vCol || COL.white, 'right');
    ry += 8;
  }
  // Ship + score + lives + stage + combo (current run snapshot)
  const ship = (game.ship && game.ship.name) || 'GAM-42';
  const shipCol = (game.ship && game.ship.color) || '#0cf';
  const acc = game.stats && game.stats.shotsFired
    ? Math.round((game.stats.shotsHit / game.stats.shotsFired) * 100) + '%' : '--';
  const totalSec = Math.floor((game.runFrames || 0) / 60);
  const tm = String(Math.floor(totalSec / 60)).padStart(2, '0') + ':' + String(totalSec % 60).padStart(2, '0');
  infoRow('SHIP',  ship, shipCol);
  infoRow('STAGE', String(game.stage || 1));
  infoRow('SCORE', fmtScore(game.score || 0));
  infoRow('LIVES', String(game.lives || 0), game.challengeMode ? COL.red : '#fff');
  infoRow('COMBO', game.combo >= 3 ? '×' + game.combo + ' (' + (game.comboBonusAccum || 0) + ')' : '—');
  infoRow('TIME',  tm);
  infoRow('ACC',   acc);

  // PAUSE BIOME WHEEL — visualize the 8-biome cycle and player's current
  // position in it. Active only at stage >= 8 (when biomes turn on).
  if (typeof biomeForStage === 'function' && game.stage >= 8) {
    const wheelCx = px + panelW - 22;
    const wheelCy = py + 32;
    const wheelR = 14;
    const _curBiome = biomeForStage(game.stage);
    const _order = ['planet', 'dawn', 'asteroid', 'ice', 'gasGiant', 'corona', 'blackhole', 'starfield'];
    ctx.save();
    // outer ring
    ctx.globalAlpha = 0.4;
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(wheelCx, wheelCy, wheelR, 0, Math.PI * 2);
    ctx.stroke();
    // 8 biome pips
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 - Math.PI / 2;
      const pxw = wheelCx + Math.cos(a) * wheelR;
      const pyw = wheelCy + Math.sin(a) * wheelR;
      const _bid = _order[i];
      const _isCur = _bid === _curBiome;
      ctx.globalAlpha = _isCur ? 0.95 : 0.45;
      ctx.fillStyle = BIOME_NAMES[_bid] ? BIOME_NAMES[_bid].col : '#fff';
      const sz = _isCur ? 4 : 2;
      ctx.fillRect(pxw - sz/2, pyw - sz/2, sz, sz);
    }
    // center label
    if (_curBiome && BIOME_NAMES[_curBiome]) {
      ctx.globalAlpha = 0.85;
      drawRetroText('CYCLE', wheelCx, wheelCy - 22, 4, '#888');
    }
    ctx.restore();
  }
  // Achievement progress mini-bar (just above controls hint)
  {
    const totalAch = Object.keys(ACHIEVEMENTS).length;
    const got = unlockedAchievements.size;
    const ratio = totalAch > 0 ? got / totalAch : 0;
    const barW = panelW - 30;
    const bx = px + 15;
    const by = py + panelH - 16;
    drawRetroText('ACH', px + 8, by + 1, 5, COL.cyan, 'left');
    ctx.fillStyle = '#222';
    ctx.fillRect(bx, by, barW, 2);
    ctx.fillStyle = COL.magenta;
    ctx.fillRect(bx, by, Math.round(barW * ratio), 2);
    drawRetroText(got + '/' + totalAch, px + panelW - 8, by + 1, 5, COL.magenta, 'right');
  }
  // Controls hint at bottom
  drawRetroText('P RESUME   H HELP   Q QUIT', BASE_W/2, py + panelH - 6, 5, COL.gray);
}

  ctx.fillRect(px, py + panelH - 1, panelW, 1);

  ctx.fillRect(px + panelW - 1, py, 1, panelH);

    shotsFired: (csN.shotsFired || 0) + (csC.shotsFired || 0),
    shotsHit:   (csN.shotsHit   || 0) + (csC.shotsHit   || 0),
    runFrames:  (csN.runFrames  || 0) + (csC.runFrames  || 0),
    bestStage:  Math.max(csN.bestStage || 0, csC.bestStage || 0)
  };
  const acc = cs.shotsFired === 0 ? 0 : Math.round((cs.shotsHit / cs.shotsFired) * 100);
  const fmtTime = (frames) => {

    return String(Math.floor(t / 3600)).padStart(2, '0') + ':' +
           String(Math.floor((t % 3600) / 60)).padStart(2, '0') + ':' +

  let y = py + 28;
  drawRetroText('OVERALL', px + 8, y, 7, COL.cyan, 'left');
  y += 9;

  function row(label, value, valueCol) {
    drawRetroText(label, px + 8, y, 6, COL.white, 'left');
    drawRetroText(value, px + panelW - 8, y, 6, valueCol || COL.yellow, 'right');
    y += 8;
  }

  {
    const _ss = cs.sessions || 0;
    const _ssTier = _ss >= 500 ? 'COMMITTED'
                  : _ss >= 100 ? 'DEDICATED'
                  : _ss >= 30  ? 'REGULAR'
                  : _ss >= 5   ? 'PILOT'
                  : '';
    row('SESSIONS', _ss + (_ssTier ? ' ' + _ssTier : ''), COL.cyan);
  }
  {
    const _hours = (cs.runFrames || 0) / 3600 / 60;
    const _ptTier = _hours >= 50 ? 'OBSESSED'
                  : _hours >= 10 ? 'DEVOTED'
                  : _hours >= 5  ? 'SERIOUS'
                  : _hours >= 1  ? 'WARMED UP'
                  : '';
    row('PLAY TIME', playTime + (_ptTier ? ' ' + _ptTier : ''), '#fff');
  }
  {
    const _tk = cs.kills || 0;
    const _tkTier = _tk >= 10000 ? 'LEGENDARY'
                  : _tk >= 2000  ? 'EXTERMINATOR'
                  : _tk >= 500   ? 'SLAYER'
                  : _tk >= 100   ? 'HUNTER' : '';
    row('TOTAL KILLS', fmtScore(_tk) + (_tkTier ? ' ' + _tkTier : ''), COL.yellow);
  }
  {
    const _accTier = acc >= 95 ? 'SHARPSHOOTER'
                   : acc >= 85 ? 'CRACK SHOT'
                   : acc >= 70 ? 'MARKSMAN'
                   : acc >= 50 ? 'STEADY' : '';
    const _accLab = _accTier ? (acc + '% ' + _accTier) : (acc + '%');
    row('OVERALL ACC', _accLab, acc >= 80 ? COL.green : COL.yellow);
  }
  {

    const _bsTier = _bsS >= 80 ? 'VOIDWALKER'
                  : _bsS >= 50 ? 'APEX'
                  : _bsS >= 30 ? 'VOYAGER'
                  : _bsS >= 15 ? 'PATHFINDER'
                  : _bsS >= 5  ? 'SCOUT' : '';
    row('BEST STAGE', _bsS + (_bsTier ? ' ' + _bsTier : ''),
        _bsS >= 30 ? COL.red : _bsS >= 10 ? COL.yellow : COL.cyan);
  }

  // Mode-specific compact summary row
  y += 2;
  drawRetroText('N:' + (csN.sessions || 0) + 'S', px + 8, y, 5, '#fff', 'left');
  drawRetroText('C:' + (csC.sessions || 0) + 'S', px + panelW - 8, y, 5, COL.red, 'right');
  y += 7;

  y += 6;
  drawRetroText('TOP SCORES', px + 8, y, 7, COL.cyan, 'left');
  y += 9;
  const norm  = (loadTopScores('normal')[0]    || {}).score || 0;
  const chal  = (loadTopScores('challenge')[0] || {}).score || 0;
  const daily = (loadTopScores('daily')[0]     || {}).score || 0;
  row('NORMAL',    fmtScore(norm),  '#fff');

  row('DAILY',     fmtScore(daily), COL.green);

  y += 6;
  drawRetroText('PROGRESS', px + 8, y, 7, COL.cyan, 'left');
  y += 9;
  row('ACHIEVEMENTS', ach + ' / ' + totalAch, COL.magenta);
  // Achievement progress bar
  const barW = panelW - 16;
  const ratio = totalAch > 0 ? ach / totalAch : 0;
  ctx.fillStyle = '#222';
  ctx.fillRect(px + 8, y, barW, 3);
  ctx.fillStyle = COL.magenta;
  ctx.fillRect(px + 8, y, Math.round(barW * ratio), 3);
  y += 6;

  y += 4;
  drawRetroText('BEST TIMES', px + 8, y, 7, COL.cyan, 'left');
  y += 9;
  const bt = loadBestTimes();
  for (const ms of MILESTONE_STAGES) {
    const c = bt[ms] != null ? COL.yellow : COL.gray;
    drawRetroText('S' + ms, px + 8, y, 6, c, 'left');
    drawRetroText(fmtMS(bt[ms]), px + panelW - 8, y, 6, c, 'right');
    y += 7;
  }

  y += 4;
  const ids = Object.keys(ACHIEVEMENTS);
  const cellW = (panelW - 16) / 3;
  const cellH = 7;
  const PER_PAGE = 30; // 10 rows × 3 cols
  const achPages = Math.max(1, Math.ceil(ids.length / PER_PAGE));
  const numPages = achPages + 2; // +1 bestiary, +1 profile (last)
  if (typeof game.statsAchPage !== 'number') game.statsAchPage = 0;
  game.statsAchPage = Math.max(0, Math.min(numPages - 1, game.statsAchPage));
  const onBestiary = game.statsAchPage === achPages;
  const onProfile  = game.statsAchPage === achPages + 1;
  const headerText = onProfile ? 'PILOT PROFILE' : onBestiary ? 'BESTIARY' : 'ACHIEVEMENTS';
  drawRetroText(headerText, px + 8, y, 7, COL.cyan, 'left');
  drawRetroText((game.statsAchPage + 1) + '/' + numPages + '  TAB', px + panelW - 8, y, 5, COL.gray, 'right');
  y += 9;
  if (onProfile) {
    // PILOT PROFILE — unified personal identity hub. Pulls from existing systems:
    // callsign / cumStats / dex / stage PB counts / achievement progress.
    drawRetroText('CALLSIGN', px + 8, y, 6, COL.gray, 'left');
    drawRetroText('[' + playerCallsign + ']', px + panelW - 8, y, 7, callsignColor(), 'right');
    y += 10;
    // PILOT RANK + next-rank progress
    const _curRank = computePilotTitle();
    const _nextInfo = computePilotNextRank();
    drawRetroText('RANK', px + 8, y, 6, COL.gray, 'left');
    drawRetroText(_curRank, px + panelW - 8, y, 6, '#0cf', 'right');
    y += 8;
    if (_nextInfo.next) {
      drawRetroText('NEXT', px + 8, y, 5, COL.gray, 'left');
      drawRetroText(_nextInfo.next + ' — ' + _nextInfo.label, px + panelW - 8, y, 5, '#fc8', 'right');
      y += 8;
    } else {
      drawRetroText('NEXT', px + 8, y, 5, COL.gray, 'left');
      drawRetroText(_nextInfo.label, px + panelW - 8, y, 5, '#fc4', 'right');
      y += 8;
    }
    // Combined cumulative stats
    const csN2 = loadCumStats(false);
    const csC2 = loadCumStats(true);
    const totalRuns = (csN2.sessions || 0) + (csC2.sessions || 0);
    const totalKills = (csN2.kills || 0) + (csC2.kills || 0);
    const totalFrames = (csN2.runFrames || 0) + (csC2.runFrames || 0);
    const totalSec = Math.floor(totalFrames / 60);
    const playTime = String(Math.floor(totalSec / 3600)).padStart(2, '0') + ':' +
                     String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0') + ':' +
                     String(totalSec % 60).padStart(2, '0');
    function profileRow(k, v, col) {
      drawRetroText(k, px + 8, y, 6, COL.white, 'left');
      drawRetroText(v, px + panelW - 8, y, 6, col || COL.yellow, 'right');
      y += 8;
    }
    // COMPLETION % — top-level composite progression metric
    if (typeof computeCompositeCompletion === 'function') {
      const _pcmp = computeCompositeCompletion();
      const _pcCol = _pcmp >= 80 ? '#fc4' : _pcmp >= 50 ? '#0ff' : _pcmp >= 20 ? '#0f8' : COL.white;
      const _pcTier = _pcmp >= 100 ? 'COMPLETED'
                   : _pcmp >= 80  ? 'ELITE'
                   : _pcmp >= 50  ? 'VETERAN'
                   : _pcmp >= 20  ? 'EXPLORER'
                   : 'BEGINNER';
      // TIER STAR VISUALIZATION — 5-step progress bar (☆ filled to ★)
      const _pcStars = _pcmp >= 100 ? 5
                    : _pcmp >= 80  ? 4
                    : _pcmp >= 50  ? 3
                    : _pcmp >= 20  ? 2
                    : _pcmp >= 5   ? 1
                    : 0;
      const _pcBar = '★'.repeat(_pcStars) + '☆'.repeat(5 - _pcStars);
      profileRow('COMPLETION', _pcBar + ' ' + _pcmp + '% ' + _pcTier, _pcCol);
    }
    profileRow('RUNS',       fmtScore(totalRuns));
    profileRow('TOTAL KILLS', fmtScore(totalKills));
    // LIFETIME SHOTS FIRED — sum across both modes, threshold 500
    const _totalShots = (csN2.shotsFired || 0) + (csC2.shotsFired || 0);
    if (_totalShots >= 500) {
      const _sfCol = _totalShots >= 100000 ? '#fc4' : _totalShots >= 10000 ? '#0ff' : '#0f8';
      const _sfN = _totalShots >= 100000 ? ' STORM'
                 : _totalShots >= 10000  ? ' BARRAGE'

    profileRow('PLAY TIME',   playTime, '#fff');
    profileRow('BEST STAGE',  String(Math.max(csN2.bestStage || 0, csC2.bestStage || 0)),
               (csN2.bestStage || 0) >= 30 ? COL.red : COL.cyan);
    y += 4;
    // Progression aggregates
    const dexCount = (typeof dexUnlocked !== 'undefined') ? dexUnlocked.size : 0;
    const dexTotal = Object.keys(ENEMY_INFO).length;
    const stagePBCount = Object.keys(stagePBs || {}).length;
    const scorePBCount = Object.keys(stageScorePBs || {}).length;
    const achCount = (typeof unlockedAchievements !== 'undefined') ? unlockedAchievements.size : 0;
    const achTotal = Object.keys(ACHIEVEMENTS || {}).length;
    const achPct = achTotal > 0 ? Math.round((achCount / achTotal) * 100) : 0;
    // Divider line above section header for visual grouping
    ctx.save();
    ctx.fillStyle = '#246';
    ctx.fillRect(px + 8, y - 2, panelW - 16, 1);
    ctx.restore();
    drawRetroText('PROGRESSION', px + 8, y, 7, COL.cyan, 'left');
    y += 9;
