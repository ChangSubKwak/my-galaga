        for (const t of tiers) {
          if (t > reached && (t - reached) <= 5) {
            goal = 'NEXT: STAGE ' + t + ' (' + (t - reached) + ' AWAY)';
            break;
          }
        }
        if (!goal) {
          // Next boss stage
          const nextBoss = Math.ceil((reached + 1) / 10) * 10;
          if (nextBoss <= 80 && nextBoss > reached) {
            goal = 'NEXT: BOSS ' + nextBoss + ' (' + (nextBoss - reached) + ' AWAY)';
            gColor = '#f88';
          }
        }
        if (!goal) {
          // Beyond stage 80 — open-ended push
          goal = 'PUSH BEYOND ' + reached + '!';
          gColor = '#0ff';
        }
        game.runGoal = goal;
        game.runGoalCol = gColor;
      }
      playSound('gameOver');
      stopBGM();
    } else {
      game.state = STATE.RESPAWN;
      game.respawnTimer = 120;
    }
  }
}

function updateExplosions() {
  for (let i = game.explosions.length - 1; i >= 0; i--) {
    game.explosions[i].timer++;
    if (game.explosions[i].timer >= game.explosions[i].maxTime) {
      game.explosions.splice(i, 1);
    }
  }
  // Kill chain positions — age each, drop after 30 frames (~0.5s)
  if (game.recentKillPositions) {
    for (const k of game.recentKillPositions) k.age++;
    game.recentKillPositions = game.recentKillPositions.filter(k => k.age < 30);
  }
  // Debris with gravity
  for (let i = game.debris.length - 1; i >= 0; i--) {
    const d = game.debris[i];
    d.life++;
    d.x += d.vx;
    d.y += d.vy;
    d.vy += 0.08; // gravity
    d.vx *= 0.99;
    if (d.life >= d.maxLife || d.y > BASE_H + 4) game.debris.splice(i, 1);
  }
  // Shockwave rings
  if (game.shockwaves) {
    for (let i = game.shockwaves.length - 1; i >= 0; i--) {
      game.shockwaves[i].life++;
      if (game.shockwaves[i].life >= game.shockwaves[i].maxLife) game.shockwaves.splice(i, 1);
    }
  }
  // Strike-line flashes (4-frame life)
  if (game.strikeFx) {
    for (let i = game.strikeFx.length - 1; i >= 0; i--) {
      game.strikeFx[i].life++;
      if (game.strikeFx[i].life >= 4) game.strikeFx.splice(i, 1);
    }
  }
}

function drawStrikeFx() {
  if (!game.strikeFx) return;
  for (const s of game.strikeFx) {
    const fade = 1 - s.life / 4;
    ctx.save();
    ctx.globalAlpha = fade * 0.65;
    ctx.fillStyle = '#fff';
    // Plot straight line from (x1,y1) to (x2,y2) using DDA
    const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
    const steps = Math.max(2, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy))));
    for (let k = 0; k <= steps; k++) {
      const t = k / steps;
      ctx.fillRect(Math.round(s.x1 + dx * t), Math.round(s.y1 + dy * t), 1, 1);
    }
    ctx.restore();
  }
}

function drawShockwaves() {
  if (!game.shockwaves) return;
  for (const s of game.shockwaves) {
    const t = s.life / s.maxLife;
    const r = s.maxR * t;
    ctx.save();
    ctx.globalAlpha = (1 - t) * 0.7;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
    ctx.stroke();
    // Inner thinner ring trailing slightly
    if (t > 0.3) {
      ctx.globalAlpha = (1 - t) * 0.35;
      ctx.beginPath();
      ctx.arc(s.x, s.y, r * 0.7, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawDebris() {
  if (!game.debris) return;
  for (const d of game.debris) {
    // Fade out in last 10 frames
    const fade = d.life > d.maxLife - 10 ? Math.max(0, (d.maxLife - d.life) / 10) : 1;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.fillStyle = d.color;
    ctx.fillRect(Math.round(d.x), Math.round(d.y), d.size, d.size);
    ctx.restore();
  }
}

function updateShake() {
  if (game.shakeTimer > 0) {
    game.shakeTimer--;
    const mul = shakeMul();
    // Ease-out: shake amplitude scales with remaining time so it tapers smoothly
    const amp = 4 * Math.min(1, game.shakeTimer / 8);
    game.shakeX = (Math.random() - 0.5) * amp * mul;
    game.shakeY = (Math.random() - 0.5) * amp * mul;
  } else {
    game.shakeX = 0; game.shakeY = 0;
  }
}

// Pixel debris chunks — tiny rect particles with gravity. Bigger enemies spit more.
// (cap total debris count for performance — splice oldest if over 200)
function debrisCap() {
  if (game.debris && game.debris.length > 200) {
    game.debris.splice(0, game.debris.length - 200);
  }
}
function shockwaveCap() {
  if (game.shockwaves && game.shockwaves.length > 30) {
    game.shockwaves.splice(0, game.shockwaves.length - 30);
  }
  if (game.shootingStars && game.shootingStars.length > 30) {
    game.shootingStars.splice(0, game.shootingStars.length - 30);
  }
  if (game.hitSparks && game.hitSparks.length > 50) {
    game.hitSparks.splice(0, game.hitSparks.length - 50);
  }
}
function bulletCap() {
  // Cap enemy bullets to 80 max for performance — splice oldest
  if (game.enemyBullets && game.enemyBullets.length > 80) {
    game.enemyBullets.splice(0, game.enemyBullets.length - 80);
  }
  // Float texts cap
  if (game.floatTexts && game.floatTexts.length > 50) {
    game.floatTexts.splice(0, game.floatTexts.length - 50);
  }
  // Item bursts cap
  if (game.itemBursts && game.itemBursts.length > 100) {
    game.itemBursts.splice(0, game.itemBursts.length - 100);
  }
}

const DEBRIS_PROFILE = {
  bee:       { count: 4,  cols: ['#ff4', '#fc4', '#fff'] },
  butterfly: { count: 6,  cols: ['#f8a', '#f6a', '#fff'] },
  shielded:  { count: 8,  cols: ['#cef', '#88f', '#fff'] },
  splitter:  { count: 6,  cols: ['#0f8', '#8f8', '#fff'] },
  kamikaze:  { count: 6,  cols: ['#f44', '#f80', '#fff'] },
  minibee:   { count: 3,  cols: ['#ff4', '#fff'] },
  boss:      { count: 10, cols: ['#0ff', '#0cf', '#fff'] },
  ufo:       { count: 12, cols: ['#bbb', '#0ef', '#fff', '#f44'] },
  goldenBee: { count: 14, cols: ['#fc4', '#ff8', '#fff'] }
};
function spawnDebris(x, y, type) {
  const prof = DEBRIS_PROFILE[type] || DEBRIS_PROFILE.bee;
  for (let i = 0; i < prof.count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 0.6 + Math.random() * 1.6;
    game.debris.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 0.3, // slight upward bias for arcade feel
      life: 0,
      maxLife: 32 + Math.floor(Math.random() * 18),
      color: prof.cols[Math.floor(Math.random() * prof.cols.length)],
      size: Math.random() < 0.25 ? 2 : 1
    });
  }
}

function spawnConfetti(count) {
  // BIOME-TINTED CONFETTI — replace one slot in the palette with active biome
  // color so celebrations carry environment hue at biome stages.
  let cols = ['#ff4', '#0ff', '#f6f', '#0f8', '#fa0', '#fff'];
  if (game && typeof biomeForStage === 'function') {
    const _cid = biomeForStage(game.stage || 1);
    if (_cid && typeof BIOME_NAMES !== 'undefined' && BIOME_NAMES[_cid]) {
      cols = ['#ff4', '#0ff', '#f6f', BIOME_NAMES[_cid].col, '#fa0', '#fff'];
    }
  }
  for (let i = 0; i < count; i++) {
    game.itemBursts.push({
      x: 30 + Math.random() * (BASE_W - 60),
      y: 60 + Math.random() * 100,
      life: -i * 4,
      color: cols[i % cols.length]
    });
  }
}

function spawnStageClear(label, sub) {
  game.floatTexts.push({
    x: BASE_W/2, y: BASE_H/2 - 10, text: label,
    color: '#ff4', life: 90, maxLife: 90, size: 14
  });
  // STAGE GRADE — compute letter grade from this stage's stats. Surfaced
  // alongside the clear banner so the player gets immediate skill feedback.
  // S: 95%+ acc + no-death + PB beat
  // A: 85%+ acc + no-death
  // B: 70%+ acc
  // C: < 70% acc
  // D: died this stage
  try {
    const _sf = game.stageShotsFired || 0;
    const _sh = game.stageShotsHit || 0;
    const _accPct = _sf > 0 ? (_sh / _sf) * 100 : 0;
    const _died = !!game.stageDied;
    let _pbBeat = false;
    try {
      const _pbF = (typeof stagePBs !== 'undefined' && stagePBs)
        ? stagePBs[String(game.stage)] : null;
      if (typeof _pbF === 'number' && _pbF > 0 && (game.stageFrames || 0) < _pbF) {
        _pbBeat = true;
      }
    } catch (e) {}
    let _grade, _gCol;
    if (_died) { _grade = 'D'; _gCol = '#f88'; }
    else if (_accPct >= 95 && _pbBeat)  { _grade = 'S'; _gCol = '#fc4'; }
    else if (_accPct >= 85)             { _grade = 'A'; _gCol = '#0f8'; }
    else if (_accPct >= 70)             { _grade = 'B'; _gCol = '#0cf'; }
    else                                { _grade = 'C'; _gCol = '#fff'; }
    if (_sf >= 5) {  // skip grade on near-zero-shot stages (boss insta-clears, etc.)
      game.floatTexts.push({
        x: BASE_W/2 + 56, y: BASE_H/2 - 10, text: _grade,
        color: _gCol, life: 90, maxLife: 90, size: 16
      });
      game.floatTexts.push({
        x: BASE_W/2 + 56, y: BASE_H/2 + 2, text: Math.round(_accPct) + '%',
        color: '#888', life: 80, maxLife: 80, size: 5
      });
      // STAGE GRADE LIFETIME TALLY — accumulate per-grade counts to localStorage
      // so PROFILE can surface medal totals (esp. S count = mastery signal).
      try {
        const _gRaw = localStorage.getItem('galagaStageGrades') || '{}';
        const _gT = JSON.parse(_gRaw);
        _gT[_grade] = (_gT[_grade] || 0) + 1;
        localStorage.setItem('galagaStageGrades', JSON.stringify(_gT));
      } catch (e) {}
      // PER-RUN S GRADE COUNTER — feeds into GAME_OVER run highlights
      if (_grade === 'S') game.runSGrades = (game.runSGrades || 0) + 1;
      // LAST STAGE GRADE — surfaces in next STAGE_INTRO as self-comparison.
      game.lastStageGrade = _grade;
      game.lastStageGradeCol = _gCol;
      // RECENT GRADE QUEUE — last 3 grades (oldest → newest). Surfaces in
      // STAGE_INTRO as a 3-letter sequence so streaks read at a glance.
      if (!Array.isArray(game.recentGrades)) game.recentGrades = [];
      game.recentGrades.push(_grade);
      if (game.recentGrades.length > 3) game.recentGrades.shift();
    }
  } catch (e) {}
  // STAGE CLEAR BIOME FLASH — brief biome-colored screen flash for environmental
  // continuity. Falls back to green default when no biome (stage 1-7).
  if (typeof biomeForStage === 'function') {
    const _bid = biomeForStage(game.stage || 1);
    if (_bid && typeof BIOME_NAMES !== 'undefined' && BIOME_NAMES[_bid]) {
      game.flashTimer = Math.max(game.flashTimer || 0, 8);
      game.flashColor = BIOME_NAMES[_bid].col;
      // BIOME PARTICLE BURST — 12 particles in biome color radially from center.
      if (game.itemBursts) {
        for (let _k = 0; _k < 12; _k++) {
          const _a = (_k / 12) * Math.PI * 2;
          game.itemBursts.push({
            x: BASE_W/2 + Math.cos(_a) * 12,
            y: BASE_H/2 + Math.sin(_a) * 12,
            life: -_k, color: BIOME_NAMES[_bid].col
          });
        }
      }
    }
  }
  if (sub) {
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 + 6, text: sub,
      color: '#fff', life: 90, maxLife: 90, size: 9
    });
  }
  // UNTOUCHED STAGE — zero hit-attempts taken (no death, no shield absorb,
  // no cheat eat). Pure evasion mastery. Skipped on stages with <5 shots fired
  // (e.g., instant boss-down doesn't deserve trophy).
  if ((game.stageHitTaken || 0) === 0 && (game.stageShotsFired || 0) >= 5) {
    addScore(300);
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 + 50, text: 'UNTOUCHED',
      color: '#0ff', life: 100, maxLife: 100, size: 11
    });
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 + 62, text: '+300',
      color: '#fff', life: 90, maxLife: 90, size: 6
    });
    if (game.shockwaves) {
      game.shockwaves.push({
        x: game.playerX, y: game.playerY,
        life: 0, maxLife: 26, maxR: 34, color: '#0ff'
      });
    }
    try {
      const _ut = parseInt(localStorage.getItem('galagaUntouchedStages') || '0', 10) || 0;
      localStorage.setItem('galagaUntouchedStages', String(_ut + 1));
    } catch (e) {}
    game.runUntouched = (game.runUntouched || 0) + 1;
  }
  // LAST STAND — stage cleared with exactly 1 life remaining and didn't die.
  // Adds drama to the win + small score bonus + lifetime counter.
  if ((game.lives || 0) === 1 && !game.stageDied) {
    addScore(200);
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 + 24, text: 'LAST STAND',
      color: '#f44', life: 100, maxLife: 100, size: 11
    });
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 + 36, text: '+200',
      color: '#fff', life: 90, maxLife: 90, size: 6
    });
    game.flashTimer = Math.max(game.flashTimer || 0, 6);
    game.flashColor = '#f44';
    if (typeof rumble === 'function') rumble(320, 0.85, 0.5);
    try {
      const _ls = parseInt(localStorage.getItem('galagaLastStands') || '0', 10) || 0;
      localStorage.setItem('galagaLastStands', String(_ls + 1));
    } catch (e) {}
    game.runLastStands = (game.runLastStands || 0) + 1;
  }
  spawnConfetti(8);
  // STAGE CLEAR PLAYER CELEBRATION — visual reward AT the player ship: shockwave
  // ring + 8 radial spark particles + slight screen flash. Localizes the win.
  if (game.playerAlive) {
    game.shockwaves.push({
      x: game.playerX, y: game.playerY,
      life: 0, maxLife: 24, maxR: 28, color: '#0f8'
    });
    for (let k = 0; k < 8; k++) {
      const a = (k / 8) * Math.PI * 2;
      game.itemBursts.push({
        x: game.playerX + Math.cos(a) * 14,
        y: game.playerY + Math.sin(a) * 14,
        life: -k, color: '#0f8'
      });
    }
    // Brief green flash for celebration tinted toward player
    game.flashTimer = Math.max(game.flashTimer, 8);
    game.flashColor = '#0f8';
    // STAGE CLEAR SPOTLIGHT — 60-frame cinematic vignette centered on the player.
    // Read by drawHUD overlay below to dim screen edges + leave player area lit.
    game.stageClearSpotlightFrames = 60;
  }
  playSound('extraLife');
}

function checkStageComplete() {
  // Stage end pacing — wait until the last kill's explosions have finished playing,
  // THEN start a 120-frame grace before advancing. Gives the climax room to breathe.
  const STAGE_END_GRACE = 120;
  const explosionsClear = (game.explosions || []).length === 0;
  if (game.state === STATE.BOSS_STAGE) {
    if (game.megaBosses && game.megaBosses.length > 0 && game.megaBosses.every(mb => !mb.alive) && explosionsClear) {
      if (game.stageEndGraceTimer === 0) {
        spawnStageClear('BOSS DOWN!', null);
        // OBJECTIVE check on boss stage clear (Turn 183 extension)
        if (game.stageObjective) {
          if (game.stageObjective.met(game)) {
            game.objectivesMetRun = (game.objectivesMetRun || 0) + 1;
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 + 32,
              text: 'OBJECTIVE COMPLETE!',
              color: '#0f8', life: 100, maxLife: 100, size: 10
            });
            spawnConfetti(8);
          } else {
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 + 32,
              text: 'MISSED: ' + game.stageObjective.label,
              color: '#fa8', life: 80, maxLife: 80, size: 6
            });
          }
        }
        const pbResult = recordStagePB(game.stage, game.stageFrames);
        if (pbResult.isNew) {
          const sec = fmtFrameTime(game.stageFrames);
          const txt = pbResult.prev != null
            ? 'NEW PB! ' + sec + ' (-' + fmtFrameTime(pbResult.prev - game.stageFrames) + ')'
            : 'NEW PB! ' + sec;
          game.floatTexts.push({
            x: BASE_W/2, y: BASE_H/2 + 16, text: txt,
            color: '#0f8', life: 90, maxLife: 90, size: 7
          });
          // PB CELEBRATION ENHANCED — extra confetti + flash + rumble for boss stage PB
          if (typeof spawnConfetti === 'function') spawnConfetti(12);
          game.flashTimer = Math.max(game.flashTimer || 0, 6);
          game.flashColor = '#0f8';
          if (typeof rumble === 'function') rumble(200, 0.7, 0.4);
        }
        // Score PB — boss stage variant
        const sGained = (game.score || 0) - (game.stageStartScore || 0);
        const sPbR = recordStageScorePB(game.stage, sGained);
        if (sPbR.isNew && sGained > 0) {
          const txt = sPbR.prev != null
            ? 'SCORE PB! +' + fmtScore(sGained) + ' (+' + fmtScore(sGained - sPbR.prev) + ')'
            : 'SCORE PB! +' + fmtScore(sGained);
          game.floatTexts.push({
            x: BASE_W/2, y: BASE_H/2 + 24, text: txt,
            color: '#ff4', life: 90, maxLife: 90, size: 7
          });
        }
      }
      if (game.stageEndGraceTimer < STAGE_END_GRACE) {
        game.stageEndGraceTimer++;
      } else {
        game.stageEndGraceTimer = 0;
        game.stage++;
        game.stats.maxStage = Math.max(game.stats.maxStage, game.stage);
        recordMilestoneTime();
        if (!tryTriggerBonusGame()) {
          game.state = STATE.STAGE_INTRO;
          game.stageTimer = 120;
          playSound('stageStart');
        }
      }
    }
  } else if (game.state === STATE.CHALLENGING) {
    if (game.challengeWaveIdx >= game.challengeWaves.length && game.challengeWaveTimer <= 0) {
      // Stage complete — show bonus
      const perfect = game.challengeHits === game.challengeTotal;
      const bonus = perfect ? 10000 : game.challengeHits * 100;
      addScore(bonus);
      spawnStageClear(perfect ? 'PERFECT!' : 'BONUS', '+' + bonus);
      // OBJECTIVE check on challenging stage clear (Turn 183 extension)
      if (game.stageObjective) {
        if (game.stageObjective.met(game)) {
          game.objectivesMetRun = (game.objectivesMetRun || 0) + 1;
          game.floatTexts.push({
            x: BASE_W/2, y: BASE_H/2 + 40,
            text: 'OBJECTIVE COMPLETE!',
            color: '#0f8', life: 100, maxLife: 100, size: 10
          });
          spawnConfetti(8);
        } else {
          game.floatTexts.push({
            x: BASE_W/2, y: BASE_H/2 + 40,
            text: 'MISSED: ' + game.stageObjective.label,
            color: '#fa8', life: 80, maxLife: 80, size: 6
          });
        }
      }
      // STAGE PB for challenging stage too
      {
        const pbResult = recordStagePB(game.stage, game.stageFrames);
        if (pbResult.isNew) {
          const sec = fmtFrameTime(game.stageFrames);
          const txt = pbResult.prev != null
            ? 'NEW PB! ' + sec + ' (-' + fmtFrameTime(pbResult.prev - game.stageFrames) + ')'
            : 'NEW PB! ' + sec;
          game.floatTexts.push({
            x: BASE_W/2, y: BASE_H/2 + 24, text: txt,
            color: '#0f8', life: 90, maxLife: 90, size: 7
          });
          // PB CELEBRATION ENHANCED (challenge variant)
          if (typeof spawnConfetti === 'function') spawnConfetti(12);
          game.flashTimer = Math.max(game.flashTimer || 0, 6);
          game.flashColor = '#0f8';
          if (typeof rumble === 'function') rumble(200, 0.7, 0.4);
        }
        // Score PB — challenge stage variant
        const sGained = (game.score || 0) - (game.stageStartScore || 0);
        const sPbR = recordStageScorePB(game.stage, sGained);
        if (sPbR.isNew && sGained > 0) {
          const txt = sPbR.prev != null
            ? 'SCORE PB! +' + fmtScore(sGained) + ' (+' + fmtScore(sGained - sPbR.prev) + ')'
            : 'SCORE PB! +' + fmtScore(sGained);
          game.floatTexts.push({
            x: BASE_W/2, y: BASE_H/2 + 32, text: txt,
            color: '#ff4', life: 90, maxLife: 90, size: 7
          });
        }
      }
      game.stage++;
      game.stats.maxStage = Math.max(game.stats.maxStage, game.stage);
      recordMilestoneTime();
      if (!tryTriggerBonusGame()) {
        game.state = STATE.STAGE_INTRO;
        game.stageTimer = 120;
        playSound('stageStart');
      }
    }
    if (game.challengeWaveTimer > 0) {
      game.challengeWaveTimer--;
      // WAVE COUNTDOWN AUDIO — 3-tone escalation before next wave arrives.
      // 30 frames left = soft tick, 15 = sharper tick, 1 = release (entry).
      if (game.challengeWaveTimer === 30) playSound('tick');
      else if (game.challengeWaveTimer === 15) playSound('tick');
      else if (game.challengeWaveTimer === 1) playSound('milestone');
    }
  } else {
    const alive = game.enemies.filter(e => e.alive).length;
    if (alive === 0 && game.allEntered && explosionsClear) {
      if (game.stageEndGraceTimer < STAGE_END_GRACE) {
        if (game.stageEndGraceTimer === 0) {
          spawnStageClear('STAGE CLEAR!', null);
          // SECONDARY OBJECTIVE check (visual reward when met, miss hint when not)
          if (game.stageObjective && game.stageObjective.met(game)) {
            game.objectivesMetRun = (game.objectivesMetRun || 0) + 1;
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 + 32,
              text: 'OBJECTIVE COMPLETE!',
              color: '#0f8', life: 100, maxLife: 100, size: 10
            });
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 + 42,
              text: game.stageObjective.label,
              color: '#cfc', life: 100, maxLife: 100, size: 6
            });
            spawnConfetti(8);
            playSound('extraLife');
          } else if (game.stageObjective) {
            // OBJECTIVE FAIL HINT — show what was missed so the player learns
            // which condition failed (e.g., COMBO 15+ unmet). Amber tone, brief.
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 + 32,
              text: 'MISSED: ' + game.stageObjective.label,
              color: '#fa8', life: 80, maxLife: 80, size: 6
            });
          }
          // STAGE PB — clear time vs personal best for this stage
          const pbResult = recordStagePB(game.stage, game.stageFrames);
          if (pbResult.isNew) {
            const sec = fmtFrameTime(game.stageFrames);
            const txt = pbResult.prev != null
              ? 'NEW PB! ' + sec + ' (-' + fmtFrameTime(pbResult.prev - game.stageFrames) + ')'
              : 'NEW PB! ' + sec;
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 + 16, text: txt,
              color: '#0f8', life: 90, maxLife: 90, size: 7
            });
            // BLAZE BANNER — 5+ second cut over prior PB
            if (pbResult.prev != null && (pbResult.prev - game.stageFrames) >= 300) {
              game.floatTexts.push({
                x: BASE_W/2, y: BASE_H/2 + 8, text: 'BLAZE!',
                color: '#fc4', life: 100, maxLife: 100, size: 10
              });
              if (typeof spawnConfetti === 'function') spawnConfetti(8);
            }
            playSound('extraLife');
            // PB CELEBRATION ENHANCED (normal play variant)
            if (typeof spawnConfetti === 'function') spawnConfetti(12);
            game.flashTimer = Math.max(game.flashTimer || 0, 6);
            game.flashColor = '#0f8';
            if (typeof rumble === 'function') rumble(200, 0.7, 0.4);
          }
          // STAGE SCORE PB — score gained during this stage vs best
          const scoreGained = (game.score || 0) - (game.stageStartScore || 0);
          const sPbResult = recordStageScorePB(game.stage, scoreGained);
          if (sPbResult.isNew && scoreGained > 0) {
            const txt = sPbResult.prev != null
              ? 'SCORE PB! +' + fmtScore(scoreGained) + ' (+' + fmtScore(scoreGained - sPbResult.prev) + ')'
              : 'SCORE PB! +' + fmtScore(scoreGained);
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 + 24, text: txt,
              color: '#ff4', life: 90, maxLife: 90, size: 7
            });
            // SCORE PB CINEMATIC — small yellow shockwave for visual punctuation
            if (game.shockwaves) {
              game.shockwaves.push({
                x: BASE_W/2, y: BASE_H/2 + 24,
                life: 0, maxLife: 20, maxR: 40, color: '#ff4'
              });
            }
            if (typeof spawnConfetti === 'function') spawnConfetti(6);
          }
          if (!game.stageDied) {
            unlockAchievement('perfectionist');
            game.zenStages = (game.zenStages || 0) + 1;
            game.zenStreak = (game.zenStreak || 0) + 1;
            if (game.zenStages === 5) unlockAchievement('zenMaster');
            if (game.zenStreak === 3) unlockAchievement('noDie3');
            if (game.zenStreak === 10) unlockAchievement('perfectRun');
            if (game.lives === 1) unlockAchievement('comeback');
            // MARATHON BANNER — gold banner at no-death streak milestones
            if (game.zenStreak === 5 || game.zenStreak === 10 || game.zenStreak === 20) {
              game.floatTexts.push({
                x: BASE_W/2, y: BASE_H/2 - 6, text: 'MARATHON x' + game.zenStreak,
                color: '#fc4', life: 110, maxLife: 110, size: 12
              });
              spawnConfetti(10);
              playSound('milestone');
            }
            // MARATHON MASTER trophy at 20-stage no-death streak
            if (game.zenStreak >= 20) unlockAchievement('marathonMaster');
          } else {
            game.zenStreak = 0;
          }
          if (!game.stageDied && game.entrySpiral) unlockAchievement('spiralDodger');
          if ((game.stagePowerUpsPicked || 0) === 0 && !game.stageDied) {
            unlockAchievement('thrifty');
            unlockAchievement('invincible');
          }
          if (game.stageShotsFired >= 10 && game.stageShotsHit === game.stageShotsFired && !game.stageDied) {
            unlockAchievement('perfectStage');
            if (game.stage + 1 >= 10) unlockAchievement('pacifist10');
            // PERFECT ACCURACY BANNER — 100% hit rate (10+ shots) recognition
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 + 80,
              text: 'PERFECT AIM', color: '#0ff',
              life: 90, maxLife: 90, size: 9
            });
            if (typeof spawnConfetti === 'function') spawnConfetti(10);
            if (typeof playSound === 'function') playSound('milestone');
          }
          if (game.stage + 1 >= 10) unlockAchievement('veteran');
          if (game.stage + 1 >= 10 && difficultyMode === 'hard') unlockAchievement('hardcoreFan');
          if (game.stage + 1 >= 20 && difficultyMode === 'hard') unlockAchievement('hardWired');
          if (!game.stageDied && difficultyMode === 'hard') unlockAchievement('recklessAce');
          if (game.stage + 1 >= 25) unlockAchievement('marathon');
          if (game.stage + 1 >= 30) unlockAchievement('flagWaver');
          if (game.stage + 1 >= 15 && game.challengeMode) unlockAchievement('challengeKing');
          if (game.stage + 1 >= 40) unlockAchievement('finalBoss');
          if (game.stage + 1 >= 50) unlockAchievement('legend');
          if (game.stage + 1 >= 60) unlockAchievement('apex');
          if (game.stage + 1 >= 100) unlockAchievement('pillarsOf');
          if (game.stage + 1 >= 100) unlockAchievement('finalForm');
          // Speedrun: reach stage 10 in under 3 minutes (10800 frames)
          if (game.stage + 1 >= 10 && (game.runFrames || 0) <= 10800) unlockAchievement('speedrun');
          // Speedrunner: clear stage 5 in under 90s
          if (game.stage + 1 >= 5 && (game.runFrames || 0) <= 5400) unlockAchievement('speedRunner');
          // Marathoner: 20 stages in single run
          if (game.stage + 1 >= 20) unlockAchievement('marathoner');
          // Iron pilot: no death + 90%+ accuracy this stage
          {
            const accStage = game.stageShotsFired === 0 ? 0
              : Math.round((game.stageShotsHit / game.stageShotsFired) * 100);
            if (!game.stageDied && accStage >= 90 && game.stageShotsFired >= 10) unlockAchievement('ironPilot');
          }
          // Performance bonuses
          const timeBonus = Math.max(0, 5000 - game.stageFrames * 6);
          const noDeathBonus = game.stageDied ? 0 : 1500;
          const accBonus = game.stageShotsFired === 0 ? 0
            : Math.round((game.stageShotsHit / game.stageShotsFired) * 1000);
          const challengeBonus = game.challengeMode ? 5000 : 0;
          const total = timeBonus + noDeathBonus + accBonus + challengeBonus;
          if (total > 0) addScore(total);
          if (total >= 50000) unlockAchievement('highRoller');
          const cy = BASE_H / 2 + 22;
          // Each bonus animates from 0 → final over 30 frames so they feel like a tally rolling up
          if (timeBonus > 0) game.floatTexts.push({
            x: BASE_W/2, y: cy, text: '', countTo: timeBonus, prefix: 'TIME +', countDuration: 30,
            color: '#0ff', life: 80, maxLife: 80, size: 7
          });
          if (noDeathBonus > 0) game.floatTexts.push({
            x: BASE_W/2, y: cy + 9, text: '', countTo: noDeathBonus, prefix: 'NO HIT +', countDuration: 30,
            color: '#0f8', life: 80, maxLife: 80, size: 7
          });
          if (accBonus > 0) game.floatTexts.push({
            x: BASE_W/2, y: cy + 18, text: '', countTo: accBonus, prefix: 'ACCURACY +', countDuration: 30,
            color: '#f6f', life: 80, maxLife: 80, size: 7
          });
          if (challengeBonus > 0) game.floatTexts.push({
            x: BASE_W/2, y: cy + 27, text: '', countTo: challengeBonus, prefix: 'CHALLENGE +', countDuration: 30,
            color: '#f44', life: 80, maxLife: 80, size: 7
          });
          if (total > 0) game.floatTexts.push({
            x: BASE_W/2, y: cy + 39, text: '', countTo: total, prefix: 'TOTAL +', countDuration: 50,
            color: '#ff4', life: 80, maxLife: 80, size: 9
          });
          // STAGE KILLS COUNT — small label showing kills this stage
          if ((game.stageKills || 0) >= 5) {
            game.floatTexts.push({
              x: BASE_W/2, y: cy + 60,
              text: 'KILLS: ' + game.stageKills,
              color: '#fc8', life: 100, maxLife: 100, size: 6
            });
          }
          // STAGE TOTAL TIER LABEL — big-windfall recognition tier
          if (total >= 10000) {
            const _tierTxt = total >= 50000 ? 'JACKPOT!'
                           : total >= 25000 ? 'WINDFALL!'
                           : 'BIG HAUL';
            const _tierCol = total >= 50000 ? '#fc4' : total >= 25000 ? '#ff8' : '#0f8';
            game.floatTexts.push({
              x: BASE_W/2, y: cy + 50, text: _tierTxt,
              color: _tierCol, life: 100, maxLife: 100, size: 8
            });
            if (typeof spawnConfetti === 'function') spawnConfetti(8);
          }
          // STAGE GRADE — letter grade based on accuracy + no-death + time bonus tier.
          // Pure recognition layer; no extra score (the underlying bonuses already
          // reward the same axes). Counters per grade persisted to localStorage for
          // long-term progression visibility on the PROFILE page.
          {
            const accForGrade = game.stageShotsFired === 0 ? 0
              : Math.round((game.stageShotsHit / game.stageShotsFired) * 100);
            const fastClear = timeBonus >= 3500;
            let grade, gradeCol;
            if (!game.stageDied && accForGrade >= 90 && fastClear) {
              grade = 'S'; gradeCol = '#fc4';
            } else if (!game.stageDied && accForGrade >= 80) {
              grade = 'A'; gradeCol = '#0ff';
            } else if (accForGrade >= 65) {
              grade = 'B'; gradeCol = '#0f8';
            } else if (accForGrade >= 40) {
              grade = 'C'; gradeCol = '#fff';
            } else {
              grade = 'D'; gradeCol = '#aaa';
            }
            // ACE STREAK — track consecutive S/A grades. Banner at 3/5/10/15.
            // Resets on B or below. Lifetime best persisted for run highlights.
            const _isAce = (grade === 'S' || grade === 'A');
            if (_isAce) {
              game.aceStreak = (game.aceStreak || 0) + 1;
              if (game.aceStreak > (game.aceStreakBest || 0)) game.aceStreakBest = game.aceStreak;
              if (game.aceStreak === 3 || game.aceStreak === 5 || game.aceStreak === 10 || game.aceStreak === 15) {
                game.floatTexts.push({
                  x: BASE_W/2, y: BASE_H/2 + 40,
                  text: 'ACE STREAK x' + game.aceStreak,
                  color: '#fc4', life: 100, maxLife: 100, size: 10
                });
                if (typeof spawnConfetti === 'function') spawnConfetti(8);
                if (typeof playSound === 'function') playSound('milestone');
              }
            } else {
              game.aceStreak = 0;
            }
            // Top-center large letter with bracket frame
            game.floatTexts.push({
              x: BASE_W/2, y: 56, text: '[ ' + grade + ' ]',
              color: gradeCol, life: 120, maxLife: 120, size: 14
            });
            game.floatTexts.push({
              x: BASE_W/2, y: 72, text: 'STAGE GRADE',
              color: '#888', life: 120, maxLife: 120, size: 4
            });
            // GRADE SFX — distinct audio per tier. S/A get triumphant cues, B/C
            // get neutral acknowledgements, D gets a low thud (signaling room for
            // improvement). Reuses existing SFX palette — no new oscillator code.
            const gradeSfx = grade === 'S' ? 'extraLife'
                           : grade === 'A' ? 'milestone'
                           : grade === 'B' ? 'powerUp'
                           : grade === 'C' ? 'tick'
                           : 'lowLife';
            playSound(gradeSfx);
            // S grade gets a small rumble + screen flash to amplify the moment
            if (grade === 'S') {
              game.flashTimer = Math.max(game.flashTimer || 0, 8);
              game.flashColor = '#fc4';
              rumble(220, 0.85, 0.5);
              // S GRADE CINEMATIC — gold shockwave + 16 confetti + 'PERFECT!'
              // bonus banner. Triggered only on S so it stays rare and earned.
              if (game.shockwaves) {
                game.shockwaves.push({
                  x: BASE_W/2, y: 60,
                  life: 0, maxLife: 28, maxR: 70, color: '#fc4'
                });
                game.shockwaves.push({
                  x: BASE_W/2, y: 60,
                  life: -8, maxLife: 22, maxR: 50, color: '#ff4'
                });
              }
              if (typeof spawnConfetti === 'function') spawnConfetti(16);
              game.floatTexts.push({
                x: BASE_W/2, y: 84, text: 'PERFECT!',
                color: '#fff', life: 100, maxLife: 100, size: 6
              });
            }
            // Persist grade-tier counters for PROFILE page display
            try {
              const raw = localStorage.getItem('galagaStageGrades') || '{}';
              const tally = JSON.parse(raw);
              tally[grade] = (tally[grade] || 0) + 1;
              localStorage.setItem('galagaStageGrades', JSON.stringify(tally));
            } catch (e) {}
          }
          // STAGE PERFECT CLEAR — no death + accuracy ≥ 85% + min 10 shots.
          // Cumulative count persisted to localStorage galagaPerfectClears. Pure visual
          // recognition; no score bonus (perfectStage achievement / per-stage tallies
          // already incentivize precision — this is just the named celebration).
          {
            const accStage = game.stageShotsFired === 0 ? 0
              : Math.round((game.stageShotsHit / game.stageShotsFired) * 100);
            if (!game.stageDied && accStage >= 85 && game.stageShotsFired >= 10) {
              game.floatTexts.push({
                x: BASE_W/2, y: cy - 12, text: 'PERFECT CLEAR!',
                color: '#ff4', life: 120, maxLife: 120, size: 11
              });
              spawnConfetti(18);
              playSound('extraLife');
              try {
                const cur = parseInt(localStorage.getItem('galagaPerfectClears') || '0', 10) || 0;
                localStorage.setItem('galagaPerfectClears', String(cur + 1));
              } catch (e) {}
              // GOLDEN CLEAR — PERFECT CLEAR + new STAGE TIME PB on the same stage.
              // Highest recognition tier: mastery of both precision AND speed.
              // +1500 score + dramatic banner + persistent counter.
              if (typeof pbResult !== 'undefined' && pbResult && pbResult.isNew) {
                addScore(1500);
                game.floatTexts.push({
                  x: BASE_W/2, y: cy - 32, text: '★ GOLDEN CLEAR ★',
                  color: '#fc4', life: 140, maxLife: 140, size: 13
                });
                game.floatTexts.push({
                  x: BASE_W/2, y: cy - 20, text: 'PERFECT + PB! +1500',
                  color: '#fff', life: 140, maxLife: 140, size: 7
                });
                spawnConfetti(24);
                playSound('extraLife');
                setTimeout(() => playSound('milestone'), 180);
                game.flashTimer = Math.max(game.flashTimer || 0, 12);
                game.flashColor = '#fc4';
                rumble(360, 0.95, 0.6);
                try {
                  const gcCur = parseInt(localStorage.getItem('galagaGoldenClears') || '0', 10) || 0;
                  localStorage.setItem('galagaGoldenClears', String(gcCur + 1));
                } catch (e) {}
              }
              // PERFECT STREAK — consecutive PERFECT CLEARs within a single run.
              // Resets when a stage fails the perfect condition. Milestone celebrations
              // at ×3 / ×5 / ×10 give escalating recognition + persistent best record.
              game.perfectStreak = (game.perfectStreak || 0) + 1;
              if (game.perfectStreak >= 2) {
                game.floatTexts.push({
                  x: BASE_W/2, y: cy - 22, text: 'STREAK x' + game.perfectStreak,
                  color: '#fc4', life: 100, maxLife: 100, size: 8
                });
              }
              if (game.perfectStreak === 3 || game.perfectStreak === 5 || game.perfectStreak === 10) {
                spawnConfetti(12);
                playSound('milestone');
                game.flashTimer = Math.max(game.flashTimer || 0, 6);
                game.flashColor = '#fc4';
                rumble(220, 0.8, 0.5);
              }
              if (game.perfectStreak >= 5) unlockAchievement('perfectChain');
              try {
                const best = parseInt(localStorage.getItem('galagaPerfectStreakBest') || '0', 10) || 0;
                if (game.perfectStreak > best) {
                  localStorage.setItem('galagaPerfectStreakBest', String(game.perfectStreak));
                }
              } catch (e) {}
            } else {
              // Failed perfect condition — break the streak silently
              game.perfectStreak = 0;
            }
          }
        }
        game.stageEndGraceTimer++;
      } else {
        game.stageEndGraceTimer = 0;
        game.stage++;
        game.stats.maxStage = Math.max(game.stats.maxStage, game.stage);
        recordMilestoneTime();
        if (!tryTriggerBonusGame()) {
          game.state = STATE.STAGE_INTRO;
          game.stageTimer = 120;
          playSound('stageStart');
        }
      }
    }
  }
}

// --- Main update ---
// --- Demo / attract mode ---
const DEMO_IDLE_FRAMES = 1500; // 25s at 60fps

function startDemoMode() {
  resetGame();
  game.isDemo = true;
  game.lvl = { S: 2, N: 2, P: 1 };
  game.lives = 1;
  game.state = STATE.STAGE_INTRO;
  game.stageTimer = 60;
  playSound('stageStart');
}

function aiInput() {
  // Reset movement, force fire on each frame
  keys['ArrowLeft'] = false;
  keys['ArrowRight'] = false;

  // Bullet evasion takes priority
  let evade = 0;
  for (const b of game.enemyBullets) {
    const dy = b.y - game.playerY;
    if (dy > -36 && dy < 4 && Math.abs(b.x - game.playerX) < 14) {
      evade += b.x < game.playerX ? 1 : -1;
    }
  }
  // Avoid diving enemies too
  const enemies = game.state === STATE.CHALLENGING
    ? (game.challengeWaves[game.challengeWaveIdx] || [])
    : game.enemies;
  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.state === 'formation' || e.state === 'entering') continue;
    const dy = e.y - game.playerY;
    if (dy > -50 && dy < 8 && Math.abs(e.x - game.playerX) < 18) {
      evade += e.x < game.playerX ? 1 : -1;
    }
  }

  if (evade !== 0) {
    if (evade > 0) keys['ArrowRight'] = true;
    else keys['ArrowLeft'] = true;
  } else {
    // Aim at nearest enemy x
    let bestDx = 999, targetX = game.playerX;
    for (const e of enemies) {
      if (!e.alive) continue;
      const d = Math.abs(e.x - game.playerX);
      if (d < bestDx) { bestDx = d; targetX = e.x; }
    }
    for (const mb of (game.megaBosses || [])) {
      if (!mb.alive) continue;
      const dx = Math.abs(mb.x - game.playerX);
      if (dx < bestDx) { bestDx = dx; targetX = mb.x; }
    }
    if (targetX < game.playerX - 3) keys['ArrowLeft'] = true;
    else if (targetX > game.playerX + 3) keys['ArrowRight'] = true;
  }

  // Continuous fire
  keys[' '] = true;
}

// --- Gamepad input + haptics ---
let _prevGpFire = false, _prevGpStart = false;
let _prevGpLeft = false, _prevGpRight = false;

function rumble(duration, strong, weak) {
  if (!navigator.getGamepads) return;
  const mul = rumbleMul();
  if (mul === 0) return;
  const pads = navigator.getGamepads();
  for (const p of pads) {
    if (!p) continue;
    const a = p.vibrationActuator;
    if (a && a.playEffect) {
      try {
        a.playEffect('dual-rumble', {
          duration, startDelay: 0,
          strongMagnitude: strong * mul,
          weakMagnitude: weak * mul
        });
      } catch (e) {}
    }
    break;
  }
}

function pollGamepad() {
  if (!navigator.getGamepads) return;
  const pads = navigator.getGamepads();
  let pad = null;
  for (const p of pads) if (p) { pad = p; break; }
  if (!pad) { _prevGpFire = false; _prevGpStart = false; return; }

  const ax = pad.axes[0] || 0;
  const dpadL = pad.buttons[14] && pad.buttons[14].pressed;
  const dpadR = pad.buttons[15] && pad.buttons[15].pressed;
  const fire  = pad.buttons[0] && pad.buttons[0].pressed;
  const start = pad.buttons[9] && pad.buttons[9].pressed;

  // Any pad activity during the game-over auto-restart window cancels the countdown,
  // matching keyboard's "any input cancels" behavior so the player isn't yanked back
  // into a fresh run while they're still browsing with a controller.
  if (game.state === STATE.GAME_OVER && (game.autoRestartTimer || 0) > 0) {
    if (Math.abs(ax) > 0.4 || dpadL || dpadR || fire || start) {
      game.autoRestartTimer = -1;
    }
  }

  const gpL = (ax < -0.4 || dpadL);
  const gpR = (ax >  0.4 || dpadR);
  // Only clear keys[Arrow*] when the gamepad transitions from pressed → released.
  // This way keyboard input still works normally; only gamepad-induced "stuck" keys are cleared.
  if (gpL) keys['ArrowLeft'] = true;
  else if (_prevGpLeft) keys['ArrowLeft'] = false;
  if (gpR) keys['ArrowRight'] = true;
  else if (_prevGpRight) keys['ArrowRight'] = false;
  _prevGpLeft = gpL;
  _prevGpRight = gpR;
  if (fire) keys[' '] = true;
  else if (_prevGpFire) keys[' '] = false;

  // Rising-edge actions
  if (fire && !_prevGpFire) {
    ensureAudio();
    if (introCinematic) { endCinematic(); _prevGpFire = fire; return; }
    if (game.isDemo) {
      resetGame();
      game.state = STATE.TITLE;
      stopBGM();
      _prevGpFire = fire;
      return;
    }
    if (game) game.idleTime = 0;
    if (game.state === STATE.TITLE) {
      resetGame();
      game.state = STATE.STAGE_INTRO;
      game.stageTimer = 120;
      playSound('stageStart');
    } else if (game.state === STATE.GAME_OVER && game.gameOverTimer <= 0) {
      resetGame();
      game.state = STATE.TITLE;
    }
  }
  _prevGpFire = fire;

  if (start && !_prevGpStart) {
    if (game.state === STATE.PAUSED) {
      game.state = game.pausedState;
      startBGM(bgmForGameState(game.pausedState));
    } else if (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE) {
      game.pausedState = game.state;
      game.state = STATE.PAUSED;
      stopBGM();
    }
  }
  _prevGpStart = start;
}

function update() {
  game.animFrame++;
  // Per-frame counters reset (boss damage number spawn cap)
  game._dmgNumThisFrame = 0;
  pollGamepad();
  updateStars();
  updateDustMotes();
  maybeSpawnConstellation();
  updateConstellation();
  updateShake();
  if (volIndicatorTimer > 0) volIndicatorTimer--;
  // Gameplay-logic timers — frozen during PAUSED so post-respawn / dash iframes aren't
  // silently consumed while the player is in the pause menu.
  if (game.state !== STATE.PAUSED) {
    if (game.flashTimer > 0) game.flashTimer--;
    if (game.invincibleTimer > 0) game.invincibleTimer--;
    // NEW HIGH SCORE glow — moved here from addScore() so it ticks once per frame
    // instead of once per score gain (bomb chains were burning the 4s glow in <100ms,
    // and idle frames were never decrementing it at all).
    if ((game.highScoreGlow || 0) > 0) game.highScoreGlow--;
    // DEATH POSTMORTEM marker tick
    if ((game.deathMarkerLife || 0) > 0) game.deathMarkerLife--;
    // DEATH GHOST TRAIL tick
    if ((game.deathGhostLife || 0) > 0) game.deathGhostLife--;
    // STAGE CLEAR SPOTLIGHT tick
    if ((game.stageClearSpotlightFrames || 0) > 0) game.stageClearSpotlightFrames--;
    // PARRY STREAK timer — expires the chain if no new parry within 90 frames
    if ((game.parryStreakTimer || 0) > 0) {
      game.parryStreakTimer--;
      if (game.parryStreakTimer === 0) game.parryStreak = 0;
    }
    // COMBO PB batched persistence — write every 60 frames (1s) only when changed.
    // Replaces the per-kill localStorage thrash that was causing frame hitches.
    if ((game._comboPbPending || 0) > 0 && game.animFrame % 60 === 0) {
      try {
        const cur = parseInt(localStorage.getItem('galagaMaxComboEver') || '0', 10) || 0;
        if (game._comboPbPending > cur) {
          localStorage.setItem('galagaMaxComboEver', String(game._comboPbPending));
        }
      } catch (e) {}
      game._comboPbPending = 0;
    }
    // DIVE LAUNCH AFTERIMAGE tick — age each entry, splice when expired
    if (game.diveAfterimages && game.diveAfterimages.length) {
      for (let i = game.diveAfterimages.length - 1; i >= 0; i--) {
        game.diveAfterimages[i].life++;
        if (game.diveAfterimages[i].life >= game.diveAfterimages[i].maxLife) {
          game.diveAfterimages.splice(i, 1);
        }
      }
    }
    // Combo-lost gray flash — was previously decremented inside draw's `else if` branch,
    // which (a) violated draw=pure-read convention, (b) never ticked when highScoreGlow
    // happened to be active too, and (c) ticked during PAUSED if the screen still drew.
    if ((game.comboLostFlashTimer || 0) > 0) game.comboLostFlashTimer--;
    // WITCH TIME — fatal-hit slow window. If player dashes during the window, the hit is
    // canceled (NEAR MISS bonus). If timer expires without dash, the kill resolves now.
    if ((game.witchTimer || 0) > 0) {
      game.witchTimer--;
      if (game.dashTimer > 0 && !game.witchSaved) {
        // Save! Survival itself is the reward — no bonus points to avoid double-rewarding
        // a single skill expression. Visual celebration (text + confetti + sfx) is enough.
        game.witchSaved = true;
        game.witchSaves = (game.witchSaves || 0) + 1;
        game.floatTexts.push({
          x: BASE_W/2, y: BASE_H/2 - 8, text: 'WITCH TIME!',
          color: '#fff', life: 60, maxLife: 60, size: 12
        });
        spawnConfetti(8);
        game.flashTimer = Math.max(game.flashTimer, 8);
        game.flashColor = '#fff';
        game.witchCooldown = WITCH_COOLDOWN;
        playSound('extraLife');
        rumble(260, 0.8, 0.5);
      }
      if (game.witchTimer === 0 && !game.witchSaved) {
        // Window closed without dash — death resolves
        game.witchCooldown = WITCH_COOLDOWN;
        killPlayer();
      }
    }
    if ((game.witchCooldown || 0) > 0) game.witchCooldown--;
    // Perk select window decrements while the player is choosing. Expires silently
    // if no choice is made (game.perkOffered = null reset on next boss).
    if ((game.perkSelectFrames || 0) > 0) {
      game.perkSelectFrames--;
      if (game.perkSelectFrames === 0) game.perkOffered = null;
    }
    // Weapon activation callout life tick
    if ((game.weaponCalloutLife || 0) > 0) game.weaponCalloutLife--;
    // Big combo lost vignette tick
    if ((game.comboLostVignette || 0) > 0) game.comboLostVignette--;
    // Rare spawn alert tick (UFO / golden bee announcement)
    if ((game.rareSpawnAlertLife || 0) > 0) game.rareSpawnAlertLife--;
    // Ambient event tick (cargoShip drift / supernova fade). Frozen during PAUSED with
    // the rest of these atmospheric timers so the scene holds in place while paused.
    updateAmbientEvent();
    // CORRUPTION VOICE — late stage (corruption > 0.4) randomly spawn distorted
    // 1-word whispers at random screen position. Adds narrative voice layer to
    // the existing purely-visual worldCorruption system. Score-neutral.
    if (game.stage >= 50 && game.playerAlive
        && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
      // Spawn chance ramps from 0.0008 at stage 50 to 0.004 at stage 80 (~once per 4-15s)
      const _voiceChance = Math.min(0.006, 0.0008 + (game.stage - 50) * 0.00013);
      if (Math.random() < _voiceChance) {
        const _voiceWords = ['STATIC', 'WHO?', 'WAKE.', 'WRONG', 'ECHO', 'HOLLOW',
                             'TURN BACK', 'REMEMBER', '01010', 'INSIDE', 'NULL',
                             'COLD', 'WATCHING', 'EMPTY'];
        const _w = _voiceWords[Math.floor(Math.random() * _voiceWords.length)];
        const _vx = 30 + Math.random() * (BASE_W - 60);
        const _vy = 40 + Math.random() * (BASE_H - 80);
        const _vc = Math.random() < 0.5 ? '#f48' : '#0cf';
        game.floatTexts.push({
          x: _vx, y: _vy, text: _w, color: _vc, life: 50, maxLife: 50, size: 5
        });
      }
    }
    // Camera FX timers — moved out of draw() so they tick at simulation rate (60Hz)
    // instead of render rate (varies by monitor: 60/120/144Hz). On a 144Hz display the
    // 14-frame zoom pulse was burning out in ~95ms instead of 233ms.
    if ((game.zoomPulse || 0) > 0) game.zoomPulse--;
    if ((game.cinematicBars || 0) > 0) game.cinematicBars--;
    if ((game.lifeGainPulseTimer || 0) > 0) game.lifeGainPulseTimer--;
    // RUN TIME MILESTONE BANNERS — 5/10/20/30 minute marks, one-shot per run.
    // Encourages staying alive and offers paced rewards in long sessions.
    {
      const _milestones = [18000, 36000, 72000, 108000]; // 5/10/20/30 min @60fps
      const _labels = ['5 MIN MARK', '10 MIN MARK', '20 MIN MARK', '30 MIN MARK'];
      const _cols = ['#0ff', '#0f8', '#fc4', '#f6f'];
      if (!game._runTimeMileFired) game._runTimeMileFired = [false, false, false, false];
      for (let _mi = 0; _mi < _milestones.length; _mi++) {
        if (!game._runTimeMileFired[_mi] && (game.runFrames || 0) >= _milestones[_mi]) {
          game._runTimeMileFired[_mi] = true;
          game.floatTexts.push({
            x: BASE_W/2, y: BASE_H/2 - 40, text: _labels[_mi],
            color: _cols[_mi], life: 100, maxLife: 100, size: 10
          });
          if (typeof spawnConfetti === 'function') spawnConfetti(8);
          if (typeof playSound === 'function') playSound('milestone');
        }
      }
    }
    // SCORE ROLL — lerp scoreDisplay toward game.score (or jump if gap large).
    // Faster ease near target keeps it from lingering on small diffs. Pure visual.
    {
      const _gap = (game.score || 0) - (game.scoreDisplay || 0);
      if (_gap !== 0) {
        const _step = Math.max(1, Math.ceil(Math.abs(_gap) * 0.18));
        game.scoreDisplay = (game.scoreDisplay || 0) + Math.sign(_gap) * Math.min(_step, Math.abs(_gap));
      }
    }
    if (game.camNudgeX || game.camNudgeY) {
      game.camNudgeX = (game.camNudgeX || 0) * 0.78;
      game.camNudgeY = (game.camNudgeY || 0) * 0.78;
      if (Math.abs(game.camNudgeX) < 0.05) game.camNudgeX = 0;
      if (Math.abs(game.camNudgeY) < 0.05) game.camNudgeY = 0;
    }
  }

  switch(game.state) {
    case STATE.TITLE:
      game.titleBlink++;
      if (shipChangeFrame > 0) shipChangeFrame--;
      // Tick float texts so setting toasts (DIFFICULTY/SHAKE/RUMBLE/etc.) expire visibly
      // instead of accumulating invisibly under the title screen.
      updateFloatTexts();
      // Cinematic only ticks while it's active; suppresses demo until done.
      if (introCinematic) {
        cinematicFrame++;
        if (cinematicFrame >= CINEMATIC_END) endCinematic();
      } else {
        game.idleTime = (game.idleTime || 0) + 1;
        if (game.idleTime >= DEMO_IDLE_FRAMES) startDemoMode();
        // Title BGM — start once we leave the cinematic, idempotent if already playing.
        if (bgmEnabled && audioCtx && bgmTrack !== 'title') startBGM('title');
        // TITLE ambient events — periodically spawn cargoShip/supernova/satellite/comet
        // so the title screen reads as a living sector. Bypasses pickAmbientEvent's
        // stage gate (which suppresses ambient until stage 4 in-game).
        game.titleAmbientCooldown = (game.titleAmbientCooldown || 240) - 1;
        if (game.titleAmbientCooldown <= 0 && !game.ambientEvent) {
          const titleTypes = ['cargoShip', 'satellite', 'comet', 'supernova'];
          startAmbientEvent(titleTypes[Math.floor(Math.random() * titleTypes.length)]);
          game.titleAmbientCooldown = 600 + Math.floor(Math.random() * 600); // 10-20s next
        }
      }
      break;

    case STATE.STAGE_INTRO:
      // Tick at each countdown digit transition (stageTimer crosses 60 / 40 / 20)
      if (game.stageTimer === 60 || game.stageTimer === 40 || game.stageTimer === 20) {
        playSound('tick');
      }
      if (game.stageTimer === 1) playSound('comboStep');
      // Milestone-stage triumph fanfare 30 frames into the intro
      if (game.stageTimer === 90 && MILESTONE_STAGES.indexOf(game.stage) >= 0) {
        playSound('milestoneStage');
      }
      // Boss warning klaxon — three repeated alarms during a boss-stage intro
      if (game.stage % BOSS_STAGE_INTERVAL === 0) {
        if (game.stageTimer === 100 || game.stageTimer === 75 || game.stageTimer === 50) {
          playSound('bossWarning');
        }
      }
      game.stageTimer--;
      if (game.stageTimer <= 0) startStage();
      break;

    case STATE.PLAYING:
      bulletCap();
      shockwaveCap();
      if (game.isDemo) aiInput();
      updatePlayer();
      updateBullets();
      updatePowerUps();
      updateFormationBreathing();
      updateEnemies();
      updateCollisions();
      updateExplosions();
      updateFloatTexts();
      updateItemBursts();
      updateHitSparks();
      updatePlayerTrail();
      updateCombo();
      updateToasts();
      game.stageFrames++;
      game.runFrames++;
      checkStageComplete();
      break;

    case STATE.CHALLENGING:
      bulletCap();
      shockwaveCap();
      if (game.isDemo) aiInput();
      updatePlayer();
      updateBullets();
      updatePowerUps();
      updateChallengeEnemies();
      updateCollisions();
      updateExplosions();
      updateFloatTexts();
      updateItemBursts();
      updateHitSparks();
      updatePlayerTrail();
      updateCombo();
      updateToasts();
      game.stageFrames++;
      game.runFrames++;
      checkStageComplete();
      break;

    case STATE.BOSS_STAGE:
      bulletCap();
      shockwaveCap();
      if (game.isDemo) aiInput();
      updatePlayer();
      updateBullets();
      updateBossStage();
      updatePowerUps();
      updateExplosions();
      updateCollisions();
      updateFloatTexts();
      updateItemBursts();
      updateHitSparks();
      updatePlayerTrail();
      updateCombo();
      updateToasts();
      // BOSS HP CRITICAL — one-shot threshold callouts at 25% / 10% aggregate HP.
      // Visual + audio combine to mark moments of escalating danger near a kill.
      if (game.megaBosses && game.megaBosses.length) {
        const _tMax = game.megaBosses.reduce((s, mb) => s + mb.maxHp, 0);
        const _tHp  = game.megaBosses.reduce((s, mb) => s + (mb.alive ? mb.hp : 0), 0);
        const _rat = _tMax > 0 ? _tHp / _tMax : 1;
        if (!game._boss25Crossed && _rat <= 0.25 && _rat > 0) {
          game._boss25Crossed = true;
          game.floatTexts.push({
            x: BASE_W/2, y: 22, text: '< 25% — FINISH IT',
            color: '#fc4', life: 70, maxLife: 70, size: 6
          });
          playSound('tick');
        }
        if (!game._boss10Crossed && _rat <= 0.10 && _rat > 0) {
          game._boss10Crossed = true;
          game.floatTexts.push({
            x: BASE_W/2, y: 22, text: '!! CRITICAL !!',
            color: '#f44', life: 90, maxLife: 90, size: 8
          });
          playSound('lowLife');
          game.flashTimer = Math.max(game.flashTimer || 0, 6);
          game.flashColor = '#f44';
          rumble(180, 0.7, 0.4);
        }
      }
      game.stageFrames++;
      game.runFrames++;
      checkStageComplete();
      break;

    case STATE.BONUS_GAME:
      updateBonusGame();
      // Float texts (e.g. NEW HIGH SCORE on bonus payout) and confetti bursts
      // need to expire here too — otherwise they leak into the next stage.
      updateFloatTexts();
      updateItemBursts();
      break;

    case STATE.CAPTURED:
      game.captureTimer++;
      // Short pause then lose life
      if (game.captureTimer > 120) {
        // Restore BGM volume (capture cutscene ending)
        if (bgmGain) bgmGain.gain.value = bgmEnabled ? 1 : 0;
        game.lives--;
        if (game.lives <= 0) {
          game.state = STATE.GAME_OVER;
          game.gameOverTimer = 180;
          const acc = game.stats.shotsFired === 0 ? 0
            : Math.round((game.stats.shotsHit / game.stats.shotsFired) * 100);
          game.topRank = submitTopScore(game.score, game.stats.maxStage, acc);
          commitGameToCumStats();
          playSound('gameOver');
        } else {
          // Capture-respawn always returns to PLAYING (capture only triggers in formation play)
          game.pausedState = STATE.PLAYING;
          game.state = STATE.RESPAWN;
          game.respawnTimer = 90;
        }
      }
      // Return boss to formation
      if (game.capturedShipEnemy) {
        const boss = game.capturedShipEnemy;
        if (boss.state === 'capturing') {
          boss.state = 'returning';
          boss.path = createEntryPath(boss.x, boss.y, boss.homeX, boss.homeY - 14, 1);
          boss.pathProgress = 0;
        }
        // Update boss movement
        if (boss.state === 'returning') {
          boss.pathProgress += boss.pathSpeed * 1.2;
          if (boss.pathProgress >= 1) {
            boss.state = 'formation';
            boss.x = boss.homeX; boss.y = boss.homeY;
          } else {
            const p = bezierPoint(boss.path.p0, boss.path.p1, boss.path.p2, boss.path.p3, boss.pathProgress);
            boss.x = p.x; boss.y = p.y;
          }
        }
      }
      updateExplosions();
      // Drain any score floats / confetti from the kill that triggered capture so
      // they don't freeze on screen for the ~2s capture cutscene.
      updateFloatTexts();
      updateItemBursts();
      break;

    case STATE.RESPAWN:
      game.respawnTimer--;
      updateFormationBreathing();
      // Continue enemy movement during respawn
      updateEnemies();
      updateExplosions();
      updateBullets();
      // Keep power-ups falling so a drop in flight at the moment of death doesn't freeze
      // mid-air for 1.5s and end up parked in an awkward spot when the player respawns.
      // updatePowerUps already short-circuits the magnet+collision branches when
      // !playerAlive, so it's safe to tick during respawn.
      updatePowerUps();
      updateFloatTexts();
      updateItemBursts();
      if (game.respawnTimer <= 0) {
        game.playerAlive = true;
        game.playerX = BASE_W / 2;
        game.invincibleTimer = 120; // ~2s of post-respawn iframes
        game.state = game.pausedState === STATE.BOSS_STAGE ? STATE.BOSS_STAGE : STATE.PLAYING;
        // RESPAWN CINEMATIC — visual rebirth at player position: cyan ring
        // shockwave + 10 radial sparks + brief flash. Marks the return moment.
        game.shockwaves.push({
          x: game.playerX, y: game.playerY,
          life: 0, maxLife: 26, maxR: 30, color: '#0ff'
        });
        for (let k = 0; k < 10; k++) {
          const a = (k / 10) * Math.PI * 2;
          game.itemBursts.push({
            x: game.playerX + Math.cos(a) * 14,
            y: game.playerY + Math.sin(a) * 14,
            life: -k, color: '#0ff'
          });
        }
        game.flashTimer = Math.max(game.flashTimer || 0, 10);
        game.flashColor = '#0cf';
        playSound('powerUp');
      }
      break;

    case STATE.GAME_OVER: {
      game.gameOverTimer--;
      updateExplosions();
      // Score tick during count-up window (frames 30-90 of the entrance)
      const elapsedGo = 180 - game.gameOverTimer;
      if (game.score > 0 && elapsedGo >= 30 && elapsedGo <= 90 && elapsedGo % 6 === 0) {
        playSound('tick');
      }
      // Grade reveal sound — fires once when the grade letter first appears (elapsed > 145)
      if (elapsedGo === 145 && !game.gradeCueFired) {
        game.gradeCueFired = true;
        const sStat = game.stats || {};
        const accLocal = sStat.shotsFired === 0 ? 0 : Math.round((sStat.shotsHit / sStat.shotsFired) * 100);
        const tot = Math.min(1, (game.score || 0) / 100000) * 0.5
                  + (accLocal / 100) * 0.3
                  + Math.min(1, (sStat.maxStage || 1) / 30) * 0.2;
        if      (tot >= 0.85) { playSound('extraLife'); setTimeout(() => playSound('dualFighter'), 220); rumble(280, 0.7, 0.4); }
        else if (tot >= 0.70) { playSound('comboStep'); setTimeout(() => playSound('powerUp'), 160); }
        else if (tot >= 0.55) { playSound('powerUp'); }
        else                   { playSound('tick'); }
      }
      // Arm auto-restart timer when controls become active (timer == 0). Cancel by setting -1.
      if (game.gameOverTimer === 0 && game.autoRestartTimer < 0) {
        game.autoRestartTimer = 480; // 8 seconds
      }
      if (game.autoRestartTimer > 0) {
        game.autoRestartTimer--;
        if (game.autoRestartTimer === 0) {
          // Auto-trigger same-mode retry
          resetGame();
          game.state = STATE.STAGE_INTRO;
          game.stageTimer = 120;
          playSound('stageStart');
          triggerTransitionFade();
        }
      }
      break;
    }

    case STATE.PAUSED:
      break;
  }
}

// --- Draw functions ---
function drawRetroText(text, x, y, size, color, align) {
  ctx.save();
  ctx.font = `bold ${size}px monospace`;
  ctx.fillStyle = color || '#fff';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
  ctx.restore();
}

function draw() {
  ctx.save();
  // Camera zoom pulse on big kills — eases up and back over its lifetime.
  // Timer ticks in update() so it stays correct across refresh rates and PAUSED.
  let camZoom = 1;
  if (game && game.zoomPulse > 0) {
    const tt = game.zoomPulse / 14;
    camZoom = 1 + 0.05 * Math.sin(tt * Math.PI);
  }
  // High-combo sustained zoom — combo 60+ holds a subtle 1.02× zoom for tension
  if (game && game.combo >= 60) {
    camZoom *= 1.02 + 0.005 * Math.sin(game.animFrame * 0.12);
  }
  // Subtle screen rotation while spiral entry is in progress
  let camRot = 0;
  if (game && game.entrySpiral && game.enemies && game.enemies.some(e => e.alive && e.state === 'entering' && e.spiralEntry)) {
    camRot = Math.sin(game.animFrame * 0.06) * 0.05; // ~3° peak
  }
  // Camera nudge — directional offset that decays in update() (read-only here)
  let nudgeX = 0, nudgeY = 0;
  if (game) {
    nudgeX = game.camNudgeX || 0;
    nudgeY = game.camNudgeY || 0;
  }
  if (camZoom !== 1 || camRot !== 0 || nudgeX || nudgeY) {
    const cx = BASE_W * SCALE / 2, cy = BASE_H * SCALE / 2;
    ctx.translate(cx + nudgeX * SCALE, cy + nudgeY * SCALE);
    ctx.rotate(camRot);
    ctx.scale(SCALE * camZoom, SCALE * camZoom);
    ctx.translate(-BASE_W / 2, -BASE_H / 2);
  } else {
    ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  }
  ctx.clearRect(-50, -50, BASE_W + 100, BASE_H + 100);

  // Background — base black, then optional tier tint + nebula
  ctx.fillStyle = '#000';
  ctx.fillRect(-50, -50, BASE_W + 100, BASE_H + 100);
  drawStageTierBackground();

  // Background nebula clouds — sit between the void and the star field for added depth.
  drawNebulae();
  // BIOME — region-specific environment (planet horizon, asteroid field, gas giant,
  // black hole). Layered ABOVE nebula so it reads as foreground geography, BELOW stars
  // so the starfield still twinkles through. Stage-tier driven, see biomeForStage.
  drawBiome();
  // DRIFT EMBERS — at stage 50+, slow upward red/orange particles drift across
  // screen to amplify the deep-territory pressure. Deterministic positions
  // derived from animFrame so they self-reset cleanly on state change.
  if ((game.stage || 0) >= 50
      && game.state !== STATE.PAUSED && game.state !== STATE.TITLE && game.state !== STATE.GAME_OVER) {
    const _emT = game.animFrame;
    ctx.save();
    for (let _ei = 0; _ei < 5; _ei++) {
      const _ex = ((_ei * 53 + _emT * 0.05) % BASE_W);
      const _ey = (BASE_H - ((_ei * 71 + _emT * 0.25) % (BASE_H + 20)));
      ctx.globalAlpha = 0.30 + 0.15 * Math.sin((_emT + _ei * 17) * 0.04);
      ctx.fillStyle = _ei % 2 === 0 ? '#f80' : '#f44';
      ctx.fillRect(Math.round(_ex), Math.round(_ey), 1, 1);
    }
    ctx.restore();
  }
  // AMBIENT EVENTS — narrative one-shots (cargo ship traversal, supernova flash).
  // Drawn after biome but before aurora/stars so engine glow / silhouette read clearly.
  drawAmbientEvent();
  // Aurora streaks — only during BOSS_STAGE for added drama.
  // Three horizontal sine-bands of color, each phase-offset, slowly drifting.
  if (game.state === STATE.BOSS_STAGE) {
    const t = game.animFrame;
    const auroraCols = ['#48f', '#8af', '#a8f'];
    ctx.save();
    for (let band = 0; band < 3; band++) {
      ctx.globalAlpha = 0.08 + 0.04 * Math.sin(t * 0.025 + band * 1.7);
      ctx.fillStyle = auroraCols[band];
      const yBase = 18 + band * 9;
      for (let x = 0; x < BASE_W; x += 2) {
        const wave = Math.sin(x * 0.05 + t * 0.04 + band * 1.3) * 5;
        const h = 6 + 3 * Math.sin(x * 0.07 - t * 0.03 + band);
        ctx.fillRect(x, yBase + wave, 2, h);
      }
    }
    ctx.restore();
  }
  // Stars
  for (const s of stars) drawStar(s);
  // DEEP SPACE DUST — drifting motes overlay (stage 50+)
  drawDustMotes();
  // CONSTELLATION LINES — faint star connections (stage 50+, occasional)
  drawConstellation();
  for (const ss of game.shootingStars) drawShootingStar(ss);

  // Apply screen shake
  ctx.translate(game.shakeX, game.shakeY);

  switch(game.state) {
    case STATE.TITLE:
      if (introCinematic) drawIntroCinematic();
      else drawTitleScreen();
      break;
    case STATE.STAGE_INTRO:
      drawStageIntro();
      break;
    case STATE.PLAYING:
    case STATE.CHALLENGING:
    case STATE.CAPTURED:
    case STATE.RESPAWN:
      drawGameplay();
      break;
    case STATE.BOSS_STAGE:
      drawBossStage();
      break;
    case STATE.BONUS_GAME:
      drawBonusGame();
      break;
    case STATE.GAME_OVER:
      drawGameplay();
      drawGameOverScreen();
      break;
    case STATE.PAUSED:
      drawGameplay();
      if (game.helpOverlay) drawHelpOverlay();
      else if (game.statsOverlay) drawStatsOverlay();
      else drawPauseScreen();
      break;
  }
  if (game.state === STATE.TITLE && game.helpOverlay) drawHelpOverlay();
  if (game.state === STATE.TITLE && game.statsOverlay) drawStatsOverlay();

  // WITCH TIME edge glow — pulsing white border during the slow window so the player knows
  // they're in the dodge window. Drawn before stage-50 pulse so it overlays on top.
  if ((game.witchTimer || 0) > 0) {
    ctx.save();
    const ratio = game.witchTimer / WITCH_WINDOW;
    ctx.globalAlpha = 0.45 + 0.35 * ratio;
    ctx.fillStyle = '#fff';
    const w = 4;
    ctx.fillRect(-10, -10, BASE_W + 20, w);
    ctx.fillRect(-10, BASE_H - w, BASE_W + 20, w + 10);
    ctx.fillRect(-10, -10, w, BASE_H + 20);
    ctx.fillRect(BASE_W - w, -10, w + 10, BASE_H + 20);
    // Subtle inner desaturation tint for the slow-mo "vision" feel
    ctx.globalAlpha = 0.10 * ratio;
    ctx.fillStyle = '#48f';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
    ctx.restore();
  }
  // BOSS PHASE 2 ARENA AURA — red edge pulse while any boss is in phase 2 (enrage).
  // Adds visual urgency to the audio (bossEnrage BGM + pitch shift + taunts) so
  // the player feels the encounter escalating from all sides.
  if (game.state === STATE.BOSS_STAGE && (game.megaBosses || []).some(mb => mb.alive && mb.phase2)) {
    ctx.save();
    const enragePulse = 0.5 + 0.5 * Math.sin(game.animFrame * 0.18);
    ctx.globalAlpha = 0.18 + 0.10 * enragePulse;
    ctx.fillStyle = '#f44';
    // Thicker bands than legendary stage pulse so it dominates the frame
    ctx.fillRect(-10, -10, BASE_W + 20, 5);
    ctx.fillRect(-10, BASE_H - 5, BASE_W + 20, 15);
    ctx.fillRect(-10, -10, 5, BASE_H + 20);
    ctx.fillRect(BASE_W - 5, -10, 15, BASE_H + 20);
    // Inner halo at corners (extra-strong tension)
    ctx.globalAlpha = 0.10 + 0.06 * enragePulse;
    ctx.fillStyle = '#f88';
    ctx.fillRect(0, 0, 16, 16);
    ctx.fillRect(BASE_W - 16, 0, 16, 16);
    ctx.fillRect(0, BASE_H - 16, 16, 16);
    ctx.fillRect(BASE_W - 16, BASE_H - 16, 16, 16);
    ctx.restore();
  }
  // Stage 50+ — golden persistent edge pulse (legendary territory)
  if (game.stage >= 50 && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    ctx.save();
    const p = 0.6 + 0.4 * Math.sin(game.animFrame * 0.1);
    ctx.globalAlpha = 0.15 * p;
    ctx.fillStyle = '#fc4';
    ctx.fillRect(-10, -10, BASE_W + 20, 3);
    ctx.fillRect(-10, BASE_H - 3, BASE_W + 20, 13);
    ctx.fillRect(-10, -10, 3, BASE_H + 20);
    ctx.fillRect(BASE_W - 3, -10, 13, BASE_H + 20);
    ctx.restore();
  }
  // High-combo edge glow — frames border with combo-tier color when combo >= 30
  if (game.combo >= 30 && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    const tierCol = game.combo >= 60 ? '#f6f' : game.combo >= 45 ? '#f80' : '#ff4';
    ctx.save();
    const pulse = 0.55 + 0.35 * Math.sin(game.animFrame * 0.22);
    ctx.globalAlpha = pulse * 0.35;
    ctx.fillStyle = tierCol;
    // Top + bottom + left + right thick borders
    ctx.fillRect(-10, -10, BASE_W + 20, 4);
    ctx.fillRect(-10, BASE_H - 4, BASE_W + 20, 14);
    ctx.fillRect(-10, -10, 4, BASE_H + 20);
    ctx.fillRect(BASE_W - 4, -10, 14, BASE_H + 20);
    // Softer second band
    ctx.globalAlpha = pulse * 0.18;
    ctx.fillRect(-10, 4, BASE_W + 20, 4);
    ctx.fillRect(-10, BASE_H - 8, BASE_W + 20, 4);
    ctx.fillRect(4, -10, 4, BASE_H + 20);
    ctx.fillRect(BASE_W - 8, -10, 4, BASE_H + 20);
    ctx.restore();
  }

  // Slow-time cyan tint (subtle, full-screen) + radial vignette
  if ((game.slowTimer || 0) > 0) {
    ctx.save();
    const fade = Math.min(1, game.slowTimer / 30); // fade out in last 0.5s
    ctx.globalAlpha = 0.18 * fade + 0.06 * Math.sin(game.animFrame * 0.18);
    ctx.fillStyle = '#0cf';
    ctx.fillRect(-20, -20, BASE_W + 40, BASE_H + 40);
    // Edge ripples
    ctx.globalAlpha = 0.10 * fade;
    ctx.fillStyle = '#0ff';
    ctx.fillRect(-20, -20, BASE_W + 40, 8);
    ctx.fillRect(-20, BASE_H - 8, BASE_W + 40, 28);
    ctx.restore();
  }

  // Screen flash overlay (drawn last, before transform restore so shake stays applied)
  if (game.flashTimer > 0) {
    ctx.save();
    ctx.globalAlpha = game.flashTimer / 8 * 0.7;
    ctx.fillStyle = game.flashColor;
    ctx.fillRect(-20, -20, BASE_W + 40, BASE_H + 40);
    ctx.restore();
  }

  // Universal fade-from-black on major transitions
  if (transitionFade > 0) {
    ctx.save();
    ctx.globalAlpha = transitionFade / 30;
    ctx.fillStyle = '#000';
    ctx.fillRect(-20, -20, BASE_W + 40, BASE_H + 40);
    ctx.restore();
    transitionFade--;
  }

  // WORLD CORRUPTION — late-stage atmospheric "deep territory" effect. Scales 0..1
  // by stage: stage 30 = 0.1, 50 = 0.4, 70 = 0.8, 80+ = 1.0. Visualizes the narrative
  // beats from TRANSMISSION_LOGS ("the enemy knows you", "no maps past this point").
  // ONLY applied during gameplay states — TITLE/PAUSED stay clean for readability.
  // Effects layered (intensity-gated) so low corruption is barely perceptible:
  //   - edge noise (always when level > 0): random pixel grit at screen edges
  //   - color edge tint (level > 0.2): faint red/cyan bleed at left/right
  //   - glitch bars (level > 0.4): rare horizontal scanline displacement (1s every ~6s)
  //   - star jitter handled in drawStar (stage-aware) — not added here to keep this
  //     function self-contained and toggleable in one place.
  if (game.state !== STATE.PAUSED && game.state !== STATE.TITLE && game.state !== STATE.GAME_OVER) {
    let corr = 0;
    if (game.stage >= 80)      corr = 1.0;
    else if (game.stage >= 70) corr = 0.8;
    else if (game.stage >= 60) corr = 0.65;
    else if (game.stage >= 50) corr = 0.45;
    else if (game.stage >= 40) corr = 0.25;
    else if (game.stage >= 30) corr = 0.10;
    if (corr > 0) {
      ctx.save();
      const t = game.animFrame;
      // LAST LIFE HEARTBEAT — when lives === 1 in active gameplay, paint thin red
  // top/bottom band synced to ~80bpm pulse. Reinforces existing dangerLives cue.
  if (game.lives === 1
      && (game.state === STATE.PLAYING || game.state === STATE.CHALLENGING || game.state === STATE.BOSS_STAGE)) {
    // 80bpm = 1.33 beats/sec at 60fps = 45 frames/beat; double-beat pattern
    const _hbT = (game.animFrame % 45) / 45;
    const _hbA = Math.max(0, 0.18 * (1 - Math.abs(_hbT - 0.15)) - 0.04
                       + Math.max(0, 0.12 * (1 - Math.abs(_hbT - 0.35))));
    if (_hbA > 0) {
      ctx.save();
      ctx.globalAlpha = _hbA;
      ctx.fillStyle = '#f44';
      ctx.fillRect(0, 0, BASE_W, 2);
      ctx.fillRect(0, BASE_H - 2, BASE_W, 2);
      ctx.restore();
    }
  }
  // BOSS LOW HP SCREEN PULSE — when any alive boss is under 25% HP, paint
  // pulsing red edge bars to amplify decisive-blow tension.
  if (game.state === STATE.BOSS_STAGE && game.megaBosses
      && game.megaBosses.some(mb => mb.alive && mb.maxHp && mb.hp / mb.maxHp < 0.25)) {
    const _bpA = 0.18 + 0.18 * Math.sin(game.animFrame * 0.22);
    ctx.save();
    ctx.globalAlpha = _bpA;
    ctx.fillStyle = '#f44';
    ctx.fillRect(0, 0, BASE_W, 3);
    ctx.fillRect(0, BASE_H - 3, BASE_W, 3);
    ctx.fillRect(0, 0, 3, BASE_H);
    ctx.fillRect(BASE_W - 3, 0, 3, BASE_H);
    ctx.restore();
  }
  // STAGE TIER DARK VIGNETTE — soft black edge gradient. Strength scales
      // with corruption. Adds oppression beyond colored noise.
      ctx.globalAlpha = corr * 0.30;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, 6, BASE_H);
      ctx.fillRect(BASE_W - 6, 0, 6, BASE_H);
      ctx.globalAlpha = corr * 0.18;
      ctx.fillRect(0, 0, BASE_W, 6);
      ctx.fillRect(0, BASE_H - 6, BASE_W, 6);
      // Edge noise — random corrupted pixels at screen edges. Density scales with corr.
      const noiseCount = Math.floor(corr * 30);
      ctx.globalAlpha = 0.45;
      for (let i = 0; i < noiseCount; i++) {
        const onLeft = Math.random() < 0.5;
        const x = onLeft ? Math.random() * 12 : BASE_W - Math.random() * 12;
        const y = Math.random() * BASE_H;
        ctx.fillStyle = (Math.random() < 0.5) ? '#f44' : '#0cf';
        ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
      }
      // Edge color bleed — RGB-split-style hint at vertical edges
      if (corr > 0.2) {
        ctx.globalAlpha = 0.04 + corr * 0.06;
        ctx.fillStyle = '#f22';
        ctx.fillRect(0, 0, 4, BASE_H);
        ctx.fillStyle = '#0cf';
        ctx.fillRect(BASE_W - 4, 0, 4, BASE_H);
      }
      // Glitch bars — rare horizontal displacement effect. Trigger every ~6s for ~1s.
      if (corr > 0.4) {
        const cycleLen = Math.max(180, Math.floor(360 - corr * 240));
        const cycleProg = t % cycleLen;
        const isGlitching = cycleProg < 60;
        if (isGlitching) {
          const intensity = 1 - cycleProg / 60;
          ctx.globalAlpha = 0.35 * intensity;
          // Pseudo-random bars based on cycle phase so the same glitch holds for a few frames
          const seed = Math.floor(t / cycleLen);
          const barCount = Math.floor(corr * 4);
          for (let b = 0; b < barCount; b++) {
            const yPos = ((seed * 73 + b * 137) % BASE_H);
            const h = 1 + ((seed * 31 + b * 17) % 3);
            ctx.fillStyle = (b & 1) ? '#fff' : '#000';
            ctx.fillRect(0, yPos, BASE_W, h);
          }
        }
      }
      // Subtle pulse vignette at very high corruption — dims corners with red-shift.
      if (corr > 0.7) {
        ctx.globalAlpha = (corr - 0.7) * 0.3 * (0.5 + 0.5 * Math.sin(t * 0.04));
        ctx.fillStyle = '#400';
        ctx.fillRect(0, 0, BASE_W, 6);
        ctx.fillRect(0, BASE_H - 6, BASE_W, 6);
      }
      // CORRUPTION DEEP PULSE — at corr > 0.5, periodic violet vignette pulse
      // (every ~5 sec, 18-frame fade). Adds 'something is here' atmospheric
      // pressure beyond static edge effects.
      if (corr > 0.5) {
        const _dpCyc = 300; // ~5s at 60fps
        const _dpPos = t % _dpCyc;
        if (_dpPos < 18) {
          const _dpA = (1 - _dpPos / 18) * (corr - 0.5) * 0.45;
          ctx.globalAlpha = _dpA;
          ctx.fillStyle = '#618';
          ctx.fillRect(0, 0, BASE_W, BASE_H);
        }
      }
      // OVERSCAN GLITCH — 1-2 frame horizontal "vsync drop" white line at random
      // y, briefly. Fires ~once every 2-4 seconds at stage 70+, more often near 80.
      // Pure aesthetic noise — sells the "deep instability" tone of the late game.
      if (corr > 0.6) {
        const cyc = Math.max(120, Math.floor(240 - corr * 120));
        if (t % cyc < 2) {
          // Use cycle index as deterministic position for a stable 2-frame line
          const cycIdx = Math.floor(t / cyc);
          const yLine = (cycIdx * 53 + 17) % BASE_H;
          ctx.globalAlpha = 0.55;
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, yLine, BASE_W, 1);
          ctx.globalAlpha = 0.35;
          ctx.fillRect(0, yLine + 1, BASE_W, 1);
        }
      }
      ctx.restore();
    }
  }
  // BIG COMBO LOST vignette — gray screen-edge fade when a 10+ combo breaks. Reads
  // as visual weight to the loss. Falls under scanline overlay so it doesn't
  // permanently darken the playfield.
  if ((game.comboLostVignette || 0) > 0) {
    const v = game.comboLostVignette;
    const vRatio = v / 60;
    ctx.save();
    ctx.globalAlpha = 0.45 * vRatio;
    ctx.fillStyle = '#222';
    // Top + bottom bands fade in
    ctx.fillRect(0, 0, BASE_W, 18);
    ctx.fillRect(0, BASE_H - 18, BASE_W, 18);
    // Side bands
    ctx.fillRect(0, 0, 12, BASE_H);
    ctx.fillRect(BASE_W - 12, 0, 12, BASE_H);
    // Inner subtle wash
    ctx.globalAlpha = 0.12 * vRatio;
    ctx.fillRect(0, 0, BASE_W, BASE_H);
    ctx.restore();
  }
  // WEAPON ACTIVATION CALLOUT — pulsing screen-edge color band that fades over
  // ~0.6s when a timed weapon activates (pickup or combo arsenal). Cleaner than a
  // full-screen flash; reads as "FX armed" without obscuring the playfield.
  if ((game.weaponCalloutLife || 0) > 0) {
    const ratio = game.weaponCalloutLife / (game.weaponCalloutMax || 36);
    ctx.save();
    ctx.globalAlpha = 0.55 * ratio;
    ctx.fillStyle = game.weaponCalloutCol || '#fff';
    // 6px border, four sides
    ctx.fillRect(0, 0, BASE_W, 6);
    ctx.fillRect(0, BASE_H - 6, BASE_W, 6);
    ctx.fillRect(0, 0, 6, BASE_H);
    ctx.fillRect(BASE_W - 6, 0, 6, BASE_H);
    // Inner halo (faint, larger fade)
