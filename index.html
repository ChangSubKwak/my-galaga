  game.activeSynergy = synergy;
  let speed = BULLET_SPEED * (1 + 0.25 * (game.lvl.S - 1));
  if (synergy === 'BLINK') speed *= 1.3;
  // PERK 'firebrand' — +30% bullet speed (stacks with BLINK if both active)
  if (game.activePerk === 'firebrand') speed *= 1.3;
  // PERK 'heavyRound' — +1 bullet damage. Stacks with P level and ship dmgBonus.
  let dmg = game.lvl.P + (ship.dmgBonus || 0) + (game.activePerk === 'heavyRound' ? 1 : 0);
  if (synergy === 'OVERLOAD') dmg += 1;
  else if (synergy === 'HEAVY') dmg += 2;
  // PERK 'lastStand' — at 1 life, deal +2 damage. Rewards risky play.
  if (game.activePerk === 'lastStand' && game.lives === 1) dmg += 2;
  const maxBullets = ship.bulletCap * n * (game.dualFighter ? 2 : 1);
  // Per-frame fire-rate cap (~10 shots/sec). Replaces the old `keys[' '] = false`
  // debounce, which broke touch-fire-hold (touch has no auto-repeat to re-set the key).
  if (game.fireCooldown > 0) game.fireCooldown--;
  if (keys[' '] && game.bullets.length < maxBullets && game.fireCooldown === 0) {
    // RAPID — halved cooldown while active (6 → 3 frames = ~20 shots/sec)
    // Base cooldown: 6 frames; RAPID halves it; RAPID FIRE mutation 1.7× shaves a frame
    // from each tier. Min 2 frames so we don't end up at 0 (infinite shots/frame).
    let cd = (game.rapidTimer || 0) > 0 ? 3 : 6;
    if (game.stageMutation && game.stageMutation.id === 'rapidFire') cd = Math.max(2, Math.floor(cd / 1.7));
    // PERK 'fastFingers' — additional 25% reduction. Stacks multiplicatively with rapid/mutation.
    if (game.activePerk === 'fastFingers') cd = Math.max(2, Math.floor(cd * 0.75));
    // SYNERGY 'OVERLOAD' (S5+N3+P3) — fire cd ×0.6. Min 2 floor preserved.
    if (synergy === 'OVERLOAD') cd = Math.max(2, Math.floor(cd * 0.6));
    game.fireCooldown = cd;
    const wave = (game.waveTimer || 0) > 0;
    const homing = (game.homingTimer || 0) > 0;
    const laser = (game.laserTimer || 0) > 0;
    const offsets = n === 1 ? [0] : n === 2 ? [-4, 4] : [-6, 0, 6];
    const pods = game.dualFighter ? [game.playerX - 8, game.playerX + 8] : [game.playerX];
    let _critFiredThisShot = false;
    for (const cx of pods) {
      for (const ox of offsets) {
        const bx = cx + ox;
        // WAVE bullets carry their spawn position so updateBullets can compute the sine offset.
        // HOMING bullets need vx (initially 0) to steer.
        // LASER bullets pierce — track which enemies they've already hit so a single beam
        // doesn't double-damage the same target. Priority: laser > homing > wave (only one
        // kind active at a time, since they all use bullet.kind).
        const b = {x: bx, y: game.playerY - 8, vy: -speed * (laser ? 1.4 : 1), dmg: dmg + (laser ? 1 : 0), lvl: game.lvl.P};
        if (laser) { b.kind = 'laser'; b.pierced = new Set(); }
        else if (homing) { b.kind = 'homing'; b.vx = 0; }
        else if (wave) { b.kind = 'wave'; b.spawnX = bx; b.spawnFrame = game.animFrame; }
        // CRITICAL HIT — 4% chance bullet is a crit (+50% damage, gold visual).
        // Skipped for laser (already strong) to keep balance proportional.
        if (!laser && Math.random() < 0.04) {
          b.crit = true;
          b.dmg = Math.max(b.dmg + 1, Math.round(b.dmg * 1.5));
          _critFiredThisShot = true;
        }
        game.bullets.push(b);
        game.stats.shotsFired++;
        game.stageShotsFired++;
        // SHOTS FIRED MILESTONES — small gray banner at 100/500/1000/2000 to
        // surface long-run sustainment. One-shot via === check.
        const _sf = game.stats.shotsFired;
        if (_sf === 100 || _sf === 500 || _sf === 1000 || _sf === 2000) {
          game.floatTexts.push({
            x: BASE_W/2, y: BASE_H/2 + 30,
            text: 'SHOTS ' + _sf,
            color: '#888', life: 40, maxLife: 40, size: 5
          });
        }
        // MARKSMAN MILESTONE — once per run, when 50+ shots fired AND accuracy
        // >= 90%, surface banner. Skill recognition without score inflation.
        if (!game._marksmanFired && game.stats.shotsFired >= 50) {
          const _accPct = (game.stats.shotsHit / game.stats.shotsFired) * 100;
          if (_accPct >= 90) {
            game._marksmanFired = true;
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 - 40, text: 'MARKSMAN',
              color: '#0ff', life: 80, maxLife: 80, size: 10
            });
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 - 28, text: '90%+ ACCURACY',
              color: '#cce', life: 80, maxLife: 80, size: 5
            });
            if (typeof playSound === 'function') playSound('milestone');
            if (typeof spawnConfetti === 'function') spawnConfetti(8);
          }
        }
        // Muzzle flash particle (6-frame fade) at gun barrel
        game.muzzleFlashes = game.muzzleFlashes || [];
        // MUZZLE COLOR BY KIND — override ship color with active weapon mode
        // so the flash matches the bullet that just exits. Laser=pink, homing=
        // green, wave=cyan, rapid=gold. Falls back to ship color otherwise.
        const _muzzleCol = laser ? '#f6c'
                         : homing ? '#0f8'
                         : wave ? '#6cf'
                         : ((game.rapidTimer || 0) > 0 ? '#fc4' : ship.color);
        game.muzzleFlashes.push({
          x: cx + ox, y: game.playerY - 6, life: 0,
          color: _muzzleCol,
          big: !!b.crit
        });
      }
    }
    playSound('shoot');
    // CRIT FIRE AUDIO CUE — single 'tick' ping when at least one crit bullet
    // was fired this shot. Caps to once-per-shot regardless of pods × offsets
    // to avoid SFX stacking at multi-pod fire.
    if (_critFiredThisShot) playSound('tick');
  }
}

function updateBullets() {
  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const b = game.bullets[i];
    if (b.kind === 'homing') {
      // Steer toward the nearest live enemy. Lerp into target heading at fixed turn rate.
      // Filter out targets BEHIND the bullet (y > bullet.y + slack) — without this, a homing
      // bullet that locks on a low-flying diver curves DOWN past the player, missing entirely.
      // Also re-normalize velocity each frame so repeated lerps don't drift the bullet's speed.
      let nx = 0, ny = 0, found = false, bestD = 1e9, tgtX = 0, tgtY = 0;
      const consider = (e) => {
        if (e.y > b.y + 16) return;
        const dx = e.x - b.x, dy = e.y - b.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < bestD) { bestD = d2; nx = dx; ny = dy; found = true; tgtX = e.x; tgtY = e.y; }
      };
      for (const en of (game.enemies || [])) if (en.alive) consider(en);
      for (const mb of (game.megaBosses || [])) if (mb.alive) consider(mb);
      if (game.state === STATE.CHALLENGING) {
        const cw = (game.challengeWaves && game.challengeWaves[game.challengeWaveIdx]) || [];
        for (const en of cw) if (en.alive) consider(en);
      }
      // HOMING TARGET LINE — stamp current lock position for draw-side rendering
      if (found) { b.tgtX = tgtX; b.tgtY = tgtY; }
      else { b.tgtX = null; b.tgtY = null; }
      const sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy) || 5;
      if (found) {
        const d = Math.sqrt(bestD) || 1;
        const tvx = (nx / d) * sp, tvy = (ny / d) * sp;
        const turn = 0.18;
        b.vx = b.vx + (tvx - b.vx) * turn;
        b.vy = b.vy + (tvy - b.vy) * turn;
        const cur = Math.sqrt(b.vx * b.vx + b.vy * b.vy) || 1;
        const k = sp / cur;
        b.vx *= k;
        b.vy *= k;
      }
      b.x += b.vx;
      b.y += b.vy;
      // HOMING TRAIL — record up to 5 prev positions for path visualization
      if (!b.trail) b.trail = [];
      b.trail.unshift({ x: b.x, y: b.y });
      if (b.trail.length > 5) b.trail.length = 5;
    } else {
      b.y += b.vy;
      if (b.kind === 'wave') {
        const elapsed = game.animFrame - (b.spawnFrame || 0);
        b.x = (b.spawnX || b.x) + Math.sin(elapsed * 0.28) * 7;
        // WAVE BULLET TRAIL — record last 5 positions for zigzag visualization
        if (!b.trail) b.trail = [];
        b.trail.unshift({ x: b.x, y: b.y });
        if (b.trail.length > 5) b.trail.length = 5;
      }
    }
    if (b.y < -5 || b.y > BASE_H + 5 || b.x < -5 || b.x > BASE_W + 5) {
      // LASER PIERCE COUNT — when a laser bullet exits, if it pierced 3+
      // enemies, emit a magenta "PIERCE xN" text at its final position.
      if (b.kind === 'laser' && b.pierced && b.pierced.size >= 3) {
        game.floatTexts.push({
          x: b.x, y: Math.max(20, b.y),
          text: 'PIERCE x' + b.pierced.size,
          color: '#f6c', life: 50, maxLife: 50, size: 8
        });
        game.laserPierceBest = Math.max(game.laserPierceBest || 0, b.pierced.size);
      }
      game.bullets.splice(i, 1);
    }
  }
  // Slow factor priority: witch (0.2) > T pickup (0.4) > LAST STAND (0.65) > SLOW BULLETS mutation (0.7) > none (1).
  const witchActive = (game.witchTimer || 0) > 0;
  const slowMutation = game.stageMutation && game.stageMutation.id === 'slowBullets';
  // LAST STAND — 1 enemy left in PLAYING formation = brief cinematic slow on enemy bullets.
  const lastStandActive = game.state === STATE.PLAYING && game.allEntered
    && game.enemies && game.enemies.filter(e => e.alive).length === 1;
  const slowMul = witchActive ? 0.2
                : ((game.slowTimer || 0) > 0 ? 0.4
                : (lastStandActive ? 0.65
                : (slowMutation ? 0.7 : 1)));
  // Track peak bullet density for BARRAGE achievement
  if (game.enemyBullets.length >= 30) unlockAchievement('barrage');
  for (let i = game.enemyBullets.length - 1; i >= 0; i--) {
    const b = game.enemyBullets[i];
    b.x += b.vx * slowMul; b.y += b.vy * slowMul;
    // SPLIT SHOT — fragment a tagged bullet into a 3-fan when its split timer runs out.
    // splitAt counts down with slowMul so witch/T pickups also delay the split visually.
    if (b.splitAt && b.splitAt > 0) {
      b.splitAt -= slowMul;
      if (b.splitAt <= 0) {
        const sp = b.splitSpeed || Math.sqrt(b.vx*b.vx + b.vy*b.vy) || 1.6;
        const baseAng = Math.atan2(b.vy, b.vx);
        const fan = b.splitFan || 0.4;
        const splits = [-fan, 0, fan];
        for (const off of splits) {
          const a = baseAng + off;
          game.enemyBullets.push({
            x: b.x, y: b.y,
            vx: Math.cos(a) * sp,
            vy: Math.sin(a) * sp,
            kind: 'mega'
          });
        }
        // Original consumed when it splits — splice and skip rest of this iteration.
        game.enemyBullets.splice(i, 1);
        continue;
      }
    }
    // Graze detection: tight close-pass (7-14px) on a bullet that's also moving DOWN past the player rewards +50.
    if (!b.grazed && game.playerAlive && game.invincibleTimer <= 0 && b.vy > 0) {
      const dx = Math.abs(b.x - game.playerX);
      const dy = Math.abs(b.y - game.playerY);
      if (dx < 11 && dx > 6 && dy < 9) {
        b.grazed = true;
        // Two-tier graze: only the inner band (≤8px) and mid band (9-10px) score now.
        // Wider passes (11-13px) used to grant +25, but were trivially farmable at low risk.
        let bonus, label, lcol;
        if (dx <= 8) {
          bonus = 100; label = 'CLOSE +100'; lcol = '#ff4';
          game.stageCloseCount = (game.stageCloseCount || 0) + 1;
          if (game.stageCloseCount === 10) unlockAchievement('closeCall');
        }
        else { bonus = 50; label = 'GRAZE +50'; lcol = '#0ff'; }
        // PERK 'ghostWake' — graze score 3×, label uses the multiplied number
        if (game.activePerk === 'ghostWake') {
          bonus *= 3;
          label = label.replace(/\+\d+/, '+' + bonus);
        }
        addScore(bonus);
        game.grazeCount = (game.grazeCount || 0) + 1;
        if (game.grazeCount === 50) unlockAchievement('ghostPilot');
        if (game.grazeCount === 100) unlockAchievement('phantom');
        game.floatTexts.push({
          x: b.x, y: b.y - 6, text: label,
          color: lcol, life: 28, maxLife: 28, size: 5
        });
        game.hitSparks.push({ x: b.x, y: b.y, life: 0 });
        playSound('graze');
      }
    }
    if (b.y > BASE_H + 5 || b.x < -5 || b.x > BASE_W + 5) {
      // Track bullets that left the screen without hitting — counted toward SURVIVOR achievement
      if (!b.grazed && b.vy > 0) {
        game.dodgedBullets = (game.dodgedBullets || 0) + 1;
        if (game.dodgedBullets === 1000) unlockAchievement('survivor');
      }
      game.enemyBullets.splice(i, 1);
    }
  }
  // POWERUP TIMER EXPIRY WARNING — emit a brief floatText + 'tick' when any
  // temp weapon timer crosses from 1 → 0 (or expires). Lets player know to
  // pickup again. Each timer checked independently so multiple expirations
  // surface as separate texts.
  const _expiryTimers = [
    { key: 'slowTimer',   label: 'TIME UP',   col: '#8ff' },
    { key: 'rapidTimer',  label: 'RAPID OUT', col: '#fc4' },
    { key: 'waveTimer',   label: 'WAVE OFF',  col: '#6cf' },
    { key: 'homingTimer', label: 'HOMING END',col: '#0f8' },
    { key: 'laserTimer',  label: 'LASER OFF', col: '#f6c' }
  ];
  for (const _et of _expiryTimers) {
    if ((game[_et.key] || 0) === 1 && game.playerAlive) {
      // Will decrement to 0 below — capture transition
      game.floatTexts.push({
        x: game.playerX, y: game.playerY - 14,
        text: _et.label, color: _et.col, life: 36, maxLife: 36, size: 5
      });
      if (typeof playSound === 'function') playSound('tick');
    }
  }
  if (game.slowTimer > 0) game.slowTimer--;
  if ((game.rapidTimer  || 0) > 0) game.rapidTimer--;
  if ((game.waveTimer   || 0) > 0) game.waveTimer--;
  if ((game.homingTimer || 0) > 0) game.homingTimer--;
  if ((game.laserTimer  || 0) > 0) game.laserTimer--;
}

// STAGE PERSONAL BEST — tracks fastest clear time per stage in localStorage.
// On stage clear, compares current `stageFrames` to stored PB:
//  - if no PB or new time is lower → record + show "NEW PB!" toast with delta
//  - else → silent (no nag every clear)
// Stored as { '5': 1820, '10': 3500, ... } — frames per stage.
// STAGE SCORE PERSONAL BEST — parallel system to time PB. Tracks the highest
// score *gained during* each stage (clear score - start score). Stored separately
// from time PB so the player can chase both axes (speedrun vs combo-max).
const STAGE_SCORE_PB_KEY = 'galagaStageScorePBs';
let stageScorePBs = (() => {
  try {
    const raw = localStorage.getItem(STAGE_SCORE_PB_KEY);
    const obj = raw ? JSON.parse(raw) : {};
    return (obj && typeof obj === 'object' && !Array.isArray(obj)) ? obj : {};
  } catch (e) { return {}; }
})();
function recordStageScorePB(stage, scoreGained) {
  if (!stage || scoreGained <= 0) return { isNew: false, prev: null };
  const key = String(stage);
  const prev = stageScorePBs[key];
  if (prev == null || scoreGained > prev) {
    stageScorePBs[key] = scoreGained;
    try { localStorage.setItem(STAGE_SCORE_PB_KEY, JSON.stringify(stageScorePBs)); } catch (e) {}
    return { isNew: true, prev };
  }
  return { isNew: false, prev };
}

const STAGE_PB_KEY = 'galagaStagePBs';
let stagePBs = (() => {
  try {
    const raw = localStorage.getItem(STAGE_PB_KEY);
    const obj = raw ? JSON.parse(raw) : {};
    return (obj && typeof obj === 'object' && !Array.isArray(obj)) ? obj : {};
  } catch (e) { return {}; }
})();
function recordStagePB(stage, frames) {
  if (!stage || frames <= 0) return { isNew: false, prev: null };
  const key = String(stage);
  const prev = stagePBs[key];
  if (prev == null || frames < prev) {
    stagePBs[key] = frames;
    try { localStorage.setItem(STAGE_PB_KEY, JSON.stringify(stagePBs)); } catch (e) {}
    return { isNew: true, prev };
  }
  return { isNew: false, prev };
}
function fmtFrameTime(frames) {
  // mm:ss.t (tenths) — frames at 60fps
  const totalSec = frames / 60;
  const m = Math.floor(totalSec / 60);
  const s = totalSec - m * 60;
  if (m > 0) return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1) + 's';
  return s.toFixed(1) + 's';
}

// STAGE SECONDARY OBJECTIVES — random per-stage mini-goal. Visual reward only
// (no score bonus → score inflation = 0). Picked at startStage with 40% chance
// past stage 5. Tracking re-uses existing counters so no new state plumbing needed.
// Each objective has: id, label, threshold, progress(game) function, met(game) check.
const STAGE_OBJECTIVES = [
  {
    id: 'noDeath',  label: 'CLEAR NO-DEATH',
    progress: g => g.stageDied ? 'FAILED' : 'ALIVE',
    met: g => !g.stageDied
  },
  {
    id: 'accuracy', label: 'ACCURACY 70%+',
    progress: g => {
      const shots = g.stageShotsFired || 0;
      if (shots < 10) return '(' + shots + '/10 SHOTS)';
      const acc = Math.round((g.stageShotsHit / shots) * 100);
      return acc + '%';
    },
    met: g => (g.stageShotsFired || 0) >= 10
              && Math.round((g.stageShotsHit / g.stageShotsFired) * 100) >= 70
  },
  {
    id: 'parries',  label: '5 PARRIES',
    threshold: 5,
    progress: g => Math.min(5, g._objStartParries != null
                                  ? (g.parryCount || 0) - g._objStartParries
                                  : 0) + '/5',
    met: g => g._objStartParries != null
              && ((g.parryCount || 0) - g._objStartParries) >= 5
  },
  {
    id: 'elites',   label: '3 ELITE KILLS',
    threshold: 3,
    progress: g => Math.min(3, g._objStartElites != null
                                  ? (g.eliteKills || 0) - g._objStartElites
                                  : 0) + '/3',
    met: g => g._objStartElites != null
              && ((g.eliteKills || 0) - g._objStartElites) >= 3
  },
  {
    id: 'graze',    label: '10 CLOSE PASSES',
    progress: g => Math.min(10, g.stageCloseCount || 0) + '/10',
    met: g => (g.stageCloseCount || 0) >= 10
  },
  {
    id: 'useBomb',  label: 'USE A BOMB',
    progress: g => g._objStartBombs != null
                    && ((g.stats.bombsUsed || 0) - g._objStartBombs) >= 1 ? 'DONE' : 'PENDING',
    met: g => g._objStartBombs != null
              && ((g.stats.bombsUsed || 0) - g._objStartBombs) >= 1
  },
  {
    id: 'witchSave', label: 'TRIGGER WITCH TIME',
    progress: g => g._objStartWitchSaves != null
                    && ((g.witchSaves || 0) - g._objStartWitchSaves) >= 1 ? 'DONE' : 'PENDING',
    met: g => g._objStartWitchSaves != null
              && ((g.witchSaves || 0) - g._objStartWitchSaves) >= 1
  },
  {
    id: 'combo15', label: 'COMBO 15+',
    threshold: 15,
    progress: g => Math.min(15, g.comboBest || 0) + '/15',
    met: g => (g.comboBest || 0) >= 15
  }
];
function pickStageObjective(stage) {
  if (!game) return null;
  if (stage <= 4) return null;
  if (game.challengeMode) return null; // challenge mode is its own structure
  if (Math.random() >= 0.40) return null;
  const pick = STAGE_OBJECTIVES[Math.floor(Math.random() * STAGE_OBJECTIVES.length)];
  // Snapshot run-cumulative counters so the objective measures delta-during-stage,
  // not lifetime totals (parries / eliteKills accumulate across runs).
  game._objStartParries = game.parryCount || 0;
  game._objStartElites = game.eliteKills || 0;
  // Snapshots for new objective types (bombs / witch saves / combo15)
  game._objStartBombs = (game.stats && game.stats.bombsUsed) || 0;
  game._objStartWitchSaves = game.witchSaves || 0;
  return pick;
}

// WEAPON ACTIVATION CALLOUT — dramatic screen-edge flash + bigger banner when a
// timed weapon (R/W/H/L/T) activates. Driven by a single shared timer; pickup site
// just calls triggerWeaponCallout(color). Decays in update() under the PAUSED guard.
function triggerWeaponCallout(color) {
  if (!game) return;
  game.weaponCalloutLife = 36;   // ~0.6s
  game.weaponCalloutMax  = 36;
  game.weaponCalloutCol  = color || '#fff';
}

function pickPerkOffer() {
  // Pick 3 distinct random perks from the pool. Always returns 3 since pool has 4.
  const pool = PERK_IDS.slice();
  const out = [];
  for (let i = 0; i < 3 && pool.length > 0; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    out.push(pool.splice(idx, 1)[0]);
  }
  return out;
}

const ACH_KEY = 'galagaAchievements';
let unlockedAchievements = (() => {
  try {
    const raw = localStorage.getItem(ACH_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    // Filter out orphan IDs from earlier (now-removed) achievement definitions
    // so size-based meta achievements aren't auto-granted from stale storage.
    const valid = Array.isArray(arr) ? arr.filter(id => ACHIEVEMENTS[id]) : [];
    if (Array.isArray(arr) && valid.length !== arr.length) {
      try { localStorage.setItem(ACH_KEY, JSON.stringify(valid)); } catch (e) {}
    }
    return new Set(valid);
  } catch (e) { return new Set(); }
})();

function saveAchievements() {
  try { localStorage.setItem(ACH_KEY, JSON.stringify([...unlockedAchievements])); } catch (e) {}
}

function unlockAchievement(id) {
  if (unlockedAchievements.has(id) || !ACHIEVEMENTS[id]) return;
  unlockedAchievements.add(id);
  saveAchievements();
  // Meta achievements — deferred to avoid recursion
  if (id !== 'achHunter' && unlockedAchievements.size >= 30) {
    setTimeout(() => unlockAchievement('achHunter'), 50);
  }
  if (id !== 'earlyAdopter' && unlockedAchievements.size >= 5) {
    setTimeout(() => unlockAchievement('earlyAdopter'), 25);
  }
  if (id !== 'achLegend' && unlockedAchievements.size >= 50) {
    setTimeout(() => unlockAchievement('achLegend'), 100);
  }
  if (id !== 'achGod' && unlockedAchievements.size >= Object.keys(ACHIEVEMENTS).length - 1) {
    setTimeout(() => unlockAchievement('achGod'), 150);
  }
  if (game) {
    // No score reward — the toast + achievement entry itself is the reward. Removed 500pt
    // because achievement unlocks could chain (multiple in one frame on rapid combos),
    // dumping uncapped points and adding floatText clutter on top of the toast.
    game.toasts = game.toasts || [];
    game.toasts.push({ id, life: 0, maxLife: 240 });
    // Mega celebration: expanding shockwave from screen center, golden confetti, distinctive sound chord
    if (game.shockwaves) {
      game.shockwaves.push({
        x: BASE_W/2, y: BASE_H/2 - 14,
        life: 0, maxLife: 32, maxR: 70, color: '#fc4'
      });
    }
    spawnConfetti(20);
    // Star burst — 8 streaks radiating from achievement banner area
    if (game.shootingStars) {
      const sx = BASE_W - 50, sy = 50;
      for (let k = 0; k < 8; k++) {
        const a = (k / 8) * Math.PI * 2 + Math.random() * 0.2;
        const sp = 1.5 + Math.random() * 1.2;
        game.shootingStars.push({
          x: sx, y: sy,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          life: 0, maxLife: 28 + Math.floor(Math.random() * 14)
        });
      }
    }
    playSound('extraLife');
    setTimeout(() => playSound('comboStep'), 140);
    rumble(220, 0.5, 0.3);
  }
}

const BEST_TIMES_KEY = 'galagaBestTimes';
const MILESTONE_STAGES = [5, 10, 20, 30];

function loadBestTimes() {
  try {
    const raw = localStorage.getItem(BEST_TIMES_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return {};
}

function recordMilestoneTime() {
  const justCleared = game.stage - 1;
  if (MILESTONE_STAGES.indexOf(justCleared) < 0) return;
  if (game.isDemo) return;
  // Track the highest milestone ever cleared so the player can resume from there
  if (justCleared > highestCheckpoint) {
    highestCheckpoint = justCleared;
    try { localStorage.setItem('galagaCheckpoint', String(highestCheckpoint)); } catch (e) {}
  }
  const best = loadBestTimes();
  const prev = best[justCleared];
  const cur = game.runFrames;
  if (typeof prev !== 'number' || cur < prev) {
    best[justCleared] = cur;
    try { localStorage.setItem(BEST_TIMES_KEY, JSON.stringify(best)); } catch (e) {}
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 + 50, text: 'BEST TIME!',
      color: '#ff4', life: 90, maxLife: 90, size: 9
    });
    playSound('extraLife');
  }
}

// --- Bonus mini-game (slot machine after milestone clears) ---
function tryTriggerBonusGame() {
  // Only normal mode, only after milestone-stage clears (5/10/20/30)
  if (!game || game.isDemo || game.challengeMode) return false;
  const justCleared = game.stage - 1;
  if (MILESTONE_STAGES.indexOf(justCleared) < 0) return false;
  startBonusGame();
  return true;
}
function startBonusGame() {
  // Symbols: 0=S, 1=N, 2=P, 3=T, 4=$
  game.bonusGame = {
    elapsed: 0,
    reels:    [0, 0, 0],
    stopAt:   [60, 90, 120],
    finalIdx: [Math.floor(Math.random() * 5), Math.floor(Math.random() * 5), Math.floor(Math.random() * 5)],
    locked:   [false, false, false],
    resultShown: false,
    bonus: 0,
    matchText: ''
  };
  game.state = STATE.BONUS_GAME;
  stopBGM();
}
function evalBonusResult() {
  const f = game.bonusGame.finalIdx;
  const dollarCount = f.filter(i => i === 4).length;
  let bonus = 300, text = 'WIN!';
  // 3 of a kind
  if (f[0] === f[1] && f[1] === f[2]) {
    if (f[0] === 4) { bonus = 10000; text = 'MEGA JACKPOT!'; }
    else            { bonus = 5000;  text = 'JACKPOT!'; }
  } else if (dollarCount === 2) { bonus = 2000; text = 'BIG WIN!'; }
  else if (f[0] === f[1] || f[1] === f[2] || f[0] === f[2]) { bonus = 1000; text = 'PAIR!'; }
  game.bonusGame.bonus = bonus;
  game.bonusGame.matchText = text;
  game.bonusGame.resultShown = true;
  // Track bonus wins toward BONUS KING
  if (bonus >= 1000) {
    try {
      const bw = parseInt(localStorage.getItem('galagaBonusWins') || '0', 10) + 1;
      localStorage.setItem('galagaBonusWins', String(bw));
      if (bw >= 5) unlockAchievement('bonusKing');
    } catch (e) {}
  }
  addScore(bonus);
  spawnConfetti(bonus >= 5000 ? 30 : bonus >= 1000 ? 18 : 8);
  // Result-specific cue
  if (bonus >= 10000) {
    unlockAchievement('luckySlot');
    playSound('extraLife');
    setTimeout(() => playSound('dualFighter'), 220);
    setTimeout(() => playSound('dualFighter'), 480);
    rumble(420, 0.9, 0.6);
  } else if (bonus >= 5000) {
    playSound('extraLife');
    setTimeout(() => playSound('comboStep'), 200);
    rumble(260, 0.7, 0.4);
  } else if (bonus >= 2000) {
    playSound('comboStep');
    setTimeout(() => playSound('powerUp'), 120);
    rumble(180, 0.55, 0.3);
  } else if (bonus >= 1000) {
    playSound('powerUp');
    rumble(120, 0.4, 0.2);
  } else {
    playSound('tick');
  }
}
function updateBonusGame() {
  const bg = game.bonusGame;
  if (!bg) return;
  bg.elapsed++;
  // Animate reels (each reel cycles symbol every 4 frames until its stop time)
  for (let i = 0; i < 3; i++) {
    if (bg.elapsed < bg.stopAt[i]) {
      // Reel slows toward stop — cycle interval grows from 4 to 12 in last 12 frames
      const remain = bg.stopAt[i] - bg.elapsed;
      const interval = remain < 12 ? 4 + (12 - remain) : 4;
      if (bg.elapsed % interval === 0) {
        bg.reels[i] = (bg.reels[i] + 1) % 5;
        // Faint click while spinning (only every other tick for less noise)
        if (bg.elapsed % (interval * 2) === 0 && i === 0) playSound('tick');
      }
    } else if (bg.locked[i] === false) {
      // Use === false (not !truthy) so finalIdx of 0 (S symbol) doesn't make `locked = 0`
      // re-trigger this branch every frame, spamming comboStep at 60Hz on ~49% of runs.
      bg.locked[i] = bg.finalIdx[i];
      bg.reels[i] = bg.finalIdx[i];
      playSound('comboStep');
    }
  }
  // Once all reels locked + 18 frames pass, evaluate
  if (bg.elapsed === bg.stopAt[2] + 18 && !bg.resultShown) evalBonusResult();
  // After result + ~150 frames, hand off to STAGE_INTRO and clear bonus state
  if (bg.resultShown && bg.elapsed > bg.stopAt[2] + 18 + 150) {
    game.bonusGame = null;
    game.state = STATE.STAGE_INTRO;
    game.stageTimer = 120;
    playSound('stageStart');
  }
}
const BONUS_SYMBOLS = ['S', 'N', 'P', 'T', '$'];
const BONUS_SYM_COL = ['#0ff', '#0f8', '#f6f', '#8df', '#fc4'];
function drawBonusGame() {
  // Backdrop
  ctx.fillStyle = '#001';
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  // Star sprinkle (reuse stars)
  for (const s of stars) drawStar(s);

  const bg = game.bonusGame;
  if (!bg) return;

  // Title
  const glow = 0.6 + 0.4 * Math.sin(game.animFrame * 0.1);
  ctx.save();
  ctx.shadowColor = '#fc4';
  ctx.shadowBlur = 10 * glow;
  drawRetroText('* BONUS *', BASE_W/2, 50, 16, '#fc4');
  ctx.restore();
  drawRetroText('SLOT REWARD', BASE_W/2, 70, 8, COL.cyan);

  // Reel frame
  const cy = BASE_H/2 - 6;
  const reelW = 38, gap = 6;
  const totalW = reelW * 3 + gap * 2;
  const startX = (BASE_W - totalW) / 2;
  for (let i = 0; i < 3; i++) {
    const rx = startX + i * (reelW + gap);
    // Reel background
    ctx.fillStyle = '#012';
    ctx.fillRect(rx, cy - 24, reelW, 48);
    ctx.strokeStyle = bg.locked[i] !== false ? '#fc4' : COL.cyan;
    ctx.lineWidth = 1;
    ctx.strokeRect(rx + 0.5, cy - 23.5, reelW - 1, 47);
    // Symbol — when spinning, render previous & next symbol faintly above/below for motion blur
    const sym = BONUS_SYMBOLS[bg.reels[i]];
    const col = BONUS_SYM_COL[bg.reels[i]];
    if (bg.locked[i] === false) {
      ctx.save();
      ctx.globalAlpha = 0.30;
      const prevIdx = (bg.reels[i] + 4) % 5;
      const nextIdx = (bg.reels[i] + 1) % 5;
      drawRetroText(BONUS_SYMBOLS[prevIdx], rx + reelW/2, cy - 16, 14, BONUS_SYM_COL[prevIdx]);
      drawRetroText(BONUS_SYMBOLS[nextIdx], rx + reelW/2, cy + 20, 14, BONUS_SYM_COL[nextIdx]);
      ctx.restore();
    }
    drawRetroText(sym, rx + reelW/2, cy + 2, 22, col);
    // Spinning blur indicator (cyan shimmer above/below) while not locked
    if (bg.locked[i] === false) {
      ctx.fillStyle = 'rgba(0,200,255,0.45)';
      const off = (bg.elapsed * 3) % 12;
      for (let yy = -22 + off; yy < 22; yy += 12) ctx.fillRect(rx + 2, cy + yy, reelW - 4, 1);
    }
  }

  // Result text — bonus number rolls up from 0 over the first 30 frames after reveal
  if (bg.resultShown) {
    const elapsedSinceResult = bg.elapsed - (bg.stopAt[2] + 18);
    const cT = Math.max(0, Math.min(1, elapsedSinceResult / 30));
    drawRetroText(bg.matchText, BASE_W/2, cy + 38, 14,
      bg.bonus >= 5000 ? COL.yellow : bg.bonus >= 1000 ? COL.cyan : COL.white);
    drawRetroText('+' + Math.floor(bg.bonus * cT), BASE_W/2, cy + 54, 12, COL.yellow);
  }
  // Pay table (small footer)
  drawRetroText('3 $ = 10K  3 SAME = 5K  PAIR = 1K', BASE_W/2, BASE_H - 18, 5, COL.gray);
  // Render-only — life is ticked from updateFloatTexts/updateItemBursts in the update pass.
  if (game.floatTexts) for (const ft of game.floatTexts) drawFloatText(ft);
  if (game.itemBursts) for (const ib of game.itemBursts) drawItemBurst(ib);
}

function fmtMS(frames) {
  if (typeof frames !== 'number') return '--:--';
  const s = Math.floor(frames / 60);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

// Compact score formatter: ≤999,999 stays as 6-digit padded; ≥1M switches to "1.23M". 999,999,999 → 'MAX!'.
function fmtScore(n) {
  n = n || 0;
  if (n >= 999999999) return 'MAX!';
  if (n < 1000000) return n.toString().padStart(6, '0');
  if (n < 10000000)  return (n / 1000000).toFixed(2) + 'M';
  if (n < 100000000) return (n / 1000000).toFixed(1) + 'M';
  return Math.floor(n / 1000000) + 'M';
}

// --- Cumulative lifetime stats (separate buckets per mode) ---
const CUM_STATS_KEY = 'galagaCumStats';
const CUM_STATS_KEY_CH = 'galagaCumStatsChallenge';
function cumKey(challenge) { return challenge ? CUM_STATS_KEY_CH : CUM_STATS_KEY; }
function loadCumStats(challenge) {
  try {
    const raw = localStorage.getItem(cumKey(challenge));
    if (raw) return Object.assign({
      sessions: 0, kills: 0, shotsFired: 0, shotsHit: 0,
      runFrames: 0, bestStage: 0, deaths: 0, powerUps: 0
    }, JSON.parse(raw));
  } catch (e) {}
  return { sessions: 0, kills: 0, shotsFired: 0, shotsHit: 0,
           runFrames: 0, bestStage: 0, deaths: 0, powerUps: 0 };
}
function saveCumStats(s, challenge) {
  try { localStorage.setItem(cumKey(challenge), JSON.stringify(s)); } catch (e) {}
}
function commitGameToCumStats() {
  if (!game || game.isDemo) return;
  // LAST RUN SUMMARY — save quick last-run snapshot for TITLE display.
  // Includes wasPb flag computed against cumStats BEFORE this run is committed.
  try {
    const _csNl = loadCumStats(false);
    const _csCl = loadCumStats(true);
    const _priorBest = Math.max(_csNl.bestStage || 0, _csCl.bestStage || 0);
    const _thisStage = (game.stats && game.stats.maxStage) || game.stage || 1;
    localStorage.setItem('galagaLastRun', JSON.stringify({
      stage: _thisStage,
      score: game.score || 0,
      combo: game.comboBest || 0,
      wasPb: _thisStage > _priorBest && _priorBest > 0
    }));
  } catch (e) {}
  // First commit ever — FRESH START achievement
  if ((loadCumStats(false).sessions || 0) + (loadCumStats(true).sessions || 0) === 0) {
    unlockAchievement('freshStart');
  }
  const challenge = !!game.challengeMode;
  const s = loadCumStats(challenge);
  const gs = game.stats || {};
  s.sessions   = (s.sessions   || 0) + 1;
  s.kills      = (s.kills      || 0) + (gs.kills      || 0);
  s.shotsFired = (s.shotsFired || 0) + (gs.shotsFired || 0);
  s.shotsHit   = (s.shotsHit   || 0) + (gs.shotsHit   || 0);
  s.runFrames  = (s.runFrames  || 0) + (game.runFrames || 0);
  s.bestStage  = Math.max(s.bestStage || 0, gs.maxStage || game.stage || 0);
  // PARRY STREAK BEST — track lifetime max consecutive parries across all runs
  s.parryStreakBest = Math.max(s.parryStreakBest || 0, game.parryStreakBest || 0);
  // MULTIKILL BEST — track lifetime max same-frame kills (DOUBLE/TRIPLE/OVERKILL/OCTOKILL)
  s.multiKillBest = Math.max(s.multiKillBest || 0, game.multiKillBest || 0);
  // ACE STREAK BEST — consecutive S/A grades across run
  s.aceStreakBest = Math.max(s.aceStreakBest || 0, game.aceStreakBest || 0);
  // LASER PIERCE BEST — max enemies pierced by a single laser bullet
  s.laserPierceBest = Math.max(s.laserPierceBest || 0, game.laserPierceBest || 0);
  // LIFETIME SCORE — sum of every committed run's final score (mode-scoped)
  s.scoreTotal = (s.scoreTotal || 0) + (game.score || 0);
  // DASH TOTAL — sum of every dash activated across runs
  s.dashTotal = (s.dashTotal || 0) + (game.dashCount || 0);
  // PICKUP STREAK BEST — max consecutive no-death pickups in a single run
  s.pickupStreakBest = Math.max(s.pickupStreakBest || 0, game.pickupStreakBest || 0);
  // BOSS KILLS LIFETIME — sum of all bosses defeated across runs
  s.bossKillsTotal = (s.bossKillsTotal || 0) + (game.bossesKilledThisRun || 0);
  // BOMBS USED LIFETIME — sum of B pickups detonated across runs
  s.bombsTotal = (s.bombsTotal || 0) + ((game.stats && game.stats.bombsUsed) || 0);
  // STAGES CLEARED LIFETIME — every committed run contributes (maxStage - 1)
  // since reaching stage N implies clearing N-1. Cap at 0 in case of bug.
  s.stagesClearedTotal = (s.stagesClearedTotal || 0) + Math.max(0, (gs.maxStage || game.stage || 1) - 1);
  // PERFECT WAVES LIFETIME — no-escape challenge waves across runs
  s.perfectWavesTotal = (s.perfectWavesTotal || 0) + (game.perfectWavesRun || 0);
  // LONGEST SINGLE RUN — max frames in any one run (for marathon trophy)
  s.longestRun = Math.max(s.longestRun || 0, game.runFrames || 0);
  // ALL-PERFECT STAGES LIFETIME
  s.allPerfectStagesTotal = (s.allPerfectStagesTotal || 0) + (game.allPerfectStagesRun || 0);
  // EXTRA SHIPS LIFETIME — sum of extra ship grants across runs
  s.extraShipsTotal = (s.extraShipsTotal || 0) + (game.extraShipsRun || 0);
  // OBJECTIVES MET LIFETIME — secondary objective completions across runs
  s.objectivesMetTotal = (s.objectivesMetTotal || 0) + (game.objectivesMetRun || 0);
  saveCumStats(s, challenge);
  // KILLS-BY-TYPE LIFETIME — batched write of session counts.
  try {
    if (game.killsByTypeRun) {
      const _kbtRaw = localStorage.getItem('galagaKillsByType') || '{}';
      const _kbt = JSON.parse(_kbtRaw);
      for (const _kbtT in game.killsByTypeRun) {
        _kbt[_kbtT] = (_kbt[_kbtT] || 0) + (game.killsByTypeRun[_kbtT] || 0);
      }
      localStorage.setItem('galagaKillsByType', JSON.stringify(_kbt));
    }
  } catch (e) {}
  // SHIP MASTERY — per-ship cumulative stats (kills / runs / bestStage). Separate from
  // cumStats which is mode-scoped. Lets the player see "I've killed 3,200 with Scout"
  // and "I've reached stage 28 with Bruiser" on the TITLE / PROFILE screens.
  try {
    const masteryRaw = localStorage.getItem('galagaShipMastery');
    const mastery = masteryRaw ? JSON.parse(masteryRaw) : {};
    const sid = selectedShip || 'default';
    const m = mastery[sid] || { kills: 0, runs: 0, bestStage: 0 };
    m.kills     = (m.kills || 0) + (gs.kills || 0);
    m.runs      = (m.runs  || 0) + 1;
    m.bestStage = Math.max(m.bestStage || 0, gs.maxStage || game.stage || 0);
    mastery[sid] = m;
    localStorage.setItem('galagaShipMastery', JSON.stringify(mastery));
  } catch (e) {}
  // LONG RUN: any single run reaches 10 minutes
  if ((game.runFrames || 0) >= 36000) unlockAchievement('longRun');
  // MARATHON 100: cumulative kills 100K
  const totalKills = (loadCumStats(false).kills || 0) + (loadCumStats(true).kills || 0);
  if (totalKills >= 100000) unlockAchievement('marathon100');
  // IRON MAN — total cumulative play time across both modes ≥ 30 minutes (108000 frames)
  const totalFrames = (loadCumStats(false).runFrames || 0) + (loadCumStats(true).runFrames || 0);
  if (totalFrames >= 108000) unlockAchievement('ironMan');
  // INSOMNIAC — 60+ minutes (216000 frames)
  if (totalFrames >= 216000) unlockAchievement('insomniac');
}

// --- Top scores persistence ---
const TOP_KEY = 'galagaTop5';
const TOP_KEY_CHALLENGE = 'galagaTop5Challenge';
const TOP_KEY_DAILY = 'galagaTop5Daily';

function topKeyFor(mode) {
  return mode === 'challenge' ? TOP_KEY_CHALLENGE
       : mode === 'daily'     ? TOP_KEY_DAILY
       : TOP_KEY;
}

function loadTopScores(mode) {
  const key = topKeyFor(mode);
  try {
    const raw = localStorage.getItem(key);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) {
        // Normalize: ensure callsign field exists for forward compat. Legacy entries
        // (pre-callsign) get '???' which displays distinct from real callsigns.
        for (const e of parsed) {
          if (e && typeof e.callsign !== 'string') e.callsign = '???';
        }
        return parsed;
      }
    }
  } catch (e) {}
  if (mode === 'normal') {
    // Migrate legacy single-key high score the first time we read normal mode.
    const old = parseInt(localStorage.getItem('galagaHigh') || '0');
    return old > 0 ? [{ score: old, stage: 1, accuracy: 0, date: '', callsign: '???' }] : [];
  }
  return [];
}

function saveTopScores(list, mode) {
  try { localStorage.setItem(topKeyFor(mode), JSON.stringify(list)); } catch (e) {}
}

function todayShort() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return d.getFullYear().toString().slice(2) + m + day;
}

// Returns the rank index (0-4) if entered, or -1 if didn't qualify
function submitTopScore(score, stage, accuracy) {
  if (score <= 0) return -1;
  const mode = game && game.dailyMode ? 'daily'
             : game && game.challengeMode ? 'challenge'
             : 'normal';
  const list = loadTopScores(mode);
  // Snapshot callsign at submission time so future renames don't rewrite history.
  const entry = { score, stage, accuracy, date: todayShort(), callsign: playerCallsign };
  list.push(entry);
  list.sort((a, b) => b.score - a.score);
  list.length = Math.min(list.length, 5);
  const idx = list.indexOf(entry);
  saveTopScores(list, mode);
  // Keep legacy single-key in sync (highest of any mode). Wrapped in try/catch because
  // Safari private browsing throws QuotaExceededError on every localStorage write — letting
  // it propagate would crash the entire game-over flow.
  try {
    const normTop  = (loadTopScores('normal')[0]    || {}).score || 0;
    const chalTop  = (loadTopScores('challenge')[0] || {}).score || 0;
    const dailyTop = (loadTopScores('daily')[0]     || {}).score || 0;
    localStorage.setItem('galagaHigh', String(Math.max(normTop, chalTop, dailyTop)));
  } catch (e) {}
  return idx;
}

function updatePowerUps() {
  // PERK 'magnetic' — doubles the magnet pickup range (36 → 72)
  // COMBO MAGNET BOOST — combo ≥ 30 adds +20 range, combo ≥ 60 adds +40.
  // Rewards sustained combo with easier pickup catching. Stacks with perk.
  const _baseRange = (game.activePerk === 'magnetic') ? 72 : 36;
  const _comboBoost = (game.combo >= 60) ? 40 : (game.combo >= 30) ? 20 : 0;
  const MAGNET_RANGE = _baseRange + _comboBoost;
  for (let i = game.powerUps.length - 1; i >= 0; i--) {
    const p = game.powerUps[i];
    p.y += p.vy;
    // POWER UP DROP TRAIL — spawn a tiny color spark every 8 frames in the pickup's
    // wake so falling drops are visually traceable, helping the player intercept.
    if ((game.animFrame & 7) === 0) {
      const trailCol = POWERUP_COL[p.type] || '#fff';
      game.itemBursts.push({
        x: p.x + (Math.random() - 0.5) * 2,
        y: p.y - 3,
        life: 0, color: trailCol
      });
    }
    // Magnet: when close to live player, drift toward them on x and accelerate on y
    if (game.playerAlive) {
      const dx = game.playerX - p.x;
      const dy = game.playerY - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < MAGNET_RANGE && dist > 0.5) {
        const pull = 0.6 * (1 - dist / MAGNET_RANGE);
        p.x += (dx / dist) * pull;
        p.y += (dy / dist) * pull * 0.6;
      }
    }
    if (p.y > BASE_H + 5) {
      // POWERUP MISS FLOOR SPARK — 5 horizontal sparks at floor level in pickup
      // color, signaling 'you missed that drop'. Tiny tick SFX. Encourages
      // catching future drops without penalizing the player.
      const _mCol = POWERUP_COL[p.type] || '#fff';
      for (let _k = 0; _k < 5; _k++) {
        game.itemBursts.push({
          x: p.x + (_k - 2) * 2,
          y: BASE_H - 2,
          life: -_k, color: _mCol
        });
      }
      game.missedPowerUps = (game.missedPowerUps || 0) + 1;
      game.powerUps.splice(i, 1);
      continue;
    }
    if (!game.playerAlive) continue;
    const hitW = game.dualFighter ? 16 : 7;
    if (Math.abs(p.x - game.playerX) < hitW + 4 && Math.abs(p.y - game.playerY) < 8) {
      const color = POWERUP_COL[p.type];
      // PERK 'scavenger' — timer pickups (T/R/W/H/L) last 1.5×. Applied at pickup
      // time so a non-scavenger run's timer can't be retro-extended by perk swap.
      const _scavMul = game.activePerk === 'scavenger' ? 1.5 : 1;
      // PICKUP DURATION HINT — append "+Ns" so the player sees the actual seconds
      // granted (especially valuable when scavenger perk is active for 9s timers).
      const _durSec = (dur) => '+' + (Math.round(dur * _scavMul / 60)) + 's';
      if (p.type === 'T') {
        // Timed slow-bullet effect (refresh duration on re-pickup)
        const wasActive = (game.slowTimer || 0) > 0;
        game.slowTimer = Math.round(SLOW_DURATION * _scavMul);
        game.floatTexts.push({
          x: p.x, y: p.y, text: (wasActive ? 'SLOW REFRESHED' : 'SLOW TIME!') + ' ' + _durSec(SLOW_DURATION),
          color, life: 60, maxLife: 60, size: 9
        });
        triggerWeaponCallout(color);
      } else if (p.type === 'R') {
        // RAPID — fire-cooldown halved for 6 sec (refreshes on re-pickup)
        const wasActive = (game.rapidTimer || 0) > 0;
        game.rapidTimer = Math.round(RAPID_DURATION * _scavMul);
        game.floatTexts.push({
          x: p.x, y: p.y, text: (wasActive ? 'RAPID REFRESHED' : 'RAPID FIRE!') + ' ' + _durSec(RAPID_DURATION),
          color, life: 60, maxLife: 60, size: 9
        });
        triggerWeaponCallout(color);
      } else if (p.type === 'W') {
        // WAVE — bullets zigzag for 6 sec (refreshes on re-pickup)
        const wasActive = (game.waveTimer || 0) > 0;
        game.waveTimer = Math.round(WAVE_DURATION * _scavMul);
        game.floatTexts.push({
          x: p.x, y: p.y, text: (wasActive ? 'WAVE REFRESHED' : 'WAVE SHOT!') + ' ' + _durSec(WAVE_DURATION),
          color, life: 60, maxLife: 60, size: 9
        });
        triggerWeaponCallout(color);
      } else if (p.type === 'H') {
        // HOMING — bullets steer toward nearest enemy for 6 sec
        const wasActive = (game.homingTimer || 0) > 0;
        game.homingTimer = Math.round(HOMING_DURATION * _scavMul);
        game.floatTexts.push({
          x: p.x, y: p.y, text: (wasActive ? 'HOMING REFRESHED' : 'HOMING SHOT!') + ' ' + _durSec(HOMING_DURATION),
          color, life: 60, maxLife: 60, size: 9
        });
        triggerWeaponCallout(color);
      } else if (p.type === 'L') {
        // LASER — piercing beam (1.4× speed + bonus dmg, ignores enemy on pass-through)
        // for 5 sec. Mutually exclusive with W/H — laser wins (priority in fire site).
        const wasActive = (game.laserTimer || 0) > 0;
        game.laserTimer = Math.round(LASER_DURATION * _scavMul);
        game.floatTexts.push({
          x: p.x, y: p.y, text: (wasActive ? 'LASER REFRESHED' : 'LASER!') + ' ' + _durSec(LASER_DURATION),
          color, life: 60, maxLife: 60, size: 10
        });
        triggerWeaponCallout(color);
      } else if (p.type === 'E') {
        // SHIELD — adds 1 absorb charge (max 3, stackable). Consumed in killPlayer
        // before life loss; gives 60 frames of iframes when broken.
        const wasMax = game.shieldCharges >= SHIELD_MAX;
        game.shieldCharges = Math.min(SHIELD_MAX, (game.shieldCharges || 0) + 1);
        game.floatTexts.push({
          x: p.x, y: p.y, text: wasMax ? 'SHIELD MAX' : 'SHIELD +1',
          color, life: 60, maxLife: 60, size: 9
        });
        // SHIELD GAIN CONVERGE — 12 green particles spawn at periphery and converge
        // toward the player ship. Spawned outside playfield bounds so they read as
        // arriving "from afar" to fortify the ship.
        for (let k = 0; k < 12; k++) {
          const a = (k / 12) * Math.PI * 2;
          const r = 40 + Math.random() * 16;
          game.itemBursts.push({
            x: game.playerX + Math.cos(a) * r,
            y: game.playerY + Math.sin(a) * r,
            life: -k * 2, color: '#4f8'
          });
        }
      } else if (p.type === 'B') {
        // BOMB — instant: clear all enemy bullets + 1 damage to every live enemy.
        // Each kill credits score and spawns an explosion so the bomb feels rewarding.
        // Skips combo bump, power-up drops, and per-type achievements — bomb is a panic
        // tool, not a skill kill (those rewards stay tied to player bullets).
        game.stats.bombsUsed = (game.stats.bombsUsed || 0) + 1;
        game.enemyBullets = [];
        game.flashTimer = 12;
        game.flashColor = '#f44';
        game.shakeTimer = 14;
        // BOMB CINEMATIC — large red shockwave from player position spanning the
        // playfield + 8-frame hit-stop so the screen-clear feels weighty. Skipped
        // when player isn't alive (defensive).
        if (game.playerAlive && game.shockwaves) {
          game.shockwaves.push({
            x: game.playerX, y: game.playerY,
            life: 0, maxLife: 28, maxR: 110, color: '#f44'
          });
          // Inner secondary ring for layered look
          game.shockwaves.push({
            x: game.playerX, y: game.playerY,
            life: -4, maxLife: 20, maxR: 60, color: '#fc4'
          });
        }
        game.hitStopFrames = Math.max(game.hitStopFrames || 0, 8);
        // 20 radial gold/red sparks for tactile impact
        for (let k = 0; k < 20; k++) {
          const a = (k / 20) * Math.PI * 2;
          game.itemBursts.push({
            x: game.playerX + Math.cos(a) * 12,
            y: game.playerY + Math.sin(a) * 12,
            life: -k, color: k & 1 ? '#fc4' : '#f44'
          });
        }
        let bombKills = 0;
        const bombKill = (en) => {
          en.hp = (en.hp || 1) - 1;
          if (en.hp <= 0) {
            en.alive = false;
            bombKills++;
            game.stats.kills = (game.stats.kills || 0) + 1;
            addScore(getEnemyPoints(en.type, true));
            game.explosions.push({x: en.x, y: en.y, timer: -bombKills, maxTime: 22});
          }
        };
        for (const en of (game.enemies || []))    if (en.alive) bombKill(en);
        // Mega-boss damage scales with maxHp (~5%, min 3) so a bomb actually feels useful
        // at high stages where bosses have 100+ HP. Clamp to ≥1: bomb is panic relief, not a
        // skill kill — the final blow must come from a bullet to trigger the kill ceremony /
        // bounty / drops. Without the clamp, hp could go negative and the boss would zombie
        // along until the next stray bullet.
        for (const mb of (game.megaBosses || [])) {
          if (!mb.alive) continue;
          const bombDmg = Math.max(3, Math.ceil((mb.maxHp || 1) * 0.05));
          mb.hp = Math.max(1, mb.hp - bombDmg);
          mb.hitFlash = 8;
        }
        if (game.state === STATE.CHALLENGING) {
          const cw = (game.challengeWaves && game.challengeWaves[game.challengeWaveIdx]) || [];
          for (const en of cw) if (en.alive) bombKill(en);
        }
        game.shockwaves.push({ x: BASE_W/2, y: BASE_H/2, life: 0, maxLife: 24, maxR: 90, color });
        game.floatTexts.push({
          x: BASE_W/2, y: BASE_H/2 - 14, text: 'BOMB!',
          color, life: 70, maxLife: 70, size: 14
        });
        if (bombKills > 0) {
          game.floatTexts.push({
            x: BASE_W/2, y: BASE_H/2, text: bombKills + ' KILLS',
            color: '#ff4', life: 70, maxLife: 70, size: 10
          });
        }
        rumble(360, 0.9, 0.6);
      } else if (game.lvl[p.type] < MAX_POWER_LVL[p.type]) {
        game.lvl[p.type]++;
        // PER-TYPE CAP FANFARE — first time this run that S/N/P hits its cap
        // (but the full build isn't complete yet). Surfaces individual mastery.
        if (game.lvl[p.type] === MAX_POWER_LVL[p.type] && !isPowerMaxed()) {
          game._typeMaxedFlags = game._typeMaxedFlags || {};
          if (!game._typeMaxedFlags[p.type]) {
            game._typeMaxedFlags[p.type] = true;
            const _typeLbl = { S: 'SHOT', N: 'NUKE', P: 'PIERCE' }[p.type] || p.type;
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 - 14, text: _typeLbl + ' MAXED',
              color, life: 70, maxLife: 70, size: 10
            });
            game.flashTimer = Math.max(game.flashTimer || 0, 5);
            game.flashColor = color;
            if (typeof spawnConfetti === 'function') spawnConfetti(8);
          }
        }
        if (isPowerMaxed()) {
          unlockAchievement('bigShot');
          playSound('powerMax');
          // MAX POWER REVELATION — first time in this run hitting S5+N3+P3.
          // Big "MAX POWER!" banner + flash + brief invincibility + persistent counter.
          if (!game.maxPowerRevealed) {
            game.maxPowerRevealed = true;
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 - 20, text: 'MAX POWER!',
              color: '#fc4', life: 120, maxLife: 120, size: 16
            });
            game.floatTexts.push({
              x: BASE_W/2, y: BASE_H/2 - 4, text: 'BUILD COMPLETE',
              color: '#fff', life: 120, maxLife: 120, size: 7
            });
            spawnConfetti(20);
            game.flashTimer = Math.max(game.flashTimer || 0, 10);
            game.flashColor = '#fc4';
            game.invincibleTimer = Math.max(game.invincibleTimer || 0, 60);
            rumble(280, 0.9, 0.55);
            try {
              const cur = parseInt(localStorage.getItem('galagaMaxPowerReached') || '0', 10) || 0;
              const nc = cur + 1;
              localStorage.setItem('galagaMaxPowerReached', String(nc));
              if (nc >= 3) unlockAchievement('maxPowerThrice');
            } catch (e) {}
          }
        }
        game.floatTexts.push({
          x: p.x, y: p.y, text: p.type + ' Lv' + game.lvl[p.type],
          color, life: 50, maxLife: 50
        });
        // LEVEL UP RING BURST — celebrate the level-up with a shockwave at the player
        // position + 8 radial sparks in the pickup color. Visual cue makes S/N/P
        // progression feel rewarding beyond the small "Lv2" floatText.
        game.shockwaves.push({
          x: game.playerX, y: game.playerY,
          life: 0, maxLife: 20, maxR: 22, color
        });
        for (let k = 0; k < 8; k++) {
          const a = (k / 8) * Math.PI * 2;
          game.itemBursts.push({
            x: game.playerX + Math.cos(a) * 10,
            y: game.playerY + Math.sin(a) * 10,
            life: -k, color
          });
        }
        // Brief screen-edge color flash via existing weapon callout helper
        if (typeof triggerWeaponCallout === 'function') triggerWeaponCallout(color);
      } else {
        addScore(500);
        game.floatTexts.push({
          x: p.x, y: p.y, text: '+500', color: '#ff4', life: 50, maxLife: 50
        });
      }
      game.itemBursts.push({x: p.x, y: p.y, life: 0, color});
      // POWERUP COLLECT RING — small shockwave at player position so the
      // 'absorbed by ship' moment reads. Symmetric to the spawn burst.
      if (game.shockwaves && game.playerAlive) {
        game.shockwaves.push({
          x: game.playerX, y: game.playerY,
          life: 0, maxLife: 14, maxR: 14, color
        });
      }
      game.powerUps.splice(i, 1);
      game.stagePowerUpsPicked = (game.stagePowerUpsPicked || 0) + 1;
      game.runPowerUps = (game.runPowerUps || 0) + 1;
      // PER-TYPE PICKUP TALLY — feeds GAME_OVER "FAVORITE" highlight.
      if (!game.pickupTypesRun) game.pickupTypesRun = {};
      game.pickupTypesRun[p.type] = (game.pickupTypesRun[p.type] || 0) + 1;
      // POWERUP COUNT MILESTONES — small gold banner at 5/10/20/50 pickups
      if (game.runPowerUps === 5 || game.runPowerUps === 10 || game.runPowerUps === 20 || game.runPowerUps === 50) {
        game.floatTexts.push({
          x: BASE_W/2, y: BASE_H/2 - 24,
          text: 'PICKUPS x' + game.runPowerUps,
          color: '#fc4', life: 60, maxLife: 60, size: 7
        });
        if (typeof playSound === 'function') playSound('tick');
      }
      // PICKUP HISTORY — last 5 drop types as small icon row; FIFO ring buffer
      if (!game.pickupHistory) game.pickupHistory = [];
      game.pickupHistory.unshift(p.type);
      if (game.pickupHistory.length > 5) game.pickupHistory.length = 5;
      if (game.runPowerUps === 30) unlockAchievement('collector');
      // PICKUP TYPE TOTALS — track lifetime collection counts per pickup type
      try {
        const raw = localStorage.getItem('galagaPickupTotals') || '{}';
        const tot = JSON.parse(raw);
        tot[p.type] = (tot[p.type] || 0) + 1;
        localStorage.setItem('galagaPickupTotals', JSON.stringify(tot));
      } catch (e) {}
      // PICKUP STREAK — consecutive pickups without dying. Milestone bonuses at
      // 5/10/15 give modest reward + visual. Resets in killPlayer.
      game.pickupStreak = (game.pickupStreak || 0) + 1;
      if (game.pickupStreak > (game.pickupStreakBest || 0)) game.pickupStreakBest = game.pickupStreak;
      const _streakBonus = game.pickupStreak === 5  ? 200
                         : game.pickupStreak === 10 ? 500
                         : game.pickupStreak === 15 ? 1000
                         : 0;
      if (_streakBonus > 0) {
        addScore(_streakBonus);
        game.floatTexts.push({
          x: BASE_W/2, y: BASE_H/2 - 28,
          text: 'PICKUP STREAK x' + game.pickupStreak + '! +' + _streakBonus,
          color: '#0ff', life: 80, maxLife: 80, size: 8
        });
        playSound('milestone');
      }
      // POWERUP SFX VARIETY — type-specific audio cues so the player can identify
      // a pickup by sound alone, not just color. B/T keep their existing distinct
      // audio; others get reused SFX that match the effect's mood:
      //   R → tick (fast clicky, suits rapid)
      //   W → graze (metallic ping, suits zigzag)
      //   H → milestone (chime, suits homing's tracking feel)
      //   L → extraLife (triumph, marks the rare/strong piercer)
      //   E → comboStep (heavy clunk, suits shield)
      //   S/N/P → powerUp (standard chime)
      if (p.type !== 'B') {
        const sfx = p.type === 'T' ? 'slowTime'
                  : p.type === 'R' ? 'tick'
                  : p.type === 'W' ? 'graze'
                  : p.type === 'H' ? 'milestone'
                  : p.type === 'L' ? 'extraLife'
                  : p.type === 'E' ? 'comboStep'
                  : 'powerUp';
        playSound(sfx);
        if (p.type === 'T' || p.type === 'R' || p.type === 'W' || p.type === 'H') rumble(180, 0.7, 0.35);
        else if (p.type === 'L') rumble(220, 0.8, 0.45);
        else                                                     rumble(60,  0.4, 0.15);
      } else {
        playSound('explode');
      }
    }
  }
}

function updateFloatTexts() {
  for (let i = game.floatTexts.length - 1; i >= 0; i--) {
    const ft = game.floatTexts[i];
    ft.y -= 0.5;
    ft.life--;
    if (ft.life <= 0) game.floatTexts.splice(i, 1);
  }
}

function updateItemBursts() {
  for (let i = game.itemBursts.length - 1; i >= 0; i--) {
    const b = game.itemBursts[i];
    b.life++;
    if (b.life > 24) game.itemBursts.splice(i, 1);
  }
  // Muzzle flashes — 6-frame quick burst at the gun barrel
  if (game.muzzleFlashes) {
    for (let i = game.muzzleFlashes.length - 1; i >= 0; i--) {
      game.muzzleFlashes[i].life++;
      if (game.muzzleFlashes[i].life > 6) game.muzzleFlashes.splice(i, 1);
    }
  }
}

function drawMuzzleFlashes() {
  if (!game.muzzleFlashes) return;
  for (const m of game.muzzleFlashes) {
    const t = m.life;
    const alpha = Math.max(0, 1 - t / 6);
    const _b = m.big ? 1 : 0;
    ctx.save();
    ctx.globalAlpha = alpha * 0.85;
    // Outer halo (bigger when crit-fired)
    ctx.fillStyle = m.color;
    ctx.fillRect(m.x - 3 - _b, m.y - 3 - _b, 7 + _b*2, 6 + _b*2);
    // Inner bright core
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff';
    ctx.fillRect(m.x - 1, m.y - 2, 2, 4 + _b);
    // Vertical streak (1px thin upward smear)
    ctx.fillStyle = m.color;
    ctx.fillRect(m.x, m.y - 6 - _b, 1, 4 + _b);
    ctx.restore();
  }
}

function updateHitSparks() {
  for (let i = game.hitSparks.length - 1; i >= 0; i--) {
    const s = game.hitSparks[i];
    s.life++;
    if (s.life > 12) game.hitSparks.splice(i, 1);
  }
}

function updateToasts() {
  if (!game.toasts) return;
  for (let i = game.toasts.length - 1; i >= 0; i--) {
    game.toasts[i].life++;
    if (game.toasts[i].life >= game.toasts[i].maxLife) game.toasts.splice(i, 1);
  }
}

function drawAchievementToast(t) {
  const a = ACHIEVEMENTS[t.id];
  if (!a) return;
  // Slide-in from right (frames 0-22), hold (22-200), slide-out (200-240)
  let xOff = 0;
  if (t.life < 22) xOff = (1 - t.life / 22) * 110;
  else if (t.life > 200) xOff = ((t.life - 200) / 40) * 110;
  const w = 100, h = 30;
  const tx = BASE_W - w - 4 + xOff;
  const ty = 38;

  // Outer glow (animated, fades during hold)
  const holdT = Math.min(1, Math.max(0, (t.life - 22) / 30));
  const glowAmp = (t.life < 80 ? 1 - t.life / 80 : 0) * 0.5;
  ctx.save();
  ctx.globalAlpha = (0.35 + 0.30 * Math.sin(t.life * 0.3)) * holdT;
  ctx.fillStyle = COL.yellow;
  ctx.fillRect(tx - 2, ty - 2, w + 4, h + 4);
  ctx.restore();

  // Panel background
  ctx.save();
  ctx.fillStyle = 'rgba(0,30,60,0.95)';
  ctx.fillRect(tx, ty, w, h);
  // Animated marquee dashes along top + bottom
  ctx.fillStyle = COL.yellow;
  for (let i = 0; i < w; i += 6) {
    if ((i + t.life * 2) % 12 < 3) {
      ctx.fillRect(tx + i, ty, 3, 1);
      ctx.fillRect(tx + i, ty + h - 1, 3, 1);
    }
  }
  // Side borders
  ctx.fillRect(tx, ty, 1, h);
  ctx.fillRect(tx + w - 1, ty, 1, h);
  // Bigger trophy icon (left side)
  ctx.fillStyle = COL.yellow;
  ctx.fillRect(tx + 6, ty + 8, 8, 6);
  ctx.fillRect(tx + 5, ty + 9, 1, 4);
  ctx.fillRect(tx + 14, ty + 9, 1, 4);
  ctx.fillRect(tx + 7, ty + 14, 6, 1);
  ctx.fillRect(tx + 9, ty + 15, 2, 3);
  ctx.fillRect(tx + 7, ty + 18, 6, 1);
  // Sparkle on trophy
  if ((t.life >> 2) % 2 === 0) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(tx + 8, ty + 9, 1, 1);
  }
  ctx.restore();
  // Banner texts
  drawRetroText('* UNLOCKED *', tx + 60, ty + 8, 6, COL.yellow);
  drawRetroText(a.name, tx + 60, ty + 17, 7, '#fff');
  // Subtext: short desc, only during hold
  if (t.life > 24 && t.life < 200 && a.desc) {
    drawRetroText(a.desc.slice(0, 18), tx + 60, ty + 25, 5, COL.gray);
  }
}

const COMBO_DECAY = 90; // ~1.5s without a kill resets combo

function comboMultiplier(c) {
  // 0-2 kills: 1x, 3-4: 1.25x, 5-9: 1.5x, 10-14: 2x, 15-19: 2.5x, 20+: 3x
  if (c >= 20) return 3;
  if (c >= 15) return 2.5;
  if (c >= 10) return 2;
  if (c >= 5) return 1.5;
  if (c >= 3) return 1.25;
  return 1;
}

const COMBO_MILESTONE = 40; // every N kills in a combo grants a milestone reward (was 20 — life inflation curbed)

// COMBO ARSENAL ladder — each combo threshold auto-grants a temporary weapon for 3 seconds.
// Avoids 30 (already EXTRA SHIP) and the 3/5/10/15/20 multiplier-tier sound triggers.
// Once claimed in a streak the entry is locked until combo resets — prevents farming the
// same milestone by hovering at threshold-1.
const COMBO_ARSENAL = [
  { combo: 25,  buff: 'rapid',  duration: 180, label: 'RAPID UNLOCK!',  color: '#fc4' },
  { combo: 50,  buff: 'wave',   duration: 180, label: 'WAVE UNLOCK!',   color: '#f8a' },
  { combo: 75,  buff: 'homing', duration: 180, label: 'HOMING UNLOCK!', color: '#0ef' },
  { combo: 100, buff: 'laser',  duration: 180, label: 'LASER UNLOCK!',  color: '#fff' }
];

function bumpCombo() {
  game.combo++;
  game.comboTimer = COMBO_DECAY;
  if (game.combo > game.comboBest) game.comboBest = game.combo;
  // MULTIKILL DETECTOR — track kills in this frame via animFrame stamp.
  // Same-frame kills increment counter; at 2+ trigger banner once per surge.
  if (game._mkFrame === game.animFrame) {
    game._mkCount = (game._mkCount || 1) + 1;
    if (game._mkCount === 2 || game._mkCount === 3 || game._mkCount === 5 || game._mkCount === 8) {
      const _mkLabel = game._mkCount >= 8 ? 'OCTOKILL'
                     : game._mkCount >= 5 ? 'OVERKILL'
                     : game._mkCount >= 3 ? 'TRIPLE'
                     : 'DOUBLE';
      const _mkCol = game._mkCount >= 5 ? '#fc4' : '#0ff';
      game.floatTexts.push({
        x: game.playerX, y: game.playerY - 26,
        text: _mkLabel + (game._mkCount >= 5 ? ' x' + game._mkCount : ''),
        color: _mkCol, life: 50, maxLife: 50, size: 8
      });
      if (game._mkCount >= 5 && typeof spawnConfetti === 'function') spawnConfetti(4);
      game.multiKillsRun = (game.multiKillsRun || 0) + 1;
      if (game._mkCount > (game.multiKillBest || 0)) game.multiKillBest = game._mkCount;
    }
  } else {
    game._mkFrame = game.animFrame;
    game._mkCount = 1;
  }
  // COMBO LIFETIME PB — lazily compare against persisted record. Only fire
  // celebration when combo ≥ 10 (avoids triggering on every novice's first 1-9
  // combo). One-shot per run via _comboPbFired flag.
  if (game.combo >= 10 && !game._comboPbFired) {
    try {
      const prevBest = parseInt(localStorage.getItem('galagaMaxComboEver') || '0', 10) || 0;
      if (game.combo > prevBest) {
        game._comboPbFired = true;
        localStorage.setItem('galagaMaxComboEver', String(game.combo));
        game.floatTexts.push({
          x: BASE_W/2, y: BASE_H/2 - 40, text: 'NEW COMBO RECORD!',
          color: '#fc4', life: 100, maxLife: 100, size: 11
        });
        game.floatTexts.push({
          x: BASE_W/2, y: BASE_H/2 - 26, text: 'COMBO ' + game.combo,
          color: '#fff', life: 100, maxLife: 100, size: 7
        });
        playSound('milestone');
        spawnConfetti(10);
        game.flashTimer = Math.max(game.flashTimer || 0, 6);
        game.flashColor = '#fc4';
      }
    } catch (e) {}
  }
  // Track in-memory only; persist to localStorage in batches (every 60 frames)
  // and on game over to avoid hot-loop synchronous I/O thrashing per kill which
  // could cause frame hitches during high combo / laser piercing kill chains.
  if (game._comboPbFired) {
    game._comboPbPending = game.combo;
  }
  // MEGA COMBO FIREWORKS — escalating screen-wide explosion + confetti spectacle
  // at combo 50/75/100. Layered on top of existing arsenal triggers (which fire on
  // the *first* reach via comboArsenalClaimed). Pure visual; no score impact.
  const megaTier = game.combo === 50 ? 1
                 : game.combo === 75 ? 2
                 : game.combo === 100 ? 3 : 0;
  if (megaTier > 0) {
    const burstCount = [10, 15, 25][megaTier - 1];
    for (let k = 0; k < burstCount; k++) {
      const ex = 16 + Math.random() * (BASE_W - 32);
      const ey = 30 + Math.random() * (BASE_H - 80);
      game.explosions.push({
        x: ex, y: ey, timer: -Math.floor(Math.random() * 24), maxTime: 28
      });
    }
    spawnConfetti(megaTier * 14);
    game.flashTimer = Math.max(game.flashTimer, 14);
    game.flashColor = ['#ff4', '#f80', '#f6f'][megaTier - 1];
    game.shakeTimer = Math.min(20, (game.shakeTimer || 0) + 8 + megaTier * 2);
    const label = ['COMBO 50', 'COMBO 75', 'COMBO 100'][megaTier - 1];
    const subtitle = ['SPECTACULAR!', 'MAGNIFICENT!', 'TRANSCENDENT!'][megaTier - 1];
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 - 36, text: label,
      color: game.flashColor, life: 90, maxLife: 90, size: 14
    });
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 - 22, text: subtitle,
      color: '#ff4', life: 90, maxLife: 90, size: 9
    });
    rumble(300 + megaTier * 60, 0.85, 0.5);
  }
  // COMBO ARSENAL — trigger any unlocks now reachable. Using `>=` so a missed exact
  // increment (e.g. trickShot frame skipping value 25 → 26) still pays out.
  for (const a of COMBO_ARSENAL) {
    if (game.combo >= a.combo && !game.comboArsenalClaimed[a.combo]) {
      game.comboArsenalClaimed[a.combo] = true;
      if      (a.buff === 'rapid')  game.rapidTimer  = Math.max(game.rapidTimer  || 0, a.duration);
      else if (a.buff === 'wave')   game.waveTimer   = Math.max(game.waveTimer   || 0, a.duration);
      else if (a.buff === 'homing') game.homingTimer = Math.max(game.homingTimer || 0, a.duration);
      else if (a.buff === 'laser')  game.laserTimer  = Math.max(game.laserTimer  || 0, a.duration);
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 30, text: a.label,
        color: a.color, life: 80, maxLife: 80, size: 12
      });
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 18, text: 'COMBO ' + a.combo,
        color: '#ff4', life: 80, maxLife: 80, size: 8
      });
      game.flashTimer = 8;
      game.flashColor = a.color;
      game.shakeTimer = Math.min(20, (game.shakeTimer || 0) + 6);
      playSound('powerUp');
      rumble(220, 0.7, 0.4);
      spawnConfetti(10);
      triggerWeaponCallout(a.color);
    }
  }
  if (game.combo === 15) unlockAchievement('combo15');
  if (game.combo === 30) {
    unlockAchievement('comboMaster');
    // MAX COMBO TIER FANFARE — first time hitting combo 30 (max multiplier tier
    // x3.0) per run gets a banner + milestone SFX. Once per run via flag.
    if (!game._maxComboTierFired) {
      game._maxComboTierFired = true;
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 30, text: 'MAX MULTIPLIER',
        color: '#fc4', life: 80, maxLife: 80, size: 10
      });
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 18, text: 'x3.0 ACTIVE',
        color: '#fff', life: 70, maxLife: 70, size: 6
      });
      // MAGNET FIELD CALLOUT — combo 30 unlocks the magnet range boost.
      // Surface it so the player knows the reward, not just a multiplier.
      game.floatTexts.push({
        x: BASE_W/2, y: BASE_H/2 - 6, text: '+ MAGNET FIELD',
        color: '#0cf', life: 70, maxLife: 70, size: 5
      });
      if (typeof spawnConfetti === 'function') spawnConfetti(12);
      if (typeof playSound === 'function') playSound('milestone');
      game.flashTimer = Math.max(game.flashTimer || 0, 6);
      game.flashColor = '#fc4';
    }
  }
  if (game.combo === 30 && !game.stageDied) unlockAchievement('killStreak3');
  if (game.combo === 45) unlockAchievement('combo45');
  if (game.combo === 60) unlockAchievement('streakMaster');
  if (game.combo === 75) unlockAchievement('combo75');
  if (game.combo === 80) unlockAchievement('ultraStreak');
  if (game.combo === 100) unlockAchievement('comboGod');
  // Combo step sound at multiplier-tier transitions, escalating haptic + tiny shake.
  // Tiers: c≥3 (1.25×), c≥5 (1.5×), c≥10 (2×), c≥15 (2.5×), c≥20 (3×, max).
  if (game.combo === 3 || game.combo === 5 || game.combo === 10 || game.combo === 15 || game.combo === 20) {
    // Tier-specific SFX: higher tiers get more triumphant cues (tick→step→
    // powerUp→milestone→extraLife). Pure audio escalation, no gameplay impact.
    const _tSfx = game.combo === 3 ? 'tick'
                : game.combo === 5 ? 'comboStep'
                : game.combo === 10 ? 'powerUp'
                : game.combo === 15 ? 'milestone'
                : 'extraLife';
    playSound(_tSfx);
    const strong = Math.min(0.9, 0.3 + game.combo * 0.04);
    rumble(120, strong, strong * 0.5);
    const shakeAdd = game.combo >= 20 ? 8 : game.combo >= 15 ? 6 : game.combo >= 10 ? 4 : 2;
    game.shakeTimer = Math.min(20, (game.shakeTimer || 0) + shakeAdd);
  }
  // Milestone reward: extra ship every COMBO_MILESTONE kills (or +5000 in challenge mode)
  const tier = Math.floor(game.combo / COMBO_MILESTONE);
  if (tier > game.comboMilestoneClaimed) {
    game.comboMilestoneClaimed = tier;
    if (game.challengeMode) {
      // Use addScore so the combo bonus flows through daily-mode multiplier,
      // milestone toasts, SCORE_CAP, and the live NEW-HIGH check.
      addScore(5000);
    } else {
      game.lives++;
      if (game.lives >= 2) game._lastLifeAlertFired = false;
      game.extraShipsRun = (game.extraShipsRun || 0) + 1;
      // LIFE GAIN PULSE — flag for HUD lives row to pulse gold for 30 frames
      game.lifeGainPulseTimer = 30;
    }
    playSound('extraLife');
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2 - 14,
      text: game.challengeMode ? 'COMBO BONUS +5000' : 'EXTRA SHIP!',
      color: '#ff4', life: 90, maxLife: 90, size: 12
    });
    game.floatTexts.push({
      x: BASE_W/2, y: BASE_H/2, text: 'COMBO ' + (tier * COMBO_MILESTONE),
      color: '#0ff', life: 90, maxLife: 90, size: 8
    });
    spawnConfetti(8);
    game.flashTimer = 6;
    game.flashColor = '#ff4';
    rumble(200, 0.5, 0.3);
  }
}

// Reset milestone tracking when combo resets
function resetComboMilestone() {
  game.comboMilestoneClaimed = 0;
  game.comboArsenalClaimed = {};
}

function updateCombo() {
  if (game.overkillCooldown > 0) game.overkillCooldown--;
  if (game.comboTimer > 0) {
    game.comboTimer--;
    if (game.comboTimer <= 0) {
      const lostCount = game.combo;
      const totalPts = game.comboBonusAccum || 0;
      game.combo = 0;
      game.comboBonusAccum = 0;
      game.comboLostFlashTimer = 30; // brief gray score flash
      resetComboMilestone();
      // Feedback scales with how big the combo was
      if (lostCount >= 3) {
        playSound('comboBreak');
        // Bigger combos = more dramatic break
        const big = lostCount >= 10;
        const huge = lostCount >= 20;
        // BIG COMBO LOST CINEMATIC — when a high combo breaks, slap the player
        // with a gray vignette pulse + shake + extended flash so the loss reads
        // visually, not just in the floatText. Higher tiers = more dramatic.
        if (big) {
          game.shakeTimer = Math.min(20, (game.shakeTimer || 0) + (huge ? 12 : 6));
          game.flashTimer = Math.max(game.flashTimer, huge ? 18 : 10);
          game.flashColor = '#666';
          game.comboLostVignette = huge ? 60 : 40;
        }
        game.floatTexts.push({
          x: BASE_W / 2, y: BASE_H / 2 - 8,
          text: huge ? 'BIG COMBO LOST!!' : (big ? 'COMBO BROKEN!' : 'COMBO LOST'),
          color: huge ? '#f44' : (big ? '#f80' : '#888'),
          life: 60, maxLife: 60,
          size: huge ? 14 : (big ? 11 : 8)
        });
        if (totalPts > 0) {
          game.floatTexts.push({
            x: BASE_W / 2, y: BASE_H / 2 + (big ? 14 : 4),
            text: 'EARNED +' + totalPts,
            color: '#ff4', life: 60, maxLife: 60, size: 7
          });
        }
        if (big) {
          game.floatTexts.push({
            x: BASE_W / 2, y: BASE_H / 2 + 6,
            text: '×' + lostCount + ' STREAK ENDED',
            color: '#ccc', life: 50, maxLife: 50, size: 7
          });
          // Cracking ring at last kill site (use player x as proxy)
          for (let k = 0; k < 14; k++) {
            const a = (k / 14) * Math.PI * 2;
            const r = 16 + Math.random() * 10;
            game.itemBursts.push({
              x: game.playerX + Math.cos(a) * r,
              y: game.playerY + Math.sin(a) * r,
              life: -k * 2,
              color: huge ? '#f44' : '#f80'
            });
          }
          game.flashTimer = huge ? 8 : 5;
          game.flashColor = huge ? '#f44' : '#f80';
          game.shakeTimer = Math.max(game.shakeTimer, huge ? 12 : 6);
        }
      }
    }
  }
}

function updatePlayerTrail() {
  if (game.playerAlive) {
    const last = game.playerTrail[0];
    const dashing = (game.dashTimer || 0) > 0;
    // DASH AFTERIMAGE — push a ghost EVERY frame during dash regardless of movement
    // so the trail reads as a clear afterimage, not a sparse one. Tag with `.dash`
    // so the draw layer can render it brighter / cyan.
    const moved = !last || Math.abs(last.x - game.playerX) > 0.5;
    if (dashing || moved) {
      game.playerTrail.unshift({
        x: game.playerX, y: game.playerY,
        age: 0, dual: game.dualFighter,
        dash: dashing
      });
    }
    // ENGINE EXHAUST DUST — stage 70+ atmospheric drift trail behind the ship.
    // Pure visual; tiny gray motes (vy slight) every 4 frames. Suppressed during
    // dash (existing dash trail takes priority).
    if (!dashing && game.stage >= 70 && (game.animFrame & 3) === 0) {
      game.exhaustDust = game.exhaustDust || [];
      game.exhaustDust.push({
        x: game.playerX + (Math.random() * 4 - 2),
        y: game.playerY + 4,
        vy: 0.45 + Math.random() * 0.3,
        life: 0, maxLife: 28 + Math.floor(Math.random() * 10)
      });
      if (game.exhaustDust.length > 24) game.exhaustDust.shift();
    }
  }
  // Tick exhaust dust
  if (game.exhaustDust && game.exhaustDust.length) {
    for (let i = game.exhaustDust.length - 1; i >= 0; i--) {
      const d = game.exhaustDust[i];
      d.life++;
      d.y += d.vy;
      if (d.life >= d.maxLife) game.exhaustDust.splice(i, 1);
    }
  }
  for (const t of game.playerTrail) t.age++;
  // Dash trail allowed to grow longer (8 ghosts vs 4) for richer afterimage
  const cap = game.playerTrail.some(t => t.dash) ? 8 : 4;
  while (game.playerTrail.length > cap) game.playerTrail.pop();
  game.playerTrail = game.playerTrail.filter(t => t.age < 14);
}

// ENGINE EXHAUST DUST — small atmospheric motes drifting behind the ship at
// stage 70+. Drawn before player trail so trail reads on top.
function drawExhaustDust() {
  if (!game.exhaustDust || !game.exhaustDust.length) return;
  ctx.save();
  ctx.fillStyle = '#666';
  for (const d of game.exhaustDust) {
    const ratio = 1 - d.life / d.maxLife;
    ctx.globalAlpha = ratio * 0.5;
    ctx.fillRect(Math.round(d.x), Math.round(d.y), 1, 1);
  }
  ctx.restore();
}
function drawPlayerTrail() {
  // Combo 50+ — rainbow trail cycling through 6 colors
  const rainbow = ['#f44', '#fa0', '#ff4', '#0f8', '#0cf', '#f6f'];
  const useRainbow = (game.combo || 0) >= 50;
  // BIOME-TINTED TRAIL — when a biome is active and player isn't in mega-combo,
  // pick biome color over ship color for trail body ghost. Gives each biome a
  // signature drift trail that fuses ship motion with environment.
  let shipCol = (game.ship && game.ship.color) || '#0cf';
  if (!useRainbow && typeof biomeForStage === 'function') {
    const _bid = biomeForStage(game.stage || 1);
    if (_bid && typeof BIOME_NAMES !== 'undefined' && BIOME_NAMES[_bid]) {
      shipCol = BIOME_NAMES[_bid].col;
    }
  }
  for (let i = game.playerTrail.length - 1; i >= 0; i--) {
    const t = game.playerTrail[i];
    const fade = 1 - t.age / 14;
    ctx.save();
    // DASH afterimage — brighter alpha + bigger ghost (2× wider) + cyan tint
    if (t.dash) {
      ctx.globalAlpha = fade * 0.75;
      ctx.fillStyle = '#0ff';
      if (t.dual) {
        ctx.fillRect(t.x - 10, t.y + 1, 4, 4);
        ctx.fillRect(t.x + 6, t.y + 1, 4, 4);
      } else {
        ctx.fillRect(t.x - 3, t.y - 1, 6, 6);
      }
      // Inner core highlight
      ctx.globalAlpha = fade * 0.95;
      ctx.fillStyle = '#fff';
      if (t.dual) {
        ctx.fillRect(t.x - 9, t.y + 2, 2, 2);
        ctx.fillRect(t.x + 7, t.y + 2, 2, 2);
      } else {
        ctx.fillRect(t.x - 1, t.y, 2, 3);
      }
    } else {
      ctx.globalAlpha = fade * 0.45;
      // Ship body ghost — rainbow cycle when in mega-combo, otherwise loadout color
      ctx.fillStyle = useRainbow
        ? rainbow[(t.age + Math.floor(game.animFrame / 4)) % rainbow.length]
        : shipCol;
      if (t.dual) {
        ctx.fillRect(t.x - 9, t.y + 1, 3, 3);
        ctx.fillRect(t.x + 7, t.y + 1, 3, 3);
      } else {
        ctx.fillRect(t.x - 1, t.y + 1, 3, 3);
      }
      // Engine flame echo
      ctx.fillStyle = '#f80';
      if (t.dual) {
        ctx.fillRect(t.x - 9, t.y + 5, 3, 1);
        ctx.fillRect(t.x + 7, t.y + 5, 3, 1);
      } else {
        ctx.fillRect(t.x - 1, t.y + 5, 3, 1);
      }
    }
    ctx.restore();
  }
}

function updateFormationBreathing() {
  game.breathPhase += 0.02;
  const offX = Math.sin(game.breathPhase) * 3;
  const offY = Math.cos(game.breathPhase * 0.7) * 2;
  let _diveStartCount = 0;
  for (const e of game.enemies) {
    if (e.state === 'formation') {
      e.x = e.homeX + offX;
      e.y = e.homeY + offY;
      // Brief flinch — small jitter when a neighbor was just killed
      if (e.flinch && e.flinch > 0) {
        e.x += (Math.random() - 0.5) * 2;
        e.y += (Math.random() - 0.5) * 2;
        e.flinch--;
      }
      // Pre-dive telegraph countdown — flips to 'diving' when timer hits 0.
      if (e.previewTimer && e.previewTimer > 0) {
        e.previewTimer--;
        if (e.previewTimer <= 0) {
          e.state = 'diving';
          e.diveTimer = 0;
          // DIVE TELEGRAPH FLASH — short red pulse marker over the enemy at the
          // instant it transitions to diving. Helps reading sudden dive starts.
          e.diveFlashTimer = 16;
          // DIVE LAUNCH AFTERIMAGE — push a 25-frame ghost at the home position
          // so the player visually anchors where the diver came from.
          game.diveAfterimages = game.diveAfterimages || [];
          game.diveAfterimages.push({
            x: e.homeX, y: e.homeY, life: 0, maxLife: 25,
            type: e.type, frame: e.frame
          });
          if (game.diveAfterimages.length > 18) game.diveAfterimages.shift();
          e.pathSegments = e.previewPath;
          e.pathSegIndex = 0;
          e.pathProgress = 0;
          e.pathSpeed = 0.012 + game.stage * 0.002;
          e.previewPath = null;
          // DIVE PATH PREVIEW — sample first segment into 14 fading dots so the
          // player can read the dive trajectory before it commits. Stored on the
          // enemy and ticked down each frame in updateEnemies.
          if (e.pathSegments && e.pathSegments[0]) {
